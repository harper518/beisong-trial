  }
  resultsDiv.innerHTML = html;
}
function highlightMatch(text, query) {
  // 高亮所有匹配项（不区分大小写）
  var result = '';
  var lowerText = text.toLowerCase();
  var lowerQuery = query.toLowerCase();
  var pos = 0;
  while (pos < text.length) {
    var idx = lowerText.indexOf(lowerQuery, pos);
    if (idx === -1) {
      result += escapeHtml(text.substring(pos));
      break;
    }
    result += escapeHtml(text.substring(pos, idx));
    result += '<mark style="background:#fef08a;color:#854d0e;padding:0 2px;border-radius:2px">' + escapeHtml(text.substring(idx, idx + query.length)) + '</mark>';
    pos = idx + query.length;
  }
  return result;
}

function moveBankUp(bankId) {
  const banks = Object.values(appData.banks).sort((a, b) => {
    const aOrder = a.order != null ? a.order : a.createdAt;
    const bOrder = b.order != null ? b.order : b.createdAt;
    return aOrder - bOrder;
  });
  const idx = banks.findIndex(b => b.id === bankId);
  if (idx <= 0) return;
  // 交换 order
  const a = banks[idx], b = banks[idx - 1];
  const aOrder = a.order != null ? a.order : a.createdAt;
  const bOrder = b.order != null ? b.order : b.createdAt;
  a.order = bOrder;
  b.order = aOrder;
  saveData(appData);
  renderBanks();
}

function moveBankDown(bankId) {
  const banks = Object.values(appData.banks).sort((a, b) => {
    const aOrder = a.order != null ? a.order : a.createdAt;
    const bOrder = b.order != null ? b.order : b.createdAt;
    return aOrder - bOrder;
  });
  const idx = banks.findIndex(b => b.id === bankId);
  if (idx < 0 || idx >= banks.length - 1) return;
  // 交换 order
  const a = banks[idx], b = banks[idx + 1];
  const aOrder = a.order != null ? a.order : a.createdAt;
  const bOrder = b.order != null ? b.order : b.createdAt;
  a.order = bOrder;
  b.order = aOrder;
  saveData(appData);
  renderBanks();
}

    for (const b of (c.blanks || [])) {
      if (b.start < answerStart) {
        // 题目区挖空
        for (let j = b.start; j < b.end; j++) savedQ[j] = true;
      } else {
        const relStart = b.start - answerStart;
        const relEnd = b.end - answerStart;
        for (let j = relStart; j < relEnd; j++) saved[j] = true;
      }
    }
    return { ...c, _charSelected: {}, _savedChars: saved, _charSelectedQ: {}, _savedCharsQ: savedQ, _autoBlanks: null };
  });
  previewData = { name: bank.name, cards, mode: 'manual', editBankId: id };

function exportBankFull(id) {
  if (!hasFeature('shareFile')) { showToast('免费版不支持导出，请升级版本'); return; }
  const bank = appData.banks[id];
  if (!bank) return;
  // 导出为纯文本，挖空用【】标记
  const lines = [];
  for (const c of bank.cards) {
    const q = c.question.trim();
    const a = c.answer.trim();
    const blanks = (c.blanks || []).filter(b => !b._combined).sort((a, b) => a.start - b.start);
    if (!blanks.length) { lines.push(q + '|' + a); continue; }
    const ft = c.fullText || q + '\n' + a;
    const aStart = q.length + 1;
    let out = '', p = aStart;
    for (const b of blanks) {
      out += ft.substring(p, b.start) + '【' + (b.text || '') + '】';
      p = b.end;
    }
    out += ft.substring(p);
    lines.push(q + '|' + out.substring(aStart));
  }
  showExportModal(bank.name + '（挖空）', lines.join('\n'));
}

function exportBankBlanksHidden(id) {
  if (!hasFeature('shareFile')) { showToast('基础版及以上支持导出，请升级版本'); return; }
  const bank = appData.banks[id];
  if (!bank) return;
  // 导出为纯文本，挖空处用 _ 代替原文
  const lines = [];
  for (const c of bank.cards) {
    const q = c.question.trim();
    const a = c.answer.trim();
    const blanks = (c.blanks || []).filter(b => !b._combined).sort((a, b) => a.start - b.start);
    if (!blanks.length) { lines.push(q + '|' + a); continue; }
    const ft = c.fullText || q + '\n' + a;
    const aStart = q.length + 1;
    let out = '', p = aStart;
    for (const b of blanks) {
      // 根据原文长度生成下划线
      const len = (b.text || '').length;
      let uline;
      if (len <= 2) uline = '___';
      else if (len <= 6) uline = '_____';
      else uline = '_'.repeat(Math.ceil(len * 0.7));
      out += ft.substring(p, b.start) + uline;
      p = b.end;
    }
    out += ft.substring(p);
    lines.push(q + '|' + out.substring(aStart));
  }
  showExportModal(bank.name + '（挖空隐藏）', lines.join('\n'));
}

function closeImportModal() { var m = document.getElementById('importModal'); if (m) m.remove(); }

function toggleSplitImport() {
  var sec = document.getElementById('splitImportSection');
  var arrow = document.getElementById('splitImportArrow');
  if (!sec) return;
  var isOpen = sec.style.display !== 'none';
  sec.style.display = isOpen ? 'none' : 'block';
  if (arrow) {
    arrow.textContent = isOpen ? '▸' : '▾';
    arrow.style.transform = isOpen ? '' : 'rotate(0deg)';
  }
}

function pasteFromTextarea(id) {
  var ta = document.getElementById(id); if (!ta) return;
  navigator.clipboard.readText().then(function(text) {
    if (text) { ta.value = text; showToast('已粘贴（' + text.length + ' 字符）'); }
    else showToast('剪贴板为空');
  }).catch(function() { showToast('无法读取剪贴板，请长按手动粘贴'); });
}

function copyFromTextarea(id) {
  var ta = document.getElementById(id); if (!ta) return;
  var text = ta.value.trim();
  if (!text) { showToast('文本框为空'); return; }
  navigator.clipboard.writeText(text).then(function() { showToast('已复制'); })
    .catch(function() { showToast('复制失败，请手动选择复制'); });
}

function clearTextareaById(id) {
  var ta = document.getElementById(id); if (!ta) return;
  if (!ta.value.trim()) return;
  ta.value = ''; showToast('已清空');
}

// 统一文件导入入口：自动检测格式并分发到对应 handler
async function handleUnifiedFileImport(el) {
  var file = el.files[0]; if (!file) return;
  var name = file.name.toLowerCase();
  var ext = name.substring(name.lastIndexOf('.'));
  // 构造一个类似 input 的临时对象传给各 handler
  var fakeEl = { files: [file], value: '' };
  if (ext === '.docx' || ext === '.doc') {
    handleWordImport(fakeEl);
  } else if (ext === '.pdf') {
    handlePdfImport(fakeEl);
  } else {
    // .txt, .csv, .md 等文本格式
    handleFileImport(fakeEl);
  }
  el.value = '';
}

async function handleFileImport(el) {
  const file = el.files[0]; if (!file) return;
  const text = await file.text();
  $('importTextarea').value = text;
  if (!$('bankNameInput').value) $('bankNameInput').value = file.name.replace(/\.(csv|txt)$/i, '');
  showToast('文件已加载');
  setTimeout(function() { precheckImport(); }, 200);
}

function parseWordHtml(html) {
  // 去掉图片（img/picture/svg/base64图片全部删除）
  html = html.replace(/<img[^>]*\/?>/gi, '');
  html = html.replace(/<picture[\s\S]*?<\/picture>/gi, '');
  html = html.replace(/<svg[\s\S]*?<\/svg>/gi, '');
  // 删除表格（结构多变，自动解析不可靠，直接丢弃）
  html = html.replace(/<table[\s\S]*?<\/table>/gi, '');
  // 加粗/高亮 → 【挖空】——逐个匹配，避免嵌套或多行问题
  html = html.replace(/<(strong|b)\b[^>]*>([\s\S]*?)<\/(strong|b)>/gi, function(_, __, inner) {
    return '【' + inner.replace(/<[^>]*>/g, '').replace(/\s+/g, '') + '】';
  });
  // 结构标签 → 换行
  html = html.replace(/<br\s*\/?>/gi, '\n');
  html = html.replace(/<\/p>/gi, '\n');
  html = html.replace(/<\/div>/gi, '\n');
  html = html.replace(/<\/li>/gi, '\n');
  html = html.replace(/<\/tr>/gi, '\n');
  // 标题 → ## 标记
  html = html.replace(/<\/h[1-6]>/gi, '\n');
  html = html.replace(/<h[1-6][^>]*>/gi, '\n## ');
  // 去掉其余 HTML 标签
  html = html.replace(/<[^>]*>/g, '');
  // 转义字符还原
  html = html.replace(/&nbsp;/gi, ' ');
  html = html.replace(/&lt;/gi, '<');
  html = html.replace(/&gt;/gi, '>');
  html = html.replace(/&amp;/gi, '&');
  html = html.replace(/&quot;/gi, '"');
  html = html.replace(/&#39;/gi, "'");
  // 清理多余空行和行首空白
  html = html.replace(/\n{3,}/g, '\n\n');
  html = html.replace(/^[ \t]+/gm, '');
  return html.trim();
}

async function handleWordImport(el) {
  const file = el.files[0]; if (!file) return;
  // .doc（旧版Word 97-2003）不支持，mammoth.js 只支持 .docx
  if (/\.doc$/i.test(file.name)) {
    showToast('⚠️ 旧版 .doc 格式不支持，请用 Word 或 WPS 打开后"另存为" .docx 格式再上传');
    el.value = '';
    return;
  }
  showToast('⏳ Word 智能解析中...');
  try {
    if (!window.mammoth) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js';
        s.onload = resolve; s.onerror = function() { reject(new Error('CDN load failed')); };
        document.head.appendChild(s);
      });
    }
    var buf = await file.arrayBuffer();
    // 用 convertToHtml 保留加粗等格式信息
    var result = await mammoth.convertToHtml({ arrayBuffer: buf });
    var html = result.value;
    if (!html || !html.trim()) { showToast('Word 文件为空或无法读取'); return; }
    var text = parseWordHtml(html);
    $('importTextarea').value = text;
    if (!$('bankNameInput').value) $('bankNameInput').value = file.name.replace(/\.docx?$/i, '');
    var lineCount = text.split('\n').filter(function(l) { return l.trim(); }).length;
    showToast('Word 已智能解析：加粗→挖空，' + lineCount + ' 行，请检查后导入');
    setTimeout(function() { precheckImport(); }, 200);
  } catch(err) {
    showToast('Word 解析失败：' + err.message);
  }
  el.value = '';
}

async function handlePdfImport(el) {
  var file = el.files[0]; if (!file) return;
  showToast('⏳ PDF 解析中，大文件可能需要十几秒...');
  try {
    // 动态加载 PDF.js
    if (!window.pdfjsLib) {
      await new Promise(function(resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
        s.onload = function() {
          // 设置 worker
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
          resolve();
        };
        s.onerror = function() { reject(new Error('PDF.js CDN 加载失败')); };
        document.head.appendChild(s);
      });
    }
    var buf = await file.arrayBuffer();
    var pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
    var fullText = '';
    for (var i = 1; i <= pdf.numPages; i++) {
      var page = await pdf.getPage(i);
      var content = await page.getTextContent();
      var pageText = content.items.map(function(item) { return item.str; }).join('');
      // 用空格连接被拆开的字符（PDF.js 对中文可能逐字拆分）
      fullText += pageText + '\n';
    }
    if (!fullText.trim()) { showToast('PDF 文件为空或无法提取文字（可能是扫描件/图片型PDF）'); el.value = ''; return; }
    // 文本清洗：合并断行、去页眉页脚类短行、去多余空行
    fullText = cleanPdfText(fullText);
    $('importTextarea').value = fullText;
    if (!$('bankNameInput').value) $('bankNameInput').value = file.name.replace(/\.pdf$/i, '');
    var lineCount = fullText.split('\n').filter(function(l) { return l.trim(); }).length;
    showToast('PDF 已解析：' + lineCount + ' 行，请检查后导入。⚠️ 扫描件/图片型PDF无法提取文字');
    setTimeout(function() { precheckImport(); }, 200);
  } catch(err) {
    showToast('PDF 解析失败：' + err.message);
  }
  el.value = '';
}

// PDF 文本清洗：合并断行、去短行（可能的页眉页脚）、去多余空行
function cleanPdfText(text) {
  // 去除多余空行
  text = text.replace(/\n{4,}/g, '\n\n');
  // PDF 提取常见问题：中文句末换行但没有标点，合并
  // 行末不是标点/符号结尾 → 和下一行合并（PDF断行）
  var lines = text.split('\n');
  var merged = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) { merged.push(''); continue; }
    // 如果上一行不是以标点结尾，且当前行看起来像是被截断的续行，合并到上一行
    if (merged.length > 0 && merged[merged.length - 1] !== '') {
      var prev = merged[merged.length - 1];
      var prevEnd = prev.charAt(prev.length - 1);
      var isPrevEnd = /[。！？；：）」》\.\!\?\;\:\"\'\)\]》（）“”‘’、，—]/.test(prevEnd);
      if (!isPrevEnd) {
        merged[merged.length - 1] = prev + line;
        continue;
      }
    }
    merged.push(line);
  }
  text = merged.join('\n');
  // 去掉有规律的短行（可能的页眉页脚、页码），保留空行占位
  lines = text.split('\n');
  lines = lines.filter(function(l) {
    var t = l.trim();
    if (!t) return true; // 保留空行
    if (t.length === 1 && !/[^\x00-\xff]/.test(t)) return false; // 单英文字母（页眉残留）
    return true;
  });
  text = lines.join('\n');
  // 去首尾空行
  text = text.replace(/^\n+/, '').replace(/\n+$/, '');
  return text;
}
	// ==================== 格式清洗 ====================
		function cleanEmptyLines() {
  var targets = [$("importTextarea"), $("importQuestions"), $("importAnswers")];
  var cleaned = 0;
  targets.forEach(function(ta) {
    if (!ta || !ta.value.trim()) return;
    ta.value = ta.value.split(/\n/).filter(function(l) { return l.trim(); }).join("\n");
    cleaned++;
  });
  showToast(cleaned > 0 ? '空行已删除（' + cleaned + ' 个框）' : '没有可清洗的内容');
}

async function pasteRichText() {
  try {
    var items = await navigator.clipboard.read();
    var found = false;
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      if (item.types.indexOf('text/html') !== -1) {
        var blob = await item.getType('text/html');
        var html = await blob.text();
        if (html && /<(strong|b)\b/i.test(html)) {
          var text = parseWordHtml(html);
          var ta = $('importTextarea');
          ta.value = (ta.value ? ta.value + '\n' : '') + text;
          showToast('✅ 富文本已粘贴，加粗→【挖空】');
          found = true;
          break;
        }
      }
    }
    if (!found) {
      var plainText = await navigator.clipboard.readText();
      if (plainText && plainText.trim()) {
        var ta2 = $('importTextarea');
        ta2.value = (ta2.value ? ta2.value + '\n' : '') + plainText;
        showToast('已粘贴纯文本（未检测到加粗格式）');
        found = true;
      }
    }
    if (!found) showToast('剪贴板为空或无法读取');
  } catch(e) {
    showToast('⚠️ 请直接在输入框内 Ctrl+V 粘贴（自动识别加粗→【挖空】）');
    var ta = $('importTextarea');
    if (ta) { ta.focus(); ta.select(); }
  }
}

function cleanMergeLines() {
  var targets = [$("importTextarea"), $("importQuestions"), $("importAnswers")];
  var cleaned = 0;
  targets.forEach(function(ta) {
    if (!ta || !ta.value.trim()) return;
    ta.value = ta.value.split(/\n/).reduce(function(acc, l) {
      var t = l.trim();
      if (!t) { acc.push(""); return acc; }
      if (acc.length > 0 && acc[acc.length-1] !== "" && !/^\d/.test(t) && !/^[①-⑩]/.test(t) && !/^\(/.test(t) && !/^（/.test(t) && !/^[Q问A答]/.test(t)) {
        acc[acc.length-1] += t;
      } else { acc.push(t); }
      return acc;
    }, []).filter(function(l) { return l !== ""; }).join("\n");
    cleaned++;
  });

function parseMbakText(rawText) {
  const lines = rawText.split(/\n/), cards = [];
  const RE_BLANK = /【([^】]*)】/g;
  for (const line of lines) {
    const t = line.trim(); if (!t) continue;
    // 支持 题目|答案 或 题目|答案|口诀 三段格式
    const parts = t.split('|');
    const qMarked = parts[0].trim();
    const aMarked = (parts[1] || '').trim();
    const koujue = (parts[2] || '').trim();
    const blanks = [];
    var cleanQ = qMarked, cleanA = aMarked;

    // 解析题目中的【】挖空（位置从0开始，不加偏移）
    if (qMarked.includes('【')) {
      RE_BLANK.lastIndex = 0;
      var qClean = '', qp = 0, qm;
      while ((qm = RE_BLANK.exec(qMarked)) !== null) {
        qClean += qMarked.substring(qp, qm.index);
        var qs = qClean.length;
        qClean += qm[1];
        blanks.push({ start: qs, end: qs + qm[1].length, text: qm[1], isAnswer: false });
        qp = qm.index + qm[0].length;
      }
      qClean += qMarked.substring(qp);
      cleanQ = qClean;
    }

    // 解析答案中的【】挖空（位置以答案内偏移计算，稍后加 answerStart）
    if (aMarked && aMarked.includes('【')) {
      RE_BLANK.lastIndex = 0;
      var aClean = '', ap = 0, am;
      while ((am = RE_BLANK.exec(aMarked)) !== null) {
        aClean += aMarked.substring(ap, am.index);
        var as = aClean.length;
        aClean += am[1];
        blanks.push({ start: as, end: as + am[1].length, text: am[1], isAnswer: true });
        ap = am.index + am[0].length;
      }
      aClean += aMarked.substring(ap);
      cleanA = aClean;
    }

    // 无挖空且无答案 → 跳过
    if (!blanks.length && !cleanA) { cards.push({ question: cleanQ, answer: '', koujue: koujue || undefined }); continue; }

    // 答案空白位置矫正：加上题目长度+1的偏移（fullText = q + '\n' + a）
    var answerStart = cleanQ.length + 1;
    for (var bi = 0; bi < blanks.length; bi++) {
      if (blanks[bi].isAnswer !== false) {
        blanks[bi].start += answerStart;
        blanks[bi].end += answerStart;
      }
    }
    cards.push({ question: cleanQ, answer: cleanA, blanks: blanks, koujue: koujue || undefined, fullText: cleanQ + '\n' + cleanA, _manualBlanks: blanks.length ? true : undefined });
  }
  return cards;
}

function precheckImport() {
  var raw = $('importTextarea').value.trim();
  if (!raw) { showToast('请先粘贴或上传内容'); return; }
  raw = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  raw = raw.replace(/\\n/g, '\n');

  // 格式检测（与 doImport 自动检测一致）
  var format = _importFormat || 'auto';
  var cards = [], detectedFmt = '';

  if (format === 'jianda') { cards = parseJianDaText(raw); detectedFmt = '📝 简答题'; }
  else if (format === 'sep') { cards = parseImportText(raw); detectedFmt = '📋 分隔符'; }
  else if (format === 'qa') { cards = parseQAText(raw); detectedFmt = '❓ Q&A'; }
  else if (format === 'hashpct') { cards = parseHashPctText(raw); detectedFmt = '#%'; }
  else {
    // 自动检测
    var lines = raw.split(/\n/).filter(function(l) { return l.trim(); });
    var sepLines = 0;
    for (var li = 0; li < lines.length; li++) {
      var l = lines[li];
      if (l.includes('——') || l.includes('→') || l.includes(' - ') || l.includes('=') || l.includes('：') || l.includes('|') || l.includes(':') || l.includes('~') || l.includes('\t')) sepLines++;
    }
    var sepRatio = sepLines / Math.max(lines.length, 1);

    if (raw.trim().startsWith('{')) {
      try { var data = JSON.parse(raw); if (data._format === 'mbak' && data.cards && data.cards.length) { cards = data.cards; detectedFmt = '💾 含挖空备份'; } else { cards = []; } }
      catch(e) { cards = parseImportText(raw); detectedFmt = '📋 分隔符（fallback）'; }
    } else if (raw.includes('【') && raw.includes('】') && raw.includes('|')) {
      cards = parseMbakText(raw); detectedFmt = '💾 含挖空文本';
    } else if (sepRatio > 0.6) {
      cards = parseImportText(raw); detectedFmt = '📋 分隔符';
    } else if (isJianDaFormat(raw)) {
      cards = parseJianDaText(raw); detectedFmt = '📝 简答题';
    } else if (isQAFormat(raw)) {
      cards = parseQAText(raw); detectedFmt = '❓ Q&A';
    } else if (isHashPctFormat(raw)) {
      cards = parseHashPctText(raw); detectedFmt = '#%';
    } else {
      cards = parseImportText(raw); detectedFmt = '📋 分隔符（默认）';
    }
  }

  // 统计
  var answerLineCounts = cards.map(function(c) { return (c.answer || '').split('\n').filter(function(l) { return l.trim(); }).length; });
  var totalAnswerLines = answerLineCounts.reduce(function(a, b) { return a + b; }, 0);
  var avgAnswerLines = cards.length ? (totalAnswerLines / cards.length).toFixed(1) : '0';
  var cardsWithEmpty = cards.filter(function(c) { return !(c.answer || '').trim(); }).length;
  var cardsWithKj = cards.filter(function(c) { return !!c.koujue; }).length;

  // 渲染统计栏
  var statsEl = document.getElementById('importStats');
  if (!statsEl) return;
  statsEl.style.display = '';
  var h = '<div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px">';
  h += '<span>🔍 识别：<b>' + detectedFmt + '</b></span>';
  h += '<span>📦 <b>' + cards.length + ' 题</b></span>';
  h += '<span>📝 <b>' + totalAnswerLines + '</b> 个要点</span>';
  h += '<span>📐 均 <b>' + avgAnswerLines + '</b> 行/题</span>';
  h += '<span>💡 <b>' + cardsWithKj + '</b> 题有口诀</span>';
  h += '<span>📄 <b>' + raw.length + '</b> 字</span>';
  h += '</div>';

  var warnings = [];
  if (cards.length === 0) {
    warnings.push('<span style="color:var(--danger)">❌ 未解析出题目，请检查格式</span>');
  } else if (cards.length <= 2 && raw.length > 500) {
    warnings.push('<span style="color:var(--danger)">⚠️ 原文' + raw.length + '字仅解析出' + cards.length + '题，格式可能不匹配</span>');
  }
  if (cards.length > 0 && cardsWithEmpty > cards.length * 0.5) {
    warnings.push('<span style="color:var(--warning)">⚠️ ' + cardsWithEmpty + '/' + cards.length + ' 题答案为空</span>');
  }
  if (warnings.length) {
    h += '<div style="margin-top:4px">' + warnings.join(' &nbsp;') + '</div>';
  }
  statsEl.innerHTML = h;
  showToast('预检完成：' + cards.length + '题 · ' + detectedFmt);
}

function doImport() {
  const name = $('bankNameInput').value.trim();
  var raw = $('importTextarea').value.trim();
  // 统一换行符：\r\n → \n，\r → \n，然后字面量 \n → 真正换行
  raw = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  raw = raw.replace(/\\n/g, '\n');
  if (!name) { showToast('请输入题库名称'); return; }
  var qSplitCheck = ($('importQuestions')?.value || '').trim().replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\\n/g, '\n');
  var aSplitCheck = ($('importAnswers')?.value || '').trim().replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\\n/g, '\n');
  if (!raw && !(qSplitCheck && aSplitCheck)) { showToast('请粘贴题目或上传文件'); return; }

  var format = _importFormat || 'auto';
  let cards, hasBlanks = false;

  if (format === 'sep') {
    cards = parseImportText(raw);
  } else if (format === 'jianda') {
    cards = parseJianDaText(raw);
  } else if (format === 'qa') {
    cards = parseQAText(raw);
  } else if (format === 'hashpct') {
    cards = parseHashPctText(raw);
  } else {
    // 自动检测
    const lines = raw.split(/\n/).filter(l => l.trim());
    const sepRe = /[：:→=——\|～~\t]| - /;
    let sepLines = 0;
    for (const l of lines) {
      for (const s of ['——','→',' - ','=','：','|',':','~','\t']) { if (l.includes(s)) { sepLines++; break; } }
    }
    const sepRatio = sepLines / Math.max(lines.length, 1);

    if (raw.trim().startsWith('{')) { try {
      const data = JSON.parse(raw);
      if (data._format === 'mbak' && data.cards && data.cards.length) {
        cards = data.cards; if (data.name) name = data.name;
        hasBlanks = true; showToast('导入含挖空备份');
      } else { cards = []; }
    } catch(e) { cards = parseImportText(raw); } }
    else if (raw.includes('【') && raw.includes('】') && raw.includes('|')) {
      cards = parseMbakText(raw); hasBlanks = true; showToast('导入含挖空文本');
    }
    else if (sepRatio > 0.6) { cards = parseImportText(raw); showToast('分隔符格式'); }
    else if (isJianDaFormat(raw)) { cards = parseJianDaText(raw); showToast('简答题格式'); }
    else if (isQAFormat(raw)) { cards = parseQAText(raw); showToast('Q&A 格式'); }
    else if (isHashPctFormat(raw)) { cards = parseHashPctText(raw); showToast('#%格式'); }
    else { cards = parseImportText(raw); }
  }

  // 分开导入：题目和答案分别粘贴
  var qSplit = ($('importQuestions')?.value || '').trim();
  var aSplit = ($('importAnswers')?.value || '').trim();
  if (qSplit && aSplit) {
    qSplit = qSplit.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\\n/g, '\n');
    aSplit = aSplit.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\\n/g, '\n');
    var qLines = qSplit.split(/\n/).filter(function(l) { return l.trim(); });
    var aLines = aSplit.split(/\n/).filter(function(l) { return l.trim(); });
    var minLen = Math.min(qLines.length, aLines.length);
    var splitCards = [];
    for (var si = 0; si < minLen; si++) {
      var sq = qLines[si].replace(/^[\d\.\、\s]+/, '').trim();
      var sa = aLines[si].trim();
      if (sq && sa) splitCards.push({ question: sq, answer: sa });
    }
    if (splitCards.length) {
      cards = cards.concat(splitCards);
      if (splitCards.length < qLines.length || splitCards.length < aLines.length) {
        showToast('分开导入：配对 ' + splitCards.length + ' 题（题目' + qLines.length + '行/答案' + aLines.length + '行，取较少者）');
      }
    }
  }

  if (!cards.length) { showToast('未能解析题目，请检查格式'); return; }

  // 诊断统计（持久显示在预览中）
  var answerLineCounts = cards.map(function(c) { return (c.answer || '').split('\n').filter(function(l) { return l.trim(); }).length; });
  var totalAnswerLines = answerLineCounts.reduce(function(a, b) { return a + b; }, 0);
  var avgAnswerLines = (totalAnswerLines / cards.length).toFixed(1);
  var cardsWithEmptyAnswer = cards.filter(function(c) { return !(c.answer || '').trim(); }).length;
  var fmtLabel = format === 'auto' ? '🤖 自动检测' : (format === 'jianda' ? '📝 简答题' : (format === 'sep' ? '📋 分隔符' : (format === 'qa' ? '❓ Q&A' : format)));
  var importStats = {
    format: fmtLabel,
    totalCards: cards.length,
    avgAnswerLines: avgAnswerLines,
    totalAnswerLines: totalAnswerLines,
    cardsWithEmptyAnswer: cardsWithEmptyAnswer,
    rawLength: raw.length,
    firstAnswerLines: answerLineCounts[0] || 0,
    firstAnswerLength: (cards[0].answer || '').length
  };
  console.log('[导入诊断]', JSON.stringify(importStats));

  cards = cards.map(c => {
    c.question = (c.question || '').trim();
    c.answer = (c.answer || '').trim();
    const ft = c.question + '\n' + c.answer;
    return { ...c, id: generateId(), fullText: ft,
      wrongCount: c.wrongCount || 0, correctCount: c.correctCount || 0,
      lastPracticed: c.lastPracticed || null, starred: c.starred || false,
      _charSelected: {}, _savedChars: {}, _charSelectedQ: {}, _savedCharsQ: {},
      blanks: hasBlanks ? (c.blanks || []) : [] };
  });

  closeImportModal();
  showImportPreview(name, cards, importStats);
}

      <button class="btn btn-sm btn-ghost" onclick="jumpToProblemCard(1)" style="padding:4px 8px;font-size:11px" title="下一个问题">⬇</button>
    </div>
    <div id="previewCards"></div>
    <div id="previewPageNavBottom" style="margin-top:10px"></div>
    </div>
    <div class="flex gap-10" style="padding:14px 0 0;flex-shrink:0">
    <button class="btn btn-ghost flex-1" onclick="closePreviewModal()">取消</button>
    <button class="btn btn-primary flex-1" onclick="confirmImport()">确认导入 (${cards.length} 题)</button>
    </div></div>`;
  ov.innerHTML = html;
  document.body.appendChild(ov);
  renderPreviewCards();
  // 固定保存按钮（屏幕中间偏左）
  const saveBtn = document.createElement('button');
  saveBtn.id = 'floatingSaveBtn';
  saveBtn.textContent = '💾';
  saveBtn.title = '保存选中（回车）';
  saveBtn.onclick = () => {
    if (!previewData || previewData.mode !== 'manual') return;
    const idx = previewData._activeIdx;
    if (idx == null) return;
    const sel = previewData.cards[idx]._charSelected || {};
    if (Object.values(sel).some(v => v)) saveCardSelection(idx);
  };
  saveBtn.style.cssText = 'position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:9999;font-size:28px;padding:8px;min-height:auto;background:transparent;border:none;opacity:.15;cursor:pointer;line-height:1;transition:opacity .2s';
  saveBtn.onmouseenter = () => { saveBtn.style.opacity = '.5'; };
  saveBtn.onmouseleave = () => { saveBtn.style.opacity = '.15'; };
  ov.appendChild(saveBtn);
}

function switchPreviewMode(mode, el) {
  previewData.mode = mode;
  document.querySelectorAll('#previewModeChips .chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('previewModeHint').textContent = mode === 'manual'
    ? '👆 点击答案中的字选中挖空，连续的字自动合并。保存后可继续第二轮挖空。'
    : '🤖 系统按得分点自动挖空，可点击标签取消/恢复。';
  var clearBtn = document.getElementById('clearAllAutoBtn');
  if (clearBtn) clearBtn.style.display = mode === 'auto' ? '' : 'none';
  if (mode === 'auto') {
    // 为每道题生成自动挖空（已有手动挖空的直接用，不再自动生成覆盖）
    previewData.cards.forEach(c => {
      if (!c._autoBlanks) {
        if (c.blanks && c.blanks.length > 0) {
          // 已有手动挖空（【】标记导入或手动选择）→ 直接用
          c._autoBlanks = c.blanks.filter(function(b) { return !b._combined; }).map(function(b) { return { start: b.start, end: b.end, text: b.text, isAnswer: b.isAnswer, _removed: false }; });
          if (!c.fullText) c.fullText = (c.question || '').trim() + '\n' + (c.answer || '').trim();
        } else {
          const auto = autoGenerateBlanks([{ question: c.question, answer: c.answer }], appData.settings.density || 'low')[0];
          c._autoBlanks = auto.blanks.map(function(b) { return { start: b.start, end: b.end, text: b.text, isAnswer: b.isAnswer, _removed: false }; });
          c.fullText = auto.fullText;
        }
      }
    });
  }
  renderPreviewCards();
}

function renderPreviewCards() {
  var container = document.getElementById('previewCards');
  var cards = previewData.cards;
  var mode = previewData.mode;
  var pageSize = 20;
  var totalPages = Math.ceil(cards.length / pageSize);
  if (_previewPage == null || _previewPage >= totalPages) _previewPage = 0;
  var page = _previewPage;
  var startIdx = page * pageSize;
  var endIdx = Math.min(startIdx + pageSize, cards.length);

  // 统计全部卡片的问题
  var allProblems = []; // {idx, status, label, question}
  var statusCounts = { empty: 0, short: 0, noBlanks: 0 };
  for (var pi = 0; pi < cards.length; pi++) {
    var st = getCardStatus(cards[pi], mode);
    if (st !== 'ok') {
      statusCounts[st] = (statusCounts[st] || 0) + 1;
      var labels = { empty: '🔴 答案为空', short: '🟡 答案偏短', noBlanks: '⚠️ 未挖空' };
      allProblems.push({ idx: pi, status: st, label: labels[st] || st, question: cards[pi].question });
    }
  }

  // 渲染跳过摘要
  var summaryEl = document.getElementById('skipSummary');

      var summaryHtml = '<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleSkipSummary()">' +
        '<span style="font-weight:600;color:var(--warning);font-size:13px">⚠️ ' + allProblems.length + ' 张卡片需要注意</span>' +

        '</div>';
      if (_skipSummaryOpen) {
        summaryHtml += '<div style="margin-top:8px;max-height:180px;overflow-y:auto">';
        var groups = [
          { key: 'empty', label: '🔴 答案为空', items: [] },
          { key: 'short', label: '🟡 答案偏短', items: [] },
          { key: 'noBlanks', label: '⚠️ 未设置挖空', items: [] }
        ];
        for (var gi = 0; gi < allProblems.length; gi++) {
          var p = allProblems[gi];
          for (var gj = 0; gj < groups.length; gj++) {

  // 渲染分页导航

      pageNavHtml += '<button class="btn btn-sm" onclick="goToPreviewPage(' + pn + ')" style="font-size:11px;padding:4px 8px;min-height:28px;' + activeStyle + '">' + ps + '-' + pe + '</button>';
    }
    pageNavHtml += '</div>';
  }
  var navTop = document.getElementById('previewPageNavTop');
  var navBottom = document.getElementById('previewPageNavBottom');
  if (navTop) navTop.innerHTML = pageNavHtml;
  if (navBottom) navBottom.innerHTML = pageNavHtml;

          '<div class="text-sm mb-6" style="color:var(--text-tertiary);font-size:11px">📝 答案' + (card.answer||'').split('\n').filter(function(l){return l.trim();}).length + '行 · ' + (card.answer||'').length + '字</div>' +
        '</div>' +

      '</div>' +
      (card._editing ? '<div id="editPanel-' + i + '" style="background:var(--bg);border:2px solid var(--primary);border-radius:10px;padding:12px;margin-bottom:10px">' +
        '<label style="font-size:12px;color:var(--text-secondary)">题目</label>' +
        '<textarea id="editPQ-' + i + '" style="width:100%;min-height:50px;padding:8px;border:2px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text);font-size:13px;resize:vertical;margin-bottom:8px;font-family:inherit;line-height:1.6" rows="2">' + escapeHtml(card.question) + '</textarea>' +
        '<label style="font-size:12px;color:var(--text-secondary)">答案</label>' +
        '<textarea id="editPA-' + i + '" style="width:100%;min-height:60px;padding:8px;border:2px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text);font-size:13px;resize:vertical;margin-bottom:8px;font-family:inherit;line-height:1.6" rows="2">' + escapeHtml(card.answer) + '</textarea>' +
        '<label style="font-size:12px;color:var(--text-secondary)">💡 口诀（可选）</label>' +
        '<input id="editPKj-' + i + '" value="' + escapeHtml(card.koujue || '') + '" placeholder="例如：全（全民化）民（民主化）" style="width:100%;padding:8px;border:2px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text);font-size:13px;margin-bottom:10px;font-family:inherit">' +
        '<div class="flex gap-8" style="justify-content:flex-end">' +
          '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();deletePreviewCard(' + i + ')" style="color:var(--danger);margin-right:auto">🗑️ 删除此题</button>' +
          (card._undoSnapshot ? '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();undoCardEdit(' + i + ')" style="color:var(--warning)">↩️ 撤回编辑</button>' : '') +
          '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();cancelEditPreviewCard(' + i + ')">取消</button>' +
          '<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();saveEditPreviewCard(' + i + ')">💾 保存</button>' +
        '</div>' +
      '</div>' : '');

    if (mode === 'manual') {
      html += '<div style="position:relative"><div class="preview-answer" id="pv-answer-' + i + '">' + renderAnswerChars(card, i) + '</div><button class="btn btn-sm" onclick="saveCardSelection(' + i + ')" style="position:absolute;left:-8px;top:50%;transform:translate(-100%,-50%);opacity:.35;font-size:18px;padding:4px 6px;min-height:auto;background:transparent;border:none;cursor:pointer;line-height:1" title="保存选中（回车）">💾</button></div>' +
        '<div style="margin-top:6px" id="pv-info-' + i + '">' + renderSavedInfo(card, i) + '</div>' +
        '<div class="flex gap-6 mt-6">' +
          '<button class="btn btn-sm btn-ghost" onclick="saveCardSelection(' + i + ')" style="font-size:12px;padding:4px 10px;min-height:28px">💾 保存选中</button>' +
          (card._undoSnapshot ? '<button class="btn btn-sm btn-ghost" onclick="undoCardEdit(' + i + ')" style="font-size:12px;padding:4px 10px;min-height:28px;color:var(--warning)">↩️ 撤回</button>' : '') +
          '<button class="btn btn-sm btn-ghost" onclick="clearCardSelection(' + i + ')" style="font-size:12px;padding:4px 10px;min-height:28px">🔄 清除全部</button>' +
        '</div>';
    } else {
      var autoBlanks = card._autoBlanks || [];
      html += '<div class="preview-text" id="pv-auto-text-' + i + '">' + renderAutoPreview(card) + '</div>' +
        '<div class="text-sm text-secondary mt-8" id="pv-auto-tags-' + i + '">' + renderAutoTags(card, i) + '</div>';
    }

    html += '</div>';
  }
  container.innerHTML = html;

  // 更新问题计数
  var problemCount = allProblems.length;
  var pcEl = document.getElementById('problemCount');
  if (pcEl) {
    if (problemCount > 0) {
      pcEl.textContent = '⚠️ ' + problemCount + ' 个问题';
      pcEl.style.color = 'var(--warning)';
      pcEl.style.fontWeight = '600';

var _previewPage = 0;
var _skipSummaryOpen = false;
var _lastProblemIdx = -1;

function toggleSkipSummary() {
  _skipSummaryOpen = !_skipSummaryOpen;
  renderPreviewCards();
}

function goToPreviewPage(n) {
  _previewPage = n;
  renderPreviewCards();
  var container = document.getElementById('previewCards');
  if (container) container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function jumpToCardPage(idx) {
  var pageSize = 20;
  var page = Math.floor(idx / pageSize);
  _previewPage = page;
  _lastProblemIdx = idx;
  _skipSummaryOpen = true; // 展开摘要方便查看
  renderPreviewCards();
  setTimeout(function() {
    var el = document.getElementById('previewCard-' + idx);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.boxShadow = '0 0 0 3px var(--primary)';
      setTimeout(function() { el.style.boxShadow = ''; }, 2000);
    }
  }, 150);
}

let _wasDragging = false, _touchJustHappened = 0;
var MERGE_MARKER = '​'; // 零宽空格，作为换行合并标记（1:1替换\n）
function renderAnswerChars(card, idx) {
  const q = card.question || '';
  const a = card.answer || '';
  if (!q && !a) return '<span style="color:var(--text-tertiary)">（无内容）</span>';
  const selQ = card._charSelectedQ || {};
  const savedQ = card._savedCharsQ || {};
  const selA = card._charSelected || {};
  const savedA = card._savedChars || {};
  var h = '<div class="preview-answer-inner" style="touch-action:pan-y;user-select:none;-webkit-user-select:none"' +
    ' ontouchstart="swipeSelectStart(event,' + idx + ')"' +
    ' ontouchmove="swipeSelectMove(event,' + idx + ')"' +
    ' ontouchend="swipeSelectEnd(' + idx + ')"' +
    ' onmousedown="mouseSelectStart(event,' + idx + ')"' +
    ' onmousemove="mouseSelectMove(event,' + idx + ')"' +
    ' onmouseup="mouseSelectEnd(' + idx + ')"' +
    ' onmouseleave="mouseSelectEnd(' + idx + ')">';

  // ---- 题目区 ----
  if (q) {
    h += '<div style="font-size:11px;color:var(--text-tertiary);margin:2px 0 4px;font-weight:600">📌 题目</div>';
    h += renderCharGrid(q, selQ, savedQ, idx, 'q');
    h += '<div style="font-size:11px;color:var(--text-tertiary);margin:8px 0 4px;font-weight:600">── 答案 ──</div>';
  }

  // ---- 答案区 ----
  if (!a) {
    h += '<span style="color:var(--text-tertiary)">（无答案）</span>';
  } else {
    h += renderCharGrid(a, selA, savedA, idx, 'a');
  }
  h += '</div>';
  return h;
}

function renderCharGrid(text, sel, saved, idx, section) {
  var h = '';
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (ch === '\\' && text[i+1] === 'n') { h += '<span class="newline-marker" data-nli="' + i + '" data-section="' + section + '" onclick="event.stopPropagation();mergeLineAt(' + idx + ',' + i + ',\'' + section + '\')" title="点击合并上下行">↵</span>'; i++; continue; }
    if (ch === '\n') { h += '<span class="newline-marker" data-nli="' + i + '" data-section="' + section + '" onclick="event.stopPropagation();mergeLineAt(' + idx + ',' + i + ',\'' + section + '\')" title="点击合并上下行">↵</span>'; continue; }
    if (ch === '​') { h += '<span class="merge-undo-dot" data-mgi="' + i + '" data-section="' + section + '" onclick="event.stopPropagation();unmergeLineAt(' + idx + ',' + i + ',\'' + section + '\')" title="点击恢复换行">↩</span>'; continue; }
    if (/\s/.test(ch)) { h += ' '; continue; }
    if (saved[i]) {
      var cls = sel[i] ? 'char-sel saved' : 'saved';
      h += '<span class="preview-char ' + cls + '" data-ci="' + i + '" data-section="' + section + '" onclick="if(!_wasDragging&&Date.now()-_touchJustHappened>400)toggleImportChar(' + idx + ',' + i + ',\'' + section + '\')" style="background:var(--blank-bg);border-bottom:2px solid var(--blank-border);border-radius:2px">' + escapeHtml(ch) + '</span>';
    } else if (sel[i]) {
      h += '<span class="preview-char char-sel" data-ci="' + i + '" data-section="' + section + '" onclick="if(!_wasDragging&&Date.now()-_touchJustHappened>400)toggleImportChar(' + idx + ',' + i + ',\'' + section + '\')">' + escapeHtml(ch) + '</span>';
    } else {
      h += '<span class="preview-char" data-ci="' + i + '" data-section="' + section + '" onclick="if(!_wasDragging&&Date.now()-_touchJustHappened>400)toggleImportChar(' + idx + ',' + i + ',\'' + section + '\')">' + escapeHtml(ch) + '</span>';
    }
  }
  return h;
}

// 合并换行：将 \\n 或 \n 替换为零宽空格标记
function mergeLineAt(idx, pos, section) {
  var card = previewData.cards[idx];
  if (!card) return;
  section = section || 'a';
  var text = section === 'q' ? (card.question || '') : (card.answer || '');
  if (pos < 0 || pos >= text.length) return;
  var ch = text[pos];
  // 处理 \\n 双字符（字面量反斜杠n）和 \n 真正换行
  if (ch === '\\' && text[pos + 1] === 'n') {
    // 2字符 → 1字符 MERGE_MARKER，需要调整后续索引
    var newText = text.substring(0, pos) + MERGE_MARKER + text.substring(pos + 2);
    shiftCharKeys(card, pos + 1, -1, section);
    if (section === 'q') card.question = newText; else card.answer = newText;
  } else if (ch === '\n') {
    // 1字符 → 1字符 MERGE_MARKER，无需调整索引
    if (section === 'q') card.question = text.substring(0, pos) + MERGE_MARKER + text.substring(pos + 1);
    else card.answer = text.substring(0, pos) + MERGE_MARKER + text.substring(pos + 1);
  } else {
    return; // 不是换行符
  }
  if (!card._undoSnapshot) saveUndoSnapshot(card);
  card.fullText = (card.question || '') + '\n' + (card.answer || '');
  document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
}

// 恢复换行：将零宽空格标记还原为 \n
function unmergeLineAt(idx, pos, section) {
  var card = previewData.cards[idx];
  if (!card) return;
  section = section || 'a';
  var text = section === 'q' ? (card.question || '') : (card.answer || '');
  if (pos < 0 || pos >= text.length || text[pos] !== MERGE_MARKER) return;
  // 1字符 → 1字符，无需调整索引
  if (section === 'q') card.question = text.substring(0, pos) + '\n' + text.substring(pos + 1);
  else card.answer = text.substring(0, pos) + '\n' + text.substring(pos + 1);
  if (!card._undoSnapshot) saveUndoSnapshot(card);
  card.fullText = (card.question || '') + '\n' + (card.answer || '');
  document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
}

// 字符删除后调整 _charSelected 和 _savedChars 索引
function shiftCharKeys(card, fromIdx, delta, section) {
  section = section || 'a';
  var selKey = section === 'q' ? '_charSelectedQ' : '_charSelected';
  var savedKey = section === 'q' ? '_savedCharsQ' : '_savedChars';
  [selKey, savedKey].forEach(function(key) {
    var obj = card[key] || {};
    var newObj = {};
    Object.keys(obj).forEach(function(k) {
      var ki = parseInt(k);
      if (ki < fromIdx) newObj[k] = obj[k];
      else if (ki + delta < fromIdx) {} // 被删除的位置，丢弃
      else newObj[ki + delta] = obj[k];
    });
    card[key] = newObj;
  });
}

// 滑动选择
let swipeSelectMode = null;
let swipeStartX = 0, swipeStartY = 0, _lastTouchX = 0, _lastTouchY = 0;
function swipeSelectStart(e, idx) {
  _touchJustHappened = Date.now();
  swipeStartX = _lastTouchX = e.touches[0].clientX;
  swipeStartY = _lastTouchY = e.touches[0].clientY;
  swipeSelectMode = null;
  const card = previewData.cards[idx];
  const el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
  const ci = (el && el.dataset ? el.dataset.ci : undefined);
  const section = (el && el.dataset ? el.dataset.section : 'a') || 'a';
  if (ci == null) return;
  const charIdx = parseInt(ci);
  var savedKey = section === 'q' ? '_savedCharsQ' : '_savedChars';
  var selKey = section === 'q' ? '_charSelectedQ' : '_charSelected';
  const isSaved = card[savedKey] && card[savedKey][charIdx];
  if (isSaved) toggleImportChar(idx, charIdx, section);
  // 暂不启动选择模式，等 move 判断方向
  swipeSelectMode = { idx: idx, section: section, adding: isSaved ? false : !(card[selKey] || {})[charIdx], removing: isSaved, started: false };
}

function swipeSelectMove(e, idx) {

// 鼠标选择（桌面端）：mousedown 即时响应，拖动连续选中

function toggleImportChar(idx, charIdx, section) {

      var relStart, relEnd;

        relStart = b.start;
        relEnd = b.end;
      } else {
        relStart = b.start - answerStart;
        relEnd = b.end - answerStart;
      }
      return !(charIdx >= relStart && charIdx < relEnd);
    });

    if (!card.blanks.length) delete card._manualBlanks;

function saveCardSelection(idx) {
  const card = previewData.cards[idx];
  const selQ = card._charSelectedQ || {};
  const selA = card._charSelected || {};
  const hasQ = Object.values(selQ).some(function(v) { return v; });
  const hasA = Object.values(selA).some(function(v) { return v; });
  if (!hasQ && !hasA) return;
  // 保存撤回快照（首次保存时）
  if (!card._undoSnapshot) saveUndoSnapshot(card);

  const q = card.question || '';
  const rawA = card.answer || '';
  const answerStart = q.length + 1;
  if (!card.blanks) card.blanks = [];

  // 处理题目选字 → blanks（位置在 [0, q.length]，不用加偏移）
  if (hasQ) {
    if (!card._savedCharsQ) card._savedCharsQ = {};
    _saveSelectionGroups(card, selQ, 0, q, 'q');
    card._charSelectedQ = {};
  }

  // 处理答案选字 → blanks（位置 + answerStart 偏移）
  if (hasA) {
    if (!card._savedChars) card._savedChars = {};
    _saveSelectionGroups(card, selA, answerStart, rawA, 'a');
    card._charSelected = {};
  }

  card._manualBlanks = true;
  card.blanks.sort(function(a, b) { return a.start - b.start; });
  // 从相邻独立空生成组合空
  _rebuildCombinedBlanks(card);

  document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
}

function _saveSelectionGroups(card, sel, offset, sourceText, section) {
  const newIndices = Object.keys(sel).filter(function(k) { return sel[k]; }).map(Number).sort(function(a,b) { return a-b; });
  if (!newIndices.length) return;
  const newGroups = [];
  var g = [newIndices[0]];
  for (var i = 1; i < newIndices.length; i++) {
    if (newIndices[i] === g[g.length - 1] + 1) g.push(newIndices[i]);
    else { newGroups.push(g); g = [newIndices[i]]; }
  }
  newGroups.push(g);

  var savedKey = section === 'q' ? '_savedCharsQ' : '_savedChars';
  if (!card[savedKey]) card[savedKey] = {};

  for (var gi = 0; gi < newGroups.length; gi++) {
    var ng = newGroups[gi];
    var ngStart = offset + ng[0];
    var ngEnd = offset + ng[ng.length - 1] + 1;
    // 查找与新组相邻或重叠的旧空白
    var mergedStart = ngStart, mergedEnd = ngEnd;
    card.blanks = card.blanks.filter(function(b) {
      if (ngStart < b.end && b.start < ngEnd) {
        mergedStart = Math.min(mergedStart, b.start);
        mergedEnd = Math.max(mergedEnd, b.end);
        return false; // 移除旧空白，后面重建
      }
      return true;
    });
    // 创建合并后的空白
    var text = sourceText.substring(mergedStart - offset, mergedEnd - offset).replace(/[\n]/g, '');
    card.blanks.push({ start: mergedStart, end: mergedEnd, text: text, isAnswer: section === 'a' });
    // 标记已保存
    for (var j = mergedStart - offset; j < mergedEnd - offset; j++) card[savedKey][j] = true;
  }
}

function clearCardSelection(idx) {
  const card = previewData.cards[idx];
  card._charSelected = {};
  card._savedChars = {};
  card._charSelectedQ = {};
  card._savedCharsQ = {};
  card.blanks = [];
  delete card._manualBlanks;
  document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
}

// 卡片状态判定：empty=答案为空, short=答案<20字, noBlanks=手动模式无挖空, ok=正常
function getCardStatus(card, mode) {
  var ans = (card.answer || '').replace(/\s/g, '');
  if (!ans) return 'empty';
  if (ans.length < 20) return 'short';
  if (mode === 'manual') {
    var hasBlanks = (card.blanks && card.blanks.length > 0) || (card._savedChars && Object.keys(card._savedChars).length > 0) || (card._savedCharsQ && Object.keys(card._savedCharsQ).length > 0);
    if (!hasBlanks) return 'noBlanks';
  }
  return 'ok';
}

// 跳转到上一个/下一个问题卡片
var _lastProblemIdx = -1;
function jumpToProblemCard(direction) {
  if (!previewData) return;
  var cards = previewData.cards;
  var mode = previewData.mode;
  var problemIndices = [];
  for (var i = 0; i < cards.length; i++) {
    if (getCardStatus(cards[i], mode) !== 'ok') problemIndices.push(i);
  }
  if (!problemIndices.length) { showToast('✅ 没有发现问题卡片'); return; }
  // 找当前/最近的位置
  var cur = _lastProblemIdx;
  if (cur < 0) cur = direction > 0 ? -1 : cards.length;
  var target = -1;
  if (direction > 0) {
    for (var j = 0; j < problemIndices.length; j++) {
      if (problemIndices[j] > cur) { target = problemIndices[j]; break; }
    }
    if (target < 0 && problemIndices.length) target = problemIndices[0]; // 循环到开头
  } else {
    for (var k = problemIndices.length - 1; k >= 0; k--) {
      if (problemIndices[k] < cur) { target = problemIndices[k]; break; }
    }
    if (target < 0 && problemIndices.length) target = problemIndices[problemIndices.length - 1]; // 循环到末尾
  }
  if (target < 0) return;
  _lastProblemIdx = target;
  // 自动跳转到目标所在页
  var pageSize = 20;
  var targetPage = Math.floor(target / pageSize);
  var needPageSwitch = _previewPage !== targetPage;
  if (needPageSwitch) {
    _previewPage = targetPage;
    renderPreviewCards();
  }
  setTimeout(function() {
    var el = document.getElementById('previewCard-' + target);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.boxShadow = '0 0 0 3px var(--warning)';
      setTimeout(function() { el.style.boxShadow = ''; }, 1500);
    }
  }, needPageSwitch ? 150 : 50);
  showToast('已跳到第 ' + (target + 1) + ' 题');
}

  card.answer = snap.answer;

  card._charSelected = snap._charSelected ? Object.assign({}, snap._charSelected) : {};
  card._savedCharsQ = snap._savedCharsQ ? Object.assign({}, snap._savedCharsQ) : {};
  card._charSelectedQ = snap._charSelectedQ ? Object.assign({}, snap._charSelectedQ) : {};

// 保存撤回快照
function saveUndoSnapshot(card) {

    answer: card.answer,
    koujue: card.koujue,
    blanks: (card.blanks || []).slice(),
    _savedChars: Object.assign({}, card._savedChars || {}),
    _charSelected: Object.assign({}, card._charSelected || {}),
    _savedCharsQ: Object.assign({}, card._savedCharsQ || {}),
    _charSelectedQ: Object.assign({}, card._charSelectedQ || {}),

function _rebuildCombinedBlanks(card) {
  // 先清除旧的组合空

  var blanks = card.blanks.slice().sort(function(a, b) { return a.start - b.start; });
  if (blanks.length < 2) return;
  // 找相邻组（上一个 end == 下一个 start）
  var groups = [];
  var cur = [blanks[0]];
  for (var i = 1; i < blanks.length; i++) {
    if (blanks[i].start === cur[cur.length - 1].end) {
      cur.push(blanks[i]);
    } else {
      if (cur.length >= 2) groups.push(cur);
      cur = [blanks[i]];
    }
  }
  if (cur.length >= 2) groups.push(cur);
  if (!groups.length) return;
  var q = (card.question || '').trim();
  var answerStart = q.length + 1;
  var rawQ = card.question || '';
  var rawA = card.answer || '';
  // 为每组相邻空生成所有连续子序列组合
  for (var gi = 0; gi < groups.length; gi++) {
    var g = groups[gi];

        var end = g[j + len - 1].end;

          text = rawQ.substring(start, end).replace(/[\n]/g, '');

          text = rawA.substring(start - answerStart, end - answerStart).replace(/[\n]/g, '');
        }
        if (!card.blanks.some(function(b) { return b.start === start && b.end === end; })) {

        }
      }
    }

function removeManualBlank(idx, bidx) {

  const b = blanks[bidx];

  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);

function renderAutoPreview(card) {

  let h = '', le = 0;
  for (const b of blanks) {
    h += escNl(text.substring(le, b.start));
    h += `<span class="blank-highlight">${escNl(b.text)}</span>`;
    le = b.end;
  }
  h += escNl(text.substring(le));
  return h;
}

    const cls = b._removed ? 'blank-tag removed' : 'blank-tag';
    return `<span class="${cls}" onclick="toggleAutoBlank(${idx}, ${j})">${escapeHtml(b.text)}${b._removed ? ' ↺' : ' ✕'}</span>`;
  }).join(' ');

function toggleAutoBlank(idx, bidx) {

function confirmImport() {
  // 免费版检查：题库数量上限 + 单库题目上限（超出截断，不拒绝）
  if (getTier() === 'free') {
    // 新建题库时检查题库数量
    if (!previewData.editBankId) {
      var bankCount = Object.keys(appData.banks || {}).length;
      if (bankCount >= FREE_MAX_BANKS) {
        showToast('🔒 免费版最多' + FREE_MAX_BANKS + '个题库，当前已有' + bankCount + '个。请升级解锁', 5000);
        closePreviewModal(); return;
      }
    }
    // 单库题目上限：超出自动截断，保留前N题
    if (previewData.editBankId) {
      var bank = appData.banks[previewData.editBankId];
      var existing = bank ? (bank.cards || []).length : 0;
      var room = FREE_MAX_CARDS_PER_BANK - existing;
      if (room <= 0) {
        showToast('🔒 免费版每题库最多' + FREE_MAX_CARDS_PER_BANK + '题，当前题库已满。请升级解锁', 5000);
        closePreviewModal(); return;
      }
      if (previewData.cards && previewData.cards.length > room) {
        previewData.cards = previewData.cards.slice(0, room);
        showToast('⚠️ 免费版限制：仅导入前' + room + '题（超出' + FREE_MAX_CARDS_PER_BANK + '题上限的部分已截断）', 3000);
      }
    } else {
      if (previewData.cards && previewData.cards.length > FREE_MAX_CARDS_PER_BANK) {
        var truncated = previewData.cards.slice(0, FREE_MAX_CARDS_PER_BANK);
        var dropped = previewData.cards.length - FREE_MAX_CARDS_PER_BANK;
        previewData.cards = truncated;
        showToast('⚠️ 免费版限制：仅保留前' + FREE_MAX_CARDS_PER_BANK + '题（超出' + dropped + '题已截断）。请升级解锁完整导入', 4000);
      }
    }
  }
  if (!previewData) return;
  // 所有版本均可导入
  // 单题编辑模式（从刷题页进入）
  if (previewData._singleCardEdit) {
    const edited = previewData.cards[0];
    delete edited._charSelected; delete edited._savedChars; delete edited._charSelectedQ; delete edited._savedCharsQ; delete edited._autoBlanks;
    practiceState.cards[previewData._cardIdx] = edited;
    practiceState.revealed.delete(edited.id);
    delete practiceState.answers[edited.id];
    const bank = appData.banks[practiceState.bankId];
    if (bank) {
      const orig = bank.cards.find(x => x.id === edited.id);
      if (orig) { orig.blanks = edited.blanks; orig.fullText = edited.fullText; orig._manualBlanks = edited._manualBlanks; }
      saveData(appData);
    }
    previewData = null; const m = $('previewModal'); if (m) m.remove();
    renderPracticeCard();
    return;
  }
  const { name, cards, mode, editBankId } = previewData;
  const cleaned = cards.map(c => {
    delete c._charSelected; delete c._savedChars; delete c._charSelectedQ; delete c._savedCharsQ;
    // 清理合并标记：从答案中移除零宽空格，调整空白位置
    var a = c.answer || '';
    if (a.indexOf(MERGE_MARKER) >= 0) {
      var mergePositions = [];
      for (var mi = 0; mi < a.length; mi++) { if (a[mi] === MERGE_MARKER) mergePositions.push(mi); }
      c.answer = a.split(MERGE_MARKER).join('');
      // 调整 blanks 中的绝对位置（需要换算为相对位置、校正、再换算回绝对位置）
      if (c.blanks && mergePositions.length > 0) {
        var q2 = (c.question || '').trim();
        var ansStart = q2.length + 1;
        c.blanks.forEach(function(b) {
          var relStart = b.start - ansStart;
          var relEnd = b.end - ansStart;
          var shiftS = 0, shiftE = 0;
          for (var mp = 0; mp < mergePositions.length; mp++) {
            if (mergePositions[mp] < relStart) shiftS++;
            else break;
          }
          for (var mp2 = 0; mp2 < mergePositions.length; mp2++) {
            if (mergePositions[mp2] < relEnd) shiftE++;
            else break;
          }
          b.start -= shiftS;
          b.end -= shiftE;
        });
      }
      // 重建 fullText
      c.fullText = (c.question || '').trim() + '\n' + c.answer;
    }
    if (mode === 'auto' && c._autoBlanks) {
      c.blanks = c._autoBlanks.filter(b => !b._removed);
      delete c._manualBlanks;
    }
    delete c._autoBlanks;
    return c;
  });

  if (editBankId) {
    // 编辑模式：更新已有题库
    const bank = appData.banks[editBankId];
    if (bank) {
      bank.cards = cleaned;
      bank.updatedAt = Date.now();
      saveData(appData);
      previewData = null; const m = $('previewModal'); if (m) m.remove();
      showToast(`已更新！${cleaned.length} 题`);
    }
  } else {
    // 新建模式
    const bankId = generateId();
    appData.banks[bankId] = { id: bankId, name, createdAt: Date.now(), updatedAt: Date.now(), cards: cleaned };
    saveData(appData);
    previewData = null; const m = $('previewModal'); if (m) m.remove();
    showToast(`导入成功！${cleaned.length} 题`);
    if (window._track) window._track('importDone');
  }
  renderBanks();
}

function executeMerge(srcId, dstId) {
  const src = appData.banks[srcId];
  const dst = appData.banks[dstId];
  if (!src || !dst) return;
  const count = src.cards.length;
  const idMap = {}; // 旧ID→新ID映射，保证错题本正确迁移
  for (const card of src.cards) {
    const oldId = card.id;
    card.id = generateId(); // 避免ID冲突
    idMap[oldId] = card.id;
    dst.cards.push(card);
  }
  dst.updatedAt = Date.now();
  // 合并错题本（使用ID映射保留错题记录）
  const srcWb = getWrongBook(srcId);
  const dstWb = getWrongBook(dstId);
  for (const [cid, detail] of Object.entries(srcWb)) {
    const newCid = idMap[cid];
    if (newCid) dstWb[newCid] = detail;
  }
  // 删除源题库
  delete appData.banks[srcId];
  delete appData.seqProgress[srcId];
  delete appData.wrongBooks[srcId];
  saveData(appData);
  showToast('已合并！' + count + ' 题从「' + src.name + '」移入「' + dst.name + '」');
  renderBanks();
}

function selectTimerMode(mode, el) {

  var label = document.getElementById('timerConfigLabel');
  if (mode === 'off') {
    config.style.display = 'none';
  } else {
    config.style.display = '';
    if (mode === 'perQuestion') {
      label.textContent = '每题限时';
      document.getElementById('timerSeconds').value = timerSeconds || 75;
    } else {
      label.textContent = '总共限时';
      document.getElementById('timerSeconds').value = timerSeconds || 600;
    }
  }
  appData.settings.timerMode = mode;
  appData.settings.timerSeconds = timerSeconds;
  saveData(appData);
}
function saveTimerSeconds() {
  var input = document.getElementById('timerSeconds');
  if (!input) return;
  timerSeconds = parseInt(input.value) || 75;
  if (timerSeconds < 5) timerSeconds = 5;
  if (timerSeconds > 3600) timerSeconds = 3600;
  input.value = timerSeconds;
  appData.settings.timerSeconds = timerSeconds;
  saveData(appData);
}
function startTimer() {
  if (timerMode === 'off') { return; }
  var secInput = document.getElementById('timerSeconds');
  timerSeconds = parseInt(secInput.value) || 60;
  if (timerSeconds < 5) timerSeconds = 5;
  if (timerSeconds > 3600) timerSeconds = 3600;
  timerRemaining = timerSeconds;
  updateTimerDisplay();
  timerInterval = setInterval(function() {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) { handleTimerExpiry(); }
  }, 1000);
  document.getElementById('timerDisplay').style.display = '';
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function updatePomodoroDisplay() {
  var pd = document.getElementById('pomodoroDisplay');
  if (!pd) return;
  if (!pomodoroActive) { pd.style.display = 'none'; return; }
  pd.style.display = '';
  var m = Math.floor(pomodoroRemaining / 60);
  var s = pomodoroRemaining % 60;
  pd.textContent = '🍅 ' + m + ':' + (s < 10 ? '0' : '') + s;
  if (pomodoroRemaining <= 60) {
    pd.style.background = 'var(--danger-light)'; pd.style.color = 'var(--danger)';
  } else if (pomodoroRemaining <= 300) {
    pd.style.background = 'var(--warning-light)'; pd.style.color = '#92400e';
  } else {
    pd.style.background = 'var(--primary-light)'; pd.style.color = 'var(--primary)';
  }
}
function updateTimerDisplay() {
  var display = document.getElementById('timerDisplay');
  if (!display) return;
  var mins = Math.floor(timerRemaining / 60);
  var secs = timerRemaining % 60;
  display.textContent = '⏱ ' + mins + ':' + (secs < 10 ? '0' : '') + secs;
  if (timerRemaining <= 10) {
    display.style.background = 'var(--danger-light)'; display.style.color = 'var(--danger)';
  } else if (timerRemaining <= 30) {
    display.style.background = 'var(--warning-light)'; display.style.color = '#92400e';
  } else {
    display.style.background = 'var(--primary-light)'; display.style.color = 'var(--primary)';
  }
}
function handleTimerExpiry() {

function extractCategories(bank) {
  if (!bank || !bank.cards) return [];
  const cats = new Set();
  for (const c of bank.cards) {
    const q = (c.question || "").trim();
    const matches = q.match(/（[^）]{1,8}）/g);
    if (matches) for (const m of matches) cats.add(m);
  }
  return [...cats].sort();
}

function renderCategoryFilter(bankId) {
  const div = document.getElementById("categoryFilter");
  if (!div) return;
  const bank = appData.banks[bankId];
  if (!bank) { div.innerHTML = ""; return; }
  const cats = extractCategories(bank);
  if (!cats.length) { div.innerHTML = ""; return; }
  if (!categoryFilter) categoryFilter = new Set(cats);
  let h = "<label class=\"form-label\" style=\"font-size:13px\">🏷️ 分类筛选</label><div class=\"chip-group\">";
  h += "<span class=\"chip" + (categoryFilter.size === cats.length ? " active" : "") + "\" onclick=\"toggleAllCategories()\">全部</span>";
  for (const cat of cats) {
    h += "<span class=\"chip" + (categoryFilter.has(cat) ? " active" : "") + "\" onclick=\"toggleCategory('" + cat + "')\" style=\"margin-left:4px\">" + cat + "</span>";
  }
  h += "</div>";
  div.innerHTML = h;
  updateFilteredCount();
}

function toggleAllCategories() {
  const bankId = document.getElementById("bankSelect").value;
  const bank = appData.banks[bankId];
  if (!bank) return;
  const cats = extractCategories(bank);
  if (categoryFilter && categoryFilter.size === cats.length) categoryFilter = new Set();
  else categoryFilter = new Set(cats);
  renderCategoryFilter(bankId);
}

function toggleCategory(cat) {
  if (!categoryFilter) return;
  if (categoryFilter.has(cat)) {
    if (categoryFilter.size <= 1) return; // 至少保留一个分类
    categoryFilter.delete(cat);
  } else categoryFilter.add(cat);
  renderCategoryFilter(document.getElementById("bankSelect").value);
}

function getFilteredCards(bank) {
  if (!bank || !bank.cards) return [];
  if (!categoryFilter || !categoryFilter.size) return bank.cards;
  // 如果全部已有分类都被选中，等同于"全部"，不过滤（包含无标签卡片）
  var allCats = new Set();
  for (var i = 0; i < bank.cards.length; i++) {
    var qq = (bank.cards[i].question || "").trim();
    var ms = qq.match(/（[^）]{1,8}）/g) || [];
    for (var j = 0; j < ms.length; j++) allCats.add(ms[j]);
  }
  if (categoryFilter.size >= allCats.size) return bank.cards;
  return bank.cards.filter(function(c) {
    var q = (c.question || "").trim();
    var matches = q.match(/（[^）]{1,8}）/g) || [];
    return matches.some(function(m) { return categoryFilter.has(m); });
  });
}

// ==================== 做题 - 开始 ====================
function startPractice() {
  if (window._track) window._track('roundStart');
  practiceStartTime = Date.now();
  practiceSwitches = 0;
  practiceElapsed = 0;
  if (practiceStopwatchInterval) clearInterval(practiceStopwatchInterval);
  practiceStopwatchInterval = setInterval(function() {
    practiceElapsed++;
    var sw = document.getElementById('stopwatchDisplay');
    if (sw) {
      var m = Math.floor(practiceElapsed / 60);
      var s = practiceElapsed % 60;
      sw.textContent = '⏱ ' + m + ':' + (s < 10 ? '0' : '') + s;
    }
  }, 1000);
  // 🍅 番茄钟倒计时
  if (getSetting('pomodoro', false)) {
    if (pomodoroInterval) clearInterval(pomodoroInterval);
    var durMin = getSetting('pomodoroDuration', 25);
    pomodoroRemaining = durMin * 60;
    pomodoroActive = true;
    updatePomodoroDisplay();
    pomodoroInterval = setInterval(function pomoCountdown() {
      pomodoroRemaining--;
      updatePomodoroDisplay();
      if (pomodoroRemaining <= 0) {
        clearInterval(pomodoroInterval); pomodoroInterval = null;
        pomodoroActive = false;
        // 检查双倍番茄卡
        if ((appData.settings.doubleTomatoCard || 0) > 0) {
          appData.settings.doubleTomatoCard--;
          appData.settings.tomatoGarden = (appData.settings.tomatoGarden || 0) + 2;
          saveData(appData);
          showToast('🍅🍅 双倍番茄卡生效！+2番茄！(剩余' + appData.settings.doubleTomatoCard + '张)');
        } else {
          appData.settings.tomatoGarden = (appData.settings.tomatoGarden || 0) + 1;
          saveData(appData);
          showToast('🍅 番茄钟完成！已收获 ' + appData.settings.tomatoGarden + ' 个番茄');
        }
        setTimeout(function() {
          if (!pomodoroActive && getSetting('pomodoro', false) && document.getElementById('practiceActive').style.display !== 'none') {
            var dm2 = getSetting('pomodoroDuration', 25);
            pomodoroRemaining = dm2 * 60;
            pomodoroActive = true;
            updatePomodoroDisplay();
            pomodoroInterval = setInterval(pomoCountdown, 1000);
          }
        }, 2000);
      }
    }, 1000);
  }
  applyFocusMode();
  // 冲刺模式：使用冲刺题目池
  var isSprint = sessionStorage.getItem('sprintMode') === '1';
  if (isSprint) {
    var sprintPoolRaw = sessionStorage.getItem('sprintPool');
    if (!sprintPoolRaw) { showToast('冲刺数据已过期，请重新进入'); sessionStorage.removeItem('sprintMode'); renderPracticeSetup(); return; }
    try {
      var sprintPool = JSON.parse(sprintPoolRaw);
      if (!sprintPool.length) { showToast('没有需要冲刺的题目'); sessionStorage.removeItem('sprintMode'); renderPracticeSetup(); return; }
      var sprintCount = Math.min(sprintPool.length, batchSize || sprintPool.length);
      var sprintSelected = sprintPool.slice(0, sprintCount);
      // 从各个题库中找到对应卡片
      var selectedCards = [];
      for (var si = 0; si < sprintSelected.length; si++) {
        var sp = sprintSelected[si];
        var spBank = appData.banks[sp.bankId];
        if (!spBank) continue;
        var spCard = spBank.cards.find(function(x) { return x.id === sp.id; });
        if (spCard) selectedCards.push({ card: spCard, bankId: sp.bankId, bankName: sp.bankName });
      }
      if (!selectedCards.length) { showToast('冲刺题目已失效，请重新进入'); sessionStorage.removeItem('sprintMode'); renderPracticeSetup(); return; }
      // 构建多题库的练习状态
      var firstBank = selectedCards[0];
      var sprintBankId = firstBank.bankId;
      var sprintBankName = '冲刺模式';
      var sprintQh = new Set();
      if (hideQuestionStart) { for (var qi = 0; qi < selectedCards.length; qi++) sprintQh.add(selectedCards[qi].card.id); }
      practiceState = {
        bankId: sprintBankId, bankName: sprintBankName,
        cards: selectedCards.map(function(x) { return x.card; }), index: 0,
        mode: 'random-repeat',
        answers: {}, revealed: new Set(),
        questionHidden: sprintQh, koujueExpanded: {},
        total: selectedCards.length,
        _streak: 0,
        _roundCorrect: 0, _roundWrong: 0, _newlyMastered: [],
        _isSprint: true,
        answersHidden: false
      };
      $('practiceSetup').style.display = 'none';
      $('practiceResult').style.display = 'none';
      $('practiceActive').style.display = 'block';
      renderPracticeCard();
      return;
    } catch(e) { showToast('冲刺模式启动失败'); sessionStorage.removeItem('sprintMode'); renderPracticeSetup(); return; }
  }

  // 多题库模式（通过UI选择）
  var multiBanks = (_isMultiBankMode && _selectedMultiBanks.length > 1) ? _selectedMultiBanks.slice() : null;
  if (multiBanks && multiBanks.length > 1) {
    // 从多个题库收集题目
    var allCards = [];
    for (var mi = 0; mi < multiBanks.length; mi++) {
      var mBank = appData.banks[multiBanks[mi]];
      if (!mBank) continue;
      var mPool = getFilteredCards(mBank);
      for (var mj = 0; mj < mPool.length; mj++) {
        allCards.push({ card: mPool[mj], bankId: multiBanks[mi], bankName: mBank.name });
      }
    }
    if (!allCards.length) { showToast('所选题库无题目'); return; }
    // 打乱
    for (var ak = allCards.length - 1; ak > 0; ak--) {
      var ar = Math.floor(Math.random() * (ak + 1));
      var atmp = allCards[ak]; allCards[ak] = allCards[ar]; allCards[ar] = atmp;
    }
    var mCount = batchSize === 0 ? allCards.length : Math.min(batchSize, allCards.length);
    var mSelected = allCards.slice(0, mCount);
    var mQh = new Set();
    if (hideQuestionStart) { for (var qi2 = 0; qi2 < mSelected.length; qi2++) mQh.add(mSelected[qi2].card.id); }
    // 使用第一个题库作为"主"题库
    var mBankIds = multiBanks;
    practiceState = {
      bankId: mSelected[0].bankId, bankName: '混合 ' + multiBanks.length + ' 个题库',
      cards: mSelected.map(function(x) { return x.card; }), index: 0,
      mode: 'random-repeat',
      answers: {}, revealed: new Set(),
      questionHidden: mQh, koujueExpanded: {},
      total: mSelected.length,
      _streak: 0,
      _roundCorrect: 0, _roundWrong: 0, _newlyMastered: [],
      _multiBanks: mBankIds,
      _cardBankMap: mSelected.reduce(function(map, x, idx) { map[idx] = { bankId: x.bankId, bankName: x.bankName }; return map; }, {}),
      answersHidden: false
    };
    $('practiceSetup').style.display = 'none';
    $('practiceResult').style.display = 'none';
    $('practiceActive').style.display = 'block';
    initPracticeTimerBar();
    renderPracticeCard();
    return;
  }

  const bankId = document.getElementById('bankSelect').value;
  if (!bankId) { showToast('请先选择题库'); return; }
  const bank = appData.banks[bankId];
  if (!bank || !bank.cards.length) { showToast('题库为空'); return; }
  const pool = getFilteredCards(bank);

  if (!pool.length) { showToast("筛选后无题目"); return; }
  const count = batchSize === 0 ? pool.length : Math.min(batchSize, pool.length);
  let selected;

  var _actualStartPos = 0; // 记录本轮实际起始位置，用于进度保存
  if (drawMode === 'sequential') {
    var pos;
    if (!isTierLocked('startFrom') && startFrom > 0) {
      pos = startFrom - 1; // 用户填的是从1开始的题号，转成0-based索引
      if (pos >= pool.length) { showToast('起始题号超出题库范围（共' + pool.length + '题）'); return; }
    } else {
      pos = getSeqProgress(bankId);
      if (pos >= pool.length) {
        if (!confirm('题库已全部做完一轮，是否重置进度从头开始？')) return;
        appData.seqProgress[bankId] = 0;
        saveData(appData);
        pos = 0;
      }
    }
    _actualStartPos = pos;
    selected = [...pool.slice(pos, Math.min(pos + count, pool.length))];
  } else if (drawMode === 'random-norepeat') {
    if (!appData.doneSets) appData.doneSets = {};
    if (!appData.doneSets[bankId]) appData.doneSets[bankId] = [];
    const doneSet = appData.doneSets[bankId];
    const available = pool.filter(c => !doneSet.includes(c.id));
    if (available.length === 0) {
      if (!confirm('所有题目都已做过一轮，是否重置重新开始？')) return;
      appData.doneSets[bankId] = [];
      saveData(appData);
      selected = shuffle([...pool]).slice(0, count);
    } else {
      selected = shuffle(available).slice(0, Math.min(count, available.length));
    }
  } else {
    // random-repeat
    selected = shuffle([...pool]).slice(0, count);
  }

  // 间隔重复 & 错题优先排序（可通过开关关闭）
  var wb = getWrongBook(bankId);
  var now = Date.now();
  var dueCount = 0, wrongCount = 0;
  selected.forEach(function(c) {
    if (c.srNextReview && c.srNextReview <= now) dueCount++;
    if (c.id in wb) wrongCount++;
  });
  if (wrongFirst) {
    selected.sort(function(a, b) {
      // 1. 到期复习优先
      var aDue = a.srNextReview && a.srNextReview <= now ? 1 : 0;
      var bDue = b.srNextReview && b.srNextReview <= now ? 1 : 0;
      if (aDue !== bDue) return bDue - aDue;
      // 2. 错题其次
      var aWrong = (a.id in wb) ? 1 : 0;
      var bWrong = (b.id in wb) ? 1 : 0;
      return bWrong - aWrong;
    });
  }

  const qh = new Set();
  if (hideQuestionStart) { for (const c of selected) qh.add(c.id); }
  practiceState = {
    bankId, bankName: bank.name,
    cards: selected, index: 0,
    mode: drawMode,
    answers: {}, revealed: new Set(),
    questionHidden: qh, koujueExpanded: {},
    total: selected.length,
    _streak: 0,
    _roundCorrect: 0, _roundWrong: 0, _newlyMastered: [],
    answersHidden: false,
    _actualStartPos: _actualStartPos
  };

  $('practiceSetup').style.display = 'none';
  $('practiceResult').style.display = 'none';
  $('practiceActive').style.display = 'block';
  initPracticeTimerBar();
  renderPracticeCard();

  // 计时器初始化
  if (timerMode !== 'off') {
    stopTimer();
    startTimer();
  }

  // 间隔重复提醒
  if (wrongFirst && dueCount > 0) {
    setTimeout(function() {
      showToast('📅 今日待复习 ' + dueCount + ' 题，已优先排在前面' + (wrongCount > dueCount ? '，还有 ' + (wrongCount - dueCount) + ' 道错题' : ''));
    }, 600);
  } else if (wrongFirst && wrongCount > 0) {
    setTimeout(function() {
      showToast('❌ ' + wrongCount + ' 道错题已优先排在前面');
    }, 600);
  }
}

// 在 ①②③ 序号前插入换行（保留序号不被挖空吃掉）
function fmtAnswerSeg(seg, isFirst) {
  var result = seg
    .replace(/([①②③④⑤⑥⑦⑧⑨⑩])/g, '\n$1')
    .replace(/(（[\d一二三四五六七八九十百]+）)/g, '\n$1')
    .replace(/(\([\d]+\))/g, '\n$1');
  if (isFirst) result = result.replace(/^\n/, '');
  // 合并连续换行：防止原文\n + 自动添加\n = 双重<br>造成空行
  result = result.replace(/\n+/g, '\n');
  return escNl(result);
}
function fmtAnswerSegLast(seg) {
  var result = seg
    .replace(/([①②③④⑤⑥⑦⑧⑨⑩])/g, '\n$1')
    .replace(/(（[\d一二三四五六七八九十百]+）)/g, '\n$1')
    .replace(/(\([\d]+\))/g, '\n$1');
  result = result.replace(/\n+/g, '\n');
  return escNl(result);
}

function renderCardWithBlanks(card, revealed, hideQ) {
  const q = card.question || '';
  let a = (card.answer || '').trim();
  // 答案首行与题目重复时跳过（fallback路径，fullText已在autoGenerateBlanks中处理）
  const qTrim = q.trim();
  if (!card.fullText) {
    var aNl2 = a.indexOf('\n');
    if (aNl2 > 0) {
      var aFirstLine2 = a.substring(0, aNl2).trim();
      if (aFirstLine2 === qTrim || (aFirstLine2.length > 1 && qTrim.includes(aFirstLine2)) || (qTrim.length > 1 && aFirstLine2.includes(qTrim))) {
        a = a.substring(aNl2 + 1).trim();
      }
    }
  }
  const text = card.fullText || q + '\n' + a;
  const answerStart = q.length + 1; // +1 for \n (use untrimmed length matching fullText)

  // 按区域分组空：题目区 vs 答案区
  const allBlanks = card.blanks || [];
  const qBlanksRaw = allBlanks.filter(function(b) { return b.start < answerStart; });
  const aBlanksRaw = allBlanks.filter(function(b) { return b.start >= answerStart; });
  const round = card._blankRound || 0;

  // 题目区渲染
  let h = '';
  if (hideQ) {
    h += '<div style="margin-bottom:10px;padding:8px;background:var(--bg-input);border-radius:6px;text-align:center;font-size:12px;color:var(--text-tertiary);cursor:pointer" onclick="event.stopPropagation();toggleQuestion()">题目已隐藏，点击显示</div>';
  } else if (qBlanksRaw.length > 0) {
    // 题目有挖空 → 渲染填空框
    const qBlanks = resolveBlanksSub(qBlanksRaw, round);
    var qh = '', qle = 0;
    for (var qi = 0; qi < qBlanks.length; qi++) {
      var bq = qBlanks[qi];
      var sq = (practiceState.answers[card.id] || {})['q' + qi] || '';
      qh += fmtAnswerSeg(text.substring(qle, bq.start), qle === 0);
      if (revealed) {
        qh += '<span class="revealed-text">' + escNl(bq.text) + '</span>';
      } else {
        qh += '<input type="text" class="blank-input" size="' + Math.max(bq.text.length + 3, 5) + '" data-cid="' + card.id + '" data-bidx="q' + qi + '" data-ans="' + escapeHtml(bq.text).replace(/\n/g, ' ') + '" value="' + escapeHtml(sq) + '" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" oncontextmenu="return false" onblur="autoCheckIfDone()">';
      }
      qle = bq.end;
    }
    qh += fmtAnswerSegLast(text.substring(qle, answerStart));
    h += '<div style="margin-bottom:10px;line-height:1.9;cursor:pointer" onclick="event.stopPropagation();toggleQuestion()" title="点击隐藏题目">' + qh + '</div>';
  } else {
    h += '<div style="margin-bottom:10px;line-height:1.6;cursor:pointer" onclick="event.stopPropagation();toggleQuestion()" title="点击隐藏题目">' + escNl(q) + '</div>';
  }

  // 分隔 + 答案区
  if (!a) return h;
  h += '<div style="font-size:11px;color:var(--text-tertiary);margin-bottom:6px;font-weight:600;letter-spacing:.5px">── 填空区 ──</div>';

  // 用户主动隐藏 → 统一显示提示
  if (practiceState.answersHidden) {
    h += '<div style="line-height:1.9;color:var(--text-tertiary)">答案已隐藏，点击 💐 按钮显示</div>';
    return h;
  }

  // 答案区无挖空 → 纯文本
  if (!aBlanksRaw.length) {
    h += '<div style="line-height:1.9">' + escNl(a) + '</div>';
    return h;
  }

  // 渲染答案，带挖空
  const aBlanks = resolveBlanksSub(aBlanksRaw, round);
  var ah = '', le = answerStart;
  for (var ai = 0; ai < aBlanks.length; ai++) {
    var ba = aBlanks[ai];
    var sa = (practiceState.answers[card.id] || {})[ai] || '';
    ah += fmtAnswerSeg(text.substring(le, ba.start), ai === 0);
    if (revealed) {
      ah += '<span class="revealed-text">' + escNl(ba.text) + '</span>';
    } else {
      ah += '<input type="text" class="blank-input" size="' + Math.max(ba.text.length + 3, 5) + '" data-cid="' + card.id + '" data-bidx="' + ai + '" data-ans="' + escapeHtml(ba.text).replace(/\n/g, ' ') + '" value="' + escapeHtml(sa) + '" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" oncontextmenu="return false" onblur="autoCheckIfDone()">';
    }
    le = ba.end;
  }
  ah += fmtAnswerSegLast(text.substring(le));
  h += '<div style="line-height:1.9">' + ah + '</div>';
  return h;
}

// 空白分组解析（不含 _combined），用于指定区域的空白
function resolveBlanksSub(blanks, round) {
  if (!blanks || !blanks.length) return [];
  var sorted = blanks.slice().filter(function(b) { return !b._combined; }).sort(function(a, b) { return a.start - b.start; });
  if (!sorted.length) return [];
  var groups = [];
  for (var i = 0; i < sorted.length; i++) {
    var b = sorted[i], added = false;
    for (var j = 0; j < groups.length; j++) {
      if (groups[j].some(function(gb) { return gb.start < b.end && b.start < gb.end; })) {
        groups[j].push(b); added = true; break;
      }
    }
    if (!added) groups.push([b]);
  }
  round = round || 0;
  return groups.map(function(g) { return g[round % g.length]; });
}

// 解决重叠空：分组后每组选一个（_blankRound 控制轮换）
function resolveBlanks(card) {
  const all = card.blanks || [];
  if (!all.length) return [];
  const sorted = [...all].sort((a, b) => a.start - b.start);
  const groups = [];
  for (const b of sorted) {
    let added = false;
    for (const g of groups) {
      if (g.some(gb => gb.start < b.end && b.start < gb.end)) {
        g.push(b); added = true; break;
      }
    }
    if (!added) groups.push([b]);
  }
  const round = card._blankRound || 0;
  let resolved = groups.map(g => g[round % g.length]);
  return resolved;
}

function saveCurrentAnswers() {
  if (practiceState.answersHidden) return; // 隐藏状态下不保存，避免空值覆盖已有答案
  const inputs = document.querySelectorAll('#cardText .blank-input');
  const ans = {};
  inputs.forEach(inp => {
    const cid = inp.dataset.cid, bidx = parseInt(inp.dataset.bidx);
    if (!ans[cid]) ans[cid] = {};
    ans[cid][bidx] = inp.value.trim();
  });
  for (const [cid, blanks] of Object.entries(ans)) {
    if (!practiceState.answers[cid]) practiceState.answers[cid] = {};
    Object.assign(practiceState.answers[cid], blanks);
  }
}

	function getWrongBook(bankId) {

	// 错题互动复习：显示空填空框，点击显示/隐藏答案
function renderWrongCardInteractive(card, wrongDetail) {
  var a = card.answer ? card.answer.trim() : '';
  var blanks = card.blanks || [];
  if (!blanks.length) return '<div style="color:var(--text-secondary);line-height:1.9">' + a.replace(/\n/g, '<br>') + '</div>';
  var sorted = blanks.slice().sort(function(x,y){return x.start - y.start;});
  var groups = [];
  for (var i = 0; i < sorted.length; i++) {
    var b = sorted[i], added = false;
    for (var j = 0; j < groups.length; j++) {
      if (groups[j].some(function(gb){return gb.start < b.end && b.start < gb.end;})) {
        groups[j].push(b); added = true; break;
      }
    }
    if (!added) groups.push([b]);
  }
  var resolved = groups.map(function(g){return g[0];});
  var wi = wrongDetail.wrongIndices || [];
  var cid = card.id;
  var html = '<div style="font-size:11px;color:var(--text-tertiary);margin:8px 0 4px;font-weight:600">答错 ' + wi.length + ' 处</div>';
  html += '<div style="line-height:2.4;word-break:break-word;overflow-wrap:break-word" id="wrongBlanks_' + cid + '">';
  var le = 0;
  for (var k = 0; k < resolved.length; k++) {
    var bk = resolved[k];

    var isWr = wi.indexOf(k) >= 0;

    le = bk.end;
  }
  html += (a.substring(le)).replace(/\n/g, '<br>');
  html += '</div>';
  return html;
}

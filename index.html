// 合并换行：将 \n 或 \n 替换为零宽空格标记
function mergeLineAt(idx, pos) {
  var card = previewData.cards[idx];
  if (!card) return;
  var a = card.answer || '';
  if (pos < 0 || pos >= a.length) return;
  var ch = a[pos];
  // 处理 \n 双字符（字面量反斜杠n）和 \n 真正换行
  if (ch === '\\' && a[pos + 1] === 'n') {
    // 2字符 → 1字符 MERGE_MARKER，需要调整后续索引
    var newA = a.substring(0, pos) + MERGE_MARKER + a.substring(pos + 2);
    shiftCharKeys(card, pos + 1, -1); // pos+1之后的索引前移1
    card.answer = newA;
  } else if (ch === '\n') {
    // 1字符 → 1字符 MERGE_MARKER，无需调整索引
    card.answer = a.substring(0, pos) + MERGE_MARKER + a.substring(pos + 1);
  } else {
    return; // 不是换行符
  }
  if (!card._undoSnapshot) saveUndoSnapshot(card);
  document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
}

// 恢复换行：将零宽空格标记还原为 \n
function unmergeLineAt(idx, pos) {
  var card = previewData.cards[idx];
  if (!card) return;
  var a = card.answer || '';
  if (pos < 0 || pos >= a.length || a[pos] !== MERGE_MARKER) return;
  // 1字符 → 1字符，无需调整索引
  card.answer = a.substring(0, pos) + '\n' + a.substring(pos + 1);
  if (!card._undoSnapshot) saveUndoSnapshot(card);
  document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
}

// 字符删除后调整 _charSelected 和 _savedChars 索引
function shiftCharKeys(card, fromIdx, delta) {
  ['_charSelected', '_savedChars'].forEach(function(key) {
    var obj = card[key] || {};
    var newObj = {};
    Object.keys(obj).forEach(function(k) {
      var ki = parseInt(k);
      if (ki < fromIdx) newObj[k] = obj[k];
      else if (ki + delta < fromIdx) {} // 被删除的位置，丢弃
      else newObj[ki + delta] = obj[k];
    });
    card[key] = newObj;
  });
}

// 滑动选择
let swipeSelectMode = null;
let swipeStartX = 0, swipeStartY = 0, _lastTouchX = 0, _lastTouchY = 0;
function swipeSelectStart(e, idx) {
  _touchJustHappened = Date.now();
  swipeStartX = _lastTouchX = e.touches[0].clientX;
  swipeStartY = _lastTouchY = e.touches[0].clientY;
  swipeSelectMode = null;
  const card = previewData.cards[idx];
  const el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
  const ci = (el && el.dataset ? el.dataset.ci : undefined);
  if (ci == null) return;
  const charIdx = parseInt(ci);
  const isSaved = card._savedChars && card._savedChars[charIdx];
  if (isSaved) toggleImportChar(idx, charIdx);
  // 暂不启动选择模式，等 move 判断方向
  swipeSelectMode = { idx, adding: isSaved ? false : !(card._charSelected || {})[charIdx], removing: isSaved, started: false };
}

function swipeSelectMove(e, idx) {
  if (!swipeSelectMode || swipeSelectMode.idx !== idx) return;
  const tx = e.touches[0].clientX, ty = e.touches[0].clientY;
  const dx = Math.abs(tx - swipeStartX), dy = Math.abs(ty - swipeStartY);
  if (dy > dx && dy > 5) { swipeSelectMode = null; return; }
  if (dx < 8 && dy < 8) return;
  if (!swipeSelectMode.started) {
    swipeSelectMode.started = true;
    if (!swipeSelectMode.removing) {
      const el0 = document.elementFromPoint(swipeStartX, swipeStartY);
      const ci0 = (el0 && el0.dataset ? el0.dataset.ci : undefined);
      if (ci0 != null) toggleImportChar(idx, parseInt(ci0));
    }
  }
  const card = previewData.cards[idx];
  if (!card._charSelected) card._charSelected = {};
  const steps = Math.max(Math.abs(tx - _lastTouchX), Math.abs(ty - _lastTouchY));
  for (let s = 0; s <= steps; s++) {
    const t = steps === 0 ? 1 : s / steps;
    const px = Math.round(_lastTouchX + (tx - _lastTouchX) * t);
    const py = Math.round(_lastTouchY + (ty - _lastTouchY) * t);
    const el = document.elementFromPoint(px, py);
    const ci = (el && el.dataset ? el.dataset.ci : undefined);
    if (ci == null) continue;
    const charIdx = parseInt(ci);
    if (swipeSelectMode.removing) {
      if (card._savedChars && card._savedChars[charIdx]) toggleImportChar(idx, charIdx);
    } else {
      if (card._savedChars && card._savedChars[charIdx]) continue;
      if (card._charSelected[charIdx] !== swipeSelectMode.adding) toggleImportChar(idx, charIdx);
    }
  }
  _lastTouchX = tx; _lastTouchY = ty;
  e.preventDefault();
}

function swipeSelectEnd(idx) {
  // 没滑动的单击（去除模式在 start 已处理，这里跳过）
  if (swipeSelectMode && !swipeSelectMode.started && !swipeSelectMode.removing) {
    const card = previewData.cards[idx];
    const el = document.elementFromPoint(swipeStartX, swipeStartY);
    const ci = (el && el.dataset ? el.dataset.ci : undefined);
    if (ci != null) {
      const charIdx = parseInt(ci);
      if (!(card._savedChars && card._savedChars[charIdx])) {
        toggleImportChar(idx, charIdx);
      }
    }
  }
  swipeSelectMode = null;
}

// 鼠标选择（桌面端）：mousedown 即时响应，拖动连续选中
let _lastX = 0, _lastY = 0;
function mouseSelectStart(e, idx) {

  swipeStartX = _lastX = e.clientX; swipeStartY = _lastY = e.clientY;

  const el = document.elementFromPoint(e.clientX, e.clientY);
  const ci = (el && el.dataset ? el.dataset.ci : undefined);
  if (ci == null) { swipeSelectMode = null; return; }
  const charIdx = parseInt(ci);
  const card = previewData.cards[idx];
  const isSaved = card._savedChars && card._savedChars[charIdx];
  if (isSaved) toggleImportChar(idx, charIdx);

function mouseSelectMove(e, idx) {

  if (dx < 6 && dy < 6) return;

  const steps = Math.max(Math.abs(e.clientX - _lastX), Math.abs(e.clientY - _lastY));
  for (let s = 0; s <= steps; s++) {
    const t = steps === 0 ? 1 : s / steps;
    const px = Math.round(_lastX + (e.clientX - _lastX) * t);
    const py = Math.round(_lastY + (e.clientY - _lastY) * t);
    const el = document.elementFromPoint(px, py);
    const ci = (el && el.dataset ? el.dataset.ci : undefined);
    if (ci == null) continue;
    const charIdx = parseInt(ci);
    if (swipeSelectMode.removing) {
      if (card._savedChars && card._savedChars[charIdx]) toggleImportChar(idx, charIdx);
    } else {
      if (card._savedChars && card._savedChars[charIdx]) continue;
      if (card._charSelected[charIdx] !== swipeSelectMode.adding) toggleImportChar(idx, charIdx);
    }
  }
  _lastX = e.clientX; _lastY = e.clientY;
  e.preventDefault();
}
function mouseSelectEnd(idx) { swipeSelectMode = null; _wasDragging = false; }

function toggleImportChar(idx, charIdx) {
  const card = previewData.cards[idx];
  previewData._activeIdx = idx;
  if (!card._charSelected) card._charSelected = {};
  // 如果是已保存的字，点击取消该字所属的挖空
  if (card._savedChars && card._savedChars[charIdx]) {
    card._savedChars[charIdx] = false;
    const a = (card.answer || '').trim();
    const q = (card.question || '').trim();
    const answerStart = q.length + 1;
    card.blanks = (card.blanks || []).filter(b => {
      const relStart = b.start - answerStart;
      const relEnd = b.end - answerStart;
      return !(charIdx >= relStart && charIdx < relEnd);
    });
    // 全部空被移除后清除手动标记
    if (!card.blanks.length) delete card._manualBlanks;
    document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
    document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
    return;
  }
  card._charSelected[charIdx] = !card._charSelected[charIdx];
  // 用 data-ci 查找元素
  const container = document.getElementById('pv-answer-' + idx);
  if (container) {
    const el = container.querySelector('[data-ci="' + charIdx + '"]');
    if (el) el.classList.toggle('char-sel', card._charSelected[charIdx]);

function saveCardSelection(idx) {
  const card = previewData.cards[idx];
  const sel = card._charSelected || {};
  if (!Object.values(sel).some(function(v) { return v; })) return;
  // 保存撤回快照（首次保存时）
  if (!card._undoSnapshot) saveUndoSnapshot(card);

  const q = (card.question || '').trim();
  const rawA = card.answer || '';
  const answerStart = q.length + 1;

  // 仅取新选中的字，分组
  const newIndices = Object.keys(sel).filter(k => sel[k]).map(Number).sort((a,b) => a-b);
  if (!newIndices.length) return;
  const newGroups = [];
  let g = [newIndices[0]];
  for (let i = 1; i < newIndices.length; i++) {
    if (newIndices[i] === g[g.length - 1] + 1) g.push(newIndices[i]);
    else { newGroups.push(g); g = [newIndices[i]]; }
  }
  newGroups.push(g);

  if (!card.blanks) card.blanks = [];
  if (!card._savedChars) card._savedChars = {};

  for (const ng of newGroups) {
    const ngStart = answerStart + ng[0];
    const ngEnd = answerStart + ng[ng.length - 1] + 1;
    // 查找与新组相邻或重叠的旧空白
    let mergedStart = ngStart, mergedEnd = ngEnd;
    card.blanks = card.blanks.filter(b => {
      if (ngStart < b.end && b.start < ngEnd) {
        mergedStart = Math.min(mergedStart, b.start);
        mergedEnd = Math.max(mergedEnd, b.end);
        return false; // 移除旧空白，后面重建
      }
      return true;
    });
    // 创建合并后的空白
    const text = rawA.substring(mergedStart - answerStart, mergedEnd - answerStart).replace(/[\n]/g, '');
    card.blanks.push({ start: mergedStart, end: mergedEnd, text, isAnswer: true });
    card._manualBlanks = true;
    // 标记已保存
    for (let i = mergedStart - answerStart; i < mergedEnd - answerStart; i++) card._savedChars[i] = true;
  }
  card.blanks.sort((a, b) => a.start - b.start);
  // 从相邻独立空生成组合空
  _rebuildCombinedBlanks(card);
  card._charSelected = {};

  document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
}

function clearCardSelection(idx) {
  const card = previewData.cards[idx];
  card._charSelected = {};
  card._savedChars = {};
  card.blanks = [];
  delete card._manualBlanks;
  document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
}

// 卡片状态判定：empty=答案为空, short=答案<20字, noBlanks=手动模式无挖空, ok=正常
function getCardStatus(card, mode) {
  var ans = (card.answer || '').replace(/\s/g, '');
  if (!ans) return 'empty';
  if (ans.length < 20) return 'short';
  if (mode === 'manual') {
    var hasBlanks = (card.blanks && card.blanks.length > 0) || (card._savedChars && Object.keys(card._savedChars).length > 0);
    if (!hasBlanks) return 'noBlanks';
  }
  return 'ok';
}

// 跳转到上一个/下一个问题卡片
var _lastProblemIdx = -1;
function jumpToProblemCard(direction) {
  if (!previewData) return;
  var cards = previewData.cards;
  var mode = previewData.mode;
  var problemIndices = [];
  for (var i = 0; i < cards.length; i++) {
    if (getCardStatus(cards[i], mode) !== 'ok') problemIndices.push(i);
  }
  if (!problemIndices.length) { showToast('✅ 没有发现问题卡片'); return; }
  // 找当前/最近的位置
  var cur = _lastProblemIdx;
  if (cur < 0) cur = direction > 0 ? -1 : cards.length;
  var target = -1;
  if (direction > 0) {
    for (var j = 0; j < problemIndices.length; j++) {
      if (problemIndices[j] > cur) { target = problemIndices[j]; break; }
    }
    if (target < 0 && problemIndices.length) target = problemIndices[0]; // 循环到开头
  } else {
    for (var k = problemIndices.length - 1; k >= 0; k--) {
      if (problemIndices[k] < cur) { target = problemIndices[k]; break; }
    }
    if (target < 0 && problemIndices.length) target = problemIndices[problemIndices.length - 1]; // 循环到末尾
  }
  if (target < 0) return;
  _lastProblemIdx = target;
  // 自动跳转到目标所在页
  var pageSize = 20;
  var targetPage = Math.floor(target / pageSize);
  var needPageSwitch = _previewPage !== targetPage;
  if (needPageSwitch) {
    _previewPage = targetPage;
    renderPreviewCards();
  }
  setTimeout(function() {
    var el = document.getElementById('previewCard-' + target);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.boxShadow = '0 0 0 3px var(--warning)';
      setTimeout(function() { el.style.boxShadow = ''; }, 1500);
    }
  }, needPageSwitch ? 150 : 50);
  showToast('已跳到第 ' + (target + 1) + ' 题');
}

// 撤回卡片编辑/挖空操作
function undoCardEdit(idx) {
  if (!previewData || !previewData.cards[idx]) return;
  var card = previewData.cards[idx];
  var snap = card._undoSnapshot;
  if (!snap) return;
  card.question = snap.question;
  card.answer = snap.answer;
  card.koujue = snap.koujue;
  card.blanks = snap.blanks ? snap.blanks.slice() : [];
  card._savedChars = snap._savedChars ? Object.assign({}, snap._savedChars) : {};
  card._charSelected = snap._charSelected ? Object.assign({}, snap._charSelected) : {};
  card._manualBlanks = snap._manualBlanks;
  card._autoBlanks = snap._autoBlanks;
  delete card._undoSnapshot;
  card._editing = false;
  renderPreviewCards();
  showToast('↩️ 已撤回');
}

// 保存撤回快照
function saveUndoSnapshot(card) {
  card._undoSnapshot = {
    question: card.question,
    answer: card.answer,
    koujue: card.koujue,
    blanks: (card.blanks || []).slice(),
    _savedChars: Object.assign({}, card._savedChars || {}),
    _charSelected: Object.assign({}, card._charSelected || {}),
    _manualBlanks: card._manualBlanks,
    _autoBlanks: card._autoBlanks
  };
}

function _rebuildCombinedBlanks(card) {
  // 先清除旧的组合空
  card.blanks = (card.blanks || []).filter(b => !b._combined);
  const blanks = card.blanks.slice().sort((a, b) => a.start - b.start);
  if (blanks.length < 2) return;
  // 找相邻组（上一个 end == 下一个 start）
  const groups = [];
  let cur = [blanks[0]];
  for (let i = 1; i < blanks.length; i++) {
    if (blanks[i].start === cur[cur.length - 1].end) {
      cur.push(blanks[i]);
    } else {
      if (cur.length >= 2) groups.push(cur);
      cur = [blanks[i]];
    }
  }
  if (cur.length >= 2) groups.push(cur);
  if (!groups.length) return;
  const q = (card.question || '').trim();
  const answerStart = q.length + 1;
  const rawA = card.answer || '';
  // 为每组相邻空生成所有连续子序列组合
  for (const g of groups) {
    for (let len = 2; len <= g.length; len++) {
      for (let i = 0; i + len <= g.length; i++) {
        const start = g[i].start;
        const end = g[i + len - 1].end;
        const text = rawA.substring(start - answerStart, end - answerStart).replace(/[\n]/g, '');
        if (!card.blanks.some(b => b.start === start && b.end === end)) {
          card.blanks.push({ start, end, text, isAnswer: true, _combined: true });
        }
      }
    }
  }
  card.blanks.sort((a, b) => a.start - b.start);
}

function renderSavedInfo(card, idx) {
  const blanks = (card.blanks || []).slice().sort((a, b) => a.start - b.start).filter(b => !b._combined);
  if (!blanks.length) return '<span style="font-size:11px;color:var(--text-tertiary)">暂未保存挖空</span>';
  return '<span style="font-size:11px;color:var(--text-secondary)">已保存 ' + blanks.length + ' 个空：</span>' + blanks.map((b, j) => `<span class="blank-tag" onclick="removeManualBlank(${idx},${j})" style="font-size:11px;padding:2px 8px;cursor:pointer" title="点击取消">${escapeHtml(b.text)} ✕</span>`).join(' ');
}
function removeManualBlank(idx, bidx) {
  const card = previewData.cards[idx];
  const blanks = (card.blanks || []).slice().sort((a, b) => a.start - b.start).filter(b => !b._combined);
  const b = blanks[bidx];
  if (!b) return;
  // 从 blanks 中移除
  card.blanks = (card.blanks || []).filter(x => x.start !== b.start || x.end !== b.end);
  // 清除对应的 _savedChars 标记
  const q = (card.question || '').trim();
  const answerStart = q.length + 1;
  const relStart = b.start - answerStart, relEnd = b.end - answerStart;
  if (card._savedChars) { for (let j = relStart; j < relEnd; j++) card._savedChars[j] = false; }
  if (!card.blanks.length) delete card._manualBlanks;
  // 重建组合空
  if (card.blanks.length) _rebuildCombinedBlanks(card);
  document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
}

function renderAutoPreview(card) {
  const text = card.fullText || card.question + '\n' + card.answer;
  const blanks = (card._autoBlanks || []).filter(b => !b._removed);
  if (!blanks.length) return escNl(text);
  let h = '', le = 0;
  for (const b of blanks) {
    h += escNl(text.substring(le, b.start));
    h += `<span class="blank-highlight">${escNl(b.text)}</span>`;
    le = b.end;
  }
  h += escNl(text.substring(le));
  return h;
}

function renderAutoTags(card, idx) {
  const blanks = card._autoBlanks || [];
  const active = blanks.filter(b => !b._removed);
  let h = active.length + ' 个挖空 ';
  h += blanks.map((b, j) => {
    const cls = b._removed ? 'blank-tag removed' : 'blank-tag';
    return `<span class="${cls}" onclick="toggleAutoBlank(${idx}, ${j})">${escapeHtml(b.text)}${b._removed ? ' ↺' : ' ✕'}</span>`;
  }).join(' ');
  return h;
}

function confirmImport() {
  if (!previewData) return;
  // 试用版（非永久授权）不允许导入
  if (!isPermanentAuth()) {
    showToast('试用版不支持导入，请输入永久密码后重试');
    closePreviewModal();
    return;
  }
  // 单题编辑模式（从刷题页进入）
  if (previewData._singleCardEdit) {
    const edited = previewData.cards[0];
    delete edited._charSelected; delete edited._savedChars; delete edited._autoBlanks;
    practiceState.cards[previewData._cardIdx] = edited;
    practiceState.revealed.delete(edited.id);
    delete practiceState.answers[edited.id];
    const bank = appData.banks[practiceState.bankId];
    if (bank) {
      const orig = bank.cards.find(x => x.id === edited.id);
      if (orig) { orig.blanks = edited.blanks; orig.fullText = edited.fullText; orig._manualBlanks = edited._manualBlanks; }
      saveData(appData);
    }
    previewData = null; const m = $('previewModal'); if (m) m.remove();
    renderPracticeCard();
    return;
  }
  const { name, cards, mode, editBankId } = previewData;
  const cleaned = cards.map(c => {
    delete c._charSelected; delete c._savedChars;
    // 清理合并标记：从答案中移除零宽空格，调整空白位置
    var a = c.answer || '';
    if (a.indexOf(MERGE_MARKER) >= 0) {
      var mergePositions = [];
      for (var mi = 0; mi < a.length; mi++) { if (a[mi] === MERGE_MARKER) mergePositions.push(mi); }
      c.answer = a.split(MERGE_MARKER).join('');
      // 调整 blanks 中的绝对位置（需要换算为相对位置、校正、再换算回绝对位置）
      if (c.blanks && mergePositions.length > 0) {
        var q2 = (c.question || '').trim();
        var ansStart = q2.length + 1;
        c.blanks.forEach(function(b) {
          var relStart = b.start - ansStart;
          var relEnd = b.end - ansStart;
          var shiftS = 0, shiftE = 0;
          for (var mp = 0; mp < mergePositions.length; mp++) {
            if (mergePositions[mp] < relStart) shiftS++;
            else break;
          }
          for (var mp2 = 0; mp2 < mergePositions.length; mp2++) {
            if (mergePositions[mp2] < relEnd) shiftE++;
            else break;
          }
          b.start -= shiftS;
          b.end -= shiftE;
        });
      }
      // 重建 fullText
      c.fullText = (c.question || '').trim() + '\n' + c.answer;
    }
    if (mode === 'auto' && c._autoBlanks) {
      c.blanks = c._autoBlanks.filter(b => !b._removed);
      delete c._manualBlanks;
    }
    delete c._autoBlanks;
    return c;
  });

  if (editBankId) {
    // 编辑模式：更新已有题库
    const bank = appData.banks[editBankId];
    if (bank) {
      bank.cards = cleaned;
      bank.updatedAt = Date.now();
      saveData(appData);
      previewData = null; const m = $('previewModal'); if (m) m.remove();
      showToast(`已更新！${cleaned.length} 题`);
    }
  } else {
    // 新建模式
    const bankId = generateId();
    appData.banks[bankId] = { id: bankId, name, createdAt: Date.now(), updatedAt: Date.now(), cards: cleaned };
    saveData(appData);
    previewData = null; const m = $('previewModal'); if (m) m.remove();
    showToast(`导入成功！${cleaned.length} 题`);
  }
  renderBanks();
}

function executeMerge(srcId, dstId) {
  const src = appData.banks[srcId];
  const dst = appData.banks[dstId];
  if (!src || !dst) return;
  const count = src.cards.length;
  const idMap = {}; // 旧ID→新ID映射，保证错题本正确迁移
  for (const card of src.cards) {
    const oldId = card.id;
    card.id = generateId(); // 避免ID冲突
    idMap[oldId] = card.id;
    dst.cards.push(card);
  }
  dst.updatedAt = Date.now();
  // 合并错题本（使用ID映射保留错题记录）
  const srcWb = getWrongBook(srcId);
  const dstWb = getWrongBook(dstId);
  for (const [cid, detail] of Object.entries(srcWb)) {
    const newCid = idMap[cid];
    if (newCid) dstWb[newCid] = detail;
  }
  // 删除源题库
  delete appData.banks[srcId];
  delete appData.seqProgress[srcId];
  delete appData.wrongBooks[srcId];
  saveData(appData);
  showToast('已合并！' + count + ' 题从「' + src.name + '」移入「' + dst.name + '」');
  renderBanks();
}

// ====== 计时器 ======
function selectTimerMode(mode, el) {
  timerMode = mode;
  document.querySelectorAll('#timerModeGroup .chip').forEach(function(c) { c.classList.remove('active'); });
  if (el) el.classList.add('active');
  var config = document.getElementById('timerConfig');
  var label = document.getElementById('timerConfigLabel');
  if (mode === 'off') {
    config.style.display = 'none';
  } else {
    config.style.display = '';
    if (mode === 'perQuestion') {
      label.textContent = '每题限时';
      document.getElementById('timerSeconds').value = timerSeconds || 75;
    } else {
      label.textContent = '总共限时';
      document.getElementById('timerSeconds').value = timerSeconds || 600;
    }
  }
  appData.settings.timerMode = mode;
  appData.settings.timerSeconds = timerSeconds;
  saveData(appData);
}
function saveTimerSeconds() {
  var input = document.getElementById('timerSeconds');
  if (!input) return;
  timerSeconds = parseInt(input.value) || 75;
  if (timerSeconds < 5) timerSeconds = 5;
  if (timerSeconds > 3600) timerSeconds = 3600;
  input.value = timerSeconds;
  appData.settings.timerSeconds = timerSeconds;
  saveData(appData);
}
function startTimer() {
  if (timerMode === 'off') { return; }
  var secInput = document.getElementById('timerSeconds');
  timerSeconds = parseInt(secInput.value) || 60;
  if (timerSeconds < 5) timerSeconds = 5;
  if (timerSeconds > 3600) timerSeconds = 3600;
  timerRemaining = timerSeconds;
  updateTimerDisplay();
  timerInterval = setInterval(function() {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) { handleTimerExpiry(); }
  }, 1000);
  document.getElementById('timerDisplay').style.display = '';
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerDisplay() {
  var display = document.getElementById('timerDisplay');
  if (!display) return;
  var mins = Math.floor(timerRemaining / 60);
  var secs = timerRemaining % 60;
  display.textContent = '⏱ ' + mins + ':' + (secs < 10 ? '0' : '') + secs;
  if (timerRemaining <= 10) {
    display.style.background = 'var(--danger-light)'; display.style.color = 'var(--danger)';
  } else if (timerRemaining <= 30) {
    display.style.background = 'var(--warning-light)'; display.style.color = '#92400e';
  } else {
    display.style.background = 'var(--primary-light)'; display.style.color = 'var(--primary)';
  }
}
function handleTimerExpiry() {
  stopTimer();
  if (timerMode === 'perQuestion') {
    showToast('⏰ 时间到！自动跳到下一题');
    var card = practiceState.cards[practiceState.index];
    var wb = getWrongBook(practiceState.bankId);
    wb[card.id] = { wrongIndices: [], wrongAnswers: ['超时'] };
    saveData(appData);
    nextCard();
  } else {
    showToast('⏰ 总时间到！自动提交');
    finishPractice();
  }
}
function toggleWrongFirst() {
  wrongFirst = !wrongFirst;
  appData.settings.wrongFirst = wrongFirst;
  saveData(appData);
  var el = document.getElementById('wrongFirstChip');
  if (el) { el.classList.toggle('active', wrongFirst); el.textContent = wrongFirst ? '✅ 错题优先' : '📖 顺序出题'; }
}

function selectCount(n, el) {

function selectHideQ(val, el) {

function selectDrawMode(mode, el) {

function onBankChange(resetFilter = true) {
  const bankId = document.getElementById('bankSelect').value;
  if (resetFilter) categoryFilter = null; // 切换题库时重置筛选
  if (!bankId) return;
  sessionStorage.setItem('lastPracticeBank', bankId);

  let seqDiv = document.getElementById('seqInfo');
  if (drawMode === 'sequential') {
    const pos = getSeqProgress(bankId);
    const bank = appData.banks[bankId];
    if (!bank) return;
    const html = `<div class="seq-info" id="seqInfo">
      <span>📖 当前进度：第 <b>${Math.min(pos + 1, bank.cards.length)}</b> / ${bank.cards.length} 题</span>
      <button class="btn btn-sm" style="padding:4px 12px;font-size:12px;background:var(--danger);color:#fff;border:none;border-radius:6px;font-weight:600" onclick="event.stopPropagation();resetSeqProgress()">重置</button>
    </div>`;
    if (seqDiv) seqDiv.outerHTML = html;
    else { const chips = document.getElementById('drawModeChips'); if (chips) chips.parentElement.insertAdjacentHTML('afterend', html); }

    seqDiv.style.display = 'none';

function resetSeqProgress() {
  const bankId = document.getElementById('bankSelect').value;
  if (!bankId) return;
  appData.seqProgress[bankId] = 0;
  saveData(appData);
  onBankChange(false);
  showToast('进度已重置');
}

function getSeqProgress(bankId) { return appData.seqProgress[bankId] || 0; }

function extractCategories(bank) {
  if (!bank || !bank.cards) return [];
  const cats = new Set();
  for (const c of bank.cards) {
    const q = (c.question || "").trim();
    const matches = q.match(/（[^）]{1,8}）/g);
    if (matches) for (const m of matches) cats.add(m);
  }
  return [...cats].sort();
}

function renderCategoryFilter(bankId) {
  const div = document.getElementById("categoryFilter");
  if (!div) return;
  const bank = appData.banks[bankId];
  if (!bank) { div.innerHTML = ""; return; }
  const cats = extractCategories(bank);
  if (!cats.length) { div.innerHTML = ""; return; }
  if (!categoryFilter) categoryFilter = new Set(cats);
  let h = "<label class=\"form-label\" style=\"font-size:13px\">🏷️ 分类筛选</label><div class=\"chip-group\">";
  h += "<span class=\"chip" + (categoryFilter.size === cats.length ? " active" : "") + "\" onclick=\"toggleAllCategories()\">全部</span>";
  for (const cat of cats) {
    h += "<span class=\"chip" + (categoryFilter.has(cat) ? " active" : "") + "\" onclick=\"toggleCategory('" + cat + "')\" style=\"margin-left:4px\">" + cat + "</span>";
  }
  h += "</div>";
  div.innerHTML = h;
  updateFilteredCount();
}

function toggleAllCategories() {
  const bankId = document.getElementById("bankSelect").value;
  const bank = appData.banks[bankId];
  if (!bank) return;
  const cats = extractCategories(bank);
  if (categoryFilter && categoryFilter.size === cats.length) categoryFilter = new Set();
  else categoryFilter = new Set(cats);
  renderCategoryFilter(bankId);
}

function toggleCategory(cat) {
  if (!categoryFilter) return;
  if (categoryFilter.has(cat)) {
    if (categoryFilter.size <= 1) return; // 至少保留一个分类
    categoryFilter.delete(cat);
  } else categoryFilter.add(cat);
  renderCategoryFilter(document.getElementById("bankSelect").value);
}

function getFilteredCards(bank) {
  if (!bank || !bank.cards) return [];
  if (!categoryFilter || !categoryFilter.size) return bank.cards;
  return bank.cards.filter(c => {
    const q = (c.question || "").trim();
    const matches = q.match(/（[^）]{1,8}）/g) || [];
    return matches.some(m => categoryFilter.has(m));
  });
}

function updateFilteredCount() {
  const bankId = document.getElementById("bankSelect").value;
  if (!bankId) return;
  const bank = appData.banks[bankId];
  if (!bank) return;
  const filtered = getFilteredCards(bank);
  const hint = document.getElementById("categoryFilterHint");
  if (hint) hint.textContent = "筛选后 " + filtered.length + " / " + bank.cards.length + " 题";
}

  const bank = appData.banks[bankId];
  if (!bank) return;
  sessionStorage.setItem('lastPracticeBank', bankId);
  switchTab('practice');
}

// ==================== 做题 - 开始 ====================
function startPractice() {
  const bankId = document.getElementById('bankSelect').value;
  if (!bankId) { showToast('请先选择题库'); return; }
  const bank = appData.banks[bankId];
  if (!bank || !bank.cards.length) { showToast('题库为空'); return; }
  const pool = getFilteredCards(bank);

  if (!pool.length) { showToast("筛选后无题目"); return; }
  const count = batchSize === 0 ? pool.length : Math.min(batchSize, pool.length);
  let selected;

  if (drawMode === 'sequential') {
    const pos = getSeqProgress(bankId);
    if (pos >= pool.length) {
      if (!confirm('题库已全部做完一轮，是否重置进度从头开始？')) return;
      appData.seqProgress[bankId] = 0;
      saveData(appData);
      selected = [...pool.slice(0, count)];
    } else {
      selected = [...pool.slice(pos, Math.min(pos + count, pool.length))];
    }
  } else if (drawMode === 'random-norepeat') {
    if (!appData.doneSets) appData.doneSets = {};
    if (!appData.doneSets[bankId]) appData.doneSets[bankId] = [];
    const doneSet = appData.doneSets[bankId];
    const available = pool.filter(c => !doneSet.includes(c.id));
    if (available.length === 0) {
      if (!confirm('所有题目都已做过一轮，是否重置重新开始？')) return;
      appData.doneSets[bankId] = [];
      saveData(appData);
      selected = shuffle([...pool]).slice(0, count);
    } else {
      selected = shuffle(available).slice(0, Math.min(count, available.length));
    }
  } else {
    // random-repeat
    selected = shuffle([...pool]).slice(0, count);
  }

  // 间隔重复 & 错题优先排序（可通过开关关闭）
  var wb = getWrongBook(bankId);
  var now = Date.now();
  var dueCount = 0, wrongCount = 0;
  selected.forEach(function(c) {
    if (c.srNextReview && c.srNextReview <= now) dueCount++;
    if (c.id in wb) wrongCount++;
  });
  if (wrongFirst) {
    selected.sort(function(a, b) {
      // 1. 到期复习优先
      var aDue = a.srNextReview && a.srNextReview <= now ? 1 : 0;
      var bDue = b.srNextReview && b.srNextReview <= now ? 1 : 0;
      if (aDue !== bDue) return bDue - aDue;
      // 2. 错题其次
      var aWrong = (a.id in wb) ? 1 : 0;
      var bWrong = (b.id in wb) ? 1 : 0;
      return bWrong - aWrong;
    });
  }

  const qh = new Set();
  if (hideQuestionStart) { for (const c of selected) qh.add(c.id); }
  practiceState = {
    bankId, bankName: bank.name,
    cards: selected, index: 0,
    mode: drawMode,
    answers: {}, revealed: new Set(),
    questionHidden: qh, koujueExpanded: {},
    total: selected.length,
    _streak: 0,
    answersHidden: false
  };

  $('practiceSetup').style.display = 'none';
  $('practiceResult').style.display = 'none';
  $('practiceActive').style.display = 'block';
  renderPracticeCard();

  // 计时器初始化
  if (timerMode !== 'off') {
    stopTimer();
    startTimer();
  }

  // 间隔重复提醒
  if (wrongFirst && dueCount > 0) {
    setTimeout(function() {
      showToast('📅 今日待复习 ' + dueCount + ' 题，已优先排在前面' + (wrongCount > dueCount ? '，还有 ' + (wrongCount - dueCount) + ' 道错题' : ''));
    }, 600);
  } else if (wrongFirst && wrongCount > 0) {
    setTimeout(function() {
      showToast('❌ ' + wrongCount + ' 道错题已优先排在前面');
    }, 600);
  }
}

// ==================== 做题 - 卡片渲染 ====================
function renderPracticeCard() {
  const st = practiceState;

  const card = st.cards[st.index];

      <button style="background:none;border:none;font-size:24px;cursor:pointer;padding:8px 12px;line-height:1;min-width:44px;min-height:44px" onclick="toggleStarCurrent()">${starIcon}</button>
      <button style="background:none;border:none;font-size:20px;cursor:pointer;padding:8px 12px;line-height:1;min-width:44px;min-height:44px;color:var(--danger)" onclick="deleteCurrentCard()" title="删除此题">🗑️</button>
    </div>

    <!-- 密度 + 工具 同行 -->
    <div class="flex items-center gap-8 mb-8">
      <div class="segmented" id="densityCtrl" style="flex:0">
        <button class="seg${density === 'low' ? ' active' : ''}" data-v="low" onclick="changeDensity('low', this)" style="padding:5px 10px;min-height:32px;font-size:13px">低</button>
        <button class="seg${density === 'high' ? ' active' : ''}" data-v="high" onclick="changeDensity('high', this)" style="padding:5px 10px;min-height:32px;font-size:13px">高</button>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="editCurrentCardBlanks()" style="padding:6px 8px;font-size:var(--font-size)" title="手动挖空">🐑</button>
	      <button class="btn btn-ghost btn-sm" onclick="regenerateCurrentBlanks()" style="padding:6px 8px;font-size:var(--font-size)" title="换一批空">🔄</button>
      <div class="flex gap-4" style="margin-left:auto">
        <button class="btn btn-ghost btn-sm" onclick="toggleRevealCurrent()" style="padding:6px 8px;font-size:var(--font-size)" title="显示原文">✨</button>
        <button class="btn btn-ghost btn-sm" id="btnToggleAllAnswers" onclick="toggleAllAnswers()" style="padding:6px 8px;font-size:var(--font-size)" title="隐藏/显示全部答案">💐</button>
        ${hasKj ? `<button class="btn btn-ghost btn-sm" onclick="toggleKoujuePanel()" style="padding:6px 8px;font-size:var(--font-size);color:var(--primary)" title="口诀">💡</button>` : ''}
        ${hasVoice ? `<button class="btn btn-ghost btn-sm" onclick="speakCard()" style="padding:6px 8px;font-size:var(--font-size)" title="朗读">🔊</button>` : ''}
      </div>
    </div>

    <!-- 题目卡片 -->

    <!-- 口诀面板 -->
    ${hasKj ? `<div class="kj-panel${kjState > 0 ? ' show' : ''}" id="kjPanel" style="padding:10px 14px;margin-bottom:10px">
      <div class="kj-keywords" onclick="expandKoujue()" style="cursor:pointer">${renderKjKeywords(card.koujue)}</div>
      <div class="kj-full${kjState > 1 ? ' show' : ''}" onclick="collapseKoujue()" style="cursor:pointer">${renderKjFull(card.koujue)}</div>
      <div class="kj-tap-hint">${kjState === 0 ? '' : kjState === 1 ? '👆 点关键字查看完整含义' : ''}</div>
    </div>` : ''}

    <!-- 底部导航 -->
    <div class="flex gap-8" style="margin-top:20px">

      const x = e.clientX - rect.left;

      // 点左1/6区域 → 上一题
      if (x < w / 6 && st.index > 0) {
        saveCurrentAnswers();
        st.index--;
        renderPracticeCard();

      // 点右1/6区域 → 下一题
      else if (x > w * 5 / 6 && st.index < st.total - 1) {
        saveCurrentAnswers();
        st.index++;
        renderPracticeCard();
      }
    });

  setTimeout(() => {
    const fi = document.querySelector('#cardText .blank-input');

  if (cardText && !revealed) {
    const taps = new Map(); // inp → { count, lastTime }
    cardText.querySelectorAll('.blank-input').forEach(inp => {
      inp.addEventListener('pointerdown', e => {
        const now = Date.now();
        const t = taps.get(inp) || { count: 0, lastTime: 0 };
        if (now - t.lastTime > 800) t.count = 0;
        // 第一下只聚焦不算，从第二下开始计数
        if (document.activeElement !== inp && !inp.classList.contains('peeked')) {
          t.lastTime = now;
          taps.set(inp, t);
          return;
        }
        t.count++;
        t.lastTime = now;
        if (inp.classList.contains('peeked')) {
          inp.value = '';
          inp.classList.remove('peeked');
          t.count = 0;
        } else if (t.count >= 2) {
          inp.value = inp.dataset.ans || '';
          inp.classList.add('peeked');
          t.count = 0;
        }
        taps.set(inp, t);
      });
    });
  }
}

function renderCardWithBlanks(card, revealed, hideQ) {
  const q = card.question.trim();
  const a = card.answer.trim();
  const text = card.fullText || q + '\n' + a;
  const answerStart = q.length + 1; // +1 for \n

  // 题目：点击可隐藏/显示
  let h = '';
  if (hideQ) {
    h += `<div style="margin-bottom:10px;padding:8px;background:var(--bg-input);border-radius:6px;text-align:center;font-size:12px;color:var(--text-tertiary);cursor:pointer" onclick="event.stopPropagation();toggleQuestion()">题目已隐藏，点击显示</div>`;
  } else {
    h += `<div style="margin-bottom:10px;line-height:1.6;cursor:pointer" onclick="event.stopPropagation();toggleQuestion()" title="点击隐藏题目">${escNl(q)}</div>`;
  }

  // 分隔 + 答案区
  if (!a) return h;
  h += `<div style="font-size:11px;color:var(--text-tertiary);margin-bottom:6px;font-weight:600;letter-spacing:.5px">── 填空区 ──</div>`;

  // 用户主动隐藏 → 统一显示提示
  if (practiceState.answersHidden) {
    h += `<div style="line-height:1.9;color:var(--text-tertiary)">答案已隐藏，点击 💐 按钮显示</div>`;
    return h;
  }

  // 解决重叠空：分组后每组选一个
  const blanks = resolveBlanks(card);
  if (!blanks.length) {
    h += `<div style="line-height:1.9">${escNl(a)}</div>`;
    return h;
  }

  // 渲染答案，带挖空
  let ah = '', le = answerStart;
  for (let i = 0; i < blanks.length; i++) {
    const b = blanks[i];
    const saved = (practiceState.answers[card.id] || {})[i] || '';
    ah += escNl(text.substring(le, b.start));
    if (revealed) {
      ah += `<span class="revealed-text">${escNl(b.text)}</span>`;
    } else {
      ah += `<input type="text" class="blank-input" data-cid="${card.id}" data-bidx="${i}" data-ans="${escapeHtml(b.text)}" value="${escapeHtml(saved)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" oncontextmenu="return false" onblur="autoCheckIfDone()">`;
    }
    le = b.end;
  }
  ah += escNl(text.substring(le));
  h += `<div style="line-height:1.9">${ah}</div>`;
  return h;
}

// 解决重叠空：分组后每组选一个（_blankRound 控制轮换）
function resolveBlanks(card) {
  const all = card.blanks || [];
  if (!all.length) return [];
  const sorted = [...all].sort((a, b) => a.start - b.start);
  const groups = [];
  for (const b of sorted) {
    let added = false;
    for (const g of groups) {
      if (g.some(gb => gb.start < b.end && b.start < gb.end)) {
        g.push(b); added = true; break;
      }
    }
    if (!added) groups.push([b]);
  }
  const round = card._blankRound || 0;
  let resolved = groups.map(g => g[round % g.length]);
  return resolved;
}

function renderWrongCardInteractive(card, wrongDetail) {
  var a = card.answer ? card.answer.trim() : '';
  var blanks = card.blanks || [];
  if (!blanks.length) return '<div style="color:var(--text-secondary);line-height:1.9">' + a.replace(/\n/g, '<br>') + '</div>';
  var sorted = blanks.slice().sort(function(x,y){return x.start - y.start;});
  var groups = [];
  for (var i = 0; i < sorted.length; i++) {
    var b = sorted[i], added = false;
    for (var j = 0; j < groups.length; j++) {
      if (groups[j].some(function(gb){return gb.start < b.end && b.start < gb.end;})) {
        groups[j].push(b); added = true; break;
      }
    }
    if (!added) groups.push([b]);
  }
  var resolved = groups.map(function(g){return g[0];});
  var wi = wrongDetail.wrongIndices || [];
  var cid = card.id;
  var html = '<div style="font-size:11px;color:var(--text-tertiary);margin:8px 0 4px;font-weight:600">答错 ' + wi.length + ' 处</div>';
  html += '<div style="line-height:2.4;word-break:break-word;overflow-wrap:break-word" id="wrongBlanks_' + cid + '">';
  var le = 0;
  for (var k = 0; k < resolved.length; k++) {
    var bk = resolved[k];
    html += (a.substring(le, bk.start)).replace(/\n/g, '<br>');
    var isWr = wi.indexOf(k) >= 0;
    var style = isWr
      ? 'color:var(--danger);font-weight:600;text-decoration:underline;text-decoration-color:var(--danger);text-underline-offset:3px;background:var(--danger-light);padding:1px 4px;border-radius:3px'
      : 'color:var(--success);font-weight:600;background:var(--success-light);padding:1px 4px;border-radius:3px';
    html += '<span style="' + style + '">' + escapeHtml(bk.text) + '</span>';
    le = bk.end;
  }
  html += (a.substring(le)).replace(/\n/g, '<br>');
  html += '</div>';
  return html;
}

function applyCheckToInputs(card) {
  const inputs = document.querySelectorAll('#cardText .blank-input');
  let hasWrong = false;
  const wrongIndices = [];
  const wrongAnswers = [];
  inputs.forEach((inp, i) => {
    const userAns = inp.value.trim();
    const correctAns = (inp.dataset.ans || '').trim();
    inp.classList.remove('correct', 'wrong');
    if (fuzzyMatch(userAns, correctAns)) {
      inp.classList.add('correct');
    } else {
      inp.classList.add('wrong');
      hasWrong = true;
      wrongIndices.push(i);
      wrongAnswers.push(userAns);
    }
  });
  // 有错则收集整题到错题本，记录错空位置和填的答案
  if (hasWrong) {
    const wb = getWrongBook(practiceState.bankId);
    wb[card.id] = { wrongIndices: wrongIndices, wrongAnswers: wrongAnswers };
    saveData(appData);
  }

  // 间隔重复追踪
  const bank = appData.banks[practiceState.bankId];
  const bankCard = bank ? bank.cards.find(c => c.id === card.id) : null;
  if (bankCard) {
    if (hasWrong) {
      // 答错：设置明天复习，stage 保持不变或设为1
      bankCard.srStage = bankCard.srStage || 1;
      bankCard.srNextReview = Date.now() + 86400000; // 1天后
    } else if (bankCard.srStage && bankCard.srStage > 0) {
      // 之前错过，这次全对：晋级
      const intervals = [0, 86400000, 172800000, 345600000, 604800000]; // 0, 1d, 2d, 4d, 7d
      bankCard.srStage = Math.min(5, bankCard.srStage + 1);
      if (bankCard.srStage >= 5) {
        bankCard.srNextReview = null; // 已掌握，不再强制复习
        bankCard.srStage = 0; // 重置
      } else {
        bankCard.srNextReview = Date.now() + intervals[bankCard.srStage];
      }
    }
    saveData(appData);
  }

  // 🔥 连续答对 & 🎰 随机幸运
  if (!hasWrong) {
    practiceState._streak = (practiceState._streak || 0) + 1;
    // 连续答对彩蛋
    const streakMilestones = [5, 10, 15, 20, 30, 50];
    if (streakMilestones.includes(practiceState._streak)) {
      const emojis = {5:'🔥',10:'💥',15:'⚡',20:'🌟',30:'💎',50:'👑'};
      showToast(emojis[practiceState._streak] + ' 完美连击！×' + practiceState._streak);
    }
  } else {
    practiceState._streak = 0;
  }
}

function regenerateCurrentBlanks() {

  if (card._manualBlanks || hasOverlappingBlanks(card)) {
    card._blankRound = (card._blankRound || 0) + 1;
  } else {
    Object.assign(card, regenerateBlanks(card, appData.settings.density || 'low'));

function hasOverlappingBlanks(card) {
  const all = card.blanks || [];
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      if (all[i].start < all[j].end && all[j].start < all[i].end) return true;
    }
  }
  return false;
}

function speakCard() {
  const ss = window.speechSynthesis;
  if (!ss) { showToast('浏览器不支持语音朗读'); return; }
  const card = practiceState.cards[practiceState.index];
  if (!card) return;
  // 切到不同卡片 → 取消旧的，重新开始
  if (practiceState._speakingCardId && practiceState._speakingCardId !== card.id) {
    ss.cancel(); practiceState._speakingCardId = null;
  }
  // 暂停 → 继续
  if (ss.speaking && ss.paused) { ss.resume(); return; }
  // 朗读中 → 暂停
  if (ss.speaking) { ss.pause(); return; }
  // 开始朗读
  practiceState._speakingCardId = card.id;
  doSpeakCard();
}

function doSpeakCard() {
  const card = practiceState.cards[practiceState.index];
  if (!card) return;
  const ss = window.speechSynthesis;
  ss.cancel();
  const rawText = card.fullText || card.question + card.answer;
  const cleanText = rawText.replace(/\\n/g, '，').replace(/\n/g, '，');
  var u = new SpeechSynthesisUtterance(cleanText);
  u.rate = appData.settings.voiceRate || 0.9;
  u.pitch = appData.settings.voicePitch || 1.0;

  var voices = ss.getVoices();
  // 1. 优先使用用户保存的指定语音
  var voiceName = appData.settings.voiceName;
  if (voiceName && voices.length) {
    var picked = voices.find(function(v) { return v.name === voiceName; });
    if (picked) { u.voice = picked; u.lang = picked.lang || 'zh-CN'; }
  }
  // 2. 没指定语音 → 自动匹配中文语音（兼容QQ浏览器/讯飞等）
  if (!u.voice && voices.length) {
    var zhVoice = voices.find(isChineseVoice);
    if (zhVoice) { u.voice = zhVoice; u.lang = zhVoice.lang || 'zh-CN'; }
  }
  // 3. 没找到中文语音 → 用第一个可用语音 + 中文 lang
  if (!u.voice && voices.length) {
    u.voice = voices[0];
  }
  // 4. 没有任何语音 → 设 lang 为 zh-CN，让引擎自行处理
  u.lang = u.lang || 'zh-CN';
  // 朗读结束后的行为
  const readMode = appData.settings.readMode || 'once';
  u.onend = () => {
    if (readMode === 'loop') {
      // 循环读同一题
      setTimeout(() => doSpeakCard(), 500);
    } else if (readMode === 'three-times') {
      practiceState._readCount = (practiceState._readCount || 0) + 1;
      if (practiceState._readCount < 3) {
        setTimeout(() => doSpeakCard(), 500);
      } else {
        practiceState._readCount = 0;
        // 3遍读完，自动下一题
        if (practiceState.index < practiceState.total - 1) {
          setTimeout(() => { nextCard(); setTimeout(() => doSpeakCard(), 300); }, 500);
        }
      }
    } else if (readMode === 'auto-next') {
      // 自动下一题
      if (practiceState.index < practiceState.total - 1) {
        setTimeout(() => { nextCard(); setTimeout(() => doSpeakCard(), 300); }, 500);
      }
    }
    // 'once' mode: do nothing
  };
  practiceState._readCount = 0;
  ss.speak(u);
}

function retrySameSettings() {
  const bankId = practiceState.bankId;
  const bank = appData.banks[bankId];
  if (!bank) return;
  const count = practiceState.total;
  let selected;
  const filteredCards = getFilteredCards(bank);
  if (practiceState.mode === 'sequential') {
    const pos = getSeqProgress(bankId);
    if (pos >= filteredCards.length) {
      appData.seqProgress[bankId] = 0;
      saveData(appData);
      selected = [...filteredCards.slice(0, count)];
    } else {
      selected = [...filteredCards.slice(pos, Math.min(pos + count, filteredCards.length))];
    }
  } else {
    selected = shuffle(filteredCards).slice(0, count);
  }
  const qh = new Set();
  if (hideQuestionStart) { for (const c of selected) qh.add(c.id); }
  practiceState = { ...practiceState, cards: selected, index: 0, answers: {}, revealed: new Set(), questionHidden: qh, koujueExpanded: {}, total: selected.length, answersHidden: false };
  $('practiceResult').style.display = 'none';
  $('practiceActive').style.display = 'block';
  renderPracticeCard();
}

function backToPracticeSetup() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  stopTimer();
  practiceState = null;
  $('practiceResult').style.display = 'none';
  $('practiceActive').style.display = 'none';
  renderPracticeSetup();
}

  browseState.filter = filter;

  if (si) si.value = '';
  document.querySelectorAll('#browseFilterChips .chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  // 收藏子分类：显示/隐藏
  const subChips = document.getElementById('browseStarSubChips');
  if (subChips) {
    subChips.style.display = filter === 'star' ? '' : 'none';
    if (filter === 'star') {
      subChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      const allChip = subChips.querySelector('[data-sub="all"]');
      if (allChip) allChip.classList.add('active');

  renderBrowseList();
}

}

function renderBrowseList() {
  const c = $('browseActive');
  const st = browseState;
  if (!st || !st.cards.length) { c.innerHTML = `<div class="empty"><p>题库为空</p></div>`; return; }

  // 筛选
  let cards = st.cards;
  const wbBrowse = getWrongBook(st.bankId);
  if (st.filter === 'star') {
    cards = cards.filter(c => c.starred);
    // 收藏子分类
    if (st.starSub === 'question') cards = cards.filter(c => !c.koujue && !(c.id in wbBrowse));
    else if (st.starSub === 'koujue') cards = cards.filter(c => c.koujue);
    else if (st.starSub === 'wrong') cards = cards.filter(c => c.id in wbBrowse);
  }
  if (st.filter === 'wrong') cards = cards.filter(c => c.id in wbBrowse);
			  if (st.filter === 'koujue') cards = cards.filter(c => c.koujue);
  // 搜索过滤
  if (st.searchQuery) {
    cards = cards.filter(c => (c.question || '').toLowerCase().includes(st.searchQuery) || (c.answer || '').toLowerCase().includes(st.searchQuery));
  }
  if (!cards.length) {
    let emptyMsg = '题库为空';
    if (st.searchQuery) emptyMsg = '未找到匹配"'+escapeHtml(st.searchQuery)+'"的题目';
    else if (st.filter === 'wrong') emptyMsg = '暂无错题，做题时诊断后自动收集';
    else if (st.filter === 'koujue') emptyMsg = '暂无口诀';
    else if (st.filter === 'star') {
      if (st.starSub === 'question') emptyMsg = '收藏中没有此类题目';
      else if (st.starSub === 'koujue') emptyMsg = '收藏中没有带口诀的题目';
      else if (st.starSub === 'wrong') emptyMsg = '收藏中没有错题';
      else emptyMsg = '暂无收藏';
    }
    c.innerHTML = '<div class="empty"><p>' + emptyMsg + '</p></div>';
    return;
  }

  // 按章节分组
  const groups = {};
  cards.forEach((card, i) => {
    const ch = card.chapter || '';
    if (!groups[ch]) groups[ch] = [];
    groups[ch].push({ ...card, _idx: st.cards.indexOf(card) });
  });
  // 保存筛选后的卡片列表，供详情导航使用
  st._filteredCards = cards.map(c => ({ ...c, _idx: st.cards.indexOf(c) }));

  let html = '';
  if (st.filter === 'koujue') {
    // 口诀卡片格式（带收藏和修改）
    for (const [chapter, list] of Object.entries(groups)) {
      if (chapter) html += '<div class="section-title" style="margin-top:12px">' + escapeHtml(chapter) + ' · ' + list.length + ' 条</div>';
      for (const card of list) {
        const parsed = typeof parseKoujue === 'function' ? parseKoujue(card.koujue || '') : [];
        const keywordsOnly = parsed.map(p => escapeHtml(p.char)).join(' ');
        html += '<div class="kj-card" id="kjb-' + card.id + '">';
        html += '<div class="kj-mnemonic" style="display:flex;justify-content:space-between;align-items:flex-start">';
        html += '<span style="flex:1">' + (keywordsOnly || escapeHtml(card.koujue || '')) + '</span>';
        html += '<span style="display:flex;gap:4px;flex-shrink:0">';
        html += '<span style="font-size:20px;cursor:pointer;padding:2px 6px;min-width:36px;display:inline-flex;align-items:center;justify-content:center" onclick="event.stopPropagation();toggleBrowseStarFromList(' + card._idx + ')">' + (card.starred ? '⭐' : '☆') + '</span>';
        html += '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();editKoujueBrowse(this)" data-cid="' + card.id + '" style="padding:2px 6px;font-size:12px;opacity:.4" title="编辑口诀">✏️</button>';
        html += '</span></div>';
        html += '<div class="kj-meaning" id="kjb-mean-' + card.id + '">';
        html += '<div style="font-size:12px;color:var(--text-tertiary);margin-bottom:6px">' + escapeHtml(card.question.replace(/^[\d\.\、\s]+/, '')) + '</div>';
        html += parsed.map(p => '<span class="kj-char">' + escapeHtml(p.char) + '</span><span class="kj-desc">（' + escapeHtml(p.desc) + '）</span>').join(' ');
        html += '</div>';
        html += '</div>';
      }
    }
  } else {
    // 普通列表格式
    for (const [chapter, list] of Object.entries(groups)) {
      if (chapter) html += '<div class="section-title" style="margin-top:12px">' + escapeHtml(chapter) + ' · ' + list.length + ' 题</div>';
      for (const card of list) {
        const qText = card.question.replace(/^[\d\.\、\s]+/, '').substring(0, 35);
        html += '<div class="browse-dir-item" onclick="openBrowseDetail(' + card._idx + ')">';
        html += '<span style="font-size:11px;color:var(--text-tertiary);min-width:28px">' + (card._idx + 1) + '</span>';
        html += '<span style="flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(qText) + '</span>';
        html += '<span style="font-size:20px;flex-shrink:0;cursor:pointer;padding:6px 10px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center" onclick="event.stopPropagation();toggleBrowseStarFromList(' + card._idx + ')">' + (card.starred ? '⭐' : '☆') + '</span>';
        html += '</div>';
      }
    }
  }

  c.innerHTML = html;

  // 口诀卡片点击展开事件
  if (st.filter === 'koujue') {
    cards.forEach(card => {
      const el = document.getElementById('kjb-' + card.id);
      const meanEl = document.getElementById('kjb-mean-' + card.id);
      if (el && meanEl) {
        el.onclick = () => {
          const showing = meanEl.classList.contains('show');
          document.querySelectorAll('#browseActive .kj-meaning.show').forEach(m => m.classList.remove('show'));
          if (!showing) meanEl.classList.add('show');
        };
      }
    });
  }
}

function getFilteredKjCards(bank) {
  if (!bank || !bank.cards) return [];
  const kjCards = bank.cards.filter(x => x.koujue);
  if (!kjCategoryFilter || !kjCategoryFilter.size) return kjCards;
  return kjCards.filter(c => {
    const q = (c.question || "").trim();
    const matches = q.match(/（[^）]{1,8}）/g) || [];
    return matches.some(m => kjCategoryFilter.has(m));
  });
}

function renderKjCategoryFilter() {
  const div = document.getElementById("kjCategoryFilter");
  if (!div) return;

  if (!sel) return;

  if (!bank) { div.innerHTML = ""; return; }
  const cats = extractCategories(bank);
  if (!cats.length) { div.innerHTML = ""; return; }
  if (!kjCategoryFilter) kjCategoryFilter = new Set(cats);
  let h = "<label class=\"form-label\" style=\"font-size:13px\">🏷️ 分类筛选</label><div class=\"chip-group\">";
  h += "<span class=\"chip" + (kjCategoryFilter.size === cats.length ? " active" : "") + "\" onclick=\"toggleAllKjCategories()\">全部</span>";
  for (const cat of cats) {
    h += "<span class=\"chip" + (kjCategoryFilter.has(cat) ? " active" : "") + "\" onclick=\"toggleKjCategory('" + cat + "')\" style=\"margin-left:4px\">" + cat + "</span>";

function toggleAllKjCategories() {

  const cats = extractCategories(bank);
  if (kjCategoryFilter && kjCategoryFilter.size === cats.length) kjCategoryFilter = new Set();

  renderKoujueCards();

function toggleKjCategory(cat) {
  if (!kjCategoryFilter) return;

    if (kjCategoryFilter.size <= 1) return;

function renderKoujueCards() {
  const sel = document.getElementById('kjBankSelect');
  if (!sel) return;
  const bank = appData.banks[sel.value];
  if (!bank) return;
  const cards = getFilteredKjCards(bank);
  renderKjCategoryFilter();
  if (!cards.length) { document.getElementById('kjList').innerHTML = `<div class="empty"><p>该分类下没有口诀</p></div>`; return; }

  const groups = {};
  cards.forEach(card => { const ch = card.chapter || '未分类'; if (!groups[ch]) groups[ch] = []; groups[ch].push(card); });

  let html = '';
  for (const [chapter, list] of Object.entries(groups)) {
    html += `<div class="section"><div class="section-title">${escapeHtml(chapter)} · ${list.length} 条</div>`;
    for (const card of list) {
      const parsed = parseKoujue(card.koujue);
      const keywordsOnly = parsed.map(p => escapeHtml(p.char)).join(' ');
      html += `<div class="kj-card" id="kj-${card.id}">
        <div class="kj-mnemonic">
          ${keywordsOnly || escapeHtml(card.koujue)}
          <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();editKoujue('${card.id}')" style="padding:2px 6px;font-size:12px;opacity:.4;float:right" title="编辑口诀">✏️</button>

          ${parsed.map(p => `<span class="kj-char">${escapeHtml(p.char)}</span><span class="kj-desc">（${escapeHtml(p.desc)}）</span>`).join(' ')}
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  document.getElementById('kjList').innerHTML = html;

  for (const card of cards) {
    const el = document.getElementById('kj-' + card.id);
    const meanEl = document.getElementById('kj-mean-' + card.id);

      el.onclick = () => {

        if (!showing) meanEl.classList.add('show');
      };

function parseKoujue(kj) {
  if (!kj) return [];
  const result = [];
  const re = /[^\s，,。！!？?、；;：:""''（）()《》—\-]+（[^）]*）/g;
  let m;
  while ((m = re.exec(kj)) !== null) {
    const full = m[0], li = full.lastIndexOf('（');
    if (li > 0) result.push({ char: full.substring(0, li), desc: full.substring(li + 1, full.length - 1) });
  }
  if (!result.length && kj.trim()) result.push({ char: kj.trim(), desc: '' });
  return result;
}

function renderWrongBookStart() {
  const c = $('wrongbookContainer');
  const banks = Object.values(appData.banks).sort((a,b) => b.createdAt - a.createdAt);

  const banksWithWrong = [];
  banks.forEach(b => {
    const wb = getWrongBook(b.id);
    const wrongIds = Object.keys(wb).filter(id => wb[id] && wb[id].wrongIndices && wb[id].wrongIndices.length > 0);
    if (wrongIds.length) banksWithWrong.push({ bank: b, wrongIds, wb });
  });

  if (!banksWithWrong.length) {
    c.innerHTML = '<div class="empty"><span class="icon">❌</span><h3>暂无错题</h3><p>做题时诊断后自动收集错题</p></div>';

  }

  let currentBankId = sessionStorage.getItem('wrongbookBank');
  if (!currentBankId || !appData.banks[currentBankId] || !Object.keys(getWrongBook(currentBankId)).length) {
    currentBankId = banksWithWrong[0].bank.id;
  }
  let currentData = banksWithWrong.find(b => b.bank.id === currentBankId);
  if (!currentData) currentData = banksWithWrong[0];
  currentBankId = currentData.bank.id;
  sessionStorage.setItem('wrongbookBank', currentBankId);

  const wrongCards = [];
  currentData.wrongIds.forEach(id => {

    if (card) wrongCards.push({ card, wrongDetail: currentData.wb[id] || {} });

  const groups = {};

// ====== 分享/导出备份 ======
async function shareBackupCode() {
  try {
    showToast('正在生成备份码...');
    var data = JSON.parse(JSON.stringify(appData));
    var code = await makeBackupCode(JSON.stringify(data));
    var today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    var textToShare = '挖空背诵工具 - 进度备份 ' + today + '\n\n' + code + '\n\n📌 使用方法：复制全部内容 → 打开工具设置页 → 粘贴备份码恢复';
    if (navigator.canShare && navigator.canShare({ text: textToShare })) {
      try {
        await navigator.share({ text: textToShare, title: '挖空背诵备份 - ' + today });
        appData.settings.lastBackup = Date.now();
        saveData(appData);
        showToast('✅ 备份码已分享');
        return;
      } catch (err) { if (err.name === 'AbortError') return; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(code);
        appData.settings.lastBackup = Date.now();
        saveData(appData);
        showToast('📋 分享不支持，已改为复制到剪贴板');
      } catch(e) { showToast('复制失败'); }
    } else { showToast('复制失败'); }
  } catch(e) { showToast('导出失败'); }
}

async function shareBackupFile() {
  try {
    var data = JSON.parse(JSON.stringify(appData));
    var json = JSON.stringify(data);
    var today = new Date().toISOString().slice(0, 10);
    var filename = '挖空背诵备份_' + today + '.json';
    var blob = new Blob([json], { type: 'application/json' });
    var file = new File([blob], filename, { type: 'application/json' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: '挖空背诵数据备份', text: '挖空背诵工具数据备份 - ' + today });
        appData.settings.lastBackup = Date.now();
        saveData(appData);
        showToast('✅ 分享成功');
        return;
      } catch (err) { if (err.name === 'AbortError') return; }
    }
    // Fallback: 下载 JSON
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    appData.settings.lastBackup = Date.now();
    saveData(appData);
    showToast('✅ 已下载 ' + filename);
  } catch(e) { showToast('导出失败'); }
}

function restoreFromJsonFile(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var backup = JSON.parse(e.target.result);
      if (!backup.banks) { showToast('❌ 无效的备份文件（缺少题库数据）'); return; }
      if (!confirm('将用此备份完全替换当前所有数据（题库、进度、设置），确定继续吗？')) return;
      if (!backup.settings) backup.settings = { density: 'low', darkMode: false, fontSize: 16 };
      if (!backup.seqProgress) backup.seqProgress = {};
      if (!backup.favorites) backup.favorites = {};
      if (!backup.wrongBooks) backup.wrongBooks = {};
      appData = backup;
      saveData(appData);
      applySettings();
      renderBanks();
      renderSettings();
      updateBadges();
      switchTab('banks');
      showToast('✅ 数据已全部恢复');
    } catch(err) { showToast('❌ 文件格式错误，无法解析'); }
  };
  reader.readAsText(file);
  input.value = '';
}

// 折叠/展开 section，状态持久化到 settings
function toggleSection(sectionId) {
  var collapsed = appData.settings.collapsedSections || {};
  var isNow = !collapsed[sectionId];
  collapsed[sectionId] = isNow;
  appData.settings.collapsedSections = collapsed;
  debouncedSaveData(appData);
  applyCollapseState(sectionId, isNow);
}

function applyCollapseState(sectionId, isCollapsed) {
  var body = document.getElementById('body_' + sectionId);
  var arrow = document.getElementById('arrow_' + sectionId);
  if (body) {
    if (isCollapsed) {
      body.style.maxHeight = '0px';
      body.style.opacity = '0';
      body.style.margin = '0';
    } else {
      body.style.maxHeight = body.scrollHeight + 'px';
      body.style.opacity = '1';
      body.style.margin = '';
    }
  }
  if (arrow) {
    if (isCollapsed) arrow.classList.add('collapsed');
    else arrow.classList.remove('collapsed');
  }
}

// 头像上传
function handleAvatarUpload(el) {
  var file = el.files[0]; if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showToast('头像图片不能超过 2MB'); el.value = ''; return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      // 短边压缩到 200px，保持比例
      var maxSide = 200;
      var w = img.width, h = img.height;
      if (w > maxSide || h > maxSide) {
        var ratio = Math.min(maxSide / w, maxSide / h);
        w = Math.round(w * ratio); h = Math.round(h * ratio);
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      appData.settings.avatarData = dataUrl;
      debouncedSaveData(appData);
      renderSettings();
      showToast('✅ 头像已保存');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  el.value = '';
}

function isChineseVoice(v) {
  const lang = (v.lang || '').toLowerCase();
  const name = (v.name || '').toLowerCase();
  // 标准中文 lang 标签
  if (lang.startsWith('zh')) return true;
  // ISO 639-3 官话
  if (lang.startsWith('cmn')) return true;
  // 部分引擎（如讯飞）使用 yue 粤语也算中文
  if (lang.startsWith('yue')) return true;
  // 按语音名称匹配：常见中文 TTS 引擎的关键词
  const cnKeywords = ['中文', '普通话', '国语', 'chinese', 'mandarin', 'cantonese', '讯飞', 'xunfei', 'xiaoxiao', 'yunyang', 'hanhan', 'yating', 'zhiwei', 'kangkang', 'yaoyao', '小小', '云希', '晓晓', '云扬'];
  for (var i = 0; i < cnKeywords.length; i++) {
    if (name.indexOf(cnKeywords[i].toLowerCase()) !== -1) return true;
  }
  return false;
}

function loadVoices() {
  if (!window.speechSynthesis) return;
  var voices = window.speechSynthesis.getVoices();
  if (!voices.length) {
    // Chrome 等浏览器异步加载语音列表，监听 voiceschanged 事件
    window.speechSynthesis.onvoiceschanged = function() {
      window.speechSynthesis.onvoiceschanged = null;
      loadVoices();
    };
    // 兜底：200ms 后重试（QQ浏览器可能需要更长时间）
    setTimeout(function() { if (window.speechSynthesis) loadVoices(); }, 500);
    return;
  }
  // 过滤中文语音，兼容各种引擎（系统TTS、讯飞、QQ浏览器等）
  var zhVoices = voices.filter(isChineseVoice);
  _availableVoices = zhVoices.length ? zhVoices : voices;
}

async function makeBackupCode() {
  // 深拷贝并精简：删除可重建的冗余字段，缩小备份码
  const copy = JSON.parse(JSON.stringify(appData));
  for (const b of Object.values(copy.banks || {})) {
    for (const card of b.cards || []) {
      delete card.fullText;       // = question + '\n' + answer，可重建
      delete card._charSelected;  // 编辑中间态，无需备份
      delete card._savedChars;
      delete card._autoBlanks;
    }
  }
  const json = JSON.stringify(copy);
  // deflate-raw 压缩（比 gzip 略小，去掉 gzip 头尾）
  if (typeof CompressionStream !== 'undefined') {
    try {
      const blob = new Blob([json]);
      const cs = new CompressionStream('deflate-raw');
      const stream = blob.stream().pipeThrough(cs);
      const compressed = await new Response(stream).blob();
      const bytes = new Uint8Array(await compressed.arrayBuffer());
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return 'D' + btoa(bin);
    } catch(e) {}
  }
  // 不支持压缩时用原始 base64
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return 'U' + btoa(bin);
}

async function copyBackup() {
  if (!isPermanentAuth()) { showToast('试用版不支持导出'); return; }
  try {
    showToast('正在生成备份码...');
    const code = await makeBackupCode();
    // 直接复制，不弹窗
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(code);
        showToast('✅ 备份码已复制到剪贴板（' + code.length + '字符）');
        return;
      } catch(e) {}
    }
    // 兜底：fallback 到旧版弹窗
    showBackupModal(code);
  } catch(e) { showToast('导出失败'); }
}

function showBackupModal(code) {
  var ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.id = 'backupModal';
  ov.innerHTML = '<div class="modal" style="border-radius:var(--radius);max-width:380px;margin:auto;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px">'
    + '<h3 style="margin-bottom:10px">📋 备份码（' + code.length + '字符）</h3>'
    + '<textarea id="backupCodeText" readonly style="width:100%;min-height:80px;font-size:11px;word-break:break-all;padding:10px;border:2px solid var(--border);border-radius:8px;background:var(--bg-input);color:var(--text)">' + code + '</textarea>'
    + '<div class="flex gap-8 mt-12"><button class="btn btn-primary flex-1" onclick="copyBackupCode()">📋 一键复制</button>'
    + '<button class="btn btn-ghost flex-1" onclick="document.getElementById(\'backupModal\').remove()">关闭</button></div>'
    + '</div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e) { if (e.target === ov) ov.remove(); });
}

function copyBackupCode() {
  var ta = document.getElementById('backupCodeText');
  ta.select();
  try {
    document.execCommand('copy');
    showToast('已复制到剪贴板');
  } catch(e) {
    ta.setSelectionRange(0, ta.value.length);
    navigator.clipboard.writeText(ta.value).then(function() {
      showToast('已复制到剪贴板');
    }).catch(function() {
      showToast('复制失败，请长按手动复制');
    });
  }
}

function toggleRestoreSection() {
  const sec = document.getElementById('restoreSection');
  const btn = document.getElementById('restoreToggleBtn');
  if (!sec || !btn) return;
  const showing = sec.style.display !== 'none';
  sec.style.display = showing ? 'none' : 'block';
  if (!showing) {
    // 展开时聚焦输入框
    setTimeout(function() {
      var ta = document.getElementById('restoreTextarea');
      if (ta) ta.focus();
    }, 100);
  }
}

async function doRestore() {
  const code = document.getElementById('restoreTextarea').value.trim();
  if (!code) { showToast('请粘贴备份码'); return; }
  try {
    const prefix = code[0];
    const base64 = code.slice(1);
    const bin = atob(base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

    let json;
    if ((prefix === 'Z' || prefix === 'D') && typeof DecompressionStream !== 'undefined') {
      // 压缩的备份码（Z=gzip旧版，D=deflate-raw新版）
      const format = prefix === 'D' ? 'deflate-raw' : 'gzip';
      try {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format));
        json = await new Response(stream).text();
      } catch(e) { json = new TextDecoder().decode(bytes); }
    } else {
      // 未压缩的备份码（兼容旧版）
      json = new TextDecoder().decode(bytes);
    }

    const data = JSON.parse(json);
    if (!data.banks) { showToast('备份码无效'); return; }
    // 恢复后重建 fullText（备份中已精简掉）
    for (const b of Object.values(data.banks || {})) {
      for (const card of b.cards || []) {
        if (!card.fullText) card.fullText = (card.question || '') + '\n' + (card.answer || '');
      }
    }
    appData = data;
    saveData(appData);
    showToast('恢复成功！');
    setTimeout(() => location.reload(), 800);
  } catch(e) { showToast('备份码无效'); }
}

function clearWrongBook() {
  showConfirm('清空错题本', '确定清空所有题库的错题记录吗？', () => {
    appData.wrongBooks = {};
    saveData(appData);
    showToast('错题本已清空');
  });
}

function clearAllData() {
  showConfirm('删除所有数据', '此操作不可撤销！将删除所有题库、设置和进度。', () => {
    appData = { banks: {}, settings: {}, seqProgress: {}, favorites: {}, wrongBooks: {} };
    saveData(appData);
    showToast('已全部删除');
    switchTab('banks');
  });
}
// ====== PWA：Service Worker 注册 + 安装引导 ======
(function() {
  // 注册 Service Worker（离线缓存）
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function() {});
  }

  // 检测是否已经以 PWA 模式运行
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches
    || (typeof navigator.standalone !== 'undefined' && navigator.standalone)
    || window.location.search.indexOf('pwa=1') !== -1;

  // ====== Android/桌面：beforeinstallprompt ======
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone) showAndroidBanner();
  });

  window.pwaInstall = function() {
    if (!deferredPrompt) {
      alert('请使用浏览器的"添加到主屏幕"功能安装');
      return;
    }
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(result) {
      if (result.outcome === 'accepted') {
        var banner = document.getElementById('pwaInstallBanner');
        if (banner) banner.classList.remove('show');
      }
      deferredPrompt = null;
    });
  };

  function showAndroidBanner() {
    var banner = document.getElementById('pwaInstallBanner');
    if (banner && !localStorage.getItem('pwa_banner_dismissed')) {
      setTimeout(function() { banner.classList.add('show'); }, 2000);
    }
  }

  window.pwaDismissBanner = function() {
    var banner = document.getElementById('pwaInstallBanner');
    if (banner) banner.classList.remove('show');
    localStorage.setItem('pwa_banner_dismissed', '1');
  };

  // ====== iOS Safari 安装引导 ======
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isSafari = /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|OPiOS|mercury/.test(navigator.userAgent);

  if (isIOS && isSafari && !isStandalone && !localStorage.getItem('pwa_ios_banner_dismissed')) {
    setTimeout(function() {
      var banner = document.getElementById('pwaIosBanner');
      if (banner) banner.classList.add('show');
    }, 2500);
  }

  window.pwaDismissIosBanner = function() {
    var banner = document.getElementById('pwaIosBanner');
    if (banner) banner.classList.remove('show');
    localStorage.setItem('pwa_ios_banner_dismissed', Date.now().toString());
  };

  // 如果已安装 PWA，隐藏所有横幅
  if (isStandalone) {
    var ab = document.getElementById('pwaInstallBanner');
    var ib = document.getElementById('pwaIosBanner');
    if (ab) ab.style.display = 'none';
    if (ib) ib.style.display = 'none';
  }

  // 安装成功后隐藏横幅
  window.addEventListener('appinstalled', function() {
    var banner = document.getElementById('pwaInstallBanner');
    if (banner) banner.classList.remove('show');
    localStorage.setItem('pwa_banner_dismissed', '1');
  });

  // 监听 display-mode 变化（用户手动添加到桌面后刷新）
  window.matchMedia('(display-mode: standalone)').addEventListener('change', function(e) {
    if (e.matches) {
      var ab = document.getElementById('pwaInstallBanner');
      var ib = document.getElementById('pwaIosBanner');
      if (ab) ab.style.display = 'none';
      if (ib) ib.style.display = 'none';
    }
  });
})();
// ====== PWA END ======
</script>

  s.onerror = function() { _zlMarkmapLoaded = false; container.innerHTML = '<div style="text-align:center;padding:30px"><p style="color:var(--danger);margin-bottom:12px">⚠️ 思维导图组件加载失败，请检查网络连接</p><button onclick="_zlMarkmapLoaded=false;loadMarkmap()" style="padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;min-height:40px">🔄 重试</button></div>'; };
  document.head.appendChild(s);
}

// 自建 Markdown → 思维导图树 解析器（无需 markmap-lib）
function mdToTree(mdText) {
  var lines = mdText.split('\n');
  var root = { content: 'Root', children: [] };
  var stack = [{ node: root, level: 0 }];
  var baseLevel = 0; // 最近的 heading 层级，列表项基础层级=baseLevel+1

  function cleanInline(s) {
    return s.replace(/\*\*(.+?)\*\*/g, '$1').replace(/__(.+?)__/g, '$1')
            .replace(/\*(.+?)\*/g, '$1').replace(/_(.+?)_/g, '$1')
            .replace(/`(.+?)`/g, '$1').trim();
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (!line.trim()) continue;

    // 预处理 ^ 层级语法：^ 数量 → 缩进。^ = 一级，^^ = 二级 ...
    var hatMatch = line.match(/^(\^+)\s+(.+)/);
    if (hatMatch) {
      var hatDepth = hatMatch[1].length;
      var hatText = hatMatch[2];
      line = '  '.repeat(hatDepth - 1) + '- ' + hatText;
    }

    var hMatch = line.match(/^(#{1,6})\s+(.+)/);
    var liMatch = line.match(/^(\s*)[-*+•◦▪]\s+(.+)/);
    var numMatch = line.match(/^(\s*)(\d+)[\.\)、]\s+(.+)/);

    if (hMatch) {
      var level = hMatch[1].length;
      baseLevel = level;
      var title = cleanInline(hMatch[2]);
      var newNode = { content: title, children: [] };
      while (stack.length > 1 && stack[stack.length - 1].level >= level) {
        stack.pop();
      }
      stack[stack.length - 1].node.children.push(newNode);
      stack.push({ node: newNode, level: level });
    } else if (liMatch) {
      // 列表项：缩进越深层级越高，2空格≈1级
      var indent = liMatch[1].length;
      // 无缩进时，◦=二级符号 → 隐式2空格，▪=三级符号 → 隐式4空格
      if (indent === 0) {
        var rawBullet = line.trim().charAt(0);
        if (rawBullet === '◦') indent = 2;
        else if (rawBullet === '▪') indent = 4;
      }
      var text = cleanInline(liMatch[2]);
      var itemLevel = baseLevel + 1 + Math.floor(indent / 2);
      while (stack.length > 1 && stack[stack.length - 1].level >= itemLevel) {
        stack.pop();
      }
      var newNode = { content: text, children: [] };
      stack[stack.length - 1].node.children.push(newNode);
      stack.push({ node: newNode, level: itemLevel });
    } else if (numMatch) {
      // 编号项：同列表项，用缩进判断层级
      var indent2 = numMatch[1].length;
      var text2 = cleanInline(numMatch[3]);
      var itemLevel2 = baseLevel + 1 + Math.floor(indent2 / 2);
      while (stack.length > 1 && stack[stack.length - 1].level >= itemLevel2) {
        stack.pop();
      }
      var newNode2 = { content: text2, children: [] };
      stack[stack.length - 1].node.children.push(newNode2);
      stack.push({ node: newNode2, level: itemLevel2 });
    } else {
      // 普通文本：叶子节点，不改变栈层级
      var text3 = line.trim();
      var parent = stack[stack.length - 1].node;
      parent.children.push({ content: text3, children: [] });
    }
  }

  if (root.children.length === 1) return root.children[0];
  if (root.children.length === 0) {
    var summary = mdText.trim().split('\n').slice(0, 3).map(function(l) { return l.trim(); }).filter(Boolean).join(' / ');
    return { content: summary || '空白笔记', children: [] };
  }
  return root;
}

function renderMarkmapFromContent() {
  var container = document.getElementById('zlMindMapTarget');
  if (!container) return;
  saveEditorState();
  var content = _zlNoteContent;
  if (!content.trim()) {
    container.innerHTML = '<p style="color:var(--text-tertiary);text-align:center;padding:30px">先写点内容再切换到导图视图吧～</p>';
    return;
  }

  try {
    var d3 = window.d3;
    if (!d3) { container.innerHTML = '<div style="text-align:center;padding:30px"><p style="color:var(--danger);margin-bottom:12px">d3.js 未加载</p><button onclick="_zlMarkmapLoaded=false;loadMarkmap()" style="padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;min-height:40px">🔄 重试</button></div>'; return; }

    var data = mdToTree(content);
    // 根节点使用笔记标题
    if (_zlNoteTitle) data.content = _zlNoteTitle;

    // 保存当前缩放状态
    var oldSvg = container.querySelector('svg');
    if (oldSvg && window.d3) {
      try { var oldT = d3.zoomTransform(oldSvg); _mmSavedTransform = {k: oldT.k, x: oldT.x, y: oldT.y}; } catch(e) { _mmSavedTransform = null; }
    }

    // 移除旧内容
    container.innerHTML = '';

    var W = container.clientWidth || 700;
    var H = Math.max(container.clientHeight, 400);

    // 创建 SVG
    var svg = d3.select(container).append('svg')
      .attr('width', W).attr('height', H)
      .style('display', 'block')
      .style('touch-action', 'pan-y')
      .style('min-height', '400px');

    var gRoot = svg.append('g');

    // 缩放
    var zoom = d3.zoom()
      .scaleExtent([0.12, 4])
      .on('zoom', function(event) { gRoot.attr('transform', event.transform); });
    svg.call(zoom);

    var treeLayout = d3.tree().nodeSize([26, 150]);
    var depthColors = ['#4A90D9','#3CB371','#E67E22','#8E44AD','#E74C3C','#1ABC9C','#5DADE2','#F39C12'];

    // ===== 更新函数（带首次参数）=====
    function update(source, isFirst) {
      treeLayout(root);
      var nodes = root.descendants();
      var links = root.links();
      var dur = 0; // 去掉过渡动画，直接展示避免卡顿

      // --- 链接 ---
      var link = gRoot.selectAll('.mm-link').data(links, function(d) { return d.target._uid; });
      link.exit().remove();
      link.enter().append('path')
        .attr('class', 'mm-link').attr('fill', 'none')
        .attr('stroke', '#bbb').attr('stroke-width', 1.5)
        .merge(link)
        .transition().duration(dur)
        .attr('d', d3.linkHorizontal().x(function(d) { return d.y; }).y(function(d) { return d.x; }));

      // --- 节点 ---
      var node = gRoot.selectAll('.mm-node').data(nodes, function(d) { return d._uid; });
      node.exit().remove();

      var nodeEnter = node.enter().append('g')
        .attr('class', 'mm-node')
        .attr('cursor', 'pointer');

      nodeEnter.append('rect').attr('rx', 6).attr('ry', 6);
      nodeEnter.append('circle').attr('fill', '#fff').attr('opacity', 0.8);
      nodeEnter.append('text')
        .attr('dy', '0.35em').attr('text-anchor', 'start')
        .attr('fill', '#fff').attr('font-size', '13px')
        .attr('font-family', '-apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif')
        .attr('font-weight', function(d) { return d.depth === 0 ? 'bold' : 'normal'; });

      var nodeMerge = nodeEnter.merge(node);

      nodeMerge.transition().duration(dur)
        .attr('transform', function(d) { return 'translate(' + d.y + ',' + d.x + ')'; });

      nodeMerge.select('rect')
        .attr('x', -6).attr('y', -11)
        .attr('width', function(d) { return Math.max(d.data.content.length * 13 + 12, 36); })
        .attr('height', 22)
        .attr('fill', function(d) { return depthColors[Math.min(d.depth, depthColors.length - 1)]; });

      nodeMerge.select('circle')
        .attr('r', function(d) { return (d.children || d._children) ? 3 : 0; })
        .attr('cx', function(d) { return Math.max(d.data.content.length * 13 + 8, 32); })
        .attr('cy', 0);

      nodeMerge.select('text')
        .attr('x', 0)
        .text(function(d) { return d.data.content; });

      var _mmClickTimer = null;
      nodeMerge.on('click', function(event, d) {
        event.stopPropagation();
        if (d.depth === 0) {
          // 根节点：单击直接编辑
          startEditMindmapNode(d, this);
          return;
        }
        if (_mmClickTimer) { clearTimeout(_mmClickTimer); _mmClickTimer = null; return; }
        _mmClickTimer = setTimeout(function() {
          _mmClickTimer = null;
          if (d.children) { d._children = d.children; d.children = null; }
          else if (d._children) { d.children = d._children; d._children = null; }
          update(d, false);
        }, 280);
      });

      nodeMerge.on('dblclick', function(event, d) {
        event.stopPropagation();
        if (_mmClickTimer) { clearTimeout(_mmClickTimer); _mmClickTimer = null; }
        startEditMindmapNode(d, this);
      });

      // 右键菜单
      nodeMerge.on('contextmenu', function(event, d) {
        event.preventDefault();
        event.stopPropagation();
        showMindmapContextMenu(d, event.clientX, event.clientY);
      });

      // 长按检测（≥600ms）
      nodeMerge.on('touchstart', function(event, d) {
        _mmTouchMoved = false;
        _mmLongPressNode = d;
        if (_mmLongPressTimer) clearTimeout(_mmLongPressTimer);
        _mmLongPressTimer = setTimeout(function() {
          _mmLongPressTimer = null;
          if (!_mmTouchMoved && _mmLongPressNode) {
            var touch = event.changedTouches ? event.changedTouches[0] : null;
            var x = touch ? touch.clientX : event.clientX;
            var y = touch ? touch.clientY : event.clientY;
            showMindmapContextMenu(_mmLongPressNode, x, y + 10);
            _mmLongPressNode = null;
          }
        }, 600);
      });
      nodeMerge.on('touchmove', function() { _mmTouchMoved = true; });
      nodeMerge.on('touchend', function() {
        if (_mmLongPressTimer) { clearTimeout(_mmLongPressTimer); _mmLongPressTimer = null; }
      });

      root.each(function(d) { d.x0 = d.x; d.y0 = d.y; });
    }

    var root = d3.hierarchy(data);
    var _uid = 0;
    root.each(function(d) { d._uid = _uid++; });

    (function expandAll(node) {
      if (node._children) { node.children = node._children; node._children = null; }
      if (node.children) node.children.forEach(expandAll);
    })(root);

    // 首次无过渡渲染
    update(root, true);

    // 渲染完成后恢复缩放（有保存的状态则恢复，否则自适应）
    requestAnimationFrame(function() {
      try {
        if (_mmSavedTransform && _mmSavedTransform.k) {
          svg.call(zoom.transform, d3.zoomIdentity.translate(_mmSavedTransform.x, _mmSavedTransform.y).scale(_mmSavedTransform.k));
          _mmSavedTransform = null;
        } else {
          var bounds = gRoot.node().getBBox();
          if (!bounds || bounds.width === 0 || bounds.height === 0) return;
          var scale = Math.min(W / bounds.width, H / bounds.height, 1.2) * 0.88;
          var tx = (W - bounds.width * scale) / 2 - bounds.x * scale;
          var ty = (H - bounds.height * scale) / 2 - bounds.y * scale;
          svg.transition().duration(200).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
        }
      } catch(e) {}
    });

  } catch(e) {
    console.error('Mindmap render error:', e);
    container.innerHTML = '<div style="text-align:center;padding:30px"><p style="color:var(--danger);margin-bottom:12px">⚠️ 导图渲染失败：' + escapeHtml(e.message || '未知错误') + '</p><button onclick="switchToMindMap()" style="padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;min-height:40px">🔄 重试</button><p style="font-size:11px;color:var(--text-tertiary);margin-top:8px">如持续失败，请检查笔记内容是否包含特殊字符</p></div>';
  }
}

// ====== 双击编辑导图节点 ======
function startEditMindmapNode(d, nodeEl) {
  var container = document.getElementById('zlMindMapTarget');
  if (!container) return;
  var svg = container.querySelector('svg');
  if (!svg) return;

  var svgRect = svg.getBoundingClientRect();
  var textEl = d3.select(nodeEl).select('text').node();
  if (!textEl) return;
  var textRect = textEl.getBoundingClientRect();

  // 编辑栏容器
  var bar = document.createElement('div');
  bar.style.cssText = 'position:absolute;' +
    'left:' + (textRect.left - svgRect.left - 6) + 'px;' +
    'top:' + (textRect.top - svgRect.top - 3) + 'px;' +
    'display:flex;align-items:center;gap:4px;z-index:100;';

  var input = document.createElement('input');
  input.type = 'text';
  input.value = d.data.content;
  input.style.cssText = 'min-width:' + Math.max(textRect.width + 24, 100) + 'px;' +
    'height:' + Math.max(textRect.height + 6, 26) + 'px;' +
    'font-size:13px;border:2px solid #4A90D9;border-radius:4px;' +
    'padding:2px 8px;background:#fff;' +
    'font-family:inherit;outline:none;' +
    'box-shadow:0 0 8px rgba(74,144,217,0.35);' +
    'box-sizing:border-box;';

  // ✅ 完成按钮（放在输入框左边）
  var doneBtn = document.createElement('button');
  doneBtn.textContent = '✅';
  doneBtn.title = '完成编辑';
  doneBtn.style.cssText = 'width:28px;height:28px;padding:0;border:1px solid #4A90D9;border-radius:4px;' +
    'background:#fff;color:#4A90D9;font-size:14px;cursor:pointer;' +
    'display:flex;align-items:center;justify-content:center;flex-shrink:0;';
  doneBtn.addEventListener('mousedown', function(e) { e.preventDefault(); e.stopPropagation(); });
  doneBtn.addEventListener('click', function(e) {
    e.preventDefault(); e.stopPropagation();
    finishEdit();
  });
  bar.appendChild(doneBtn);
  bar.appendChild(input);

  // 非 Root 节点添加删除按钮（放在右边）
  if (d.depth > 0) {
    var delBtn = document.createElement('button');
    delBtn.textContent = '🗑';
    delBtn.title = '删除此节点';
    delBtn.style.cssText = 'width:28px;height:28px;padding:0;border:1px solid #e74c3c;border-radius:4px;' +
      'background:#fff;color:#e74c3c;font-size:14px;cursor:pointer;' +
      'display:flex;align-items:center;justify-content:center;flex-shrink:0;';
    delBtn.addEventListener('mousedown', function(e) { e.preventDefault(); e.stopPropagation(); });
    delBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      bar.remove();
      deleteMindmapNode(d);
    });
    bar.appendChild(delBtn);
  }

  container.style.position = 'relative';
  container.appendChild(bar);
  input.focus();
  input.select();

  var oldText = d.data.content;
  function finishEdit() {
    var newText = input.value.trim();
    bar.remove();
    if (!newText || newText === oldText) return;

    // 更新树节点
    d.data.content = newText;

    // 直接更新 SVG（不重渲染，保持缩放）
    try {
      d3.select(nodeEl).select('text').text(newText);
      var rectSel = d3.select(nodeEl).select('rect');
      if (!rectSel.empty()) {
        rectSel.attr('width', Math.max(newText.length * 13 + 8, 32));
      }
    } catch(e) {}

    // 回写到笔记原文
    if (d.depth === 0) {
      _zlNoteTitle = newText;
      var ti = document.getElementById('zlNoteTitleInput');
      if (ti) ti.value = newText;
      if (typeof saveCurrentNoteSilent === 'function') saveCurrentNoteSilent();
    } else if (typeof _zlNoteContent !== 'undefined' && _zlNoteContent) {
      var escaped = oldText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('^(#{0,6}\\s*)' + escaped + '\\s*$', 'm');
      if (re.test(_zlNoteContent)) {
        _zlNoteContent = _zlNoteContent.replace(re, '$1' + newText);
      } else {
        _zlNoteContent = _zlNoteContent.replace(oldText, newText);
      }
      if (typeof saveEditorState === 'function') saveEditorState();
    }
  }

  input.addEventListener('blur', finishEdit);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); finishEdit(); }
    if (e.key === 'Escape') { input.value = oldText; bar.remove(); }
  });
}

// ====== 删除导图节点 ======
function deleteMindmapNode(d) {
  if (!d || d.depth === 0) return; // 不允许删除根节点
  var nodeText = d.data.content;
  if (!confirm('确定删除「' + nodeText + '」及其所有子节点吗？')) return;

  // 从源文本中删除对应行
  if (typeof _zlNoteContent !== 'undefined' && _zlNoteContent) {
    var escaped = nodeText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    // 匹配标题行：可选 # 前缀 + 文本
    var re = new RegExp('^#{0,6}\\s*' + escaped + '\\s*$', 'm');
    if (re.test(_zlNoteContent)) {
      _zlNoteContent = _zlNoteContent.replace(re, '').replace(/\n{3,}/g, '\n\n');
    } else {
      // 匹配列表项行：可选缩进 + 列表标记 + 文本
      var liRe = new RegExp('^(\\s*[-*+•◦▪]\\s*)' + escaped + '\\s*$', 'm');
      if (liRe.test(_zlNoteContent)) {
        _zlNoteContent = _zlNoteContent.replace(liRe, '').replace(/\n{3,}/g, '\n\n');
      } else {
        // 首次出现纯文本替换
        _zlNoteContent = _zlNoteContent.replace(nodeText, '');
      }
    }
    if (typeof saveEditorState === 'function') saveEditorState();
    showToast('✅ 节点已删除');
  }

  // 重新渲染
  renderMarkmapFromContent();

  // 关闭右键菜单
  var menu = document.getElementById('_mmCtxMenu');
  if (menu) menu.remove();
}

function addChildMindmapNode(d) {
  if (!d) return;
  var newChildName = prompt('输入新子节点名称：', '');
  if (!newChildName || !newChildName.trim()) return;
  newChildName = newChildName.trim();
  var nodeText = d.data.content;
  if (typeof _zlNoteContent !== 'undefined') {
    var escaped = nodeText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var indent = '  '.repeat(Math.max(0, d.depth));
    // 尝试匹配为标题行
    var reH = new RegExp('^(#{0,6}\\s*' + escaped + '\\s*)$', 'm');
    if (reH.test(_zlNoteContent)) {
      _zlNoteContent = _zlNoteContent.replace(reH, '$1\n' + indent + '- ' + newChildName);
    } else {
      // 尝试匹配为列表项行
      var reLi = new RegExp('^(\\s*[-*+•◦▪]\\s*' + escaped + '\\s*)$', 'm');
      if (reLi.test(_zlNoteContent)) {
        _zlNoteContent = _zlNoteContent.replace(reLi, '$1\n' + indent + '  - ' + newChildName);
      } else {
        // 在对应文本后追加
        if (_zlNoteContent.indexOf(nodeText) !== -1) {
          _zlNoteContent = _zlNoteContent.replace(nodeText, nodeText + '\n' + indent + '- ' + newChildName);
        } else {
          _zlNoteContent = _zlNoteContent + '\n' + indent + '- ' + newChildName;
        }
      }
    }
    if (typeof saveEditorState === 'function') saveEditorState();
  }
  renderMarkmapFromContent();
  showToast('✅ 子节点已添加');
}

// ====== Canvas 原生绘制辅助（不依赖 SVG→Image）======
function collectMindmapData(gRoot, filterUids) {
  var nodes = [];
  var d3Refs = [];

  // 收集节点
  var allNodes = gRoot.querySelectorAll('g.mm-node');
  for (var j = 0; j < allNodes.length; j++) {
    var ng = allNodes[j];
    try {
      var nd = d3.select(ng).datum();
      if (filterUids && (!nd || !filterUids[nd._uid])) continue;
      var tr = ng.getAttribute('transform') || '';
      var tm = tr.match(/translate\(\s*([\d.-]+)\s*[, ]\s*([\d.-]+)\s*\)/);
      var cx = 0, cy = 0;
      if (tm) { cx = parseFloat(tm[1]); cy = parseFloat(tm[2]); }
      else if (tr !== '') continue; // Safari把translate(0,0)优化成空串，空串默认0,0
      var r = ng.querySelector('rect');
      var t = ng.querySelector('text');
      if (!r || !t) continue;
      nodes.push({
        x: cx, y: cy,
        fill: r.getAttribute('fill') || '#4A90D9',
        w: parseFloat(r.getAttribute('width')) || 36,
        h: parseFloat(r.getAttribute('height')) || 22,
        rx: parseFloat(r.getAttribute('rx')) || 6,
        label: t.textContent || '',
        bold: t.getAttribute('font-weight') === 'bold',
        _uid: nd ? nd._uid : -1
      });
      d3Refs.push(nd);
    } catch(e) {}
  }

  // 从节点父子关系生成连线（d3.linkHorizontal 公式）
  var uidToIdx = {};
  for (var k = 0; k < nodes.length; k++) { uidToIdx[nodes[k]._uid] = k; }

  var links = [];
  for (var k = 0; k < nodes.length; k++) {
    var nd = d3Refs[k];
    if (!nd || !nd.parent) continue;
    var puid = nd.parent._uid;
    if (uidToIdx[puid] === undefined) continue;
    if (filterUids && !filterUids[puid]) continue;
    var sx = nd.parent.y, sy = nd.parent.x;
    var tx = nd.y, ty = nd.x;
    var midX = (sx + tx) / 2;
    links.push({ x1:sx, y1:sy, cx1:midX, cy1:sy, cx2:midX, cy2:ty, x2:tx, y2:ty });
  }

  return { nodes: nodes, links: links };
}

function drawMindmapData(ctx, data) {
  if (!data) return;
  // 绘制链接（先画，在节点下方）
  if (data.links.length > 0) {
    ctx.beginPath();
    for (var i = 0; i < data.links.length; i++) {
      var l = data.links[i];
      ctx.moveTo(l.x1, l.y1);
      ctx.bezierCurveTo(l.cx1, l.cy1, l.cx2, l.cy2, l.x2, l.y2);
    }
    ctx.strokeStyle = '#bbb';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  // 绘制节点
  var baseFont = '13px -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textBaseline = 'middle';
  for (var j = 0; j < data.nodes.length; j++) {
    var n = data.nodes[j];
    var rx = n.x - 6, ry = n.y - 11;
    // 圆角矩形
    ctx.fillStyle = n.fill;
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(rx, ry, n.w, n.h, n.rx);
    } else {
      var rr = n.rx;
      ctx.moveTo(rx + rr, ry);
      ctx.lineTo(rx + n.w - rr, ry);
      ctx.arcTo(rx + n.w, ry, rx + n.w, ry + rr, rr);
      ctx.lineTo(rx + n.w, ry + n.h - rr);
      ctx.arcTo(rx + n.w, ry + n.h, rx + n.w - rr, ry + n.h, rr);
      ctx.lineTo(rx + rr, ry + n.h);
      ctx.arcTo(rx, ry + n.h, rx, ry + n.h - rr, rr);
      ctx.lineTo(rx, ry + rr);
      ctx.arcTo(rx, ry, rx + rr, ry, rr);
    }
    ctx.fill();
    // 文字（根节点加粗）
    ctx.fillStyle = '#fff';
    ctx.font = (n.bold ? 'bold ' : '') + baseFont;
    ctx.fillText(n.label, n.x, n.y);
  }
}

// ====== Canvas 导出辅助：dataURL 直接下载（不经过 Blob） ======
function _canvasDownload(canvas, filename, successMsg) {
  // 优先尝试 toBlob（异步，内存友好）
  try {
    canvas.toBlob(function(blob) {
      if (blob && blob.size > 0) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
        showToast(successMsg);
      } else {
        // toBlob 失败 → 走 toDataURL
        _canvasDataURLDownload(canvas, filename, successMsg);
      }
    }, 'image/png');
  } catch(be) {
    // toBlob 抛异常 → 走 toDataURL
    _canvasDataURLDownload(canvas, filename, successMsg);
  }
}

function _canvasDataURLDownload(canvas, filename, successMsg) {
  var dataUrl = null;
  // 先试 png
  try { dataUrl = canvas.toDataURL('image/png'); } catch(e1) {}
  // png 失败换 jpeg
  if (!dataUrl || dataUrl.length < 200) {
    try { dataUrl = canvas.toDataURL('image/jpeg', 0.92); } catch(e2) {}
  }
  if (!dataUrl || dataUrl.length < 200) {
    showToast('导出失败：无法生成图片');
    return;
  }
  var a = document.createElement('a');
  a.href = dataUrl; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  showToast(successMsg);
}

// ====== 导出分支 ======
function exportMindmapBranch(d) {
  if (!d) return;
  var container = document.getElementById('zlMindMapTarget');
  if (!container) return;
  var svg = container.querySelector('svg');
  if (!svg) { showToast('请先加载导图'); return; }
  try {
    var gRoot = svg.querySelector('g');
    if (!gRoot) { showToast('导图数据异常'); return; }

    // 收集分支内所有节点的 _uid
    var branchUids = {};
    function collectUids(node) {
      branchUids[node._uid] = true;
      var kids = node.children || node._children;
      if (kids) kids.forEach(collectUids);
    }
    collectUids(d);

    // 保存并重置 zoom
    var currentZoom = d3.zoomTransform(svg);
    var zoom = d3.zoom();
    d3.select(svg).call(zoom.transform, d3.zoomIdentity);
    var gTransform = gRoot.getAttribute('transform') || '';
    gRoot.setAttribute('transform', '');

    // 收集分支数据并计算边界
    var data = collectMindmapData(gRoot, branchUids);
    if (data.nodes.length === 0) {
      gRoot.setAttribute('transform', gTransform);
      d3.select(svg).call(zoom.transform, currentZoom);
      showToast('分支内容为空'); return;
    }

    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (var i = 0; i < data.nodes.length; i++) {
      var n = data.nodes[i];
      var rx = n.x - 6, ry = n.y - 11;
      minX = Math.min(minX, rx); maxX = Math.max(maxX, rx + n.w);
      minY = Math.min(minY, ry); maxY = Math.max(maxY, ry + n.h);
    }

    // 恢复 zoom
    gRoot.setAttribute('transform', gTransform);
    d3.select(svg).call(zoom.transform, currentZoom);

    var padding = 30;
    var fullW = Math.ceil(maxX - minX + padding * 2);
    var fullH = Math.ceil(maxY - minY + padding * 2);
    var MAX_DIM = 6144;
    var scale = 8;
    while ((fullW * scale > MAX_DIM || fullH * scale > MAX_DIM) && scale > 1) { scale--; }

    var canvas = document.createElement('canvas');
    canvas.width = fullW * scale; canvas.height = fullH * scale;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, (padding - minX) * scale, (padding - minY) * scale);
    drawMindmapData(ctx, data);

    _canvasDownload(canvas, (_zlNoteTitle || '思维导图') + '_分支_' + (d.data.content||'').slice(0, 15) + '.png', '✅ 分支已导出');
  } catch(e) { console.error(e); showToast('导出失败'); }
}

    photos.sort(function(a, b) { return (b.createdAt || '').localeCompare(a.createdAt || ''); });

    var html = '<div style="margin-bottom:12px">' +
      '<input type="file" id="zlPhotoInput" accept="image/*" onchange="handleZlPhotoUpload(this)" style="display:none">' +

    } else {
      html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">';
      for (var i = 0; i < photos.length; i++) {
        var p = photos[i];
        html += '<div style="position:relative;aspect-ratio:1;overflow:hidden;border-radius:10px;border:1px solid var(--border);cursor:pointer;background:var(--bg-card)" onclick="viewZlPhoto(' + p.id + ')">' +
          '<img src="' + (p.thumbnail || p.fullImage) + '" loading="lazy" style="width:100%;height:100%;object-fit:cover">' +
          '<button onclick="event.stopPropagation();deleteZlPhoto(' + p.id + ')" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.5);color:#fff;border:none;font-size:10px;width:24px;height:24px;border-radius:50%;cursor:pointer;line-height:1">✕</button>' +
        '</div>';
      }
      html += '</div>';
    }
    area.innerHTML = html;
  }).catch(function() {
    area.innerHTML = '<p style="color:var(--danger);text-align:center;padding:30px">加载图库失败</p>';
  });

function handleZlPhotoUpload(input) {
  var file = input.files[0];
  if (!file) return;
  if (!file.type.match(/image\//)) { showToast('请选择图片文件'); input.value = ''; return; }
  compressImage(file, function(full, thumb) {
    if (!full && !thumb) { showToast('图片处理失败'); return; }
    var now = new Date().toISOString();
    dbPut('photos', {
      bankId: _zlBankId,
      thumbnail: thumb || '',
      fullImage: full || thumb || '',
      caption: '',
      createdAt: now
    }).then(function() {
      showToast('✅ 照片已保存');
      updateStorageBadge();
      renderPhotoGallery();
    }).catch(function() {
      showToast('保存失败，请重试');
    });
  });
  input.value = '';
}

function viewZlPhoto(id) {
  dbGetAll('photos').then(function(all) {
    var p = null;
    for (var i = 0; i < all.length; i++) { if (all[i].id === id) { p = all[i]; break; } }
    if (!p) { showToast('照片不存在'); return; }
    showFullImage(p.fullImage || p.thumbnail);
  }).catch(function() { showToast('加载照片失败'); });
}

function deleteZlPhoto(id) {
  if (!confirm('确定删除这张照片吗？')) return;
  dbDelete('photos', id).then(function() {
    showToast('已删除');
    updateStorageBadge();
    renderPhotoGallery();
  }).catch(function() { showToast('删除失败'); });
}

// ====== 存储管理 ======
function updateStorageBadge() {
  var badge = document.getElementById('zlStorageBadge');
  if (!badge) return;
  Promise.all([dbGetAll('notes'), dbGetAll('photos')]).then(function(r) {
    var notes = r[0] || [], photos = r[1] || [];
    var totalSize = 0;
    for (var i = 0; i < photos.length; i++) {
      if (photos[i].fullImage) totalSize += photos[i].fullImage.length;
      if (photos[i].thumbnail) totalSize += photos[i].thumbnail.length;
    }
    for (var j = 0; j < notes.length; j++) {
      totalSize += (notes[j].content || '').length + (notes[j].title || '').length;
    }
    var sizeMB = (totalSize / 1024 / 1024).toFixed(1);
    badge.textContent = '📦 ' + notes.length + '笔记 ' + photos.length + '图 ' + sizeMB + 'MB';
  }).catch(function(){});
}

function showStorageInfo() {
  Promise.all([dbGetAll('notes'), dbGetAll('photos')]).then(function(r) {
    var notes = r[0] || [], photos = r[1] || [];
    var noteSize = 0, photoSize = 0;
    for (var i = 0; i < photos.length; i++) {
      if (photos[i].fullImage) photoSize += photos[i].fullImage.length;
      if (photos[i].thumbnail) photoSize += photos[i].thumbnail.length;
    }
    for (var j = 0; j < notes.length; j++) {
      noteSize += (notes[j].content || '').length + (notes[j].title || '').length;
    }
    var bankStats = {};
    for (var k = 0; k < notes.length; k++) {
      var bid = notes[k].bankId;
      if (!bankStats[bid]) bankStats[bid] = { notes: 0, photos: 0 };
      bankStats[bid].notes++;
    }
    for (var l = 0; l < photos.length; l++) {
      var pid = photos[l].bankId;
      if (!bankStats[pid]) bankStats[pid] = { notes: 0, photos: 0 };
      bankStats[pid].photos++;
    }
    var html = '<div style="max-height:60vh;overflow-y:auto">' +
      '<p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">📝 笔记 ' + notes.length + ' 篇（' + (noteSize / 1024).toFixed(1) + ' KB）</p>' +
      '<p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">📷 照片 ' + photos.length + ' 张（' + (photoSize / 1024 / 1024).toFixed(1) + ' MB）</p>';

    if (bankIds.length > 0) {

        var bsid = bankIds[bi];
        var bname = (appData.banks[bsid] && appData.banks[bsid].name) || bsid;
        var bs = bankStats[bsid];
        html += '<div style="font-size:12px;color:var(--text-secondary);padding:4px 0;display:flex;justify-content:space-between">' +
          '<span>' + escapeHtml(bname) + '（笔记' + bs.notes + ' 照片' + bs.photos + '）</span>' +
          '<button onclick="clearBankZlData(\'' + bsid + '\')" style="background:none;border:none;color:var(--danger);font-size:11px;cursor:pointer">🗑 清理</button>' +
        '</div>';
      }
    }
    html += '<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px">' +
      '<button onclick="clearAllZlData()" style="width:100%;padding:10px;background:var(--danger);color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;min-height:44px">🗑 清除全部资料数据</button>' +
    '</div></div>';
    showModal('📦 存储管理', html);
  }).catch(function() { showToast('加载存储信息失败'); });
}

function clearAllZlData() {
  if (!confirm('确定清除全部笔记和照片吗？此操作不可恢复。')) return;
  Promise.all([dbClearStore('notes'), dbClearStore('photos')]).then(function() {
    showToast('已清除全部资料');
    _zlEditingNote = null;
    updateStorageBadge();
    renderZiliaoContent();

function dbClearStore(storeName) {
  return openZiliaoDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).clear();
      tx.oncomplete = function() { db.close(); resolve(); };
      tx.onerror = function() { db.close(); reject(tx.error); };
    });
  });
}

// ====== 导出笔记 ======
function exportNote(id) {
  dbGetAll('notes').then(function(all) {
    var n = null;
    for (var i = 0; i < all.length; i++) { if (all[i].id === id) { n = all[i]; break; } }
    if (!n) { showToast('笔记不存在'); return; }
    var text = '# ' + (n.title || '无标题') + '\n\n' + (n.content || '');
    var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });

function parseOutlineToMarkdown(text) {
  if (!text || !text.trim()) return '';
  var lines = text.split('\n');
  var result = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (!line.trim()) { result.push(''); continue; }
    var indent = 0;
    var trimmed = line;
    if (line.charAt(0) === '\t') { indent = 1; while (trimmed.charAt(0) === '\t') { indent++; trimmed = trimmed.substring(1); } }
    else { var sm = line.match(/^(  |    )+/); if (sm) { indent = sm[0].length / 2; trimmed = line.substring(sm[0].length); } }
    var cnMatch = trimmed.match(/^[（(]?[一二三四五六七八九十]+[）)]?\s*[、.]?\s*/);
    var numMatch = trimmed.match(/^(\d+)[.)、]\s*/);
    var listMatch = trimmed.match(/^[-*•]\s+/);
    if (indent === 0 && (cnMatch || numMatch)) {
      result.push('# ' + trimmed.replace(/^[（(]?[一二三四五六七八九十]+[）)]?\s*[、.]?\s*/, '').replace(/^\d+[.)、]\s*/, ''));
    } else if (indent <= 1 && (cnMatch || numMatch)) {
      result.push('## ' + trimmed.replace(/^[（(]?[一二三四五六七八九十]+[）)]?\s*[、.]?\s*/, '').replace(/^\d+[.)、]\s*/, ''));
    } else if (indent <= 2 && (cnMatch || numMatch)) {
      result.push('### ' + trimmed.replace(/^[（(]?[一二三四五六七八九十]+[）)]?\s*[、.]?\s*/, '').replace(/^\d+[.)、]\s*/, ''));
    } else if (listMatch) {
      result.push('- ' + trimmed.substring(listMatch[0].length));
    } else if (cnMatch || numMatch) {
      result.push('- ' + trimmed.replace(/^[（(]?[一二三四五六七八九十]+[）)]?\s*[、.]?\s*/, '').replace(/^\d+[.)、]\s*/, ''));
    } else {
      if (indent > 0) result.push('- ' + trimmed);
      else result.push(trimmed);
    }
  }
  return result.join('\n');
}

function exportMindMapPNG() {
  var container = document.getElementById('zlMindMapTarget');
  if (!container) return;
  var svg = container.querySelector('svg');
  if (!svg) { showToast('请先加载导图'); return; }
  try {
    var rect = svg.getBoundingClientRect();
    var w = rect.width || 800;
    var h = rect.height || 600;

    var MAX_DIM = 6144;
    var scale = 8;
    while ((w * scale > MAX_DIM || h * scale > MAX_DIM) && scale > 1) { scale--; }

    var currentZoom = d3.zoomTransform(svg);
    var gRoot = svg.querySelector('g');
    if (!gRoot) { showToast('导图数据异常'); return; }

    // 收集所有节点（保留当前 zoom，通过 canvas 变换实现视图裁剪）
    var data = collectMindmapData(gRoot, null);
    if (data.nodes.length === 0) { showToast('导图内容为空'); return; }

    var canvas = document.createElement('canvas');
    canvas.width = w * scale;
    canvas.height = h * scale;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    // 应用 zoom 变换：SVG坐标 → CSS像素 → Canvas像素
    ctx.setTransform(scale * currentZoom.k, 0, 0, scale * currentZoom.k, scale * currentZoom.x, scale * currentZoom.y);
    drawMindmapData(ctx, data);

    _canvasDownload(canvas, (_zlNoteTitle || '思维导图') + '.png', '✅ 导图已导出');
  } catch(e) { console.error(e); showToast('导出失败'); }
}

function resetMindmapView() {
  var container = document.getElementById('zlMindMapTarget');
  if (!container) return;
  var svg = container.querySelector('svg');
  if (!svg) return;
  var gRoot = svg.querySelector('g');
  if (!gRoot) return;
  try {
    var W = svg.getAttribute('width') || container.clientWidth || 700;
    var H = svg.getAttribute('height') || 400;
    var bounds = gRoot.getBBox();
    if (!bounds || bounds.width === 0 || bounds.height === 0) return;
    var scale = Math.min(W / bounds.width, H / bounds.height, 1.2) * 0.88;
    var tx = (W - bounds.width * scale) / 2 - bounds.x * scale;
    var ty = (H - bounds.height * scale) / 2 - bounds.y * scale;
    var zoom = d3.zoom();
    d3.select(svg).transition().duration(350).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  } catch(e) { /* 忽略 */ }
}

// ====== 导图导出PNG（全部节点）======
function exportMindMapFullPNG() {
  var container = document.getElementById('zlMindMapTarget');
  if (!container) return;
  var svg = container.querySelector('svg');
  if (!svg) { showToast('请先加载导图'); return; }
  try {
    var gRoot = svg.querySelector('g');
    if (!gRoot || !gRoot.querySelector('g.mm-node')) { showToast('导图内容为空'); return; }

    // 保存并重置 zoom
    var currentZoom = d3.zoomTransform(svg);
    var zoom = d3.zoom();
    d3.select(svg).call(zoom.transform, d3.zoomIdentity);
    var gTransform = gRoot.getAttribute('transform') || '';
    gRoot.setAttribute('transform', '');

    // 用 getBBox 获取精确边界
    var bbox;
    try { bbox = gRoot.getBBox(); } catch(e) { bbox = null; }

    if (!bbox || bbox.width === 0 || bbox.height === 0) {
      gRoot.setAttribute('transform', gTransform);
      d3.select(svg).call(zoom.transform, currentZoom);
      showToast('导图内容为空'); return;
    }

    // 收集绘制数据（zoom 已重置）
    var data = collectMindmapData(gRoot, null);

    // 恢复 zoom
    gRoot.setAttribute('transform', gTransform);
    d3.select(svg).call(zoom.transform, currentZoom);

    var padding = 40;
    var fullW = Math.ceil(bbox.width + padding * 2);
    var fullH = Math.ceil(bbox.height + padding * 2);

    var MAX_DIM = 6144;
    var scale = 8;
    while ((fullW * scale > MAX_DIM || fullH * scale > MAX_DIM) && scale > 1) { scale--; }

    var canvas = document.createElement('canvas');
    canvas.width = fullW * scale;
    canvas.height = fullH * scale;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, (padding - bbox.x) * scale, (padding - bbox.y) * scale);
    drawMindmapData(ctx, data);

    _canvasDownload(canvas, (_zlNoteTitle || '思维导图') + '_完整.png', '✅ 完整导图已导出');
  } catch(e) { console.error(e); showToast('导出失败'); }
}

function getChapterStats(bankId) {
  var bank = appData.banks[bankId];
  if (!bank) return [];
  var chapters = {};
  var cards = bank.cards || [];
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var ch = (card.chapter || '未分类').trim();
    if (!chapters[ch]) chapters[ch] = { name: ch, total: 0, mastered: 0 };
    chapters[ch].total++;
    if (card.srStage >= 4) chapters[ch].mastered++;
  }
  var result = Object.values(chapters);
  result.sort(function(a, b) { return b.total - a.total; });
  return result;
}

// ==================== 自动挖空算法 ====================
const STOP_WORDS = new Set(['的','了','是','在','和','与','或','对','从','到','等','这','那','其','之','也','就','都','但','而','且','所','被','把','让','向','同','及','以及','着','过','可以','能够','需要','应该','必须','可能','已经','正在','将要','没有','不是','什么','怎么','怎样','如何','为什么','哪个','哪里','因为','所以','虽然','但是','如果','即使','除非','无论','不管','进行','使用','通过','根据','关于','对于','由于','为了','一个','一种','这个','这种','一些','这些','那些','每个','第一','第二','第三','首先','其次','最后','然后','接着','方面','部分','情况','过程','结果','作用','功能','特点','具有','形成','产生','发生','发展','变化','包括','包含','主要','重要','基本','一般','特别','非常','比较','更加','一定','所有','任何','不同','相同','之间','之中','之后','之前','以内','以外','以上','以下','不能','不会','不可','不再','也是','就有','都会','也可','是指','称为','叫做','属于','用来','用以','用于','作为','其中','其他','其它','各自','某些','有的','有些','我国','人们','我们','他们','你们','它们','当','并','则','以','可','能','会','要','有','无','为主','程度','有助于','标志着','就是说','指的是','共同','相互','整体','具体','实际','直接','间接','最终','逐步','不断','充分','进一步','结合']);

const CHAR_STOP = new Set(['的','了','是','和','与','或','对','在','中','上','下','等','并','则','以','可','能','会','要','有','无','及','被','把','从','到','由','让','向','同','为','因','所','而','且','虽','但','却','只','仅','又','再','还','也','就','都','很','更','最','极','较','太','非','不','没','将','已','正','着','过']);

const TECH_CHARS = /[酶碱酸质体胞器官腺激素膜核基因蛋白链层壁骨骼脉瓣翅鞘壳齿爪鳍鳞根茎叶花果律则理病症炎瘤癌剂论定程件器仪网络数图表演示验证据测算计控制调节元子分离解合反应氧氢碳氮铁钙钠钾维生素矿纤脂淀粉糖盐溶液渗透呼光遗传变异免疫神经血淋代谢激荷蒙染色粒线核苷磷嘌呤嘧啶肽氨羧羟醛酮酯醚苯酚烃烯炔烷醇法权利义务责任罪刑罚诉审判宪政府议会选举立司行帝朝代战革命运动约条德育思知教师身范品习贯养意志趣践]/;

function hasTechChar(s) { return TECH_CHARS.test(s); }

// ---- 简单种子随机数（"换一批空"产生不同结果） ----
function seededRandom(seed) {
  let s = (seed | 0) || 1;
  return function() { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

// ---- 将答案按"得分点"拆分 ----
function splitIntoPoints(text) {
  if (!text || !text.trim()) return [];
  // 预标准化：在子要点序号前插入换行，使(1)(2)（1）（2）①②各自独立成行
  var normalized = text
    .replace(/([^\n])\s*（([\d一二三四五六七八九十百]+)）/g, '$1\n（$2）')
    .replace(/([^\n])\s*\(([\d]+)\)/g, '$1\n($2)')
    .replace(/([^\n])\s*([①②③④⑤⑥⑦⑧⑨⑩])/g, '$1\n$2');
  // 先按换行拆
  const rawParts = normalized.split(/\n/).map(l => l.trim()).filter(Boolean);
  const points = [];
  for (const line of rawParts) {
    // 去掉序号前缀：1. 2、 （1） ① 等
    let cleaned = line.replace(/^[\d一二三四五六七八九十百]+[\.\、\)）]\s*/, '');
    cleaned = cleaned.replace(/^[①②③④⑤⑥⑦⑧⑨⑩]\s*/, '');
    cleaned = cleaned.replace(/^（[\d一二三四五六七八九十百]+）\s*/, '');
    if (!cleaned.trim()) continue;
    // 对每行按主要标点拆分
    const sub = cleaned.split(/[；;。](?=\S)/);
    for (const s of sub) {
      const t = s.trim();
      if (!t) continue;
      // 如果一段太长，再按逗号拆
      if (t.length > 20 && /[，,]/.test(t)) {
        const parts = t.split(/[，,](?=\S)/);
        for (const p of parts) { const tp = p.trim(); if (tp) points.push(tp); }
      } else {
        points.push(t);
      }
    }
  }
  return points.length ? points : [text.trim().replace(/^[\d一二三四五六七八九十百]+[\.\、\)）]\s*/, '')];
}

// ---- 在原文中定位每个得分点 ----
function locatePoints(fullText, points) {
  const located = [];
  let searchFrom = 0;
  for (const pt of points) {
    const idx = fullText.indexOf(pt, searchFrom);
    if (idx >= 0) {
      located.push({ text: pt, start: idx, end: idx + pt.length });
      searchFrom = idx + pt.length;
    }
  }
  return located;
}

// ---- 提取关键词（支持种子随机） ----
function extractKeywords(text, count, seed) {
  if (!text || !text.trim()) return [];
  const rng = seed != null ? seededRandom(seed) : null;
  const candidates = [];

  for (let len = 12; len >= 2; len--) {
    for (let i = 0; i <= text.length - len; i++) {
      const phrase = text.substring(i, i + len);
      if (STOP_WORDS.has(phrase)) continue;
      if (CHAR_STOP.has(phrase[0]) || CHAR_STOP.has(phrase[phrase.length - 1])) continue;
      // 不能以标点、序号、括号开头或结尾
      if (/[，,。！!？?、；;：:""''（）()《》【】…—\-·・\d]/.test(phrase[0]) ||
          /[，,。！!？?、；;：:""''（）()《》【】…—\-·・\d]/.test(phrase[phrase.length - 1])) continue;
      // 排除短语中间含有编号标记的
      if (/[《》【】·・•①②③④⑤⑥⑦⑧⑨⑩]/.test(phrase)) continue;
            // 纯数字/序号不要
      if (/^[\d一二三四五六七八九十百千万亿\.\、\)）]+$/.test(phrase)) continue;
      let score = len * 3;
      // 得分点关键词大幅加分（学科术语=得分点核心）
      if (hasTechChar(phrase)) score += 12;
      // 中英文混合（如"DNA复制"）加分
      if (/[A-Za-z]/.test(phrase)) score += 6;
      // 概念后缀加分：以学科特征字结尾的词更可能是完整考点，长词加分更多确保"现代化"不挖成"现代"
      if (/[性化法制论学观力体质感型式态物器术程期段点度率量数值系组群类种属科德育养践统义理识动惯求律念素]$/.test(phrase)) score += 5 + len;
      // 数字参与但不主导的词（如"3个"）适度加分
      if (/[\d一二三四五六七八九十百千万亿]/.test(phrase) && !/^\d+$/.test(phrase)) score += 3;
      // 得分点第1个字开头的词（通常是动词/动作词）大幅加分
      if (i === 0) score += 8;
      // 逗号/分号/句号/换行后面紧跟的词也加分
      if (i === 0 || /[，,。；;、\n]/.test(text[i - 1])) score += 5;
      // 括号内的内容通常是关键信息，加分
      if (i > 0 && (text[i - 1] === '（' || text[i - 1] === '(')) score += 10;
      if (i + phrase.length < text.length && (text[i + phrase.length] === '）' || text[i + phrase.length] === ')')) score += 8;
      // 包含多个技术字的更可能是核心概念
      const techCount = (phrase.match(TECH_CHARS) || []).length;
      if (techCount >= 2) score += 4;
      // 惩罚虚词
      score -= (phrase.match(/[的了是在和与或对中上下等所被把让向同及着过]/g) || []).length * 4;
      // 四字固定搭配保护（如"严于律己""知行统一"）：含1个虚词但整体是学科概念的，加分防拆散
      if (len === 4 && hasTechChar(phrase)) {
        var _funcCount = (phrase.match(/[的了是在和与或对中上下等所被把让向同及着过于]/g) || []).length;
        if (_funcCount === 1) score += 8;
      }
      // 扣分：包含括号的短语（优先选括号内纯净内容）
      if (/[（）()]/.test(phrase)) score -= 25;
      // 随机扰动
      if (rng) score += rng() * 6 - 3;
      if (score >= 3) candidates.push({ start: i, end: i + len, text: phrase, score });
    }
  }
  // 加权随机选择：分数越高的词被选中概率越大，但每次"换一批空"可能不同
  const selected = [], used = new Set();
  const pool = candidates.slice();
  while (selected.length < count && pool.length > 0) {
    // 筛掉与已选位置重叠的候选
    const valid = pool.filter(function(c) {
      for (var p = c.start; p < c.end; p++) { if (used.has(p)) return false; }
      return true;
    });
    if (valid.length === 0) break;
    // 以分数平方为权重（高分偏好的同时保留随机性）
    var totalWeight = 0;
    for (var vi = 0; vi < valid.length; vi++) { totalWeight += valid[vi].score * valid[vi].score; }
    if (totalWeight <= 0) { selected.push(valid[0]); break; }
    var roll = (rng ? rng() : Math.random()) * totalWeight;
    var chosen = valid[0];
    for (var vi2 = 0; vi2 < valid.length; vi2++) {
      roll -= valid[vi2].score * valid[vi2].score;
      if (roll <= 0) { chosen = valid[vi2]; break; }
    }
    selected.push(chosen);
    for (var p2 = chosen.start; p2 < chosen.end; p2++) used.add(p2);
    // 从池中移除（同位置避免下轮复选）
    var rmIdx = pool.indexOf(chosen);
    if (rmIdx >= 0) pool.splice(rmIdx, 1);
  }
  selected.sort((a, b) => a.start - b.start);
  return selected;
}

// ---- 自动挖空：每个得分点至少一个空，优先挖得分关键词 ----
function autoGenerateBlanks(cards, density, seed) {
  return cards.map((card, cardIdx) => {
    const q = card.question.trim();
    let a = card.answer.trim();
    // 答案首行与题目重复时跳过（如：答案第一行=题目，第二行起才是背诵内容）
    var aNl = a.indexOf('\n');
    if (aNl > 0) {
      var aFirstLine = a.substring(0, aNl).trim();
      if (aFirstLine === q || (aFirstLine.length > 1 && q.includes(aFirstLine)) || (q.length > 1 && aFirstLine.includes(q))) {
        a = a.substring(aNl + 1).trim();
      }
    }
    var ft = q + '\n' + a;
    var answerStart = q.length + 1;

    // ==== 检测答案中的【】标记，优先作为挖空 ====
    var reBracket = /【([^】]+)】/g;
    var bracketBlanks = [];
    var m;
    while ((m = reBracket.exec(a)) !== null) {
      bracketBlanks.push({
        start: answerStart + m.index,
        end: answerStart + m.index + m[0].length,
        text: m[1],
        isAnswer: true
      });
    }
    // 也检测题目中的【】
    reBracket.lastIndex = 0;
    while ((m = reBracket.exec(q)) !== null) {
      bracketBlanks.push({
        start: m.index,
        end: m.index + m[0].length,
        text: m[1],
        isAnswer: false
      });
    }
    if (bracketBlanks.length > 0) {
      bracketBlanks.sort(function(a, b) { return a.start - b.start; });
      // 去重
      var _dd = [];
      var _s = {};
      for (var bi = 0; bi < bracketBlanks.length; bi++) {
        var bk = bracketBlanks[bi].start + ':' + bracketBlanks[bi].end;
        if (!_s[bk]) { _s[bk] = true; _dd.push(bracketBlanks[bi]); }
      }
      return { ...card, fullText: ft, blanks: _dd };
    }

    if (!a) return { ...card, fullText: ft, blanks: [] };

    const pointTexts = splitIntoPoints(a);
    if (!pointTexts.length) return { ...card, fullText: ft, blanks: [] };

    // 在原文中定位每个得分点
    const located = locatePoints(a, pointTexts);

    // 分配空数：低密度短句1空长句2空；高密度每个点保底1个，额外按长度比例分配
    const totalLen = located.reduce((s, l) => s + l.text.length, 0) || 1;
    const allocation = new Array(located.length).fill(1);
    if (density === 'low') {
      // 低密度：短句（仅1个句号且<20字）→1空，长句（多个句号或1个句号但≥20字）→2空
      for (let i = 0; i < allocation.length; i++) {
        const juhaoCount = (located[i].text.match(/。/g) || []).length;
        allocation[i] = (juhaoCount >= 2 || (juhaoCount === 1 && located[i].text.length >= 20)) ? 2 : 1;
      }
    } else {
      // 高密度：额外空按文本长度比例分配（最大余数法，长的点分到更多）
      const extraTotal = Math.round(located.length * 0.3);
      const prop = located.map((l, i) => ({ i, share: l.text.length / totalLen * extraTotal, got: 0 }));
      let given = 0;
      for (const p of prop) { p.got = Math.floor(p.share); given += p.got; }
      prop.sort((a, b) => (b.share - b.got) - (a.share - a.got));
      for (let i = 0; i < extraTotal - given; i++) { prop[i].got++; }
      for (const p of prop) { allocation[p.i] += p.got; }
    }

    // 重新定位（上面的 located 被改了）
    const pts = locatePoints(a, pointTexts);
    var blanks = [];
    for (let pi = 0; pi < Math.min(pts.length, allocation.length); pi++) {
      const pt = pts[pi];
      const need = allocation[pi];
      if (need > 0 && pt.text.trim()) {
        const ptSeed = seed != null ? seed + cardIdx * 97 + pi * 31 : undefined;
        const kws = extractKeywords(pt.text, need, ptSeed);
        if (kws.length > 0) {
          for (const kw of kws) {
            blanks.push({
              start: answerStart + pt.start + kw.start,
              end: answerStart + pt.start + kw.end,
              text: kw.text,
              isAnswer: true
            });
          }
        } else {
          // 没找到关键词？把整个得分点挖掉（排除序号和标点）
          const cleanText = pt.text.replace(/^[\d\.\、\)）①②③④⑤⑥⑦⑧⑨⑩\s]+/, '').replace(/^[（(]/, '').replace(/[）)]$/, '').trim();
          if (cleanText) {
            const idx = pt.text.indexOf(cleanText);
            blanks.push({
              start: answerStart + pt.start + idx,
              end: answerStart + pt.start + idx + cleanText.length,
              text: cleanText,
              isAnswer: true
            });
          }
        }
      }
    }

    // 确保每个小点至少有一个空（低密度兜底）
    for (let pi = 0; pi < pts.length; pi++) {
      const pt = pts[pi];
      if (!pt.text.trim()) continue;
      const ptStart = answerStart + pt.start;
      const ptEnd = answerStart + pt.start + pt.text.length;
      const hasBlank = blanks.some(function(b) {
        return b.start >= ptStart && b.end <= ptEnd;
      });
      if (!hasBlank) {
        const cleanText = pt.text.replace(/^[\d\.\、\)）①②③④⑤⑥⑦⑧⑨⑩\s]+/, '').replace(/^[（(]/, '').replace(/[）)]$/, '').trim();
        if (cleanText) {
          const idx = pt.text.indexOf(cleanText);
          blanks.push({
            start: ptStart + idx,
            end: ptStart + idx + cleanText.length,
            text: cleanText,
            isAnswer: true
          });
        }
      }
    }

    blanks.sort((a, b) => a.start - b.start);

    // 去重（相同位置只保留一个）
    const deduped = [];
    const seen = new Set();
    for (const b of blanks) {
      const k = b.start + ':' + b.end;
      if (!seen.has(k)) { seen.add(k); deduped.push(b); }
    }

    return { ...card, fullText: ft, blanks: deduped };
  });
}

function regenerateBlanks(card, density) {
  const seed = Math.floor(Date.now() % 100000) + Math.floor(Math.random() * 900000);
  const r = autoGenerateBlanks([{ question: card.question, answer: card.answer }], density, seed)[0];
  return { ...card, blanks: r.blanks, fullText: r.fullText };
}

// ==================== 解析导入文本 ====================
function parseImportText(rawText) {
  const lines = rawText.split(/\n/).filter(l => l.trim()), cards = [];
  const seps = ['——','→',' - ','=','：','|',':','~','\t'];
  for (const line of lines) {
    const t = line.trim(); if (!t) continue;
    let found = false;
    for (const sep of seps) {
      const idx = t.indexOf(sep);
      if (idx > 0 && idx < t.length - sep.length) {
        if (sep === ':' && (t.indexOf(':') !== t.lastIndexOf(':') || /^\d+:\d/.test(t) || /^https?:/.test(t))) continue;
        const q = t.substring(0, idx).trim();
        var rest = t.substring(idx + sep.length).trim();

        // 尝试从剩余部分提取口诀：查找分隔符，取最后一次出现位置
        var koujue = '';
        var bestJ = -1;
        for (var k = 0; k < seps.length; k++) {
          var j = rest.lastIndexOf(seps[k]);
          if (j > 0 && j < rest.length - seps[k].length && j > bestJ) bestJ = j;
        }
        if (bestJ > 0) {
          koujue = rest.substring(bestJ + 1).trim();
          rest = rest.substring(0, bestJ).trim();
          // 口诀不要太长（超过答案一半且>20字则不是口诀）
          if (koujue.length > Math.max(rest.length * 0.6, 20)) { koujue = ''; rest = rest + ' | ' + koujue; }
        }

        cards.push({ question: q, answer: rest, koujue: koujue });
        found = true; break;
      }
    }
    if (!found) cards.push({ question: t, answer: '' });
  }
  return cards;
}

function isQAFormat(rawText) {
	  const lines = rawText.split(/\n/).filter(l => l.trim());
	  let qCount = 0, aCount = 0;
	  for (const line of lines) {
	    if (/^(Q[：:\.]|问[：:]|题目[：:])/.test(line)) qCount++;
	    if (/^(A[：:\.]|答[：:]|答案[：:])/.test(line)) aCount++;
	  }
	  return qCount >= 2 && aCount >= 2;
	}

	function parseQAText(rawText) {
	  const lines = rawText.split(/\n/), cards = [];
	  let current = null, chapter = '';

	    const line = lines[i].trim();
	    if (!line) continue;

	    if (/^(Q[：:\.]|问[：:]|题目[：:])/.test(line)) {
	      if (current && current.question) cards.push(current);
	      current = { question: line.replace(/^(Q[：:\.]|问[：:]|题目[：:])\s*/, '').trim(), answer: '', koujue: '', chapter };
	    } else if (/^(A[：:\.]|答[：:]|答案[：:])/.test(line) && current) {
	      current.answer += (current.answer ? '\n' : '') + line.replace(/^(A[：:\.]|答[：:]|答案[：:])\s*/, '').trim();
	    } else if (current) {
	      if (/^(口诀|背诵技巧)[：:]/.test(line)) {
	        current.koujue = line.replace(/^(口诀|背诵技巧)[：:]\s*/, '').trim();
	      } else if (/^\d+[\.\、]/.test(line)) {
	        if (current.question) cards.push(current);
	        current = { question: line, answer: '', koujue: '', chapter };
	      } else {
	        current.answer += (current.answer ? '\n' : '') + line;
	      }
	    }
	  }
	  if (current && current.question) cards.push(current);
	  return cards;
	}

	function parseJianDaText(rawText) {
  const lines = rawText.split(/\n/), cards = [];
  let current = null, chapter = '';
  var cnNum = /^[一二三四五六七八九十]+[\.\、\）\)]/;
  var arNum = /^\d+[\.\、]/;
  var subNum = /^[\(（]\d+[\)）]|^[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    if (/^第[一二三四五六七八九十百\d]+章/.test(line)) { chapter = line; continue; }
    var isCnNum = cnNum.test(line);
    var isArNum = arNum.test(line) && !isCnNum;
    var isSubNum = subNum.test(line);
    var isBullet = /^[•●◦◆◇▪▸►▹▶☞✓✔✗✘☐☑☒]/.test(line);
    if (isCnNum) {
      // 中文数字：顶级题目，启动新卡片
      if (current && current.question) cards.push(current);
      current = { question: line, answer: '', koujue: '', chapter };
    } else if (isArNum) {
      // 阿拉伯数字：如果上一题是中文数字标题，则归入答案；否则启动新题
      if (current && cnNum.test(current.question)) {
        current.answer += (current.answer ? '\n' : '') + line;
      } else {
        if (current && current.question) cards.push(current);
        current = { question: line, answer: '', koujue: '', chapter };
      }
    } else if (isSubNum || isBullet) {
      // 子编号/项目符号：一律归入当前答案
      if (current) {
        current.answer += (current.answer ? '\n' : '') + line;
      } else {
        current = { question: line, answer: '', koujue: '', chapter };
      }
    } else if (current) {
      if (/^(口诀|背诵技巧|记忆)[：:]/.test(line)) {
        current.koujue = line.replace(/^(口诀|背诵技巧|记忆)[：:]\s*/, '').trim();
      } else {
        current.answer += (current.answer ? '\n' : '') + line;
      }
    } else {
      // 开头无编号行：作为第一题
      current = { question: line, answer: '', koujue: '', chapter };
    }
  }
  if (current && current.question) cards.push(current);
  return cards;
}

function isJianDaFormat(rawText) {
  const lines = rawText.split(/\n/).filter(l => l.trim());
  let kj = 0, num = 0;
  for (const line of lines) {
    if (/^(口诀|背诵技巧|记忆)[：:]/.test(line)) kj++;
    if (/^\d+[\.\、]/.test(line)) num++;
    if (/^[一二三四五六七八九十]+[\.\、\）\)]/.test(line)) num++;
    if (/^[•●◦◆◇▪▸►▹▶☞✓✔✗✘☐☑☒]/.test(line)) num++;
  }
  return (kj >= 2 && num >= 3) || num >= 6;
}

function isHashPctFormat(rawText) {
  const lines = rawText.split(/\n/).filter(l => l.trim());
  let hashCount = 0, pctCount = 0;
  for (const line of lines) {
    if (/^#\\s*\\S/.test(line)) hashCount++;
    if (/^%\\s*\\S/.test(line)) pctCount++;
  }
  return hashCount >= 1 && pctCount >= 1;
}

function parseHashPctText(rawText) {
  const lines = rawText.split(/\n/), cards = [];
  let current = null, orphanPct = 0;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    if (/^#\\s*\\S/.test(line)) {
      if (current && current.question) cards.push(current);
      current = { question: line.replace(/^#\\s*/, "").trim(), answer: "", koujue: "" };
    } else if (/^%\\s*\\S/.test(line)) {
      if (current) {
        current.answer += (current.answer ? "\n" : "") + line.replace(/^%\\s*/, "").trim();
      } else {
        orphanPct++;
      }
    } else if (current) {
      current.answer += (current.answer ? "\n" : "") + line;
    }
  }
  if (current && current.question) cards.push(current);
  if (orphanPct > 0) showToast('⚠️ 有 ' + orphanPct + ' 行%开头的内容出现在题目之前，已被忽略');
  return cards;
}

var DAILY_INSIGHTS = ["遗忘不是你的错，是大脑的节能策略。艾宾浩斯发现遗忘曲线在20分钟后就开始陡降——所以\"感觉忘了再复习\"比\"学完马上复习\"记忆强度高3倍。","测试效应（Testing Effect）是认知科学最稳健的发现：主动回忆一次，比重复阅读4次更有效。你每次填空作答，都在强化那条神经通路。","大脑不是硬盘——记忆是\"重新构造\"而非\"读取\"。每次回忆都在重新巩固，这就是为什么间隔复习比一次性背熟更持久。","每次纠错都在重写神经回路。脑成像研究显示：犯错时大脑的注意网络激活强度是答对时的2.3倍。做错题不是失败——是你的大脑在最高效地学习。","\"Desirable Difficulties\"（有益困难）理论：学习时感觉越费劲，记忆越牢固。轻松流畅的阅读给你\"学会了\"的错觉，吃力地回忆才是真正的学习。","同样的内容，间隔1天复习的记忆保留率（60%）是连续复习（20%）的3倍。你隔几天再背，不是在偷懒——是在给海马体时间巩固。","间隔复习的最佳时机是\"几乎要忘记的时候\"。研究发现：当回忆成功率在70-80%时复习，记忆强化效果最大。","睡眠不是学习的暂停，是学习的延续。深度睡眠时海马体会以20倍速重播白天的记忆痕迹。今晚好好睡觉，比熬夜多背两小时更有效。","睡前1小时学习的内容，比早上学习的内容在48小时后回忆率高26%。不是因为晚上更聪明，而是因为学完就睡，没有新信息干扰记忆巩固。","自我决定论（SDT）认为：人类内在动机的三大支柱是自主、胜任、联结。你主动选择来刷题——这本身就是动机最强的学习状态。","外在奖励会削弱内在动机（\"过度合理化效应\"）。考高分、父母的夸奖都有用，但真正的持久动力来自\"我变得更厉害了\"的感受本身。","大脑对\"开始学习\"的抗拒叫行动偏差。破解方法不是靠意志力，而是把目标降到荒谬的地步：只做1道题。一旦开始，前额叶皮层接管，继续下去的概率是92%。","\"2分钟规则\"：如果一件事能在2分钟内完成，立刻做。如果不能，只做2分钟。这个技巧绕过了大脑对\"大任务\"的抗拒回路。","多任务处理是个神话。大脑不能同时做两件需要认知的事——它只是在快速切换，每次切换损耗约15%的效率。专注一件事，反而更快。","手机在旁边（即使关机），认知能力下降相当于前一晚少睡1小时。物理上把它放到另一个房间，你的工作记忆容量会明显提升。","\"我不会\"和\"我还不会\"之间只差一个字——但大脑的神经反应完全不同。成长型思维者在犯错时前额叶更活跃，他们真的在从错误中学习更多。","蔡格尼克效应：未完成的任务会在大脑中保持\"后台运行\"，产生适度的紧张感。这不是坏事——它让你更想回来完成。利用这个：每次结束时留一道没做完的题。","前额叶皮层是大脑的CEO，负责计划和自控。但它很脆弱：疲劳、压力、饥饿都会削弱它。状态不好时，先照顾好身体，再谈学习。","多巴胺不是快乐分子，是\"渴望\"分子。它在追求目标的过程中释放，而不是在达成时。所以设定小目标、逐步达成，比盯着大目标更能保持动力。","自我效能感（Self-Efficacy）是比天赋更可靠的预测指标。相信自己能学会的人，真的学得更好——因为他们更愿意尝试困难的题目。","神经可塑性意味着：每次学习都在物理上改变你的大脑结构。你不是\"不擅长这个科目\"，你只是还没有建立足够的神经连接。","刻意练习的核心不是重复，是\"在舒适区边缘练习\"。做题太简单=无聊，太难=焦虑。最佳学习发生在\"刚好有点挑战\"的区域。","记忆宫殿技术有2500年历史，但背后的原理很现代：大脑对空间和图像的编码能力远强于抽象文字。把知识点放在想象的房间里，回忆率翻倍。","元认知（对自己认知的认知）是学霸和普通学生的关键区别。每次做完题问自己：\"我真的理解了吗？还是只是觉得理解了？\"","峰终定律：人们对一段体验的评价，取决于最强烈时刻和结束时刻的感受。所以学习结束时做一道你会的题——大脑会给这次学习打更高分。","执行意图（Implementation Intention）比单纯的目标有效2倍。不说\"我今天要刷题\"，说\"吃完晚饭后我就在书桌前打开题库\"。具体的时间地点触发行动。","\"生成效应\"：自己产出答案比看现成答案，记忆强50%。所以你填空比直接看解析有效得多——哪怕填错了，生成的过程本身就在学习。","情绪对记忆有锚定作用。在积极的情绪中学习，回忆时也更容易。不需要很快乐，\"平静而专注\"就是最佳学习状态。","注意力不是无限的——每天能深度专注的时间大约只有4小时。把最难的题目放在精力最好的时段（对大多数人来说是上午）。","\"零散的努力\"累积起来远超\"偶尔的爆发\"。每天10道题坚持一个月，比某一天狂刷300题效果好得多。一致性>强度。","考试焦虑会占用工作记忆容量——你越担心做不好，能用来思考的空间就越少。深呼吸10秒（4秒吸、6秒呼）可以在2分钟内降低皮质醇水平。","番茄工作法背后的科学：大脑的注意周期大约是90分钟，但大多数人每25分钟就需要一个微休息。这不是意志力弱——这是神经生理学。","\"启动效应\"：开始学习前的环境线索会影响你的状态。固定的学习地点、固定的背景音乐、甚至固定的笔，都能让大脑更快进入\"学习模式\"。","交错练习（Interleaving）比集中练习效果更好。混合不同类型的题目，虽然做的时候感觉更乱，但长期记忆更强——因为大脑被迫学习\"区分\"。","情绪标注（Affect Labeling）：把焦虑写下来只需要2分钟，就能显著降低焦虑水平，释放工作记忆空间。下次紧张时试试：在纸上写\"我现在很紧张，因为...\"。","海马体每天产生约700个新神经元。学习能保护这些新生神经元免于死亡——你不仅在积累知识，还在物理上\"建设\"你的大脑。","\"心流状态\"需要两个条件：明确的目标 + 即时的反馈。刷题完美满足这两点——你不需要额外\"找状态\"，题目本身就在引导你进入心流。","\"白熊效应\"：越告诉自己不要想某事，它越会在脑中挥之不去。应对焦虑不是\"别紧张\"，而是\"我接受我现在很紧张，然后继续做题\"。","学习风格的迷思：研究表明，按\"视觉型/听觉型/动觉型\"来学习并不提高效果。真正的关键是：多重编码——同一个内容用文字+图像+声音三种方式输入。","延迟满足能力（棉花糖实验的深层含义）不是天赋，而是可以通过\"转移注意力策略\"训练的。每次想放弃时，转移注意力到当下这道题上，而不是想着\"还要做多久\"。","\"掌握目标\"vs\"表现目标\"：想着\"我要掌握这个知识点\"比\"我要比同学考得好\"更能坚持、更能应对挫折。动机的方向比强度更重要。","复习时间黄金比：学完一个新知识后的最佳复习时间点是——1天后、3天后、7天后、30天后。这不是玄学，是艾宾浩斯曲线的实际应用。","认知负荷理论：工作记忆一次只能处理4±1个信息块。把大题拆成小步骤，不是因为你不行——是因为人的大脑就是这样设计的。","\"游泳之前的准备\"陷阱：看解析、记笔记、整理错题...这些都有用，但真正的学习发生在\"自己动手做\"的时候。看完解析不代表会了——关掉答案做一遍才是。","大脑占人体重量的2%，却消耗20%的能量。高强度的脑力劳动真的会累——累了就休息，不是偷懒，是确保后续学习效率。","\"契可尼效应\"：人更容易记住未完成的事。睡前留一道半解的题，第二天醒来你可能会自然想通——因为大脑在睡眠中继续处理未完成的认知任务。","表扬\"努力\"比表扬\"聪明\"更能培养成长型思维。对你自己也一样：\"我真的很努力\"比\"我真聪明\"更能让你下次继续努力。","社会助长效应：有人和你一起学习（即使只是线上打卡），效率会提升。不是因为竞争——是因为人类是社会性动物，镜像神经元在默默驱动。","\"微量习惯\"（Tiny Habits）：把目标缩小到荒谬的程度。（如\"每天只做1道题\"）不是为了少做——是为了绕过大脑对\"开始\"的抗拒。一旦开始，惯性接管。","\"决策疲劳\"是真实存在的：每做一个决定，下一个决定的质量就降低一点。减少日常决策（比如固定学习时间），把认知资源留给真正需要思考的题目。","身体姿势影响认知：坐直的人比驼背的人对负面反馈的接受度高30%。这不是鸡汤——是具身认知（Embodied Cognition）的实验结论。","10分钟法则：想放弃时，告诉自己\"再做10分钟\"。10分钟后如果还想停就停。但有80%的概率你会继续——因为启动是最大的障碍。","巴甫洛夫的\"条件反射\"同样适用于学习状态：每次学习前做同样的手势、放同样的背景音、用同样的桌面。几周后，触发信号一出，大脑自动进入专注模式。","\"选择性优化补偿\"（SOC理论）：把80%精力放在20%最常考的题目上。你不是偷懒——你是在用认知科学的策略分配有限资源。","阅读姿势影响理解深度：出声朗读比自己默读记忆强30%——因为同时激活了听觉通路和运动皮层。这就是为什么\"自言自语背书\"其实很科学。","\"莱斯托夫效应\"：在一堆相似内容中，最特别的那个最容易记住。所以故意把重点题目用不同的颜色标注，大脑会优先记住它们。","不要试图\"管理时间\"——管理注意力。时间不为你所控，但注意力在哪里、此刻脑子在想什么，是你可以选择的。","\"自我对话\"的质量决定情绪的质量。把\"我必须做完\"换成\"我选择做完\"，内在动机立刻不同。因为\"选择\"激活了自主感——这是人类心理需求的核心。","极简主义学习法：不是资料越多越好，是越少越好。一本教材精读3遍，胜过3本教材匆匆浏览。深度>广度。","\"反刍思维\"是学习的大敌——反复回想考砸的瞬间不会让下次更好，只会消耗前额叶的资源。替代方案：用\"下次我可以怎么做\"的具体行动计划打断反刍。","\"胜利日记\"实验：每天记下3件学习中的小成就（哪怕只是\"今天打开题库了\"），3周后自评动机显著上升。因为你重新训练了大脑关注进步而非差距。","强迫\"快乐学习\"反而有害。能接纳\"学习有时就是无聊的、辛苦的\"这一事实的人，长期坚持的概率更高。真正的动力不是快乐，是意义感。","意志力不像\"电池\"——认为意志力有限的人确实更容易放弃，认为意志力无限的人坚持更久。关键是：\"你相信什么，什么就是真的。\"","\"完形倾向\"：大脑倾向于把不完整的东西补全。利用这个：把题目读完但故意不填最后一个空，第二天你会发现大脑在催你来完成。","\"稀释效应\"：一个强论点比三个弱论点更有说服力。学习同理——吃透一道难题，比浏览十道简单题收获更大。","每日静坐5分钟（不需要冥想，睁眼坐着就行）可以提高工作记忆容量。原理：短暂的感觉剥夺让默认模式网络（DMN）得到休息，后续注意力更集中。","\"教是最好的学\"——费曼学习法的核心：尝试用自己的话解释一个概念，你立刻知道哪里没真懂。没人在旁边听也没关系，对空气讲都有效。","过度学习（Overlearning）有科学依据：即使已经能答对，再多练2-3次可以让记忆抵抗遗忘的能力翻倍。关键是\"已经会了之后的额外练习\"。","\"生理同步\"效应：学习时心率平稳的时段，信息编码效率更高。紧张时先做几次深呼吸，不只是心理安慰——你在优化大脑的编码窗口。","情境依赖效应：在类似考试的环境下学习（安静、坐着、时间限制），考试时回忆率更高。因为大脑把\"环境线索\"和\"记忆内容\"绑在了一起。","\"近因效应\"：最后学的内容记得最牢。所以练题结束时，快速浏览一遍刚才做错的题——它们在\"近因窗口\"里，明天的回忆率更高。","不要等\"有动力了再学\"。行动先于动力——先翻开题库做1道，动力自然就跟上了。这和大脑的多巴胺环路工作原理一致：预期奖励>实际获得。","\"组块化\"（Chunking）是扩大工作记忆的唯一方法。把相关知识点打包成一个\"组块\"，你一次能处理的信息量就翻了几倍。高手和新手的大脑区别就在这里。","自我解释效应：做题时对自己讲出\"为什么选这个\"（即使在心里默念），理解深度提升40%。这强迫你从\"感觉对了\"升级到\"真懂了\"。","\"归因理论\"：把失败归因于\"努力不够\"（可改变的）而不是\"能力不足\"（不可改变的）的人，下次成绩提升显著。因为努力可以加码，能力听起来像定局。","习惯形成=线索+行为+奖励。设置一个每次学习后的微奖励（比如打勾✅ + 喝口水），大脑就慢慢把\"完成学习\"和\"获得满足感\"绑定了。","环境设计>意志力。把题库快捷方式放在手机桌面最显眼的位置，把社交App藏到文件夹里。不是靠意志力对抗诱惑——是不给诱惑机会。","\"前瞻性记忆\"：告诉自己\"明天早上看到题库图标就点进去\"——比\"我明天要刷题\"有效3倍。因为\"看到图标\"是具体的触发线索，\"要刷题\"只是模糊意图。","\"伊丽莎白·洛夫特斯\"的记忆研究表明：记忆不是录像机，是可塑的。每次回忆都是一次\"重新编辑\"——你可以刻意强化想记住的、弱化想遗忘的。","学习时听音乐的黄金法则：有歌词的音乐占用语音工作记忆（和刷题的文字处理冲突），纯音乐和无声音最佳。如果一定要听，纯器乐、Lo-fi 或白噪音最安全。","\"自我损耗\"理论的更新：最新元分析发现，意志力损耗效应比最初认为的小得多。如果你觉得\"累了学不动了\"，试试先做一道——你比你以为的更有余力。","\"巴德利工作记忆模型\"告诉我们：视觉空间画板和语音回路是两个独立通道。边看图边学文字（双通道）比只看文字（单通道）效率高。给抽象知识配一张简图。","\"默认模式网络\"（DMN）在你发呆时也极度活跃——这是创意的来源。学累了发呆5分钟不是浪费时间，是让大脑在后台整合信息。","\"锚定效应\"影响你的自我评价：不要用\"上次考了多少分\"来定义自己。你的真实水平不是某个数字，而是你每天都在进步的趋势。","\"行动语言\"的力量：对自己说\"我不刷题\"vs\"我不能刷题\"——前者是选择，后者是被迫。主动选择的语言强化了你的自主感，长期坚持的概率翻倍。","人在\"刚好及格\"时学得最投入。如果正确率100%，说明题太简单；如果正确率<50%，说明难度太高。最佳学习区间是正确率65-85%——够挑战但不绝望。","\"闪光灯记忆\"告诉我们：情绪越强烈，记忆越牢固。所以把枯燥的知识点和一件有趣的事、一个生动的画面绑定——大脑会优先保存它们。","自证预言在学习中的力量：如果你相信\"这个科目我就是不行\"，你的大脑自动过滤掉和这个信念矛盾的证据。反过来：\"我在这方面每天都在进步\"——大脑开始收集证明这一点的证据。","时间不是敌人。\"还有30天考试\"和\"只剩30天了\"——同一个事实，不同的框架。前者是机会视角（还有时间进步），后者是威胁视角（来不及了）。刻意选择前者。","效率不是检验学习成果的标准。\"理解得快\"和\"记得牢\"几乎无关。真正预测长期记忆的是：你有没有在遗忘之前主动回忆。慢一点，其实是快一点。","极简主义复习法：只复习错题。因为你做对的题目已经在大脑里有巩固的通路，而错题才是真正需要\"重新编码\"的内容。错题本不是耻辱本——是最高效的复习清单。","身份认同是最深层的驱动力。不要说\"我要刷题\"，说\"我是一个每天学习的人\"。你不是在完成一个任务——你是在成为你想成为的那种人。","5-4-3-2-1 启动法：当你盯着题库就是不想点进去时——不要试图说服自己\"应该学习\"。从5倒数到1，数到0时手指自动点进去。这利用了\"行动锚点\"原理：倒计时切断大脑的犹豫回路，用身体动作绕过了前额叶的阻力。用在健身、起床、任何\"知道该做但不想开始\"的事上同样有效。","费曼技巧的精髓不是\"教给别人\"，是\"找到你不会的地方\"。选一个概念→假装讲给一个完全不懂的人听→卡住的地方就是你没真懂的地方→回去看原资料→简化语言再讲一遍。如果你不能用日常语言讲清楚，说明你只是在识别术语，不是真正理解。","番茄钟的正确用法不是\"25分钟必须到\"。核心是：开始前做一个小决定（\"我只专注25分钟\"），让杏仁核停止报警。如果你的注意力自然周期是45分钟，那就设45分钟。观察自己的节奏，而不是死守规则——工具为你服务，不是反过来。","\"吃青蛙\"法则：每天先做最不想做的那件事。不是因为自虐——是因为决策疲劳在早上最低，意志力储备最充足。把最难的题目放在学习的前15分钟，后面的轻松感会推动你一直学下去。","环境重置法：学习前花2分钟清理桌面（物理的和数字的）。这不是仪式感——是在给大脑发送\"新场景开始了\"的信号。场景转换激活了前额叶的任务切换功能，让你从\"刷手机模式\"真正切换到\"学习模式\"。","如果你总是忘记某个知识点，把它变成一个荒谬的画面。比如\"线粒体内膜折叠成嵴\"→想象一个\"线\"做的\"粒\"子在里面\"折\"叠\"嵴\"柱。大脑对荒谬、生动、有情绪的画面记忆远强于抽象术语——这叫\"图像优势效应\"。","抄写不是学习。用荧光笔划重点也不是。这两种行为的共同问题是：让大脑误以为\"我做了点什么\"而关闭了深度处理。替代方案：合上书，默写你能回忆的内容。回忆的难度=学习的深度。","把大目标分解到\"荒谬地小\"。不是\"今天复习第三章\"，是\"翻开课本到第三章第一页\"。不是\"背50个单词\"，是\"看第1个单词\"。降低启动成本比增加意志力有效10倍——因为启动成本是物理的，意志力从来不可靠。","睡前10分钟\"脑内电影\"：闭眼在脑中快速回放今天学的内容，像放电影一样。不需要太精确——回放的过程本身就是最强的记忆巩固。比起床后复习有效得多，因为你抢在了睡眠记忆整合之前。","\"如果-那么\"计划（执行意图）：给自己设定具体的触发条件。\"如果我看到第一道题不会做，那么我就先跳过做下一道\"。这比\"我要保持冷静\"有效3倍——因为它在应激状态出现之前就预置了应对程序，不需要临场思考。","学习中间容易走神时，试试\"有声思考\"：把自己做题的思路念出来。\"我看到这道题...先想到的是...但是...哦不对应该是...\"。出声能让走神概率降低约60%——因为语音回路占用了一部分容易被杂念劫持的工作记忆。","\"双循环法\"：第一遍快速浏览（不求理解），第二遍精读。第一次让大脑建立框架（\"这章大概讲了什么\"），第二次填充细节。框架+细节的编码比零散的细节编码牢固3倍——因为大脑最喜欢有层次的信息结构。","每天结束时，写下\"明天要做的第一件事\"并放在显眼处。这不是计划——是在利用\"蔡格尼克效应\"让大脑在睡眠中自动预处理这个任务。第二天你会发现开始速度明显变快，因为大脑已经帮你想好了第一步。","奖励会降低创造力。爱德华·德西的经典实验：两组人拼积木，一组给钱一组不给。给钱的一组在实验结束后立刻停止，不给钱的那组反而继续拼。外在奖励把\"玩\"变成了\"工作\"。考试分数同理——盯着分数学习的人，比盯着\"想弄懂这个东西\"的人更容易放弃。最好的动力是好奇心本身。","压力不总是坏事。耶克斯-多德森定律：适度的压力（心跳略快、手心微汗）让表现达到峰值。完全没压力=无聊=低表现。太大压力=恐慌。最佳状态在中间——你觉得自己\"紧张但还能handle\"的时候。所以考试前的一点点紧张不是敌人，是你进入最佳状态的信号。","慢读比快读理解更深。速读培训声称能让你每分钟读2000字，但研究反复证明：阅读速度超过600字/分钟时，理解率急剧下降。眼睛每秒钟只能处理有限信息——\"跳读\"只是在跳过内容，不是更快吸收。快≠好。","你比你以为的更不会判断自己的学习效果。一项经典研究发现：重读3遍的人比只读1遍的人自信得多，但考试成绩完全一样。重读让你\"熟悉\"了内容（错觉），但不是\"掌握\"。真正的检验只有一种方法：合上书，看你能不能回忆出来。","无聊可能是好事。研究发现：当人们被迫独自待在一个房间里15分钟，什么也不做（连手机都没有），之后在创造力测试中得分显著更高。大脑的默认模式网络在\"无聊\"时最活跃——这是创意和整合信息的关键网络。给自己一些\"什么也不做\"的时间。","记笔记越完整，学到的越少。因为当你试图记下每一个字时，大脑在\"转录\"而不是\"处理\"。相反，用自己的话总结、加入自己的疑问和联想——笔记越乱越个性化，学到的东西越多。因为你在输入的同时进行了加工。","你对一个话题越熟悉，越容易高估别人对它的了解。这叫\"知识的诅咒\"——一旦你学会了什么，就很难想象\"不知道\"是什么状态。所以教别人时，宁可解释得太简单，也不要假设对方知道。这也是为什么\"教是最好的学\"——它暴露了你的\"诅咒\"。","多巴胺的陷阱：不是因为手机\"偷走了你的注意力\"。是因为每次刷短视频获得的多巴胺脉冲，让你的大脑对\"学习\"这种低多巴胺活动失去了兴趣。重置不是永远不用手机——是让大脑的奖赏系统重新校准，让\"慢慢理解一个概念\"重新变得有滋味。","考试前突击复习确实有效——但只对短期记忆。突击学习的遗忘曲线在48小时内陡降，而间隔学习的遗忘曲线是平缓的。选择哪种，取决于你是为了明天的考试还是为了长期的掌握。同一个行为，不同的时间分配，结果天差地别。","\"才华\"在长期成就中的贡献被严重高估。对120位顶尖音乐家、运动员和艺术家的追踪研究发现：早期表现出\"才华\"的人，最终达到顶尖水平的比例反而更低。因为早期轻松成功的人，没有建立起\"面对困难的韧性\"。","遗忘不是bug，是feature。如果大脑记住了所有事情，你将无法区分重要信息和无用噪音。遗忘是大脑的\"优先级筛选器\"——它会自然淘汰不被使用的信息。复习的意义不是对抗遗忘，而是告诉大脑：\"这个信息很重要，请保留它。\"","周末不学习不会让你退步。研究显示：间隔2天的复习和间隔1天的复习，长期记忆保留率几乎相同。但心理疲倦感降低了一半。休息日的价值不在学习量，而在你下周回到桌前时的那股新鲜感和期待感。"];

function getDailyInsight() {
  var today = new Date().toISOString().substring(0, 10);
  var si = appData.settings.dailyInsight;
  if (!si || si.date !== today) {
    var idx = Math.floor(Math.random() * DAILY_INSIGHTS.length);
    appData.settings.dailyInsight = { date: today, index: idx, refreshed: false };
    saveData(appData);
  }
  return DAILY_INSIGHTS[appData.settings.dailyInsight.index];
}

function refreshDailyInsight() {
  var today = new Date().toISOString().substring(0, 10);
  var si = appData.settings.dailyInsight;
  if (si && si.refreshed) {
    showToast("今天已经刷新过了，明天再来吧 🌟");
    return;
  }
  var newIdx;
  do {
    newIdx = Math.floor(Math.random() * DAILY_INSIGHTS.length);
  } while (newIdx === (si ? si.index : -1) && DAILY_INSIGHTS.length > 1);
  appData.settings.dailyInsight = { date: today, index: newIdx, refreshed: true };
  saveData(appData);
  renderSettings();
  showToast("🔄 已刷新每日洞见");
}

function showDailyInsightCard() {
  var insight = getDailyInsight();
  var si = appData.settings.dailyInsight || {};
  var canRefresh = !si.refreshed;
  var ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.style.animation = 'none';
  var html = '<div class="modal" style="animation:none;border-radius:var(--radius);max-width:420px;margin:auto;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:24px 20px 20px;max-height:75vh;max-height:75dvh;overflow-y:auto">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">' +
      '<h3 style="margin:0;font-size:18px">💡 每日洞见</h3>' +
      (canRefresh
        ? '<button onclick="event.stopPropagation();refreshDailyInsight();this.closest(\'.modal-overlay\').remove();showDailyInsightCard();" style="background:var(--primary-light);border:1px solid var(--primary-soft);color:var(--primary);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap">🔄 换一条</button>'
        : '<span style="font-size:11px;color:var(--text-tertiary)">今日已刷新</span>') +
    '</div>' +
    '<div style="background:linear-gradient(135deg, #f8fafc 0%, #e0e7ff 50%, #f0fdfa 100%);border-radius:14px;padding:20px 18px;margin-bottom:12px">' +
      '<div style="font-size:16px;line-height:2;color:var(--text)">' + escapeHtml(insight) + '</div>' +
    '</div>' +
    '<div style="font-size:11px;color:var(--text-tertiary);text-align:right">每日洞见 · 基于认知科学与心理学</div>' +
  '</div>';
  ov.innerHTML = html;
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e) { if (e.target === ov) ov.remove(); });
}

function getTodaySummaryBrief() {
  ensureDailyPractice();
  var dp = appData.settings.dailyPractice;
  if (!dp || (!dp.duration && !dp.totalSwitches)) return null;
  var parts = [];
  if (dp.duration > 0) parts.push("⏱ " + fmtDuration(dp.duration));
  var today = new Date().toISOString().substring(0, 10);
  var completed = 0;
  var dates = appData.settings.studyDates || {};
  if (dates[today]) completed = dates[today];
  if (completed > 0) parts.push("📝 " + completed + "题");
  return parts.join(" · ");
}

    '<h3 style="margin:0 0 4px;font-size:18px">📋 今日学习摘要</h3>' +

function fuzzyMatch(u, a) {
  if (!u && !a) return true;
  if (!u || !a) return false;
  const n = s => s.replace(/[，,。！!？?、；;：:""''（）()《》【】…—\-·・\s]/g, '').toLowerCase().trim();
  const ua = n(u), ca = n(a);
  if (ua === ca) return true;
  if (ca.length > 6) {
    const max = Math.max(ua.length, ca.length), set = new Set(ua.split(''));
    let m = 0; for (const ch of ca) if (set.has(ch)) m++;
    return m / max >= 0.7;
  }
  return false;
}

function initApp() {
  try {
  // 激活系统在页面加载时检查，运行时每分钟自检
  getSetting('density', 'low');
  getSetting('voiceEnabled', false);
  getSetting('voiceRate', 0.9);
  getSetting('voicePitch', 1.0);
  // 恢复计时和排序设置
  if (appData.settings.timerMode) timerMode = appData.settings.timerMode;
  if (appData.settings.timerSeconds) timerSeconds = appData.settings.timerSeconds;
  if (appData.settings.wrongFirst !== undefined) wrongFirst = appData.settings.wrongFirst;
  ensureDailyPractice(); // 初始化/跨天重置每日统计
  initTomatoThemeOnLoad(); // 恢复番茄商店主题

  // 一次性数据修复：答案首行与题目重复则清理
  (function() {
    var fixed = 0;
    Object.values(appData.banks || {}).forEach(function(bank) {
      (bank.cards || []).forEach(function(card) {
        var q = (card.question || '').trim();
        var a = (card.answer || '').trim();
        var nl = a.indexOf('\n');
        if (nl > 0 && q) {
          var first = a.substring(0, nl).trim();
          if (first === q || (first.length > 1 && q.includes(first)) || (q.length > 1 && first.includes(q))) {
            card.answer = a.substring(nl + 1).trim();
            delete card.fullText;
            delete card.blanks;
            fixed++;
          }
        }
      });
    });
    if (fixed > 0) { saveData(appData); console.log('数据修复：清理 ' + fixed + ' 张卡片重复首行'); }
  })();

  // 防止刷题时水平滑动退出页面
  let pageStartX = 0, pageStartY = 0;
  document.addEventListener('touchstart', e => {
    pageStartX = e.touches[0].clientX;
    pageStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    // 如果子元素已经处理过（如预览滑动选字），不重复拦截
    if (e.defaultPrevented) return;
    const dx = Math.abs(e.touches[0].clientX - pageStartX);
    const dy = Math.abs(e.touches[0].clientY - pageStartY);
    if (dx > dy && dx > 20) e.preventDefault();
  }, { passive: false });


  // ====== 试用到期检测 ======
  (function() {
    var act = appData.activation;
    if (!act || !act._isTrial || !act._trialExpires) return;
    var now = Date.now();
    // 检测系统时间篡改
    if (act._trialStarted && now < act._trialStarted - 60000) {
      act.tier = 'free';
      act._isTrial = false;
      saveData(appData);
      setTimeout(function() { showToast('⚠️ 检测到系统时间异常，试用已结束'); }, 1000);
      return;
    }
    // 试用到期
    if (now >= act._trialExpires) {
      act.tier = 'free';
      act._isTrial = false;
      saveData(appData);
      setTimeout(function() { showToast('⏰ 试用已结束，已恢复免费版。喜欢请购买激活码～'); }, 1000);
      return;
    }
    // 运行时每分钟检测一次到期
    window._trialExpiryTimer = setInterval(function() {
      if (appData.activation && appData.activation._isTrial && appData.activation._trialExpires && Date.now() >= appData.activation._trialExpires) {
        appData.activation.tier = 'free';
        appData.activation._isTrial = false;
        saveData(appData);
        showToast('⏰ 试用已结束，已恢复免费版。喜欢请购买激活码～');
        if (window._trialExpiryTimer) { clearInterval(window._trialExpiryTimer); window._trialExpiryTimer = null; }
        if (window._trialCountdownTimer) { clearInterval(window._trialCountdownTimer); window._trialCountdownTimer = null; }
      }
    }, 60000);
    // 每30秒刷新倒计时显示
    window._trialCountdownTimer = setInterval(function() {
      if (!appData.activation || !appData.activation._isTrial || !appData.activation._trialExpires) {
        if (window._trialCountdownTimer) { clearInterval(window._trialCountdownTimer); window._trialCountdownTimer = null; }
        return;
      }
      var remaining = Math.max(0, Math.floor((appData.activation._trialExpires - Date.now()) / 1000));
      var min = Math.floor(remaining / 60);
      var sec = remaining % 60;
      var cd = document.getElementById('trialCountdown');
      if (cd) { cd.textContent = '⏱ 试用剩余 ' + min + ' 分 ' + sec + ' 秒 · ' + (TIER_NAMES[appData.activation.tier] || ''); }
    }, 30000);
  })();

  // 跟踪最后聚焦的挖空输入框（移动端键盘有时会在Enter前先失焦）
  var _lastBlankInput = null;
  document.addEventListener('focusin', function(e) {
    if (e.target && e.target.classList.contains('blank-input')) _lastBlankInput = e.target;
  });

  // 输入框自动扩宽：根据输入内容动态调整 size
  document.addEventListener('input', function(e) {
    if (e.target && e.target.classList.contains('blank-input')) {
      var len = e.target.value.length;
      e.target.setAttribute('size', Math.max(len + 1, (e.target.dataset.ans || '').length || 2));
    }
  });

  // 双击挖空显示答案（桌面端用 dblclick 事件）
  document.addEventListener('dblclick', function(e) {
    var inp = e.target.closest('.blank-input');
    if (!inp || inp.classList.contains('revealed')) return;
    if (inp.classList.contains('peeked')) {
      inp.value = '';
      inp.classList.remove('peeked');
      inp.setAttribute('size', Math.max((inp.dataset.ans || '').length, 2));
    } else {
      inp.value = inp.dataset.ans || '';
      inp.setAttribute('size', Math.max((inp.dataset.ans || '').length + 3, 6));
      inp.classList.add('peeked');
    }
  });

  // 切屏监听：任何切后台都计数，练习中额外计数（500ms防抖避免重复计数）
  var _lastSwitchTime = 0;
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      var now = Date.now();
      if (now - _lastSwitchTime < 500) return; // 500ms防抖
      _lastSwitchTime = now;
      ensureDailyPractice();
      appData.settings.dailyPractice.totalSwitches = (appData.settings.dailyPractice.totalSwitches || 0) + 1;
      debouncedSaveData(appData);
      if (practiceState && practiceState.cards && $('practiceActive').style.display !== 'none' && $('practiceResult').style.display === 'none') {
        practiceSwitches++;
            // 番茄钟模式：切屏警告
            if (appData.settings && appData.settings.pomodoro) {
              if (practiceSwitches >= 2) {
                showToast("🍅 番茄钟：切屏已达上限，练习已暂停");
                setTimeout(function() { showPracticeResult(); }, 1500);
                return;
              } else if (practiceSwitches === 1) {
                showToast("🍅 番茄钟：再切屏1次将自动结束练习！");
              } else {
                showToast("🍅 番茄钟进行中，请专注！");
              }
            }

      }
    }
  });

  function handleBlankEnter(e) {
    var activeEl = document.activeElement;
    // 如果当前焦点不在输入框上，用上次跟踪的
    // 不拦截 textarea 和非挖空 input 的 Enter（如开发者留言等）
    if (activeEl && (activeEl.tagName === 'TEXTAREA' || (activeEl.tagName === 'INPUT' && !activeEl.classList.contains('blank-input')))) {
      return;
    }
    if (!activeEl || !activeEl.classList.contains('blank-input')) {
      if (_lastBlankInput && document.body.contains(_lastBlankInput)) {
        activeEl = _lastBlankInput;
      } else {
        // 焦点不在输入框 → 全局快捷键（仅练习模式）
        if (practiceState && practiceState.cards && $('practiceActive').style.display !== 'none' && $('practiceResult').style.display === 'none') {
          if (e.key === 'ArrowLeft' || e.keyCode === 37) {
            e.preventDefault();
            if (practiceState.index > 0) { saveCurrentAnswers(); practiceState.index--; renderPracticeCard(); }
            return;
          }
          if (e.key === 'ArrowRight' || e.keyCode === 39) {
            e.preventDefault();
            if (practiceState.index < practiceState.total - 1) { saveCurrentAnswers(); practiceState.index++; renderPracticeCard(); }
            else { saveCurrentAnswers(); practiceState.index++; renderPracticeCard(); }
            return;
          }
          if (e.key === ' ' || e.keyCode === 32 || e.code === 'Space') {
            e.preventDefault();
            if (appData.settings.voiceEnabled) speakCard();
            else showToast('请先在设置中开启语音朗读');
            return;
          }
          if (e.key === 'Enter' || e.keyCode === 13 || e.code === 'Enter') {
            e.preventDefault();
            checkMyAnswers();
            return;
          }
        }
        return;
      }
    }
    if (e.key === 'Enter' || e.keyCode === 13 || e.code === 'Enter') {
      e.preventDefault();
      e.stopPropagation();
      // 练习模式：先用 saveCurrentAnswers 保存
      if (practiceState && practiceState.cards) {
        saveCurrentAnswers();
      }
      // 找当前输入框所在容器内的所有同类输入框
      var container = activeEl.closest('#cardText, [id^="wrongBlanks_"]');
      if (!container) container = activeEl.parentElement;
      var inputs = Array.prototype.slice.call(container.querySelectorAll('.blank-input'));
      var curIdx = inputs.indexOf(activeEl);
      if (curIdx < 0) { activeEl.blur(); return; }

      // 检查是否全填了（仅练习模式需要检查答案）
      if (practiceState && practiceState.cards) {
        var card = practiceState.cards[practiceState.index];
        var ua = practiceState.answers[card.id] || {};
        var allFilled = true;
        for (var i = 0; i < inputs.length; i++) {
          var bidx = parseInt(inputs[i].dataset.bidx);
          if (bidx >= 0 && !(ua[bidx] || '').trim()) { allFilled = false; break; }
        }
        if (allFilled) {
          checkMyAnswers();
          if (activeEl) activeEl.blur();
          return;
        }
      }

      // 跳到下一个空（先往后找，再从头找）
      var target = -1;
      for (var i = curIdx + 1; i < inputs.length; i++) {
        if (!inputs[i].value.trim()) { target = i; break; }
      }
      if (target === -1) {
        for (var i = 0; i < curIdx; i++) {
          if (!inputs[i].value.trim()) { target = i; break; }
        }
      }
      // 如果全填了且不是练习模式，直接 blur
      if (target === -1) {
        activeEl.blur();
      } else {
        // 移动端 setTimeout 确保焦点切换可靠
        setTimeout(function() { inputs[target].focus(); }, 10);
      }
    }
  }
  document.addEventListener('keydown', handleBlankEnter);

  // 首次打开检测：如果完全没数据，提示文件位置注意事项
  const banksExist = Object.keys(appData.banks).length > 0;
  const hasAnyData = banksExist || localStorage.getItem(STORAGE_KEY);
  const seenTip = sessionStorage.getItem('memorize_location_tip');
  if (!hasAnyData && !seenTip) {
    sessionStorage.setItem('memorize_location_tip', '1');
    setTimeout(() => {
      showToast('💡 提示：数据随浏览器存储，请将文件放在固定位置使用，移动位置可能导致之前的数据看不到');
    }, 800);
  }

  // 从云端拉取开发者留言
  apiGet('/author-note').then(function(r) {
    if (r && r.text) {
      appData.settings._cloudAuthorNote = r.text;
      appData.settings._cloudAuthorNoteTime = r.updatedAt;
      // 如果本地没有开发者留言，用云端的更新本地显示
      if (!appData.settings.authorNote) {
        appData.settings.authorNote = r.text;
      }
    }
  }).catch(function(e) { console.warn('[API] 获取云端开发者留言失败:', e.message); });

  checkEveningMode();
  switchTab('banks');
  // showIntroModal() 已移除 — 不再弹出欢迎提示
  } catch(e) {
    console.error('initApp error:', e);
    showFatalError(e.message || '初始化异常');
  }
}

  for (var i = 0; i < Math.min(results.length, 50); i++) {

    var aHighlight = (aFull.toLowerCase().indexOf(q.toLowerCase()) !== -1) ? highlightMatch(aPreview, q) : escapeHtml(aPreview);
    html += '<div style="cursor:pointer;padding:12px 14px;margin-bottom:8px;background:var(--bg-card);border-radius:var(--radius-sm);border:1px solid var(--border)" onclick="navigateToSearchResult(\'' + r.bankId + '\', ' + r.cardIndex + ')">' +

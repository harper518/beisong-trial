/* ============ Reset ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:var(--font-size);line-height:1.6;color:var(--text);background:var(--bg);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
}
body{max-width:480px;margin:0 auto;min-height:100dvh;padding-bottom:calc(72px + var(--safe-bottom));overflow-x:hidden;overscroll-behavior:none;touch-action:pan-y}
input,textarea,select,button{font-family:inherit;font-size:inherit}
input[type="text"],input[type="search"],textarea{user-select:text;-webkit-user-select:text}

/* ============ Buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-size:var(--font-size);font-weight:600;cursor:pointer;transition:all var(--transition);white-space:nowrap;min-height:44px;touch-action:manipulation;letter-spacing:.01em}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:var(--bg-card);color:var(--primary);border:2px solid var(--primary)}
.btn-ghost{background:var(--bg-input);color:var(--text);border:none}
.btn-sm{padding:6px 14px;font-size:13px;min-height:34px;border-radius:var(--radius-xs)}
.btn-lg{padding:14px 28px;font-size:17px;min-height:52px;border-radius:var(--radius)}
.btn-block{width:100%;justify-content:center}

/* ============ Cards ============ */
.card{background:var(--bg-card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px;overflow-wrap:break-word;word-break:break-word}

/* ============ Bottom Tab Bar ============ */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(68px + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--bg-card);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tab-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px 2px;border:none;background:none;color:var(--text-tertiary);font-size:10px;font-weight:500;cursor:pointer;transition:all var(--transition);position:relative;flex:1}
.tab-item .tab-icon{font-size:21px;line-height:1;transition:transform var(--transition)}
.tab-item.active{color:var(--primary);font-weight:700}
.tab-item.active .tab-icon{transform:scale(1.08)}
.tab-item .badge{position:absolute;top:1px;left:55%;background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:9px;padding:0 5px;transform:translateX(4px)}

/* ============ Pages ============ */
.page{display:none;padding:12px 12px 20px;animation:pageIn .25s ease}.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}

/* ============ Bank List ============ */
.bank-item{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--bg-card);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow-sm);border:1px solid var(--border);cursor:pointer;transition:all var(--transition);gap:12px;position:relative;overflow:hidden}
.bank-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary);border-radius:0 3px 3px 0;opacity:0;transition:opacity var(--transition)}
.bank-item:active{background:var(--bg-input);transform:scale(.985)}
.bank-item:active::before{opacity:1}
.bank-item .info{flex:1;min-width:0}
.bank-item .name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.bank-item .meta{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.bank-item .actions{display:flex;gap:4px;flex-shrink:0}
.bank-item .actions .btn-icon{width:36px;height:36px;padding:0;border-radius:50%;background:var(--bg-input);border:none;color:var(--text-secondary);font-size:var(--font-size);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
.bank-item .actions .btn-icon:active{background:var(--primary-soft);color:var(--primary)}
.btn-sort{width:44px;height:44px;padding:0;border:1px solid var(--border);border-radius:8px;background:var(--bg-input);color:var(--text-tertiary);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:all var(--transition);position:relative;z-index:2;appearance:none;-webkit-appearance:none;touch-action:manipulation}
.btn-sort:hover:not(:disabled){background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.btn-sort:active:not(:disabled){background:var(--primary);color:#fff}
.btn-sort:disabled{opacity:.25;cursor:not-allowed;pointer-events:none}
.file-input{opacity:0;position:fixed;left:-9999px;top:-9999px}

/* ============ Empty State ============ */
.empty{text-align:center;padding:56px 24px;color:var(--text-secondary)}
.empty .icon{font-size:52px;margin-bottom:14px;display:block;opacity:.8}
.empty h3{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty p{font-size:14px;line-height:1.7}

/* ============ Chip Selectors ============ */
.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 18px;border-radius:22px;border:2px solid var(--border);background:var(--bg-card);font-size:var(--font-size-sm);font-weight:500;cursor:pointer;transition:all var(--transition);white-space:nowrap;color:var(--text-secondary)}
.chip:active{transform:scale(.96)}
.chip.active{background:var(--primary-light);border-color:var(--primary);color:var(--primary);font-weight:700}

/* ============ Forms ============ */
textarea,input[type="number"]{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:var(--font-size);font-family:inherit;background:var(--bg-card);color:var(--text);transition:all var(--transition);-webkit-appearance:none}
select{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:var(--font-size);font-family:inherit;background:var(--bg-card);color:var(--text);transition:all var(--transition)}
textarea:focus,input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(8,145,178,.08)}
select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(8,145,178,.08)}
textarea{min-height:160px;resize:vertical;line-height:1.8;overflow-y:auto}
.form-group{margin-bottom:14px}
.form-label{font-size:14px;font-weight:700;margin-bottom:8px;display:block;color:var(--text)}
.form-hint{font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.5}

/* ============ Practice Card ============ */

.practice-card{background:var(--bg-card);border-radius:var(--radius);padding:14px 14px;box-shadow:var(--shadow-md);border:1px solid var(--border);min-height:100px;margin-bottom:10px;position:relative}
.practice-card .card-text{font-size:var(--font-size-lg);line-height:2.0;word-break:break-word;overflow-wrap:break-word;overflow-x:hidden}
.practice-card .blank-input{
  display:inline-block;min-width:28px;max-width:80px;
  padding:2px 4px;border:none;border-bottom:2px dashed var(--blank-border);
  background:var(--blank-bg);border-radius:4px 4px 0 0;
  font-size:var(--font-size-lg);font-weight:500;line-height:1.5;
  text-align:center;color:var(--text);
  transition:all var(--transition);margin:0 2px;vertical-align:baseline;
}
.practice-card .blank-input:focus{
  outline:none;border-bottom-color:var(--primary);border-bottom-style:solid;
  background:var(--primary-light);box-shadow:0 2px 8px rgba(8,145,178,.12);
  transform:translateY(-1px);
}
.practice-card .blank-input.revealed{
  border-bottom-color:var(--success);border-bottom-style:solid;
  background:var(--blank-revealed-bg);color:var(--blank-revealed-text);
}
.practice-card .blank-input.correct{
  border-bottom-color:var(--success);border-bottom-style:solid;
  background:var(--success-light);
}
.practice-card .blank-input.wrong{
  border-bottom-color:var(--danger);border-bottom-style:solid;
  background:var(--danger-light);color:var(--danger);
}
.practice-card .revealed-text{color:var(--blank-revealed-text);font-weight:700;padding:1px 3px;border-radius:3px;background:var(--blank-revealed-bg)}

/* ============ Browse ============ */
.browse-dir-item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg-card);border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--transition)}
.browse-dir-item:active{background:var(--bg-input)}
.browse-dir-item:first-of-type{border-radius:var(--radius) var(--radius) 0 0}

/* ============ Koujue Panel (in practice) ============ */
.kj-panel{background:var(--primary-light);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:14px;display:none;border:1px solid var(--primary-soft)}
.kj-panel.show{display:block;animation:pageIn .2s ease}
.kj-panel .kj-keywords{font-size:var(--font-size-lg);font-weight:800;color:var(--primary);letter-spacing:.08em}
.kj-panel .kj-full{font-size:14px;color:var(--text);margin-top:8px;padding-top:8px;border-top:1px dashed var(--primary-soft);line-height:2;display:none}
.kj-panel .kj-full.show{display:block}
.kj-panel .kj-tap-hint{font-size:11px;color:var(--text-tertiary);margin-top:6px}

/* ============ Koujue Cards ============ */
.kj-card{background:var(--bg-card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);cursor:pointer;transition:all var(--transition);margin-bottom:8px}
.kj-card:active{background:var(--primary-soft)}
.kj-card .kj-mnemonic{font-size:var(--font-size-lg);font-weight:800;color:var(--primary);letter-spacing:.05em;line-height:2}
.kj-card .kj-meaning{font-size:var(--font-size);color:var(--text);margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);line-height:2;display:none}
.kj-card .kj-meaning.show{display:block;animation:pageIn .2s ease}
.kj-card .kj-meaning .kj-char{color:var(--primary);font-weight:700}
.kj-card .kj-meaning .kj-desc{color:var(--text-secondary);font-size:var(--font-size-sm)}

/* ============ Segmented Control ============ */
.segmented{display:inline-flex;background:var(--bg-input);border-radius:10px;padding:3px;gap:0}
.segmented .seg{padding:8px 16px;border:none;background:transparent;border-radius:8px;font-size:14px;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:all var(--transition);min-height:38px;white-space:nowrap}
.segmented .seg.active{background:var(--bg-card);color:var(--text);font-weight:700;box-shadow:var(--shadow-sm)}

/* ============ Modal ============ */
.modal-overlay{position:fixed;inset:0;background:var(--bg-overlay);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:pageIn .2s ease;touch-action:pan-y;overscroll-behavior:none}
.modal{background:var(--bg-card);border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:88dvh;overflow-y:auto;padding:22px 18px 28px;animation:slideUp .35s ease;overscroll-behavior:none}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:18px;font-weight:800}

/* ============ Settings ============ */
.section{margin-bottom:26px}
.section-title{font-size:12px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;padding-left:4px}
.setting-item{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;background:var(--bg-card);border-bottom:1px solid var(--border);gap:14px;transition:background var(--transition)}
.setting-item:first-of-type{border-radius:var(--radius) var(--radius) 0 0}
.setting-item:last-of-type{border-radius:0 0 var(--radius) var(--radius);border-bottom:none}
.setting-item:only-of-type{border-radius:var(--radius);border-bottom:none}
.setting-label{font-weight:600;font-size:var(--font-size)}
.setting-desc{font-size:13px;color:var(--text-secondary);margin-top:1px}

/* ============ Toggle ============ */
.toggle{position:relative;width:51px;height:31px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:31px;transition:var(--transition)}
.toggle .slider::before{content:"";position:absolute;height:25px;width:25px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:var(--transition);box-shadow:0 2px 4px rgba(0,0,0,.15)}
.toggle input:checked+.slider{background:var(--primary)}
.toggle input:checked+.slider::before{transform:translateX(20px)}
/* 设置页顶部 header */
.settings-header{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px;min-height:44px}
.settings-header-title{font-size:17px;font-weight:700;color:var(--text)}
/* 头像 */
.avatar-circle{width:44px;height:44px;border-radius:50%;background:var(--bg-input);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:all var(--transition);flex-shrink:0}
.avatar-circle:active{transform:scale(.92)}
.avatar-circle img{width:100%;height:100%;object-fit:cover}
.avatar-placeholder{font-size:22px;line-height:1}
/* 可折叠 section */
.section-header{cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding-left:4px;-webkit-tap-highlight-color:transparent;user-select:none;min-height:32px}
.section-arrow{font-size:10px;color:var(--text-tertiary);transition:transform .25s;margin-left:8px;flex-shrink:0}
.section-arrow.collapsed{transform:rotate(-90deg)}
.section-body{overflow:hidden;transition:max-height .3s ease,opacity .3s ease}
.section-body.collapsed{max-height:0!important;opacity:0;margin:0}

/* ============ Preview (Import) ============ */
.preview-answer{line-height:2.6;font-size:var(--font-size-lg);letter-spacing:.08em;user-select:none;-webkit-user-select:none}
.preview-char{padding:1px 2px;border-radius:3px;cursor:pointer;transition:all .1s;border:1px solid transparent}
.preview-char:active{transform:scale(.9)}
.preview-char.char-sel{background:var(--warning);border-color:var(--warning);color:#fff}
.preview-char.saved{cursor:default}
.newline-marker{display:inline-block;opacity:.22;cursor:pointer;font-weight:700;transition:all .15s;user-select:none;-webkit-user-select:none;min-width:14px;text-align:center;padding:0 2px}
.newline-marker:hover{opacity:.6;transform:scale(1.25)}
.newline-marker:active{opacity:.9;transform:scale(.85)}
.merge-undo-dot{display:inline-block;background:var(--primary-light);color:var(--primary);border-radius:50%;width:16px;height:16px;line-height:16px;text-align:center;font-size:12px;margin:0 1px;cursor:pointer;font-weight:700;transition:all .15s;user-select:none;-webkit-user-select:none}
.merge-undo-dot:hover{background:var(--primary);color:#fff;transform:scale(1.15)}
.merge-undo-dot:active{transform:scale(.85)}
.preview-card{background:var(--bg-card);border-radius:var(--radius);padding:16px 18px;border:1px solid var(--border);margin-bottom:10px}
.preview-card .preview-text{font-size:var(--font-size);line-height:2.2;word-break:break-word;overflow-wrap:break-word;overflow-x:hidden}
.preview-card .blank-tag{display:inline-block;background:var(--warning);padding:3px 12px;border-radius:14px;font-size:12px;color:#fff;cursor:pointer;margin:2px;font-weight:600;transition:all var(--transition)}
.preview-card .blank-tag.removed{background:var(--text-tertiary);text-decoration:line-through;opacity:.6}
.preview-card .blank-highlight{background:var(--blank-bg);border-bottom:2px solid var(--blank-border);border-radius:3px;padding:1px 5px}

/* ============ Toast ============ */
.toast-container{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 22px;border-radius:22px;background:#1e293b;color:#fff;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toastIn .35s ease,toastOut .3s ease 1.8s forwards;text-align:center;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-8px)}}

/* ============ Sequence Progress ============ */
.seq-info{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--primary-light);border-radius:var(--radius-sm);font-size:13px;margin-top:8px;gap:8px}
.seq-info b{color:var(--primary)}

/* ============ Utility ============ */
.text-center{text-align:center}.text-sm{font-size:var(--font-size-sm)}.text-secondary{color:var(--text-secondary)}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}.mt-6{margin-top:6px}.mt-10{margin-top:10px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-6{margin-bottom:6px}.mb-10{margin-bottom:10px}
.flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-center{justify-content:center}.justify-between{justify-content:space-between}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-16{gap:16px}.flex-1{flex:1}.hidden{display:none!important}.w-full{width:100%}
.flex-wrap{flex-wrap:wrap}

/* ============ Responsive ============ */
@media(min-width:481px){
  .modal{border-radius:var(--radius);margin-bottom:20px;max-height:85dvh}
  .modal-overlay{align-items:center}
}
/* ============ iPad ============ */
@media(min-width:768px){
  body{max-width:768px}
  :root{--font-size-lg:19px;--font-size-xl:22px}
  .page{padding:16px 20px 24px}
  .practice-card{padding:22px 24px}
  .practice-card .blank-input{min-width:48px;max-width:160px}
  .bank-item{padding:18px 22px}
  .tab-bar{max-width:768px}
  .preview-answer{font-size:19px;line-height:2.8;letter-spacing:.1em}
  .preview-char{padding:2px 3px}
  .browse-dir-item{padding:14px 18px}
}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

@media (pointer: coarse) {
  .btn, .chip, .tab-item, .bank-item, .setting-item { min-height: 44px; }
  .color-dot { min-height: 20px; min-width: 20px; }
  .btn-sm { min-height: 36px; }
  .desktop-only { display: none !important; }
}

/* ====== PWA 安装引导横幅 ====== */

  display: none;
  position: fixed;
  bottom: 16px;
  left: 16px;
  right: 16px;
  z-index: 9998;
  background: #fff;
  border: 2px solid var(--primary);
  border-radius: 14px;
  padding: 14px 16px;
  box-shadow: 0 6px 24px rgba(0,0,0,.15);

  align-items: center;
  gap: 12px;
}
.pwa-install-banner.show { display: flex; }
.pwa-install-banner .pwa-close {
  position: absolute;
  top: 6px;
  right: 10px;

.pwa-install-banner .pwa-btn {

  border: none;
  border-radius: 8px;
  padding: 8px 16px;

/* ====== 学习计划banner ====== */
.exam-banner { border-radius:12px; padding:14px 16px; margin-bottom:16px; cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.exam-banner.green { background:#e8f5e9; border:1px solid #a5d6a7; color:#2e7d32; }
.exam-banner.yellow { background:#fff8e1; border:1px solid #ffe082; color:#e65100; }
.exam-banner.red { background:#ffebee; border:1px solid #ef9a9a; color:#c62828; }
.exam-banner.gray { background:#f5f5f5; border:1px solid #e0e0e0; color:#757575; }
.exam-banner:active { transform:scale(.98); }
.exam-banner .exam-banner-main { flex:1; min-width:0; }
.exam-banner .exam-banner-title { font-size:15px; font-weight:700; }
.exam-banner .exam-banner-sub { font-size:12px; opacity:.85; margin-top:2px; }
.exam-banner .exam-banner-progress { width:100%; height:6px; background:rgba(0,0,0,.1); border-radius:3px; overflow:hidden; margin-top:6px; }
.exam-banner .exam-banner-progress-fill { height:100%; border-radius:3px; transition:width .4s; background:currentColor; opacity:.5; }

/* ====== 章节掌握度 ====== */
.chapter-stat-row { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .15s; min-height:44px; }
.chapter-stat-row:active { background:var(--bg-input); }
.chapter-stat-name { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px; }
.chapter-stat-count { font-size:11px; color:var(--text-tertiary); white-space:nowrap; }
.chapter-stat-bar { flex:1; height:8px; background:var(--border); border-radius:4px; overflow:hidden; min-width:40px; }
.chapter-stat-fill { height:100%; border-radius:4px; transition:width .4s; }
.chapter-stat-fill.green { background:#4caf50; }
.chapter-stat-fill.yellow { background:#ff9800; }
.chapter-stat-fill.red { background:#f44336; }
.chapter-stat-pct { font-size:13px; font-weight:700; white-space:nowrap; min-width:38px; text-align:right; }

/* ====== 浏览页章节TAB ====== */
.browse-tabs { display:flex; gap:0; margin-bottom:14px; background:var(--bg-input); border-radius:10px; padding:3px; }
.browse-tab { flex:1; padding:8px 6px; text-align:center; font-size:13px; font-weight:600; border-radius:8px; cursor:pointer; transition:all .15s; border:none; background:transparent; color:var(--text-secondary); }
.browse-tab.active { background:var(--bg-card); color:var(--primary); box-shadow:var(--shadow-sm); }

/* ====== 冲刺卡片 ====== */

<script>
// ==================== 授权激活（本地验证） ====================
const AUTH_CODES = ['5826'];
const AUTH_MINUTES = 10;

function getAuthData() {
  try {
    const raw = localStorage.getItem('memorize_auth_data');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function isPermanentAuth() {
  const d = getAuthData();
  return d && d.permanent === true;
}

function checkAuth() {
  if (isPermanentAuth()) return true;
  const d = getAuthData();
  if (!d || !d.expireAt) return false;
  if (Date.now() >= d.expireAt) { localStorage.removeItem('memorize_auth_data'); return false; }
  return true;
}

function showAuthModal() {
  localStorage.removeItem('memorize_auth_data');
  let attempts = 0, locked = false;
  // 隐藏所有页面内容，显示简洁验证页
  var pages = document.querySelectorAll('.page');
  for (var p = 0; p < pages.length; p++) pages[p].style.display = 'none';
  var tabBar = document.querySelector('.tab-bar');
  if (tabBar) tabBar.style.display = 'none';
  var ov = document.createElement('div');
  ov.id = 'authModal';
  ov.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9999;padding:20px';
  ov.innerHTML = `<div style="width:100%;max-width:340px;text-align:center">
    <div style="font-size:48px;margin-bottom:12px">🔐</div>
    <h3 style="margin-bottom:6px;font-size:20px;font-weight:700;color:var(--text)">授权验证</h3>
    <p style="color:var(--text-secondary);font-size:14px;margin-bottom:16px">请输入授权密码，有效期 10 分钟</p>
    <input type="text" inputmode="numeric" id="authInput" placeholder="输入密码" autocomplete="off" style="width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:10px;background:var(--bg-card);color:var(--text);font-size:20px;text-align:center;letter-spacing:6px">
    <p class="text-sm" id="authError" style="text-align:center;color:var(--danger);margin-top:10px;display:none"></p>
    <button class="btn btn-primary btn-block mt-12" id="authBtn" style="margin-top:12px">验证</button>
    <p style="color:var(--text-tertiary);font-size:13px;margin-top:16px">请联系微信获取密码</p>
  </div>`;
  document.body.appendChild(ov);

  const input = document.getElementById('authInput');
  const btn = document.getElementById('authBtn');
  const err = document.getElementById('authError');

  let lockTime = 0, countdownId = 0;
  function doAuth() {
    if (locked) return;
    const password = input.value.trim();
    if (!password) return;
    btn.disabled = true; btn.textContent = '验证中...';

    const currentLevel = (getAuthData() && getAuthData().level) || 0;

    // 永久密码（最后一个）无论当前 level 都可以直接使用
    if (password === AUTH_CODES[AUTH_CODES.length - 1]) {
      localStorage.setItem('memorize_auth_data', JSON.stringify({
        level: AUTH_CODES.length - 1,
        expireAt: null,
        permanent: true
      }));
      ov.remove();
      var pages2 = document.querySelectorAll('.page');
      for (var q = 0; q < pages2.length; q++) pages2[q].style.display = '';
      var tb2 = document.querySelector('.tab-bar');
      if (tb2) tb2.style.display = '';
      try { initApp(); } catch(e) { console.error('initApp error:', e); showFatalError(e.message || '初始化异常'); }
      return;
    }

    // 当前层级密码验证
    if (password === AUTH_CODES[currentLevel]) {
      const isLast = currentLevel >= AUTH_CODES.length - 1;
      const expireAt = isLast ? null : Date.now() + AUTH_MINUTES * 60 * 1000;
      const newLevel = isLast ? currentLevel : currentLevel + 1;
      localStorage.setItem('memorize_auth_data', JSON.stringify({
        level: newLevel,
        expireAt: expireAt,
        permanent: isLast
      }));
      ov.remove();
      var pages3 = document.querySelectorAll('.page');
      for (var r = 0; r < pages3.length; r++) pages3[r].style.display = '';
      var tb3 = document.querySelector('.tab-bar');
      if (tb3) tb3.style.display = '';
      try { initApp(); } catch(e) { console.error('initApp error:', e); showFatalError(e.message || '初始化异常'); }
      return;
    }

    // 密码错误
    attempts++;
    if (attempts >= 3) {
      locked = true; lockTime = Date.now();
      btn.disabled = true; input.disabled = true;
      countdownId = setInterval(() => {
        const remain = 30 - Math.floor((Date.now() - lockTime) / 1000);
        if (remain <= 0) { clearInterval(countdownId); err.textContent = ''; return; }
        err.textContent = '输错 3 次，已锁定 ' + remain + ' 秒';
      }, 1000);
      err.style.display = 'block';
      setTimeout(() => {
        locked = false; attempts = 0;
        err.style.display = 'none';
        btn.disabled = false; input.disabled = false;
        input.value = ''; input.focus();
      }, 30000);
    } else {
      err.textContent = '密码错误（' + attempts + '/3）';
      err.style.display = 'block';
      input.value = '';
      input.focus();
    }
    btn.disabled = false; btn.textContent = '验证';
  }

  btn.onclick = doAuth;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
  // 不自动聚焦，让用户手动点击输入框（移动端键盘需要用户手势才能弹出）
}

  const medCards = [
    { id:'m1', question:'1.窒息发生时的表现和抢救', answer:'窒息表现：咯血突然减少或中止，病人感胸闷、憋气、出冷汗，随即烦躁、表情紧张或惊恐、两手乱动或手指喉头，继而出现发绀、呼吸窘迫、全身抽搐、昏迷，甚至心跳、呼吸停止而死亡。\\n\\n窒息抢救：①对大咯血及意识不清的病人，应在病床旁备好急救设备，一旦病人出现窒息征象，应立即取头低脚高45°俯卧位，头偏向一侧，轻拍背部，迅速排出在气道和口咽部的血块，或直接刺激咽部以咳出血块。②必要时用吸痰管进行负压吸引。③给予高浓度吸氧。④做好气管插管或气管切开的准备与配合工作，以解除呼吸道阻塞。', koujue:'', chapter:'内科护理学' },
    { id:'m2', question:'2.慢性肾衰的饮食护理', answer:'①饮食原则：优质低蛋白，充足热量，低盐，低钾，低磷饮食。\\n②蛋白质：慢性肾衰竭病人应限制蛋白质的摄入，且饮食中50%以上的蛋白质为优质蛋白，如鸡蛋，牛奶，瘦肉，鱼等动物蛋白，与豆制品等植物蛋白摄入比例一般为1：1。\\n③热量：供给病人足够的热量，以减少体内蛋白质的消耗，摄入热量的70%由碳水化合物供给，可选用热量高，蛋白质含量低的食物。\\n④其他：脂肪摄入不超过总热量的30%，一般每天钠摄入量不超过2g，低磷饮食，补充水溶性维生素和矿物质。', koujue:'', chapter:'内科护理学' },

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return getPresetData_7666();
    const d = JSON.parse(raw);
    // 数据结构校验：防止损坏数据导致后续崩溃
    if (!d || typeof d !== 'object') return getPresetData_7666();
    if (!d.banks || typeof d.banks !== 'object') d.banks = {};
    if (!d.settings || typeof d.settings !== 'object') d.settings = {};
    if (!d.seqProgress || typeof d.seqProgress !== 'object') d.seqProgress = {};
    if (!d.favorites || typeof d.favorites !== 'object') d.favorites = {};
    if (!d.wrongBooks || typeof d.wrongBooks !== 'object') d.wrongBooks = {};
    // 校验每个题库的 cards 是数组，防止后续 .cards.length/.cards.forEach 崩溃
    if (d.banks) {
      for (const bid of Object.keys(d.banks)) {
        const b = d.banks[bid];
        if (!b || typeof b !== 'object') { delete d.banks[bid]; continue; }
        if (!Array.isArray(b.cards)) b.cards = [];
        // 校验每张卡是对象
        b.cards = b.cards.filter(function(c) { return c && typeof c === 'object'; });
      }
    }
    return Object.assign({ banks:{}, settings:{}, seqProgress:{}, favorites:{}, wrongBooks:{} }, d);
  }
  catch(e) {
    console.error('loadData error, using preset:', e);
    return getPresetData_7666();
  }
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    if (e.name === 'QuotaExceededError' || e.code === 22 ||
        (e.message && e.message.toLowerCase().indexOf('quota') !== -1)) {
      showToast('⚠️ 存储空间已满！请立即导出备份，然后清理旧数据');
    }
    console.error('saveData error:', e);
  }
}

function countMasteredQuestions() {
  var mastered = 0, total = 0;
  var banks = Object.values(appData.banks || {});
  for (var i = 0; i < banks.length; i++) {
    var cards = banks[i].cards || [];
    total += cards.length;
    for (var j = 0; j < cards.length; j++) {
      if (cards[j].srStage >= 4) mastered++;
    }
  }
  return { mastered: mastered, total: total, unmastered: total - mastered };
}

function countTotalQuestions() {
  var total = 0;
  var banks = Object.values(appData.banks || {});
  for (var i = 0; i < banks.length; i++) {
    total += (banks[i].cards || []).length;
  }
  return total;
}

function getExamDaysLeft() {


  var examDate = (appData.settings || {}).examDate;
  if (!examDate) return null;
  var now = new Date();
  var exam = new Date(examDate + 'T00:00:00');
  var diff = Math.ceil((exam.getTime() - now.getTime()) / 86400000);
  return diff;
}

function getDailyTarget() {
  var s = appData.settings || {};
  if (s.dailyTarget && s.dailyTarget > 0) return s.dailyTarget;
  var daysLeft = getExamDaysLeft();
  if (daysLeft === null || daysLeft <= 0) return 0;
  var stats = countMasteredQuestions();
  if (stats.unmastered <= 0) return 0;
  return Math.max(1, Math.ceil(stats.unmastered / Math.max(1, daysLeft)));
}

function getISOWeek(dateStr) {
  var d = new Date(dateStr + 'T12:00:00');
  var dayNum = d.getDay() || 7;
  d.setDate(d.getDate() + 4 - dayNum);
  var yearStart = new Date(d.getFullYear(), 0, 1);
  var weekNum = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return d.getFullYear() + '-W' + (weekNum < 10 ? '0' : '') + weekNum;
}

function addToWeekStats(dateStr, duration, switches) {
  if (!appData.settings.weeklyStats) appData.settings.weeklyStats = {};
  var wk = getISOWeek(dateStr);
  if (!appData.settings.weeklyStats[wk]) appData.settings.weeklyStats[wk] = { duration: 0, switches: 0 };
  appData.settings.weeklyStats[wk].duration += duration;
  appData.settings.weeklyStats[wk].switches += switches;
}

}

function fmtDuration(seconds) {
  if (!seconds || seconds < 0) seconds = 0;
  if (seconds < 60) return seconds + '秒';
  var mins = Math.floor(seconds / 60);
  if (mins < 60) return mins + '分钟';
  var hrs = Math.floor(mins / 60);
  var remainMin = mins % 60;
  return remainMin > 0 ? hrs + '小时' + remainMin + '分钟' : hrs + '小时';
}

function getChapterStats(bankId) {
  var bank = appData.banks[bankId];
  if (!bank) return [];
  var chapters = {};
  var cards = bank.cards || [];
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var ch = (card.chapter || '未分类').trim();
    if (!chapters[ch]) chapters[ch] = { name: ch, total: 0, mastered: 0 };
    chapters[ch].total++;
    if (card.srStage >= 4) chapters[ch].mastered++;
  }
  var result = Object.values(chapters);
  result.sort(function(a, b) { return b.total - a.total; });
  return result;
}

}

// ==================== 自动挖空算法 ====================
const STOP_WORDS = new Set(['的','了','是','在','和','与','或','对','从','到','等','这','那','其','之','也','就','都','但','而','且','所','被','把','让','向','同','及','以及','着','过','可以','能够','需要','应该','必须','可能','已经','正在','将要','没有','不是','什么','怎么','怎样','如何','为什么','哪个','哪里','因为','所以','虽然','但是','如果','即使','除非','无论','不管','进行','使用','通过','根据','关于','对于','由于','为了','一个','一种','这个','这种','一些','这些','那些','每个','第一','第二','第三','首先','其次','最后','然后','接着','方面','部分','情况','过程','结果','作用','功能','特点','具有','形成','产生','发生','发展','变化','包括','包含','主要','重要','基本','一般','特别','非常','比较','更加','一定','所有','任何','不同','相同','之间','之中','之后','之前','以内','以外','以上','以下','不能','不会','不可','不再','也是','就有','都会','也可','是指','称为','叫做','属于','用来','用以','用于','作为','其中','其他','其它','各自','某些','有的','有些','我国','人们','我们','他们','你们','它们','当','并','则','以','可','能','会','要','有','无','为主','程度','有助于','标志着','就是说','指的是','共同','相互','整体','具体','实际','直接','间接','最终','逐步','不断','充分','进一步','结合']);

const CHAR_STOP = new Set(['的','了','是','和','与','或','对','在','中','上','下','等','并','则','以','可','能','会','要','有','无','及','被','把','从','到','由','让','向','同','为','因','所','而','且','虽','但','却','只','仅','又','再','还','也','就','都','很','更','最','极','较','太','非','不','没','将','已','正','着','过']);

const TECH_CHARS = /[酶碱酸质体胞器官腺激素膜核基因蛋白链层壁骨骼脉瓣翅鞘壳齿爪鳍鳞根茎叶花果律则理病症炎瘤癌剂论定程件器仪网络数图表演示验证据测算计控制调节元子分离解合反应氧氢碳氮铁钙钠钾维生素矿纤脂淀粉糖盐溶液渗透呼光遗传变异免疫神经血淋代谢激荷蒙染色粒线核苷磷嘌呤嘧啶肽氨羧羟醛酮酯醚苯酚烃烯炔烷醇法权利义务责任罪刑罚诉审判宪政府议会选举立司行帝朝代战革命运动约条]/;

function hasTechChar(s) { return TECH_CHARS.test(s); }

// ---- 简单种子随机数（"换一批空"产生不同结果） ----
function seededRandom(seed) {
  let s = (seed | 0) || 1;
  return function() { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

// ---- 将答案按"得分点"拆分 ----
function splitIntoPoints(text) {
  if (!text || !text.trim()) return [];
  // 先按换行拆
  const rawParts = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const points = [];
  for (const line of rawParts) {
    // 去掉序号前缀：1. 2、 （1） ① 等
    let cleaned = line.replace(/^[\d一二三四五六七八九十百]+[\.\、\)）]\s*/, '');
    cleaned = cleaned.replace(/^[①②③④⑤⑥⑦⑧⑨⑩]\s*/, '');
    cleaned = cleaned.replace(/^（[\d一二三四五六七八九十百]+）\s*/, '');
    if (!cleaned.trim()) continue;
    // 对每行按主要标点拆分
    const sub = cleaned.split(/[；;。](?=\S)/);
    for (const s of sub) {
      const t = s.trim();
      if (!t) continue;
      // 如果一段太长，再按逗号拆
      if (t.length > 20 && /[，,]/.test(t)) {
        const parts = t.split(/[，,](?=\S)/);
        for (const p of parts) { const tp = p.trim(); if (tp) points.push(tp); }
      } else {
        points.push(t);
      }
    }
  }
  return points.length ? points : [text.trim().replace(/^[\d一二三四五六七八九十百]+[\.\、\)）]\s*/, '')];
}

// ---- 在原文中定位每个得分点 ----
function locatePoints(fullText, points) {
  const located = [];
  let searchFrom = 0;
  for (const pt of points) {
    const idx = fullText.indexOf(pt, searchFrom);
    if (idx >= 0) {
      located.push({ text: pt, start: idx, end: idx + pt.length });
      searchFrom = idx + pt.length;
    }
  }
  return located;
}

// ---- 提取关键词（支持种子随机） ----
function extractKeywords(text, count, seed) {
  if (!text || !text.trim()) return [];
  const rng = seed != null ? seededRandom(seed) : null;
  const candidates = [];

  for (let len = 8; len >= 2; len--) {
    for (let i = 0; i <= text.length - len; i++) {
      const phrase = text.substring(i, i + len);
      if (STOP_WORDS.has(phrase)) continue;
      if (CHAR_STOP.has(phrase[0]) || CHAR_STOP.has(phrase[phrase.length - 1])) continue;
      // 不能以标点、序号、括号开头或结尾
      if (/[，,。！!？?、；;：:""''（）()《》【】…—\-·・\d]/.test(phrase[0]) ||
          /[，,。！!？?、；;：:""''（）()《》【】…—\-·・\d]/.test(phrase[phrase.length - 1])) continue;
      // 排除短语中间含有编号标记的（如"光反应(2)暗"会把(2)吃掉）
      if (/[（）()《》【】·・•①②③④⑤⑥⑦⑧⑨⑩]/.test(phrase)) continue;
            // 纯数字/序号不要
      if (/^[\d一二三四五六七八九十百千万亿\.\、\)）]+$/.test(phrase)) continue;
      let score = len * 3;
      // 得分点关键词大幅加分（学科术语=得分点核心）
      if (hasTechChar(phrase)) score += 12;
      // 中英文混合（如"DNA复制"）加分
      if (/[A-Za-z]/.test(phrase)) score += 6;
      // 概念后缀加分：以学科特征字结尾的词更可能是考点
      if (/[性化法制论学观力体质感型式态物器术程期段点度率量数值系组群类种属科]$/.test(phrase)) score += 5;
      // 数字参与但不主导的词（如"3个"）适度加分
      if (/[\d一二三四五六七八九十百千万亿]/.test(phrase) && !/^\d+$/.test(phrase)) score += 3;
      // 在逗号/分号/句号/换行后面紧跟的词（得分点开头）加分
      if (i === 0 || /[，,。；;、\n]/.test(text[i - 1])) score += 5;
      // 包含多个技术字的更可能是核心概念
      const techCount = (phrase.match(TECH_CHARS) || []).length;
      if (techCount >= 2) score += 4;
      // 惩罚虚词
      score -= (phrase.match(/[的了是在和与或对中上下等所被把让向同及着过]/g) || []).length * 4;
      // 随机扰动
      if (rng) score += rng() * 6 - 3;
      if (score >= 3) candidates.push({ start: i, end: i + len, text: phrase, score });
    }
  }
  // 按分数降序，同分按长度降序（优先选长的、完整的词组）
  candidates.sort((a, b) => b.score - a.score || b.text.length - a.text.length);
  const selected = [], used = new Set();
  for (const c of candidates) {
    if (selected.length >= count) break;
    let overlap = false;
    for (let p = c.start; p < c.end; p++) { if (used.has(p)) { overlap = true; break; } }
    if (!overlap) { selected.push(c); for (let p = c.start; p < c.end; p++) used.add(p); }
  }
  selected.sort((a, b) => a.start - b.start);
  return selected;
}

// ---- 自动挖空：每个得分点至少一个空，优先挖得分关键词 ----
function autoGenerateBlanks(cards, density, seed) {
  return cards.map((card, cardIdx) => {
    const q = card.question.trim();
    const a = card.answer.trim();
    const ft = q + '\n' + a;
    const answerStart = q.length + 1;
    if (!a) return { ...card, fullText: ft, blanks: [] };

    // 🏷️ 手动挖空：检测 @...@ 标记
    const atMatches = a.match(/@/g);
    if (atMatches && atMatches.length >= 2 && atMatches.length % 2 === 0) {
      let blanks = [];
      const re = /@([^@]+)@/g;
      let m;
      while ((m = re.exec(a)) !== null) {
        blanks.push({ text: m[1], isAnswer: true });
      }
      // 去除 @ 符号（仅去除配对@...@中的@），构建干净文本后重新定位
      const cleanA = a.replace(/@([^@]+)@/g, '$1');
      const cleanFt = q + '\n' + cleanA;
      let searchFrom = answerStart;
      for (const b of blanks) {
        const idx = cleanA.indexOf(b.text, searchFrom - answerStart);
        if (idx >= 0) {
          b.start = answerStart + idx;
          b.end = answerStart + idx + b.text.length;
          searchFrom = answerStart + idx + b.text.length;
        }
        // 定位失败则跳过，避免生成幽灵空格
      }
      blanks = blanks.filter(b => b.start !== undefined);
      return { ...card, fullText: cleanFt, blanks: blanks };
    }

    const pointTexts = splitIntoPoints(a);
    if (!pointTexts.length) return { ...card, fullText: ft, blanks: [] };

    // 在原文中定位每个得分点
    const located = locatePoints(a, pointTexts);

    // 分配空数：每个小点至少1个空，额外空按文本长度比例分配
    const totalLen = located.reduce((s, l) => s + l.text.length, 0) || 1;
    const allocation = new Array(located.length).fill(1); // 每个点至少1个
    // 低=每点1空（仅保底），高=每点约3空按比例自然分配
    const extraTotal = density === 'low' ? 0 : Math.round(located.length * 1.5);
    // 按文本长度比例分配额外空（最大余数法，长的点分到更多）
    const prop = located.map((l, i) => ({ i, share: l.text.length / totalLen * extraTotal, got: 0 }));
    let given = 0;
    // 先取整数部分
    for (const p of prop) { p.got = Math.floor(p.share); given += p.got; }
    // 余数大的优先补1
    prop.sort((a, b) => (b.share - b.got) - (a.share - a.got));
    for (let i = 0; i < extraTotal - given; i++) { prop[i].got++; }
    for (const p of prop) { allocation[p.i] += p.got; }

    // 重新定位（上面的 located 被改了）
    const pts = locatePoints(a, pointTexts);
    var blanks = [];
    for (let pi = 0; pi < Math.min(pts.length, allocation.length); pi++) {
      const pt = pts[pi];
      const need = allocation[pi];
      if (need > 0 && pt.text.trim()) {
        const ptSeed = seed != null ? seed + cardIdx * 97 + pi * 31 : undefined;
        const kws = extractKeywords(pt.text, need, ptSeed);
        if (kws.length > 0) {
          for (const kw of kws) {
            blanks.push({
              start: answerStart + pt.start + kw.start,
              end: answerStart + pt.start + kw.end,
              text: kw.text,
              isAnswer: true
            });
          }
        } else {
          // 没找到关键词？把整个得分点挖掉（排除序号和标点）
          const cleanText = pt.text.replace(/^[\d\.\、\)）①②③④⑤⑥⑦⑧⑨⑩\s]+/, '').trim();
          if (cleanText) {
            const idx = pt.text.indexOf(cleanText);
            blanks.push({
              start: answerStart + pt.start + idx,
              end: answerStart + pt.start + idx + cleanText.length,
              text: cleanText,
              isAnswer: true
            });
          }
        }
      }
    }

    blanks.sort((a, b) => a.start - b.start);

    // 去重（相同位置只保留一个）
    const deduped = [];
    const seen = new Set();
    for (const b of blanks) {
      const k = b.start + ':' + b.end;
      if (!seen.has(k)) { seen.add(k); deduped.push(b); }
    }

    return { ...card, fullText: ft, blanks: deduped };
  });
}

function regenerateBlanks(card, density) {
  const seed = Math.floor(Date.now() % 100000) + Math.floor(Math.random() * 900000);
  const r = autoGenerateBlanks([{ question: card.question, answer: card.answer }], density, seed)[0];
  return { ...card, blanks: r.blanks, fullText: r.fullText };
}

// ==================== 解析导入文本 ====================
function parseImportText(rawText) {
  const lines = rawText.split(/\n/).filter(l => l.trim()), cards = [];
  const seps = ['——','→',' - ','=','：','|',':','~','\t'];
  for (const line of lines) {
    const t = line.trim(); if (!t) continue;
    let found = false;
    for (const sep of seps) {
      const idx = t.indexOf(sep);
      if (idx > 0 && idx < t.length - sep.length) {
        if (sep === ':' && (t.indexOf(':') !== t.lastIndexOf(':') || /^\d+:\d/.test(t) || /^https?:/.test(t))) continue;
        const q = t.substring(0, idx).trim();
        var rest = t.substring(idx + sep.length).trim();

        // 尝试从剩余部分提取口诀：查找分隔符，取最后一次出现位置
        var koujue = '';
        var bestJ = -1;
        for (var k = 0; k < seps.length; k++) {
          var j = rest.lastIndexOf(seps[k]);
          if (j > 0 && j < rest.length - seps[k].length && j > bestJ) bestJ = j;
        }
        if (bestJ > 0) {
          koujue = rest.substring(bestJ + 1).trim();
          rest = rest.substring(0, bestJ).trim();
          // 口诀不要太长（超过答案一半且>20字则不是口诀）
          if (koujue.length > Math.max(rest.length * 0.6, 20)) { koujue = ''; rest = rest + ' | ' + koujue; }
        }

        cards.push({ question: q, answer: rest, koujue: koujue });
        found = true; break;
      }
    }
    if (!found) cards.push({ question: t, answer: '' });
  }
  return cards;
}

function isQAFormat(rawText) {
	  const lines = rawText.split(/\n/).filter(l => l.trim());
	  let qCount = 0, aCount = 0;
	  for (const line of lines) {
	    if (/^(Q[：:\.]|问[：:]|题目[：:])/.test(line)) qCount++;
	    if (/^(A[：:\.]|答[：:]|答案[：:])/.test(line)) aCount++;
	  }
	  return qCount >= 2 && aCount >= 2;
	}

	function parseQAText(rawText) {
	  const lines = rawText.split(/\n/), cards = [];
	  let current = null, chapter = '';
	  for (let i = 0; i < lines.length; i++) {
	    const line = lines[i].trim();
	    if (!line) continue;
	    if (/^第[一二三四五六七八九十百\d]+章/.test(line)) { chapter = line; continue; }
	    if (/^(Q[：:\.]|问[：:]|题目[：:])/.test(line)) {
	      if (current && current.question) cards.push(current);
	      current = { question: line.replace(/^(Q[：:\.]|问[：:]|题目[：:])\s*/, '').trim(), answer: '', koujue: '', chapter };
	    } else if (/^(A[：:\.]|答[：:]|答案[：:])/.test(line) && current) {

	    } else if (current) {

	      } else if (/^\d+[\.\、]/.test(line)) {

	function parseJianDaText(rawText) {
  const lines = rawText.split(/\n/), cards = [];
  let current = null, chapter = '';
  var cnNum = /^[一二三四五六七八九十]+[\.\、\）\)]/;
  var arNum = /^\d+[\.\、]/;
  var subNum = /^[\(（]\d+[\)）]|^[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    if (/^第[一二三四五六七八九十百\d]+章/.test(line)) { chapter = line; continue; }
    var isCnNum = cnNum.test(line);
    var isArNum = arNum.test(line) && !isCnNum;
    var isSubNum = subNum.test(line);
    var isBullet = /^[•●◦◆◇▪▸►▹▶☞✓✔✗✘☐☑☒]/.test(line);
    if (isCnNum) {
      // 中文数字：顶级题目，启动新卡片
      if (current && current.question) cards.push(current);
      current = { question: line, answer: '', koujue: '', chapter };
    } else if (isArNum) {
      // 阿拉伯数字：如果上一题是中文数字标题，则归入答案；否则启动新题
      if (current && cnNum.test(current.question)) {
        current.answer += (current.answer ? '\n' : '') + line;
      } else {
        if (current && current.question) cards.push(current);
        current = { question: line, answer: '', koujue: '', chapter };
      }
    } else if (isSubNum || isBullet) {
      // 子编号/项目符号：一律归入当前答案
      if (current) {
        current.answer += (current.answer ? '\n' : '') + line;
      } else {
        current = { question: line, answer: '', koujue: '', chapter };
      }
    } else if (current) {
      if (/^(口诀|背诵技巧|记忆)[：:]/.test(line)) {
        current.koujue = line.replace(/^(口诀|背诵技巧|记忆)[：:]\s*/, '').trim();
      } else {
        current.answer += (current.answer ? '\n' : '') + line;
      }
    } else {
      // 开头无编号行：作为第一题
      current = { question: line, answer: '', koujue: '', chapter };
    }
  }
  if (current && current.question) cards.push(current);
  return cards;
}

function isJianDaFormat(rawText) {
  const lines = rawText.split(/\n/).filter(l => l.trim());
  let kj = 0, num = 0;
  for (const line of lines) {
    if (/^(口诀|背诵技巧|记忆)[：:]/.test(line)) kj++;
    if (/^\d+[\.\、]/.test(line)) num++;
    if (/^[一二三四五六七八九十]+[\.\、\）\)]/.test(line)) num++;
    if (/^[•●◦◆◇▪▸►▹▶☞✓✔✗✘☐☑☒]/.test(line)) num++;
  }
  return (kj >= 2 && num >= 3) || num >= 6;
}

function isHashPctFormat(rawText) {
  const lines = rawText.split(/\n/).filter(l => l.trim());
  let hashCount = 0, pctCount = 0;
  for (const line of lines) {
    if (/^#\\s*\\S/.test(line)) hashCount++;
    if (/^%\\s*\\S/.test(line)) pctCount++;
  }
  return hashCount >= 1 && pctCount >= 1;
}

function parseHashPctText(rawText) {
  const lines = rawText.split(/\n/), cards = [];
  let current = null, orphanPct = 0;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    if (/^#\\s*\\S/.test(line)) {
      if (current && current.question) cards.push(current);
      current = { question: line.replace(/^#\\s*/, "").trim(), answer: "", koujue: "" };
    } else if (/^%\\s*\\S/.test(line)) {
      if (current) {
        current.answer += (current.answer ? "\n" : "") + line.replace(/^%\\s*/, "").trim();
      } else {
        orphanPct++;
      }
    } else if (current) {
      current.answer += (current.answer ? "\n" : "") + line;
    }
  }
  if (current && current.question) cards.push(current);
  if (orphanPct > 0) showToast('⚠️ 有 ' + orphanPct + ' 行%开头的内容出现在题目之前，已被忽略');
  return cards;
}

// ====== 每日洞见 ======
var DAILY_INSIGHTS = ["遗忘不是你的错，是大脑的节能策略。艾宾浩斯发现遗忘曲线在20分钟后就开始陡降——所以\"感觉忘了再复习\"比\"学完马上复习\"记忆强度高3倍。","测试效应（Testing Effect）是认知科学最稳健的发现：主动回忆一次，比重复阅读4次更有效。你每次填空作答，都在强化那条神经通路。","大脑不是硬盘——记忆是\"重新构造\"而非\"读取\"。每次回忆都在重新巩固，这就是为什么间隔复习比一次性背熟更持久。","每次纠错都在重写神经回路。脑成像研究显示：犯错时大脑的注意网络激活强度是答对时的2.3倍。做错题不是失败——是你的大脑在最高效地学习。","\"Desirable Difficulties\"（有益困难）理论：学习时感觉越费劲，记忆越牢固。轻松流畅的阅读给你\"学会了\"的错觉，吃力地回忆才是真正的学习。","同样的内容，间隔1天复习的记忆保留率（60%）是连续复习（20%）的3倍。你隔几天再背，不是在偷懒——是在给海马体时间巩固。","间隔复习的最佳时机是\"几乎要忘记的时候\"。研究发现：当回忆成功率在70-80%时复习，记忆强化效果最大。","睡眠不是学习的暂停，是学习的延续。深度睡眠时海马体会以20倍速重播白天的记忆痕迹。今晚好好睡觉，比熬夜多背两小时更有效。","睡前1小时学习的内容，比早上学习的内容在48小时后回忆率高26%。不是因为晚上更聪明，而是因为学完就睡，没有新信息干扰记忆巩固。","自我决定论（SDT）认为：人类内在动机的三大支柱是自主、胜任、联结。你主动选择来刷题——这本身就是动机最强的学习状态。","外在奖励会削弱内在动机（\"过度合理化效应\"）。考高分、父母的夸奖都有用，但真正的持久动力来自\"我变得更厉害了\"的感受本身。","大脑对\"开始学习\"的抗拒叫行动偏差。破解方法不是靠意志力，而是把目标降到荒谬的地步：只做1道题。一旦开始，前额叶皮层接管，继续下去的概率是92%。","\"2分钟规则\"：如果一件事能在2分钟内完成，立刻做。如果不能，只做2分钟。这个技巧绕过了大脑对\"大任务\"的抗拒回路。","多任务处理是个神话。大脑不能同时做两件需要认知的事——它只是在快速切换，每次切换损耗约15%的效率。专注一件事，反而更快。","手机在旁边（即使关机），认知能力下降相当于前一晚少睡1小时。物理上把它放到另一个房间，你的工作记忆容量会明显提升。","\"我不会\"和\"我还不会\"之间只差一个字——但大脑的神经反应完全不同。成长型思维者在犯错时前额叶更活跃，他们真的在从错误中学习更多。","蔡格尼克效应：未完成的任务会在大脑中保持\"后台运行\"，产生适度的紧张感。这不是坏事——它让你更想回来完成。利用这个：每次结束时留一道没做完的题。","前额叶皮层是大脑的CEO，负责计划和自控。但它很脆弱：疲劳、压力、饥饿都会削弱它。状态不好时，先照顾好身体，再谈学习。","多巴胺不是快乐分子，是\"渴望\"分子。它在追求目标的过程中释放，而不是在达成时。所以设定小目标、逐步达成，比盯着大目标更能保持动力。","自我效能感（Self-Efficacy）是比天赋更可靠的预测指标。相信自己能学会的人，真的学得更好——因为他们更愿意尝试困难的题目。","神经可塑性意味着：每次学习都在物理上改变你的大脑结构。你不是\"不擅长这个科目\"，你只是还没有建立足够的神经连接。","刻意练习的核心不是重复，是\"在舒适区边缘练习\"。做题太简单=无聊，太难=焦虑。最佳学习发生在\"刚好有点挑战\"的区域。","记忆宫殿技术有2500年历史，但背后的原理很现代：大脑对空间和图像的编码能力远强于抽象文字。把知识点放在想象的房间里，回忆率翻倍。","元认知（对自己认知的认知）是学霸和普通学生的关键区别。每次做完题问自己：\"我真的理解了吗？还是只是觉得理解了？\"","峰终定律：人们对一段体验的评价，取决于最强烈时刻和结束时刻的感受。所以学习结束时做一道你会的题——大脑会给这次学习打更高分。","执行意图（Implementation Intention）比单纯的目标有效2倍。不说\"我今天要刷题\"，说\"吃完晚饭后我就在书桌前打开题库\"。具体的时间地点触发行动。","\"生成效应\"：自己产出答案比看现成答案，记忆强50%。所以你填空比直接看解析有效得多——哪怕填错了，生成的过程本身就在学习。","情绪对记忆有锚定作用。在积极的情绪中学习，回忆时也更容易。不需要很快乐，\"平静而专注\"就是最佳学习状态。","注意力不是无限的——每天能深度专注的时间大约只有4小时。把最难的题目放在精力最好的时段（对大多数人来说是上午）。","\"零散的努力\"累积起来远超\"偶尔的爆发\"。每天10道题坚持一个月，比某一天狂刷300题效果好得多。一致性>强度。","考试焦虑会占用工作记忆容量——你越担心做不好，能用来思考的空间就越少。深呼吸10秒（4秒吸、6秒呼）可以在2分钟内降低皮质醇水平。","番茄工作法背后的科学：大脑的注意周期大约是90分钟，但大多数人每25分钟就需要一个微休息。这不是意志力弱——这是神经生理学。","\"启动效应\"：开始学习前的环境线索会影响你的状态。固定的学习地点、固定的背景音乐、甚至固定的笔，都能让大脑更快进入\"学习模式\"。","交错练习（Interleaving）比集中练习效果更好。混合不同类型的题目，虽然做的时候感觉更乱，但长期记忆更强——因为大脑被迫学习\"区分\"。","情绪标注（Affect Labeling）：把焦虑写下来只需要2分钟，就能显著降低焦虑水平，释放工作记忆空间。下次紧张时试试：在纸上写\"我现在很紧张，因为...\"。","海马体每天产生约700个新神经元。学习能保护这些新生神经元免于死亡——你不仅在积累知识，还在物理上\"建设\"你的大脑。","\"心流状态\"需要两个条件：明确的目标 + 即时的反馈。刷题完美满足这两点——你不需要额外\"找状态\"，题目本身就在引导你进入心流。","\"白熊效应\"：越告诉自己不要想某事，它越会在脑中挥之不去。应对焦虑不是\"别紧张\"，而是\"我接受我现在很紧张，然后继续做题\"。","学习风格的迷思：研究表明，按\"视觉型/听觉型/动觉型\"来学习并不提高效果。真正的关键是：多重编码——同一个内容用文字+图像+声音三种方式输入。","延迟满足能力（棉花糖实验的深层含义）不是天赋，而是可以通过\"转移注意力策略\"训练的。每次想放弃时，转移注意力到当下这道题上，而不是想着\"还要做多久\"。","\"掌握目标\"vs\"表现目标\"：想着\"我要掌握这个知识点\"比\"我要比同学考得好\"更能坚持、更能应对挫折。动机的方向比强度更重要。","复习时间黄金比：学完一个新知识后的最佳复习时间点是——1天后、3天后、7天后、30天后。这不是玄学，是艾宾浩斯曲线的实际应用。","认知负荷理论：工作记忆一次只能处理4±1个信息块。把大题拆成小步骤，不是因为你不行——是因为人的大脑就是这样设计的。","\"游泳之前的准备\"陷阱：看解析、记笔记、整理错题...这些都有用，但真正的学习发生在\"自己动手做\"的时候。看完解析不代表会了——关掉答案做一遍才是。","大脑占人体重量的2%，却消耗20%的能量。高强度的脑力劳动真的会累——累了就休息，不是偷懒，是确保后续学习效率。","\"契可尼效应\"：人更容易记住未完成的事。睡前留一道半解的题，第二天醒来你可能会自然想通——因为大脑在睡眠中继续处理未完成的认知任务。","表扬\"努力\"比表扬\"聪明\"更能培养成长型思维。对你自己也一样：\"我真的很努力\"比\"我真聪明\"更能让你下次继续努力。","社会助长效应：有人和你一起学习（即使只是线上打卡），效率会提升。不是因为竞争——是因为人类是社会性动物，镜像神经元在默默驱动。","\"微量习惯\"（Tiny Habits）：把目标缩小到荒谬的程度。（如\"每天只做1道题\"）不是为了少做——是为了绕过大脑对\"开始\"的抗拒。一旦开始，惯性接管。","\"决策疲劳\"是真实存在的：每做一个决定，下一个决定的质量就降低一点。减少日常决策（比如固定学习时间），把认知资源留给真正需要思考的题目。","身体姿势影响认知：坐直的人比驼背的人对负面反馈的接受度高30%。这不是鸡汤——是具身认知（Embodied Cognition）的实验结论。","10分钟法则：想放弃时，告诉自己\"再做10分钟\"。10分钟后如果还想停就停。但有80%的概率你会继续——因为启动是最大的障碍。","巴甫洛夫的\"条件反射\"同样适用于学习状态：每次学习前做同样的手势、放同样的背景音、用同样的桌面。几周后，触发信号一出，大脑自动进入专注模式。","\"选择性优化补偿\"（SOC理论）：把80%精力放在20%最常考的题目上。你不是偷懒——你是在用认知科学的策略分配有限资源。","阅读姿势影响理解深度：出声朗读比自己默读记忆强30%——因为同时激活了听觉通路和运动皮层。这就是为什么\"自言自语背书\"其实很科学。","\"莱斯托夫效应\"：在一堆相似内容中，最特别的那个最容易记住。所以故意把重点题目用不同的颜色标注，大脑会优先记住它们。","不要试图\"管理时间\"——管理注意力。时间不为你所控，但注意力在哪里、此刻脑子在想什么，是你可以选择的。","\"自我对话\"的质量决定情绪的质量。把\"我必须做完\"换成\"我选择做完\"，内在动机立刻不同。因为\"选择\"激活了自主感——这是人类心理需求的核心。","极简主义学习法：不是资料越多越好，是越少越好。一本教材精读3遍，胜过3本教材匆匆浏览。深度>广度。","\"反刍思维\"是学习的大敌——反复回想考砸的瞬间不会让下次更好，只会消耗前额叶的资源。替代方案：用\"下次我可以怎么做\"的具体行动计划打断反刍。","\"胜利日记\"实验：每天记下3件学习中的小成就（哪怕只是\"今天打开题库了\"），3周后自评动机显著上升。因为你重新训练了大脑关注进步而非差距。","强迫\"快乐学习\"反而有害。能接纳\"学习有时就是无聊的、辛苦的\"这一事实的人，长期坚持的概率更高。真正的动力不是快乐，是意义感。","意志力不像\"电池\"——认为意志力有限的人确实更容易放弃，认为意志力无限的人坚持更久。关键是：\"你相信什么，什么就是真的。\"","\"完形倾向\"：大脑倾向于把不完整的东西补全。利用这个：把题目读完但故意不填最后一个空，第二天你会发现大脑在催你来完成。","\"稀释效应\"：一个强论点比三个弱论点更有说服力。学习同理——吃透一道难题，比浏览十道简单题收获更大。","每日静坐5分钟（不需要冥想，睁眼坐着就行）可以提高工作记忆容量。原理：短暂的感觉剥夺让默认模式网络（DMN）得到休息，后续注意力更集中。","\"教是最好的学\"——费曼学习法的核心：尝试用自己的话解释一个概念，你立刻知道哪里没真懂。没人在旁边听也没关系，对空气讲都有效。","过度学习（Overlearning）有科学依据：即使已经能答对，再多练2-3次可以让记忆抵抗遗忘的能力翻倍。关键是\"已经会了之后的额外练习\"。","\"生理同步\"效应：学习时心率平稳的时段，信息编码效率更高。紧张时先做几次深呼吸，不只是心理安慰——你在优化大脑的编码窗口。","情境依赖效应：在类似考试的环境下学习（安静、坐着、时间限制），考试时回忆率更高。因为大脑把\"环境线索\"和\"记忆内容\"绑在了一起。","\"近因效应\"：最后学的内容记得最牢。所以练题结束时，快速浏览一遍刚才做错的题——它们在\"近因窗口\"里，明天的回忆率更高。","不要等\"有动力了再学\"。行动先于动力——先翻开题库做1道，动力自然就跟上了。这和大脑的多巴胺环路工作原理一致：预期奖励>实际获得。","\"组块化\"（Chunking）是扩大工作记忆的唯一方法。把相关知识点打包成一个\"组块\"，你一次能处理的信息量就翻了几倍。高手和新手的大脑区别就在这里。","自我解释效应：做题时对自己讲出\"为什么选这个\"（即使在心里默念），理解深度提升40%。这强迫你从\"感觉对了\"升级到\"真懂了\"。","\"归因理论\"：把失败归因于\"努力不够\"（可改变的）而不是\"能力不足\"（不可改变的）的人，下次成绩提升显著。因为努力可以加码，能力听起来像定局。","习惯形成=线索+行为+奖励。设置一个每次学习后的微奖励（比如打勾✅ + 喝口水），大脑就慢慢把\"完成学习\"和\"获得满足感\"绑定了。","环境设计>意志力。把题库快捷方式放在手机桌面最显眼的位置，把社交App藏到文件夹里。不是靠意志力对抗诱惑——是不给诱惑机会。","\"前瞻性记忆\"：告诉自己\"明天早上看到题库图标就点进去\"——比\"我明天要刷题\"有效3倍。因为\"看到图标\"是具体的触发线索，\"要刷题\"只是模糊意图。","\"伊丽莎白·洛夫特斯\"的记忆研究表明：记忆不是录像机，是可塑的。每次回忆都是一次\"重新编辑\"——你可以刻意强化想记住的、弱化想遗忘的。","学习时听音乐的黄金法则：有歌词的音乐占用语音工作记忆（和刷题的文字处理冲突），纯音乐和无声音最佳。如果一定要听，纯器乐、Lo-fi 或白噪音最安全。","\"自我损耗\"理论的更新：最新元分析发现，意志力损耗效应比最初认为的小得多。如果你觉得\"累了学不动了\"，试试先做一道——你比你以为的更有余力。","\"巴德利工作记忆模型\"告诉我们：视觉空间画板和语音回路是两个独立通道。边看图边学文字（双通道）比只看文字（单通道）效率高。给抽象知识配一张简图。","\"默认模式网络\"（DMN）在你发呆时也极度活跃——这是创意的来源。学累了发呆5分钟不是浪费时间，是让大脑在后台整合信息。","\"锚定效应\"影响你的自我评价：不要用\"上次考了多少分\"来定义自己。你的真实水平不是某个数字，而是你每天都在进步的趋势。","\"行动语言\"的力量：对自己说\"我不刷题\"vs\"我不能刷题\"——前者是选择，后者是被迫。主动选择的语言强化了你的自主感，长期坚持的概率翻倍。","人在\"刚好及格\"时学得最投入。如果正确率100%，说明题太简单；如果正确率<50%，说明难度太高。最佳学习区间是正确率65-85%——够挑战但不绝望。","\"闪光灯记忆\"告诉我们：情绪越强烈，记忆越牢固。所以把枯燥的知识点和一件有趣的事、一个生动的画面绑定——大脑会优先保存它们。","自证预言在学习中的力量：如果你相信\"这个科目我就是不行\"，你的大脑自动过滤掉和这个信念矛盾的证据。反过来：\"我在这方面每天都在进步\"——大脑开始收集证明这一点的证据。","时间不是敌人。\"还有30天考试\"和\"只剩30天了\"——同一个事实，不同的框架。前者是机会视角（还有时间进步），后者是威胁视角（来不及了）。刻意选择前者。","效率不是检验学习成果的标准。\"理解得快\"和\"记得牢\"几乎无关。真正预测长期记忆的是：你有没有在遗忘之前主动回忆。慢一点，其实是快一点。","极简主义复习法：只复习错题。因为你做对的题目已经在大脑里有巩固的通路，而错题才是真正需要\"重新编码\"的内容。错题本不是耻辱本——是最高效的复习清单。","身份认同是最深层的驱动力。不要说\"我要刷题\"，说\"我是一个每天学习的人\"。你不是在完成一个任务——你是在成为你想成为的那种人。","5-4-3-2-1 启动法：当你盯着题库就是不想点进去时——不要试图说服自己\"应该学习\"。从5倒数到1，数到0时手指自动点进去。这利用了\"行动锚点\"原理：倒计时切断大脑的犹豫回路，用身体动作绕过了前额叶的阻力。用在健身、起床、任何\"知道该做但不想开始\"的事上同样有效。","费曼技巧的精髓不是\"教给别人\"，是\"找到你不会的地方\"。选一个概念→假装讲给一个完全不懂的人听→卡住的地方就是你没真懂的地方→回去看原资料→简化语言再讲一遍。如果你不能用日常语言讲清楚，说明你只是在识别术语，不是真正理解。","番茄钟的正确用法不是\"25分钟必须到\"。核心是：开始前做一个小决定（\"我只专注25分钟\"），让杏仁核停止报警。如果你的注意力自然周期是45分钟，那就设45分钟。观察自己的节奏，而不是死守规则——工具为你服务，不是反过来。","\"吃青蛙\"法则：每天先做最不想做的那件事。不是因为自虐——是因为决策疲劳在早上最低，意志力储备最充足。把最难的题目放在学习的前15分钟，后面的轻松感会推动你一直学下去。","环境重置法：学习前花2分钟清理桌面（物理的和数字的）。这不是仪式感——是在给大脑发送\"新场景开始了\"的信号。场景转换激活了前额叶的任务切换功能，让你从\"刷手机模式\"真正切换到\"学习模式\"。","如果你总是忘记某个知识点，把它变成一个荒谬的画面。比如\"线粒体内膜折叠成嵴\"→想象一个\"线\"做的\"粒\"子在里面\"折\"叠\"嵴\"柱。大脑对荒谬、生动、有情绪的画面记忆远强于抽象术语——这叫\"图像优势效应\"。","抄写不是学习。用荧光笔划重点也不是。这两种行为的共同问题是：让大脑误以为\"我做了点什么\"而关闭了深度处理。替代方案：合上书，默写你能回忆的内容。回忆的难度=学习的深度。","把大目标分解到\"荒谬地小\"。不是\"今天复习第三章\"，是\"翻开课本到第三章第一页\"。不是\"背50个单词\"，是\"看第1个单词\"。降低启动成本比增加意志力有效10倍——因为启动成本是物理的，意志力从来不可靠。","睡前10分钟\"脑内电影\"：闭眼在脑中快速回放今天学的内容，像放电影一样。不需要太精确——回放的过程本身就是最强的记忆巩固。比起床后复习有效得多，因为你抢在了睡眠记忆整合之前。","\"如果-那么\"计划（执行意图）：给自己设定具体的触发条件。\"如果我看到第一道题不会做，那么我就先跳过做下一道\"。这比\"我要保持冷静\"有效3倍——因为它在应激状态出现之前就预置了应对程序，不需要临场思考。","学习中间容易走神时，试试\"有声思考\"：把自己做题的思路念出来。\"我看到这道题...先想到的是...但是...哦不对应该是...\"。出声能让走神概率降低约60%——因为语音回路占用了一部分容易被杂念劫持的工作记忆。","\"双循环法\"：第一遍快速浏览（不求理解），第二遍精读。第一次让大脑建立框架（\"这章大概讲了什么\"），第二次填充细节。框架+细节的编码比零散的细节编码牢固3倍——因为大脑最喜欢有层次的信息结构。","每天结束时，写下\"明天要做的第一件事\"并放在显眼处。这不是计划——是在利用\"蔡格尼克效应\"让大脑在睡眠中自动预处理这个任务。第二天你会发现开始速度明显变快，因为大脑已经帮你想好了第一步。","奖励会降低创造力。爱德华·德西的经典实验：两组人拼积木，一组给钱一组不给。给钱的一组在实验结束后立刻停止，不给钱的那组反而继续拼。外在奖励把\"玩\"变成了\"工作\"。考试分数同理——盯着分数学习的人，比盯着\"想弄懂这个东西\"的人更容易放弃。最好的动力是好奇心本身。","压力不总是坏事。耶克斯-多德森定律：适度的压力（心跳略快、手心微汗）让表现达到峰值。完全没压力=无聊=低表现。太大压力=恐慌。最佳状态在中间——你觉得自己\"紧张但还能handle\"的时候。所以考试前的一点点紧张不是敌人，是你进入最佳状态的信号。","慢读比快读理解更深。速读培训声称能让你每分钟读2000字，但研究反复证明：阅读速度超过600字/分钟时，理解率急剧下降。眼睛每秒钟只能处理有限信息——\"跳读\"只是在跳过内容，不是更快吸收。快≠好。","你比你以为的更不会判断自己的学习效果。一项经典研究发现：重读3遍的人比只读1遍的人自信得多，但考试成绩完全一样。重读让你\"熟悉\"了内容（错觉），但不是\"掌握\"。真正的检验只有一种方法：合上书，看你能不能回忆出来。","无聊可能是好事。研究发现：当人们被迫独自待在一个房间里15分钟，什么也不做（连手机都没有），之后在创造力测试中得分显著更高。大脑的默认模式网络在\"无聊\"时最活跃——这是创意和整合信息的关键网络。给自己一些\"什么也不做\"的时间。","记笔记越完整，学到的越少。因为当你试图记下每一个字时，大脑在\"转录\"而不是\"处理\"。相反，用自己的话总结、加入自己的疑问和联想——笔记越乱越个性化，学到的东西越多。因为你在输入的同时进行了加工。","你对一个话题越熟悉，越容易高估别人对它的了解。这叫\"知识的诅咒\"——一旦你学会了什么，就很难想象\"不知道\"是什么状态。所以教别人时，宁可解释得太简单，也不要假设对方知道。这也是为什么\"教是最好的学\"——它暴露了你的\"诅咒\"。","多巴胺的陷阱：不是因为手机\"偷走了你的注意力\"。是因为每次刷短视频获得的多巴胺脉冲，让你的大脑对\"学习\"这种低多巴胺活动失去了兴趣。重置不是永远不用手机——是让大脑的奖赏系统重新校准，让\"慢慢理解一个概念\"重新变得有滋味。","考试前突击复习确实有效——但只对短期记忆。突击学习的遗忘曲线在48小时内陡降，而间隔学习的遗忘曲线是平缓的。选择哪种，取决于你是为了明天的考试还是为了长期的掌握。同一个行为，不同的时间分配，结果天差地别。","\"才华\"在长期成就中的贡献被严重高估。对120位顶尖音乐家、运动员和艺术家的追踪研究发现：早期表现出\"才华\"的人，最终达到顶尖水平的比例反而更低。因为早期轻松成功的人，没有建立起\"面对困难的韧性\"。","遗忘不是bug，是feature。如果大脑记住了所有事情，你将无法区分重要信息和无用噪音。遗忘是大脑的\"优先级筛选器\"——它会自然淘汰不被使用的信息。复习的意义不是对抗遗忘，而是告诉大脑：\"这个信息很重要，请保留它。\"","周末不学习不会让你退步。研究显示：间隔2天的复习和间隔1天的复习，长期记忆保留率几乎相同。但心理疲倦感降低了一半。休息日的价值不在学习量，而在你下周回到桌前时的那股新鲜感和期待感。"];

function getDailyInsight() {
  var today = new Date().toISOString().substring(0, 10);
  var si = appData.settings.dailyInsight;
  if (!si || si.date !== today) {
    var idx = Math.floor(Math.random() * DAILY_INSIGHTS.length);
    appData.settings.dailyInsight = { date: today, index: idx, refreshed: false };
    saveData(appData);
  }
  return DAILY_INSIGHTS[appData.settings.dailyInsight.index];
}

function refreshDailyInsight() {
  var today = new Date().toISOString().substring(0, 10);
  var si = appData.settings.dailyInsight;
  if (si && si.refreshed) {
    showToast("今天已经刷新过了，明天再来吧 🌟");
    return;
  }
  var newIdx;
  do {
    newIdx = Math.floor(Math.random() * DAILY_INSIGHTS.length);
  } while (newIdx === (si ? si.index : -1) && DAILY_INSIGHTS.length > 1);
  appData.settings.dailyInsight = { date: today, index: newIdx, refreshed: true };
  saveData(appData);
  renderSettings();
  showToast("🔄 已刷新每日洞见");
}

function showDailyInsightCard() {
  var insight = getDailyInsight();
  var si = appData.settings.dailyInsight || {};
  var canRefresh = !si.refreshed;
  var ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.style.animation = 'none';
  var html = '<div class="modal" style="animation:none;border-radius:var(--radius);max-width:420px;margin:auto;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:24px 20px 20px;max-height:75dvh;overflow-y:auto">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">' +
      '<h3 style="margin:0;font-size:18px">💡 每日洞见</h3>' +
      (canRefresh
        ? '<button onclick="event.stopPropagation();refreshDailyInsight();this.closest(\'.modal-overlay\').remove();showDailyInsightCard();" style="background:var(--primary-light);border:1px solid var(--primary-soft);color:var(--primary);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap">🔄 换一条</button>'
        : '<span style="font-size:11px;color:var(--text-tertiary)">今日已刷新</span>') +
    '</div>' +
    '<div style="background:linear-gradient(135deg, #f8fafc 0%, #e0e7ff 50%, #f0fdfa 100%);border-radius:14px;padding:20px 18px;margin-bottom:12px">' +
      '<div style="font-size:16px;line-height:2;color:var(--text)">' + escapeHtml(insight) + '</div>' +
    '</div>' +
    '<div style="font-size:11px;color:var(--text-tertiary);text-align:right">每日洞见 · 基于认知科学与心理学</div>' +
  '</div>';
  ov.innerHTML = html;
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e) { if (e.target === ov) ov.remove(); });
}

function getTodaySummaryBrief() {
  ensureDailyPractice();
  var dp = appData.settings.dailyPractice;
  if (!dp || (!dp.duration && !dp.totalSwitches)) return null;
  var parts = [];
  if (dp.duration > 0) parts.push("⏱ " + fmtDuration(dp.duration));
  var today = new Date().toISOString().substring(0, 10);
  var completed = 0;
  var dates = appData.settings.studyDates || {};
  if (dates[today]) completed = dates[today];
  if (completed > 0) parts.push("📝 " + completed + "题");
  return parts.join(" · ");
}

    '<h3 style="margin:0 0 4px;font-size:18px">📋 今日学习摘要</h3>' +

function fuzzyMatch(u, a) {
  if (!u && !a) return true;
  if (!u || !a) return false;
  const n = s => s.replace(/[，,。！!？?、；;：:""''（）()《》【】…—\-·・\s]/g, '').toLowerCase().trim();
  const ua = n(u), ca = n(a);
  if (ua === ca) return true;
  if (ca.length > 6) {
    const max = Math.max(ua.length, ca.length), set = new Set(ua.split(''));
    let m = 0; for (const ch of ca) if (set.has(ch)) m++;
    return m / max >= 0.7;
  }
  return false;
}

function initApp() {
  try {
  // 试用版：每30秒检查授权是否过期
  if (!isPermanentAuth()) {
    setInterval(() => { if (!checkAuth()) { location.reload(); } }, 30000);
  }
  getSetting('density', 'low');
  getSetting('voiceEnabled', false);
  getSetting('voiceRate', 0.9);
  getSetting('voicePitch', 1.0);
  // 恢复计时和排序设置
  if (appData.settings.timerMode) timerMode = appData.settings.timerMode;
  if (appData.settings.timerSeconds) timerSeconds = appData.settings.timerSeconds;
  if (appData.settings.wrongFirst !== undefined) wrongFirst = appData.settings.wrongFirst;
  ensureDailyPractice(); // 初始化/跨天重置每日统计

  // 防止刷题时水平滑动退出页面
  let pageStartX = 0, pageStartY = 0;
  document.addEventListener('touchstart', e => {
    pageStartX = e.touches[0].clientX;
    pageStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    // 如果子元素已经处理过（如预览滑动选字），不重复拦截
    if (e.defaultPrevented) return;
    const dx = Math.abs(e.touches[0].clientX - pageStartX);
    const dy = Math.abs(e.touches[0].clientY - pageStartY);
    if (dx > dy && dx > 20) e.preventDefault();
  }, { passive: false });

  // 跟踪最后聚焦的挖空输入框（移动端键盘有时会在Enter前先失焦）
  var _lastBlankInput = null;
  document.addEventListener('focusin', function(e) {
    if (e.target && e.target.classList.contains('blank-input')) _lastBlankInput = e.target;
  });

  // 切屏监听：任何切后台都计数，练习中额外计数
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      ensureDailyPractice();
      appData.settings.dailyPractice.totalSwitches = (appData.settings.dailyPractice.totalSwitches || 0) + 1;
      debouncedSaveData(appData);
      if (practiceState && practiceState.cards && $('practiceActive').style.display !== 'none' && $('practiceResult').style.display === 'none') {
        practiceSwitches++;
            // 番茄钟模式：切屏警告
            if (appData.settings && appData.settings.pomodoro) {
              if (practiceSwitches >= 2) {
                showToast("🍅 番茄钟：切屏已达上限，练习已暂停");
                setTimeout(function() { showPracticeResult(); }, 1500);
                return;
              } else if (practiceSwitches === 1) {
                showToast("🍅 番茄钟：再切屏1次将自动结束练习！");
              } else {
                showToast("🍅 番茄钟进行中，请专注！");
              }
            }

      }
    }
  });

  function handleBlankEnter(e) {
    var activeEl = document.activeElement;
    // 如果当前焦点不在输入框上，用上次跟踪的
    if (!activeEl || !activeEl.classList.contains('blank-input')) {
      if (_lastBlankInput && document.body.contains(_lastBlankInput)) {
        activeEl = _lastBlankInput;
      } else {
        // 焦点不在输入框 → 全局快捷键（仅练习模式）
        if (practiceState && practiceState.cards && $('practiceActive').style.display !== 'none' && $('practiceResult').style.display === 'none') {
          if (e.key === 'ArrowLeft' || e.keyCode === 37) {
            e.preventDefault();
            if (practiceState.index > 0) { saveCurrentAnswers(); practiceState.index--; renderPracticeCard(); }
            return;
          }
          if (e.key === 'ArrowRight' || e.keyCode === 39) {
            e.preventDefault();
            if (practiceState.index < practiceState.total - 1) { saveCurrentAnswers(); practiceState.index++; renderPracticeCard(); }
            else { saveCurrentAnswers(); practiceState.index++; renderPracticeCard(); }
            return;
          }
          if (e.key === ' ' || e.keyCode === 32 || e.code === 'Space') {
            e.preventDefault();
            if (appData.settings.voiceEnabled) speakCard();
            else showToast('请先在设置中开启语音朗读');
            return;
          }
          if (e.key === 'Enter' || e.keyCode === 13 || e.code === 'Enter') {
            e.preventDefault();
            checkMyAnswers();
            return;
          }
        }
        return;
      }
    }
    if (e.key === 'Enter' || e.keyCode === 13 || e.code === 'Enter') {
      e.preventDefault();
      e.stopPropagation();
      // 练习模式：先用 saveCurrentAnswers 保存
      if (practiceState && practiceState.cards) {
        saveCurrentAnswers();
      }
      // 找当前输入框所在容器内的所有同类输入框
      var container = activeEl.closest('#cardText, [id^="wrongBlanks_"]');
      if (!container) container = activeEl.parentElement;
      var inputs = Array.prototype.slice.call(container.querySelectorAll('.blank-input'));
      var curIdx = inputs.indexOf(activeEl);
      if (curIdx < 0) { activeEl.blur(); return; }

      // 检查是否全填了（仅练习模式需要检查答案）
      if (practiceState && practiceState.cards) {
        var card = practiceState.cards[practiceState.index];
        var ua = practiceState.answers[card.id] || {};
        var allFilled = true;
        for (var i = 0; i < inputs.length; i++) {
          var bidx = parseInt(inputs[i].dataset.bidx);
          if (bidx >= 0 && !(ua[bidx] || '').trim()) { allFilled = false; break; }
        }
        if (allFilled) {
          checkMyAnswers();
          if (activeEl) activeEl.blur();
          return;
        }
      }

      // 跳到下一个空（先往后找，再从头找）
      var target = -1;
      for (var i = curIdx + 1; i < inputs.length; i++) {
        if (!inputs[i].value.trim()) { target = i; break; }
      }
      if (target === -1) {
        for (var i = 0; i < curIdx; i++) {
          if (!inputs[i].value.trim()) { target = i; break; }
        }
      }
      // 如果全填了且不是练习模式，直接 blur
      if (target === -1) {
        activeEl.blur();
      } else {
        // 移动端 setTimeout 确保焦点切换可靠
        setTimeout(function() { inputs[target].focus(); }, 10);
      }
    }
  }
  document.addEventListener('keydown', handleBlankEnter);

  // 首次打开检测：如果完全没数据，提示文件位置注意事项
  const banksExist = Object.keys(appData.banks).length > 0;
  const hasAnyData = banksExist || localStorage.getItem(STORAGE_KEY);
  const seenTip = sessionStorage.getItem('memorize_location_tip');
  if (!hasAnyData && !seenTip) {
    sessionStorage.setItem('memorize_location_tip', '1');
    setTimeout(() => {
      showToast('💡 提示：数据随浏览器存储，请将文件放在固定位置使用，移动位置可能导致之前的数据看不到');
    }, 800);
  }

  checkEveningMode();
  switchTab('banks');
  // showIntroModal() 已移除 — 不再弹出欢迎提示
  } catch(e) {
    console.error('initApp error:', e);
    showFatalError(e.message || '初始化异常');
  }
}

      renderPracticeSetup();

  else if (name === 'browse') renderBrowseStart();
  else if (name === 'wrongbook') renderWrongBookStart();
  else if (name === 'settings') { renderSettings(); setTimeout(loadVoices, 300); }
}

function highlightMatch(text, query) {
  var idx = text.toLowerCase().indexOf(query.toLowerCase());

  var after = escapeHtml(text.substring(idx + query.length));
  return before + '<mark style="background:#fef08a;color:#854d0e;padding:0 2px;border-radius:2px">' + match + '</mark>' + after;
}

// ==================== 题库排序 ====================
function moveBankUp(bankId) {
  const banks = Object.values(appData.banks).sort((a, b) => {
    const aOrder = a.order != null ? a.order : a.createdAt;
    const bOrder = b.order != null ? b.order : b.createdAt;
    return aOrder - bOrder;
  });
  const idx = banks.findIndex(b => b.id === bankId);
  if (idx <= 0) return;
  // 交换 order
  const a = banks[idx], b = banks[idx - 1];
  const aOrder = a.order != null ? a.order : a.createdAt;
  const bOrder = b.order != null ? b.order : b.createdAt;
  a.order = bOrder;
  b.order = aOrder;
  saveData(appData);
  renderBanks();
}

function moveBankDown(bankId) {
  const banks = Object.values(appData.banks).sort((a, b) => {
    const aOrder = a.order != null ? a.order : a.createdAt;
    const bOrder = b.order != null ? b.order : b.createdAt;
    return aOrder - bOrder;
  });
  const idx = banks.findIndex(b => b.id === bankId);
  if (idx < 0 || idx >= banks.length - 1) return;
  // 交换 order
  const a = banks[idx], b = banks[idx + 1];
  const aOrder = a.order != null ? a.order : a.createdAt;
  const bOrder = b.order != null ? b.order : b.createdAt;
  a.order = bOrder;
  b.order = aOrder;
  saveData(appData);
  renderBanks();
}

function renameBankPrompt(el, id) {
	  const bank = appData.banks[id];
	  if (!bank) return;
	  const oldName = bank.name;
	  const input = document.createElement('input');
	  input.type = 'text'; input.value = oldName;
	  input.style.cssText = 'font-size:inherit;font-weight:700;border:none;border-bottom:2px solid var(--primary);background:transparent;color:var(--text);width:100%;padding:2px 0';
	  el.innerHTML = '';
	  el.appendChild(input);
	  input.focus(); input.select();
	  const save = () => {
	    const v = input.value.trim() || oldName;
	    bank.name = v;
	    bank.updatedAt = Date.now();
	    saveData(appData);
	    el.textContent = v;
	  };
	  let cancelled = false;
  input.onblur = () => { if (!cancelled) save(); };
  input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); save(); } if (e.key === 'Escape') { cancelled = true; el.textContent = oldName; } };
	}

function editBank(id) {
  const bank = appData.banks[id];
  if (!bank) return;
  // 准备卡片：从已有 blanks 恢复 _savedChars 标记
  const cards = bank.cards.map(c => {
    const saved = {};
    const q = (c.question || '').trim();
    const answerStart = q.length + 1;
    for (const b of (c.blanks || [])) {
      const relStart = b.start - answerStart;
      const relEnd = b.end - answerStart;
      for (let j = relStart; j < relEnd; j++) saved[j] = true;
    }
    return { ...c, _charSelected: {}, _savedChars: saved, _autoBlanks: null };
  });
  previewData = { name: bank.name, cards, mode: 'manual', editBankId: id };
  showImportPreview(bank.name, cards);
}


function exportBank(id) {
  if (!isPermanentAuth()) { showToast('试用版不支持导出'); return; }
  const bank = appData.banks[id];
  if (!bank) return;
  const text = bank.cards.map(c => c.question + '|' + c.answer).join('\n');
  showExportModal(bank.name, text);
}

function exportBankFull(id) {
  if (!isPermanentAuth()) { showToast('试用版不支持导出'); return; }
  const bank = appData.banks[id];
  if (!bank) return;
  // 导出为纯文本，挖空用【】标记
  const lines = [];
  for (const c of bank.cards) {
    const q = c.question.trim();
    const a = c.answer.trim();
    const blanks = (c.blanks || []).filter(b => !b._combined).sort((a, b) => a.start - b.start);
    if (!blanks.length) { lines.push(q + '|' + a); continue; }
    const ft = c.fullText || q + '\n' + a;
    const aStart = q.length + 1;
    let out = '', p = aStart;
    for (const b of blanks) {
      out += ft.substring(p, b.start) + '【' + (b.text || '') + '】';
      p = b.end;
    }
    out += ft.substring(p);
    lines.push(q + '|' + out.substring(aStart));
  }
  showExportModal(bank.name + '（挖空）', lines.join('\n'));
}

function parseWordHtml(html) {
  // 去掉图片（img/picture/svg/base64图片全部删除）
  html = html.replace(/<img[^>]*\/?>/gi, '');
  html = html.replace(/<picture[\s\S]*?<\/picture>/gi, '');
  html = html.replace(/<svg[\s\S]*?<\/svg>/gi, '');
  // 删除表格（结构多变，自动解析不可靠，直接丢弃）
  html = html.replace(/<table[\s\S]*?<\/table>/gi, '');
  // 加粗/高亮 → 【挖空】——逐个匹配，避免嵌套或多行问题
  html = html.replace(/<(strong|b)\b[^>]*>([\s\S]*?)<\/(strong|b)>/gi, function(_, __, inner) {
    return '【' + inner.replace(/<[^>]*>/g, '').replace(/\s+/g, '') + '】';
  });
  // 结构标签 → 换行
  html = html.replace(/<br\s*\/?>/gi, '\n');
  html = html.replace(/<\/p>/gi, '\n');
  html = html.replace(/<\/div>/gi, '\n');
  html = html.replace(/<\/li>/gi, '\n');
  html = html.replace(/<\/tr>/gi, '\n');
  // 标题 → ## 标记
  html = html.replace(/<\/h[1-6]>/gi, '\n');
  html = html.replace(/<h[1-6][^>]*>/gi, '\n## ');
  // 去掉其余 HTML 标签
  html = html.replace(/<[^>]*>/g, '');
  // 转义字符还原
  html = html.replace(/&nbsp;/gi, ' ');
  html = html.replace(/&lt;/gi, '<');
  html = html.replace(/&gt;/gi, '>');
  html = html.replace(/&amp;/gi, '&');
  html = html.replace(/&quot;/gi, '"');
  html = html.replace(/&#39;/gi, "'");
  // 清理多余空行和行首空白
  html = html.replace(/\n{3,}/g, '\n\n');
  html = html.replace(/^[ \t]+/gm, '');
  return html.trim();
}

// PDF 文本清洗：合并断行、去短行（可能的页眉页脚）、去多余空行
function cleanPdfText(text) {
  // 去除多余空行
  text = text.replace(/\n{4,}/g, '\n\n');
  // PDF 提取常见问题：中文句末换行但没有标点，合并
  // 行末不是标点/符号结尾 → 和下一行合并（PDF断行）
  var lines = text.split('\n');
  var merged = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) { merged.push(''); continue; }
    // 如果上一行不是以标点结尾，且当前行看起来像是被截断的续行，合并到上一行
    if (merged.length > 0 && merged[merged.length - 1] !== '') {
      var prev = merged[merged.length - 1];
      var prevEnd = prev.charAt(prev.length - 1);
      var isPrevEnd = /[。！？；：）」》\.\!\?\;\:\"\'\)\]》（）“”‘’、，—]/.test(prevEnd);
      if (!isPrevEnd) {
        merged[merged.length - 1] = prev + line;
        continue;
      }
    }
    merged.push(line);
  }
  text = merged.join('\n');
  // 去掉有规律的短行（可能的页眉页脚、页码），保留空行占位
  lines = text.split('\n');
  lines = lines.filter(function(l) {
    var t = l.trim();
    if (!t) return true; // 保留空行
    if (t.length === 1 && !/[^\x00-\xff]/.test(t)) return false; // 单英文字母（页眉残留）
    return true;
  });
  text = lines.join('\n');
  // 去首尾空行
  text = text.replace(/^\n+/, '').replace(/\n+$/, '');
  return text;
}

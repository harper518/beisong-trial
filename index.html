function parseMbakText(rawText) {
  const lines = rawText.split(/\n/), cards = [];
  for (const line of lines) {
    const t = line.trim(); if (!t) continue;
    const sep = t.indexOf('|');
    if (sep < 0) continue;
    const q = t.substring(0, sep).trim();
    const aMarked = t.substring(sep + 1).trim();
    if (!aMarked.includes('【')) { cards.push({ question: q, answer: aMarked }); continue; }
    const blanks = [];
    let clean = '', p = 0;
    const re = /【([^】]*)】/g;
    let m;
    while ((m = re.exec(aMarked)) !== null) {
      clean += aMarked.substring(p, m.index);
      const s = clean.length;
      clean += m[1];
      blanks.push({ start: s, end: s + m[1].length, text: m[1], isAnswer: true });
      p = m.index + m[0].length;
    }
    clean += aMarked.substring(p);
    cards.push({ question: q, answer: clean, blanks, fullText: q + '\n' + clean });
  }
  return cards;
}

function precheckImport() {
  var raw = $('importTextarea').value.trim();
  if (!raw) { showToast('请先粘贴或上传内容'); return; }
  raw = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  raw = raw.replace(/\\n/g, '\n');

  // 格式检测（与 doImport 自动检测一致）
  var format = _importFormat || 'auto';
  var cards = [], detectedFmt = '';

  if (format === 'jianda') { cards = parseJianDaText(raw); detectedFmt = '📝 简答题'; }
  else if (format === 'sep') { cards = parseImportText(raw); detectedFmt = '📋 分隔符'; }
  else if (format === 'qa') { cards = parseQAText(raw); detectedFmt = '❓ Q&A'; }
  else if (format === 'hashpct') { cards = parseHashPctText(raw); detectedFmt = '#%'; }
  else {
    // 自动检测
    var lines = raw.split(/\n/).filter(function(l) { return l.trim(); });
    var sepLines = 0;
    for (var li = 0; li < lines.length; li++) {
      var l = lines[li];
      if (l.includes('——') || l.includes('→') || l.includes(' - ') || l.includes('=') || l.includes('：') || l.includes('|') || l.includes(':') || l.includes('~') || l.includes('\t')) sepLines++;
    }
    var sepRatio = sepLines / Math.max(lines.length, 1);

    if (raw.trim().startsWith('{')) {
      try { var data = JSON.parse(raw); if (data._format === 'mbak' && data.cards && data.cards.length) { cards = data.cards; detectedFmt = '💾 含挖空备份'; } else { cards = []; } }
      catch(e) { cards = parseImportText(raw); detectedFmt = '📋 分隔符（fallback）'; }
    } else if (raw.includes('【') && raw.includes('】') && raw.includes('|')) {
      cards = parseMbakText(raw); detectedFmt = '💾 含挖空文本';
    } else if (sepRatio > 0.6) {
      cards = parseImportText(raw); detectedFmt = '📋 分隔符';
    } else if (isJianDaFormat(raw)) {
      cards = parseJianDaText(raw); detectedFmt = '📝 简答题';
    } else if (isQAFormat(raw)) {
      cards = parseQAText(raw); detectedFmt = '❓ Q&A';
    } else if (isHashPctFormat(raw)) {
      cards = parseHashPctText(raw); detectedFmt = '#%';
    } else {
      cards = parseImportText(raw); detectedFmt = '📋 分隔符（默认）';
    }
  }

  // 统计
  var answerLineCounts = cards.map(function(c) { return (c.answer || '').split('\n').filter(function(l) { return l.trim(); }).length; });
  var totalAnswerLines = answerLineCounts.reduce(function(a, b) { return a + b; }, 0);
  var avgAnswerLines = cards.length ? (totalAnswerLines / cards.length).toFixed(1) : '0';
  var cardsWithEmpty = cards.filter(function(c) { return !(c.answer || '').trim(); }).length;
  var cardsWithKj = cards.filter(function(c) { return !!c.koujue; }).length;

  // 渲染统计栏
  var statsEl = document.getElementById('importStats');
  if (!statsEl) return;
  statsEl.style.display = '';
  var h = '<div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px">';
  h += '<span>🔍 识别：<b>' + detectedFmt + '</b></span>';
  h += '<span>📦 <b>' + cards.length + ' 题</b></span>';
  h += '<span>📝 <b>' + totalAnswerLines + '</b> 个要点</span>';
  h += '<span>📐 均 <b>' + avgAnswerLines + '</b> 行/题</span>';
  h += '<span>💡 <b>' + cardsWithKj + '</b> 题有口诀</span>';
  h += '<span>📄 <b>' + raw.length + '</b> 字</span>';
  h += '</div>';

  var warnings = [];
  if (cards.length === 0) {
    warnings.push('<span style="color:var(--danger)">❌ 未解析出题目，请检查格式</span>');
  } else if (cards.length <= 2 && raw.length > 500) {
    warnings.push('<span style="color:var(--danger)">⚠️ 原文' + raw.length + '字仅解析出' + cards.length + '题，格式可能不匹配</span>');
  }
  if (cards.length > 0 && cardsWithEmpty > cards.length * 0.5) {
    warnings.push('<span style="color:var(--warning)">⚠️ ' + cardsWithEmpty + '/' + cards.length + ' 题答案为空</span>');
  }
  if (warnings.length) {
    h += '<div style="margin-top:4px">' + warnings.join(' &nbsp;') + '</div>';
  }
  statsEl.innerHTML = h;
  showToast('预检完成：' + cards.length + '题 · ' + detectedFmt);
}

function doImport() {
  const name = $('bankNameInput').value.trim();
  var raw = $('importTextarea').value.trim();
  // 统一换行符：\r\n → \n，\r → \n，然后字面量 \n → 真正换行
  raw = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  raw = raw.replace(/\\n/g, '\n');
  if (!name) { showToast('请输入题库名称'); return; }
  var qSplitCheck = ($('importQuestions')?.value || '').trim().replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\\n/g, '\n');
  var aSplitCheck = ($('importAnswers')?.value || '').trim().replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\\n/g, '\n');
  if (!raw && !(qSplitCheck && aSplitCheck)) { showToast('请粘贴题目或上传文件'); return; }

  var format = _importFormat || 'auto';
  let cards, hasBlanks = false;

  if (format === 'sep') {
    cards = parseImportText(raw);
  } else if (format === 'jianda') {
    cards = parseJianDaText(raw);
  } else if (format === 'qa') {
    cards = parseQAText(raw);
  } else if (format === 'hashpct') {
    cards = parseHashPctText(raw);
  } else {
    // 自动检测
    const lines = raw.split(/\n/).filter(l => l.trim());
    const sepRe = /[：:→=——\|～~\t]| - /;
    let sepLines = 0;
    for (const l of lines) {
      for (const s of ['——','→',' - ','=','：','|',':','~','\t']) { if (l.includes(s)) { sepLines++; break; } }
    }
    const sepRatio = sepLines / Math.max(lines.length, 1);

    if (raw.trim().startsWith('{')) { try {
      const data = JSON.parse(raw);
      if (data._format === 'mbak' && data.cards && data.cards.length) {
        cards = data.cards; if (data.name) name = data.name;
        hasBlanks = true; showToast('导入含挖空备份');
      } else { cards = []; }
    } catch(e) { cards = parseImportText(raw); } }
    else if (raw.includes('【') && raw.includes('】') && raw.includes('|')) {
      cards = parseMbakText(raw); hasBlanks = true; showToast('导入含挖空文本');
    }
    else if (sepRatio > 0.6) { cards = parseImportText(raw); showToast('分隔符格式'); }
    else if (isJianDaFormat(raw)) { cards = parseJianDaText(raw); showToast('简答题格式'); }
    else if (isQAFormat(raw)) { cards = parseQAText(raw); showToast('Q&A 格式'); }
    else if (isHashPctFormat(raw)) { cards = parseHashPctText(raw); showToast('#%格式'); }
    else { cards = parseImportText(raw); }
  }

  // 分开导入：题目和答案分别粘贴
  var qSplit = ($('importQuestions')?.value || '').trim();
  var aSplit = ($('importAnswers')?.value || '').trim();
  if (qSplit && aSplit) {
    qSplit = qSplit.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\\n/g, '\n');
    aSplit = aSplit.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\\n/g, '\n');
    var qLines = qSplit.split(/\n/).filter(function(l) { return l.trim(); });
    var aLines = aSplit.split(/\n/).filter(function(l) { return l.trim(); });
    var minLen = Math.min(qLines.length, aLines.length);
    var splitCards = [];
    for (var si = 0; si < minLen; si++) {
      var sq = qLines[si].replace(/^[\d\.\、\s]+/, '').trim();
      var sa = aLines[si].trim();
      if (sq && sa) splitCards.push({ question: sq, answer: sa });
    }
    if (splitCards.length) {
      cards = cards.concat(splitCards);
      if (splitCards.length < qLines.length || splitCards.length < aLines.length) {
        showToast('分开导入：配对 ' + splitCards.length + ' 题（题目' + qLines.length + '行/答案' + aLines.length + '行，取较少者）');
      }
    }
  }

  if (!cards.length) { showToast('未能解析题目，请检查格式'); return; }

  // 诊断统计（持久显示在预览中）
  var answerLineCounts = cards.map(function(c) { return (c.answer || '').split('\n').filter(function(l) { return l.trim(); }).length; });
  var totalAnswerLines = answerLineCounts.reduce(function(a, b) { return a + b; }, 0);
  var avgAnswerLines = (totalAnswerLines / cards.length).toFixed(1);
  var cardsWithEmptyAnswer = cards.filter(function(c) { return !(c.answer || '').trim(); }).length;
  var fmtLabel = format === 'auto' ? '🤖 自动检测' : (format === 'jianda' ? '📝 简答题' : (format === 'sep' ? '📋 分隔符' : (format === 'qa' ? '❓ Q&A' : format)));
  var importStats = {
    format: fmtLabel,
    totalCards: cards.length,
    avgAnswerLines: avgAnswerLines,
    totalAnswerLines: totalAnswerLines,
    cardsWithEmptyAnswer: cardsWithEmptyAnswer,
    rawLength: raw.length,
    firstAnswerLines: answerLineCounts[0] || 0,
    firstAnswerLength: (cards[0].answer || '').length
  };
  console.log('[导入诊断]', JSON.stringify(importStats));

  cards = cards.map(c => {
    c.question = (c.question || '').trim();
    c.answer = (c.answer || '').trim();
    const ft = c.question + '\n' + c.answer;
    return { ...c, id: generateId(), fullText: ft,
      wrongCount: c.wrongCount || 0, correctCount: c.correctCount || 0,
      lastPracticed: c.lastPracticed || null, starred: c.starred || false,
      _charSelected: {}, _savedChars: {},
      blanks: hasBlanks ? (c.blanks || []) : [] };
  });

  closeImportModal();
  showImportPreview(name, cards, importStats);
}

// ==================== 导入预览（点击选字挖空） ====================

    <p class="text-sm text-secondary mb-12" id="previewModeHint">👆 点击答案中的字选中挖空，连续的字自动合并。保存后可继续第二轮挖空。</p>

function switchPreviewMode(mode, el) {
  previewData.mode = mode;
  document.querySelectorAll('#previewModeChips .chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('previewModeHint').textContent = mode === 'manual'
    ? '👆 点击答案中的字选中挖空，连续的字自动合并。保存后可继续第二轮挖空。'
    : '🤖 系统按得分点自动挖空，可点击标签取消/恢复。';
  var clearBtn = document.getElementById('clearAllAutoBtn');
  if (clearBtn) clearBtn.style.display = mode === 'auto' ? '' : 'none';
  if (mode === 'auto') {
    // 为每道题生成自动挖空
    previewData.cards.forEach(c => {
      if (!c._autoBlanks) {
        const auto = autoGenerateBlanks([{ question: c.question, answer: c.answer }], appData.settings.density || 'low')[0];
        c._autoBlanks = auto.blanks.map(b => ({ ...b, _removed: false }));
        c.fullText = auto.fullText;
      }
    });
  }
  renderPreviewCards();
}

function renderPreviewCards() {
  var container = document.getElementById('previewCards');
  var cards = previewData.cards;
  var mode = previewData.mode;
  var pageSize = 20;
  var totalPages = Math.ceil(cards.length / pageSize);
  if (_previewPage == null || _previewPage >= totalPages) _previewPage = 0;
  var page = _previewPage;
  var startIdx = page * pageSize;
  var endIdx = Math.min(startIdx + pageSize, cards.length);

  // 统计全部卡片的问题
  var allProblems = []; // {idx, status, label, question}
  var statusCounts = { empty: 0, short: 0, noBlanks: 0 };
  for (var pi = 0; pi < cards.length; pi++) {
    var st = getCardStatus(cards[pi], mode);
    if (st !== 'ok') {
      statusCounts[st] = (statusCounts[st] || 0) + 1;
      var labels = { empty: '🔴 答案为空', short: '🟡 答案偏短', noBlanks: '⚠️ 未挖空' };
      allProblems.push({ idx: pi, status: st, label: labels[st] || st, question: cards[pi].question });
    }
  }

  // 渲染跳过摘要
  var summaryEl = document.getElementById('skipSummary');
  if (summaryEl) {
    if (allProblems.length > 0) {
      summaryEl.style.display = '';
      var summaryHtml = '<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleSkipSummary()">' +
        '<span style="font-weight:600;color:var(--warning);font-size:13px">⚠️ ' + allProblems.length + ' 张卡片需要注意</span>' +
        '<span id="skipSummaryArrow" style="font-size:12px;color:var(--text-tertiary)">' + (_skipSummaryOpen ? '▾' : '▸') + '</span>' +
        '</div>';
      if (_skipSummaryOpen) {
        summaryHtml += '<div style="margin-top:8px;max-height:180px;overflow-y:auto">';
        var groups = [
          { key: 'empty', label: '🔴 答案为空', items: [] },
          { key: 'short', label: '🟡 答案偏短', items: [] },
          { key: 'noBlanks', label: '⚠️ 未设置挖空', items: [] }
        ];
        for (var gi = 0; gi < allProblems.length; gi++) {
          var p = allProblems[gi];
          for (var gj = 0; gj < groups.length; gj++) {
            if (p.status === groups[gj].key) { groups[gj].items.push(p); break; }
          }
        }
        for (var gk = 0; gk < groups.length; gk++) {
          var g = groups[gk];
          if (!g.items.length) continue;
          summaryHtml += '<div style="font-size:12px;font-weight:600;margin-bottom:4px;margin-top:6px;color:var(--text-secondary)">' + g.label + ' · ' + g.items.length + ' 题</div>';
          for (var gi2 = 0; gi2 < Math.min(g.items.length, 10); gi2++) {
            var item = g.items[gi2];
            var shortQ = (item.question || '').replace(/^[\d\.\、\s]+/, '').substring(0, 25);
            summaryHtml += '<div style="font-size:11px;padding:3px 6px;cursor:pointer;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" onclick="jumpToCardPage(' + item.idx + ')" title="第' + (item.idx + 1) + '题">第' + (item.idx + 1) + '题 · ' + escapeHtml(shortQ) + '</div>';
          }
          if (g.items.length > 10) {
            summaryHtml += '<div style="font-size:11px;color:var(--text-tertiary);padding:3px 6px">…还有 ' + (g.items.length - 10) + ' 题</div>';
          }
        }
        summaryHtml += '</div>';
      }
      summaryEl.innerHTML = summaryHtml;
    } else {
      summaryEl.style.display = 'none';
    }
  }

  // 渲染分页导航
  var pageNavHtml = '';
  if (totalPages > 1) {
    pageNavHtml = '<div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center">';
    for (var pn = 0; pn < totalPages; pn++) {
      var ps = pn * pageSize + 1;
      var pe = Math.min(ps + pageSize - 1, cards.length);
      var activeStyle = pn === page ? 'background:var(--primary);color:#fff' : 'background:var(--bg-input);color:var(--text-secondary)';
      pageNavHtml += '<button class="btn btn-sm" onclick="goToPreviewPage(' + pn + ')" style="font-size:11px;padding:4px 8px;min-height:28px;' + activeStyle + '">' + ps + '-' + pe + '</button>';
    }
    pageNavHtml += '</div>';
  }
  var navTop = document.getElementById('previewPageNavTop');
  var navBottom = document.getElementById('previewPageNavBottom');
  if (navTop) navTop.innerHTML = pageNavHtml;
  if (navBottom) navBottom.innerHTML = pageNavHtml;

  // 渲染当前页卡片
  var html = '';
  for (var i = startIdx; i < endIdx; i++) {
    var card = cards[i];
    var status = getCardStatus(card, mode);
    var statusBadge = '';
    if (status === 'empty') statusBadge = '<span style="background:var(--danger-light);color:var(--danger);font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600">🔴 无答案</span>';

    html += '<div class="preview-card" data-idx="' + i + '" id="previewCard-' + i + '" data-status="' + status + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
        '<div style="flex:1">' +
          '<div class="text-sm text-secondary mb-6">第 ' + (i + 1) + ' 题 ' + statusBadge + ' · ' + escapeHtml(card.question.replace(/^[\d\.\、\s]+/, '').substring(0, 30)) + '</div>' +
          (card.koujue ? '<div class="text-sm mb-6" style="color:var(--primary)">💡 ' + escapeHtml(card.koujue) + '</div>' : '') +
          '<div class="text-sm mb-6" style="color:var(--text-tertiary);font-size:11px">📝 答案' + (card.answer||'').split('\n').filter(function(l){return l.trim();}).length + '行 · ' + (card.answer||'').length + '字</div>' +
        '</div>' +
        '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();toggleEditPreviewCard(' + i + ')" style="padding:2px 8px;font-size:12px;flex-shrink:0;margin-left:8px" title="编辑题目">✏️</button>' +
      '</div>' +
      (card._editing ? '<div id="editPanel-' + i + '" style="background:var(--bg);border:2px solid var(--primary);border-radius:10px;padding:12px;margin-bottom:10px">' +
        '<label style="font-size:12px;color:var(--text-secondary)">题目</label>' +
        '<textarea id="editPQ-' + i + '" style="width:100%;min-height:50px;padding:8px;border:2px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text);font-size:13px;resize:vertical;margin-bottom:8px;font-family:inherit;line-height:1.6" rows="2">' + escapeHtml(card.question) + '</textarea>' +
        '<label style="font-size:12px;color:var(--text-secondary)">答案</label>' +
        '<textarea id="editPA-' + i + '" style="width:100%;min-height:60px;padding:8px;border:2px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text);font-size:13px;resize:vertical;margin-bottom:8px;font-family:inherit;line-height:1.6" rows="2">' + escapeHtml(card.answer) + '</textarea>' +
        '<label style="font-size:12px;color:var(--text-secondary)">💡 口诀（可选）</label>' +
        '<input id="editPKj-' + i + '" value="' + escapeHtml(card.koujue || '') + '" placeholder="例如：全（全民化）民（民主化）" style="width:100%;padding:8px;border:2px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text);font-size:13px;margin-bottom:10px;font-family:inherit">' +
        '<div class="flex gap-8" style="justify-content:flex-end">' +
          (card._undoSnapshot ? '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();undoCardEdit(' + i + ')" style="color:var(--warning)">↩️ 撤回编辑</button>' : '') +
          '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();cancelEditPreviewCard(' + i + ')">取消</button>' +
          '<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();saveEditPreviewCard(' + i + ')">💾 保存</button>' +
        '</div>' +
      '</div>' : '');

    if (mode === 'manual') {
      html += '<div style="position:relative"><div class="preview-answer" id="pv-answer-' + i + '">' + renderAnswerChars(card, i) + '</div><button class="btn btn-sm" onclick="saveCardSelection(' + i + ')" style="position:absolute;left:-8px;top:50%;transform:translate(-100%,-50%);opacity:.35;font-size:18px;padding:4px 6px;min-height:auto;background:transparent;border:none;cursor:pointer;line-height:1" title="保存选中（回车）">💾</button></div>' +
        '<div style="margin-top:6px" id="pv-info-' + i + '">' + renderSavedInfo(card, i) + '</div>' +
        '<div class="flex gap-6 mt-6">' +
          '<button class="btn btn-sm btn-ghost" onclick="saveCardSelection(' + i + ')" style="font-size:12px;padding:4px 10px;min-height:28px">💾 保存选中</button>' +
          (card._undoSnapshot ? '<button class="btn btn-sm btn-ghost" onclick="undoCardEdit(' + i + ')" style="font-size:12px;padding:4px 10px;min-height:28px;color:var(--warning)">↩️ 撤回</button>' : '') +
          '<button class="btn btn-sm btn-ghost" onclick="clearCardSelection(' + i + ')" style="font-size:12px;padding:4px 10px;min-height:28px">🔄 清除全部</button>' +
        '</div>';
    } else {
      var autoBlanks = card._autoBlanks || [];
      html += '<div class="preview-text" id="pv-auto-text-' + i + '">' + renderAutoPreview(card) + '</div>' +
        '<div class="text-sm text-secondary mt-8" id="pv-auto-tags-' + i + '">' + renderAutoTags(card, i) + '</div>';
    }

    html += '</div>';
  }
  container.innerHTML = html;

  // 更新问题计数
  var problemCount = allProblems.length;
  var pcEl = document.getElementById('problemCount');
  if (pcEl) {
    if (problemCount > 0) {
      pcEl.textContent = '⚠️ ' + problemCount + ' 个问题';
      pcEl.style.color = 'var(--warning)';
      pcEl.style.fontWeight = '600';
    } else {
      pcEl.textContent = '✅ 全部正常';
      pcEl.style.color = 'var(--success)';
      pcEl.style.fontWeight = '400';
    }
  }
}

var _previewPage = 0;
var _skipSummaryOpen = false;
var _lastProblemIdx = -1;

function toggleSkipSummary() {
  _skipSummaryOpen = !_skipSummaryOpen;
  renderPreviewCards();
}

function goToPreviewPage(n) {
  _previewPage = n;
  renderPreviewCards();
  var container = document.getElementById('previewCards');
  if (container) container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function jumpToCardPage(idx) {
  var pageSize = 20;
  var page = Math.floor(idx / pageSize);
  _previewPage = page;
  _lastProblemIdx = idx;
  _skipSummaryOpen = true; // 展开摘要方便查看
  renderPreviewCards();
  setTimeout(function() {
    var el = document.getElementById('previewCard-' + idx);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.boxShadow = '0 0 0 3px var(--primary)';
      setTimeout(function() { el.style.boxShadow = ''; }, 2000);
    }
  }, 150);
}

let _wasDragging = false, _touchJustHappened = 0;
var MERGE_MARKER = '​'; // 零宽空格，作为换行合并标记（1:1替换\n）
function renderAnswerChars(card, idx) {
  const a = card.answer || '';
  if (!a) return '<span style="color:var(--text-tertiary)">（无答案）</span>';
  const sel = card._charSelected || {};
  const saved = card._savedChars || {};
  let h = `<div class="preview-answer-inner" style="touch-action:pan-y;user-select:none;-webkit-user-select:none"
    ontouchstart="swipeSelectStart(event,${idx})"
    ontouchmove="swipeSelectMove(event,${idx})"
    ontouchend="swipeSelectEnd(${idx})"
    onmousedown="mouseSelectStart(event,${idx})"
    onmousemove="mouseSelectMove(event,${idx})"
    onmouseup="mouseSelectEnd(${idx})"
    onmouseleave="mouseSelectEnd(${idx})">`;
  for (let i = 0; i < a.length; i++) {
    const ch = a[i];
    if (ch === '\\' && a[i+1] === 'n') { h += '<span class="newline-marker" data-nli="' + i + '" onclick="event.stopPropagation();mergeLineAt(' + idx + ',' + i + ')" title="点击合并上下行">↵</span>'; i++; continue; }
    if (ch === '\n') { h += '<span class="newline-marker" data-nli="' + i + '" onclick="event.stopPropagation();mergeLineAt(' + idx + ',' + i + ')" title="点击合并上下行">↵</span>'; continue; }
    if (ch === '​') { h += '<span class="merge-undo-dot" data-mgi="' + i + '" onclick="event.stopPropagation();unmergeLineAt(' + idx + ',' + i + ')" title="点击恢复换行">↩</span>'; continue; }
    if (/\s/.test(ch)) { h += ' '; continue; }
    if (saved[i]) {
      const cls = sel[i] ? 'char-sel saved' : 'saved';
      h += `<span class="preview-char ${cls}" data-ci="${i}" onclick="if(!_wasDragging&&Date.now()-_touchJustHappened>400)toggleImportChar(${idx},${i})" style="background:var(--blank-bg);border-bottom:2px solid var(--blank-border);border-radius:2px">${escapeHtml(ch)}</span>`;
    } else if (sel[i]) {
      h += `<span class="preview-char char-sel" data-ci="${i}" onclick="if(!_wasDragging&&Date.now()-_touchJustHappened>400)toggleImportChar(${idx},${i})">${escapeHtml(ch)}</span>`;
    } else {
      h += `<span class="preview-char" data-ci="${i}" onclick="if(!_wasDragging&&Date.now()-_touchJustHappened>400)toggleImportChar(${idx},${i})">${escapeHtml(ch)}</span>`;
    }
  }
  h += '</div>';
  return h;
}

// 合并换行：将 \n 或 \n 替换为零宽空格标记
function mergeLineAt(idx, pos) {
  var card = previewData.cards[idx];
  if (!card) return;
  var a = card.answer || '';
  if (pos < 0 || pos >= a.length) return;
  var ch = a[pos];
  // 处理 \n 双字符（字面量反斜杠n）和 \n 真正换行
  if (ch === '\\' && a[pos + 1] === 'n') {
    // 2字符 → 1字符 MERGE_MARKER，需要调整后续索引
    var newA = a.substring(0, pos) + MERGE_MARKER + a.substring(pos + 2);
    shiftCharKeys(card, pos + 1, -1); // pos+1之后的索引前移1
    card.answer = newA;
  } else if (ch === '\n') {
    // 1字符 → 1字符 MERGE_MARKER，无需调整索引
    card.answer = a.substring(0, pos) + MERGE_MARKER + a.substring(pos + 1);
  } else {
    return; // 不是换行符
  }
  if (!card._undoSnapshot) saveUndoSnapshot(card);
  document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
}

// 恢复换行：将零宽空格标记还原为 \n
function unmergeLineAt(idx, pos) {
  var card = previewData.cards[idx];
  if (!card) return;
  var a = card.answer || '';
  if (pos < 0 || pos >= a.length || a[pos] !== MERGE_MARKER) return;
  // 1字符 → 1字符，无需调整索引
  card.answer = a.substring(0, pos) + '\n' + a.substring(pos + 1);
  if (!card._undoSnapshot) saveUndoSnapshot(card);
  document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
}

// 字符删除后调整 _charSelected 和 _savedChars 索引
function shiftCharKeys(card, fromIdx, delta) {
  ['_charSelected', '_savedChars'].forEach(function(key) {
    var obj = card[key] || {};
    var newObj = {};
    Object.keys(obj).forEach(function(k) {
      var ki = parseInt(k);
      if (ki < fromIdx) newObj[k] = obj[k];
      else if (ki + delta < fromIdx) {} // 被删除的位置，丢弃
      else newObj[ki + delta] = obj[k];
    });
    card[key] = newObj;
  });
}

// 滑动选择
let swipeSelectMode = null;
let swipeStartX = 0, swipeStartY = 0, _lastTouchX = 0, _lastTouchY = 0;
function swipeSelectStart(e, idx) {
  _touchJustHappened = Date.now();
  swipeStartX = _lastTouchX = e.touches[0].clientX;
  swipeStartY = _lastTouchY = e.touches[0].clientY;
  swipeSelectMode = null;
  const card = previewData.cards[idx];
  const el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
  const ci = (el && el.dataset ? el.dataset.ci : undefined);
  if (ci == null) return;
  const charIdx = parseInt(ci);
  const isSaved = card._savedChars && card._savedChars[charIdx];
  if (isSaved) toggleImportChar(idx, charIdx);
  // 暂不启动选择模式，等 move 判断方向
  swipeSelectMode = { idx, adding: isSaved ? false : !(card._charSelected || {})[charIdx], removing: isSaved, started: false };
}

function swipeSelectMove(e, idx) {
  if (!swipeSelectMode || swipeSelectMode.idx !== idx) return;
  const tx = e.touches[0].clientX, ty = e.touches[0].clientY;
  const dx = Math.abs(tx - swipeStartX), dy = Math.abs(ty - swipeStartY);
  if (dy > dx && dy > 5) { swipeSelectMode = null; return; }
  if (dx < 8 && dy < 8) return;
  if (!swipeSelectMode.started) {
    swipeSelectMode.started = true;
    if (!swipeSelectMode.removing) {
      const el0 = document.elementFromPoint(swipeStartX, swipeStartY);
      const ci0 = (el0 && el0.dataset ? el0.dataset.ci : undefined);
      if (ci0 != null) toggleImportChar(idx, parseInt(ci0));
    }
  }
  const card = previewData.cards[idx];
  if (!card._charSelected) card._charSelected = {};
  const steps = Math.max(Math.abs(tx - _lastTouchX), Math.abs(ty - _lastTouchY));
  for (let s = 0; s <= steps; s++) {
    const t = steps === 0 ? 1 : s / steps;
    const px = Math.round(_lastTouchX + (tx - _lastTouchX) * t);
    const py = Math.round(_lastTouchY + (ty - _lastTouchY) * t);
    const el = document.elementFromPoint(px, py);
    const ci = (el && el.dataset ? el.dataset.ci : undefined);
    if (ci == null) continue;
    const charIdx = parseInt(ci);
    if (swipeSelectMode.removing) {
      if (card._savedChars && card._savedChars[charIdx]) toggleImportChar(idx, charIdx);
    } else {
      if (card._savedChars && card._savedChars[charIdx]) continue;
      if (card._charSelected[charIdx] !== swipeSelectMode.adding) toggleImportChar(idx, charIdx);
    }
  }
  _lastTouchX = tx; _lastTouchY = ty;
  e.preventDefault();
}

function swipeSelectEnd(idx) {
  // 没滑动的单击（去除模式在 start 已处理，这里跳过）
  if (swipeSelectMode && !swipeSelectMode.started && !swipeSelectMode.removing) {
    const card = previewData.cards[idx];
    const el = document.elementFromPoint(swipeStartX, swipeStartY);
    const ci = (el && el.dataset ? el.dataset.ci : undefined);
    if (ci != null) {
      const charIdx = parseInt(ci);
      if (!(card._savedChars && card._savedChars[charIdx])) {
        toggleImportChar(idx, charIdx);
      }
    }
  }
  swipeSelectMode = null;
}

// 鼠标选择（桌面端）：mousedown 即时响应，拖动连续选中
let _lastX = 0, _lastY = 0;
function mouseSelectStart(e, idx) {
  if (Date.now() - _touchJustHappened < 500) return; // 移动端刚摸过，跳过鼠标事件
  swipeStartX = _lastX = e.clientX; swipeStartY = _lastY = e.clientY;
  _wasDragging = true; // 阻止后续 onclick 重复触发
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const ci = (el && el.dataset ? el.dataset.ci : undefined);
  if (ci == null) { swipeSelectMode = null; return; }
  const charIdx = parseInt(ci);
  const card = previewData.cards[idx];
  const isSaved = card._savedChars && card._savedChars[charIdx];
  if (isSaved) toggleImportChar(idx, charIdx);
  swipeSelectMode = { idx, adding: isSaved ? false : !(card._charSelected || {})[charIdx], removing: isSaved };
}
function mouseSelectMove(e, idx) {
  if (!(e.buttons & 1)) { swipeSelectMode = null; return; }
  if (!swipeSelectMode || swipeSelectMode.idx !== idx) return;
  const dx = Math.abs(e.clientX - swipeStartX), dy = Math.abs(e.clientY - swipeStartY);
  if (dx < 6 && dy < 6) return;
  _wasDragging = true;
  const card = previewData.cards[idx];
  if (!card._charSelected) card._charSelected = {};
  // 插值：在上次位置和当前位置之间逐点检查，防止跳字
  const steps = Math.max(Math.abs(e.clientX - _lastX), Math.abs(e.clientY - _lastY));
  for (let s = 0; s <= steps; s++) {
    const t = steps === 0 ? 1 : s / steps;
    const px = Math.round(_lastX + (e.clientX - _lastX) * t);
    const py = Math.round(_lastY + (e.clientY - _lastY) * t);
    const el = document.elementFromPoint(px, py);
    const ci = (el && el.dataset ? el.dataset.ci : undefined);
    if (ci == null) continue;
    const charIdx = parseInt(ci);
    if (swipeSelectMode.removing) {
      if (card._savedChars && card._savedChars[charIdx]) toggleImportChar(idx, charIdx);
    } else {
      if (card._savedChars && card._savedChars[charIdx]) continue;
      if (card._charSelected[charIdx] !== swipeSelectMode.adding) toggleImportChar(idx, charIdx);
    }
  }
  _lastX = e.clientX; _lastY = e.clientY;
  e.preventDefault();
}
function mouseSelectEnd(idx) { swipeSelectMode = null; _wasDragging = false; }

function toggleImportChar(idx, charIdx) {
  const card = previewData.cards[idx];
  previewData._activeIdx = idx;
  if (!card._charSelected) card._charSelected = {};
  // 如果是已保存的字，点击取消该字所属的挖空
  if (card._savedChars && card._savedChars[charIdx]) {
    card._savedChars[charIdx] = false;
    const a = (card.answer || '').trim();
    const q = (card.question || '').trim();
    const answerStart = q.length + 1;
    card.blanks = (card.blanks || []).filter(b => {
      const relStart = b.start - answerStart;
      const relEnd = b.end - answerStart;
      return !(charIdx >= relStart && charIdx < relEnd);
    });
    // 全部空被移除后清除手动标记
    if (!card.blanks.length) delete card._manualBlanks;
    document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
    document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
    return;
  }
  card._charSelected[charIdx] = !card._charSelected[charIdx];
  // 用 data-ci 查找元素
  const container = document.getElementById('pv-answer-' + idx);
  if (container) {
    const el = container.querySelector('[data-ci="' + charIdx + '"]');
    if (el) el.classList.toggle('char-sel', card._charSelected[charIdx]);
  }
}

function saveCardSelection(idx) {
  const card = previewData.cards[idx];
  const sel = card._charSelected || {};
  if (!Object.values(sel).some(function(v) { return v; })) return;
  // 保存撤回快照（首次保存时）
  if (!card._undoSnapshot) saveUndoSnapshot(card);

  const q = (card.question || '').trim();
  const rawA = card.answer || '';
  const answerStart = q.length + 1;

  // 仅取新选中的字，分组
  const newIndices = Object.keys(sel).filter(k => sel[k]).map(Number).sort((a,b) => a-b);
  if (!newIndices.length) return;
  const newGroups = [];
  let g = [newIndices[0]];
  for (let i = 1; i < newIndices.length; i++) {
    if (newIndices[i] === g[g.length - 1] + 1) g.push(newIndices[i]);
    else { newGroups.push(g); g = [newIndices[i]]; }
  }
  newGroups.push(g);

  if (!card.blanks) card.blanks = [];
  if (!card._savedChars) card._savedChars = {};

  for (const ng of newGroups) {
    const ngStart = answerStart + ng[0];
    const ngEnd = answerStart + ng[ng.length - 1] + 1;
    // 查找与新组相邻或重叠的旧空白
    let mergedStart = ngStart, mergedEnd = ngEnd;
    card.blanks = card.blanks.filter(b => {
      if (ngStart < b.end && b.start < ngEnd) {
        mergedStart = Math.min(mergedStart, b.start);
        mergedEnd = Math.max(mergedEnd, b.end);
        return false; // 移除旧空白，后面重建
      }
      return true;
    });
    // 创建合并后的空白
    const text = rawA.substring(mergedStart - answerStart, mergedEnd - answerStart).replace(/[\n]/g, '');
    card.blanks.push({ start: mergedStart, end: mergedEnd, text, isAnswer: true });
    card._manualBlanks = true;
    // 标记已保存
    for (let i = mergedStart - answerStart; i < mergedEnd - answerStart; i++) card._savedChars[i] = true;
  }
  card.blanks.sort((a, b) => a.start - b.start);
  // 从相邻独立空生成组合空
  _rebuildCombinedBlanks(card);
  card._charSelected = {};

  document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
}

function clearCardSelection(idx) {
  const card = previewData.cards[idx];
  card._charSelected = {};
  card._savedChars = {};
  card.blanks = [];
  delete card._manualBlanks;
  document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
}

// 卡片状态判定：empty=答案为空, short=答案<20字, noBlanks=手动模式无挖空, ok=正常
function getCardStatus(card, mode) {
  var ans = (card.answer || '').replace(/\s/g, '');
  if (!ans) return 'empty';
  if (ans.length < 20) return 'short';
  if (mode === 'manual') {
    var hasBlanks = (card.blanks && card.blanks.length > 0) || (card._savedChars && Object.keys(card._savedChars).length > 0);
    if (!hasBlanks) return 'noBlanks';
  }
  return 'ok';
}

// 跳转到上一个/下一个问题卡片
var _lastProblemIdx = -1;
function jumpToProblemCard(direction) {
  if (!previewData) return;
  var cards = previewData.cards;
  var mode = previewData.mode;
  var problemIndices = [];
  for (var i = 0; i < cards.length; i++) {
    if (getCardStatus(cards[i], mode) !== 'ok') problemIndices.push(i);
  }
  if (!problemIndices.length) { showToast('✅ 没有发现问题卡片'); return; }
  // 找当前/最近的位置
  var cur = _lastProblemIdx;
  if (cur < 0) cur = direction > 0 ? -1 : cards.length;
  var target = -1;
  if (direction > 0) {
    for (var j = 0; j < problemIndices.length; j++) {
      if (problemIndices[j] > cur) { target = problemIndices[j]; break; }
    }
    if (target < 0 && problemIndices.length) target = problemIndices[0]; // 循环到开头
  } else {
    for (var k = problemIndices.length - 1; k >= 0; k--) {
      if (problemIndices[k] < cur) { target = problemIndices[k]; break; }
    }
    if (target < 0 && problemIndices.length) target = problemIndices[problemIndices.length - 1]; // 循环到末尾
  }
  if (target < 0) return;
  _lastProblemIdx = target;
  // 自动跳转到目标所在页
  var pageSize = 20;
  var targetPage = Math.floor(target / pageSize);
  var needPageSwitch = _previewPage !== targetPage;
  if (needPageSwitch) {
    _previewPage = targetPage;
    renderPreviewCards();
  }
  setTimeout(function() {
    var el = document.getElementById('previewCard-' + target);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.boxShadow = '0 0 0 3px var(--warning)';
      setTimeout(function() { el.style.boxShadow = ''; }, 1500);
    }
  }, needPageSwitch ? 150 : 50);
  showToast('已跳到第 ' + (target + 1) + ' 题');
}

// 撤回卡片编辑/挖空操作
function undoCardEdit(idx) {
  if (!previewData || !previewData.cards[idx]) return;
  var card = previewData.cards[idx];
  var snap = card._undoSnapshot;
  if (!snap) return;
  card.question = snap.question;
  card.answer = snap.answer;
  card.koujue = snap.koujue;
  card.blanks = snap.blanks ? snap.blanks.slice() : [];
  card._savedChars = snap._savedChars ? Object.assign({}, snap._savedChars) : {};
  card._charSelected = snap._charSelected ? Object.assign({}, snap._charSelected) : {};
  card._manualBlanks = snap._manualBlanks;
  card._autoBlanks = snap._autoBlanks;
  delete card._undoSnapshot;
  card._editing = false;
  renderPreviewCards();
  showToast('↩️ 已撤回');
}

// 保存撤回快照
function saveUndoSnapshot(card) {
  card._undoSnapshot = {
    question: card.question,
    answer: card.answer,
    koujue: card.koujue,
    blanks: (card.blanks || []).slice(),
    _savedChars: Object.assign({}, card._savedChars || {}),
    _charSelected: Object.assign({}, card._charSelected || {}),
    _manualBlanks: card._manualBlanks,
    _autoBlanks: card._autoBlanks
  };
}

function _rebuildCombinedBlanks(card) {
  // 先清除旧的组合空
  card.blanks = (card.blanks || []).filter(b => !b._combined);
  const blanks = card.blanks.slice().sort((a, b) => a.start - b.start);
  if (blanks.length < 2) return;
  // 找相邻组（上一个 end == 下一个 start）
  const groups = [];
  let cur = [blanks[0]];
  for (let i = 1; i < blanks.length; i++) {
    if (blanks[i].start === cur[cur.length - 1].end) {
      cur.push(blanks[i]);
    } else {
      if (cur.length >= 2) groups.push(cur);
      cur = [blanks[i]];
    }
  }
  if (cur.length >= 2) groups.push(cur);
  if (!groups.length) return;
  const q = (card.question || '').trim();
  const answerStart = q.length + 1;
  const rawA = card.answer || '';
  // 为每组相邻空生成所有连续子序列组合
  for (const g of groups) {
    for (let len = 2; len <= g.length; len++) {
      for (let i = 0; i + len <= g.length; i++) {
        const start = g[i].start;
        const end = g[i + len - 1].end;
        const text = rawA.substring(start - answerStart, end - answerStart).replace(/[\n]/g, '');
        if (!card.blanks.some(b => b.start === start && b.end === end)) {
          card.blanks.push({ start, end, text, isAnswer: true, _combined: true });
        }
      }
    }
  }
  card.blanks.sort((a, b) => a.start - b.start);
}

function renderSavedInfo(card, idx) {
  const blanks = (card.blanks || []).slice().sort((a, b) => a.start - b.start).filter(b => !b._combined);
  if (!blanks.length) return '<span style="font-size:11px;color:var(--text-tertiary)">暂未保存挖空</span>';
  return '<span style="font-size:11px;color:var(--text-secondary)">已保存 ' + blanks.length + ' 个空：</span>' + blanks.map((b, j) => `<span class="blank-tag" onclick="removeManualBlank(${idx},${j})" style="font-size:11px;padding:2px 8px;cursor:pointer" title="点击取消">${escapeHtml(b.text)} ✕</span>`).join(' ');
}
function removeManualBlank(idx, bidx) {
  const card = previewData.cards[idx];
  const blanks = (card.blanks || []).slice().sort((a, b) => a.start - b.start).filter(b => !b._combined);
  const b = blanks[bidx];
  if (!b) return;
  // 从 blanks 中移除
  card.blanks = (card.blanks || []).filter(x => x.start !== b.start || x.end !== b.end);
  // 清除对应的 _savedChars 标记
  const q = (card.question || '').trim();
  const answerStart = q.length + 1;
  const relStart = b.start - answerStart, relEnd = b.end - answerStart;
  if (card._savedChars) { for (let j = relStart; j < relEnd; j++) card._savedChars[j] = false; }
  if (!card.blanks.length) delete card._manualBlanks;
  // 重建组合空
  if (card.blanks.length) _rebuildCombinedBlanks(card);
  document.getElementById('pv-answer-' + idx).innerHTML = renderAnswerChars(card, idx);
  document.getElementById('pv-info-' + idx).innerHTML = renderSavedInfo(card, idx);
}

function renderAutoPreview(card) {
  const text = card.fullText || card.question + '\n' + card.answer;
  const blanks = (card._autoBlanks || []).filter(b => !b._removed);
  if (!blanks.length) return escNl(text);
  let h = '', le = 0;
  for (const b of blanks) {
    h += escNl(text.substring(le, b.start));
    h += `<span class="blank-highlight">${escNl(b.text)}</span>`;
    le = b.end;
  }
  h += escNl(text.substring(le));
  return h;
}

function renderAutoTags(card, idx) {
  const blanks = card._autoBlanks || [];
  const active = blanks.filter(b => !b._removed);
  let h = active.length + ' 个挖空 ';
  h += blanks.map((b, j) => {
    const cls = b._removed ? 'blank-tag removed' : 'blank-tag';
    return `<span class="${cls}" onclick="toggleAutoBlank(${idx}, ${j})">${escapeHtml(b.text)}${b._removed ? ' ↺' : ' ✕'}</span>`;
  }).join(' ');
  return h;
}

function toggleAutoBlank(idx, bidx) {
  const card = previewData.cards[idx];
  card._autoBlanks[bidx]._removed = !card._autoBlanks[bidx]._removed;
  document.getElementById('pv-auto-text-' + idx).innerHTML = renderAutoPreview(card);
  document.getElementById('pv-auto-tags-' + idx).innerHTML = renderAutoTags(card, idx);
}

function clearAllAutoBlanks() {
  if (!previewData || !previewData.cards) return;
  var count = 0;
  previewData.cards.forEach(function(c) {
    if (c._autoBlanks) {
      c._autoBlanks.forEach(function(b) { b._removed = true; count++; });
    }
  });
  renderPreviewCards();
  showToast('已清空 ' + count + ' 个自动挖空');
}

function editPreviewTitle(h2) {
  const oldText = previewData.name;
  const input = document.createElement('input');
  input.type = 'text'; input.value = oldText;
  input.style.cssText = 'font-size:18px;font-weight:800;border:none;border-bottom:2px solid var(--primary);background:transparent;color:var(--text);width:100%;padding:4px 0';
  h2.innerHTML = '';
  h2.appendChild(input);

}

function confirmImport() {
  if (!previewData) return;
  // 试用版（非永久授权）不允许导入
  if (!isPermanentAuth()) {
    showToast('试用版不支持导入，请输入永久密码后重试');
    closePreviewModal();
    return;
  }
  // 单题编辑模式（从刷题页进入）
  if (previewData._singleCardEdit) {
    const edited = previewData.cards[0];
    delete edited._charSelected; delete edited._savedChars; delete edited._autoBlanks;
    practiceState.cards[previewData._cardIdx] = edited;
    practiceState.revealed.delete(edited.id);
    delete practiceState.answers[edited.id];
    const bank = appData.banks[practiceState.bankId];
    if (bank) {
      const orig = bank.cards.find(x => x.id === edited.id);
      if (orig) { orig.blanks = edited.blanks; orig.fullText = edited.fullText; orig._manualBlanks = edited._manualBlanks; }
      saveData(appData);
    }
    previewData = null; const m = $('previewModal'); if (m) m.remove();
    renderPracticeCard();
    return;
  }
  const { name, cards, mode, editBankId } = previewData;
  const cleaned = cards.map(c => {
    delete c._charSelected; delete c._savedChars;
    // 清理合并标记：从答案中移除零宽空格，调整空白位置
    var a = c.answer || '';
    if (a.indexOf(MERGE_MARKER) >= 0) {
      var mergePositions = [];
      for (var mi = 0; mi < a.length; mi++) { if (a[mi] === MERGE_MARKER) mergePositions.push(mi); }
      c.answer = a.split(MERGE_MARKER).join('');
      // 调整 blanks 中的绝对位置（需要换算为相对位置、校正、再换算回绝对位置）
      if (c.blanks && mergePositions.length > 0) {
        var q2 = (c.question || '').trim();
        var ansStart = q2.length + 1;
        c.blanks.forEach(function(b) {
          var relStart = b.start - ansStart;
          var relEnd = b.end - ansStart;
          var shiftS = 0, shiftE = 0;
          for (var mp = 0; mp < mergePositions.length; mp++) {
            if (mergePositions[mp] < relStart) shiftS++;
            else break;
          }
          for (var mp2 = 0; mp2 < mergePositions.length; mp2++) {
            if (mergePositions[mp2] < relEnd) shiftE++;
            else break;
          }
          b.start -= shiftS;
          b.end -= shiftE;
        });
      }
      // 重建 fullText
      c.fullText = (c.question || '').trim() + '\n' + c.answer;
    }
    if (mode === 'auto' && c._autoBlanks) {
      c.blanks = c._autoBlanks.filter(b => !b._removed);
      delete c._manualBlanks;
    }
    delete c._autoBlanks;
    return c;
  });

  if (editBankId) {
    // 编辑模式：更新已有题库
    const bank = appData.banks[editBankId];
    if (bank) {
      bank.cards = cleaned;
      bank.updatedAt = Date.now();
      saveData(appData);
      previewData = null; const m = $('previewModal'); if (m) m.remove();
      showToast(`已更新！${cleaned.length} 题`);
    }
  } else {
    // 新建模式
    const bankId = generateId();
    appData.banks[bankId] = { id: bankId, name, createdAt: Date.now(), updatedAt: Date.now(), cards: cleaned };
    saveData(appData);
    previewData = null; const m = $('previewModal'); if (m) m.remove();
    showToast(`导入成功！${cleaned.length} 题`);
  }
  renderBanks();
}

function executeMerge(srcId, dstId) {
  const src = appData.banks[srcId];
  const dst = appData.banks[dstId];
  if (!src || !dst) return;
  const count = src.cards.length;
  const idMap = {}; // 旧ID→新ID映射，保证错题本正确迁移
  for (const card of src.cards) {
    const oldId = card.id;
    card.id = generateId(); // 避免ID冲突
    idMap[oldId] = card.id;
    dst.cards.push(card);
  }
  dst.updatedAt = Date.now();
  // 合并错题本（使用ID映射保留错题记录）
  const srcWb = getWrongBook(srcId);
  const dstWb = getWrongBook(dstId);
  for (const [cid, detail] of Object.entries(srcWb)) {
    const newCid = idMap[cid];
    if (newCid) dstWb[newCid] = detail;
  }
  // 删除源题库
  delete appData.banks[srcId];
  delete appData.seqProgress[srcId];
  delete appData.wrongBooks[srcId];
  saveData(appData);
  showToast('已合并！' + count + ' 题从「' + src.name + '」移入「' + dst.name + '」');
  renderBanks();
}

function selectTimerMode(mode, el) {
  timerMode = mode;
  document.querySelectorAll('#timerModeGroup .chip').forEach(function(c) { c.classList.remove('active'); });

    config.style.display = '';
    if (mode === 'perQuestion') {
      label.textContent = '每题限时';
      document.getElementById('timerSeconds').value = timerSeconds || 75;
    } else {
      label.textContent = '总共限时';
      document.getElementById('timerSeconds').value = timerSeconds || 600;
    }
  }
  appData.settings.timerMode = mode;
  appData.settings.timerSeconds = timerSeconds;
  saveData(appData);
}
function saveTimerSeconds() {
  var input = document.getElementById('timerSeconds');
  if (!input) return;
  timerSeconds = parseInt(input.value) || 75;
  if (timerSeconds < 5) timerSeconds = 5;
  if (timerSeconds > 3600) timerSeconds = 3600;
  input.value = timerSeconds;
  appData.settings.timerSeconds = timerSeconds;
  saveData(appData);
}
function startTimer() {
  if (timerMode === 'off') { return; }
  var secInput = document.getElementById('timerSeconds');
  timerSeconds = parseInt(secInput.value) || 60;
  if (timerSeconds < 5) timerSeconds = 5;
  if (timerSeconds > 3600) timerSeconds = 3600;
  timerRemaining = timerSeconds;
  updateTimerDisplay();
  timerInterval = setInterval(function() {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) { handleTimerExpiry(); }
  }, 1000);
  document.getElementById('timerDisplay').style.display = '';
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerDisplay() {
  var display = document.getElementById('timerDisplay');
  if (!display) return;
  var mins = Math.floor(timerRemaining / 60);
  var secs = timerRemaining % 60;
  display.textContent = '⏱ ' + mins + ':' + (secs < 10 ? '0' : '') + secs;
  if (timerRemaining <= 10) {
    display.style.background = 'var(--danger-light)'; display.style.color = 'var(--danger)';
  } else if (timerRemaining <= 30) {
    display.style.background = 'var(--warning-light)'; display.style.color = '#92400e';
  } else {
    display.style.background = 'var(--primary-light)'; display.style.color = 'var(--primary)';
  }
}
function handleTimerExpiry() {
  stopTimer();
  if (timerMode === 'perQuestion') {
    showToast('⏰ 时间到！自动跳到下一题');
    var card = practiceState.cards[practiceState.index];
    var wb = getWrongBook(practiceState.bankId);
    wb[card.id] = { wrongIndices: [], wrongAnswers: ['超时'] };
    saveData(appData);
    nextCard();
  } else {
    showToast('⏰ 总时间到！自动提交');
    finishPractice();
  }
}
function toggleWrongFirst() {
  wrongFirst = !wrongFirst;
  appData.settings.wrongFirst = wrongFirst;
  saveData(appData);
  var el = document.getElementById('wrongFirstChip');
  if (el) { el.classList.toggle('active', wrongFirst); el.textContent = wrongFirst ? '✅ 复习优先' : '📖 顺序出题'; }
}

function selectDrawMode(mode, el) {

  }[mode] || '';

function onBankChange(resetFilter = true) {
  const bankId = document.getElementById('bankSelect').value;
  if (resetFilter) categoryFilter = null; // 切换题库时重置筛选
  if (!bankId) return;
  sessionStorage.setItem('lastPracticeBank', bankId);

  let seqDiv = document.getElementById('seqInfo');
  if (drawMode === 'sequential') {
    const pos = getSeqProgress(bankId);
    const bank = appData.banks[bankId];
    if (!bank) return;
    const html = `<div class="seq-info" id="seqInfo">
      <span>📖 当前进度：第 <b>${Math.min(pos + 1, bank.cards.length)}</b> / ${bank.cards.length} 题</span>
      <button class="btn btn-sm" style="padding:4px 12px;font-size:12px;background:var(--danger);color:#fff;border:none;border-radius:6px;font-weight:600" onclick="event.stopPropagation();resetSeqProgress()">重置</button>
    </div>`;
    if (seqDiv) seqDiv.outerHTML = html;
    else { const chips = document.getElementById('drawModeChips'); if (chips) chips.parentElement.insertAdjacentHTML('afterend', html); }
  } else if (seqDiv) {
    seqDiv.style.display = 'none';
  }
  // 更新分类筛选
  renderCategoryFilter(bankId);
}

function resetSeqProgress() {
  const bankId = document.getElementById('bankSelect').value;
  if (!bankId) return;
  appData.seqProgress[bankId] = 0;
  saveData(appData);
  onBankChange(false);
  showToast('进度已重置');
}

function getSeqProgress(bankId) { return appData.seqProgress[bankId] || 0; }

function extractCategories(bank) {
  if (!bank || !bank.cards) return [];
  const cats = new Set();
  for (const c of bank.cards) {
    const q = (c.question || "").trim();
    const matches = q.match(/（[^）]{1,8}）/g);
    if (matches) for (const m of matches) cats.add(m);
  }
  return [...cats].sort();
}

function renderCategoryFilter(bankId) {
  const div = document.getElementById("categoryFilter");
  if (!div) return;
  const bank = appData.banks[bankId];
  if (!bank) { div.innerHTML = ""; return; }
  const cats = extractCategories(bank);
  if (!cats.length) { div.innerHTML = ""; return; }
  if (!categoryFilter) categoryFilter = new Set(cats);
  let h = "<label class=\"form-label\" style=\"font-size:13px\">🏷️ 分类筛选</label><div class=\"chip-group\">";
  h += "<span class=\"chip" + (categoryFilter.size === cats.length ? " active" : "") + "\" onclick=\"toggleAllCategories()\">全部</span>";
  for (const cat of cats) {
    h += "<span class=\"chip" + (categoryFilter.has(cat) ? " active" : "") + "\" onclick=\"toggleCategory('" + cat + "')\" style=\"margin-left:4px\">" + cat + "</span>";
  }
  h += "</div>";
  div.innerHTML = h;
  updateFilteredCount();
}

function toggleAllCategories() {
  const bankId = document.getElementById("bankSelect").value;
  const bank = appData.banks[bankId];
  if (!bank) return;
  const cats = extractCategories(bank);
  if (categoryFilter && categoryFilter.size === cats.length) categoryFilter = new Set();
  else categoryFilter = new Set(cats);
  renderCategoryFilter(bankId);
}

function toggleCategory(cat) {
  if (!categoryFilter) return;
  if (categoryFilter.has(cat)) {
    if (categoryFilter.size <= 1) return; // 至少保留一个分类
    categoryFilter.delete(cat);
  } else categoryFilter.add(cat);
  renderCategoryFilter(document.getElementById("bankSelect").value);
}

function getFilteredCards(bank) {
  if (!bank || !bank.cards) return [];
  if (!categoryFilter || !categoryFilter.size) return bank.cards;
  return bank.cards.filter(c => {
    const q = (c.question || "").trim();
    const matches = q.match(/（[^）]{1,8}）/g) || [];
    return matches.some(m => categoryFilter.has(m));
  });
}

var _selectedMultiBanks = [];
var _isMultiBankMode = false;

function toggleMultiBank(on) {
  _isMultiBankMode = on;
  var singleChip = document.getElementById('singleBankChip');
  var multiChip = document.getElementById('multiBankChip');
  var singleSec = document.getElementById('singleBankSection');
  var multiSec = document.getElementById('multiBankSection');

function toggleMultiBankCheck(bankId) {
  var idx = _selectedMultiBanks.indexOf(bankId);
  if (idx >= 0) _selectedMultiBanks.splice(idx, 1);
  else _selectedMultiBanks.push(bankId);
  var row = document.getElementById('mbrow_' + bankId);
  var box = document.getElementById('mbox_' + bankId);
  if (row) row.classList.toggle('selected', idx < 0);

function updateMultiBankCount() {
  var totalCards = 0;
  for (var i = 0; i < _selectedMultiBanks.length; i++) {
    var b = appData.banks[_selectedMultiBanks[i]];
    if (b) totalCards += (b.cards || []).length;
  }
  var countEl = document.getElementById('multiBankCount');
  if (countEl) countEl.textContent = '已选 ' + _selectedMultiBanks.length + ' 个题库，共 ' + totalCards + ' 题';
}

function updateFilteredCount() {
  const bankId = document.getElementById("bankSelect").value;
  if (!bankId) return;
  const bank = appData.banks[bankId];
  if (!bank) return;
  const filtered = getFilteredCards(bank);
  const hint = document.getElementById("categoryFilterHint");
  if (hint) hint.textContent = "筛选后 " + filtered.length + " / " + bank.cards.length + " 题";
}

function startPracticeSetup(bankId) {
  const bank = appData.banks[bankId];
  if (!bank) return;
  sessionStorage.setItem('lastPracticeBank', bankId);
  switchTab('practice');
}

// ==================== 做题 - 开始 ====================
function startPractice() {
  practiceStartTime = Date.now();
  practiceSwitches = 0;
  applyFocusMode();
  // 冲刺模式：使用冲刺题目池
  var isSprint = sessionStorage.getItem('sprintMode') === '1';
  if (isSprint) {
    var sprintPoolRaw = sessionStorage.getItem('sprintPool');
    if (!sprintPoolRaw) { showToast('冲刺数据已过期，请重新进入'); sessionStorage.removeItem('sprintMode'); renderPracticeSetup(); return; }
    try {
      var sprintPool = JSON.parse(sprintPoolRaw);
      if (!sprintPool.length) { showToast('没有需要冲刺的题目'); sessionStorage.removeItem('sprintMode'); renderPracticeSetup(); return; }
      var sprintCount = Math.min(sprintPool.length, batchSize || sprintPool.length);
      var sprintSelected = sprintPool.slice(0, sprintCount);
      // 从各个题库中找到对应卡片
      var selectedCards = [];
      for (var si = 0; si < sprintSelected.length; si++) {
        var sp = sprintSelected[si];
        var spBank = appData.banks[sp.bankId];
        if (!spBank) continue;
        var spCard = spBank.cards.find(function(x) { return x.id === sp.id; });
        if (spCard) selectedCards.push({ card: spCard, bankId: sp.bankId, bankName: sp.bankName });
      }
      if (!selectedCards.length) { showToast('冲刺题目已失效，请重新进入'); sessionStorage.removeItem('sprintMode'); renderPracticeSetup(); return; }
      // 构建多题库的练习状态
      var firstBank = selectedCards[0];
      var sprintBankId = firstBank.bankId;
      var sprintBankName = '冲刺模式';
      var sprintQh = new Set();
      if (hideQuestionStart) { for (var qi = 0; qi < selectedCards.length; qi++) sprintQh.add(selectedCards[qi].card.id); }
      practiceState = {
        bankId: sprintBankId, bankName: sprintBankName,
        cards: selectedCards.map(function(x) { return x.card; }), index: 0,
        mode: 'random-repeat',
        answers: {}, revealed: new Set(),
        questionHidden: sprintQh, koujueExpanded: {},
        total: selectedCards.length,
        _streak: 0,
        _roundCorrect: 0, _roundWrong: 0, _newlyMastered: [],
        _isSprint: true,
        answersHidden: false
      };
      $('practiceSetup').style.display = 'none';
      $('practiceResult').style.display = 'none';
      $('practiceActive').style.display = 'block';
      renderPracticeCard();
      return;
    } catch(e) { showToast('冲刺模式启动失败'); sessionStorage.removeItem('sprintMode'); renderPracticeSetup(); return; }
  }

  // 多题库模式（通过UI选择）
  var multiBanks = (_isMultiBankMode && _selectedMultiBanks.length > 1) ? _selectedMultiBanks.slice() : null;
  if (multiBanks && multiBanks.length > 1) {
    // 从多个题库收集题目
    var allCards = [];
    for (var mi = 0; mi < multiBanks.length; mi++) {
      var mBank = appData.banks[multiBanks[mi]];
      if (!mBank) continue;
      var mPool = getFilteredCards(mBank);
      for (var mj = 0; mj < mPool.length; mj++) {
        allCards.push({ card: mPool[mj], bankId: multiBanks[mi], bankName: mBank.name });
      }
    }
    if (!allCards.length) { showToast('所选题库无题目'); return; }
    // 打乱
    for (var ak = allCards.length - 1; ak > 0; ak--) {
      var ar = Math.floor(Math.random() * (ak + 1));
      var atmp = allCards[ak]; allCards[ak] = allCards[ar]; allCards[ar] = atmp;
    }
    var mCount = batchSize === 0 ? allCards.length : Math.min(batchSize, allCards.length);
    var mSelected = allCards.slice(0, mCount);
    var mQh = new Set();
    if (hideQuestionStart) { for (var qi2 = 0; qi2 < mSelected.length; qi2++) mQh.add(mSelected[qi2].card.id); }
    // 使用第一个题库作为"主"题库
    var mBankIds = multiBanks;
    practiceState = {
      bankId: mSelected[0].bankId, bankName: '混合 ' + multiBanks.length + ' 个题库',
      cards: mSelected.map(function(x) { return x.card; }), index: 0,
      mode: 'random-repeat',
      answers: {}, revealed: new Set(),
      questionHidden: mQh, koujueExpanded: {},
      total: mSelected.length,
      _streak: 0,
      _roundCorrect: 0, _roundWrong: 0, _newlyMastered: [],
      _multiBanks: mBankIds,
      _cardBankMap: mSelected.reduce(function(map, x, idx) { map[idx] = { bankId: x.bankId, bankName: x.bankName }; return map; }, {}),
      answersHidden: false
    };
    $('practiceSetup').style.display = 'none';
    $('practiceResult').style.display = 'none';
    $('practiceActive').style.display = 'block';
    renderPracticeCard();
    return;
  }

  const bankId = document.getElementById('bankSelect').value;
  if (!bankId) { showToast('请先选择题库'); return; }
  const bank = appData.banks[bankId];
  if (!bank || !bank.cards.length) { showToast('题库为空'); return; }
  const pool = getFilteredCards(bank);

  if (!pool.length) { showToast("筛选后无题目"); return; }
  const count = batchSize === 0 ? pool.length : Math.min(batchSize, pool.length);
  let selected;

  if (drawMode === 'sequential') {
    const pos = getSeqProgress(bankId);
    if (pos >= pool.length) {
      if (!confirm('题库已全部做完一轮，是否重置进度从头开始？')) return;
      appData.seqProgress[bankId] = 0;
      saveData(appData);
      selected = [...pool.slice(0, count)];
    } else {
      selected = [...pool.slice(pos, Math.min(pos + count, pool.length))];
    }
  } else if (drawMode === 'random-norepeat') {
    if (!appData.doneSets) appData.doneSets = {};
    if (!appData.doneSets[bankId]) appData.doneSets[bankId] = [];
    const doneSet = appData.doneSets[bankId];
    const available = pool.filter(c => !doneSet.includes(c.id));
    if (available.length === 0) {
      if (!confirm('所有题目都已做过一轮，是否重置重新开始？')) return;
      appData.doneSets[bankId] = [];
      saveData(appData);
      selected = shuffle([...pool]).slice(0, count);
    } else {
      selected = shuffle(available).slice(0, Math.min(count, available.length));
    }
  } else {
    // random-repeat
    selected = shuffle([...pool]).slice(0, count);
  }

  // 间隔重复 & 错题优先排序（可通过开关关闭）
  var wb = getWrongBook(bankId);
  var now = Date.now();
  var dueCount = 0, wrongCount = 0;
  selected.forEach(function(c) {
    if (c.srNextReview && c.srNextReview <= now) dueCount++;
    if (c.id in wb) wrongCount++;
  });
  if (wrongFirst) {
    selected.sort(function(a, b) {
      // 1. 到期复习优先
      var aDue = a.srNextReview && a.srNextReview <= now ? 1 : 0;
      var bDue = b.srNextReview && b.srNextReview <= now ? 1 : 0;
      if (aDue !== bDue) return bDue - aDue;
      // 2. 错题其次
      var aWrong = (a.id in wb) ? 1 : 0;
      var bWrong = (b.id in wb) ? 1 : 0;
      return bWrong - aWrong;
    });
  }

  const qh = new Set();
  if (hideQuestionStart) { for (const c of selected) qh.add(c.id); }
  practiceState = {
    bankId, bankName: bank.name,
    cards: selected, index: 0,
    mode: drawMode,
    answers: {}, revealed: new Set(),
    questionHidden: qh, koujueExpanded: {},
    total: selected.length,
    _streak: 0,
    _roundCorrect: 0, _roundWrong: 0, _newlyMastered: [],
    answersHidden: false
  };

  $('practiceSetup').style.display = 'none';
  $('practiceResult').style.display = 'none';
  $('practiceActive').style.display = 'block';
  renderPracticeCard();

  // 计时器初始化
  if (timerMode !== 'off') {
    stopTimer();
    startTimer();
  }

  // 间隔重复提醒
  if (wrongFirst && dueCount > 0) {
    setTimeout(function() {
      showToast('📅 今日待复习 ' + dueCount + ' 题，已优先排在前面' + (wrongCount > dueCount ? '，还有 ' + (wrongCount - dueCount) + ' 道错题' : ''));
    }, 600);
  } else if (wrongFirst && wrongCount > 0) {
    setTimeout(function() {
      showToast('❌ ' + wrongCount + ' 道错题已优先排在前面');
    }, 600);
  }
}

// ==================== 做题 - 卡片渲染 ====================

  const qHidden = st.questionHidden.has(card.id);
  const density = appData.settings.density || 'low';
  const textHtml = renderCardWithBlanks(card, revealed, qHidden);

  const hasVoice = appData.settings.voiceEnabled;

      <button style="background:none;border:none;font-size:24px;cursor:pointer;padding:8px 12px;line-height:1;min-width:44px;min-height:44px" onclick="toggleStarCurrent()">${starIcon}</button>
      <button style="background:none;border:none;font-size:20px;cursor:pointer;padding:8px 12px;line-height:1;min-width:44px;min-height:44px;color:var(--danger)" onclick="deleteCurrentCard()" title="删除此题">🗑️</button>
    </div>

    <!-- 密度 + 工具 同行 -->
    <div class="flex items-center gap-8 mb-8">

        <button class="seg${density === 'low' ? ' active' : ''}" data-v="low" onclick="changeDensity('low', this)" style="padding:5px 10px;min-height:32px;font-size:13px">低</button>
        <button class="seg${density === 'high' ? ' active' : ''}" data-v="high" onclick="changeDensity('high', this)" style="padding:5px 10px;min-height:32px;font-size:13px">高</button>

      <button class="btn btn-ghost btn-sm" onclick="editCurrentCardBlanks()" style="padding:6px 8px;font-size:var(--font-size)" title="手动挖空">🐑</button>

      <div class="flex gap-4" style="margin-left:auto">
        <button class="btn btn-ghost btn-sm" onclick="toggleRevealCurrent()" style="padding:6px 8px;font-size:var(--font-size)" title="显示原文">✨</button>

        ${hasKj ? `<button class="btn btn-ghost btn-sm" onclick="toggleKoujuePanel()" style="padding:6px 8px;font-size:var(--font-size);color:var(--primary)" title="口诀">💡</button>` : ''}
        ${hasVoice ? `<button class="btn btn-ghost btn-sm" onclick="speakCard()" style="padding:6px 8px;font-size:var(--font-size)" title="朗读">🔊</button>` : ''}
      </div>
    </div>

    <!-- 题目卡片 -->

    <!-- 口诀面板 -->
    ${hasKj ? `<div class="kj-panel${kjState > 0 ? ' show' : ''}" id="kjPanel" style="padding:10px 14px;margin-bottom:10px">
      <div class="kj-keywords" onclick="expandKoujue()" style="cursor:pointer">${renderKjKeywords(card.koujue)}</div>
      <div class="kj-full${kjState > 1 ? ' show' : ''}" onclick="collapseKoujue()" style="cursor:pointer">${renderKjFull(card.koujue)}</div>

      const x = e.clientX - rect.left;
      const w = rect.width;
      // 点左1/6区域 → 上一题
      if (x < w / 6 && st.index > 0) {
        saveCurrentAnswers();
        st.index--;
        renderPracticeCard();
      }
      // 点右1/6区域 → 下一题
      else if (x > w * 5 / 6 && st.index < st.total - 1) {
        saveCurrentAnswers();
        st.index++;
        renderPracticeCard();
      }
    });
  }

  setTimeout(() => {
    const fi = document.querySelector('#cardText .blank-input');
    if (fi && !revealed) fi.focus();
  }, 200);

  // 双击空白显示答案（第一下聚焦不算）
  const cardText = c.querySelector('#cardText');
  if (cardText && !revealed) {
    const taps = new Map(); // inp → { count, lastTime }
    cardText.querySelectorAll('.blank-input').forEach(inp => {
      inp.addEventListener('pointerdown', e => {
        const now = Date.now();
        const t = taps.get(inp) || { count: 0, lastTime: 0 };
        if (now - t.lastTime > 800) t.count = 0;
        // 第一下只聚焦不算，从第二下开始计数
        if (document.activeElement !== inp && !inp.classList.contains('peeked')) {
          t.lastTime = now;
          taps.set(inp, t);
          return;
        }
        t.count++;
        t.lastTime = now;
        if (inp.classList.contains('peeked')) {
          inp.value = '';
          inp.classList.remove('peeked');
          t.count = 0;
        } else if (t.count >= 2) {
          inp.value = inp.dataset.ans || '';
          inp.classList.add('peeked');
          t.count = 0;
        }
        taps.set(inp, t);
      });
    });
  }
}

// 在 ①②③ 序号前插入换行（保留序号不被挖空吃掉）
function fmtAnswerSeg(seg, isFirst) {
  var result = seg.replace(/([①②③④⑤⑥⑦⑧⑨⑩])/g, '\n$1');
  if (isFirst) result = result.replace(/^\n/, '');
  return escNl(result);
}
function fmtAnswerSegLast(seg) {
  return escNl(seg.replace(/([①②③④⑤⑥⑦⑧⑨⑩])/g, '\n$1'));
}

function renderCardWithBlanks(card, revealed, hideQ) {
  const q = card.question.trim();
  const a = card.answer.trim();
  const text = card.fullText || q + '\n' + a;
  const answerStart = q.length + 1; // +1 for \n

  // 题目：点击可隐藏/显示
  let h = '';
  if (hideQ) {
    h += `<div style="margin-bottom:10px;padding:8px;background:var(--bg-input);border-radius:6px;text-align:center;font-size:12px;color:var(--text-tertiary);cursor:pointer" onclick="event.stopPropagation();toggleQuestion()">题目已隐藏，点击显示</div>`;
  } else {
    h += `<div style="margin-bottom:10px;line-height:1.6;cursor:pointer" onclick="event.stopPropagation();toggleQuestion()" title="点击隐藏题目">${escNl(q)}</div>`;
  }

  // 分隔 + 答案区
  if (!a) return h;
  h += `<div style="font-size:11px;color:var(--text-tertiary);margin-bottom:6px;font-weight:600;letter-spacing:.5px">── 填空区 ──</div>`;

  // 用户主动隐藏 → 统一显示提示
  if (practiceState.answersHidden) {
    h += `<div style="line-height:1.9;color:var(--text-tertiary)">答案已隐藏，点击 💐 按钮显示</div>`;
    return h;
  }

  // 解决重叠空：分组后每组选一个
  const blanks = resolveBlanks(card);
  if (!blanks.length) {
    h += `<div style="line-height:1.9">${escNl(a)}</div>`;
    return h;
  }

  // 渲染答案，带挖空
  let ah = '', le = answerStart;
  for (let i = 0; i < blanks.length; i++) {
    const b = blanks[i];
    const saved = (practiceState.answers[card.id] || {})[i] || '';
    ah += fmtAnswerSeg(text.substring(le, b.start), i === 0);
    if (revealed) {
      ah += `<span class="revealed-text">${escNl(b.text)}</span>`;
    } else {
      ah += `<input type="text" class="blank-input" data-cid="${card.id}" data-bidx="${i}" data-ans="${escapeHtml(b.text).replace(/\n/g, ' ')}" value="${escapeHtml(saved)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" oncontextmenu="return false" onblur="autoCheckIfDone()">`;
    }
    le = b.end;
  }
  ah += fmtAnswerSegLast(text.substring(le));
  h += `<div style="line-height:1.9">${ah}</div>`;
  return h;
}

// 解决重叠空：分组后每组选一个（_blankRound 控制轮换）
function resolveBlanks(card) {
  const all = card.blanks || [];
  if (!all.length) return [];
  const sorted = [...all].sort((a, b) => a.start - b.start);
  const groups = [];
  for (const b of sorted) {
    let added = false;
    for (const g of groups) {
      if (g.some(gb => gb.start < b.end && b.start < gb.end)) {
        g.push(b); added = true; break;
      }
    }
    if (!added) groups.push([b]);
  }
  const round = card._blankRound || 0;
  let resolved = groups.map(g => g[round % g.length]);
  return resolved;
}

function saveCurrentAnswers() {
  if (practiceState.answersHidden) return; // 隐藏状态下不保存，避免空值覆盖已有答案

  }
}

	// 错题回顾：渲染带错空标记的答案
	// 错题互动复习：显示空填空框，点击显示/隐藏答案
function renderWrongCardInteractive(card, wrongDetail) {
  var a = card.answer ? card.answer.trim() : '';
  var blanks = card.blanks || [];
  if (!blanks.length) return '<div style="color:var(--text-secondary);line-height:1.9">' + a.replace(/\n/g, '<br>') + '</div>';
  var sorted = blanks.slice().sort(function(x,y){return x.start - y.start;});
  var groups = [];
  for (var i = 0; i < sorted.length; i++) {
    var b = sorted[i], added = false;
    for (var j = 0; j < groups.length; j++) {
      if (groups[j].some(function(gb){return gb.start < b.end && b.start < gb.end;})) {
        groups[j].push(b); added = true; break;
      }
    }
    if (!added) groups.push([b]);
  }
  var resolved = groups.map(function(g){return g[0];});
  var wi = wrongDetail.wrongIndices || [];
  var cid = card.id;
  var html = '<div style="font-size:11px;color:var(--text-tertiary);margin:8px 0 4px;font-weight:600">答错 ' + wi.length + ' 处</div>';
  html += '<div style="line-height:2.4;word-break:break-word;overflow-wrap:break-word" id="wrongBlanks_' + cid + '">';
  var le = 0;
  for (var k = 0; k < resolved.length; k++) {
    var bk = resolved[k];
    html += (a.substring(le, bk.start)).replace(/\n/g, '<br>');
    var isWr = wi.indexOf(k) >= 0;
    var style = isWr
      ? 'color:var(--danger);font-weight:600;text-decoration:underline;text-decoration-color:var(--danger);text-underline-offset:3px;background:var(--danger-light);padding:1px 4px;border-radius:3px'
      : 'color:var(--success);font-weight:600;background:var(--success-light);padding:1px 4px;border-radius:3px';
    html += '<span style="' + style + '">' + escapeHtml(bk.text) + '</span>';
    le = bk.end;
  }
  html += (a.substring(le)).replace(/\n/g, '<br>');
  html += '</div>';
  return html;
}

function applyCheckToInputs(card) {
  const inputs = document.querySelectorAll('#cardText .blank-input');
  let hasWrong = false;
  const wrongIndices = [];
  const wrongAnswers = [];
  inputs.forEach((inp, i) => {
    const userAns = inp.value.trim();
    const correctAns = (inp.dataset.ans || '').trim();
    inp.classList.remove('correct', 'wrong');
    if (fuzzyMatch(userAns, correctAns)) {
      inp.classList.add('correct');
    } else {
      inp.classList.add('wrong');
      hasWrong = true;
      wrongIndices.push(i);
      wrongAnswers.push(userAns);
    }
  });
  // 有错则收集整题到错题本，记录错空位置和填的答案
  if (hasWrong) {
    const wb = getWrongBook(practiceState.bankId);
    wb[card.id] = { wrongIndices: wrongIndices, wrongAnswers: wrongAnswers };
    saveData(appData);
  }

  // 间隔重复追踪
  const bank = appData.banks[practiceState.bankId];
  const bankCard = bank ? bank.cards.find(c => c.id === card.id) : null;
  if (bankCard) {
    if (hasWrong) {
      // 答错：设置明天复习，stage 保持不变或设为1
      bankCard.srStage = bankCard.srStage || 1;
      bankCard.srNextReview = Date.now() + 86400000; // 1天后
    } else if (bankCard.srStage && bankCard.srStage > 0) {
      // 之前错过，这次全对：晋级
      const intervals = [0, 86400000, 172800000, 345600000, 604800000]; // 0, 1d, 2d, 4d, 7d
      bankCard.srStage = Math.min(5, bankCard.srStage + 1);
      if (bankCard.srStage >= 5) {
        bankCard.srNextReview = null; // 已掌握，不再强制复习
        bankCard.srStage = 0; // 重置
      } else {
        bankCard.srNextReview = Date.now() + intervals[bankCard.srStage];
      }
    }
    saveData(appData);
  }

  // 自动朗读答案（仅全对时）
  if (appData.settings.autoReadAloud && !hasWrong) {
    setTimeout(function() { speakCard(); }, 500);
  }

  // 🧠 自适应难度：连续答对3次自动升密度，连续答错2次自动降密度
  if (appData.settings.adaptiveDensity && bank && bankCard) {
    if (!bankCard._adaptiveStreak) bankCard._adaptiveStreak = 0;
    var curDensity = appData.settings.density || 'low';
    if (!hasWrong) {
      bankCard._adaptiveStreak = Math.max(0, bankCard._adaptiveStreak) + 1;
      if (bankCard._adaptiveStreak >= 3 && curDensity === 'low' && !bankCard._manualBlanks) {
        var newBlanks = autoGenerateBlanks(bankCard, 'high');
        if (newBlanks && newBlanks.length > (bankCard.blanks || []).length) {
          bankCard.blanks = newBlanks;
          if (card) card.blanks = newBlanks;
        }
        bankCard._adaptiveStreak = 0;
      }
    } else {
      bankCard._adaptiveStreak = Math.min(0, bankCard._adaptiveStreak) - 1;
      if (bankCard._adaptiveStreak <= -2 && curDensity === 'high' && !bankCard._manualBlanks) {
        var newBlanksLow = autoGenerateBlanks(bankCard, 'low');
        if (newBlanksLow && newBlanksLow.length < (bankCard.blanks || []).length) {
          bankCard.blanks = newBlanksLow;
          if (card) card.blanks = newBlanksLow;
        }
        bankCard._adaptiveStreak = 0;
      }
    }
  }

  // 统计本轮正确/错误
  if (!hasWrong) {
    practiceState._roundCorrect = (practiceState._roundCorrect || 0) + 1;
    practiceState._streak = (practiceState._streak || 0) + 1;
    // 连续答对彩蛋
    const streakMilestones = [5, 10, 15, 20, 30, 50];
    if (streakMilestones.includes(practiceState._streak)) {
      const emojis = {5:'🔥',10:'💥',15:'⚡',20:'🌟',30:'💎',50:'👑'};
      showToast(emojis[practiceState._streak] + ' 完美连击！×' + practiceState._streak);
    }
    // 追踪"新掌握"：之前错、这次对的题
    var wasWrongBefore = card.id in getWrongBook(practiceState.bankId);
    if (wasWrongBefore) {
      if (!practiceState._newlyMastered) practiceState._newlyMastered = [];
      if (!practiceState._newlyMastered.includes(card.id)) {
        practiceState._newlyMastered.push(card.id);
      }
    }
  } else {
    practiceState._roundWrong = (practiceState._roundWrong || 0) + 1;
    practiceState._streak = 0;
  }
}

function regenerateCurrentBlanks() {
  saveCurrentAnswers();
  const card = practiceState.cards[practiceState.index];
  // 有重叠空 → 切换替代空；否则 → 按当前密度重新生成
  if (card._manualBlanks || hasOverlappingBlanks(card)) {
    card._blankRound = (card._blankRound || 0) + 1;
  } else {
    Object.assign(card, regenerateBlanks(card, appData.settings.density || 'low'));
    delete card._manualBlanks;
  }
  delete practiceState.answers[card.id];
  practiceState.revealed.delete(card.id);
  const bank = appData.banks[practiceState.bankId];
  if (bank) { const c = bank.cards.find(x => x.id === card.id); if (c) { c.blanks = card.blanks; c.fullText = card.fullText; if (!card._manualBlanks) delete c._manualBlanks; } }
  saveData(appData);
  renderPracticeCard();
  showToast('已重新挖空');
}

function hasOverlappingBlanks(card) {
  const all = card.blanks || [];
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) {
      if (all[i].start < all[j].end && all[j].start < all[i].end) return true;
    }
  }
  return false;
}

function changeDensity(density, el) {

  if (!practiceState || !practiceState.cards) return;
  saveCurrentAnswers();
  let count = 0;
  for (const card of practiceState.cards) {
    if (card._manualBlanks) continue;
    Object.assign(card, regenerateBlanks(card, density));
    delete card._manualBlanks;
    delete practiceState.answers[card.id];
    practiceState.revealed.delete(card.id);

  // 同步到题库
  const bank = appData.banks[practiceState.bankId];
  if (bank) {
    for (const card of practiceState.cards) {
      if (card._manualBlanks) continue;
      const c = bank.cards.find(x => x.id === card.id);
      if (c) { c.blanks = card.blanks; c.fullText = card.fullText; delete c._manualBlanks; }

    saveData(appData);

/* ============ Reset ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:var(--font-size);line-height:1.6;color:var(--text);background:var(--bg);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  min-height:100vh;min-height:100dvh;margin:0;padding:0;
}
body{margin:0;padding:0;max-width:480px;margin-left:auto;margin-right:auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(72px + var(--safe-bottom));overflow-x:hidden;overscroll-behavior:none;touch-action:pan-y}@media (min-width:768px){body{max-width:90vw}}@media (min-width:1024px){body{max-width:1100px}}
input,textarea,select,button{font-family:inherit;font-size:inherit}
input[type="text"],input[type="search"],textarea{user-select:text;-webkit-user-select:text}

/* ============ Buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-size:var(--font-size);font-weight:600;cursor:pointer;transition:all var(--transition);white-space:nowrap;min-height:44px;touch-action:manipulation;letter-spacing:.01em}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:var(--bg-card);color:var(--primary);border:2px solid var(--primary)}
.btn-ghost{background:var(--bg-input);color:var(--text);border:none}
.btn-sm{padding:6px 14px;font-size:13px;min-height:34px;border-radius:var(--radius-xs)}
.btn-lg{padding:14px 28px;font-size:17px;min-height:52px;border-radius:var(--radius)}
.btn-block{width:100%;justify-content:center}

/* ============ Cards ============ */
.card{background:var(--bg-card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px;overflow-wrap:break-word;word-break:break-word}

/* ============ Bottom Tab Bar ============ */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(68px + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--bg-card);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tab-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px 2px;border:none;background:none;color:var(--text-tertiary);font-size:10px;font-weight:500;cursor:pointer;transition:all var(--transition);position:relative;flex:1}
.tab-item .tab-icon{font-size:21px;line-height:1;transition:transform var(--transition)}
.tab-item.active{color:var(--primary);font-weight:700}
.tab-item.active .tab-icon{transform:scale(1.08)}
.tab-item .badge{position:absolute;top:1px;left:55%;background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:9px;padding:0 5px;transform:translateX(4px)}

/* ============ Pages ============ */
.page{display:none;padding:12px 12px 20px;animation:pageIn .25s ease}.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}

/* ============ Bank List ============ */
.bank-item{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--bg-card);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow-sm);border:1px solid var(--border);cursor:pointer;transition:all var(--transition);gap:12px;position:relative;overflow:hidden}
.bank-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary);border-radius:0 3px 3px 0;opacity:0;transition:opacity var(--transition)}
.bank-item:active{background:var(--bg-input);transform:scale(.985)}
.bank-item:active::before{opacity:1}
.bank-item .info{flex:1;min-width:0}
.bank-item .name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.bank-item .meta{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.bank-item .actions{display:flex;gap:4px;flex-shrink:0}
.bank-item .actions .btn-icon{width:36px;height:36px;padding:0;border-radius:50%;background:var(--bg-input);border:none;color:var(--text-secondary);font-size:var(--font-size);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
.bank-item .actions .btn-icon:active{background:var(--primary-soft);color:var(--primary)}
.btn-sort{width:44px;height:44px;padding:0;border:1px solid var(--border);border-radius:8px;background:var(--bg-input);color:var(--text-tertiary);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:all var(--transition);position:relative;z-index:2;appearance:none;-webkit-appearance:none;touch-action:manipulation}
.btn-sort:hover:not(:disabled){background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.btn-sort:active:not(:disabled){background:var(--primary);color:#fff}
.btn-sort:disabled{opacity:.25;cursor:not-allowed;pointer-events:none}
.file-input{opacity:0;position:fixed;left:-9999px;top:-9999px}

/* ============ Empty State ============ */
.empty{text-align:center;padding:56px 24px;color:var(--text-secondary)}
.empty .icon{font-size:52px;margin-bottom:14px;display:block;opacity:.8}
.empty h3{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty p{font-size:14px;line-height:1.7}

/* ============ Chip Selectors ============ */
.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 18px;border-radius:22px;border:2px solid var(--border);background:var(--bg-card);font-size:var(--font-size-sm);font-weight:500;cursor:pointer;transition:all var(--transition);white-space:nowrap;color:var(--text-secondary)}
.chip:active{transform:scale(.96)}
.chip.active{background:var(--primary-light);border-color:var(--primary);color:var(--primary);font-weight:700}

/* ============ Forms ============ */
textarea,input[type="number"]{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:var(--font-size);font-family:inherit;background:var(--bg-card);color:var(--text);transition:all var(--transition);-webkit-appearance:none}
select{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:var(--font-size);font-family:inherit;background:var(--bg-card);color:var(--text);transition:all var(--transition)}
textarea:focus,input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(8,145,178,.08)}
select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(8,145,178,.08)}
textarea{min-height:160px;resize:vertical;line-height:1.8;overflow-y:auto}
.form-group{margin-bottom:14px}
.form-label{font-size:14px;font-weight:700;margin-bottom:8px;display:block;color:var(--text)}
.form-hint{font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.5}

/* ============ Practice Card ============ */

.practice-card{background:var(--bg-card);border-radius:var(--radius);padding:14px 14px;box-shadow:var(--shadow-md);border:1px solid var(--border);min-height:100px;margin-bottom:10px;position:relative}
.practice-card .card-text{font-size:var(--font-size-lg);line-height:2.0;word-break:break-word;overflow-wrap:break-word;overflow-x:hidden}
.practice-card .blank-input{
  display:inline-block;min-width:28px;max-width:400px;
  padding:2px 4px;border:none;border-bottom:2px dashed var(--blank-border);
  background:var(--blank-bg);border-radius:4px 4px 0 0;
  font-size:var(--font-size-lg);font-weight:500;line-height:1.5;
  text-align:center;color:var(--text);
  transition:all var(--transition);margin:0 2px;vertical-align:baseline;
}
.practice-card .blank-input:focus{
  outline:none;border-bottom-color:var(--primary);
  background:var(--primary-light);box-shadow:0 1px 4px rgba(8,145,178,.08);
}
.practice-card .blank-input.revealed{
  border-bottom-color:var(--success);border-bottom-style:solid;
  background:var(--blank-revealed-bg);color:var(--blank-revealed-text);
  max-width:none !important;text-align:left;
}
.practice-card .blank-input.peeked{
  text-align:left;
  background:var(--blank-revealed-bg);color:var(--blank-revealed-text);
  border-bottom-color:var(--success);border-bottom-style:solid;
}
.practice-card .blank-input.correct{
  border-bottom-color:var(--success);border-bottom-style:solid;
  background:var(--success-light);
  max-width:none !important;text-align:left;
}
.practice-card .blank-input.wrong{
  border-bottom-color:var(--danger);border-bottom-style:solid;
  background:var(--danger-light);color:var(--danger);
  max-width:none !important;text-align:left;
}
.practice-card .revealed-text{color:var(--blank-revealed-text);font-weight:700;padding:1px 3px;border-radius:3px;background:var(--blank-revealed-bg)}

/* ============ Browse ============ */
.browse-dir-item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg-card);border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--transition)}
.browse-dir-item:active{background:var(--bg-input)}
.browse-dir-item:first-of-type{border-radius:var(--radius) var(--radius) 0 0}

/* ============ Koujue Panel (in practice) ============ */
.kj-panel{background:var(--primary-light);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:14px;display:none;border:1px solid var(--primary-soft)}
.kj-panel.show{display:block;animation:pageIn .2s ease}
.kj-panel .kj-keywords{font-size:var(--font-size-lg);font-weight:800;color:var(--primary);letter-spacing:.08em}
.kj-panel .kj-full{font-size:14px;color:var(--text);margin-top:8px;padding-top:8px;border-top:1px dashed var(--primary-soft);line-height:2;display:none}
.kj-panel .kj-full.show{display:block}
.kj-panel .kj-tap-hint{font-size:11px;color:var(--text-tertiary);margin-top:6px}

/* ============ Koujue Cards ============ */
.kj-card{background:var(--bg-card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);cursor:pointer;transition:all var(--transition);margin-bottom:8px}
.kj-card:active{background:var(--primary-soft)}
.kj-card .kj-mnemonic{font-size:var(--font-size-lg);font-weight:800;color:var(--primary);letter-spacing:.05em;line-height:2}
.kj-card .kj-meaning{font-size:var(--font-size);color:var(--text);margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);line-height:2;display:none}
.kj-card .kj-meaning.show{display:block;animation:pageIn .2s ease}
.kj-card .kj-meaning .kj-char{color:var(--primary);font-weight:700}
.kj-card .kj-meaning .kj-desc{color:var(--text-secondary);font-size:var(--font-size-sm)}

/* ============ Segmented Control ============ */
.segmented{display:inline-flex;background:var(--bg-input);border-radius:10px;padding:3px;gap:0}
.segmented .seg{padding:8px 16px;border:none;background:transparent;border-radius:8px;font-size:14px;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:all var(--transition);min-height:38px;white-space:nowrap}
.segmented .seg.active{background:var(--bg-card);color:var(--text);font-weight:700;box-shadow:var(--shadow-sm)}

/* ============ Modal ============ */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;inset:0;background:var(--bg-overlay);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:pageIn .2s ease;touch-action:pan-y;overscroll-behavior:none}
.modal{background:var(--bg-card);border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:88vh;max-height:88dvh;overflow-y:auto;padding:22px 18px 28px;animation:slideUp .35s ease;overscroll-behavior:none}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:18px;font-weight:800}

/* ============ Settings ============ */
.section{margin-bottom:26px}
.section-title{font-size:12px;font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;padding-left:4px}
.setting-item{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;background:var(--bg-card);border-bottom:1px solid var(--border);gap:14px;transition:background var(--transition)}
.setting-item:first-of-type{border-radius:var(--radius) var(--radius) 0 0}
.setting-item:last-of-type{border-radius:0 0 var(--radius) var(--radius);border-bottom:none}
.setting-item:only-of-type{border-radius:var(--radius);border-bottom:none}
.tier-locked-item{opacity:0.55;pointer-events:none;user-select:none}
.tier-locked-item .toggle,.tier-locked-item input[type=range]{pointer-events:none;opacity:0.5}
::placeholder{color:var(--text-tertiary);opacity:1}
.setting-label{font-weight:600;font-size:var(--font-size)}
.setting-desc{font-size:13px;color:var(--text-secondary);margin-top:1px}

/* ============ Toggle ============ */
.toggle{position:relative;width:51px;height:31px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:31px;transition:var(--transition)}
.toggle .slider::before{content:"";position:absolute;height:25px;width:25px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:var(--transition);box-shadow:0 2px 4px rgba(0,0,0,.15)}
.toggle input:checked+.slider{background:var(--primary)}
.toggle input:checked+.slider::before{transform:translateX(20px)}
/* 设置页顶部 header */
.settings-header{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px;min-height:44px}
.settings-header-title{font-size:17px;font-weight:700;color:var(--text)}
/* 头像 */
.avatar-circle{width:44px;height:44px;border-radius:50%;background:var(--bg-input);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:all var(--transition);flex-shrink:0}
.avatar-circle:active{transform:scale(.92)}
.avatar-circle img{width:100%;height:100%;object-fit:cover}
.avatar-placeholder{font-size:22px;line-height:1}
/* 可折叠 section */
.section-header{cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding-left:4px;-webkit-tap-highlight-color:transparent;user-select:none;min-height:32px}
.section-arrow{font-size:10px;color:var(--text-tertiary);transition:transform .25s;margin-left:8px;flex-shrink:0}
.section-arrow.collapsed{transform:rotate(-90deg)}
.section-body{overflow:hidden;transition:max-height .3s ease,opacity .3s ease}
.section-body.collapsed{max-height:0!important;opacity:0;margin:0}

/* ============ Preview (Import) ============ */
.preview-answer{line-height:2.6;font-size:var(--font-size-lg);letter-spacing:.08em;user-select:none;-webkit-user-select:none}
.preview-char{padding:1px 2px;border-radius:3px;cursor:pointer;transition:all .1s;border:1px solid transparent}
.preview-char:active{transform:scale(.9)}
.preview-char.char-sel{background:var(--warning);border-color:var(--warning);color:#fff}
.preview-char.saved{cursor:default}
.newline-marker{display:inline-block;opacity:.22;cursor:pointer;font-weight:700;transition:all .15s;user-select:none;-webkit-user-select:none;min-width:14px;text-align:center;padding:0 2px}
.newline-marker:hover{opacity:.6;transform:scale(1.25)}
.newline-marker:active{opacity:.9;transform:scale(.85)}
.merge-undo-dot{display:inline-block;background:var(--primary-light);color:var(--primary);border-radius:50%;width:16px;height:16px;line-height:16px;text-align:center;font-size:12px;margin:0 1px;cursor:pointer;font-weight:700;transition:all .15s;user-select:none;-webkit-user-select:none}
.merge-undo-dot:hover{background:var(--primary);color:#fff;transform:scale(1.15)}
.merge-undo-dot:active{transform:scale(.85)}
.preview-card{background:var(--bg-card);border-radius:var(--radius);padding:16px 18px;border:1px solid var(--border);margin-bottom:10px}
.preview-card .preview-text{font-size:var(--font-size);line-height:2.2;word-break:break-word;overflow-wrap:break-word;overflow-x:hidden}
.preview-card .blank-tag{display:inline-block;background:var(--warning);padding:3px 12px;border-radius:14px;font-size:12px;color:#fff;cursor:pointer;margin:2px;font-weight:600;transition:all var(--transition)}
.preview-card .blank-tag.removed{background:var(--text-tertiary);text-decoration:line-through;opacity:.6}
.preview-card .blank-highlight{background:var(--blank-bg);border-bottom:2px solid var(--blank-border);border-radius:3px;padding:1px 5px}

/* ============ Toast ============ */
.toast-container{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 22px;border-radius:22px;background:#1e293b;color:#fff;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toastIn .35s ease,toastOut .3s ease 1.8s forwards;text-align:center;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-8px)}}

/* ============ Sequence Progress ============ */
.seq-info{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--primary-light);border-radius:var(--radius-sm);font-size:13px;margin-top:8px;gap:8px}
.seq-info b{color:var(--primary)}

/* ============ Utility ============ */
.text-center{text-align:center}.text-sm{font-size:var(--font-size-sm)}.text-secondary{color:var(--text-secondary)}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}.mt-6{margin-top:6px}.mt-10{margin-top:10px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-6{margin-bottom:6px}.mb-10{margin-bottom:10px}
.flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-center{justify-content:center}.justify-between{justify-content:space-between}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-16{gap:16px}.flex-1{flex:1}.hidden{display:none!important}.w-full{width:100%}
.flex-wrap{flex-wrap:wrap}

/* ============ Responsive ============ */
@media(min-width:481px){
  .modal{border-radius:var(--radius);margin-bottom:20px;max-height:85vh;max-height:85dvh}
  .modal-overlay{align-items:center}
}
/* ============ iPad ============ */
@media(min-width:768px){
  body{max-width:768px}
  :root{--font-size-lg:19px;--font-size-xl:22px}
  .page{padding:16px 20px 24px}
  .practice-card{padding:22px 24px}
  .practice-card .blank-input{min-width:48px;max-width:200px}
  .bank-item{padding:18px 22px}
  .tab-bar{max-width:768px}
  .preview-answer{font-size:19px;line-height:2.8;letter-spacing:.1em}
  .preview-char{padding:2px 3px}
  .browse-dir-item{padding:14px 18px}
}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

@media (pointer: coarse) {
  .btn, .chip, .tab-item, .bank-item, .setting-item { min-height: 44px; }
  .color-dot { min-height: 20px; min-width: 20px; }
  .btn-sm { min-height: 36px; }
  .desktop-only { display: none !important; }
}

/* ====== PWA 安装引导横幅 ====== */
.pwa-install-banner {
  display: none;
  position: fixed;
  bottom: 16px;
  left: 16px;
  right: 16px;
  z-index: 9998;
  background: #fff;
  border: 2px solid var(--primary);
  border-radius: 14px;
  padding: 14px 16px;
  box-shadow: 0 6px 24px rgba(0,0,0,.15);
  font-size: 14px;
  align-items: center;
  gap: 12px;
}
.pwa-install-banner.show { display: flex; }
.pwa-install-banner .pwa-close {
  position: absolute;
  top: 6px;
  right: 10px;
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--text-tertiary);
  min-width: 44px;
  min-height: 44px;
  padding: 0;
}
.pwa-install-banner .pwa-icon {
  font-size: 32px;
  flex-shrink: 0;
}
.pwa-install-banner .pwa-text {
  flex: 1;
  min-width: 0;
}
.pwa-install-banner .pwa-text strong {
  display: block;
  color: var(--text);

}
.pwa-install-banner .pwa-text span {
  color: var(--text-secondary);
  font-size: 12px;
}
.pwa-install-banner .pwa-btn {
  flex-shrink: 0;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  min-height: 44px;
}
/* iOS 专用安装引导横幅 */
.pwa-ios-banner {
  display: none;
  position: fixed;
  bottom: 16px;
  left: 16px;
  right: 16px;
  z-index: 9998;
  background: #fff;
  border: 2px solid var(--primary);
  border-radius: 14px;
  padding: 14px 16px;
  box-shadow: 0 6px 24px rgba(0,0,0,.15);

}

  background: none;

  font-size: 18px;

}

/* ====== 学习计划banner ====== */
.exam-banner { border-radius:12px; padding:14px 16px; margin-bottom:16px; cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.exam-banner.green { background:#e8f5e9; border:1px solid #a5d6a7; color:#2e7d32; }
.exam-banner.yellow { background:#fff8e1; border:1px solid #ffe082; color:#e65100; }
.exam-banner.red { background:#ffebee; border:1px solid #ef9a9a; color:#c62828; }
.exam-banner.gray { background:#f5f5f5; border:1px solid #e0e0e0; color:#757575; }
.exam-banner:active { transform:scale(.98); }
.exam-banner .exam-banner-main { flex:1; min-width:0; }
.exam-banner .exam-banner-title { font-size:15px; font-weight:700; }

function apiGet(path) {
  return fetch(API_BASE + path, { method: 'GET', headers: { 'Content-Type': 'application/json' } })
    .then(function(r) {
      return r.json().then(function(body) {
        if (!r.ok) throw { status: r.status, error: body.error || ('HTTP ' + r.status), body: body };
        return body;
      });
    });
}
function apiPost(path, data) {
  return fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data || {})
  }).then(function(r) {
    return r.json().then(function(body) {

// SHA-256 (异步)
function sha256Browser(s) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(h) {
    return Array.from(new Uint8Array(h)).map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');
  });
}

// 激活码格式化: BV3-XXXX-XXXX-XXXX 或 BV9-XXXX-XXXX-XXXX
function formatActivationCode(input) {
  var cleaned = input.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (cleaned.indexOf('BV3') === 0) cleaned = cleaned.substring(3);
  else if (cleaned.indexOf('BV9') === 0) cleaned = cleaned.substring(3);
  else if (cleaned.indexOf('ADM') === 0) cleaned = cleaned.substring(3);
  cleaned = cleaned.substring(0, 12);
  var parts = [];
  for (var i = 0; i < cleaned.length && i < 12; i += 4) {
    parts.push(cleaned.substring(i, i + 4));
  }
  // 检测前缀
  var prefix = '';
  if (input.toUpperCase().indexOf('BV3') === 0) prefix = 'BV3-';
  else if (input.toUpperCase().indexOf('BV9') === 0) prefix = 'BV9-';
  else if (input.toUpperCase().indexOf('ADM') === 0) prefix = 'ADM-';
  return prefix + parts.join('-');
}

// 激活码验证
function activateCode(input) {
  var code = formatActivationCode(input);
  if (code.length < 14) { return showToast('❌ 激活码格式不正确'); }
  if (window._track) window._track('upgradeClick');
  sha256Browser(code).then(function(hash) {
    // 检查管理码（硬编码，不走网络）
    if (ADMIN_HASHES[hash]) {
      var adminTier = ADMIN_HASHES[hash];
      appData.activation = { tier: adminTier, codeHash: hash, activatedAt: null, expires: null, _trialUsedBasic: (appData.activation||{})._trialUsedBasic||false, _trialUsedPro: (appData.activation||{})._trialUsedPro||false, _isTrial: false, _trialExpires: null, _trialStarted: null };
      saveData(appData);
      if (window._trialExpiryTimer) { clearInterval(window._trialExpiryTimer); window._trialExpiryTimer = null; }
      if (window._trialCountdownTimer) { clearInterval(window._trialCountdownTimer); window._trialCountdownTimer = null; }
      showActivationSuccess(TIER_NAMES[adminTier], null);
      return;
    }
    // 检查 codes.json
    fetch('./codes.json?t=' + Date.now())
      .then(function(r) { if (!r.ok) throw new Error('network'); return r.json(); })
      .then(function(codes) {
        var entry = codes[hash];
        if (!entry) { return showToast('❌ 无效的激活码'); }
        if (entry.status === 'revoked') { return showToast('❌ 此激活码已被撤销'); }
        // 调用后端检查激活次数（10次上限）
        apiPost('/activate', { codeHash: hash })
          .then(function(ar) {
            if (!ar.success) { showToast('❌ ' + (ar.error || '激活失败')); return; }
            var now = Date.now();
            var expires = now + 370 * 86400000; // ~1年
            appData.activation = { tier: entry.tier, codeHash: hash, activatedAt: now, expires: expires, _trialUsedBasic: (appData.activation||{})._trialUsedBasic||false, _trialUsedPro: (appData.activation||{})._trialUsedPro||false, _isTrial: false, _trialExpires: null, _trialStarted: null };
            saveData(appData);
            if (window._trialExpiryTimer) { clearInterval(window._trialExpiryTimer); window._trialExpiryTimer = null; }
            if (window._trialCountdownTimer) { clearInterval(window._trialCountdownTimer); window._trialCountdownTimer = null; }
            showActivationSuccess(TIER_NAMES[entry.tier], expires, ar.remaining, ar.maxUses);
          })
          .catch(function() { showToast('❌ 验证服务暂时不可用，请确保网络连接正常'); });
      })
      .catch(function() { showToast('❌ 验证服务暂时不可用，请确保网络连接正常'); });
  });
}

function showActivationSuccess(tierName, expires, remaining, maxUses) {
  var expiresStr = expires ? '到期：' + new Date(expires).toLocaleDateString('zh-CN') : '永久有效';
  var usesStr = (maxUses && maxUses < 999) ? '<div style="font-size:12px;color:var(--text-tertiary);margin-bottom:4px">此激活码还可使用 <b>' + remaining + '</b> / ' + maxUses + ' 次</div>' : '';
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:rgba(15,23,42,0.5);display:flex;align-items:center;justify-content:center;padding:16px';
  ov.addEventListener('click', function(e) { if (e.target === ov) { ov.remove(); switchTab('settings'); } });
  ov.innerHTML = '<div style="background:var(--bg-card);border-radius:16px;padding:30px;text-align:center;max-width:360px;width:100%">' +

    '<div style="font-size:13px;color:var(--text-tertiary);margin-bottom:4px">' + expiresStr + '</div>' +

  document.body.appendChild(ov);

// 试用
function startTrial(tier) {
  if (!appData.activation) appData.activation = { tier: 'free', codeHash: '', activatedAt: null, expires: null, _trialUsedBasic: false, _trialUsedPro: false, _isTrial: false, _trialExpires: null, _trialStarted: null };
  var act = appData.activation;
  var usedKey = tier === 'pro' ? '_trialUsedPro' : '_trialUsedBasic';
  if (act[usedKey]) { showToast('该版本已试用过，每版本仅可试用一次'); return; }
  if (act._isTrial) { showToast('试用已在进行中'); return; }
  if (act.tier && act.tier !== 'free') { showToast('您已是付费用户，无需试用'); return; }
  if (window._track) window._track('trialClick');
  var now = Date.now();
  act.tier = tier;
  act._isTrial = true;
  act[usedKey] = true;
  act._trialStarted = now;
  act._trialExpires = now + 20 * 60 * 1000;
  saveData(appData);
  renderSettings();
  showToast('🎁 试用已开启！' + TIER_NAMES[tier] + '，20分钟后自动恢复免费版');
}

// 检查激活到期
function checkActivationExpiry() {
  var act = appData.activation;
  if (!act || act.tier === 'free') return;
  if (act.expires && Date.now() > act.expires) {
    if (Date.now() - act.expires < 3 * 86400000) {
      // 3天宽限期，只提醒不锁定
    } else {
      appData.activation = { tier: 'free', codeHash: '', activatedAt: null, expires: null, _trialUsedBasic: (act||{})._trialUsedBasic||false, _trialUsedPro: (act||{})._trialUsedPro||false, _isTrial: false, _trialExpires: null, _trialStarted: null };
      saveData(appData);
      showToast('⏰ 你的版本已到期，已退回免费版。数据保留，重新激活即可恢复');
    }
  }
}

function checkExpiryWarning() {
  var act = appData.activation;
  if (!act || act.tier === 'free' || !act.expires) return '';
  var remaining = Math.ceil((act.expires - Date.now()) / 86400000);
  if (remaining <= 7 && remaining > 0) {
    return '<div style="margin-top:8px;padding:8px 12px;background:#fff3cd;border:1px solid #ffc107;border-radius:8px;font-size:12px;color:#856404">⏰ 你的版本将在 <b>' + remaining + '</b> 天后到期，到期后功能将退回免费版。<a href="#" onclick="event.preventDefault();document.getElementById(&#39;activateInput&#39;).focus()" style="color:var(--primary);font-weight:600">续费 →</a></div>';
  }
  if (remaining <= 0 && remaining > -3) {
    return '<div style="margin-top:8px;padding:8px 12px;background:#ffe0e0;border:1px solid #e74c3c;border-radius:8px;font-size:12px;color:#a33">🔴 宽限期还剩 <b>' + (3 + remaining) + '</b> 天，请尽快续费！</div>';
  }
  return '';
}

    if (!d.wrongBooks || typeof d.wrongBooks !== 'object') d.wrongBooks = {};
    // 校验每个题库的 cards 是数组，防止后续 .cards.length/.cards.forEach 崩溃
    if (d.banks) {
      for (const bid of Object.keys(d.banks)) {
        const b = d.banks[bid];
        if (!b || typeof b !== 'object') { delete d.banks[bid]; continue; }
        if (!Array.isArray(b.cards)) b.cards = [];
        // 校验每张卡是对象
        b.cards = b.cards.filter(function(c) { return c && typeof c === 'object'; });
      }
    }
    return Object.assign({ banks:{}, settings:{}, seqProgress:{}, favorites:{}, wrongBooks:{} }, d);
  }
  catch(e) {
    console.error('loadData error, using preset:', e);
    return getPresetData_7666();
  }
}

}

function countMasteredQuestions() {
  var mastered = 0, total = 0;
  var banks = Object.values(appData.banks || {});
  for (var i = 0; i < banks.length; i++) {
    var cards = banks[i].cards || [];
    total += cards.length;
    for (var j = 0; j < cards.length; j++) {
      if (cards[j].srStage >= 4) mastered++;
    }
  }
  return { mastered: mastered, total: total, unmastered: total - mastered };
}

function countTotalQuestions() {
  var total = 0;
  var banks = Object.values(appData.banks || {});
  for (var i = 0; i < banks.length; i++) {
    total += (banks[i].cards || []).length;
  }
  return total;
}

function getExamDaysLeft() {


  var examDate = (appData.settings || {}).examDate;
  if (!examDate) return null;
  var now = new Date();
  var exam = new Date(examDate + 'T00:00:00');
  var diff = Math.ceil((exam.getTime() - now.getTime()) / 86400000);
  return diff;
}

function getDailyTarget() {
  var s = appData.settings || {};
  if (s.dailyTarget && s.dailyTarget > 0) return s.dailyTarget;
  var daysLeft = getExamDaysLeft();
  if (daysLeft === null || daysLeft <= 0) return 0;
  var stats = countMasteredQuestions();
  if (stats.unmastered <= 0) return 0;
  return Math.max(1, Math.ceil(stats.unmastered / Math.max(1, daysLeft)));
}

function getISOWeek(dateStr) {
  var d = new Date(dateStr + 'T12:00:00');
  var dayNum = d.getDay() || 7;
  d.setDate(d.getDate() + 4 - dayNum);
  var yearStart = new Date(d.getFullYear(), 0, 1);
  var weekNum = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return d.getFullYear() + '-W' + (weekNum < 10 ? '0' : '') + weekNum;
}

function addToWeekStats(dateStr, duration, switches, totalCards, correctCards) {
  if (!appData.settings.weeklyStats) appData.settings.weeklyStats = {};
  var wk = getISOWeek(dateStr);
  if (!appData.settings.weeklyStats[wk]) appData.settings.weeklyStats[wk] = { duration: 0, switches: 0, cardsTotal: 0, cardsCorrect: 0, cardsWrong: 0, sessions: 0 };
  var ws = appData.settings.weeklyStats[wk];
  ws.duration += duration;
  ws.switches += switches;
  if (totalCards) ws.cardsTotal += totalCards;
  if (correctCards) ws.cardsCorrect += correctCards;
  ws.cardsWrong = ws.cardsTotal - ws.cardsCorrect;
  ws.sessions = (ws.sessions || 0) + 1;
}

function getWeekStart(date) {
  var d = new Date(date);
  var day = d.getDay();
  var diff = d.getDate() - day + (day === 0 ? -6 : 1); // 周一为一周开始
  var monday = new Date(d.setDate(diff));
  monday.setHours(0, 0, 0, 0);
  return monday;
}

function fmtDuration(seconds) {
  if (!seconds || seconds < 0) seconds = 0;
  if (seconds < 60) return seconds + '秒';
  var mins = Math.floor(seconds / 60);
  if (mins < 60) return mins + '分钟';
  var hrs = Math.floor(mins / 60);
  var remainMin = mins % 60;
  return remainMin > 0 ? hrs + '小时' + remainMin + '分钟' : hrs + '小时';
}

// ====== 图片压缩 ======
var _cmPendingImage = ''; // 待发送的图片 base64（原图）
var _cmPendingThumb = ''; // 待发送的缩略图 base64

function compressImage(file, callback) {
  // callback(fullImageBase64, thumbnailBase64)
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var w = img.width, h = img.height;
      // === 原图：限制最大分辨率 2400px，高质量 ===
      var maxDim = 2400;
      var fw = w, fh = h;
      if (fw > maxDim || fh > maxDim) {
        var ratio = Math.min(maxDim / fw, maxDim / fh);
        fw = Math.round(fw * ratio); fh = Math.round(fh * ratio);
      }
      var canvas = document.createElement('canvas');
      canvas.width = fw; canvas.height = fh;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, fw, fh);
      var quality = 0.85;
      var full = canvas.toDataURL('image/jpeg', quality);
      while (full.length > 5000000 && quality > 0.3) {
        quality -= 0.1;
        full = canvas.toDataURL('image/jpeg', quality);
      }
      if (full.length > 5000000) {
        showToast('⚠️ 图片太大，请选择更小的图片');
        callback('', '');
        return;
      }

      // === 缩略图：250px 宽，低质量，用于列表展示 ===
      var tw = 250, th = Math.round(h * (250 / w));
      if (tw > fw) { tw = fw; th = fh; } // 如果原图已经很小就不用缩略图
      var tCanvas = document.createElement('canvas');
      tCanvas.width = tw; tCanvas.height = th;
      var tCtx = tCanvas.getContext('2d');
      tCtx.drawImage(img, 0, 0, tw, th);
      var thumb = tCanvas.toDataURL('image/jpeg', 0.5);

      callback(full, thumb);
    };
    img.onerror = function() { showToast('⚠️ 图片加载失败'); callback('', ''); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function handleCmImage(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  // 只允许图片类型
  if (file.type.indexOf('image/') !== 0) {
    showToast('⚠️ 请选择图片文件');
    input.value = '';
    return;
  }
  var nameEl = document.getElementById('cmImageName');
  if (nameEl) nameEl.textContent = '压缩中...';
  compressImage(file, function(full, thumb) {
    if (!full) {
      if (nameEl) nameEl.textContent = '';
      input.value = '';
      return;
    }
    _cmPendingImage = full;
    _cmPendingThumb = thumb;
    if (nameEl) nameEl.textContent = file.name + ' (' + Math.round(full.length / 1024) + 'KB)';
    // 显示预览（用缩略图）
    var preview = document.getElementById('cmImagePreview');
    var previewImg = document.getElementById('cmImagePreviewImg');
    var clearBtn = document.getElementById('cmImageClear');
    if (preview && previewImg) {
      previewImg.src = thumb || full;
      preview.style.display = 'block';
    }
    if (clearBtn) clearBtn.style.display = 'inline-flex';
  });
}

var _cmGalleryIdx = 0;
var _cmGalleryOverlay = null;
var _cmTouchStartX = 0;
var _cmGalleryScale = 1;
var _cmGalleryStartDist = 0;
var _cmGalleryStartScale = 1;
var _cmTouchCount = 0;

function getTouchDist(touches) {
  var dx = touches[0].clientX - touches[1].clientX;
  var dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function showCmGalleryDetail(idx) {
  _cmGalleryIdx = idx;
  _cmGalleryScale = 1;
  _cmGalleryStartDist = 0;
  _cmGalleryStartScale = 1;
  var d = _cmGalleryData[idx];
  if (!d) return;

  if (_cmGalleryOverlay) { _cmGalleryOverlay.remove(); }

  var ov = document.createElement('div');
  var isDark = document.documentElement.classList.contains('dark');
  var ovBg = isDark ? 'rgba(0,0,0,0.95)' : 'rgba(0,0,0,0.85)';
  ov.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:' + ovBg + ';z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;touch-action:none';
  ov.id = 'cmGalleryOverlay';
  _cmGalleryOverlay = ov;

  renderGalleryContent(ov, idx);
  ov.addEventListener('click', function(e) { if (e.target === ov) closeCmGallery(); });

  // 触屏：区分单指滑动导航 vs 双指缩放
  ov.addEventListener('touchstart', function(e) {
    _cmTouchCount = e.touches.length;
    if (e.touches.length === 2) {
      _cmGalleryStartDist = getTouchDist(e.touches);
      _cmGalleryStartScale = _cmGalleryScale;
    } else if (e.touches.length === 1) {
      _cmTouchStartX = e.touches[0].clientX;
    }
  }, {passive: true});

  ov.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2 && _cmGalleryStartDist > 0) {
      var newDist = getTouchDist(e.touches);
      var newScale = _cmGalleryStartScale * (newDist / _cmGalleryStartDist);
      newScale = Math.max(0.5, Math.min(5, newScale));
      _cmGalleryScale = newScale;
      applyGalleryZoom();
    }
  }, {passive: true});

  ov.addEventListener('touchend', function(e) {
    if (_cmTouchCount === 1) {
      var dx = e.changedTouches[0].clientX - _cmTouchStartX;
      if (Math.abs(dx) > 60 && _cmGalleryScale <= 1.01) {
        if (dx < 0 && _cmGalleryIdx < _cmGalleryData.length - 1) navigateGallery(1);
        else if (dx > 0 && _cmGalleryIdx > 0) navigateGallery(-1);
      }
    }
    if (e.touches.length < 2) { _cmGalleryStartDist = 0; }
    _cmTouchCount = e.touches.length;
  });

  ov.setAttribute('tabindex', '0');
  ov.focus();
  ov.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' && _cmGalleryIdx < _cmGalleryData.length - 1) navigateGallery(1);
    if (e.key === 'ArrowLeft' && _cmGalleryIdx > 0) navigateGallery(-1);
    if (e.key === 'Escape') closeCmGallery();
  });

  document.body.appendChild(ov);
}

function applyGalleryZoom() {
  var img = document.getElementById('cmGalleryImg');
  if (img) {
    img.style.transform = 'scale(' + _cmGalleryScale + ')';
    img.style.transition = 'none';
  }
}

function renderGalleryContent(ov, idx) {
  var d = _cmGalleryData[idx];
  var total = _cmGalleryData.length;
  var hasPrev = idx > 0;
  var hasNext = idx < total - 1;

  var html = '<div style="max-width:520px;width:100%;max-height:90vh;overflow-y:auto;background:var(--bg-card);border-radius:16px;padding:20px;cursor:default;position:relative" onclick="event.stopPropagation()">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
      '<span style="font-size:12px;color:var(--text-tertiary)">' + (idx + 1) + ' / ' + total + (d.image ? ' 🔍双击图片缩放' : '') + '</span>' +
      '<button onclick="closeCmGallery()" style="background:rgba(0,0,0,0.4);border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px 10px;border-radius:20px;line-height:1">✕</button>' +
    '</div>' +
    '<div style="position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:10px">' +
      (hasPrev ? '<button onclick="navigateGallery(-1)" style="position:absolute;left:4px;z-index:2;background:rgba(0,0,0,0.5);color:#fff;border:none;font-size:28px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">‹</button>' : '') +
      '<img id="cmGalleryImg" src="' + d.image + '" style="width:100%;max-height:55vh;object-fit:contain;border-radius:10px;transform:scale(1);transform-origin:center center;transition:transform 0.15s ease-out;cursor:zoom-in" ondblclick="toggleGalleryZoom()">' +
      (hasNext ? '<button onclick="navigateGallery(1)" style="position:absolute;right:4px;z-index:2;background:rgba(0,0,0,0.5);color:#fff;border:none;font-size:28px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">›</button>' : '') +
    '</div>' +
    '<div style="font-weight:600;font-size:16px;margin-top:12px;color:var(--text)">' + escapeHtml(d.nickname) + '</div>' +
    '<div style="font-size:12px;color:var(--text-tertiary);margin-top:2px">' + escapeHtml(d.date) + '</div>' +
    '<div style="font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-word;margin-top:6px">' + escapeHtml(d.text) + '</div>' +
    '<button onclick="closeCmGallery()" style="margin-top:12px;width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px;cursor:pointer">关闭</button>' +
  '</div>';

  ov.innerHTML = html;
}

function toggleGalleryZoom() {
  if (_cmGalleryScale < 1.05) {
    _cmGalleryScale = 2.5;
  } else {
    _cmGalleryScale = 1;
  }
  _cmGalleryStartScale = _cmGalleryScale;
  _cmGalleryStartDist = 0;
  var img = document.getElementById('cmGalleryImg');
  if (img) {
    img.style.transform = 'scale(' + _cmGalleryScale + ')';
    img.style.transition = 'transform 0.2s ease-out';
    img.style.cursor = _cmGalleryScale > 1.5 ? 'zoom-out' : 'zoom-in';
  }
}

function navigateGallery(delta) {
  var newIdx = _cmGalleryIdx + delta;
  if (newIdx < 0 || newIdx >= _cmGalleryData.length) return;
  _cmGalleryIdx = newIdx;
  _cmGalleryScale = 1;
  _cmGalleryStartDist = 0;
  _cmGalleryStartScale = 1;
  if (_cmGalleryOverlay) renderGalleryContent(_cmGalleryOverlay, newIdx);
}

function closeCmGallery() {
  if (_cmGalleryOverlay) { _cmGalleryOverlay.remove(); _cmGalleryOverlay = null; }
  _cmGalleryIdx = 0;
  _cmGalleryScale = 1;
  _cmGalleryStartDist = 0;
  _cmGalleryStartScale = 1;
}

function resetAndReload() {
  _cmPage = 1;
  _cmHasMore = true;
  _cmAllMessages = [];
  _cmGalleryData = [];
  loadCommunityMessages(true);
}

function loadCommunityMessages(reset) {
  if (_cmLoadingMore) return;
  var listEl = document.getElementById('cmList');
  var pagerEl = document.getElementById('cmPager');
  if (!listEl) return;

  if (reset) {
    _cmAllMessages = [];
    _cmGalleryData = [];
    listEl.innerHTML = '<div style="padding:20px;color:var(--text-tertiary)">加载中...</div>';
    pagerEl.innerHTML = '';
  }
  _cmLoadingMore = true;

  apiGet('/messages?page=' + _cmPage + '&limit=15&sort=' + _cmSortBy)
    .then(function(r) {
      _cmLoadingMore = false;
      var msgs = r.messages || [];
      if (msgs.length < 15) _cmHasMore = false;

      // 累积消息
      for (var i = 0; i < msgs.length; i++) {
        _cmAllMessages.push(msgs[i]);
      }

      // 首次加载后设置无限滚动
      if (_cmPage === 1 && _cmHasMore) setupCmSentinel();

      _cmPage++;
      filterAndRender();
    })
    .catch(function(e) {
      _cmLoadingMore = false;
      if (_cmAllMessages.length === 0) {
        listEl.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-tertiary)">⚠️ 加载失败，请检查网络后重试<br><button onclick="resetAndReload()" style="margin-top:8px;padding:6px 16px;border:1px solid var(--primary);color:var(--primary);background:none;border-radius:20px;cursor:pointer;font-size:13px">重新加载</button></div>';
      }
    });
}

function setupCmSentinel() {
  var pagerEl = document.getElementById('cmPager');
  if (!pagerEl) return;
  pagerEl.innerHTML = '<div id="cmSentinel" style="height:20px"></div>';
  pagerEl.style.display = 'block';
  var sentinel = document.getElementById('cmSentinel');
  if (!sentinel) return;
  var observer = new IntersectionObserver(function(entries) {
    if (entries[0].isIntersecting && _cmHasMore && !_cmLoadingMore) {
      loadCommunityMessages(false);
    }
  }, { root: null, threshold: 0.1 });
  observer.observe(sentinel);
}

function filterAndRender() {
  var listEl = document.getElementById('cmList');
  var pagerEl = document.getElementById('cmPager');
  if (!listEl) return;

  var msgs = _cmAllMessages.slice();

  // 搜索过滤
  if (_cmSearchQuery.trim()) {
    var q = _cmSearchQuery.trim().toLowerCase();
    msgs = msgs.filter(function(m) {
      return (m.nickname && m.nickname.toLowerCase().indexOf(q) !== -1) ||
             (m.text && m.text.toLowerCase().indexOf(q) !== -1);
    });
  }

  // 类型过滤
  if (_cmFilter === 'images') {
    msgs = msgs.filter(function(m) { return m.image && m.image.length > 0; });
  } else if (_cmFilter === 'text') {
    msgs = msgs.filter(function(m) { return !m.image || m.image.length === 0; });
  }

  if (msgs.length === 0) {
    var emptyMsg;
    if (_cmSearchQuery.trim()) emptyMsg = '🔍 没有找到匹配的留言';
    else if (_cmFilter === 'images') emptyMsg = '📷 还没有带图片的留言';
    else if (_cmFilter === 'text') emptyMsg = '📝 还没有纯文字留言';
    else emptyMsg = '✨ 还没有留言，来做第一个分享的人吧！';
    listEl.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-tertiary)">' + emptyMsg + '</div>';
    if (pagerEl) pagerEl.innerHTML = '';
    return;
  }

  var codeHash = (appData.activation && appData.activation.codeHash) || '';
  var myPrefix = codeHash ? codeHash.substring(0, 8) : '';

  var html = '';

  // === 画廊视图 ===
  if (_cmViewMode === 'gallery') {
    _cmGalleryData = [];
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">共 ' + msgs.length + ' 张</div>';
    html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">';
    for (var g = 0; g < msgs.length; g++) {
      var gm = msgs[g];
      var gIdx = _cmGalleryData.length;
      _cmGalleryData.push({
        nickname: gm.nickname || '匿名',
        text: gm.text,
        image: gm.image,
        date: (gm.createdAt || '').substring(0, 10)
      });
      html += '<div style="position:relative;aspect-ratio:1;overflow:hidden;border-radius:10px;border:1px solid var(--border);cursor:pointer;background:var(--bg-card)" onclick="showCmGalleryDetail(' + gIdx + ')">' +
        '<img src="' + (gm.thumbnail || gm.image) + '" loading="lazy" style="width:100%;height:100%;object-fit:cover">' +
      '</div>';
    }
    html += '</div>';
  } else {
    // === 列表视图 ===
    for (var i = 0; i < msgs.length; i++) {
      var m = msgs[i];
      var tierBadge = m.tier === 'pro' ? '<span style="font-size:10px;background:#7C3AED;color:#fff;padding:1px 6px;border-radius:8px;margin-left:6px">Pro</span>' : '';
      var timeStr = m.createdAt ? m.createdAt.substring(0, 10) : '';
      var isMine = myPrefix && m.codeHashPrefix === myPrefix;
      var liked = isCmMsgLiked(m.id);
      var isPinned = m.pinnedUntil && new Date(m.pinnedUntil) > new Date();

      html += '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px' + (isPinned ? ';border-color:var(--warning);box-shadow:0 0 0 1px var(--warning)' : '') + '">' +
        (isPinned ? '<div style="font-size:11px;color:var(--warning);margin-bottom:4px;font-weight:600">📌 已置顶</div>' : '') +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
          '<span style="font-weight:600;font-size:14px;color:var(--text)">' + escapeHtml(m.nickname || '匿名') + tierBadge + '</span>' +
          '<span style="font-size:11px;color:var(--text-tertiary)">' + timeStr + '</span>' +
        '</div>' +
        '<div style="font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-word">' + escapeHtml(m.text) + '</div>' +
        (m.image ? '<div style="margin-top:8px"><img src="' + (m.thumbnail || m.image) + '" loading="lazy" data-full="' + m.image + '" onclick="showFullImage(this.getAttribute(\'data-full\'))" style="max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--border);cursor:pointer;object-fit:cover"></div>' : '') +
        // 操作栏
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">' +
          '<div style="display:flex;gap:4px;align-items:center">' +
            '<button onclick="handleCmLike(' + m.id + ',this)" style="background:none;border:none;font-size:12px;color:' + (liked ? '#EF4444' : 'var(--text-tertiary)') + ';cursor:pointer;padding:2px 6px;min-height:30px">' + (liked ? '❤️' : '🤍') + ' <span>' + (m.likes || 0) + '</span></button>' +
            '<button onclick="toggleCmReply(' + m.id + ')" style="background:none;border:none;font-size:12px;color:var(--text-tertiary);cursor:pointer;padding:2px 6px;min-height:30px">💬 回复</button>' +
          '</div>' +
          '<div style="display:flex;gap:2px">' +
            (isMine ? '<button onclick="pinCmMessage(' + m.id + ',this)" style="background:none;border:none;font-size:12px;color:' + (isPinned ? 'var(--warning)' : 'var(--text-tertiary)') + ';cursor:pointer;padding:2px 6px;min-height:30px" title="' + (isPinned ? '已置顶' : '置顶(2🍅)') + '">📌</button>' : '') +
            (isMine ? '<button onclick="handleCmDelete(' + m.id + ',this)" style="background:none;border:none;font-size:11px;color:var(--text-tertiary);cursor:pointer;padding:2px 6px;min-height:30px">🗑</button>' : '') +
            '<button onclick="reportMessage(' + m.id + ',this)" style="background:none;border:none;font-size:12px;color:' + (isCmMsgReported(m.id) ? '#EF4444' : 'var(--text-tertiary)') + ';cursor:pointer;padding:2px 6px;min-height:30px" title="' + (isCmMsgReported(m.id) ? '取消举报' : '举报') + '">' + (isCmMsgReported(m.id) ? '🚩' : '🚩') + '</button>' +
          '</div>' +
        '</div>' +
        // 回复区域（默认隐藏）
        '<div id="cmReplyArea_' + m.id + '" style="display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">' +
          '<div id="cmReplies_' + m.id + '" style="margin-bottom:6px"></div>' +
          '<div style="display:flex;flex-direction:column;gap:6px">' +
            '<input id="cmReplyNick_' + m.id + '" placeholder="昵称（选填）" maxlength="20" style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;min-height:36px;box-sizing:border-box">' +
            '<textarea id="cmReplyText_' + m.id + '" placeholder="回复内容（最多200字）" maxlength="200" style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;min-height:60px;resize:vertical;box-sizing:border-box;font-family:inherit"></textarea>' +
            '<button onclick="sendCmReply(' + m.id + ')" style="background:var(--primary);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;white-space:nowrap;min-height:36px;align-self:flex-end">发送回复</button>' +
          '</div>' +
          '<button onclick="loadCmReplies(' + m.id + ')" style="background:none;border:none;font-size:11px;color:var(--primary);cursor:pointer;padding:4px 0;margin-top:4px">查看回复</button>' +
        '</div>' +
      '</div>';
    }
  }
  listEl.innerHTML = html;

  // 加载更多指示器
  if (_cmHasMore && _cmViewMode !== 'gallery') {
    if (pagerEl) { pagerEl.innerHTML = '<div id="cmSentinel" style="height:20px;text-align:center;padding:10px;color:var(--text-tertiary);font-size:12px">加载更多...</div>'; pagerEl.style.display = 'block'; }
    var sentinel = document.getElementById('cmSentinel');
    if (sentinel) {
      var observer = new IntersectionObserver(function(entries) {
        if (entries[0].isIntersecting && _cmHasMore && !_cmLoadingMore) {
          loadCommunityMessages(false);
        }
      }, { root: null, threshold: 0.1 });
      observer.observe(sentinel);
    }
  } else if (!_cmHasMore && _cmAllMessages.length > 0) {
    if (pagerEl) { pagerEl.innerHTML = '<div style="text-align:center;padding:8px;color:var(--text-tertiary);font-size:12px">— 已加载全部 —</div>'; pagerEl.style.display = 'block'; }
  }
}

// 点赞（localStorage防重复）
function isCmMsgLiked(msgId) {
  try {
    var liked = JSON.parse(localStorage.getItem('cm_liked_ids') || '[]');
    return liked.indexOf(msgId) !== -1;
  } catch(e) { return false; }
}
function handleCmLike(msgId, btn) {
  if (btn.disabled) return;
  if (isCmMsgLiked(msgId)) { showToast('已经点过赞了 ❤️'); return; }
  btn.disabled = true;
  apiPost('/messages/' + msgId + '/like', { codeHash: (appData.activation && appData.activation.codeHash) || '' })
    .then(function(r) {
      if (r.success) {
        try {
          var liked = JSON.parse(localStorage.getItem('cm_liked_ids') || '[]');
          liked.push(msgId);
          localStorage.setItem('cm_liked_ids', JSON.stringify(liked));
        } catch(e) {}
        // 更新显示
        var span = btn.querySelector('span');
        if (span) span.textContent = r.likes || 0;
        btn.style.color = '#EF4444';
        btn.innerHTML = '❤️ <span>' + (r.likes || 0) + '</span>';
      } else {
        showToast('点赞失败，请稍后重试');
      }
    }).catch(function() { showToast('网络错误'); })
    .finally(function() { btn.disabled = false; });
}
function handleCmDelete(msgId, btn) {
  if (!confirm('确定删除这条留言吗？')) return;
  if (btn.disabled) return;
  btn.disabled = true;
  apiPost('/messages/' + msgId + '/delete', { codeHash: (appData.activation && appData.activation.codeHash) || '' })
    .then(function(r) {
      if (r.success) {
        showToast('已删除');
        _cmAllMessages = _cmAllMessages.filter(function(m) { return m.id !== msgId; });
        filterAndRender();
      } else {
        showToast(r.error || '删除失败');
        btn.disabled = false;
      }
    }).catch(function() { showToast('网络错误'); btn.disabled = false; });
}

function pinCmMessage(msgId, btn) {
  var isPinned = false;
  var msg = _cmAllMessages.find(function(m) { return m.id === msgId; });
  if (msg && msg.pinnedUntil && new Date(msg.pinnedUntil) > new Date()) isPinned = true;
  if (isPinned) { showToast('已置顶，无需重复操作'); return; }
  if (!spendTomatoes(9, '置顶消息24h')) { showToast('🍅 番茄不足！需要9🍅'); return; }
  if (btn) btn.disabled = true;
  apiPost('/messages/' + msgId + '/pin', { codeHash: (appData.activation && appData.activation.codeHash) || '' })
    .then(function(r) {
      if (r.success) {
        showToast('📌 已置顶，24小时内有效！');
        // 更新本地缓存
        if (msg) msg.pinnedUntil = r.pinnedUntil;
        filterAndRender();
      } else {
        showToast(r.error || '置顶失败');
        if (btn) btn.disabled = false;
      }
    }).catch(function() { showToast('网络错误'); if (btn) btn.disabled = false; });
}

// ==== 回复功能 ====
function toggleCmReply(msgId) {
  var area = document.getElementById('cmReplyArea_' + msgId);
  if (!area) return;
  if (area.style.display === 'none' || !area.style.display) {
    area.style.display = 'block';
    loadCmReplies(msgId);
  } else {
    area.style.display = 'none';
  }
}
function sendCmReply(parentId) {
  var nickEl = document.getElementById('cmReplyNick_' + parentId);
  var textEl = document.getElementById('cmReplyText_' + parentId);
  var nickname = nickEl ? nickEl.value.trim() : '';
  var text = textEl ? textEl.value.trim() : '';
  if (!text) { showToast('请输入回复内容'); return; }
  var codeHash = (appData.activation && appData.activation.codeHash) || '';
  apiPost('/messages', {
    codeHash: codeHash,
    nickname: nickname || '同行者',
    text: text,
    parentId: parentId
  }).then(function(r) {
    if (r.success) {
      showToast('回复成功');
      if (textEl) textEl.value = '';
      loadCmReplies(parentId);
    } else {
      showToast(r.error || '回复失败');
    }
  }).catch(function() { showToast('网络错误'); });
}
function loadCmReplies(msgId) {
  var container = document.getElementById('cmReplies_' + msgId);
  if (!container) return;
  container.innerHTML = '<span style="font-size:11px;color:var(--text-tertiary)">加载中...</span>';
  apiGet('/messages/' + msgId + '/replies')
    .then(function(r) {
      var replies = r.replies || [];
      if (replies.length === 0) {
        container.innerHTML = '<span style="font-size:11px;color:var(--text-tertiary)">暂无回复</span>';
        return;
      }
      var html = '';
      for (var i = 0; i < replies.length; i++) {
        var rp = replies[i];
        var rTime = rp.createdAt ? rp.createdAt.substring(0, 10) : '';
        html += '<div style="background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:4px;margin-left:8px;border-left:2px solid var(--primary)">' +
          '<div style="display:flex;justify-content:space-between;margin-bottom:2px">' +
            '<span style="font-weight:600;font-size:12px;color:var(--text)">' + escapeHtml(rp.nickname || '匿名') + '</span>' +
            '<span style="font-size:10px;color:var(--text-tertiary)">' + rTime + '</span>' +
          '</div>' +
          '<div style="font-size:13px;line-height:1.5;color:var(--text);white-space:pre-wrap;word-break:break-word">' + escapeHtml(rp.text) + '</div>' +
        '</div>';
      }
      container.innerHTML = html;
    })
    .catch(function() { container.innerHTML = '<span style="font-size:11px;color:var(--text-tertiary)">加载回复失败</span>'; });
}

function sendCommunityMessage() {
  var nickname = document.getElementById('cmNickname').value.trim();
  var text = document.getElementById('cmText').value.trim();
  var btn = document.getElementById('cmSendBtn');

  if (!text) { showToast('请输入留言内容'); return; }
  if (text.length > 500) { showToast('留言不能超过500字'); return; }

  btn.disabled = true;
  btn.textContent = '发布中...';

  var codeHash = (appData.activation && appData.activation.codeHash) || '';

  var image = _cmPendingImage || '';
  var thumb = _cmPendingThumb || '';

  apiPost('/messages', {
    codeHash: codeHash,
    nickname: nickname || '同行者',
    text: text,
    image: image,
    thumbnail: thumb
  }).then(function(r) {
    if (r.success) {
      showToast('✅ 发布成功！');
      document.getElementById('cmText').value = '';
      // 清除图片
      _cmPendingImage = '';
      _cmPendingThumb = '';
      var inp = document.getElementById('cmImageInput'); if (inp) inp.value = '';
      var nameEl = document.getElementById('cmImageName'); if (nameEl) nameEl.textContent = '';
      var preview = document.getElementById('cmImagePreview'); if (preview) preview.style.display = 'none';
      var clearBtn = document.getElementById('cmImageClear'); if (clearBtn) clearBtn.style.display = 'none';
      resetAndReload();
    } else {
      showToast('❌ ' + (r.error || '发布失败'));
    }
  }).catch(function(e) {
    showToast('❌ 网络错误，请稍后重试');
  }).finally(function() {
    btn.disabled = false;
    btn.textContent = '发布';
  });
}

function reportMessage(msgId, btnEl) {
  if (btnEl.disabled) return;
  var reported = JSON.parse(localStorage.getItem('cm_reported_ids') || '[]');
  var already = reported.indexOf(msgId) !== -1;
  var codeHash = (appData.activation && appData.activation.codeHash) || '';

  if (already) {
    // 取消举报
    btnEl.disabled = true;
    apiPost('/messages/' + msgId + '/unreport', { codeHash: codeHash })
      .then(function(r) {
        if (r.success) {
          var arr = JSON.parse(localStorage.getItem('cm_reported_ids') || '[]');
          var idx = arr.indexOf(msgId);
          if (idx !== -1) arr.splice(idx, 1);
          localStorage.setItem('cm_reported_ids', JSON.stringify(arr));
          showToast('已取消举报');
          filterAndRender();
        } else {
          btnEl.disabled = false;
        }
      }).catch(function() { btnEl.disabled = false; });
  } else {
    // 举报
    btnEl.disabled = true;
    apiPost('/messages/' + msgId + '/report', { codeHash: codeHash, reason: '用户举报' })
      .then(function(r) {
        if (r.success) {
          var arr = JSON.parse(localStorage.getItem('cm_reported_ids') || '[]');
          if (arr.indexOf(msgId) === -1) arr.push(msgId);
          localStorage.setItem('cm_reported_ids', JSON.stringify(arr));
          showToast(r.reported >= 3 ? '已举报，该留言已被系统自动屏蔽' : '已举报（累计' + r.reported + '次，满3次自动删除）');
          filterAndRender();
        } else {
          btnEl.disabled = false;
        }
      }).catch(function() { btnEl.disabled = false; });
  }
}

function isCmMsgReported(msgId) {
  var reported = JSON.parse(localStorage.getItem('cm_reported_ids') || '[]');
  return reported.indexOf(msgId) !== -1;
}

var _fbHasMore = true;
var _fbLoadingMore = false;
var _fbAllItems = [];

      '</select>' +
      '<textarea id="fbText" placeholder="写下你想对开发者说的话...（最多1000字）" maxlength="1000" style="width:100%;min-height:100px;padding:8px 12px;border:2px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;resize:vertical;font-family:inherit;line-height:1.6;box-sizing:border-box"></textarea>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">' +
        '<span style="font-size:11px;color:var(--text-tertiary)">今日还可发 <b>3</b> 条</span>' +
        '<button id="fbSendBtn" onclick="sendFeedback()" style="background:var(--primary);color:#fff;border:none;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;min-height:40px">发布</button>' +
      '</div>' +
    '</div>' +
    // 反馈列表
    '<div id="fbList" style="min-height:100px;text-align:center;color:var(--text-tertiary);padding:20px">加载中...</div>' +
    '<div id="fbPager" style="display:none;text-align:center;margin-top:12px"></div>' +
  '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
  loadFeedback(true);
}

function loadFeedback(reset) {
  if (_fbLoadingMore) return;
  var listEl = document.getElementById('fbList');
  var pagerEl = document.getElementById('fbPager');
  if (!listEl) return;
  if (reset) { _fbAllItems = []; listEl.innerHTML = '<div style="padding:20px;color:var(--text-tertiary)">加载中...</div>'; if(pagerEl)pagerEl.innerHTML=''; }
  _fbLoadingMore = true;
  apiGet('/feedback?page=' + _fbPage + '&limit=15')
    .then(function(r) {
      _fbLoadingMore = false;
      var items = r.feedbacks || [];
      if (items.length < 15) _fbHasMore = false;
      for (var i = 0; i < items.length; i++) { _fbAllItems.push(items[i]); }
      if (_fbPage === 1 && _fbHasMore) setupFbSentinel();
      _fbPage++;
      renderFbList();
    })
    .catch(function() {
      _fbLoadingMore = false;
      if (_fbAllItems.length === 0) {
        listEl.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-tertiary)">⚠️ 加载失败，请检查网络后重试<br><button onclick="loadFeedback(true)" style="margin-top:8px;padding:6px 16px;border:1px solid var(--primary);color:var(--primary);background:none;border-radius:20px;cursor:pointer;font-size:13px">重新加载</button></div>';
      }
    });
}

function setupFbSentinel() {
  var pagerEl = document.getElementById('fbPager');
  if (!pagerEl) return;
  pagerEl.innerHTML = '<div id="fbSentinel" style="height:20px"></div>';
  pagerEl.style.display = 'block';
  var sentinel = document.getElementById('fbSentinel');
  if (!sentinel) return;
  var observer = new IntersectionObserver(function(entries) {
    if (entries[0].isIntersecting && _fbHasMore && !_fbLoadingMore) { loadFeedback(false); }
  }, { root: null, threshold: 0.1 });
  observer.observe(sentinel);
}

        '<span style="font-size:11px;color:var(--text-tertiary)">' + timeStr + '</span>' +
      '</div>' +
      '<div style="font-size:14px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word">' + escapeHtml(f.text) + '</div>' +

      '<div style="display:flex;justify-content:flex-end;gap:6px;margin-top:6px" onclick="event.stopPropagation()">' +

function sendFeedback() {
  var nickname = (document.getElementById('fbNickname')||{}).value||'';
  var type = (document.getElementById('fbType')||{}).value||'建议';
  var text = (document.getElementById('fbText')||{}).value||'';

  if (!text.trim()) { showToast('请输入反馈内容'); return; }
  if (btn) btn.disabled = true;
  var codeHash = (appData.activation && appData.activation.codeHash) || '';
  apiPost('/feedback', { codeHash: codeHash, nickname: nickname, text: text, type: type })
    .then(function(r) {
      if (r.error) { showToast(r.error); if(btn)btn.disabled=false; return; }
      showToast('✅ 反馈已发送，谢谢！');
      var ta = document.getElementById('fbText'); if(ta)ta.value='';
      if(btn)btn.disabled=false;
      _fbPage=1; _fbHasMore=true; _fbAllItems=[];
      loadFeedback(true);

  apiPost('/feedback/' + fbId + '/reply', { codeHash: codeHash, nickname: nickname, text: text })

  var codeHash = (appData.activation && appData.activation.codeHash) || '';
  return codeHash && f.codeHashPrefix === codeHash.substring(0, 8);

function isFbReported(fbId) {
  var reported = JSON.parse(localStorage.getItem('fb_reported_ids') || '[]');
  return reported.indexOf(fbId) !== -1;
}

function reportFbItem(fbId) {
  var codeHash = (appData.activation && appData.activation.codeHash) || '';
  apiPost('/feedback/' + fbId + '/report', { codeHash: codeHash })
    .then(function(r) {

  var codeHash = (appData.activation && appData.activation.codeHash) || '';

    .then(function(r) {

// ====== IndexedDB ======
function openZiliaoDB() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open('ziliao_db', 1);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('notes')) {
        db.createObjectStore('notes', { keyPath: 'id', autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('photos')) {
        db.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = function(e) { resolve(e.target.result); };
    req.onerror = function() { reject(req.error); };
  });
}

function dbPut(storeName, data) {
  return openZiliaoDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).put(data);
      tx.oncomplete = function() { db.close(); resolve(); };
      tx.onerror = function() { db.close(); reject(tx.error); };
    });
  });
}

function dbGetAll(storeName) {
  return openZiliaoDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(storeName, 'readonly');
      var req = tx.objectStore(storeName).getAll();
      req.onsuccess = function() { db.close(); resolve(req.result || []); };
      req.onerror = function() { db.close(); reject(req.error); };
    });
  });
}

function dbDelete(storeName, id) {
  return openZiliaoDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).delete(id);
      tx.oncomplete = function() { db.close(); resolve(); };
      tx.onerror = function() { db.close(); reject(tx.error); };
    });
  });
}

function dbClearBank(storeName, bankId) {
  return openZiliaoDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(storeName, 'readwrite');
      var store = tx.objectStore(storeName);
      var req = store.getAll();
      req.onsuccess = function() {
        var all = req.result || [];
        var toDelete = all.filter(function(r) { return r.bankId === bankId; });
        var deleted = 0;
        toDelete.forEach(function(r) { store.delete(r.id); deleted++; });
        tx.oncomplete = function() { db.close(); resolve(deleted); };
        tx.onerror = function() { db.close(); reject(tx.error); };
      };
      req.onerror = function() { db.close(); reject(req.error); };
    });
  });
}

        '<span style="font-size:10px;color:var(--text-tertiary)">🖐 可拖拽 · 🔍 双指缩放 · 👆 点击折叠</span>' +
      '</div>' +
    '</div>';

    setTimeout(function() { loadMarkmap(); }, 100);
  } else {
    html += '<textarea id="zlNoteEditor" placeholder="写笔记...&#10;&#10;支持 Markdown 语法：&#10;# 一级标题&#10;## 二级标题&#10;- 列表项&#10;1. 编号列表&#10;**加粗** *斜体*" oninput="_zlNoteContent=this.value" style="width:100%;min-height:300px;padding:14px;border:2px solid var(--border);border-radius:10px;background:var(--bg-card);color:var(--text);font-size:14px;line-height:1.7;resize:vertical;box-sizing:border-box;font-family:inherit">' + escapeHtml(_zlNoteContent) + '</textarea>';
  }

  html += '<div style="display:flex;gap:10px;margin-top:10px">' +
    '<button onclick="saveCurrentNote()" style="flex:1;background:var(--primary);color:#fff;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px">💾 保存笔记</button>' +
    '<button onclick="renderNoteList()" style="padding:12px 20px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text-secondary);font-size:14px;cursor:pointer;min-height:44px">取消</button>' +
  '</div>';

  area.innerHTML = html;
}

function saveCurrentNote() {
  var title = (_zlNoteTitle || '').trim();
  var content = (_zlNoteContent || '').trim();
  // 从 textarea 同步最新内容
  var ta = document.getElementById('zlNoteEditor');
  if (ta) { content = ta.value.trim(); _zlNoteContent = content; }
  var ti = document.getElementById('zlNoteTitleInput');
  if (ti) { title = ti.value.trim(); _zlNoteTitle = title; }
  if (!title) { showToast('请输入笔记标题'); return; }

  var now = new Date().toISOString();
  var data = {
    bankId: _zlBankId,
    title: title,
    content: content,
    updatedAt: now
  };
  if (_zlEditingNote && _zlEditingNote.id) {
    data.id = _zlEditingNote.id;
    data.createdAt = _zlEditingNote.createdAt || now;
  } else {
    data.createdAt = now;
  }

  dbPut('notes', data).then(function() {
    showToast('✅ 笔记已保存');
    _zlEditingNote = null;
    updateStorageBadge();
    renderNoteList();
  }).catch(function() {
    showToast('保存失败，请重试');
  });
}

  };

function deleteCurrentNote() {
  if (!_zlEditingNote || !_zlEditingNote.id) { showToast('笔记尚未保存'); return; }

function loadMarkmap() {
  if (_zlMarkmapLoaded) {
    renderMarkmapFromContent();
    return;
  }
  var container = document.getElementById('zlMindMapTarget');
  if (!container) return;
  container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:400px;color:var(--text-tertiary);font-size:14px">⏳ 加载思维导图组件...</div>';

  // 只加载 d3.js（纯自绘水平树，无需 200KB markmap-view）

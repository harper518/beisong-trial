  renderPracticeCard();
}

function speakCard() {
  const ss = window.speechSynthesis;
  if (!ss) { showToast('浏览器不支持语音朗读'); return; }
  const card = practiceState.cards[practiceState.index];
  if (!card) return;
  // 切到不同卡片 → 取消旧的，重新开始
  if (practiceState._speakingCardId && practiceState._speakingCardId !== card.id) {
    ss.cancel(); practiceState._speakingCardId = null;
  }
  // 暂停 → 继续
  if (ss.speaking && ss.paused) { ss.resume(); return; }
  // 朗读中 → 暂停
  if (ss.speaking) { ss.pause(); return; }
  // 开始朗读
  practiceState._speakingCardId = card.id;
  doSpeakCard();
}

function doSpeakCard() {
  const card = practiceState.cards[practiceState.index];
  if (!card) return;
  const ss = window.speechSynthesis;
  ss.cancel();
  const rawText = card.fullText || card.question + card.answer;
  const cleanText = rawText.replace(/\\n/g, '，').replace(/\n/g, '，');
  var u = new SpeechSynthesisUtterance(cleanText);
  u.rate = appData.settings.voiceRate || 0.9;
  u.pitch = appData.settings.voicePitch || 1.0;

  var voices = ss.getVoices();
  // 1. 优先使用用户保存的指定语音
  var voiceName = appData.settings.voiceName;
  if (voiceName && voices.length) {
    var picked = voices.find(function(v) { return v.name === voiceName; });
    if (picked) { u.voice = picked; u.lang = picked.lang || 'zh-CN'; }
  }
  // 2. 没指定语音 → 自动匹配中文语音（兼容QQ浏览器/讯飞等）
  if (!u.voice && voices.length) {
    var zhVoice = voices.find(isChineseVoice);
    if (zhVoice) { u.voice = zhVoice; u.lang = zhVoice.lang || 'zh-CN'; }
  }
  // 3. 没找到中文语音 → 用第一个可用语音 + 中文 lang
  if (!u.voice && voices.length) {
    u.voice = voices[0];
  }
  // 4. 没有任何语音 → 设 lang 为 zh-CN，让引擎自行处理
  u.lang = u.lang || 'zh-CN';
  // 朗读结束后的行为
  const readMode = appData.settings.readMode || 'once';
  u.onend = () => {
    if (readMode === 'loop') {
      // 循环读同一题
      setTimeout(() => doSpeakCard(), 500);
    } else if (readMode === 'three-times') {
      practiceState._readCount = (practiceState._readCount || 0) + 1;
      if (practiceState._readCount < 3) {
        setTimeout(() => doSpeakCard(), 500);
      } else {
        practiceState._readCount = 0;
        // 3遍读完，自动下一题
        if (practiceState.index < practiceState.total - 1) {
          setTimeout(() => { nextCard(); setTimeout(() => doSpeakCard(), 300); }, 500);
        }
      }
    } else if (readMode === 'auto-next') {
      // 自动下一题
      if (practiceState.index < practiceState.total - 1) {
        setTimeout(() => { nextCard(); setTimeout(() => doSpeakCard(), 300); }, 500);
      }
    }
    // 'once' mode: do nothing
  };
  practiceState._readCount = 0;
  ss.speak(u);
}

// ==================== 做题结果 ====================
function showPracticeResult() {
  stopTimer();
  document.body.classList.remove('focus-mode');
  const st = practiceState;
  const total = st.total;
  const bank = appData.banks[st.bankId];
  const isSprint = sessionStorage.getItem('sprintMode') === '1';

  // 记录练习时长和切屏
  var elapsed = practiceStartTime ? Math.round((Date.now() - practiceStartTime) / 1000) : 0;
  ensureDailyPractice();
  appData.settings.dailyPractice.duration = (appData.settings.dailyPractice.duration || 0) + elapsed;
  appData.settings.dailyPractice.switches = (appData.settings.dailyPractice.switches || 0) + practiceSwitches;
  addToWeekStats(appData.settings.dailyPractice.date, elapsed, practiceSwitches);

  // 记录每日完成数和学习日历
  if (st._roundCorrect) {
    recordTodayCompleted(st._roundCorrect);
    // 学习日历：记录今天有学习
    if (!appData.settings.studyDates) appData.settings.studyDates = {};
    var today = new Date().toISOString().substring(0, 10);
    appData.settings.studyDates[today] = (appData.settings.studyDates[today] || 0) + st._roundCorrect;
    // 累计正确数
    appData.settings.lifetimeCorrect = (appData.settings.lifetimeCorrect || 0) + st._roundCorrect;
  }
  // 轮数统计
  appData.settings.roundCount = (appData.settings.roundCount || 0) + 1;
  // 完美轮检测
  if (total >= 5 && (st._roundCorrect || 0) === total) {
    appData.settings._hasPerfectRound = true;
  }
  // 检查成就
  checkAchievements();

  // 更新顺序进度（仅非冲刺模式）
  if (!isSprint && st.mode === 'sequential') {
    const pos = getSeqProgress(st.bankId);
        const filteredLen = getFilteredCards(bank).length;
    appData.seqProgress[st.bankId] = Math.min(pos + total, filteredLen || (bank && bank.cards ? bank.cards.length : 0) || 0);
  }
  // 更新随机不重复的已完成集
  if (!isSprint && st.mode === 'random-norepeat') {
    if (!appData.doneSets) appData.doneSets = {};
    if (!appData.doneSets[st.bankId]) appData.doneSets[st.bankId] = [];
    for (const card of st.cards) {
      if (!appData.doneSets[st.bankId].includes(card.id)) appData.doneSets[st.bankId].push(card.id);
    }
  }

  // 更新卡片统计
  if (bank) {
    for (const card of st.cards) {
      const orig = bank.cards.find(x => x.id === card.id);
      if (orig) {
        orig.lastPracticed = Date.now(); orig.starred = card.starred;
        orig.blanks = card.blanks; orig.fullText = card.fullText;
      }
    }
    // 多题库模式：更新其他题库的卡片
    if (st._multiBanks) {
      for (var mbi = 0; mbi < st._multiBanks.length; mbi++) {
        var mbId = st._multiBanks[mbi];
        if (mbId === st.bankId) continue;
        var mb = appData.banks[mbId];
        if (!mb) continue;
        for (var mcj = 0; mcj < st.cards.length; mcj++) {
          var mc = st.cards[mcj];
          var morig = mb.cards.find(function(x) { return x.id === mc.id; });
          if (morig) {
            morig.lastPracticed = Date.now(); morig.starred = mc.starred;
            morig.blanks = mc.blanks; morig.fullText = mc.fullText;
          }
        }
      }
    }
  }
  saveData(appData);

  var correctCount = st._roundCorrect || 0;
  var wrongCount = st._roundWrong || 0;
  var correctRate = total > 0 ? Math.round((correctCount / total) * 100) : 0;
  var newlyMastered = (st._newlyMastered || []).length;

  // 冲刺模式结束后清除
  if (isSprint) sessionStorage.removeItem('sprintMode');

  const rc = $('practiceResult');
  $('practiceActive').style.display = 'none';
  rc.style.display = 'block';

  // 结果页星级
  var starEmoji = correctRate >= 90 ? '🌟' : correctRate >= 70 ? '👍' : '💪';
  var resultEmoji = isSprint ? (correctRate >= 70 ? '🎉' : '📚') : '✅';

  // 结语
  var closingMsg = '';
  if (correctRate >= 80) closingMsg = '掌握得很好，保持信心！' + starEmoji;
  else if (correctRate >= 60) closingMsg = '稳步提升中，薄弱环节正在变少 💪';
  else closingMsg = '发现了提升空间，针对性补强后会越来越好 📈';

  // 冲刺模式特殊信息
  var sprintExtra = '';
  if (isSprint) {
    sprintExtra = '<div style="font-size:13px;color:var(--text-secondary);margin-top:8px">📝 还有 <b>' + (total - correctCount) + '</b> 题待巩固，已加入明日复习计划</div>';
  }

  rc.innerHTML = `<div class="card" style="text-align:center;padding:24px 20px">
    <div style="font-size:48px;margin-bottom:8px">${resultEmoji}</div>
    <div style="font-size:20px;font-weight:800;margin-bottom:4px">${isSprint ? '冲刺完成！' : '本轮完成'}</div>
    <div class="text-sm text-secondary">共 ${total} 题 · ${escapeHtml(st.bankName)}</div>
    <div style="display:flex;gap:10px;margin-top:14px;justify-content:center;flex-wrap:wrap">
      <div style="background:var(--success-light);border-radius:10px;padding:10px 16px;text-align:center;min-width:70px">
        <div style="font-size:22px;font-weight:700;color:var(--success)">${correctCount}</div>
        <div style="font-size:11px;color:var(--success)">正确</div>
      </div>
      <div style="background:var(--danger-light);border-radius:10px;padding:10px 16px;text-align:center;min-width:70px">
        <div style="font-size:22px;font-weight:700;color:var(--danger)">${wrongCount}</div>
        <div style="font-size:11px;color:var(--danger)">待加强</div>
      </div>
      <div style="background:var(--primary-light);border-radius:10px;padding:10px 16px;text-align:center;min-width:70px">
        <div style="font-size:22px;font-weight:700;color:var(--primary)">${correctRate}%</div>
        <div style="font-size:11px;color:var(--primary)">正确率</div>
      </div>
    </div>
    ${newlyMastered > 0 ? '<div class="text-sm" style="margin-top:10px;color:var(--success);font-weight:600">🎉 本次新掌握 <b>' + newlyMastered + '</b> 题（之前错过的现在对了！）</div>' : ''}
    ${sprintExtra}
    <div class="text-sm text-secondary" style="margin-top:10px">${starEmoji} ${closingMsg}</div>
    <div class="text-sm text-secondary" style="margin-top:6px">⏱ ${fmtDuration(elapsed)}${practiceSwitches > 0 ? ' &middot; 📱 切屏 ' + practiceSwitches + ' 次' : ''}</div>
    <div class="flex gap-8 flex-wrap justify-center mt-16">
      <button class="btn btn-primary btn-sm" onclick="retrySameSettings()">▶ 再来一轮</button>
      <button class="btn btn-ghost btn-sm" onclick="backToPracticeSetup()">🔄 重新设置</button>
    </div>
    <div class="text-center mt-12">
      <span style="font-size:12px;color:var(--text-tertiary);cursor:pointer;text-decoration:underline" onclick="copyBackup()">💾 复制备份码保存</span>
    </div>
  </div>`;
}

function showInfoModal(title, htmlMsg, btnText) {
  const ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.style.animation = 'none';
  ov.innerHTML = '<div class="modal" style="animation:none;border-radius:var(--radius);max-width:330px;margin:auto;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:24px 20px"><h3 style="margin-bottom:8px;font-size:17px">' + escapeHtml(title) + '</h3><div style="color:var(--text-secondary);margin-bottom:22px;font-size:14px">' + htmlMsg + '</div><button class="btn btn-primary btn-block">' + escapeHtml(btnText || '知道了') + '</button></div>';
  document.body.appendChild(ov);
  ov.querySelector('button').onclick = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
}

function switchManualTab(tab) {
  var quickEl = document.getElementById('manualTabQuick');
  var fullEl = document.getElementById('manualTabFull');
  var tabs = document.querySelectorAll('.manual-tab');
  if (tab === 'quick') {
    if (quickEl) quickEl.style.display = '';
    if (fullEl) fullEl.style.display = 'none';
    if (tabs[0]) { tabs[0].style.background = 'var(--primary)'; tabs[0].style.color = '#fff'; tabs[0].style.fontWeight = '600'; }
    if (tabs[1]) { tabs[1].style.background = 'transparent'; tabs[1].style.color = 'var(--text-secondary)'; tabs[1].style.fontWeight = '400'; }
  } else {
    if (quickEl) quickEl.style.display = 'none';
    if (fullEl) fullEl.style.display = '';
    if (tabs[0]) { tabs[0].style.background = 'transparent'; tabs[0].style.color = 'var(--text-secondary)'; tabs[0].style.fontWeight = '400'; }
    if (tabs[1]) { tabs[1].style.background = 'var(--primary)'; tabs[1].style.color = '#fff'; tabs[1].style.fontWeight = '600'; }
  }
}

function retrySameSettings() {
  const bankId = practiceState.bankId;
  const bank = appData.banks[bankId];
  if (!bank) return;
  const count = practiceState.total;
  let selected;
  const filteredCards = getFilteredCards(bank);
  if (practiceState.mode === 'sequential') {
    const pos = getSeqProgress(bankId);
    if (pos >= filteredCards.length) {
      appData.seqProgress[bankId] = 0;
      saveData(appData);
      selected = [...filteredCards.slice(0, count)];
    } else {
      selected = [...filteredCards.slice(pos, Math.min(pos + count, filteredCards.length))];
    }
  } else {
    selected = shuffle(filteredCards).slice(0, count);
  }
  const qh = new Set();
  if (hideQuestionStart) { for (const c of selected) qh.add(c.id); }
  practiceState = { ...practiceState, cards: selected, index: 0, answers: {}, revealed: new Set(), questionHidden: qh, koujueExpanded: {}, total: selected.length, answersHidden: false, _streak: 0, _roundCorrect: 0, _roundWrong: 0, _newlyMastered: [] };
  $('practiceResult').style.display = 'none';
  $('practiceActive').style.display = 'block';
  renderPracticeCard();
}

function backToPracticeSetup() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  stopTimer();
  document.body.classList.remove('focus-mode');
  practiceState = null;
  $('practiceResult').style.display = 'none';
  $('practiceActive').style.display = 'none';
  renderPracticeSetup();
}

  const si = document.getElementById('browseSearchInput');
  if (si) si.value = '';
  document.querySelectorAll('#browseFilterChips .chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  // 收藏子分类：显示/隐藏
  const subChips = document.getElementById('browseStarSubChips');
  if (subChips) {
    subChips.style.display = filter === 'star' ? '' : 'none';
    if (filter === 'star') {
      subChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      const allChip = subChips.querySelector('[data-sub="all"]');
      if (allChip) allChip.classList.add('active');
    }
  }
  renderBrowseList();
}

function setStarSubFilter(sub, el) {
  browseState.starSub = sub;
  const subChips = document.getElementById('browseStarSubChips');
  if (subChips) {
    subChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    if (el) el.classList.add('active');
  }
  renderBrowseList();
}

function doBrowseSearch() {
  const input = document.getElementById('browseSearchInput');
  browseState.searchQuery = input ? input.value.trim().toLowerCase() : '';
  renderBrowseList();
}

var _browseTab = 'list';

function switchBrowseTab(tab) {
  _browseTab = tab;
  var tabList = document.getElementById('browseTabList');
  var tabChapters = document.getElementById('browseTabChapters');
  var filterArea = document.getElementById('browseFilterArea');
  var tabContent = document.getElementById('browseTabContent');
  if (tabList) tabList.classList.toggle('active', tab === 'list');
  if (tabChapters) tabChapters.classList.toggle('active', tab === 'chapters');
  if (filterArea) filterArea.style.display = tab === 'list' ? '' : 'none';
  if (tabContent) tabContent.style.display = tab === 'chapters' ? '' : 'none';

    renderBrowseList();
  } else {
    var bankId = document.getElementById('browseBankSelect') ? document.getElementById('browseBankSelect').value : browseState.bankId;
    if (tabContent) tabContent.innerHTML = renderChapterHeatmap(bankId);
  }
}

function changeBrowseBank() {
  var bankId = document.getElementById('browseBankSelect').value;
  var bank = appData.banks[bankId];
  if (!bank) return;
  sessionStorage.setItem('lastPracticeBank', bankId);
  // 完全重建浏览页，确保标题也更新
  var favCount = bank.cards.filter(function(c) { return c.starred; }).length;
  var kjCount = bank.cards.filter(function(c) { return c.koujue; }).length;
  browseState = { bankId: bankId, bankName: bank.name, cards: bank.cards, index: 0, view: 'list', filter: 'all', starSub: 'all', searchQuery: '', _filteredCards: bank.cards, answersHidden: false };
  var c = $('browseContainer');
  c.innerHTML = '<div class="flex justify-between items-center mb-10"><h1 style="font-size:20px;font-weight:800">📖 目录</h1><input type="hidden" id="browseBankSelect" value="' + bankId + '"><button class="btn btn-ghost btn-sm" onclick="showBankPicker(document.getElementById(\'browseBankSelect\').value, function(bid){document.getElementById(\'browseBankSelect\').value=bid;changeBrowseBank()})" style="font-size:13px">' + escapeHtml(bank.name) + ' ▾</button></div><div style="margin-bottom:10px"><input type="search" id="browseSearchInput" placeholder="🔍 搜索题目..." style="width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:10px;background:var(--bg-card);color:var(--text);font-size:14px" oninput="doBrowseSearch()"></div><div class="browse-tabs" id="browseTabs"><button class="browse-tab active" id="browseTabList" onclick="switchBrowseTab(\'list\')">📋 题目列表</button><button class="browse-tab" id="browseTabChapters" onclick="switchBrowseTab(\'chapters\')">📊 章节掌握度</button></div><div id="browseTabContent" style="display:none"></div><div id="browseFilterArea"><div class="chip-group mb-12" id="browseFilterChips"><span class="chip active" data-filter="all" onclick="setBrowseFilter(\'all\', this)">全部</span><span class="chip" data-filter="star" onclick="setBrowseFilter(\'star\', this)">⭐ 收藏' + (favCount ? ' · ' + favCount : '') + '</span><span class="chip" data-filter="koujue" onclick="setBrowseFilter(\'koujue\', this)">💡 口诀' + (kjCount ? ' · ' + kjCount : '') + '</span></div><div class="chip-group mb-12" id="browseStarSubChips" style="display:none;flex-wrap:nowrap;overflow-x:auto"><span class="chip active" data-sub="all" onclick="setStarSubFilter(\'all\', this)">全部</span><span class="chip" data-sub="question" onclick="setStarSubFilter(\'question\', this)">📝 题目</span><span class="chip" data-sub="koujue" onclick="setStarSubFilter(\'koujue\', this)">💡 口诀</span><span class="chip" data-sub="wrong" onclick="setStarSubFilter(\'wrong\', this)">❌ 错题</span></div><div id="browseActive"></div></div>';
  renderBrowseList();
}

function renderBrowseList() {
  const c = $('browseActive');
  const st = browseState;
  if (!st || !st.cards.length) { c.innerHTML = `<div class="empty"><p>题库为空</p></div>`; return; }

  // 筛选
  let cards = st.cards;
  const wbBrowse = getWrongBook(st.bankId);
  if (st.filter === 'star') {
    cards = cards.filter(c => c.starred);
    // 收藏子分类
    if (st.starSub === 'question') cards = cards.filter(c => !c.koujue && !(c.id in wbBrowse));
    else if (st.starSub === 'koujue') cards = cards.filter(c => c.koujue);
    else if (st.starSub === 'wrong') cards = cards.filter(c => c.id in wbBrowse);
  }
  if (st.filter === 'wrong') cards = cards.filter(c => c.id in wbBrowse);
			  if (st.filter === 'koujue') cards = cards.filter(c => c.koujue);
  // 搜索过滤
  if (st.searchQuery) {
    cards = cards.filter(c => (c.question || '').toLowerCase().includes(st.searchQuery) || (c.answer || '').toLowerCase().includes(st.searchQuery));
  }
  if (!cards.length) {
    let emptyMsg = '题库为空';
    if (st.searchQuery) emptyMsg = '未找到匹配"'+escapeHtml(st.searchQuery)+'"的题目';
    else if (st.filter === 'wrong') emptyMsg = '暂无错题，做题时诊断后自动收集';
    else if (st.filter === 'koujue') emptyMsg = '暂无口诀';
    else if (st.filter === 'star') {
      if (st.starSub === 'question') emptyMsg = '收藏中没有此类题目';
      else if (st.starSub === 'koujue') emptyMsg = '收藏中没有带口诀的题目';
      else if (st.starSub === 'wrong') emptyMsg = '收藏中没有错题';
      else emptyMsg = '暂无收藏';
    }
    c.innerHTML = '<div class="empty"><p>' + emptyMsg + '</p></div>';
    return;
  }

  // 按章节分组
  const groups = {};
  cards.forEach((card, i) => {
    const ch = card.chapter || '';
    if (!groups[ch]) groups[ch] = [];
    groups[ch].push({ ...card, _idx: st.cards.indexOf(card) });
  });
  // 保存筛选后的卡片列表，供详情导航使用
  st._filteredCards = cards.map(c => ({ ...c, _idx: st.cards.indexOf(c) }));

  let html = '';
  if (st.filter === 'koujue') {
    // 口诀卡片格式（带收藏和修改）
    for (const [chapter, list] of Object.entries(groups)) {
      if (chapter) html += '<div class="section-title" style="margin-top:12px">' + escapeHtml(chapter) + ' · ' + list.length + ' 条</div>';
      for (const card of list) {
        const parsed = typeof parseKoujue === 'function' ? parseKoujue(card.koujue || '') : [];
        const keywordsOnly = parsed.map(p => escapeHtml(p.char)).join(' ');
        html += '<div class="kj-card" id="kjb-' + card.id + '">';
        html += '<div class="kj-mnemonic" style="display:flex;justify-content:space-between;align-items:flex-start">';
        html += '<span style="flex:1">' + (keywordsOnly || escapeHtml(card.koujue || '')) + '</span>';
        html += '<span style="display:flex;gap:4px;flex-shrink:0">';
        html += '<span style="font-size:20px;cursor:pointer;padding:2px 6px;min-width:36px;display:inline-flex;align-items:center;justify-content:center" onclick="event.stopPropagation();toggleBrowseStarFromList(' + card._idx + ')">' + (card.starred ? '⭐' : '☆') + '</span>';
        html += '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();editKoujueBrowse(this)" data-cid="' + card.id + '" style="padding:2px 6px;font-size:12px;opacity:.4" title="编辑口诀">✏️</button>';
        html += '</span></div>';
        html += '<div class="kj-meaning" id="kjb-mean-' + card.id + '">';
        html += '<div style="font-size:12px;color:var(--text-tertiary);margin-bottom:6px">' + escapeHtml(card.question.replace(/^[\d\.\、\s]+/, '')) + '</div>';
        html += parsed.map(p => '<span class="kj-char">' + escapeHtml(p.char) + '</span><span class="kj-desc">（' + escapeHtml(p.desc) + '）</span>').join(' ');
        html += '</div>';
        html += '</div>';
      }
    }
  } else {
    // 普通列表格式
    for (const [chapter, list] of Object.entries(groups)) {
      if (chapter) html += '<div class="section-title" style="margin-top:12px">' + escapeHtml(chapter) + ' · ' + list.length + ' 题</div>';
      for (const card of list) {
        const qText = card.question.replace(/^[\d\.\、\s]+/, '').substring(0, 35);
        html += '<div class="browse-dir-item" onclick="openBrowseDetail(' + card._idx + ')">';
        html += '<span style="font-size:11px;color:var(--text-tertiary);min-width:28px">' + (card._idx + 1) + '</span>';
        html += '<span style="flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(qText) + '</span>';
        html += '<span style="font-size:20px;flex-shrink:0;cursor:pointer;padding:6px 10px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center" onclick="event.stopPropagation();toggleBrowseStarFromList(' + card._idx + ')">' + (card.starred ? '⭐' : '☆') + '</span>';
        html += '</div>';
      }
    }
  }

  c.innerHTML = html;

  // 口诀卡片点击展开事件
  if (st.filter === 'koujue') {
    cards.forEach(card => {
      const el = document.getElementById('kjb-' + card.id);
      const meanEl = document.getElementById('kjb-mean-' + card.id);
      if (el && meanEl) {
        el.onclick = () => {
          const showing = meanEl.classList.contains('show');
          document.querySelectorAll('#browseActive .kj-meaning.show').forEach(m => m.classList.remove('show'));
          if (!showing) meanEl.classList.add('show');
        };
      }
    });
  }
}

function openBrowseDetail(idx) {
  browseState._scrollY = document.getElementById('browseActive').scrollTop || window.scrollY;
  // idx 是全题库索引，映射到筛选后列表的位置
  const filtered = browseState._filteredCards || browseState.cards;
  const fi = filtered.findIndex(c => c._idx === idx);
  browseState.index = fi >= 0 ? fi : 0;
  browseState.view = 'detail';
  renderBrowseDetail();
}

function renderBrowseDetail() {
  const c = $('browseActive');
  const st = browseState;
  const filtered = st._filteredCards || st.cards;
  const card = filtered[st.index];
  if (!card) { backToBrowseList(); return; }
  const cur = st.index + 1, total = filtered.length;
  const wbDetail = getWrongBook(st.bankId);
  const isWrong = card.id in wbDetail;
  const wrongDetail = wbDetail[card.id] || null;

    const ansHidden = st.answersHidden;
  c.innerHTML = `<div>
    <div class="flex justify-between items-center mb-10">
      <button class="btn btn-ghost btn-sm" onclick="backToBrowseList()">← 目录</button>
      <span class="text-sm text-secondary">${cur} / ${total}</span>
      <div class="flex gap-8" style="align-items:center">
        <button class="btn btn-ghost btn-sm" onclick="toggleBrowseAnswers()" style="padding:6px 8px;font-size:var(--font-size)" title="隐藏/显示答案">💐</button>
        <button style="background:none;border:none;font-size:24px;cursor:pointer;padding:8px 12px;line-height:1;min-width:44px;min-height:44px" onclick="toggleBrowseStar()">${card.starred ? '⭐' : '☆'}</button>
      </div>
    </div>
    <div style="line-height:2;font-size:var(--font-size-lg)">
      <div style="margin-bottom:12px;font-weight:500">${escNl(card.question)}</div>
      ${ansHidden ? `<div style="line-height:1.9;color:var(--text-tertiary)">答案已隐藏，点击 💐 按钮显示</div>` : (wrongDetail && wrongDetail.wrongIndices ? renderWrongCardInteractive(card, wrongDetail) : (card.answer ? `<div style="color:var(--text-secondary)">${escNl(card.answer)}</div>` : ''))}
    </div>
    ${isWrong ? `<div class="text-center mt-10"><button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="removeFromWrongBook('${card.id}')">🗑 移出复习清单</button></div>` : ''}
    <div class="flex gap-8 mt-16">
      <button class="btn btn-ghost flex-1" onclick="browsePrev()"${st.index === 0 ? ' disabled style="opacity:.4"' : ''}>← 上一题</button>
      <button class="btn btn-ghost flex-1" onclick="browseNext()"${st.index >= total - 1 ? ' disabled style="opacity:.4"' : ''}>下一题 →</button>
    </div>
  </div>`;
}

function toggleBrowseAnswers() {
  browseState.answersHidden = !browseState.answersHidden;
  renderBrowseDetail();
}

function backToBrowseList() {
  browseState.view = 'list';
  renderBrowseList();
  setTimeout(() => {
    if (browseState._scrollY) {
      document.getElementById('browseActive').scrollTop = browseState._scrollY;
      window.scrollTo(0, browseState._scrollY);
    }
  }, 50);
}

function browsePrev() { const filtered = browseState._filteredCards || browseState.cards; if (browseState.index > 0) { browseState.index--; renderBrowseDetail(); } }
function browseNext() { const filtered = browseState._filteredCards || browseState.cards; if (browseState.index < filtered.length - 1) { browseState.index++; renderBrowseDetail(); } }

function removeFromWrongBook(cardId) {
  if (!browseState) return;
  const bankId = browseState.bankId;
  const wbRemove = getWrongBook(bankId);
  delete wbRemove[cardId];
  saveData(appData);
  showToast('已移出复习清单');
  renderBrowseDetail();
}

function toggleBrowseStarFromList(idx) {
  const card = browseState.cards[idx];
  card.starred = !card.starred;
  const bank = appData.banks[browseState.bankId];
  if (bank) { const c = bank.cards.find(x => x.id === card.id); if (c) c.starred = card.starred; }
  saveData(appData);
  renderBrowseList();
}

function toggleBrowseStar() {
  if (!browseState) return;
  const filtered = browseState._filteredCards || browseState.cards;
  const card = filtered[browseState.index];
  if (!card) return;
  card.starred = !card.starred;
  const bank = appData.banks[browseState.bankId];
  if (bank) { const c = bank.cards.find(x => x.id === card.id); if (c) c.starred = card.starred; }
  saveData(appData);
  renderBrowseDetail();
}

// ==================== 浏览口诀编辑 ====================
function editKoujueBrowse(el) {
  const cardId = el.dataset.cid;
  if (!cardId) return;
  let card = null;
  for (const b of Object.values(appData.banks)) {
    const c = b.cards.find(x => x.id === cardId);
    if (c) { card = c; break; }
  }
  if (!card) return;

  const cardEl = document.getElementById('kjb-' + cardId);
  if (!cardEl) return;

  cardEl.innerHTML = '<div style="display:flex;flex-direction:column;gap:8px">' +
    '<textarea id="kjbEditTextarea" style="width:100%;min-height:60px;padding:8px;border:2px solid var(--primary);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;resize:vertical;font-family:inherit;line-height:1.6" rows="2">' + escapeHtml(card.koujue || '') + '</textarea>' +
    '<div class="flex gap-8" style="justify-content:flex-end">' +
    '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();cancelEditKoujueBrowse()">取消</button>' +
    '<button class="btn btn-primary btn-sm" data-cid="' + cardId + '" onclick="event.stopPropagation();saveKoujueBrowse(this.dataset.cid)">保存</button>' +
    '</div></div>';
  cardEl.onclick = null;
}

function cancelEditKoujueBrowse() {
  renderBrowseList();
}

function saveKoujueBrowse(cardId) {
  const ta = document.getElementById('kjbEditTextarea');
  if (!ta) return;
  const newKj = ta.value.trim();

  let card = null;
  for (const b of Object.values(appData.banks)) {
    const c = b.cards.find(x => x.id === cardId);
    if (c) { card = c; break; }
  }
  if (!card) return;

  card.koujue = newKj;
  saveData(appData);
  showToast('口诀已保存');
  renderBrowseList();
}


// ==================== 口诀模式 ====================
function renderKoujueStart() {
  const c = $('koujueContainer');
  const banks = Object.values(appData.banks).sort((a, b) => b.createdAt - a.createdAt);

  if (!banks.length) {
    c.innerHTML = `<div class="empty"><span class="icon">💡</span><h3>还没有题库</h3><p>请先导入含口诀的简答题文件</p></div>`;
    return;
  }

  let bankId = sessionStorage.getItem('lastPracticeBank');
  if (!bankId || !appData.banks[bankId]) bankId = banks[0].id;

  let allKjBanks = [];
  for (const b of banks) {
    const kjCards = b.cards.filter(x => x.koujue);
    if (kjCards.length) allKjBanks.push({ bankId: b.id, bankName: b.name, cards: kjCards });
  }

  if (!allKjBanks.length) {
    c.innerHTML = `<div class="empty"><span class="icon">💡</span><h3>当前没有口诀</h3><p>导入含「口诀」格式的简答题文件即可<br>格式：<code>口诀：全（全民化）民（民主化）</code></p></div>`;
    return;
  }

  c.innerHTML = `<div class="flex justify-between items-center mb-16">
    <h1 style="font-size:24px;font-weight:800;letter-spacing:-.02em">口诀背诵</h1>
    <input type="hidden" id="kjBankSelect" value="${bankId}"><button class="btn btn-ghost btn-sm" onclick="showKjBankPicker()" style="font-size:14px;padding:10px 14px;min-width:150px;white-space:nowrap">${escapeHtml(allKjBanks.find(function(b){return b.bankId===bankId})?.bankName || '')} (${(allKjBanks.find(function(b){return b.bankId===bankId})?.cards.length || 0)}条) ▾</button>
  </div>
  <div id="kjCategoryFilter" style="margin-bottom:12px"></div>
  <div id="kjCategoryHint" style="font-size:12px;color:var(--text-tertiary);margin-bottom:12px"></div>
  <div id="kjList"></div>`;

  renderKoujueCards();
}

function getFilteredKjCards(bank) {
  if (!bank || !bank.cards) return [];
  const kjCards = bank.cards.filter(x => x.koujue);
  if (!kjCategoryFilter || !kjCategoryFilter.size) return kjCards;
  return kjCards.filter(c => {
    const q = (c.question || "").trim();
    const matches = q.match(/（[^）]{1,8}）/g) || [];
    return matches.some(m => kjCategoryFilter.has(m));
  });
}

function renderKjCategoryFilter() {
  const div = document.getElementById("kjCategoryFilter");
  if (!div) return;
  const sel = document.getElementById("kjBankSelect");
  if (!sel) return;
  const bank = appData.banks[sel.value];
  if (!bank) { div.innerHTML = ""; return; }
  const cats = extractCategories(bank);
  if (!cats.length) { div.innerHTML = ""; return; }
  if (!kjCategoryFilter) kjCategoryFilter = new Set(cats);
  let h = "<label class=\"form-label\" style=\"font-size:13px\">🏷️ 分类筛选</label><div class=\"chip-group\">";
  h += "<span class=\"chip" + (kjCategoryFilter.size === cats.length ? " active" : "") + "\" onclick=\"toggleAllKjCategories()\">全部</span>";
  for (const cat of cats) {
    h += "<span class=\"chip" + (kjCategoryFilter.has(cat) ? " active" : "") + "\" onclick=\"toggleKjCategory('" + cat + "')\" style=\"margin-left:4px\">" + cat + "</span>";
  }
  h += "</div>";
  div.innerHTML = h;
  updateKjFilteredCount();
}

function toggleAllKjCategories() {
  const sel = document.getElementById("kjBankSelect");
  if (!sel) return;
  const bank = appData.banks[sel.value];
  if (!bank) return;
  const cats = extractCategories(bank);
  if (kjCategoryFilter && kjCategoryFilter.size === cats.length) kjCategoryFilter = new Set();
  else kjCategoryFilter = new Set(cats);
  renderKjCategoryFilter();
  renderKoujueCards();
}

function toggleKjCategory(cat) {
  if (!kjCategoryFilter) return;
  if (kjCategoryFilter.has(cat)) {
    if (kjCategoryFilter.size <= 1) return;
    kjCategoryFilter.delete(cat);
  } else kjCategoryFilter.add(cat);
  renderKjCategoryFilter();
  renderKoujueCards();
}

function updateKjFilteredCount() {
  const sel = document.getElementById("kjBankSelect");
  if (!sel) return;
  const bank = appData.banks[sel.value];
  if (!bank) return;
  const total = bank.cards.filter(x => x.koujue).length;
  const filtered = getFilteredKjCards(bank);
  const hint = document.getElementById("kjCategoryHint");
  if (hint) hint.textContent = "筛选后 " + filtered.length + " / " + total + " 条口诀";
}

function renderKoujueCards() {
  const sel = document.getElementById('kjBankSelect');
  if (!sel) return;
  const bank = appData.banks[sel.value];
  if (!bank) return;
  const cards = getFilteredKjCards(bank);
  renderKjCategoryFilter();
  if (!cards.length) { document.getElementById('kjList').innerHTML = `<div class="empty"><p>该分类下没有口诀</p></div>`; return; }

  const groups = {};
  cards.forEach(card => { const ch = card.chapter || '未分类'; if (!groups[ch]) groups[ch] = []; groups[ch].push(card); });

  let html = '';
  for (const [chapter, list] of Object.entries(groups)) {
    html += `<div class="section"><div class="section-title">${escapeHtml(chapter)} · ${list.length} 条</div>`;
    for (const card of list) {
      const parsed = parseKoujue(card.koujue);
      const keywordsOnly = parsed.map(p => escapeHtml(p.char)).join(' ');
      html += `<div class="kj-card" id="kj-${card.id}">
        <div class="kj-mnemonic">
          ${keywordsOnly || escapeHtml(card.koujue)}
          <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();editKoujue('${card.id}')" style="padding:2px 6px;font-size:12px;opacity:.4;float:right" title="编辑口诀">✏️</button>
        </div>
        <div class="kj-meaning" id="kj-mean-${card.id}">
          <div style="font-size:12px;color:var(--text-tertiary);margin-bottom:6px">${escapeHtml(card.question.replace(/^[\d\.\、\s]+/, ''))}</div>

    }

  }

  for (const card of cards) {
    const el = document.getElementById('kj-' + card.id);
    const meanEl = document.getElementById('kj-mean-' + card.id);

        document.querySelectorAll('#kjList .kj-meaning.show').forEach(m => m.classList.remove('show'));
        if (!showing) meanEl.classList.add('show');
      };

}

function parseKoujue(kj) {
  if (!kj) return [];
  const result = [];
  const re = /[^\s，,。！!？?、；;：:""''（）()《》—\-]+（[^）]*）/g;
  let m;
  while ((m = re.exec(kj)) !== null) {
    const full = m[0], li = full.lastIndexOf('（');
    if (li > 0) result.push({ char: full.substring(0, li), desc: full.substring(li + 1, full.length - 1) });
  }
  if (!result.length && kj.trim()) result.push({ char: kj.trim(), desc: '' });
  return result;
}

function renderWrongBookStart() {
  const c = $('wrongbookContainer');
  const banks = Object.values(appData.banks).sort((a,b) => b.createdAt - a.createdAt);

  const banksWithWrong = [];
  banks.forEach(b => {
    const wb = getWrongBook(b.id);
    const wrongIds = Object.keys(wb).filter(id => wb[id] && wb[id].wrongIndices && wb[id].wrongIndices.length > 0);
    if (wrongIds.length) banksWithWrong.push({ bank: b, wrongIds, wb });
  });

  if (!banksWithWrong.length) {
    c.innerHTML = '<div class="empty"><span class="icon">📝</span><h3>复习清单为空</h3><p>做题时答错的题目会自动收集到这里，方便针对性复习</p></div>';
    return;
  }

  let currentBankId = sessionStorage.getItem('wrongbookBank');
  if (!currentBankId || !appData.banks[currentBankId] || !Object.keys(getWrongBook(currentBankId)).length) {
    currentBankId = banksWithWrong[0].bank.id;
  }
  let currentData = banksWithWrong.find(b => b.bank.id === currentBankId);
  if (!currentData) currentData = banksWithWrong[0];
  currentBankId = currentData.bank.id;
  sessionStorage.setItem('wrongbookBank', currentBankId);

  const wrongCards = [];
  currentData.wrongIds.forEach(id => {
    const card = currentData.bank.cards.find(x => x.id === id);
    if (card) wrongCards.push({ card, wrongDetail: currentData.wb[id] || {} });
  });

  const groups = {};
  wrongCards.forEach(item => {
    const ch = item.card.chapter || '未分类';
    if (!groups[ch]) groups[ch] = [];
    groups[ch].push(item);
  });

  let html = '<div class="flex justify-between items-center mb-16">';
  html += '<h1 style="font-size:24px;font-weight:800;letter-spacing:-.02em">📝 复习清单</h1>';
  html += '<input type="hidden" id="wrongbookBankSelect" value="' + currentBankId + '">';
  var curBankName = currentData ? currentData.bank.name : '选择题库';
  html += '<button class="btn btn-ghost btn-sm" id="wrongbookBankBtn" onclick="pickWrongBookBank()" style="font-size:13px">' + escapeHtml(curBankName) + ' (' + currentData.wrongIds.length + '题) ▾</button></div>';

  for (const chapter in groups) {
    html += '<div class="section-title">' + escapeHtml(chapter) + ' · ' + groups[chapter].length + ' 题</div>';
    groups[chapter].forEach(item => {
      const card = item.card;
      html += '<div class="card" style="margin-bottom:10px;padding:14px 16px">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px">';
      html += '<div style="font-weight:500;line-height:1.8;font-size:var(--font-size);flex:1">' + escNl(card.question) + '</div>';
      html += '<button class="btn btn-ghost btn-sm" style="color:var(--danger);flex-shrink:0;font-size:14px;padding:6px 8px;min-height:36px;min-width:36px;align-self:center" data-card-id="' + card.id + '" onclick="removeFromWrongBookPage(this.dataset.cardId)">🗑</button>';
      html += '</div>';
      if (card.koujue) {
        html += '<div style="font-size:12px;color:var(--primary);margin-bottom:4px;font-weight:600;cursor:pointer" onclick="var n=this.nextElementSibling;n.style.display=n.style.display===\'none\'?\'\':\'none\'">💡 口诀（点击查看）</div>';
        html += '<div style="font-size:12px;color:var(--primary);margin-bottom:4px;line-height:1.8;display:none">' + escapeHtml(card.koujue) + '</div>';
      }
      html += renderWrongCardInteractive(card, item.wrongDetail);
      html += '</div>';
    });
  }

  c.innerHTML = html;
}

async function shareBackupCode() {
  if (!isPermanentAuth()) { showToast('试用版不支持导出'); return; }
  try {
    showToast('正在生成备份码...');
    var data = JSON.parse(JSON.stringify(appData));
    var code = await makeBackupCode(JSON.stringify(data));
    var today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    var textToShare = '挖空背诵工具 - 进度备份 ' + today + '\n\n' + code + '\n\n📌 使用方法：复制全部内容 → 打开工具设置页 → 粘贴备份码恢复';
    if (navigator.canShare && navigator.canShare({ text: textToShare })) {
      try {
        await navigator.share({ text: textToShare, title: '挖空背诵备份 - ' + today });
        appData.settings.lastBackup = Date.now();
        saveData(appData);
        showBackupDetailToast('✅ 备份码已分享');
        return;
      } catch (err) { if (err.name === 'AbortError') return; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(code);
        appData.settings.lastBackup = Date.now();
        saveData(appData);
        showBackupDetailToast('📋 分享不支持，已改为复制到剪贴板');
      } catch(e) { showToast('复制失败'); }
    } else { showToast('复制失败'); }
  } catch(e) { showToast('导出失败'); }
}

async function shareBackupFile() {
  try {
    var data = JSON.parse(JSON.stringify(appData));
    var json = JSON.stringify(data);
    var today = new Date().toISOString().slice(0, 10);
    var filename = '挖空背诵备份_' + today + '.json';
    var blob = new Blob([json], { type: 'application/json' });
    var file = new File([blob], filename, { type: 'application/json' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: '挖空背诵数据备份', text: '挖空背诵工具数据备份 - ' + today });
        appData.settings.lastBackup = Date.now();
        saveData(appData);
        showToast('✅ 分享成功');
        return;
      } catch (err) { if (err.name === 'AbortError') return; }
    }
    // Fallback: 下载 JSON
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    appData.settings.lastBackup = Date.now();
    saveData(appData);
    showToast('✅ 已下载 ' + filename);
  } catch(e) { showToast('导出失败'); }
}

function restoreFromJsonFile(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var backup = JSON.parse(e.target.result);
      if (!backup.banks) { showToast('❌ 无效的备份文件（缺少题库数据）'); return; }
      if (!confirm('将用此备份完全替换当前所有数据（题库、进度、设置），确定继续吗？')) return;
      if (!backup.settings) backup.settings = { density: 'low', darkMode: false, fontSize: 16 };
      if (!backup.seqProgress) backup.seqProgress = {};
      if (!backup.favorites) backup.favorites = {};
      if (!backup.wrongBooks) backup.wrongBooks = {};
      appData = backup;
      saveData(appData);
      applySettings();
      renderBanks();
      renderSettings();
      updateBadges();
      switchTab('banks');
      showToast('✅ 数据已全部恢复');
    } catch(err) { showToast('❌ 文件格式错误，无法解析'); }
  };
  reader.readAsText(file);
  input.value = '';
}

// 折叠/展开 section，状态持久化到 settings
function toggleSection(sectionId) {
  var collapsed = appData.settings.collapsedSections || {};
  var isNow = !collapsed[sectionId];
  collapsed[sectionId] = isNow;
  appData.settings.collapsedSections = collapsed;
  debouncedSaveData(appData);
  applyCollapseState(sectionId, isNow);
}

function toggleInline(id) {
  var el = document.getElementById(id);
  if (!el) return;
  if (el.style.display === 'none') {
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function applyCollapseState(sectionId, isCollapsed) {
  var body = document.getElementById('body_' + sectionId);
  var arrow = document.getElementById('arrow_' + sectionId);
  if (body) {
    if (isCollapsed) {
      body.style.maxHeight = '0px';
      body.style.opacity = '0';
      body.style.margin = '0';
    } else {
      body.style.maxHeight = body.scrollHeight + 'px';
      body.style.opacity = '1';
      body.style.margin = '';
    }
  }
  if (arrow) {

// 头像上传
function handleAvatarUpload(el) {
  var file = el.files[0]; if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showToast('头像图片不能超过 2MB'); el.value = ''; return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      // 短边压缩到 200px，保持比例
      var maxSide = 200;
      var w = img.width, h = img.height;
      if (w > maxSide || h > maxSide) {
        var ratio = Math.min(maxSide / w, maxSide / h);
        w = Math.round(w * ratio); h = Math.round(h * ratio);
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      appData.settings.avatarData = dataUrl;
      debouncedSaveData(appData);
      renderSettings();
      showToast('✅ 头像已保存');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  el.value = '';
}

function isChineseVoice(v) {
  const lang = (v.lang || '').toLowerCase();
  const name = (v.name || '').toLowerCase();
  // 标准中文 lang 标签
  if (lang.startsWith('zh')) return true;
  // ISO 639-3 官话
  if (lang.startsWith('cmn')) return true;
  // 部分引擎（如讯飞）使用 yue 粤语也算中文
  if (lang.startsWith('yue')) return true;
  // 按语音名称匹配：常见中文 TTS 引擎的关键词
  const cnKeywords = ['中文', '普通话', '国语', 'chinese', 'mandarin', 'cantonese', '讯飞', 'xunfei', 'xiaoxiao', 'yunyang', 'hanhan', 'yating', 'zhiwei', 'kangkang', 'yaoyao', '小小', '云希', '晓晓', '云扬'];
  for (var i = 0; i < cnKeywords.length; i++) {
    if (name.indexOf(cnKeywords[i].toLowerCase()) !== -1) return true;
  }
  return false;
}

function loadVoices() {
  if (!window.speechSynthesis) return;
  var voices = window.speechSynthesis.getVoices();
  if (!voices.length) {
    // Chrome 等浏览器异步加载语音列表，监听 voiceschanged 事件
    window.speechSynthesis.onvoiceschanged = function() {
      window.speechSynthesis.onvoiceschanged = null;
      loadVoices();
    };
    // 兜底：200ms 后重试（QQ浏览器可能需要更长时间）
    setTimeout(function() { if (window.speechSynthesis) loadVoices(); }, 500);
    return;
  }
  // 过滤中文语音，兼容各种引擎（系统TTS、讯飞、QQ浏览器等）
  var zhVoices = voices.filter(isChineseVoice);
  _availableVoices = zhVoices.length ? zhVoices : voices;
}

async function makeBackupCode() {
  // 深拷贝并精简：删除可重建的冗余字段，缩小备份码
  const copy = JSON.parse(JSON.stringify(appData));
  for (const b of Object.values(copy.banks || {})) {
    for (const card of b.cards || []) {
      delete card.fullText;       // = question + '\n' + answer，可重建
      delete card._charSelected;  // 编辑中间态，无需备份
      delete card._savedChars;
      delete card._autoBlanks;
    }
  }
  const json = JSON.stringify(copy);
  // deflate-raw 压缩（比 gzip 略小，去掉 gzip 头尾）
  if (typeof CompressionStream !== 'undefined') {
    try {
      const blob = new Blob([json]);
      const cs = new CompressionStream('deflate-raw');
      const stream = blob.stream().pipeThrough(cs);
      const compressed = await new Response(stream).blob();
      const bytes = new Uint8Array(await compressed.arrayBuffer());
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return 'D' + btoa(bin);
    } catch(e) {}
  }
  // 不支持压缩时用原始 base64
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return 'U' + btoa(bin);
}

async function doRestore() {
  const code = document.getElementById('restoreTextarea').value.trim();
  if (!code) { showToast('请粘贴备份码'); return; }
  try {
    const prefix = code[0];
    const base64 = code.slice(1);
    const bin = atob(base64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

    let json;
    if ((prefix === 'Z' || prefix === 'D') && typeof DecompressionStream !== 'undefined') {
      // 压缩的备份码（Z=gzip旧版，D=deflate-raw新版）
      const format = prefix === 'D' ? 'deflate-raw' : 'gzip';
      try {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format));
        json = await new Response(stream).text();
      } catch(e) { json = new TextDecoder().decode(bytes); }
    } else {
      // 未压缩的备份码（兼容旧版）
      json = new TextDecoder().decode(bytes);
    }

    const data = JSON.parse(json);
    if (!data.banks) { showToast('备份码无效'); return; }
    // 恢复后重建 fullText（备份中已精简掉）
    for (const b of Object.values(data.banks || {})) {
      for (const card of b.cards || []) {
        if (!card.fullText) card.fullText = (card.question || '') + '\n' + (card.answer || '');
      }
    }
    appData = data;
    saveData(appData);
    showToast('恢复成功！');
    setTimeout(() => location.reload(), 800);
  } catch(e) { showToast('备份码无效'); }
}

// ====== PWA：Service Worker 注册 + 安装引导 ======
(function() {
  // 注册 Service Worker（离线缓存）
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function() {});
  }

  // 检测是否已经以 PWA 模式运行
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches
    || (typeof navigator.standalone !== 'undefined' && navigator.standalone)
    || window.location.search.indexOf('pwa=1') !== -1;

  // ====== Android/桌面：beforeinstallprompt ======
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone) showAndroidBanner();
  });

  window.pwaInstall = function() {
    if (!deferredPrompt) {
      alert('请使用浏览器的"添加到主屏幕"功能安装');
      return;
    }
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(result) {
      if (result.outcome === 'accepted') {
        var banner = document.getElementById('pwaInstallBanner');
        if (banner) banner.classList.remove('show');
      }
      deferredPrompt = null;
    });
  };

  function showAndroidBanner() {
    var banner = document.getElementById('pwaInstallBanner');
    if (banner && !localStorage.getItem('pwa_banner_dismissed')) {
      setTimeout(function() { banner.classList.add('show'); }, 2000);
    }
  }

  window.pwaDismissBanner = function() {
    var banner = document.getElementById('pwaInstallBanner');
    if (banner) banner.classList.remove('show');
    localStorage.setItem('pwa_banner_dismissed', '1');
  };

  // ====== iOS Safari 安装引导 ======
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isSafari = /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|OPiOS|mercury/.test(navigator.userAgent);

  if (isIOS && isSafari && !isStandalone && !localStorage.getItem('pwa_ios_banner_dismissed')) {
    setTimeout(function() {
      var banner = document.getElementById('pwaIosBanner');
      if (banner) banner.classList.add('show');
    }, 2500);
  }

  window.pwaDismissIosBanner = function() {
    var banner = document.getElementById('pwaIosBanner');
    if (banner) banner.classList.remove('show');
    localStorage.setItem('pwa_ios_banner_dismissed', Date.now().toString());
  };

  // 如果已安装 PWA，隐藏所有横幅
  if (isStandalone) {
    var ab = document.getElementById('pwaInstallBanner');
    var ib = document.getElementById('pwaIosBanner');
    if (ab) ab.style.display = 'none';
    if (ib) ib.style.display = 'none';
  }

  // 安装成功后隐藏横幅
  window.addEventListener('appinstalled', function() {
    var banner = document.getElementById('pwaInstallBanner');
    if (banner) banner.classList.remove('show');
    localStorage.setItem('pwa_banner_dismissed', '1');
  });

  // 监听 display-mode 变化（用户手动添加到桌面后刷新）
  window.matchMedia('(display-mode: standalone)').addEventListener('change', function(e) {
    if (e.matches) {
      var ab = document.getElementById('pwaInstallBanner');
      var ib = document.getElementById('pwaIosBanner');
      if (ab) ab.style.display = 'none';
      if (ib) ib.style.display = 'none';
    }
  });
})();
// ====== PWA END ======

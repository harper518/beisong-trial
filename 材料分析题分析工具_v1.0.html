]},"心理问题-学习倦怠":{"tested":false,"exams":[],"keywords":["倦怠","疲劳","无助","低成就感"]},"心理问题-人际交往障碍":{"tested":false,"exams":[],"keywords":["人际","交往","孤僻","冲突","沟通"]},"心理问题-网络成瘾":{"tested":false,"exams":[],"keywords":["网络","成瘾","沉迷","网游"]},"辅导方法-肌肉放松训练":{"tested":true,"exams":["26上"],"keywords":["肌肉","放松","紧张"]},"辅导方法-系统脱敏法":{"tested":true,"exams":["26上"],"keywords":["脱敏","焦虑等级","逐步"]},"辅导方法-合理情绪疗法":{"tested":true,"exams":["26上"],"keywords":["情绪","认知","不合理信念","ABC"]},"辅导方法-强化法":{"tested":true,"exams":["26上"],"keywords":["强化","奖励","行为"]},"辅导方法-来访者中心疗法":{"tested":false,"exams":[],"keywords":["罗杰斯","共情","无条件积极关注"]}}},"M1":{"name":"教育基础","subTopics":{"教育与人的发展-影响因素":{"tested":true,"exams":["24上"],"keywords":["发展","遗传","环境","教育","马克思主义"]},"教育与社会-政治经济":{"tested":false,"exams":[],"keywords":["政治","经济","社会","功能"]},"教育目的-全面发展":{"tested":false,"exams":[],"keywords":["全面发展","五育","德智体美劳"]},"教育制度-义务教育":{"tested":false,"exams":[],"keywords":["义务教育","学制","制度"]},"素质教育-基本内涵":{"tested":false,"exams":[],"keywords":["素质","全体","全面","个性","创新"]}}},"M8":{"name":"班级管理与教师心理","subTopics":{"班级管理-班集体建设":{"tested":true,"exams":["19下"],"keywords":["班集体","班级","建设","阶段"]},"班级管理-非正式群体":{"tested":true,"exams":["25下"],"keywords":["非正式","小团体","群体"]},"班级管理-课堂管理":{"tested":true,"exams":["23上","25上"],"keywords":["课堂","纪律","捣乱","行为"]},"班主任-工作内容":{"tested":true,"exams":["21上","22上"],"keywords":["班主任","家访","沟通"]},"教师心理-教师期望效应":{"tested":true,"exams":["21上"],"keywords":["期望","罗森塔尔","皮格马利翁"]},"教师心理-教师成长阶段":{"tested":false,"exams":[],"keywords":["福勒","关注","生存","情境","学生"]},"教师心理-教师职业倦怠":{"tested":false,"exams":[],"keywords":["倦怠","情绪衰竭","去个性化","低成就感"]}}}},"exams":[{"exam":"2019下","rawFile":"19下 材料分析题 真题 科二.docx","items":[{"exam":"2019下","number":30,"material":"王晓是我班一名对学习缺乏兴趣的学生。当其他同学在课堂上求知若渴地学习时， 他却经常开小差，时而做出古怪的动作，发出干扰的声音，时而在教材上临摹插图， 毫不在乎老师的批评。在多次苦口婆心劝说无效后，我决定换个思路。经过细心观察，我发现他在班上没有一个朋友，谁也不爱理他。课间，他四处溜 达，无所事事，偶尔趁人不备拍打一个同学的背后迅速逃离。透过这一幕，我看到了 他自暴自弃的背后对友情的渴望。为了转变他在同学中的不良形象，我创造时机对他表扬。这种积极的评价果然有 效。他的书写从“狂草”变“潦草”,作文从数行到一页，学习有了较明显的进步。 过了一段时间，我发现他的一篇作文有些新意，就帮他输入电脑并加以润色，在班级 网页上展示，结果被同学们热烈“点赞”;他绘画有基础，我请美术老师私下指点， 他的画也上了学校的展板。同学们开始对他另眼相看，他也找回了一些自信。在此基础上，我策划开展“伸出手、不抛弃”的班级活动，先在班干部中讨论了 与王晓交友的行动计划。班干部动起来了，更多的同学参与进来，关注他、帮助他， 跟他交流、找他玩的同学渐渐多起来了，被他欺负而打小报告的同学逐渐少了，他为 引发他人关注的恶作剧也逐渐没有了，他终于融入了这个班集体，成为班上积极的一 员，我们班也因此获得了“包容友善先进班集体”的称号。","subQuestions":[{"number":1,"question":"材料中这位老师贯彻了哪些德育原则?请结合材料加以分析。(10分)","score":8,"answer":"材料中的这位老师在教学中贯彻了以下德育原则：首先，这位老师在教学过程中贯彻了因材施教原则。该原则是指教育者进行德育 时，要从学生品德发展的实际出发，根据学生的年龄特征和个性差异进行不同的教育， 使每个学生的品德都能得到更好的发展。材料中，这位老师在教学过程中对王晓这样一 位对学习缺乏兴趣的学生，采取针对性的措施进行教育，不断分析王晓的问题，寻找突 破口，利用合适的时机表扬王晓，还组织全班同学共同帮助王晓，帮助王晓不断进步， 使王晓成为一名积极的班级分子。由此看出，这位老师在教学过程中贯彻了因材施教的 原则。其次，这位老师在教学过程中贯彻了依靠积极因素、克服消极因素的原则。该原则是指德育工作中，教育者要善于依靠、发扬学生自身的积极因素，调动学生自我教 育的积极性，克服消极因素，实现品德发展内部矛盾的转化。材料中，这位老师在教 学过程中能够一分为二地看待王晓，利用他渴望交朋友的心理，积极地帮助他融入班 集体；在教学时，发现他作文写得不错时，积极地给予表扬肯定，帮助他增强信心 发现他有绘画基础，请美术老师私下指导，也使他找回自信。这些行为都反映了老师 在教学过程中能够积极地发现并发扬学生的优点，不断改正其不足，促进其进步。由 此看出，这位老师在教学过程中贯彻了依靠积极因素、克服消极因素的原则。再次，这位老师在教学过程中贯彻了尊重学生与严格要求学生相结合的原则。该 原则是指教育者进行德育时，要把对学生个人的尊重和信赖与对他们的严格要求结合 起来。材料中，这位老师对于王晓上课时的种种“捣蛋”行为，没有严厉批评，而且 不断地寻找新的思路帮助王晓进步。对于王晓的进步，老师也毫不吝啬自己的表扬和 赞美，这都是尊重学生的体现。同时，老师并没有放松对王晓的严格要求，想各种办 法让他融入集体中，成为班上积极进步的一员。由此看出，这位老师在教学过程中贯 彻了尊重学生与严格要求学生相结合的原则。最后，这位老师在教学过程中贯彻了集体教育和个别教育相结合原则。该原则是 指在德育过程中，教育者要善于组织和教育学生热爱集体，并依靠集体教育每个学 生，同时通过对个别学生的教育来促进集体的形成和发展，从而把集体教育和个别教 育有机结合起来。材料中，老师和班干部讨论了与王晓的交友行动计划，让更多的同 学参与进来，关注他、帮助他、跟他交流，最后在同学们的帮助下王晓融入了这个班 集体，这是通过集体的力量来教育个人。同时，班级也因此获得了“包容友善先进班 集体”的称号，这是通过个别教育使班集体得到了发展。由此看出，这位老师在教学 过程中贯彻了集体教育和个别教育相结合的原则。总之，该老师在教学过程中能够根据学生的特点，遵循相关的德育原则进行针对 性教育，是值得学习的。(答出正面教育与纪律约束相结合，言之有理也可)"}],"fullAnswer":"材料中的这位老师在教学中贯彻了以下德育原则：首先，这位老师在教学过程中贯彻了因材施教原则。该原则是指教育者进行德育 时，要从学生品德发展的实际出发，根据学生的年龄特征和个性差异进行不同的教育， 使每个学生的品德都能得到更好的发展。材料中，这位老师在教学过程中对王晓这样一 位对学习缺乏兴趣的学生，采取针对性的措施进行教育，不断分析王晓的问题，寻找突 破口，利用合适的时机表扬王晓，还组织全班同学共同帮助王晓，帮助王晓不断进步， 使王晓成为一名积极的班级分子。由此看出，这位老师在教学过程中贯彻了因材施教的 原则。其次，这位老师在教学过程中贯彻了依靠积极因素、克服消极因素的原则。该原则是指德育工作中，教育者要善于依靠、发扬学生自身的积极因素，调动学生自我教 育的积极性，克服消极因素，实现品德发展内部矛盾的转化。材料中，这位老师在教 学过程中能够一分为二地看待王晓，利用他渴望交朋友的心理，积极地帮助他融入班 集体；在教学时，发现他作文写得不错时，积极地给予表扬肯定，帮助他增强信心 发现他有绘画基础，请美术老师私下指导，也使他找回自信。这些行为都反映了老师 在教学过程中能够积极地发现并发扬学生的优点，不断改正其不足，促进其进步。由 此看出，这位老师在教学过程中贯彻了依靠积极因素、克服消极因素的原则。再次，这位老师在教学过程中贯彻了尊重学生与严格要求学生相结合的原则。该 原则是指教育者进行德育时，要把对学生个人的尊重和信赖与对他们的严格要求结合 起来。材料中，这位老师对于王晓上课时的种种“捣蛋”行为，没有严厉批评，而且 不断地寻找新的思路帮助王晓进步。对于王晓的进步，老师也毫不吝啬自己的表扬和 赞美，这都是尊重学生的体现。同时，老师并没有放松对王晓的严格要求，想各种办 法让他融入集体中，成为班上积极进步的一员。由此看出，这位老师在教学过程中贯 彻了尊重学生与严格要求学生相结合的原则。最后，这位老师在教学过程中贯彻了集体教育和个别教育相结合原则。该原则是 指在德育过程中，教育者要善于组织和教育学生热爱集体，并依靠集体教育每个学 生，同时通过对个别学生的教育来促进集体的形成和发展，从而把集体教育和个别教 育有机结合起来。材料中，老师和班干部讨论了与王晓的交友行动计划，让更多的同 学参与进来，关注他、帮助他、跟他交流，最后在同学们的帮助下王晓融入了这个班 集体，这是通过集体的力量来教育个人。同时，班级也因此获得了“包容友善先进班 集体”的称号，这是通过个别教育使班集体得到了发展。由此看出，这位老师在教学 过程中贯彻了集体教育和个别教育相结合的原则。总之，该老师在教学过程中能够根据学生的特点，遵循相关的德育原则进行针对 性教育，是值得学习的。(答出正面教育与纪律约束相结合，言之有理也可)","materialType":["学生行为案例","教学案例","班级管理案例"],"module":7,"keywords":["材料中的这位老师在教学中贯彻了以下德育原则","这位老师在教学过程中贯彻了因材施教原则","该原则","这位老师在教学过程中贯彻了依靠积极因素、克服消极因素的原则","这位老师在教学过程中贯彻了尊重学生与严格要求学生相结合的原则","彻了尊重学生与严格要求学生相结合的原则","这位老师在教学过程中贯彻了集体教育和个别教育相结合原则","过程中贯彻了集体教育和个别教育相结合的原则","遵循相关的德育原则"],"questionPosition":"Q30","moduleName":"中学德育","subTopics":["德育原则-因材施教","德育原则-依靠积极因素克服消极因素","德育原则-尊重与严格要求相结合","德育原则-集体教育与个别教育相结合","德育原则-正面教育与纪律约束相结合","德育方法-实际锻炼法","德育方法-品德评价法"],"coreConcepts":["因材施教原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则","集体教育与个别教育相结合原则","班集体建设"]},{"exam":"2019下","number":31,"material":"晓宁平时没有复习的习惯。还有一周就要期末考试了，他开始着急起来，并暗自 发誓要考出好成绩。他觉得只要自己努力，反复背诵就一定能取得好成绩，所以只要 有时间他就去背——背外语单词，背课文，背语法，背数学、物理公式和化学方程式 等。晓宁也不会合理安排时间，连课间休息的时间也不放过，从傍晚背到深夜，凌晨 四五点钟就又起床接着背，以致到了头昏脑胀的地步。他从没有哪次考试像这次考试 一样下这么大的功夫，原本以为一定能考出好成绩。然而，结果完全出乎他的意料， 各门功课成绩都很不理想。晓宁很失望，百思不得其解：到底什么地方出了问题?","subQuestions":[{"number":1,"question":"简述学生应该如何有效进行复习。","score":12,"answer":"①及时复习，经常复习。②合理分配时间。③分散复习与集中复习相结合。④反复阅读与试图回忆相结合。⑤复习方法要多样化。⑥运用多种感官参与复习。⑦复习内容的数量要适当，一次复习内容的数量不宜过多。⑧适当过度学习，过度学习50%效果最好。"},{"number":2,"question":"请指出晓宁复习中存在的主要问题。四、材料分析题","score":6,"answer":"晓宁在复习中主要存在以下问题：首先，晓宁没有做到合理分配时间。材料中，晓宁只要有时间就去背外语单词、 背课文、背语法等，连课间休息的时间也不放过，从傍晚背到深夜，早晨四五点钟就 又起床接着背，以致到了头昏脑胀的地步，说明他时间分配不合理。其次，晓宁没有做到及时复习，经常复习。材料中，晓宁平时没有复习的习惯， 还有一周就要考试了，他开始着急起来，利用所有时间冲刺复习，说明他平时没有做 到及时复习，经常复习。再次，晓宁没有做到复习方法多样化。材料中，晓宁觉得只要自己努力，反复背 诵就一定能取得好成绩，所以，只要有时间他就去背诵。他只是单一背诵，没有考虑 用其他的复习方法，复习过程中没有意识到运用分散复习与集中复习相结合、反复阅 读与试图回忆相结合、运用多种感官参与复习等多种方法来有效提高复习效果。最后，晓宁复习过程中动机太强。动机强度与工作效率之间的关系并不是一种线 性关系，而是倒U形曲线关系。中等强度的动机最有利于任务的完成，即动机强度 处于中等水平时，工作效率最高。材料中，晓宁觉得自己从来没有哪次考试像这次考 试一样下这么大的功夫，自以为一定能考出好成绩，这些都表明晓宁这次考试动机太 强，但过强的动机反而不利于考试任务的完成。"}],"fullAnswer":"(1)①及时复习，经常复习。②合理分配时间。③分散复习与集中复习相结合。④反复阅读与试图回忆相结合。⑤复习方法要多样化。⑥运用多种感官参与复习。⑦复习内容的数量要适当，一次复习内容的数量不宜过多。⑧适当过度学习，过度学习50%效果最好。(2)晓宁在复习中主要存在以下问题：首先，晓宁没有做到合理分配时间。材料中，晓宁只要有时间就去背外语单词、 背课文、背语法等，连课间休息的时间也不放过，从傍晚背到深夜，早晨四五点钟就 又起床接着背，以致到了头昏脑胀的地步，说明他时间分配不合理。其次，晓宁没有做到及时复习，经常复习。材料中，晓宁平时没有复习的习惯， 还有一周就要考试了，他开始着急起来，利用所有时间冲刺复习，说明他平时没有做 到及时复习，经常复习。再次，晓宁没有做到复习方法多样化。材料中，晓宁觉得只要自己努力，反复背 诵就一定能取得好成绩，所以，只要有时间他就去背诵。他只是单一背诵，没有考虑 用其他的复习方法，复习过程中没有意识到运用分散复习与集中复习相结合、反复阅 读与试图回忆相结合、运用多种感官参与复习等多种方法来有效提高复习效果。最后，晓宁复习过程中动机太强。动机强度与工作效率之间的关系并不是一种线 性关系，而是倒U形曲线关系。中等强度的动机最有利于任务的完成，即动机强度 处于中等水平时，工作效率最高。材料中，晓宁觉得自己从来没有哪次考试像这次考 试一样下这么大的功夫，自以为一定能考出好成绩，这些都表明晓宁这次考试动机太 强，但过强的动机反而不利于考试任务的完成。综上所述，晓宁在复习过程中，复习时间的安排、复习方法的选择以及学习动机 的强度上都存在问题。教师在以后的教学过程中，应当注意引导学生。","materialType":["学生心理案例"],"module":4,"keywords":["⑤复习方法","晓宁没有做到复习方法","用其他的复习方法","读与试图回忆相结合、运用多种感官参与复习等多种方法","复习时间的安排、复习方法"],"questionPosition":"Q31","moduleName":"学习心理","subTopics":["学习动机-耶克斯多德森定律","学习动机-归因理论","学习迁移-关系转换说","学习策略-资源管理策略","学习策略-复习方法","认知过程-注意品质"],"coreConcepts":["耶克斯-多德森定律","复习策略"]}]},{"exam":"2020下","rawFile":"20下 材料分析题 真题  科二.docx","items":[{"exam":"2020下","number":30,"material":"周老师教高一(5)班数学时，发现学生的知识基础差别较大，于是，她决定对 程度不同的学生提出不同任务和要求。对于学习基础较好的6位学生，周老师特别要 求他们到图书馆查找和阅读相关内容的书籍。经过自学，他们不但完成了规定的作业， 还选做了一些难度更大的习题。对于其他学生，周老师分别给他们布置了难易程度不 同的习题。在课堂教学中，周老师通过创设情境、多媒体教学、小组讨论等多种方式 调动学生学习的积极性和主动性，激发他们对所学内容的兴趣，同时提出问题让学生 深入思考。当学生感到困惑时，周老师耐心地加以辅导，让学生自己动脑、动手，找 到解决问题的方法。同学们通过解决问题，获取了知识，很好地完成了学习任务。","subQuestions":[{"number":1,"question":"周老师贯彻了哪些教学原则?","score":8,"answer":"周老师贯彻了以下教学原则：因材施教原则、直观性原则、启发性原则、量 力性原则。"},{"number":2,"question":"请结合材料对这些教学原则加以分析。","score":10,"answer":"第一，周老师贯彻了因材施教原则。因材施教原则是指教师要从学生的实际 情况、个别差异出发，有的放矢地进行教学。材料中，周老师发现学生的知识基础差 异较大，于是对程度不同的学生提出了不同的要求，这说明周老师做到了针对学生的 差异进行教育，符合因材施教原则的要求。第二，周老师贯彻了直观性原则。直观性原则是指教学中要通过学生观察所学事 物或教师语言形象的描述，引导学生形成对所学事物、过程的清晰表象，丰富他们的 感性认识，从而使他们能够正确理解书本知识和发展认识能力。材料中，周老师通过 创设情境、运用多媒体教学引导学生产生直观体验，符合直观性原则的要求。第三，周老师贯彻了启发性原则。启发性原则是指在教学中教师要注意调动学生 的学习主动性，引导他们独立思考、积极探索，生动活泼地学习。材料中，周老师在 教学过程中采用小组讨论的方式，调动学生的积极性和主动性，激发其学习兴趣、引 导其主动思考，符合启发性原则的要求。第四，周老师贯彻了量力性原则。量力性原则是指教学的内容、方法、分量和进 度要适合学生的身心发展。材料中，周老师给学生布置了难易程度不同的习题，说明 其考虑了学生的接受能力，符合量力性原则的要求。因此，周老师的教学体现了因材施教原则、直观性原则、启发性原则和量力性 原则。(答出理论联系实际原则，言之有理也可)"}],"fullAnswer":"(1)周老师贯彻了以下教学原则：因材施教原则、直观性原则、启发性原则、量 力性原则。(2)第一，周老师贯彻了因材施教原则。因材施教原则是指教师要从学生的实际 情况、个别差异出发，有的放矢地进行教学。材料中，周老师发现学生的知识基础差 异较大，于是对程度不同的学生提出了不同的要求，这说明周老师做到了针对学生的 差异进行教育，符合因材施教原则的要求。第二，周老师贯彻了直观性原则。直观性原则是指教学中要通过学生观察所学事 物或教师语言形象的描述，引导学生形成对所学事物、过程的清晰表象，丰富他们的 感性认识，从而使他们能够正确理解书本知识和发展认识能力。材料中，周老师通过 创设情境、运用多媒体教学引导学生产生直观体验，符合直观性原则的要求。第三，周老师贯彻了启发性原则。启发性原则是指在教学中教师要注意调动学生 的学习主动性，引导他们独立思考、积极探索，生动活泼地学习。材料中，周老师在 教学过程中采用小组讨论的方式，调动学生的积极性和主动性，激发其学习兴趣、引 导其主动思考，符合启发性原则的要求。第四，周老师贯彻了量力性原则。量力性原则是指教学的内容、方法、分量和进 度要适合学生的身心发展。材料中，周老师给学生布置了难易程度不同的习题，说明 其考虑了学生的接受能力，符合量力性原则的要求。因此，周老师的教学体现了因材施教原则、直观性原则、启发性原则和量力性 原则。(答出理论联系实际原则，言之有理也可)","materialType":["学生行为案例","教学案例"],"module":3,"keywords":["(1)周老师贯彻了以下教学原则","：因材施教原则","、直观性原则","、启发性原则","力性原则","周老师贯彻了因材施教原则","因材施教原则","符合因材施教原则","周老师贯彻了直观性原则","直观性原则","符合直观性原则","周老师贯彻了启发性原则","启发性原则","符合启发性原则","周老师贯彻了量力性原则","量力性原则","是指教学的内容、方法","符合量力性原则","周老师的教学体现了因材施教原则","(答出理论","联系实际原则"],"questionPosition":"Q30","moduleName":"中学教学","subTopics":["教学原则-直观性","教学原则-启发性","教学原则-量力性","教学原则-理论联系实际","教学原则-因材施教","教学方法-讨论法","教学方法-读书指导法","教学方法-情境教学法"],"coreConcepts":["因材施教原则","直观性原则","启发性原则","理论联系实际原则","量力性原则"]},{"exam":"2020下","number":31,"material":"下面是一位学生给老师的求助信。许老师：您好!我在初中的学习成绩一直很好，可上高中以来学习成绩却不是很理想，尤其是近 几次考试都没考好，这让我很沮丧，越来越不自信。现在一提到考试，我就浑身不自 在，怀疑自己到底能不能把成绩提高。在平时学习中，我都能很好地理解知识、完成 作业，老师和同学们也认为我的能力较强，常常推荐我参加一些学习竞赛，但我都推 辞了，觉得自己能力不够，不能胜任。有时候我会不由自主地想：我能行吗?我还能 考好吗?我是不是再也考不出好成绩了?老师，我特别希望改变我目前的状态，在以后的考试中取得好成绩，不辜负老师 和同学对我的信任，因此我希望得到您的帮助，谢谢!学生：海波 3月31 日","subQuestions":[{"number":1,"question":"请根据自我效能感理论分析这位学生的问题及问题产生的原因。","score":10,"answer":"问题：材料中的这位同学所出现的问题是自我效能感过低。自我效能感是指 个人对自己是否具有通过努力成功完成某种活动的能力所持有的主观判断与信念。这 位同学总是觉得自己不能胜任相应的活动，总是思考“我能行吗”,说明其自我效能感较低。问题产生的原因：这位同学可能是受到了自身成败经验的影响。个人自身行为的 成败经验是影响自我效能感最主要的因素。一般来说，成功经验会提高自我效能感， 反复的失败会降低自我效能感。材料中，这位同学上高中以来学习成绩不是很理想， 几次考试都没有考好，导致其越来越不自信，说明是其自身的成败经验影响了自我效 能感。"},{"number":2,"question":"如果你是许老师，应该如何帮助这位学生?四、材料分析题","score":8,"answer":"如果我是许老师，我会采取以下措施帮助这位学生：第一，设置难度适当的题目，帮助该同学获得成功的经验。第二，为其提供正面的替代性经验。他人的替代经验也会影响自我效能，当个体 看到与自己的能力水平相当的人在活动中取得成功时，便相信当自己处于类似活动情 境时，也能获得同样的成功，从而提高自我效能感。反之亦然。第三，进行积极的言语劝说。通过说理让学生相信自己具有能力，相信自己能够 胜任学习活动，完成学习任务，就会给学生增添学习活动的动力，增强克服困难的 毅力。第四，调整负面情绪，进行正面情绪的唤醒。当人们不被讨厌刺激所困扰时更能 期望成功。例如，紧张焦虑、精力不佳，容易降低人们对自我效能的判断。第五，引导学生进行恰当的归因。该学生总是将自己的失败归因于自身不行，这 是进行了能力归因，长此以往会产生习得性无助。作为老师，我会引导学生进行努力 归因，引导其意识到只要努力就能取得成功。总之，我会根据该学生的特征，有针对性地采取相应的教育措施，促使其自我效 能感的提高。"}],"fullAnswer":"(1)问题：材料中的这位同学所出现的问题是自我效能感过低。自我效能感是指 个人对自己是否具有通过努力成功完成某种活动的能力所持有的主观判断与信念。这 位同学总是觉得自己不能胜任相应的活动，总是思考“我能行吗”,说明其自我效能感较低。问题产生的原因：这位同学可能是受到了自身成败经验的影响。个人自身行为的 成败经验是影响自我效能感最主要的因素。一般来说，成功经验会提高自我效能感， 反复的失败会降低自我效能感。材料中，这位同学上高中以来学习成绩不是很理想， 几次考试都没有考好，导致其越来越不自信，说明是其自身的成败经验影响了自我效 能感。(2)如果我是许老师，我会采取以下措施帮助这位学生：第一，设置难度适当的题目，帮助该同学获得成功的经验。第二，为其提供正面的替代性经验。他人的替代经验也会影响自我效能，当个体 看到与自己的能力水平相当的人在活动中取得成功时，便相信当自己处于类似活动情 境时，也能获得同样的成功，从而提高自我效能感。反之亦然。第三，进行积极的言语劝说。通过说理让学生相信自己具有能力，相信自己能够 胜任学习活动，完成学习任务，就会给学生增添学习活动的动力，增强克服困难的 毅力。第四，调整负面情绪，进行正面情绪的唤醒。当人们不被讨厌刺激所困扰时更能 期望成功。例如，紧张焦虑、精力不佳，容易降低人们对自我效能的判断。第五，引导学生进行恰当的归因。该学生总是将自己的失败归因于自身不行，这 是进行了能力归因，长此以往会产生习得性无助。作为老师，我会引导学生进行努力 归因，引导其意识到只要努力就能取得成功。总之，我会根据该学生的特征，有针对性地采取相应的教育措施，促使其自我效 能感的提高。","materialType":["学生心理案例"],"module":4,"keywords":[],"questionPosition":"Q31","moduleName":"学习心理","subTopics":["学习动机-成就动机理论","学习动机-归因理论","学习动机-自我效能感","学习动机-期待理论","学习迁移-形式训练说","学习策略-资源管理策略","建构主义-学习观","知识学习-知识直观"],"coreConcepts":["自我效能感理论"]}]},{"exam":"2021上","rawFile":"21上 材料分析题 真题 科二.docx","items":[{"exam":"2021上","number":30,"material":"上学期初，我们班转来个学生叫王伟，他沉迷于网络游戏，导致学习不认真，对 班级活动漠不关心，还常常旷课。我对王伟定期家访，在家访中了解到，早在王伟读 小学的时候，父母为了不让他到处乱跑，便常给他零花钱让他去玩电子游戏，以至于 形成了网瘾。鉴于此，我建议王伟的父母多抽些时间来与他交流、沟通，并控制好他 的零花钱，尽可能地限制他玩网络游戏。同时，我发动全班同学利用报刊、网络收集资料，并召开了一次题为“网络游戏 给我们带来什么”的主题班会。通过激烈辩论，最终同学们得出的结论是：中学生玩 网络游戏的弊远远大于利，我们不能沉迷于网络游戏。王伟在班会课后感中写道：“通 过主题班会，我才真正意识到经常旷课上网是多么愚蠢。过去我对学习一直不感兴趣， 上课听不懂，整天无所事事，为了消磨时间，我就常常逃课去上网了……&quot;针对王伟的情况，我语重心长地与他谈心，并为他采取了一项措施：他每坚持一 天不上网，就会有一位同学给他写上一句祝福或鼓励的话。我们班共有50个同学， 有49颗火热的心愿意帮助他。我希望他不要辜负同学们的期望，王伟爽快地说：“没 问题。”此外，为了培养王伟对班集体的责任心，我与班委协商，让他担任学校清洁区卫 生评分员，他也乐意地接受了。同时，同学们充分发掘王伟的特长，在每次出黑板报 时，就把画报头和插图的任务交给他。班干部们也非常热心，主动担任王伟各科学习 的辅导员，常常辅导他做作业。一学期过去了，他不再沉迷于网络游戏，学习成绩比 以前明显提高，思想也有了很大进步。","subQuestions":[{"number":1,"question":"材料中的“我”贯彻了哪些德育原则?结合材料加以分析。(10分)","score":8,"answer":"材料中的“我”贯彻了疏导原则。疏导原则是指教育者进行德育时要循循 善诱，以理服人，从提高学生的认识入手，调动学生的主动性，使他们积极向上。材 料中的“我”面对王伟的情况，召开主题班会提高他的思想意识，并语重心长地与他 谈心，体现了疏导原则。"}],"fullAnswer":"材料中的“我”贯彻了疏导原则，知行统一原则，教育影响的一致性与连贯性原 则，集体教育和个别教育相结合的原则，因材施教原则，依靠积极因素、克服消极因 素原则，尊重学生与严格要求学生相结合的原则。第一，材料中的“我”贯彻了疏导原则。疏导原则是指教育者进行德育时要循循 善诱，以理服人，从提高学生的认识入手，调动学生的主动性，使他们积极向上。材 料中的“我”面对王伟的情况，召开主题班会提高他的思想意识，并语重心长地与他 谈心，体现了疏导原则。第二，材料中的“我”贯彻了知行统一原则。知行统一原则是指既要重视思想道 德的理论教育，又要重视组织学生参加实践锻炼，把提高认识和行为养成结合起来， 使学生做到言行一致、表里如一。材料中的“我”通过组织班会提高王伟的思想意识， 并要求王伟坚持不上网，让他担任班干部，参与出黑板报，体现了知行统一原则。第三，材料中的“我”贯彻了教育影响的一致性与连贯性原则。教育影响的一致 性与连贯性原则是指教育者进行德育时，应当有目的、有计划地把来自各方面的对学 生的教育影响加以组织、调节、整合，使其互相配合、协调一致、前后连贯地进行， 以保障学生的品德能按教育目的的要求发展。材料中的“我”对王伟定期家访，并与 他的父母沟通对王伟的教育，体现了教育影响的一致性与连贯性原则。第四，材料中的“我”贯彻了集体教育和个别教育相结合的原则。集体教育和个 别教育相结合的原则是指，在德育过程中，教育者要善于组织和教育学生热爱集体， 并依靠集体教育每个学生，同时通过对个别学生的教育来促进集体的形成和发展，从 而把集体教育和个别教育有机结合起来。材料中的“我”发动全班同学召开主题班会， 并集体对王伟的上网行为进行监督，帮助王伟摆脱网瘾，体现了集体教育和个别教育 相结合的原则。第五，材料中的“我”贯彻了因材施教原则。因材施教原则是指，教育者进行德 育时，要从学生品德发展的实际出发，根据学生的年龄特征和个性差异进行不同的教育，使每个学生的品德都能得到更好的发展。材料中的“我”能够针对王伟的情况采 取相应的定期家访、召开主题班会等措施，帮助王伟摆脱网瘾，使其取得较大进步， 体现了因材施教原则。第六，材料中的“我”贯彻了依靠积极因素、克服消极因素的原则。依靠积极因 素、克服消极因素的原则是指，在德育工作中，教育者要善于依靠和发扬学生自身的 积极因素，调动学生自我教育的积极性，克服消极因素，实现品德发展内部矛盾的转 化。材料中的“我”能够一分为二地看待学生，发现王伟的特长，调动他自我教育的 积极性，体现了依靠积极因素、克服消极因素的原则。第七，材料中的“我”贯彻了尊重学生与严格要求学生相结合的原则。尊重学生 与严格要求学生相结合的原则是指，教育者进行德育时，要把对学生个人的尊重和信 赖与对他们的严格要求结合起来，使教育者对学生的影响与要求易于转化为学生的品 德。材料中，针对王伟的情况，“我”语重心长地与他谈心，并为他采取了一项措施： 他每坚持一天不上网，就会有一位同学给他写上一句祝福或鼓励的话。这体现了尊重 学生与严格要求学生相结合的原则。综上所述，材料中的“我”能够贯彻德育原则，帮助学生取得进步，值得学习。","materialType":["学生心理案例","学生行为案例","班级管理案例","德育案例","家校案例"],"module":7,"keywords":["材料中的“我”贯彻了疏导原则","知行统一原则","集体教育和个别教育相结合的原则","因材施教原则","素原则","尊重学生与严格要求学生相结合的原则","疏导原则","体现了疏导原则","材料中的“我”贯彻了知行统一原则","德的理论","体现了知行统一原则","材料中的“我”贯彻了教育影响的一致性与连贯性原则","性与连贯性原则","体现了教育影响的一致性与连贯性原则","材料中的“我”贯彻了集体教育和个别教育相结合的原则","别教育相结合的原则","相结合的原则","材料中的“我”贯彻了因材施教原则","体现了因材施教原则","材料中的“我”贯彻了依靠积极因素、克服消极因素的原则","素、克服消极因素的原则","体现了依靠积极因素、克服消极因素的原则","材料中的“我”贯彻了尊重学生与严格要求学生相结合的原则","与严格要求学生相结合的原则","学生与严格要求学生相结合的原则","材料中的“我”能够贯彻德育原则"],"questionPosition":"Q30","moduleName":"中学德育","subTopics":["德育原则-疏导原则","德育原则-因材施教","德育原则-依靠积极因素克服消极因素","德育原则-尊重与严格要求相结合","德育原则-集体教育与个别教育相结合","德育原则-一致性与连贯性","德育原则-知行统一","德育方法-说服教育法","德育方法-实际锻炼法","德育方法-自我修养法"],"coreConcepts":["因材施教原则","疏导原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则","集体教育与个别教育相结合原则","一致性与连贯性原则"]},{"exam":"2021上","number":31,"material":"初中开学的第一天，七年级(1)班班主任李老师到班级开班会，她在点名的过 程中看到了一个比较熟悉的名字。“上官文俐?”“到。”“你是不是有个姐姐叫上官文伶?”“是的。”“我记得上官文伶，她是我前几年带过的学生，她学习很努力，成绩优秀，平时 很有礼貌，大家都很喜欢她。我看你和她长得非常像，在各个方面你也应该像她一样 优秀。”两个月后，班主任推荐上官文俐参加学校的中学生创新竞赛，结果她取得了好成 绩。得知这个好消息后，李老师对她说：“正如我想的那样，你不但爱学习，还很有 创新意识。”在随后的日子里，上官文俐努力学习，团结同学，积极为班级服务，努 力使自己成为李老师所期望的像她姐姐一样优秀的学生。","subQuestions":[{"number":1,"question":"结合案例阐述教师期望的作用，及其对教育的启示。(8分)四、材料分析题","score":10,"answer":"该案例中的老师正确运用了教师的期望效应。教师的期望效应指的是教师的期望或明或暗地被传送给学生，学生会按照教师所 期望的方向来塑造自己的行为习惯。材料中，李老师希望上官文俐同学和她姐姐一样 努力学习、成绩优秀、讲礼貌。后来，上官文俐在两个月后的创新竞赛中取得了好成 绩，李老师说她不但爱学习，还很有创新意识，结果她努力学习，团结同学，积极为 班级服务，努力使自己成为李老师所期望的像她姐姐一样优秀的学生。这正体现了教 师期望的作用。该案例给予我们以下教育启示：①作为教师，我们应给予班级内的每一位学生更多的鼓励与期望，有意识或无意 识地寄予学生期望，多给他们一些积极的期待，让他们增强自信心，对自己的人生前 途充满信心。②作为教师，我们应该用发展的眼光看待每一位学生，尤其是后进生。我们应该 努力发现每一位学生身上的闪光点。③作为教师，在与学生交往的过程中，我们应该对学生多关心、多热爱、多表扬、 多肯定、多赞美、多奖励、多帮助。④作为教师，进行教育时应该遵循“教育要面向全体学生”的原则。我们要做到教育不要仅限于少数学生，而是要面向全体学生。⑤作为教师，我们应该带领学生向好的方向发展，防止用消极的期望引导学生向 坏的方向发展。⑥作为教师，我们应对学生因材施教，针对学生之间的个别差异，有的放矢地进 行教育。"}],"fullAnswer":"该案例中的老师正确运用了教师的期望效应。教师的期望效应指的是教师的期望或明或暗地被传送给学生，学生会按照教师所 期望的方向来塑造自己的行为习惯。材料中，李老师希望上官文俐同学和她姐姐一样 努力学习、成绩优秀、讲礼貌。后来，上官文俐在两个月后的创新竞赛中取得了好成 绩，李老师说她不但爱学习，还很有创新意识，结果她努力学习，团结同学，积极为 班级服务，努力使自己成为李老师所期望的像她姐姐一样优秀的学生。这正体现了教 师期望的作用。该案例给予我们以下教育启示：①作为教师，我们应给予班级内的每一位学生更多的鼓励与期望，有意识或无意 识地寄予学生期望，多给他们一些积极的期待，让他们增强自信心，对自己的人生前 途充满信心。②作为教师，我们应该用发展的眼光看待每一位学生，尤其是后进生。我们应该 努力发现每一位学生身上的闪光点。③作为教师，在与学生交往的过程中，我们应该对学生多关心、多热爱、多表扬、 多肯定、多赞美、多奖励、多帮助。④作为教师，进行教育时应该遵循“教育要面向全体学生”的原则。我们要做到教育不要仅限于少数学生，而是要面向全体学生。⑤作为教师，我们应该带领学生向好的方向发展，防止用消极的期望引导学生向 坏的方向发展。⑥作为教师，我们应对学生因材施教，针对学生之间的个别差异，有的放矢地进 行教育。","materialType":["学生心理案例","学生行为案例","班级管理案例"],"module":8,"keywords":["该案例中的老师正确运用了教师的期望效应","教师的期望效应","进行教育时应该遵循“教育要面向全体学生”的原则"],"questionPosition":"Q31","moduleName":"班级管理","subTopics":["班级管理-班集体建设","班级管理-课堂管理","班主任-工作内容","教师心理-教师期望效应","教师心理-教师成长阶段"],"coreConcepts":["因材施教原则","教师期望效应"]}]},{"exam":"2021下","rawFile":"21下 材料分析题 真题 科二.docx","items":[{"exam":"2021下","number":30,"material":"新学期，班主任李老师接了一个新班，李老师第一天走进教室，发现卫生状况非 常差，桌仰椅翻，污物满地。看到这种情景时，李老师一声不吭地拿起扫帚把地面打 扫干净，然后又把桌椅重新摆好，一切都收拾好了，才请同学们进教室上课。坐在老 师打扫过的教室，全班同学一个个出奇地规矩。第二天，老师依旧如此，有些同学说：“李老师，让我们打扫吧。”李老师微笑着 说：“不，这一周我做值日。”一星期后，李老师安排了值日表，每天值日的学生都非 常认真负责，就连卫生角落也打扫得干干净净。教室卫生向来由学生轮流打扫，很少见过老师也做值日的。李老师不仅这样做了， 而且做在学生之前，做得一丝不苟。学生由起初的费解到后来的愧疚，以致最后肃然 起敬。在李老师的带动下，这个有名的卫生差班，周周都能得到卫生流动红旗，还不 时得到学校的表扬。","subQuestions":[{"number":1,"question":"李老师主要运用了哪种德育方法?","score":4,"answer":"李老师使用的是榜样示范法。材料中，李老师以身作则，通过自身打扫卫生 的模范行为给学生树立了良好的榜样，体现了榜样示范法。"},{"number":2,"question":"结合材料分析这一德育方法的含义和运用要求。","score":14,"answer":"榜样示范法是指用榜样人物的高尚思想、模范行为、优异成就来影响学生的 思想、情感和行为的方法。414运用榜样示范法要注意以下几方面：首先，选好学习的榜样。材料中，李老师将自己选作学生学习的榜样，在打扫教 室卫生的活动中以身作则，做好了示范，选好了榜样。其次，激起学生对榜样的敬慕之情。材料中，李老师自己打扫卫生的做法得到了 学生认可，使学生对李老师肃然起敬，激发了学生对榜样的敬慕之情。最后，引导学生用榜样来调节行为，提高修养。材料中，学生在对李老师产生敬 慕之情后，逐渐将这种情感转化为切实的卫生行动，最后使班级获得了流动红旗，体 现出引导学生运用榜样调节自身行为的要求。"}],"fullAnswer":"(1)李老师使用的是榜样示范法。材料中，李老师以身作则，通过自身打扫卫生 的模范行为给学生树立了良好的榜样，体现了榜样示范法。(2)榜样示范法是指用榜样人物的高尚思想、模范行为、优异成就来影响学生的 思想、情感和行为的方法。414运用榜样示范法要注意以下几方面：首先，选好学习的榜样。材料中，李老师将自己选作学生学习的榜样，在打扫教 室卫生的活动中以身作则，做好了示范，选好了榜样。其次，激起学生对榜样的敬慕之情。材料中，李老师自己打扫卫生的做法得到了 学生认可，使学生对李老师肃然起敬，激发了学生对榜样的敬慕之情。最后，引导学生用榜样来调节行为，提高修养。材料中，学生在对李老师产生敬 慕之情后，逐渐将这种情感转化为切实的卫生行动，最后使班级获得了流动红旗，体 现出引导学生运用榜样调节自身行为的要求。","materialType":["学生行为案例","教学案例","班级管理案例"],"module":7,"keywords":["思想、情感和行为的方法"],"questionPosition":"Q30","moduleName":"中学德育","subTopics":["德育方法-榜样示范法","德育方法-实际锻炼法","德育方法-自我修养法"],"coreConcepts":["榜样示范法"]},{"exam":"2021下","number":31,"material":"王老师是初中语文老师，根据教学进度安排，最近她开始讲授古代诗歌单元。在 教学时，她先是引导学生探索五言绝句的平仄规律，刚开始学生总结不准确，经过多 次讲解和引导，学生掌握了五言绝句的平仄规律。随后，王老师发现，当学生又学习 五言律诗时，他们很快就能总结出五言律诗的平仄规律。再后来，当学生学习七言律 诗时，也很快总结出了其平仄规律。本单元结束后，王老师进行教学反思：学生之所以能够很容易地总结出七言律诗 的平仄规律，是因为学生已经掌握了五言绝句、五言律诗的平仄规律；他们利用已掌 握的方法进行分析，很快就能总结出七言律诗的平仄规律。","subQuestions":[{"number":1,"question":"请用迁移相关理论分析上述学习现象。","score":10,"answer":"材料中的学习现象体现了概括化迁移理论。贾德认为，在先期学习A中所 获得的东西，之所以能迁移到后期的学习B中，是因为在学习A时获得了一般原理， 这种一般原理可以部分或全部运用于A、B之中。根据这一理论，两个学习活动之间 存在的共同成分，只是产生迁移的必要前提，而产生迁移的关键是，学习者在两种活 动中概括出它们之间的共同原理。所以贾德的迁移理论又称“概括说”或“类化说”。材料中，学生已经掌握了五言绝句的平仄规律，而平仄规律是五言绝句、五言律 诗和七言律诗的共同原理，因此，学生可以很容易地总结出五言律诗以及七言律诗的 平仄规律。这体现了概括化原理的掌握对迁移的影响。"},{"number":2,"question":"该迁移理论对教学有何启示?四、材料分析题","score":8,"answer":"角度1:①精选教材。教师应选择那些具有广泛迁移价值的科学成果作为教 材的基本内容。②合理编排教学内容。从迁移的角度来看，合理编排的标准就是使教材达到结构 化、一体化、网络化。③合理安排教学程序。教学中应将基本的知识、技能和态度等规律性内容作为教 学的主干结构，并依此进行教学。④教授学习策略，提高迁移意识性。仅教给学生组织良好的信息是不够的，还需 要使学生了解在什么条件下迁移所学的内容、迁移的有效性如何等。角度2:概括化理论对教学的启示：教师在教学中应注意启发学生对所学内容进行概括总结。具体来说，需要做到以下几点：①在教学中注意引导学生自己总结出概括化的原理，培养和提高其概括总结的能 力，充分利用原理、原则的迁移。②在讲解原理、原则时，要列举各种变式，使学生正确把握其内涵和外延；同时 应结合原理、原则的具体运用情境进行讲解和学习，使学生能脱离学习原理、原则的 背景而把握其实质，并能在遇到该原理、原则适用的背景时，准确地运用原理、原则去学习新知识或解决新问题，以防止学生对某一原理、原则的理解和运用局限于习得 该原理、原则时的情境的情况。③教师要采取多种教学措施，帮助学生理解所学的基本知识，使学生学会概括的 方法，提高概括的水平，并在此基础上进行复习和练习，以达到熟练记忆和运用的 目的。"}],"fullAnswer":"(1)材料中的学习现象体现了概括化迁移理论。贾德认为，在先期学习A中所 获得的东西，之所以能迁移到后期的学习B中，是因为在学习A时获得了一般原理， 这种一般原理可以部分或全部运用于A、B之中。根据这一理论，两个学习活动之间 存在的共同成分，只是产生迁移的必要前提，而产生迁移的关键是，学习者在两种活 动中概括出它们之间的共同原理。所以贾德的迁移理论又称“概括说”或“类化说”。材料中，学生已经掌握了五言绝句的平仄规律，而平仄规律是五言绝句、五言律 诗和七言律诗的共同原理，因此，学生可以很容易地总结出五言律诗以及七言律诗的 平仄规律。这体现了概括化原理的掌握对迁移的影响。(2)角度1:①精选教材。教师应选择那些具有广泛迁移价值的科学成果作为教 材的基本内容。②合理编排教学内容。从迁移的角度来看，合理编排的标准就是使教材达到结构 化、一体化、网络化。③合理安排教学程序。教学中应将基本的知识、技能和态度等规律性内容作为教 学的主干结构，并依此进行教学。④教授学习策略，提高迁移意识性。仅教给学生组织良好的信息是不够的，还需 要使学生了解在什么条件下迁移所学的内容、迁移的有效性如何等。角度2:概括化理论对教学的启示：教师在教学中应注意启发学生对所学内容进行概括总结。具体来说，需要做到以下几点：①在教学中注意引导学生自己总结出概括化的原理，培养和提高其概括总结的能 力，充分利用原理、原则的迁移。②在讲解原理、原则时，要列举各种变式，使学生正确把握其内涵和外延；同时 应结合原理、原则的具体运用情境进行讲解和学习，使学生能脱离学习原理、原则的 背景而把握其实质，并能在遇到该原理、原则适用的背景时，准确地运用原理、原则去学习新知识或解决新问题，以防止学生对某一原理、原则的理解和运用局限于习得 该原理、原则时的情境的情况。③教师要采取多种教学措施，帮助学生理解所学的基本知识，使学生学会概括的 方法，提高概括的水平，并在此基础上进行复习和练习，以达到熟练记忆和运用的 目的。","materialType":["教学案例"],"module":4,"keywords":["(1)材料中的学习现象体现了概括化迁移理论","根据这一理论","所以贾德的迁移理论","学生已经掌握了五言绝句的平仄规律","而平仄规律","平仄规律","教学中应将基本的知识、技能和态度等规律","④教授学习策略","角度2:概括化理论","充分利用原理、原则","②在讲解原理、原则","应结合原理、原则","使学生能脱离学习原理、原则","并能在遇到该原理、原则","准确地运用原理、原则","以防止学生对某一原理、原则","该原理、原则"],"questionPosition":"Q31","moduleName":"学习心理","subTopics":["学习动机-需要层次理论","学习迁移-经验类化说","学习迁移-认知结构说","学习策略-认知策略","学习策略-复习方法","行为主义-经典条件反射","认知主义-布鲁纳认知结构","建构主义-学习观","认知过程-注意品质","认知过程-记忆与遗忘","知识学习-知识概括","技能学习-操作技能"],"coreConcepts":["学习迁移理论"]}]},{"exam":"2022上","rawFile":"22上 材料分析题  真题 科二.docx","items":[{"exam":"2022上","number":30,"material":"在我担任初二(5)班班主任的时候，有一次家校联系日，一位家长带着孩子到 我的办公室找我谈话。其间，家长不停数落孩子，把孩子说得一无是处，孩子一直低 着头。由于我在班上对这个学生也比较关注，尽管他成绩靠后，但是也有一些长处， 所以待家长说完后，我马上说道：“这孩子最近在学校表现还不错，学习的劲头也有， 也能认真听课，我想以后成绩肯定会有进步的。”说完，那孩子抬起头来，看了看我， 他的眼睛里含着泪水……在这以前，我很少正面表扬过他。这个孩子平时挺踏实，乐于帮助同学，也有一 定的上进心。经过这次当着家长面的表扬，他学习的积极性更高了，学习成绩提高到 了班级的中上游。所以，无论是怎样的学生，都还是个孩子，需要鼓励和帮助，必要 的时候夸一夸学生，能给他们打不少气，为学习增加动力。","subQuestions":[{"number":1,"question":"结合材料分析这位老师的做法贯彻了哪一德育原则。","score":8,"answer":"材料中的老师贯彻了依靠积极因素、克服消极因素的德育原则。该原则是指 在德育工作中，教育者要善于依靠、发扬学生自身的积极因素，调动学生自我教育的积极性，克服消极因素，实现品德发展内部矛盾的转化。材料中，当老师听到家长把 孩子骂得一无是处的时候，能够及时地提到孩子学习劲头足、上课非常认真的优点， 并在家长面前表扬孩子，从而增加了孩子的自信心，使孩子的成绩也得到提高，这体 现了依靠积极因素、克服消极因素这一原则。"},{"number":2,"question":"阐述贯彻该德育原则的基本要求。57","score":10,"answer":"贯彻依靠积极因素、克服消极因素原则的要求包括：①教育者要用一分为二的观点，全面分析，客观地评价学生的优点和不足。②教育者要有意识地创造条件，将学生思想中的消极因素转化为积极因素。③教育者要提高学生自我认识、自我评价能力，启发他们自觉思考，克服缺点， 发扬优点。"}],"fullAnswer":"(1)材料中的老师贯彻了依靠积极因素、克服消极因素的德育原则。该原则是指 在德育工作中，教育者要善于依靠、发扬学生自身的积极因素，调动学生自我教育的积极性，克服消极因素，实现品德发展内部矛盾的转化。材料中，当老师听到家长把 孩子骂得一无是处的时候，能够及时地提到孩子学习劲头足、上课非常认真的优点， 并在家长面前表扬孩子，从而增加了孩子的自信心，使孩子的成绩也得到提高，这体 现了依靠积极因素、克服消极因素这一原则。(2)贯彻依靠积极因素、克服消极因素原则的要求包括：①教育者要用一分为二的观点，全面分析，客观地评价学生的优点和不足。②教育者要有意识地创造条件，将学生思想中的消极因素转化为积极因素。③教育者要提高学生自我认识、自我评价能力，启发他们自觉思考，克服缺点， 发扬优点。","materialType":["学生心理案例","学生行为案例","班级管理案例","家校案例"],"module":7,"keywords":["(1)材料中的老师贯彻了依靠积极因素、克服消极因素的德育原则","该原则","现了依靠积极因素、克服消极因素这一原则","(2)贯彻依靠积极因素、克服消极因素原则"],"questionPosition":"Q30","moduleName":"中学德育","subTopics":["德育原则-依靠积极因素克服消极因素","德育原则-正面教育与纪律约束相结合","德育原则-知行统一","德育方法-说服教育法","德育方法-品德评价法","德育方法-自我修养法"],"coreConcepts":["依靠积极因素克服消极因素原则"]},{"exam":"2022上","number":31,"material":"王老师是一名新入职的高中数学老师，刚刚上了一周多课，就发现班上学生对她 的课不感兴趣，有些学生上课“开小差”,有些学生一脸困意。她原以为是这些学生 对学习不积极，经深人了解，她发现自己讲的知识很多学生都已经在课下学习中掌握 了，所以感到自己目前讲的教学内容太容易，觉得无聊。于是王老师大幅提升了课堂 教学内容和家庭作业的难度，以为这可以引起学生的兴趣。结果这回学生们却反映上 课听不懂，作业不会做。王老师苦思冥想：为什么自己教学效果不好?随后她向数学 教学经验丰富的张老师请教，如何才能把握好数学教学内容的难度。张老师跟王老师 说：“你要让学生跳一跳能摘到桃子。”","subQuestions":[{"number":1,"question":"请用维果斯基的理论，分析王老师的教学存在什么问题。------","score":10,"answer":"在教学和发展的关系上，维果斯基提出了最近发展区理论，认为儿童有两种 发展水平：一是儿童的现有水平，即由一定的已经完成的发展系统所形成的儿童心理 机能的发展水平；二是即将达到的发展水平。这两种水平之间的差异就是“最近发展 区”,也就是说，儿童在有指导的情况下，借助成人帮助所能达到的解决问题的水平 与独自解决问题所达到的水平之间的差异，实际上是两个邻近发展阶段间的过渡。材 料中，王老师刚开始讲课比较简单，调整后难度加大，先是低于学生的最近发展区， 后是高于学生的最近发展区，说明王老师对学生的知识储备情况和学业发展水平了解 不够准确，造成其教学效果不佳。"},{"number":2,"question":"结合案例，指出如何让学生“跳一跳能摘到桃子”。","score":8,"answer":"“跳一跳能摘到桃子”体现的是维果斯基的最近发展区思想，维果斯基在此 基础上提出了教学应当走在发展的前面，以促进学生的发展。为了实现摘到“桃子”, 教师可从以下四个方面入手：①加强备课。教师备课要做好三方面工作：钻研教材、了解学生、设计教法。材 料中，王老师在备课过程中，不仅要备教材、备知识，还要了解学生，了解学生的认 知特点和水平，并选用灵活多样的教学方法，才能达到良好的课堂效果，进一步促进 学生的发展。②注重教学过程中的启发诱导，鼓励学生参与教学。材料中，王老师在教学中可 以采用问答法、讨论法等方法来启发学生独立思考，并发扬教学民主，引导学生针 对更好地开展教学活动提出意见或建议，提高学生的参与感，真正发挥学生的主体 作用。③发挥课外作业的迁移作用，培养学生运用知识的能力。材料中，王老师在布置 课外作业时应注意分量适宜，难度适宜，且作业形式多样化，充分发挥作业的积极迁 移作用，积极引导学生将所学知识付诸实践。④发挥评价促进学生发展的积极作用。材料中，王老师可通过开展数学竞赛的形 式，激发学生学习数学的兴趣和求知欲；在对学生进行评价时鼓励学生参与评价，且 评价内容、形式、标准应多样化，让学生在数学学习中获得成就感的同时爱上数学， 爱上学习。"}],"fullAnswer":"(1)在教学和发展的关系上，维果斯基提出了最近发展区理论，认为儿童有两种 发展水平：一是儿童的现有水平，即由一定的已经完成的发展系统所形成的儿童心理 机能的发展水平；二是即将达到的发展水平。这两种水平之间的差异就是“最近发展 区”,也就是说，儿童在有指导的情况下，借助成人帮助所能达到的解决问题的水平 与独自解决问题所达到的水平之间的差异，实际上是两个邻近发展阶段间的过渡。材 料中，王老师刚开始讲课比较简单，调整后难度加大，先是低于学生的最近发展区， 后是高于学生的最近发展区，说明王老师对学生的知识储备情况和学业发展水平了解 不够准确，造成其教学效果不佳。(2)“跳一跳能摘到桃子”体现的是维果斯基的最近发展区思想，维果斯基在此 基础上提出了教学应当走在发展的前面，以促进学生的发展。为了实现摘到“桃子”, 教师可从以下四个方面入手：①加强备课。教师备课要做好三方面工作：钻研教材、了解学生、设计教法。材 料中，王老师在备课过程中，不仅要备教材、备知识，还要了解学生，了解学生的认 知特点和水平，并选用灵活多样的教学方法，才能达到良好的课堂效果，进一步促进 学生的发展。②注重教学过程中的启发诱导，鼓励学生参与教学。材料中，王老师在教学中可 以采用问答法、讨论法等方法来启发学生独立思考，并发扬教学民主，引导学生针 对更好地开展教学活动提出意见或建议，提高学生的参与感，真正发挥学生的主体 作用。③发挥课外作业的迁移作用，培养学生运用知识的能力。材料中，王老师在布置 课外作业时应注意分量适宜，难度适宜，且作业形式多样化，充分发挥作业的积极迁 移作用，积极引导学生将所学知识付诸实践。④发挥评价促进学生发展的积极作用。材料中，王老师可通过开展数学竞赛的形 式，激发学生学习数学的兴趣和求知欲；在对学生进行评价时鼓励学生参与评价，且 评价内容、形式、标准应多样化，让学生在数学学习中获得成就感的同时爱上数学， 爱上学习。","materialType":["学生行为案例","教学案例","家校案例"],"module":5,"keywords":["维果斯基提出了最近发展区理论","实际上是两个邻近发展阶段","并选用灵活多样的教学方法","以采用问答法、讨论法等方法"],"questionPosition":"Q31","moduleName":"发展心理","subTopics":["皮亚杰-认知发展阶段","维果斯基-最近发展区","埃里克森-人格发展阶段","人格-性格形成因素","身心发展-青春期心理","身心发展-个体差异"],"coreConcepts":["维果斯基最近发展区理论"]}]},{"exam":"2022下","rawFile":"22下 材料分析题 真题 科二.docx","items":[{"exam":"2022下","number":30,"material":"初中生王力擅长绘画，也是个要求上进的学生。但他行为散漫且目无纪律，常画 些小动物，写上同学的名字来取笑。当班主任李老师批评他时，他低着头，声音颤颤 地说：“老师，我错了，以后再也不……”李老师温和地说：“喜欢画画没错啊，可画 家是用画笔来表现思想情感的，应歌颂美的事物。”说到这儿，王力的头又低了下去。 李老师接着说：“咱班想请你负责板报，你要把特长充分发挥出来。”他一听，高兴地 说：“老师，我保证把板报办好!”此后，王力发生了不小变化，办板报也很认真负责。有一天，宣传委员找到李老师，气呼呼地说：“李老师，王力把板报全擦了，还 说我们是笨蛋，我们的字配不上他的画，他画得再好，我们也得不了奖。”李老师一 进教室便看见王力也在生气，他说他担心班级板报取不上名次。李老师肯定了他热爱 集体、精心设计的工作态度，接着又帮助他分析个人与集体的关系，教育他尊重别人 的劳动，树立正确的荣誉观。他频频点头，虚心承认了错误，并保证重新设计，完善 板报。结果，板报在全校评比中获得了二等奖。王力的进步是可喜的，但有时还比较散漫，以为只要笔下有功夫，其他无关紧要。 在学校举办的“新风画展”评比中，他以为稳操胜券，结果只得了第四，便非常失望。 李老师问他对评选结果有何感想，他振振有词：“李老师，我认为被评为第四的原因 有两条， 一是我的画位置摆得不好，二是同学们不会欣赏水墨画。”李老师严肃地说： “你的画立意不够深，境界不够高。从你画上题的诗句来看，语言比较贫乏，文法也 不是很通顺。如果你想当画家，应严格要求自己，树立正确的人生观，努力学好各门 功课，打好文化基础。”听完李老师的话，王力脸红了，额头渗出了汗珠。后来，王力像变了一个人，各方面都取得了长足的进步。","subQuestions":[{"number":1,"question":"材料中，班主任李老师的做法主要体现了哪些德育原则?请结合案例加 以分析。(12分)","score":6,"answer":"材料中，李老师的做法体现了疏导原则，尊重学生与严格要求学生相结合的原则 (严慈相济原则),依靠积极因素、克服消极因素的原则(长善救失原则),因材施教 原则。首先，李老师贯彻了疏导原则。该原则是指教育者进行德育时要循循善诱，以理 服人，从提高学生认识入手，调动学生的主动性，使他们积极向上。材料中，当王力90在课堂上画画、与同学产生矛盾、在绘画比赛中成绩不理想时，李老师都及时与王力 沟通，循循善诱，对其进行鼓励，帮助王力改正认识，体现了该原则。其次，李老师贯彻了尊重学生与严格要求学生相结合的原则。该原则要求教师既 尊重信任学生，又对学生提出严格的要求，把严和爱有机结合起来。材料中，当王力 目无纪律、在课上画画时，李老师并未一味指责，而是肯定其画画的兴趣，做到了尊 重学生；当王力与同学产生矛盾、绘画比赛失败后推卸责任时，李老师及时对其进行 教育，做到了严格要求学生。再次，李老师贯彻了依靠积极因素、克服消极因素的原则。该原则是指教育者要 善于依靠、发扬学生自身的积极因素，调动学生自我教育的积极性，克服消极因素， 实现品德发展内部矛盾的转化。材料中，李老师利用王力擅长画画这一优势引导其改 正行为散漫等缺点，体现了该原则。最后，李老师贯彻了因材施教原则。该原则是指教育者进行德育时，要从学生品 德发展的实际出发，根据学生的年龄特征和个性差异进行不同的教育。材料中，李老 师的一系列教育措施都是根据王力的特点提出的，做到了因材施教。综上所述，材料中李老师的做法是值得提倡的，作为教师，在教育工作中要贯彻 德育原则。"}],"fullAnswer":"材料中，李老师的做法体现了疏导原则，尊重学生与严格要求学生相结合的原则 (严慈相济原则),依靠积极因素、克服消极因素的原则(长善救失原则),因材施教 原则。首先，李老师贯彻了疏导原则。该原则是指教育者进行德育时要循循善诱，以理 服人，从提高学生认识入手，调动学生的主动性，使他们积极向上。材料中，当王力90在课堂上画画、与同学产生矛盾、在绘画比赛中成绩不理想时，李老师都及时与王力 沟通，循循善诱，对其进行鼓励，帮助王力改正认识，体现了该原则。其次，李老师贯彻了尊重学生与严格要求学生相结合的原则。该原则要求教师既 尊重信任学生，又对学生提出严格的要求，把严和爱有机结合起来。材料中，当王力 目无纪律、在课上画画时，李老师并未一味指责，而是肯定其画画的兴趣，做到了尊 重学生；当王力与同学产生矛盾、绘画比赛失败后推卸责任时，李老师及时对其进行 教育，做到了严格要求学生。再次，李老师贯彻了依靠积极因素、克服消极因素的原则。该原则是指教育者要 善于依靠、发扬学生自身的积极因素，调动学生自我教育的积极性，克服消极因素， 实现品德发展内部矛盾的转化。材料中，李老师利用王力擅长画画这一优势引导其改 正行为散漫等缺点，体现了该原则。最后，李老师贯彻了因材施教原则。该原则是指教育者进行德育时，要从学生品 德发展的实际出发，根据学生的年龄特征和个性差异进行不同的教育。材料中，李老 师的一系列教育措施都是根据王力的特点提出的，做到了因材施教。综上所述，材料中李老师的做法是值得提倡的，作为教师，在教育工作中要贯彻 德育原则。","materialType":["学生行为案例","班级管理案例","德育案例"],"module":7,"keywords":["李老师的做法体现了疏导原则","尊重学生与严格要求学生相结合的原则","(严慈相济原则","),依靠积极因素、克服消极因素的原则","(长善救失原则","李老师贯彻了疏导原则","该原则","体现了该原则","李老师贯彻了尊重学生与严格要求学生相结合的原则","李老师贯彻了依靠积极因素、克服消极因素的原则","李老师贯彻了因材施教原则","德育原则"],"questionPosition":"Q30","moduleName":"中学德育","subTopics":["德育原则-疏导原则","德育原则-因材施教","德育原则-依靠积极因素克服消极因素","德育原则-尊重与严格要求相结合","德育原则-集体教育与个别教育相结合","德育原则-正面教育与纪律约束相结合","德育原则-知行统一","德育方法-说服教育法","德育方法-品德评价法","德育方法-自我修养法"],"coreConcepts":["因材施教原则","疏导原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则"]},{"exam":"2022下","number":31,"material":"某中学班主任张老师收到一位家长的来信，信中说：“……我的孩子晓奇在小学 阶段喜欢学习，各科学习成绩优异。进入初中后，第一次数学考试考了80分，属于 班级中下水平，他感到很失望、很沮丧，对自己的学习能力产生了怀疑。与此同时， 晓奇小学时特别感兴趣的英语，也是他的强项，考试成绩也很不理想。晓奇对自己的 学习能力更不自信了，认为自己不是学习的材料。近期，他的学习劲头明显下降，作 业拖拉，只要家长一离开，就放下作业。我很着急，也很纳闷，不知道他为什么会这 样，请老师帮我出出主意。”","subQuestions":[{"number":1,"question":"请用动机归因理论分析案例中晓奇出现的问题及其原因。","score":12,"answer":"晓奇在学习上出现了习得性无助。一个人总是失败并把失败归于内部的、稳 定的和不可控的因素(能力低),就会形成一种习得性无助的自我感觉。习得性无助 是当个体感到无论做什么事情都不会对自己的重要生活事件产生影响时所体验到的一 种抑郁状态。材料中，晓奇经历了数学考试失败的体验后，对自己的学习能力产生了怀疑。与 此同时，其擅长的英语学科考试成绩也不理想，使得他更加怀疑自己的学习能力，认 为自己不是学习的材料。这属于习得性无助的表现。因此，晓奇是因为错误的归因， 导致了其在学习上产生了习得性无助。"},{"number":2,"question":"张老师应该向家长提出哪些教育建议?四、材料分析题","score":6,"answer":"张老师可向晓奇的家长提供以下教育建议：①了解和满足学生的需要，促使学习动机的产生。晓奇的家长可以了解一下晓奇 在其他领域的需要，促使其产生学习动机。②重视立志教育，对学生进行成就动机训练。晓奇的家长可以引导晓奇树立自己 的志向，迎接有挑战的任务，以证明其能力，也就是对其进行成就动机的训练。③帮助学生确立正确的自我概念，获得自我效能感。晓奇的家长可以帮助晓奇对自己形成正确认识，增强其自我效能感。④培养学生努力导致成功的归因观。晓奇的家长在引导晓奇对数学和英语成绩不 理想进行归因时，应当让其将失败归因于努力程度而不是能力，从而促使晓奇继续努 力学习。"}],"fullAnswer":"(1)晓奇在学习上出现了习得性无助。一个人总是失败并把失败归于内部的、稳 定的和不可控的因素(能力低),就会形成一种习得性无助的自我感觉。习得性无助 是当个体感到无论做什么事情都不会对自己的重要生活事件产生影响时所体验到的一 种抑郁状态。材料中，晓奇经历了数学考试失败的体验后，对自己的学习能力产生了怀疑。与 此同时，其擅长的英语学科考试成绩也不理想，使得他更加怀疑自己的学习能力，认 为自己不是学习的材料。这属于习得性无助的表现。因此，晓奇是因为错误的归因， 导致了其在学习上产生了习得性无助。(2)张老师可向晓奇的家长提供以下教育建议：①了解和满足学生的需要，促使学习动机的产生。晓奇的家长可以了解一下晓奇 在其他领域的需要，促使其产生学习动机。②重视立志教育，对学生进行成就动机训练。晓奇的家长可以引导晓奇树立自己 的志向，迎接有挑战的任务，以证明其能力，也就是对其进行成就动机的训练。③帮助学生确立正确的自我概念，获得自我效能感。晓奇的家长可以帮助晓奇对自己形成正确认识，增强其自我效能感。④培养学生努力导致成功的归因观。晓奇的家长在引导晓奇对数学和英语成绩不 理想进行归因时，应当让其将失败归因于努力程度而不是能力，从而促使晓奇继续努 力学习。","materialType":["学生心理案例","学生行为案例","班级管理案例","家校案例"],"module":4,"keywords":[],"questionPosition":"Q31","moduleName":"学习心理","subTopics":["学习动机-成就动机理论","学习动机-需要层次理论","学习动机-归因理论","学习动机-自我效能感","学习迁移-形式训练说","学习策略-资源管理策略","认知主义-布鲁纳认知结构"],"coreConcepts":["自我效能感理论","归因理论","成就动机理论"]}]},{"exam":"2023上","rawFile":"23上 材料分析题 真题 科二.docx","items":[{"exam":"2023上","number":30,"material":"初中地理课上，为了使学生理解有关经纬线的概念和意义，刘老师提问道：“在 浩瀚的太平洋上，一艘远洋轮船出现了严重的故障，在自救无果的情况下，船长拿起 电话向总部求救。如果你是船长，你会怎么说呢?”一学生作打电话状：“喂，总部，我们出事了，快来救我们。”“我是总部，请报告你们的位置。”刘老师追问。该生迟疑了一下，小声回答：“我们在太平洋上。”他的话引起了哄堂大笑。刘老师问：“同学们为什么笑呢?”“太平洋那么大，到哪里找呢?”学生回答道。“是呀，救援人员怎样才能找到在太平洋上出事的船呢?”学生回答：“应该报告船的准确位置!”于是，刘老师把“如何在地球上确定某一位置”的问题抛给学生来讨论。在讨论中，学生从探讨如何描述自己的座位，到街道门牌号；从电影票上的座位 号，到平面直角坐标系……就这样，关于经纬线、经纬网的概念和意义被学生理解了。","subQuestions":[{"number":1,"question":"结合材料，分析刘老师的教学主要体现了哪种教学原则。","score":8,"answer":"材料中，刘老师的教学充分体现了启发性原则。启发性原则是指在教学中教师要承认学生是学习的主体，注意调动他们的学习 主 动性，引导他们独立思考、积极探索，生动活泼地学习，自觉掌握科学知识，提高分 析问题和解决问题的能力。材料中，刘老师通过“如何在地球上确定某一位置”这一 启发性问题，引导学生独立思考、讨论、探究，最终使学生理解了经纬线、经纬网的 概念和意义，充分体现了启发性原则。"},{"number":2,"question":"阐述贯彻该教学原则的基本要求。","score":10,"answer":"贯彻启发性教学原则的要求有以下几点：①加强学习的目的性教育，调动学生学习的主动性。教师在课堂教学前和教学过 程中，应提示学生所学内容的重要性，使学生在期待之中学习，从而获得更好的学习 效果。②启发学生独立思考，发展学生的逻辑思维能力。学生是有主观能动性的个体， 在教学过程中，教师应秉承教师主导作用与学生主体地位相统一的规律，充分发挥学 生的主动性，引导学生独立思考。76③让学生自己动手，培养学生独立解决问题的能力。④发扬教学民主。建立民主平等的师生关系，创造民主和谐的教学气氛，鼓励学 生发表不同的见解，允许学生向教师提问、质疑等。总而言之，教师在教学实践中要贯彻落实好启发性原则，以便更好地促进学生的 学习与发展。"}],"fullAnswer":"(1)材料中，刘老师的教学充分体现了启发性原则。启发性原则是指在教学中教师要承认学生是学习的主体，注意调动他们的学习 主 动性，引导他们独立思考、积极探索，生动活泼地学习，自觉掌握科学知识，提高分 析问题和解决问题的能力。材料中，刘老师通过“如何在地球上确定某一位置”这一 启发性问题，引导学生独立思考、讨论、探究，最终使学生理解了经纬线、经纬网的 概念和意义，充分体现了启发性原则。(2)贯彻启发性教学原则的要求有以下几点：①加强学习的目的性教育，调动学生学习的主动性。教师在课堂教学前和教学过 程中，应提示学生所学内容的重要性，使学生在期待之中学习，从而获得更好的学习 效果。②启发学生独立思考，发展学生的逻辑思维能力。学生是有主观能动性的个体， 在教学过程中，教师应秉承教师主导作用与学生主体地位相统一的规律，充分发挥学 生的主动性，引导学生独立思考。76③让学生自己动手，培养学生独立解决问题的能力。④发扬教学民主。建立民主平等的师生关系，创造民主和谐的教学气氛，鼓励学 生发表不同的见解，允许学生向教师提问、质疑等。总而言之，教师在教学实践中要贯彻落实好启发性原则，以便更好地促进学生的 学习与发展。","materialType":["教学案例"],"module":3,"keywords":["刘老师的教学充分体现了启发性原则","启发性原则","充分体现了启发性原则","(2)贯彻启发性教学原则","教师应秉承教师主导作用与学生主体地位相统一的规律","教师在教学实践中要贯彻落实好启发性原则"],"questionPosition":"Q30","moduleName":"中学教学","subTopics":["教学原则-启发性","教学原则-思想性与科学性统一","教学方法-讨论法"],"coreConcepts":["启发性原则"]},{"exam":"2023上","number":31,"material":"情境1:林强上课捣乱，受到同学责怪和老师批评，可他的行为不仅没有减少， 反而频繁出现。后来，为了消除他的捣乱行为，当他捣乱时，老师和同学都不理他， 久而久之，他的捣乱行为逐渐减少了。情境2:杰明上课时总是不遵守纪律，干扰同学的学习。老师找他谈话，他多次 承诺予以改正，但很快又重犯。今天上课时，他趁陈军站起来回答问题时，抽掉陈军 的椅子使其重重地摔了一跤。于是，老师宣布取消杰明去春游的活动资格。情境3:兴华平时课上喜欢讲闲话，老师为了改变他的这种不良习惯，不像以前 那样一味地批评，而是采用了新的策略：只要兴华不在课上讲闲话，老师就及时给予 表扬。","subQuestions":[{"number":1,"question":"试从行为主义心理学视角，分析三种情境中教师做法的依据。","score":12,"answer":"①情境1中教师的做法体现了斯金纳操作性条件作用理论中的“消退”。消 退是指有机体做出以前曾被强化过的反应，如果在这一反应之后不再有强化物相伴， 那么,此类反应在将来发生的概率便降低。材料中，林强上课捣乱时，老师和同学都 不理他，久而久之，他的捣乱行为逐渐减少了，这体现了消退的作用。②情境2中教师的做法体现了斯金纳操作性条件作用理论中的“惩罚”。惩罚是 指当有机体做出某种反应以后，呈现一个厌恶刺激(如体罚、谴责等)或者减少一个 愉快刺激，以消除或抑制此类反应的过程。材料中，老师在杰明不遵守纪律时宣布取 消他去春游的活动资格，体现了惩罚。③情境3中教师的做法体现了斯金纳操作性条件作用理论中的“正强化”。正强 化是指给予一个愉快刺激，从而增加有机体行为出现的概率。材料中，只要兴华不在 课上讲闲话，老师就及时给予表扬，体现了正强化。"},{"number":2,"question":"该材料对教师培养学生良好行为有何启示?四、材料分析题","score":6,"answer":"教师在培养学生良好行为时，应在了解学生的基础上，分析学生行为背后的 原因，并根据实际情况合理地运用强化规律。①合理地使用消退。老师应分析学生不良行为背后是什么因素在起强化作用，尽 可能消除强化学生不良行为的因素，通过不予理睬的消退方式来改变学生的不良行为。 材料中，林强上课捣乱，受到同学责怪和老师批评，可他的行为不仅没有减少，反而 频繁出现。这是因为对林强而言，他上课捣乱是为了获得老师和同学的关注，所以老 师和同学的批评、责怪对他而言是一种强化。而后老师不予强化，即恰当地使用了 消退。②恰当地运用惩罚。多用剥夺式惩罚，少用甚至不用施予式惩罚。剥夺式惩罚是指 在孩子实施了某种不良行为后，教师或家长剥夺其喜爱的某种刺激，以减少受惩罚行为 再次发生的可能性。材料中，杰明上课时总是不遵守纪律，老师多次找他谈话都没起到 好的效果，最后老师宣布取消杰明去春游的活动资格。这是使用了剥夺式惩罚。③正确地运用强化。惩罚并不能使行为发生永久性的改变，它只能暂时抑制行为， 不能根除行为。因此，惩罚的运用必须慎重，惩罚一种不良行为应与强化一种良好行为结合起来，方能取得预期的效果。材料中，兴华平时课上喜欢讲闲话，以前老师一 味地批评并没取得好的效果，于是采用了新的策略：只要兴华不在课上讲闲话，老师 就及时给予表扬。这体现了在惩罚不起效果时，合理地运用强化可以改变学生的不良 行为。"}],"fullAnswer":"(1)①情境1中教师的做法体现了斯金纳操作性条件作用理论中的“消退”。消 退是指有机体做出以前曾被强化过的反应，如果在这一反应之后不再有强化物相伴， 那么,此类反应在将来发生的概率便降低。材料中，林强上课捣乱时，老师和同学都 不理他，久而久之，他的捣乱行为逐渐减少了，这体现了消退的作用。②情境2中教师的做法体现了斯金纳操作性条件作用理论中的“惩罚”。惩罚是 指当有机体做出某种反应以后，呈现一个厌恶刺激(如体罚、谴责等)或者减少一个 愉快刺激，以消除或抑制此类反应的过程。材料中，老师在杰明不遵守纪律时宣布取 消他去春游的活动资格，体现了惩罚。③情境3中教师的做法体现了斯金纳操作性条件作用理论中的“正强化”。正强 化是指给予一个愉快刺激，从而增加有机体行为出现的概率。材料中，只要兴华不在 课上讲闲话，老师就及时给予表扬，体现了正强化。(2)教师在培养学生良好行为时，应在了解学生的基础上，分析学生行为背后的 原因，并根据实际情况合理地运用强化规律。①合理地使用消退。老师应分析学生不良行为背后是什么因素在起强化作用，尽 可能消除强化学生不良行为的因素，通过不予理睬的消退方式来改变学生的不良行为。 材料中，林强上课捣乱，受到同学责怪和老师批评，可他的行为不仅没有减少，反而 频繁出现。这是因为对林强而言，他上课捣乱是为了获得老师和同学的关注，所以老 师和同学的批评、责怪对他而言是一种强化。而后老师不予强化，即恰当地使用了 消退。②恰当地运用惩罚。多用剥夺式惩罚，少用甚至不用施予式惩罚。剥夺式惩罚是指 在孩子实施了某种不良行为后，教师或家长剥夺其喜爱的某种刺激，以减少受惩罚行为 再次发生的可能性。材料中，杰明上课时总是不遵守纪律，老师多次找他谈话都没起到 好的效果，最后老师宣布取消杰明去春游的活动资格。这是使用了剥夺式惩罚。③正确地运用强化。惩罚并不能使行为发生永久性的改变，它只能暂时抑制行为， 不能根除行为。因此，惩罚的运用必须慎重，惩罚一种不良行为应与强化一种良好行为结合起来，方能取得预期的效果。材料中，兴华平时课上喜欢讲闲话，以前老师一 味地批评并没取得好的效果，于是采用了新的策略：只要兴华不在课上讲闲话，老师 就及时给予表扬。这体现了在惩罚不起效果时，合理地运用强化可以改变学生的不良 行为。","materialType":["学生行为案例","教学案例"],"module":4,"keywords":["(1)①情境1中教师的做法体现了斯金纳操作性条件作用理论","②情境2中教师的做法体现了斯金纳操作性条件作用理论","③情境3中教师的做法体现了斯金纳操作性条件作用理论","并根据实际情况合理地运用强化规律","于是采用了新的策略"],"questionPosition":"Q31","moduleName":"学习心理","subTopics":["行为主义-经典条件反射","行为主义-操作条件反射","建构主义-学习观","技能学习-操作技能"],"coreConcepts":["操作条件反射理论","行为主义学习理论"]}]},{"exam":"2023下","rawFile":"23下 材料分析题 真题 科二.docx","items":[{"exam":"2023下","number":30,"material":"一次偶然机会，我在网上打开了学校的贴吧。让我惊讶的是，竟然看到了班上学 生的帖子，语言粗俗、张扬、很不文明，这是我那些平时在教室里乖巧的孩子吗?我气急了，恨不得马上把他们叫到办公室狠狠地批一顿，但是冷静下来后一想， 这样能解决问题吗?说不定还会徒增其厌恶之感呢。于是，我平复了一下心情，仔细 阅读帖子，发现他们谈论的主要是班上的一些情况。沉思片刻，我便有了主意。班会课上，我严肃地说：“同学们，上周我到学校的贴吧去‘逛’了一圈，看到 不少表达对班级不满的帖子居然出自我们班同学之手，这和我们这个优秀班级的形象 极不相称!”几个孩子的头低了下去，脸和脖子都红红的。我看时机已到，于是话锋一转：“不过你们也提出了很多挺有价值的建议，这说明 你们是关心、热爱班集体的。”听到这里，那几个孩子一下子抬起了头，一脸的惊讶。 “所以我决定好好地‘惩罚’你们一下”,我板起脸说，“你们建一个班级‘说吧’,专 门负责收集同学们对班级的意见和建议，让大家都加入这个‘说吧’里来。”“说吧”里的内容很丰富，有对任课教师的意见，有“抨击”不合理班规的，还 有热心调节同学矛盾的，语言上也不再粗俗了，同学们和班委一起研究、解决班级中 出现的问题。从此，学生感觉我们班就像一个温馨的家。","subQuestions":[{"number":1,"question":"该老师的做法主要贯彻了哪一德育原则?请结合案例分析。(13分)","score":5,"answer":"这位老师贯彻了尊重学生与严格要求学生相结合的原则。尊重学生与严格要求学生相结合的原则也叫严慈相济原则，是指教育者进行德育 时，要把对学生的思想和行为的严格要求与对他们个人的尊重和信赖结合起来，使教 育者对学生的影响与要求易于转化为学生的品德。材料中，这位老师面对学生在贴吧中发表的不文明话语时没有发脾气，而是肯定 学生对班集体的关心，说明这位老师做到了尊重学生。同时，这位老师也对学生施以 “惩罚”,让学生建立“说吧”,引导学生对班级的不合理规则提出建议，这一做法既 规范了学生的言行，又营造了良好的班级氛围，说明这位老师做到了严格要求学生。综上所述，这位老师贯彻了尊重学生与严格要求学生相结合的原则，采用了更加 科学、合理的方式对学生进行德育，值得我们学习。"}],"fullAnswer":"这位老师贯彻了尊重学生与严格要求学生相结合的原则。尊重学生与严格要求学生相结合的原则也叫严慈相济原则，是指教育者进行德育 时，要把对学生的思想和行为的严格要求与对他们个人的尊重和信赖结合起来，使教 育者对学生的影响与要求易于转化为学生的品德。材料中，这位老师面对学生在贴吧中发表的不文明话语时没有发脾气，而是肯定 学生对班集体的关心，说明这位老师做到了尊重学生。同时，这位老师也对学生施以 “惩罚”,让学生建立“说吧”,引导学生对班级的不合理规则提出建议，这一做法既 规范了学生的言行，又营造了良好的班级氛围，说明这位老师做到了严格要求学生。综上所述，这位老师贯彻了尊重学生与严格要求学生相结合的原则，采用了更加 科学、合理的方式对学生进行德育，值得我们学习。","materialType":["学生行为案例","班级管理案例"],"module":7,"keywords":["这位老师贯彻了尊重学生与严格要求学生相结合的原则","尊重学生与严格要求学生相结合的原则","也叫严慈相济原则"],"questionPosition":"Q30","moduleName":"中学德育","subTopics":["德育原则-尊重与严格要求相结合","德育原则-集体教育与个别教育相结合","德育方法-品德评价法"],"coreConcepts":["尊重与严格要求相结合原则","班集体建设"]},{"exam":"2023下","number":31,"material":"初中生林强的父母望子成龙心切，从小对他寄予厚望，在他们看来，只有严加管 教，孩子才能有出息。于是，他们对林强从学习到生活做出了一系列严格的规定，任 何情况下都不得有丝毫的通融或改变，也不允许他出现任何细小的差错。久而久之， 林强养成了谨小慎微、凡事都怕出错的行为习惯。他做事总是小心翼翼，反复权衡， 慎之又慎，生怕做不好留下遗憾，迟迟下不了决心。哪怕是在课上听不懂老师讲的知 识，需要问老师时，他也要权衡再三。林强在学习和生活中无论做什么事情，都是犹 豫不决，缺乏随机应变的灵活性。","subQuestions":[{"number":1,"question":"结合案例分析学生性格形成的影响因素。","score":9,"answer":"影响性格形成的因素包括遗传因素、家庭因素、学校教育、社会文化因素、 个人主观因素等。材料中，影响林强性格形成的因素主要是家庭因素。在家庭因素中，最主要的影响因素是家庭教养方式。家庭教养方式一般有三种， 即权威型、放纵型和民主型。不同的教养方式会对孩子的社会性发展和个性形成产生 重大的影响。其中，在权威型教养方式下，父母要求儿童绝对地服从自己，希望儿童 按照他们为其设计的发展蓝图去成长，对儿童的所有行为都加以保护监督。这类父母 常以冷漠、忽视的态度对待儿童，很少考虑儿童自身的要求与意愿，对儿童违反规则 的行为表示愤怒，甚至采取严厉的惩罚措施。这种教养方式下的儿童常常表现出焦虑、 退缩和不快乐，在与同伴交往中，遇到挫折时易产生敌对反应。材料中，林强的父母对林强严加管教，不允许他出现任何差错，是权威型的教养 方式。在这种权威型的父母面前，林强变得谨小慎微，做事犹豫不决，正体现了家庭 教养方式对性格的影响。"},{"number":2,"question":"如果你是老师，对林强的性格培养有何建议?四、材料分析题","score":9,"answer":"如果我是老师，我会对林强的性格培养提出以下建议：①引导林强父母采取正确的教养方式。我会建议林强父母采取民主型的教养方式， 给孩子无条件的关注和爱，积极地创造适合孩子发展的环境，尊重孩子的思想、观念， 让孩子多参加家庭决策，培养其独立自主、自信的性格。②加强人生观、世界观和价值观的教育。我会利用各种形式开展教育，使林强形成正确的人生观、世界观和价值观，树立正确的人生目标。③及时强化林强的积极行为。我会通过学校日常教学活动的合理组织，使学生形 成勤奋、认真、守纪律等良好的性格品质。除此之外，我还会组织各种课外、校外活 动，开阔学生的眼界，丰富学生的社会经验，增加学生的锻炼机会。在各项活动中， 我会积极关注林强的行为表现，对其良好的行为及时进行表扬、鼓励。④充分利用榜样人物的示范作用。我会向林强介绍古今中外的优秀人物，引导林 强向这些优秀人物学习。我也会遵循“身教重于言教”的教育原则，不断地完善自己 的性格，提高自身的人格魅力，成为林强性格发展中能够直接模仿的榜样。⑤利用集体教育的力量。我会培养良好的班集体。生活在这样的集体中，可以使 林强的性格得到良性的发展。⑥依据性格倾向因材施教。学生性格的发展受他们已有的个性特点的影响。我会 针对林强的个性特点，因材施教。⑦提高林强的自我教育能力。自我教育是形成和培养学生积极性格的重要条件。 因此，我会鼓励林强并具体指导林强进行性格的自我认识、自我控制、自我锻炼和自 我修养。"}],"fullAnswer":"(1)影响性格形成的因素包括遗传因素、家庭因素、学校教育、社会文化因素、 个人主观因素等。材料中，影响林强性格形成的因素主要是家庭因素。在家庭因素中，最主要的影响因素是家庭教养方式。家庭教养方式一般有三种， 即权威型、放纵型和民主型。不同的教养方式会对孩子的社会性发展和个性形成产生 重大的影响。其中，在权威型教养方式下，父母要求儿童绝对地服从自己，希望儿童 按照他们为其设计的发展蓝图去成长，对儿童的所有行为都加以保护监督。这类父母 常以冷漠、忽视的态度对待儿童，很少考虑儿童自身的要求与意愿，对儿童违反规则 的行为表示愤怒，甚至采取严厉的惩罚措施。这种教养方式下的儿童常常表现出焦虑、 退缩和不快乐，在与同伴交往中，遇到挫折时易产生敌对反应。材料中，林强的父母对林强严加管教，不允许他出现任何差错，是权威型的教养 方式。在这种权威型的父母面前，林强变得谨小慎微，做事犹豫不决，正体现了家庭 教养方式对性格的影响。(2)如果我是老师，我会对林强的性格培养提出以下建议：①引导林强父母采取正确的教养方式。我会建议林强父母采取民主型的教养方式， 给孩子无条件的关注和爱，积极地创造适合孩子发展的环境，尊重孩子的思想、观念， 让孩子多参加家庭决策，培养其独立自主、自信的性格。②加强人生观、世界观和价值观的教育。我会利用各种形式开展教育，使林强形成正确的人生观、世界观和价值观，树立正确的人生目标。③及时强化林强的积极行为。我会通过学校日常教学活动的合理组织，使学生形 成勤奋、认真、守纪律等良好的性格品质。除此之外，我还会组织各种课外、校外活 动，开阔学生的眼界，丰富学生的社会经验，增加学生的锻炼机会。在各项活动中， 我会积极关注林强的行为表现，对其良好的行为及时进行表扬、鼓励。④充分利用榜样人物的示范作用。我会向林强介绍古今中外的优秀人物，引导林 强向这些优秀人物学习。我也会遵循“身教重于言教”的教育原则，不断地完善自己 的性格，提高自身的人格魅力，成为林强性格发展中能够直接模仿的榜样。⑤利用集体教育的力量。我会培养良好的班集体。生活在这样的集体中，可以使 林强的性格得到良性的发展。⑥依据性格倾向因材施教。学生性格的发展受他们已有的个性特点的影响。我会 针对林强的个性特点，因材施教。⑦提高林强的自我教育能力。自我教育是形成和培养学生积极性格的重要条件。 因此，我会鼓励林强并具体指导林强进行性格的自我认识、自我控制、自我锻炼和自 我修养。","materialType":["家校案例"],"module":5,"keywords":["我也会遵循“身教重于言教”的教育原则"],"questionPosition":"Q31","moduleName":"发展心理","subTopics":["人格-性格形成因素","人格-自我意识发展","身心发展-影响人发展因素","身心发展-青春期心理","身心发展-个体差异"],"coreConcepts":["因材施教原则","性格形成影响因素","班集体建设"]}]},{"exam":"2024上","rawFile":"24上 材料分析题 真题  科二.docx","items":[{"exam":"2024上","number":30,"material":"20世纪50年代，国外有一位教育专家发现，有些孩子不论用什么方法，学习成 绩就是上不去，传统上，人们会把这个问题归因于家长或者教师没有尽到责任，但是 他发现这些家长和教师都非常尽责，孩子的成绩依然没有任何改观。而且在每一个学 校都有相当数量这样的学生，他推测会不会和他们自身有什么关系呢?于是他找到了 一位内分泌医生，让他来看看这些孩子和普通孩子之间有什么不同。这位医生对这些 孩子的内分泌水平进行了检测。结果发现，那些调皮捣蛋的孩子，通常基础代谢水平 和睾酮素的分泌量远远高于同龄人，因此这些孩子过分喜欢表现自己。如果高到一定 水平以后，这些孩子的大脑是无法控制自己的。研究还进一步发现，只要这些孩子的 这两个内分泌指标一直明显高于阈值，实际上用任何教育方法，都无法改变这些孩子 的行为，因为他们的大脑在替他们做主。这位内分泌医生还发现，随着年龄的增长， 其中有一些孩子也会逐渐变得听话，但实际上并不是老师或者家长的作用，而是这些 孩子的内分泌水平达到了正常。由此，该教育专家认为，学校中孩子学习成绩的好坏， 与他们身体的内分泌水平有关，而与家长、教师的努力无关。","subQuestions":[{"number":1,"question":"试用马克思主义关于影响人的发展因素理论，分析案例中教育专家的观点。","score":18,"answer":"材料中，该教育专家的观点属于遗传决定论，是有偏颇的，错误的。马克思主义关于影响人的发展因素理论认为，人的发展是个体的内在因素(如先 天遗传的素质、主观能动性等)与外部环境(如外在刺激的强度、社会的发展水平、 个体的文化背景等)在个体活动中相互作用的结果。因此，遗传、环境、学校教育和 个体的主观能动性均在人的身心发展中起着重要作用。遗传是指人从上代继承下来的生理解剖上的特点，如机体的结构、形态、感官和 神经系统等的特点。遗传素质是人的发展的生理前提，为人的发展提供了可能性。环境泛指个体生活中影响个体身心发展的一切外部因素，包括自然环境和社会环 境。环境为个体的发展提供了多种可能，环境使遗传提供的发展可能性变成现实。学校教育在人的发展中起主导作用。个体的主观能动性是指人的主观意识对客观世界的反映和能动作用。主观能动性 是推动人身心发展的内在动力，是促进个体发展的决定性因素。材料中，教育专家认为，学校中孩子学习成绩的好坏，与他们身体的内分泌水平 有关，而与家长、教师的努力无关。这种观点是错误的，属于遗传决定论，只关注了 遗传素质对人发展的影响，而忽视了教育、环境以及个体主观能动性对个体身心发展 的影响。"}],"fullAnswer":"材料中，该教育专家的观点属于遗传决定论，是有偏颇的，错误的。马克思主义关于影响人的发展因素理论认为，人的发展是个体的内在因素(如先 天遗传的素质、主观能动性等)与外部环境(如外在刺激的强度、社会的发展水平、 个体的文化背景等)在个体活动中相互作用的结果。因此，遗传、环境、学校教育和 个体的主观能动性均在人的身心发展中起着重要作用。遗传是指人从上代继承下来的生理解剖上的特点，如机体的结构、形态、感官和 神经系统等的特点。遗传素质是人的发展的生理前提，为人的发展提供了可能性。环境泛指个体生活中影响个体身心发展的一切外部因素，包括自然环境和社会环 境。环境为个体的发展提供了多种可能，环境使遗传提供的发展可能性变成现实。学校教育在人的发展中起主导作用。个体的主观能动性是指人的主观意识对客观世界的反映和能动作用。主观能动性 是推动人身心发展的内在动力，是促进个体发展的决定性因素。材料中，教育专家认为，学校中孩子学习成绩的好坏，与他们身体的内分泌水平 有关，而与家长、教师的努力无关。这种观点是错误的，属于遗传决定论，只关注了 遗传素质对人发展的影响，而忽视了教育、环境以及个体主观能动性对个体身心发展 的影响。","materialType":["学生心理案例","学生行为案例","家校案例"],"module":5,"keywords":["马克思主义关于影响人的发展因素理论"],"questionPosition":"Q30","moduleName":"发展心理","subTopics":["人格-性格形成因素","身心发展-影响人发展因素"],"coreConcepts":["影响人发展因素理论"]},{"exam":"2024上","number":31,"material":"上生物课时，为了让学生准确无误地掌握“周围神经系统”的有关知识，李老师 根据先行组织者的教学策略，对课程进行了精心设计。他先让学生学习“神经系统” 的一般知识，分析神经系统的构成和作用，让学生明白“周围神经系统”与“中枢神 经系统”共同构成“神经系统”,它们分别承担着不同的功能；进而厘清“周围神经 系统”与“中枢神经系统”的关系，比较“周围神经系统”与“中枢神经系统”的异 同，以此促进学生掌握“周围神经系统”的相关知识。","subQuestions":[{"number":1,"question":"请解释“先行组织者”的含义。","score":6,"answer":"先行组织者策略是奥苏贝尔的有意义学习理论在教学中具体应用的技术。所 谓“先行组织者”,是先于学习任务本身呈现的一种引导性材料。它要比学习任务本 身有较高的抽象、概括和综合水平，并且能够清晰地与认知结构中原有观念和新任务 关联起来。也就是通过呈现“组织者”,在学习者已有知识与需要学习的新内容之间 架设一道桥梁，使学生能更有效地学习新材料。"},{"number":2,"question":"请结合李老师的做法，说明先行组织者在教学中的作用。一 J u 工 中 口 刀 o四、材料分析题","score":12,"answer":"李老师的做法是正确的，践行了先行组织者的教学策略。奥苏贝尔认为，先行组织者不仅能够帮助学习者学习新知识，而且可以帮助其保 持知识。具体表现在以下几个方面：①能够将学生的注意力集中在将要学习的新知识 中的重点部分；②突出强调新知识与已有知识的关系，为新知识提供一种框架；③能 够帮助学生回忆起与新知识相关的已有知识，以便更好地建立联系。材料中，李老师 先让学生学习“神经系统”的一般知识，是在为“周围神经系统”的学习提供一个大 框架，进而厘清“周围神经系统”与“中枢神经系统”的关系，即帮助学生理解新内 容与已有知识的关系，建立知识之间的联系。因此，在教学中我们应学习李老师的做法。"}],"fullAnswer":"(1)先行组织者策略是奥苏贝尔的有意义学习理论在教学中具体应用的技术。所 谓“先行组织者”,是先于学习任务本身呈现的一种引导性材料。它要比学习任务本 身有较高的抽象、概括和综合水平，并且能够清晰地与认知结构中原有观念和新任务 关联起来。也就是通过呈现“组织者”,在学习者已有知识与需要学习的新内容之间 架设一道桥梁，使学生能更有效地学习新材料。(2)李老师的做法是正确的，践行了先行组织者的教学策略。奥苏贝尔认为，先行组织者不仅能够帮助学习者学习新知识，而且可以帮助其保 持知识。具体表现在以下几个方面：①能够将学生的注意力集中在将要学习的新知识 中的重点部分；②突出强调新知识与已有知识的关系，为新知识提供一种框架；③能 够帮助学生回忆起与新知识相关的已有知识，以便更好地建立联系。材料中，李老师 先让学生学习“神经系统”的一般知识，是在为“周围神经系统”的学习提供一个大 框架，进而厘清“周围神经系统”与“中枢神经系统”的关系，即帮助学生理解新内 容与已有知识的关系，建立知识之间的联系。因此，在教学中我们应学习李老师的做法。","materialType":["教学案例"],"module":4,"keywords":["(1)先行组织者策略","是奥苏贝尔的有意义学习理论","践行了先行组织者的教学策略"],"questionPosition":"Q31","moduleName":"学习心理","subTopics":["学习动机-需要层次理论","学习迁移-经验类化说","学习迁移-关系转换说","学习迁移-认知结构说","学习策略-认知策略","学习策略-复习方法","认知主义-布鲁纳认知结构","认知主义-奥苏贝尔有意义学习","人本主义-学习理论","认知过程-注意品质","知识学习-知识概括"],"coreConcepts":["先行组织者策略"]}]},{"exam":"2024下","rawFile":"24下 材料分析题 真题 科二.docx","items":[{"exam":"2024下","number":30,"material":"初中化学课上，孙老师讲解“燃烧和灭火”。孙老师抛出问题：“碳+氧气”燃烧 成二氧化碳，“硫+氧气”燃烧成二氧化硫，“铁+氧气”燃烧成四氧化三铁，它们的 共同点是什么?学生讨论并发言，师生共同总结概念：燃烧是指氧气和可燃物发生的 一种发光、发热的剧烈的氧化反应。孙老师拿出准备好的烧杯，里边有高温热水，放入三个分别装有红磷、石头和白 磷的试管进行实验，从而得出燃烧有三个条件：第一个要有氧气，第二个要有可燃物， 第三个要达到燃烧的最低温度，三者缺一不可。讲完燃烧之后，紧接着讲灭火。孙老师通过播放幻灯片展示案例，并提问学生： 如何通过燃烧条件得出灭火条件?从而得出灭火有三个条件：第一个要隔绝氧气，第 二个要隔绝可燃物，第三个要降到最低温度以下。孙老师边问边讲，最后拿出工具、 沙子、水、毛巾，找几个学生向其他同学一一示范，让学生自己讲解灭火的原理。最后，孙老师进行举一反三，联系生活实际提问。比如，炒菜时油锅中的油着火， 怎么办?电线老化短路，引发火灾，怎么办?堆放的纸箱着火，常用何种灭火方法扑 灭?扑灭森林火灾的有效方法是什么?师生一问一答，课堂气氛十分活跃。","subQuestions":[{"number":1,"question":"请结合材料讲一讲孙老师运用了哪些教学方法，并进行具体分析。","score":18,"answer":"孙老师运用了讨论法。讨论法是指学生在教师的指导下为解决某个问题进行 探讨、辩论，从而获取知识的方法。材料中，学生讨论并发言，师生共同总结概念， 这运用了讨论法。"}],"fullAnswer":"孙老师运用了讨论法、演示法、谈话法、实验法、讲授法等教学方法。(1)孙老师运用了讨论法。讨论法是指学生在教师的指导下为解决某个问题进行 探讨、辩论，从而获取知识的方法。材料中，学生讨论并发言，师生共同总结概念， 这运用了讨论法。(2)孙老师运用了演示法。演示法是指教师通过展示实物、直观教具，进行示 范性的实验或采取现代化视听手段等指导学生获得知识或巩固知识的方法。材料中， 孙老师拿出准备好的烧杯在学生面前做实验，播放幻灯片展示案例等方式运用了演 示法。(3)孙老师运用了谈话法。谈话法也叫问答法，是指教师按照一定的教学要求向 学生提出问题，要求学生回答，并通过问答的形式来引导学生获取新知识或巩固旧知 识的方法。材料中，孙老师抛出问题，学生随后回答，这运用了谈话法。(4)孙老师运用了实验法。实验法是指学生在教师的指导下，使用一定的仪器和 设备，在一定条件下引起某些事物和现象产生变化，并进行观察和分析，以获得知识 和技能的方法。材料中，通过燃烧条件得出灭火条件后，孙老师拿出教具，找几个学 生向其他同学一一示范，让学生自己讲解灭火的原理，这运用了实验法。(5)孙老师运用了讲授法。讲授法是指教师运用口头语言系统地向学生传授知识 的方法。材料中，孙老师讲解“燃烧和灭火”,边问边讲，这运用了讲授法。综上所述，孙老师在教学中正确运用了以上教学方法，是值得借鉴的。","materialType":["学生行为案例","教学案例"],"module":3,"keywords":["孙老师运用了讨论法、演示法、谈话法、实验法、讲授法等教学方法","从而获取知识的方法","范性的实验或采取现代化视听手段等指导学生获得知识或巩固知识的方法","识的方法","和技能的方法","的方法","孙老师在教学中正确运用了以上教学方法"],"questionPosition":"Q30","moduleName":"中学教学","subTopics":["教学原则-直观性","教学原则-启发性","教学原则-循序渐进","教学原则-巩固性","教学原则-理论联系实际","教学方法-讲授法","教学方法-讨论法","教学方法-演示法","教学方法-实验法","教学方法-读书指导法"],"coreConcepts":[]},{"exam":"2024下","number":31,"material":"王老师在讲三角形的面积计算公式时发现，直接告诉学生“三角形的面积=底× 高 太抽象，所以他让学生用纸做一个长10厘米、宽6厘米的长方形。王老师 问：“长方形的面积如何计算?”学生回答：“长乘以宽。”王老师又问：“那具体面积 是多少?”学生回答：“60平方厘米。”接着，王老师让学生把长方形沿对角线分成两 半，形成两个直角三角形，然后问：“现在一个三角形的面积是多少?”学生很快回 答出是30平方厘米。接着，王老师让学生再画一个长方形，并要求他们在长边任意 选择一个点，以另外一个长边为底，画一个非直角三角形，并提问这个非直角三角形 的面积是多少。一些学生说是长方形面积的一半，另一些学生说不知道。综上所述，结合皮亚杰的认知发展理论，回答下列","subQuestions":[{"number":1,"question":"简述同化和顺应的主要内容。","score":10,"answer":"皮亚杰认为，心理结构涉及图式、同化、顺应、平衡四个概念。同化是指有机体在面对一个新的刺激情境时，把刺激整合到已有的图式或认知结 构中，即把环境因素纳人已有的图式中，使之成为自身认知结构的一部分，从而加强 和丰富原有图式。顺应是指当有机体不能利用原有图式接受和解释新刺激时，其认知结构发生改变 来适应新刺激的影响，即改变原有图式，以适应环境。"},{"number":2,"question":"结合上述原理，分析王老师的教学活动。四、材料分析题","score":8,"answer":"材料中，王老师在讲解三角形的面积计算公式时，通过长方形面积的计算方 法，去讲解新的直角三角形的面积计算，学生能够利用已掌握的长方形面积计算的知 识解决新问题，并未改变已有的认知结构，这一过程中王老师采用的是同化。王老师后续再次提到，在长方形的长边任意选择一个点，以另外一个长边为底，画一个非直角三角形，部分学生无法回答出非直角三角形的面积，因为学生无法通过 使用长方形面积除以二的方式获得，需要学习三角形面积公式进行计算来获得答案， 故需要改变原有的认知结构，这一过程中王老师想要采用的方式是顺应，但部分学生 暂不了解。"}],"fullAnswer":"(1)皮亚杰认为，心理结构涉及图式、同化、顺应、平衡四个概念。同化是指有机体在面对一个新的刺激情境时，把刺激整合到已有的图式或认知结 构中，即把环境因素纳人已有的图式中，使之成为自身认知结构的一部分，从而加强 和丰富原有图式。顺应是指当有机体不能利用原有图式接受和解释新刺激时，其认知结构发生改变 来适应新刺激的影响，即改变原有图式，以适应环境。(2)材料中，王老师在讲解三角形的面积计算公式时，通过长方形面积的计算方 法，去讲解新的直角三角形的面积计算，学生能够利用已掌握的长方形面积计算的知 识解决新问题，并未改变已有的认知结构，这一过程中王老师采用的是同化。王老师后续再次提到，在长方形的长边任意选择一个点，以另外一个长边为底，画一个非直角三角形，部分学生无法回答出非直角三角形的面积，因为学生无法通过 使用长方形面积除以二的方式获得，需要学习三角形面积公式进行计算来获得答案， 故需要改变原有的认知结构，这一过程中王老师想要采用的方式是顺应，但部分学生 暂不了解。","materialType":["教学案例"],"module":4,"keywords":[],"questionPosition":"Q31","moduleName":"学习心理","subTopics":["学习动机-需要层次理论","学习迁移-经验类化说","学习迁移-认知结构说","学习策略-资源管理策略","认知主义-布鲁纳认知结构","建构主义-学习观"],"coreConcepts":["皮亚杰认知发展理论"]}]},{"exam":"2025上","rawFile":"25上 材料分析题 真题 科二.docx","items":[{"exam":"2025上","number":30,"material":"初二(一)班的许涛是一个淘气的孩子，课内外经常惹是生非，不写作业，不守 纪律。我作为新班主任和语文老师，第一次上作文课就发现全班唯有他一个人没有交 作文。于是我把他叫到了办公室，问道：“你为什么没有交作文?”他满不在乎地说： “我不会写。”生硬的语气给人无可奈何的感觉，眼里流露出你能拿我怎样的神情，这 也是淘气学生的一贯伎俩。该怎样让许涛心服口服呢?我边思索边拉过他的手，让14他坐下。这一拉手，我感觉到很惊讶，他的手上结着很厚的茧。于是我问：“暑假帮 爸妈干活了?”“是。”“那干什么活了?”“种地、种菜，干农活了。”我高兴地称赞 道：“真了不起。你的爸妈一定很高兴，你是个勤劳能吃苦的孩子。但与种地种菜比 起来，学习可轻松多了。如果你既能努力学习，又勤劳肯干，相信你的爸妈会更高 兴。”这时，许涛的话多了，冷漠的表情消失了，脸上露出了喜悦。“那回去把作文补 上吧。”“我不会写。”“我教你。”于是我耐心地把如何构思材料一五一十地讲给他听， 并让他晚上把作文补好。第二天早晨，他果真把作文交上来了，作文读起来让人感到 真切自然。我在班会上读了他的作文，并表扬了他，全班同学也报以热烈的掌声。后 来，班上的同学告诉我，许涛说自己如果不改正就对不起老师。我看到了他的进步， 在以后的几周里，又趁热打铁，有意安排他做了小组长。对他取得的点滴成绩予以表 扬，同时，对他提出了严格要求。这些做法让许涛找回了失去的信心，学习和纪律方 面都有了很大进步。","subQuestions":[{"number":1,"question":"班主任“我”贯彻了哪些德育原则?请结合材料加以分析。","score":18,"answer":"班主任老师贯彻了疏导原则。该原则是指教育者进行德育时要循循善诱，以 理服人，从提高学生认识入手，调动学生的主动性，使他们积极向上。材料中，班主 任“我”找到没有交作文的许涛同学，与他交流、谈心，循循善诱，以理服人，帮助 许涛转变了认识，调动了许涛学习的主动性，这体现了疏导原则。"}],"fullAnswer":"材料中的班主任老师主要贯彻了疏导原则，尊重学生与严格要求学生相结合的原 则，依靠积极因素、克服消极因素的原则，因材施教原则。(1)班主任老师贯彻了疏导原则。该原则是指教育者进行德育时要循循善诱，以 理服人，从提高学生认识入手，调动学生的主动性，使他们积极向上。材料中，班主 任“我”找到没有交作文的许涛同学，与他交流、谈心，循循善诱，以理服人，帮助 许涛转变了认识，调动了许涛学习的主动性，这体现了疏导原则。(2)班主任老师贯彻了尊重学生与严格要求学生相结合的原则。该原则是指教育 者进行德育时，要把对学生的思想和行为的严格要求与对他们个人的尊重和信赖结合 起来，使教育者对学生的影响与要求易于转化为学生的品德。材料中，班主任“我” 在许涛犯错后没有进行简单粗暴的处理，而是挖掘其长处，循循善诱，体现了“我” 对许涛的尊重信任，同时“我”还对许涛提出了严格要求，这体现了尊重学生与严格 要求学生相结合的原则。(3)班主任老师贯彻了依靠积极因素、克服消极因素的原则。该原则是指在德育 工作中，教育者要善于依靠、发扬学生自身的积极因素，调动学生自我教育的积极性， 克服消极因素，实现品德发展内部矛盾的转化。材料中，班主任“我”利用许涛勤劳 能吃苦的优点帮助其在学习、纪律方面取得了很大的进步，这体现了依靠积极因素、 克服消极因素的原则。(4)班主任老师贯彻了因材施教原则。该原则是指教育者进行德育时，要从学生 品德发展的实际出发，根据学生的年龄特征和个性差异进行不同的教育，使每个学生 的品德都能得到更好的发展。材料中，班主任“我”针对许涛的特点、学习现状专门 制定了适合许涛的教育措施，这符合因材施教原则。综上所述，班主任老师的教育措施正确地运用了德育原则，值得借鉴。","materialType":["学生心理案例","学生行为案例","班级管理案例"],"module":7,"keywords":["材料中的班主任老师主要贯彻了疏导原则","依靠积极因素、克服消极因素的原则","因材施教原则","(1)班主任老师贯彻了疏导原则","该原则","这体现了疏导原则","(2)班主任老师贯彻了尊重学生与严格要求学生相结合的原则","要求学生相结合的原则","(3)班主任老师贯彻了依靠积极因素、克服消极因素的原则","克服消极因素的原则","(4)班主任老师贯彻了因材施教原则","这符合因材施教原则","班主任老师的教育措施正确地运用了德育原则"],"questionPosition":"Q30","moduleName":"中学德育","subTopics":["德育原则-疏导原则","德育原则-因材施教","德育原则-依靠积极因素克服消极因素","德育原则-尊重与严格要求相结合","德育原则-正面教育与纪律约束相结合","德育原则-知行统一","德育方法-说服教育法","德育方法-自我修养法"],"coreConcepts":["因材施教原则","疏导原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则"]},{"exam":"2025上","number":31,"material":"李老师试图纠正学生在课堂上表现出的不适宜行为，他说：“同学们，我想跟你 们谈谈班上的一个问题。当我提出问题时，有些同学不是先举手等待老师叫名字，而 是直接回答问题。谁能告诉我，当我向你们提出问题时你们该怎么做?”王强高高地举起手来，随即大声道：“我知道!我知道!举手并安静地等待!”李 老师叹了气，他试图忽视王强，但王强是班里唯一举手的学生，并且你越不理睬他， 他就是越发使劲地挥动着手，大声说着自己的答案。李老师说：“好吧，王强，你觉得应该怎么做?”“我们应该举手，安静地等您叫 名字。”李老师接着说：“既然你知道应该这样，为什么在我叫你名字之前，你还要大 声回答呢?”停顿片刻后，李老师接着说：“谁能提醒大家一下有关课堂轮流发言的 规则?”三个学生举起了手，一起大声说起来：“一个人一个人地回答。”“按顺序回 答。”“别人发言时不要说话!”李老师有些不高兴地问道：“我们刚才不是强调过应 该等我叫名字吗?”“但是，李老师，”张红没举手就说，“刚刚王强并没有保持安静 等您叫名字，您不也叫他发言了吗?”","subQuestions":[{"number":1,"question":"请根据强化原理，分析李老师的做法有哪些问题。","score":10,"answer":"根据强化理论，李老师的做法存在以下问题：①对于不遵守课堂要求的王强同学，错误地运用了正强化。根据斯金纳的强化理 论，正强化是指给予一个愉快刺激，从而增强有机体行为出现的概率。材料中，王强 同学不遵守李老师制定的课堂发言规则，没有做到先举手并安静等待老师叫名字，而 是直接举手抢答。但李老师仍然给了他一个回答的机会，对于王强来说获得的是一种 愉快的刺激，起到了正强化的作用，李老师无意中强化了不恰当的行为，这会导致王 强同学不遵守课堂规则的行为发生频率增加。②班上其他学生受到了替代性强化的不良影响。根据班杜拉的观察学习理论，替 代性强化指的是观察者因看到榜样的行为被强化而受到强化。材料中，班上其他同学 通过观察，看到王强同学不遵守课堂规则仍然可以获得回答问题的机会，从而受到了 一种替代性强化，这会导致全班同学不遵守课堂规则的行为发生频率增加。"},{"number":2,"question":"请基于强化原理，提出处理这种情形的办法。四、材料分析题","score":8,"answer":"教师在培养学生良好行为时，应在了解学生的基础上，分析学生行为背后的 原因，并根据实际情况合理地运用强化规律。①合理且坚定地使用消退。教师应分析学生不良行为背后是什么因素在起强化作 用，尽可能消除强化学生不良行为的因素，通过不予理睬的消退方式来改变学生的不 良行为。材料中，对于王强同学不遵守课堂规则的行为，李老师应坚定地使用消退， 而不是直接给予他回答问题的机会。②发挥替代性强化的作用。材料中，李老师对课堂中不遵守课堂规则的王强同学， 应有意忽视，为其他学生树立行为的榜样，让其他学生知道这种行为是不恰当的，无 法得到回答问题的机会。其他学生通过观察李老师对待王强的态度和行为，会因此受 到替代性强化，类似的行为就会减少。"}],"fullAnswer":"(1)根据强化理论，李老师的做法存在以下问题：①对于不遵守课堂要求的王强同学，错误地运用了正强化。根据斯金纳的强化理 论，正强化是指给予一个愉快刺激，从而增强有机体行为出现的概率。材料中，王强 同学不遵守李老师制定的课堂发言规则，没有做到先举手并安静等待老师叫名字，而 是直接举手抢答。但李老师仍然给了他一个回答的机会，对于王强来说获得的是一种 愉快的刺激，起到了正强化的作用，李老师无意中强化了不恰当的行为，这会导致王 强同学不遵守课堂规则的行为发生频率增加。②班上其他学生受到了替代性强化的不良影响。根据班杜拉的观察学习理论，替 代性强化指的是观察者因看到榜样的行为被强化而受到强化。材料中，班上其他同学 通过观察，看到王强同学不遵守课堂规则仍然可以获得回答问题的机会，从而受到了 一种替代性强化，这会导致全班同学不遵守课堂规则的行为发生频率增加。(2)教师在培养学生良好行为时，应在了解学生的基础上，分析学生行为背后的 原因，并根据实际情况合理地运用强化规律。①合理且坚定地使用消退。教师应分析学生不良行为背后是什么因素在起强化作 用，尽可能消除强化学生不良行为的因素，通过不予理睬的消退方式来改变学生的不 良行为。材料中，对于王强同学不遵守课堂规则的行为，李老师应坚定地使用消退， 而不是直接给予他回答问题的机会。②发挥替代性强化的作用。材料中，李老师对课堂中不遵守课堂规则的王强同学， 应有意忽视，为其他学生树立行为的榜样，让其他学生知道这种行为是不恰当的，无 法得到回答问题的机会。其他学生通过观察李老师对待王强的态度和行为，会因此受 到替代性强化，类似的行为就会减少。","materialType":["学生行为案例","教学案例"],"module":4,"keywords":["(1)根据强化理论","根据班杜拉的观察学习理论","并根据实际情况合理地运用强化规律"],"questionPosition":"Q31","moduleName":"学习心理","subTopics":["学习迁移-经验类化说","行为主义-操作条件反射","行为主义-社会学习理论"],"coreConcepts":["操作条件反射理论"]}]},{"exam":"2025下","rawFile":"25下 材料分析题 真题 科二.docx","items":[{"exam":"2025下","number":30,"material":"红星中学初三(2)班有个特殊的小团体——6个男生课上课下学习生活总爱凑 在一起，他们做事效率高，如经常帮助老师收发作业、拿教具、搬椅子；爱表现，如 课堂发言很积极，踊跃参加运动会、拔河比赛、小品表演等集体活动。但他们的缺点 也很多，如不发言时就乱动乱嚷，干扰课堂的正常进行，自习课打打闹闹，逗贫取乐， 作业不是不交就是敷衍应付，教室里没有坐相，上操时没站相，跑步时抬不起腿。他 们被称为班上的“无奈六人组”。","subQuestions":[{"number":1,"question":"请依据德育原则,谈谈你对“无奈六人组”的教育建议(10分)。","score":8,"answer":"可利用疏导原则进行教育。疏导原则是指教育者进行德育时要循循善诱，以 理服人，从提高学生认识入手，调动学生的主动性，使他们积极向上。材料中，教师 可针对他们的不良行为，如不发言时就乱动乱嚷、自习课打打闹闹、逗贫取乐等，循 循善诱，以理服人，提高他们的道德认识，帮助他们改正不良行为。"}],"fullAnswer":"根据德育原则，对“无奈六人组”的教育建议如下：(1)可利用疏导原则进行教育。疏导原则是指教育者进行德育时要循循善诱，以 理服人，从提高学生认识入手，调动学生的主动性，使他们积极向上。材料中，教师 可针对他们的不良行为，如不发言时就乱动乱嚷、自习课打打闹闹、逗贫取乐等，循 循善诱，以理服人，提高他们的道德认识，帮助他们改正不良行为。(2)可利用依靠积极因素、克服消极因素的原则进行教育。依靠积极因素、克服 消极因素的原则是指德育工作中，教育者要善于依靠、发扬学生自身的积极因素，调 动学生自我教育的积极性，克服消极因素，实现品德发展内部矛盾的转化。材料中， 教师可挖掘他们做事效率高、爱表现的优点，为其提供展示机会，来转化他们干扰教 学、自习课打打闹闹等缺点。(3)可利用教育影响的一致性与连贯性原则进行教育。教育影响的一致性与连贯 性原则是指教育者进行德育时，应当有目的、有计划地把来自各方面对学生的教育影 响加以组织、调节、整合，使其互相配合、协调一致、前后连贯地进行，以保障学生 的品德能按教育目的的要求发展。材料中，针对作业应付问题，教师可以与家长商定， 建议家长在家营造安静学习环境，督促学生完成作业；学校的各科教师也要协作，及 时关注学生的作业完成情况，形成教育合力。(4)可利用尊重学生与严格要求学生相结合的原则进行教育。尊重学生与严格要 求学生相结合的原则是指教育者进行德育时，要把对学生的思想和行为的严格要求与 对他们个人的尊重和信赖结合起来，使教育者对学生的影响与要求易于转化为学生的 品德。材料中，教师在对学生进行教育时，不能表现出无奈、不耐烦等不良情绪，要 尊重他们，给予他们关爱，避免伤害他们的自尊心；同时也要严格要求学生，以免不 良行为的再次出现。综上所述，教师应综合运用德育原则进行教育，促进学生身心健康发展。","materialType":["教学案例","班级管理案例"],"module":7,"keywords":["根据德育原则","对“无奈六人组”的教育建议如下：(1)可利用疏导原则","疏导原则","(2)可利用依靠积极因素、克服消极因素的原则","消极因素的原则","(3)可利用教育影响的一致性与连贯性原则","性原则","(4)可利用尊重学生与严格要求学生相结合的原则","求学生相结合的原则","教师应综合运用德育原则"],"questionPosition":"Q30","moduleName":"中学德育","subTopics":["德育原则-疏导原则","德育原则-依靠积极因素克服消极因素","德育原则-尊重与严格要求相结合","德育原则-集体教育与个别教育相结合","德育原则-一致性与连贯性","德育原则-知行统一","德育方法-说服教育法","德育方法-陶冶教育法","德育方法-实际锻炼法","德育方法-自我修养法"],"coreConcepts":["疏导原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则","一致性与连贯性原则"]},{"exam":"2025下","number":31,"material":"初二学生李力天性好动，学习也比较努力，但成绩总不理想。老师经过一段时间 的观察，发现李力专心听课的时间较短，一般只有5分钟，时间一长，他不是东张西 望、坐立不安，就是呆呆地坐在座位上，两眼直直地盯着老师。老师让他回答问题时， 他却答非所问。如果他刚参与过文体活动，回到教室后就很难安静下来，不能集中注 意力听课。","subQuestions":[{"number":1,"question":"注意有哪些品质?分析案例中李力的注意品质存在的主要问题。","score":10,"answer":"注意的品质包括：注意的范围、注意的稳定性、注意的分配、注意的转移等。材料中，李力同学的注意品质存在注意稳定性差、注意难以转移的问题。①注意的稳定性指的是注意集中在一定对象或活动上的持续时间。注意稳定的相 反状态是注意的分散(分心),即注意离开了当前应当完成的任务而被无关的事物所 吸引。材料中，李力同学专心听课的时间比较短，上课东张西望、坐立不安，这是注 意稳定性差、容易分散的体现。②注意的转移指主体根据新的任务，主动地把注意从一个对象转移到另一个对象 或由一种活动转移到另一种活动的现象。材料中，李力同学刚参与过文体活动，回到 教室后就很难安静下来，不能集中注意力听课，这是注意难以从一个活动转移到另一 个活动的体现。"},{"number":2,"question":"作为教师，请对李力的注意品质提出建议。","score":8,"answer":"作为教师，针对李力同学注意品质的问题，可以从以下方面帮助他：①增强李力同学注意的稳定性，防止注意的分散。教师要注重学生良好学习习惯 的形成和意志力的锻炼，克服内部干扰。同时，加强学生学习目的性教育，端正其学 习态度，组织内容丰富、形式多样的教学活动，吸引学生的注意力。②提高李力同学注意转移的能力。提高学生自我行为的监控能力，使学生能够积 极、主动地服从教学安排，及时转移注意的对象。③提高李力同学注意的广度。让学生了解当前活动的性质和要求，适当安排教学 任务，扩大学生的注意范围。④加强李力同学注意分配的训练。训练学生一边听课， 一边做笔记的能力。对 学生进行听讲、书写、表达等基本学习能力训练，让学生在课堂上可以做到“一心 二用”。"}],"fullAnswer":"(1)注意的品质包括：注意的范围、注意的稳定性、注意的分配、注意的转移等。材料中，李力同学的注意品质存在注意稳定性差、注意难以转移的问题。①注意的稳定性指的是注意集中在一定对象或活动上的持续时间。注意稳定的相 反状态是注意的分散(分心),即注意离开了当前应当完成的任务而被无关的事物所 吸引。材料中，李力同学专心听课的时间比较短，上课东张西望、坐立不安，这是注 意稳定性差、容易分散的体现。②注意的转移指主体根据新的任务，主动地把注意从一个对象转移到另一个对象 或由一种活动转移到另一种活动的现象。材料中，李力同学刚参与过文体活动，回到 教室后就很难安静下来，不能集中注意力听课，这是注意难以从一个活动转移到另一 个活动的体现。(2)作为教师，针对李力同学注意品质的问题，可以从以下方面帮助他：①增强李力同学注意的稳定性，防止注意的分散。教师要注重学生良好学习习惯 的形成和意志力的锻炼，克服内部干扰。同时，加强学生学习目的性教育，端正其学 习态度，组织内容丰富、形式多样的教学活动，吸引学生的注意力。②提高李力同学注意转移的能力。提高学生自我行为的监控能力，使学生能够积 极、主动地服从教学安排，及时转移注意的对象。③提高李力同学注意的广度。让学生了解当前活动的性质和要求，适当安排教学 任务，扩大学生的注意范围。④加强李力同学注意分配的训练。训练学生一边听课， 一边做笔记的能力。对 学生进行听讲、书写、表达等基本学习能力训练，让学生在课堂上可以做到“一心 二用”。","materialType":["学生心理案例"],"module":4,"keywords":[],"questionPosition":"Q31","moduleName":"学习心理","subTopics":["学习动机-归因理论","学习迁移-形式训练说","学习策略-认知策略","学习策略-元认知策略","学习策略-资源管理策略","学习策略-复习方法","行为主义-社会学习理论","认知主义-布鲁纳认知结构","建构主义-学习观","认知过程-注意品质"],"coreConcepts":["注意的品质"]}]},{"exam":"2026上","rawFile":"26上 材料分析题 真题 科二.docx","items":[{"exam":"2026上","number":30,"material":"一位地理老师在讲授“水土保持”一课时，将教学过程分成以下几个阶段：(1)组织教学：概括讲授本课的教学目的、内容及有关步骤。(2)提出问题：学生观看黄河流域相关视频后，老师提出问题：黄河水为什么这 么黄?为什么会含有大量泥沙?(3)感知教材：老师为学生提供黄河流域的资料(文字、图片等),让学生推想 黄河水带有大量泥沙的原因。(4)模拟实验：老师为学生提供泥土、水等材料，让学生用实验验证他们的推想。(5)小组讨论：学生在老师的指导下，分成几个小组，讨论水土流失的问题。(6)课堂小结：学生通过阅读材料并结合前面的研究，形成如何保持水土的结论； 老师结合环境保护对学生进行情感、态度、价值观教育。","subQuestions":[{"number":1,"question":"结合材料，分析说明该老师贯彻了哪些教学原则。","score":18,"answer":"该老师贯彻了直观性原则。直观性原则是指教学中要通过学生观察所学事 物或教师语言形象的描述，引导学生形成对所学事物、过程的清晰表象，丰富他们的 感性认识，从而使他们能够正确理解书本知识和发展认识能力。材料中，老师让学生 观看黄河流域相关视频，遵循了直观性原则。"}],"fullAnswer":"材料中，该老师贯彻了直观性原则、启发性原则、循序渐进原则以及思想性和科 学性相统一原则。第一，该老师贯彻了直观性原则。直观性原则是指教学中要通过学生观察所学事 物或教师语言形象的描述，引导学生形成对所学事物、过程的清晰表象，丰富他们的 感性认识，从而使他们能够正确理解书本知识和发展认识能力。材料中，老师让学生 观看黄河流域相关视频，遵循了直观性原则。第二，该老师贯彻了启发性原则。启发性原则是指在教学中教师要承认学生是学 习的主体，注意调动他们的学习主动性，引导他们独立思考、积极探索，生动活泼地 学习，自觉掌握科学知识，提高分析问题和解决问题的能力。材料中，老师通过提问， 引导学生思考，遵循了启发性原则。第三，该老师贯彻了循序渐进原则。循序渐进原则是指教学要按照学科的逻辑系 统和学生认识发展的顺序进行，使学生系统地掌握基础知识、基本技能，形成严密的 逻辑思维能力。材料中，老师按照组织教学、提出问题、感知教材、模拟实验、小组 讨论、课堂小结的顺序，一步步地逐渐让学生理解了“水土保持”一课内容，遵循了 循序渐进原则。第四，该老师贯彻了思想性和科学性相统一原则。思想性和科学性相统一原则是 指既要把现代先进科学的基础知识和基本技能传授给学生，同时也要结合知识、技能 中内在的德育因素，对学生进行政治、思想教育和道德品质教育。材料中，老师结合 环境保护对学生进行情感、态度、价值观教育，遵循了思想性和科学性相统一原则。综上所述，该老师贯彻了直观性原则、启发性原则、循序渐进原则以及思想性和 科学性相统一原则，值得借鉴。","materialType":["学生行为案例","教学案例"],"module":3,"keywords":["该老师贯彻了直观性原则","、启发性原则","、循序渐进原则","学性相统一原则","直观性原则","遵循了直观性原则","该老师贯彻了启发性原则","启发性原则","遵循了启发性原则","该老师贯彻了循序渐进原则","循序渐进原则","该老师贯彻了思想性和科学性相统一原则","思想性和科学性相统一原则","遵循了思想性和科学性相统一原则","科学性相统一原则"],"questionPosition":"Q30","moduleName":"中学教学","subTopics":["教学原则-直观性","教学原则-启发性","教学原则-循序渐进","教学原则-思想性与科学性统一","教学方法-讲授法","教学方法-讨论法","教学方法-演示法","教学方法-实验法","教学方法-读书指导法","教学过程-基本阶段"],"coreConcepts":["直观性原则","启发性原则","循序渐进原则","思想性与科学性统一原则"]},{"exam":"2026上","number":31,"material":"初三学生徐涛勤奋好学、严谨认真，但生性敏感，做事过于追求完美。父母对他 有很高的期望，对他的学习要求特别严格。为此，他学习非常用功，成绩一直在班上 名列前茅。但在一次重要的考试中，徐涛的成绩很不理想。他在学校受到老师的批评 与同学的取笑，回家后又遭到父母的严厉责备，导致心理负担过重。他认为自己难以 达到父母的期待，因而常常自责、内疚，觉得自己很没用，前途无望。之后，每次考 试前好几天他就开始紧张不安，总担心自己考不好。考试时，他会感到呼吸急促、心 慌、手发抖、出汗，注意力难以集中，有时候脑子里一片空白，明明已经掌握的知识 怎么也想不起来，考试成绩越来越差。","subQuestions":[{"number":1,"question":"根据心理健康相关知识，分析材料中徐涛的心理问题及成因。","score":10,"answer":"徐涛的心理问题属于考试焦虑。焦虑症是个体不能达成目标或不能克服困难的威胁，致使自尊心、自信心受挫，或使失败感和内疚感增加，形成一种紧张不安、 带有恐惧的情绪状态。中学生最常见的焦虑反应是考试焦虑。其表现是：随着考试临 近，心情极度紧张；考试时不能集中注意力，知觉范围变窄，思维刻板，出现慌乱， 无法发挥正常水平；考试后又持久地不能松弛下来。材料中，徐涛在每次考试前好几 天就开始紧张不安，总担心自己考不好；考试时会感到呼吸急促、心慌、手发抖、出 汗，注意力难以集中，有时候脑子里一片空白，这些都是考试焦虑的表现。考试焦虑的成因：①学校的统考，升学持久的、过度的压力；②家长对子女期望 过高；③学生个人过分地争强好胜；④学业上多次遭受失败；⑤个体自身具有容易引 发焦虑反应的人格特质等。"},{"number":2,"question":"针对徐涛出现的心理问题，给出合理的心理辅导建议。四、材料分析题","score":8,"answer":"针对徐涛的心理问题，可以采用以下心理辅导方法进行矫正：①肌肉放松训练法。通过改变肌肉紧张状态，减轻肌肉紧张引起的酸痛，从而应 对情绪上的紧张、不安、焦虑和烦躁。当徐涛感到呼吸急促、紧张不安时，可采用肌 肉放松训练法缓解。②系统脱敏法。当某些人对某事物、某环境产生敏感反应(害怕、焦虑、不安) 时，可以在当事人身上发展起一种不相容的反应，使其对本来可引起敏感反应的事物， 不再发生敏感反应。可通过建立焦虑等级表，逐个层级进行放松训练，最终消除徐涛 的考试焦虑问题。③合理情绪疗法。指导徐涛在考试中使用正向的自我对话，如“我能应对这个考 试”“成绩并不重要，学会才是重要的”“无论考试的结果如何，都不会是最后一次”。 这对于缓解徐涛的考试焦虑，会有较好的效果。④强化法。每当学生出现所期望的心理与目标行为时，或者在一种符合要求的良 好行为出现之后，采取奖励办法立刻强化，以增加此种行为出现的频率。当徐涛成绩 提高时，教师应给予及时强化。"}],"fullAnswer":"(1)徐涛的心理问题属于考试焦虑。焦虑症是个体不能达成目标或不能克服困难的威胁，致使自尊心、自信心受挫，或使失败感和内疚感增加，形成一种紧张不安、 带有恐惧的情绪状态。中学生最常见的焦虑反应是考试焦虑。其表现是：随着考试临 近，心情极度紧张；考试时不能集中注意力，知觉范围变窄，思维刻板，出现慌乱， 无法发挥正常水平；考试后又持久地不能松弛下来。材料中，徐涛在每次考试前好几 天就开始紧张不安，总担心自己考不好；考试时会感到呼吸急促、心慌、手发抖、出 汗，注意力难以集中，有时候脑子里一片空白，这些都是考试焦虑的表现。考试焦虑的成因：①学校的统考，升学持久的、过度的压力；②家长对子女期望 过高；③学生个人过分地争强好胜；④学业上多次遭受失败；⑤个体自身具有容易引 发焦虑反应的人格特质等。(2)针对徐涛的心理问题，可以采用以下心理辅导方法进行矫正：①肌肉放松训练法。通过改变肌肉紧张状态，减轻肌肉紧张引起的酸痛，从而应 对情绪上的紧张、不安、焦虑和烦躁。当徐涛感到呼吸急促、紧张不安时，可采用肌 肉放松训练法缓解。②系统脱敏法。当某些人对某事物、某环境产生敏感反应(害怕、焦虑、不安) 时，可以在当事人身上发展起一种不相容的反应，使其对本来可引起敏感反应的事物， 不再发生敏感反应。可通过建立焦虑等级表，逐个层级进行放松训练，最终消除徐涛 的考试焦虑问题。③合理情绪疗法。指导徐涛在考试中使用正向的自我对话，如“我能应对这个考 试”“成绩并不重要，学会才是重要的”“无论考试的结果如何，都不会是最后一次”。 这对于缓解徐涛的考试焦虑，会有较好的效果。④强化法。每当学生出现所期望的心理与目标行为时，或者在一种符合要求的良 好行为出现之后，采取奖励办法立刻强化，以增加此种行为出现的频率。当徐涛成绩 提高时，教师应给予及时强化。","materialType":["学生心理案例","家校案例"],"module":6,"keywords":["可以采用以下心理辅导方法"],"questionPosition":"Q31","moduleName":"心理辅导","subTopics":["心理问题-考试焦虑","辅导方法-肌肉放松训练","辅导方法-系统脱敏法","辅导方法-合理情绪疗法","辅导方法-强化法"],"coreConcepts":["考试焦虑","系统脱敏法","合理情绪疗法","肌肉放松训练"]}]}]};

TABS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (t.id===activeTab?' active':'');
  btn.textContent = t.label;
  btn.onclick = () => switchTab(t.id);
  tabNav.appendChild(btn);
});

function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  tabNav.querySelectorAll('.tab-btn').forEach((b,i) => { if(TABS[i].id===id) b.classList.add('active'); });
  activeTab = id;
  if (id==='dashboard') renderDashboard();
  if (id==='predict') renderPredict();
  if (id==='detail') renderDetail();
  if (id==='map') renderMap();
  if (id==='selftest') renderSelfTest();
  if (id==='study') renderStudyTab();
}

// ===== HELPERS =====
function modColor(m) { return MOD_COLORS[String(m)]||'#94a3b8'; }
function modName(m) { return MOD_NAMES[String(m)]||'未知'; }
function likelihoodBadge(l) {
  if (l==='极高') return '<span class="badge badge-h">极高</span>';
  if (l==='高') return '<span class="badge badge-h">高</span>';
  if (l==='中') return '<span class="badge badge-m">中</span>';
  return '<span class="badge badge-l">低</span>';
}
function subTopicLabel(st) {
  if (st.includes('-')) return st.split('-').pop();
  return st;
}

function renderPredict() {

  const bt = PRED.methodology.backtest;

  // Q30 prediction
  html += '<div class="card"><h3>🔮 Q30 预测（2026下半年）</h3>';

  q30Pred.modulePredictions.slice(0,4).forEach((r,i) => {
    html += '<div class="pred-item">';

    html += '<div class="pred-score" style="color:'+modColor(r.module)+';">'+r.score+'分 '+likelihoodBadge(r.likelihood)+'</div>';

    html += '</tr>';
  });
  html += '</table></div></div>';

  });
  html += '</div>';

  div.innerHTML = html;
}

  DATA.exams.forEach(e => html += '<option value="'+e.exam+'">'+e.exam+'</option>');
  html += '</select>';
  html += '<select id="filterMod" onchange="filterDetail()"><option value="">全部模块</option>';
  for (let m=1;m<=8;m++) html += '<option value="'+m+'">M'+m+' '+modName(m)+'</option>';
  html += '</select>';
  html += '<select id="filterPos" onchange="filterDetail()"><option value="">全部题位</option><option value="30">Q30</option><option value="31">Q31</option></select>';
  html += '</div><div id="detailList"></div>';
  div.innerHTML = html;
  filterDetail();
}

function filterDetail() {
  const exam = document.getElementById('filterExam')?.value || '';
  const mod = document.getElementById('filterMod')?.value || '';
  const pos = document.getElementById('filterPos')?.value || '';
  let filtered = ALL_Q;
  if (exam) filtered = filtered.filter(q => q.exam===exam);
  if (mod) filtered = filtered.filter(q => String(q.module)===mod);
  if (pos) filtered = filtered.filter(q => String(q.number)===pos);

  let html = '<p style="font-size:0.82rem;color:var(--text2);margin-bottom:8px;">共 '+filtered.length+' 题</p>';
  filtered.forEach((q,i) => {
    html += '<div class="accordion" id="acc'+i+'">';
    html += '<div class="accordion-header" onclick="this.parentElement.classList.toggle(\'open\')">';
    html += '<span><span class="module-tag" style="background:'+modColor(q.module)+';color:#0f172a;">M'+q.module+'</span> Q'+q.number+' · '+q.exam+'</span>';
    html += '<span style="font-size:0.78rem;color:var(--text2);">'+(q.coreConcepts[0]||'')+' ▼</span>';
    html += '</div>';
    html += '<div class="accordion-body">';
    html += '<div style="margin-bottom:12px;"><strong>📖 材料：</strong><br>'+q.material+'</div>';
    q.subQuestions.forEach(sq => {
      html += '<div style="margin-bottom:8px;"><strong>❓ 问题('+sq.number+') ['+sq.score+'分]：</strong>'+sq.question+'</div>';
      if (sq.answer) {
        html += '<div class="answer-highlight"><strong>✅ 参考答案：</strong><br>'+sq.answer+'</div>';
      }
    });
    html += '<div style="font-size:0.78rem;color:var(--text2);margin-top:8px;">材料类型: '+q.materialType.join(' · ')+' | 子考点: '+q.subTopics.join(', ')+'</div>';
    html += '</div></div>';
  });
  document.getElementById('detailList').innerHTML = html;
}

  document.querySelectorAll('[id^="mapBtn"]').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('mapBtn'+m);
  if (btn) btn.classList.add('active');

  const modKey = 'M'+m;

  if (!ontology) { document.getElementById('mapContent').innerHTML = '<p>暂无该模块数据</p>'; return; }

  let html = '<h3 style="color:'+modColor(m)+';margin-bottom:12px;">'+modKey+' '+ontology.name+' — 子考点地图</h3>';

  const tested = sts.filter(([,v])=>v.tested);
  const blanks = sts.filter(([,v])=>!v.tested);

  html += '<p style="font-size:0.82rem;color:var(--text2);margin-bottom:12px;">已考: '+tested.length+' | 空白: '+blanks.length+' | 总计: '+sts.length+'</p>';

// ===== TAB 8: SELF TEST =====
let selftestIndex = 0;
let selftestData = [];

function buildSelftestData() {
  selftestData = [];
  DATA.exams.forEach(exam => {
    exam.items.forEach(item => {
      selftestData.push({
        exam: exam.exam,
        number: item.number,
        module: item.module,
        material: item.material,
        questions: item.subQuestions.map(sq => sq.question).join('；'),
        answer: item.fullAnswer
      });
    });
  });
  // Add predicted questions based on top blanks
  const q30Blanks = PRED.predictions.q30.topSubTopicPredictions.filter(p=>!p.tested).slice(0,3);
  const q31Blanks = PRED.predictions.q31.topSubTopicPredictions.filter(p=>!p.tested).slice(0,3);
  [...q30Blanks, ...q31Blanks].forEach(p => {
    selftestData.push({
      exam: '🔮预测',
      number: p.module===7?30:31,
      module: p.module,
      material: '【预测模拟题】请结合材料分析关于"'+subTopicLabel(p.subTopic)+'"的相关理论和应用。' + (p.keywords?'\n关键词提示：'+p.keywords.join('、'):''),
      questions: '请根据材料，运用相关理论进行分析并给出建议。',
      answer: '(此为预测题，参考答案请在"预测"Tab中查看对应子考点的详细内容)'
    });
  });
}

  buildSelftestData();

  showSelftestCard();
}

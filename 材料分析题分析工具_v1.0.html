运用了什么德育方法及取得的效果。（10分）","结合材料，谈谈如何通过实际锻炼培养中学生的社会责任感。（8分）"]}},"德育方法-品德评价法":{"d":"教师根据德育目标，对学生已形成的品德或目前已有的品德发展状况进行评价，以促进学生品德发展的方法。包括表扬奖励、批评惩罚、评比竞赛和操行评定。","r":"材料中出现教师表扬/批评学生、评选\"三好学生\"、班级评比、奖惩措施等情境。关键词有\"奖励\"\"惩罚\"\"评比\"\"表扬\"\"批评\"。","a":["识别：材料中老师通过XX评价方式激励/纠正学生行为，体现了品德评价法","解释：品德评价法通过正负强化来引导学生的品德发展方向","引用材料：老师对XX学生的行为给予了……，这种做法……","分析：合理的评价可以强化良好行为、纠正不良行为，但要注意方式方法","建议：①以表扬奖励为主、批评惩罚为辅 ②评价要公正及时 ③避免简单粗暴的惩罚 ④引导学生进行自我评价"],"m":"表扬批评有分寸，评比激励促成长","v":["材料中老师对学生的处理方式是否恰当？请用相关德育理论分析。","如何正确运用品德评价法促进中学生品德发展？"],"p":"从未考过的空白考点(高引力)；Q30德育题位信号","s":{"m":"期末考试后，王老师在班上公开表扬了进步最大的5名学生，并颁发了\"进步之星\"奖状。但对一名作弊的学生，王老师没有当众批评，而是课后单独谈心，帮助其认识到错误。该生后来主动承认错误并在全班道歉。","q":["请分析王老师的做法体现了什么德育方法及其效果。（10分）","结合材料，谈谈如何正确运用表扬与批评促进学生品德发展。（8分）"]}},"德育方法-自我修养法":{"d":"教师指导学生进行自我教育、自我反思、自我提高的方法。包括座右铭、自我批评、立志、慎独等方式。强调学生的主体性和自觉性。","r":"材料中出现学生写日记反思、制定个人目标、自我约束、慎独等情境。关键词有\"反思\"\"自省\"\"座右铭\"\"自我约束\"\"慎独\"。","a":["识别：材料中老师引导学生进行XX自我教育活动，体现了自我修养法","解释：自我修养法是学生在教师指导下自觉进行道德修养的方法，核心是激发学生的道德自觉","引用材料：材料中老师引导学生通过……的方式进行自我教育","分析：真正的品德发展最终要靠学生的自我修养，外因通过内因起作用","建议：①引导学生制定个人修养计划 ②培养反思习惯（如写反思日记） ③传授慎独、座右铭等方法 ④定期组织自我评价交流"],"m":"自我修养靠自觉，反思慎独座右铭","v":["材料中老师引导学生进行自我反思的做法体现了什么德育方法？","如何在中学德育中培养学生自我教育的能力？"],"p":"从未考过的空白考点(高引力)；Q30德育题位信号；新课标强调学生主体性","s":{"m":"周老师要求全班学生每周写一篇\"道德日记\"，反思自己一周来的行为。期末时，周老师还组织学生给自己写一封信\"致一年后的自己\"。很多学生表示通过反思，更加清楚自己的不足和努力方向。","q":["请分析周老师的做法体现了什么德育理念和方法。（10分）","结合实际，谈谈如何培养中学生的自我教育能力。（8分）"]}},"德育原则-疏导原则":{"d":"进行德育时要循循善诱、以理服人，从提高学生认识入手，调动学生的主动性，使他们积极向上。又称\"循循善诱原则\"。","r":"材料中出现学生犯了错误、老师没有直接批评而是讲道理、耐心引导的情境。","a":["识别：材料中老师面对学生的问题行为，没有简单批评而是耐心讲道理，体现了疏导原则","解释：疏导原则强调循循善诱、以理服人，让学生从内心接受教育","引用材料+分析+建议三步一体：老师通过讲道理让学生认识到……，从而主动改正"],"m":"疏导讲理不压制，循循善诱开心扉","v":[],"p":"","s":null},"德育原则-因材施教":{"d":"德育要从学生的思想认识和品德发展的实际出发，根据他们的年龄特征和个性差异进行不同的教育，使每个学生的品德都能得到最好的发展。","r":"材料中出现针对不同学生采取不同教育方式、了解学生个性后进行个别教育的情境。","a":["识别：材料中老师针对不同学生的特点采取了不同的教育方式，体现了因材施教原则","解释：因材施教原则要求根据学生的年龄特征和个性差异进行有针对性的教育","核心答题模板：①了解学生个性特点 ②采取差异化教育策略 ③关注每个学生的发展"],"m":"一把钥匙开一把锁，因人而异施教育","v":[],"p":"","s":null},"德育原则-依靠积极因素克服消极因素":{"d":"德育要依靠和发扬学生品德中的积极因素，克服其消极因素，促进品德转化和发展。又称\"长善救失原则\"。教师要善于发现学生的\"闪光点\"。","r":"材料中出现老师发现\"后进生\"的优点、利用学生特长/兴趣帮助转变不良行为的情境。","a":["识别：材料中老师发现了XX学生的闪光点/优点，并以此来帮助他改正XX问题","解释：该原则要求教师一分为二看待学生，善于发现积极因素并使其成为转化的突破口","核心模板：①发现优点——该生虽然……但是…… ②利用优点——通过……活动让该生体验成功 ③转化缺点——在积极体验中逐渐克服……"],"m":"长善救失找亮点，化消极变为积极","v":[],"p":"","s":null},"德育原则-尊重与严格要求相结合":{"d":"德育要把对学生的尊重和信赖与对他们思想和行为的严格要求结合起来，使教育者提出的要求易于转化为学生的品德。","r":"材料中出现老师对学生既严格又关爱、在尊重学生人格的同时提出明确要求的情境。","a":["识别：老师既尊重学生又对其提出严格要求，体现了尊重与严格要求相结合原则","解释：尊重是严格要求的前提，严格要求是尊重的体现，二者辩证统一","核心模板：①尊重学生人格——保护自尊心 ②提出明确合理的要求 ③要求一经提出就要坚持贯彻"],"m":"尊重信任是前提，严格要求不含糊","v":[],"p":"","s":null},"德育原则-集体教育与个别教育相结合":{"d":"德育既要教育集体，又要通过集体教育个别学生，使集体和个人互相促进。马卡连柯提出\"平行教育\"思想。","r":"材料中出现通过班集体影响个别学生、或通过教育个别学生影响整个班级的情境。","a":["识别：老师通过班集体的力量来教育个别学生/通过教育个别学生来带动全班","解释：该原则强调集体与个人的相互作用，集体是教育的手段也是教育的目的","核心模板：①建设良好班集体→形成积极舆论氛围 ②通过集体影响个人 ③通过教育个人促进集体"],"m":"集体个人互相促，平行教育马卡连柯","v":[],"p":"","s":null},"德育原则-正面教育与纪律约束相结合":{"d":"德育既要正面引导、正面教育，又要辅之以必要的纪律约束，二者相辅相成。","r":"材料中出现老师在正面引导的同时辅以班规纪律约束学生的情境。","a":["识别：老师在积极引导的同时也让学生遵守纪律规范","解释：正面教育是主要手段，纪律约束是辅助手段，两者结合才能有效","核心模板：①讲清道理进行正面引导 ②制定明确的纪律规范 ③违纪时有理有据地处理"],"m":"正面引导为主导，纪律约束作辅助","v":[],"p":"","s":null},"德育原则-一致性与连贯性":{"d":"德育要统一学校内部各方面、学校与家庭、社会各方面的教育影响，保持教育影响的一致性和连贯性。","r":"材料中出现家校合作、各科教师协调、学校与社区配合教育学生的情境。","a":["识别：学校/老师联合家庭和社会力量共同教育学生，体现了一致性与连贯性原则","解释：各方面教育力量方向一致、前后连贯，才能形成教育合力","核心模板：①协调校内各方教育力量（各科教师、班主任、团队组织）②家校合作形成合力 ③保持教育要求的前后一致性"],"m":"家校社三位一体，教育合力不分散","v":[],"p":"","s":null},"德育方法-说服教育法":{"d":"通过摆事实、讲道理，使学生提高认识、形成正确观点的方法。是德育的基本方法，包括语言说服和事实说服。","r":"材料中出现老师给学生讲道理、用事实/案例说服学生、组织讨论等情境。","a":["识别：老师通过讲道理/摆事实的方式教育学生，体现了说服教育法","解释：说服教育法是德育的基本方法，通过理性认识来改变学生的思想和行为"],"m":"摆事实讲道理，以理服人说服法","v":[],"p":"","s":null},"德育方法-榜样示范法":{"d":"以他人的高尚思想、模范行为和卓越成就来影响学生品德的方法。包括伟人典范、教育者示范和学生中的好榜样。","r":"材料中出现老师以身作则、树立学生榜样、讲述英雄模范事迹等情境。","a":["识别：老师以XX为榜样来引导学生/老师自身的示范行为影响了学生","解释：榜样示范法通过具体的典型形象感染学生，符合青少年模仿性强的心理特点"],"m":"榜样的力量无穷，身教重于言教","v":[],"p":"","s":null},"学习动机-成就动机理论":{"d":"阿特金森提出，个体的成就动机分为力求成功的动机和避免失败的动机。力求成功者选择中等难度（50%）的任务；避免失败者选择过难或过易的任务。","r":"材料中出现学生不敢挑战、逃避有难度的任务、或对成功/失败的态度差异。关键词有\"害怕失败\"\"不敢尝试\"\"挑战\"\"难度\"。","a":["识别：材料中XX同学的表现反映了力求成功/避免失败的动机倾向","解释：成就动机理论认为个体有追求成功和避免失败两种倾向，不同倾向导致不同行为选择","引用材料：XX同学选择……（难度任务），这是因为TA的……动机占主导","分析：该生在面对……时表现出……，说明其成就动机类型偏向……","建议：①对力求成功者提供中等难度挑战 ②对避免失败者降低任务难度、多给予成功体验 ③引导学生建立合理的成就目标"],"m":"阿特金森两动机，求成避败择难度","v":["请用成就动机理论分析材料中XX学生的学习行为。","作为教师，如何激发不同类型学生的成就动机？"],"p":"从未考过的空白考点(高引力)；Q31学习心理题位信号；下半年偏好实践应用类","s":{"m":"小明学习成绩中等，每次遇到稍有难度的题目就直接放弃，说\"反正我也做不出来\"。而同班的小红每次遇到难题都很兴奋，说\"试试看能不能做出来\"。期末考试前，小明选择复习最简单的题目，小红则专门攻克难题。","q":["请用成就动机理论分析小明和小红的学习行为差异。（10分）","作为教师，应如何帮助小明建立积极的成就动机？（8分）"]}},"学习动机-需要层次理论":{"d":"马斯洛将人的需要分为七个层次（生理→安全→归属与爱→尊重→认知→审美→自我实现）。低层次需要得到基本满足后，高层次需要才会产生。学生在学校中，归属需要和尊重需要尤为重要。","r":"材料中出现学生因家庭问题/同学关系/被尊重感缺失导致学习动力不足的情境。关键词有\"不自信\"\"被冷落\"\"缺乏关爱\"\"没有归属感\"。","a":["识别：材料中XX学生因……（低层次需要未满足）而影响了学习动机，可以用需要层次理论解释","解释：马斯洛需要层次理论认为低层次需要未满足时，高层次需要（如学习）难以产生","引用材料：该生因为……（爱的需要/尊重需要未满足），导致对学习（认知需要）缺乏兴趣","分析：只有当学生的归属感和自尊需要得到满足后，他们才会追求知识和自我实现","建议：①营造温暖接纳的班级氛围，满足归属需要 ②多给予学生肯定和尊重 ③关注学生家庭背景，必要时提供支持"],"m":"马斯洛七层金字塔，缺爱缺尊不学习","v":["请用需要层次理论分析材料中XX学生缺乏学习动力的原因。","结合需要层次理论，谈谈教师如何激发学生的学习动机。"],"p":"从未考过的空白考点(高引力)；Q31学习心理题位信号；热点关联（心理健康教育）","s":{"m":"小华最近成绩直线下滑，上课经常走神。班主任家访后发现，小华父母正在闹离婚，家里气氛紧张，小华说\"连家都快没了，还学什么习\"。班上还有几个同学经常孤立小华，不和他一起活动。","q":["请用需要层次理论分析小华学习动机下降的原因。（10分）","作为班主任，你将如何帮助小华重燃学习动力？（8分）"]}},"学习策略-认知策略":{"d":"学习者加工信息的方法和技术，包括复述策略（重复、抄写）、精加工策略（记忆术、做笔记、提问）和组织策略（归类、列提纲、画思维导图）。","r":"材料中出现学生使用记忆方法、做笔记、画知识框架图、归类整理等学习行为。关键词有\"记忆\"\"整理\"\"归纳\"\"笔记\"\"思维导图\"。","a":["识别：材料中XX学生使用了……的认知策略来学习","解释：认知策略是加工信息的有效方法，包括复述、精加工和组织三种类型","引用材料：该生通过……方式（归类/记忆术/提纲）来学习，这是一种……策略","分析：有效的认知策略能提高学习效率，而策略缺失会导致学习困难","建议：①教给学生具体的认知策略（如SQ3R阅读法、概念图） ②在各科教学中渗透策略指导 ③让学生体验不同策略的效果，自主选择"],"m":"复述精加工组织，认知策略三兄弟","v":["请分析材料中XX学生的学习策略及其效果。","作为教师，如何指导中学生掌握有效的认知策略？"],"p":"从未考过的空白考点(高引力)；Q31学习心理题位信号；与\"学会学习\"热点高度相关","s":{"m":"小刚和小强是同班同学，两人都很用功。小刚每天反复抄写课文和笔记，但考试时遇到稍微变通的题目就不会了。小强则喜欢用思维导图整理知识框架，还会自己编口诀记忆重点内容，考试时能灵活运用。两人的成绩差距越来越大。","q":["请用学习策略理论分析小刚和小强学习效果的差异。（10分）","教师应如何帮助学生掌握有效的认知策略？（8分）"]}},"学习策略-元认知策略":{"d":"学习者对自己认知过程的认知和调控，包括计划策略（设置目标、浏览材料）、监视策略（自我提问、集中注意）和调节策略（调整速度、重新阅读）。是\"关于认知的认知\"。","r":"材料中出现学生制定学习计划、自我检查理解程度、调整学习方法等行为。或出现学生不会规划、不会自我监控导致学习问题的情境。","a":["识别：材料中XX学生（不会/善于）计划和监控自己的学习，反映了元认知策略的（缺失/运用）","解释：元认知策略是对自己学习过程的计划、监控和调节，是\"学会学习\"的核心能力","引用材料：该生在……时（能够/不能）……，说明……","分析：元认知能力是高效学习的关键，很多学生学习困难源于不会\"管理自己的学习\"","建议：①引导学生制定学习计划并自我检查 ②教给学生自我提问的技巧（\"我理解了吗？\"）③培养反思习惯"],"m":"计划监控和调节，学会学习元认知","v":["请用元认知策略理论分析XX学生的学习问题。","如何在教学中培养学生的元认知能力？"],"p":"从未考过的空白考点(高引力)；Q31学习心理题位信号","s":{"m":"小玲学习很努力，每天花很长时间学习，但效率很低。老师发现她从不做学习计划，复习到一半才发现时间不够；遇到不理解的也不查资料，继续往下看。考试后她从不想\"我哪里做得不好\"，只是说\"我太笨了\"。","q":["请用元认知策略理论分析小玲学习效率低的原因。（10分）","如何帮助小玲提高元认知能力？（8分）"]}},"认知过程-思维与问题解决":{"d":"问题解决是由一定情境引起、按照一定目标、应用各种认知活动经过一系列思维操作使问题得以解决的过程。影响因素包括问题表征、定势与功能固着、原型启发、情绪与动机等。","r":"材料中出现学生解题思路僵化、不能灵活变通、受思维定势影响等情境。关键词有\"定势\"\"功能固着\"\"原型启发\"\"钻牛角尖\"。","a":["识别：材料中XX学生在解决问题时受到了……（定势/功能固着/情绪等）的影响","解释：问题解决受多种因素影响，其中思维定势和功能固着是常见的障碍","引用材料：该生在解决……问题时，因为……导致……","分析：教师应该帮助学生突破思维定势，培养灵活解决问题的能力","建议：①提供变式练习，防止功能固着 ②鼓励多角度思考 ③教授问题解决策略（手段-目的分析、逆向搜索等）"],"m":"定势固着碍解题，原型启发促创新","v":["请分析影响XX学生问题解决的因素。","教师如何帮助学生克服思维定势、提高问题解决能力？"],"p":"从未考过的空白考点(高引力)；Q31学习心理题位信号","s":{"m":"数学课上，李老师出了一道题：\"如何用6根火柴拼出4个等边三角形？\"学生们都在平面上尝试却拼不出来。李老师提示\"想想三维空间\"后，很多学生恍然大悟。李老师借机说：\"我们解题时容易被习惯思维限制住。\"","q":["请用问题解决理论分析学生为什么\"拼不出来\"。（10分）","结合材料，谈谈如何在教学中培养学生的创造性问题解决能力。（8分）"]}},"认知过程-创造性思维":{"d":"创造性思维是以新颖独特的方式解决问题的思维过程。核心特征包括流畅性（数量多）、变通性（种类多）和独特性（与众不同）。发散思维是创造性思维的核心。","r":"材料中出现学生提出与众不同想法、教师培养创新能力、或传统教学压抑学生创造力等情境。关键词有\"创新\"\"发散\"\"独特\"\"想象力\"。","a":["识别：材料中XX学生的行为展现了创造性思维的特征（流畅性/变通性/独特性）","解释：创造性思维以发散思维为核心，具有流畅性、变通性和独特性三个特征","引用材料：该生能够……，体现了创造性思维的……特征","分析：培养学生的创造性思维需要宽松的心理环境和适当的引导","建议：①创设民主宽松的课堂氛围 ②鼓励学生大胆质疑和想象 ③开展头脑风暴等活动训练发散思维 ④延迟评判，给学生思考空间"],"m":"流畅变通加独特，发散思维为核心","v":["请分析材料中XX学生的创造性思维表现。","如何在教学中培养中学生的创造性思维？"],"p":"从未考过的空白考点(高引力)；Q31学习心理题位信号；新课标强调创新素养","s":{"m":"语文课上，老师问：\"雪化了是什么？\"大部分学生回答\"水\"。小雅说：\"雪化了是春天。\"同学们哄堂大笑。老师说：\"小雅的回答很有诗意，大家想想为什么雪化了就是春天？\"随后老师组织大家讨论这个问题，课堂气氛活跃起来。","q":["请用创造性思维理论分析小雅的回答和老师的处理方式。（10分）","结合材料，谈谈教师应如何保护和培养学生的创造性思维。（8分）"]}},"建构主义-学习观":{"d":"建构主义认为学习是学习者主动建构知识的过程（主动建构性），学习需要在一定的社会文化情境中进行（社会互动性），知识存在于具体情境之中（情境性）。学生不是空着脑袋进教室的。","r":"材料中出现教师创设情境、组织合作学习、利用学生已有经验、引导学生主动探究等情境。关键词有\"主动建构\"\"合作\"\"情境\"\"经验\"\"探究\"。","a":["识别：材料中老师的做法体现了建构主义学习理论（主动建构/社会互动/情境性）","解释：建构主义强调知识不是被动接受的，而是学习者基于已有经验主动建构的","引用材料：老师通过创设……情境/组织……合作活动，促进学生主动建构知识","分析：这种教学方式尊重了学生的主体性，比单纯灌输更有效","建议：①创设真实或仿真的学习情境 ②组织合作学习促进社会互动 ③了解并利用学生已有经验 ④设计探究性学习活动"],"m":"建构主义三要点，主动情境加互动","v":["请用建构主义学习理论分析材料中教师的教学行为。","建构主义学习理论对中学教学有哪些启示？"],"p":"从未考过的空白考点(高引力)；Q31学习心理题位信号；热点关联（新课改理念）","s":{"m":"物理课上，王老师没有直接讲\"浮力\"的概念，而是给每组学生一盆水、一块橡皮泥和一些硬币，问：\"为什么有的物体能浮在水上，有的会沉下去？\"学生通过实验观察和讨论，自己总结出了浮力的规律。","q":["请用建构主义学习理论分析王老师的教学方法。（10分）","结合材料，谈谈建构主义对中学课堂教学改革的启示。（8分）"]}},"认知过程-记忆与遗忘":{"d":"艾宾浩斯遗忘曲线表明遗忘先快后慢、先多后少。前摄抑制（先学材料干扰后学）和倒摄抑制（后学材料干扰先学）是两种主要干扰。有效复习策略包括及时复习、分散复习、过度学习（150%）。","r":"材料中出现学生记不住知识点、考前突击记忆效果差、相似知识混淆等情境。关键词有\"遗忘\"\"记不住\"\"混淆\"\"复习\"\"反复\"。","a":["识别：材料中XX学生的学习问题与遗忘规律/记忆策略有关","解释：根据艾宾浩斯遗忘规律，遗忘先快后慢，需要及时复习和分散复习","引用材料：该生……（如\"考前突击\"），违背了……（如\"分散复习优于集中复习\"的原则）","分析：有效的记忆需要科学的复习策略和对遗忘规律的把握","建议：①指导学生在学习后24小时内及时复习 ②采用分散复习代替集中复习 ③适度过度学习（150%） ④多种感官参与记忆"],"m":"遗忘先快后慢规律，及时分散加过度","v":["请用遗忘规律分析材料中XX学生的记忆问题。","如何指导中学生运用记忆规律提高学习效率？"],"p":"从未考过的空白考点(高引力)；Q31学习心理题位信号","s":{"m":"小陈平时不复习，每次都在考试前一天晚上\"拼命背\"。虽然当时记住了，但考试时经常\"明明背过就是想不起来\"。而同桌小李每天课后花15分钟回顾当天的内容，周末再花1小时总结一周的知识，考试时能轻松回忆。","q":["请用遗忘规律和记忆策略分析小陈和小李的学习效果差异。（10分）","作为教师，应如何指导学生科学地复习和记忆？（8分）"]}},"教学原则-直观性原则":{"d":"教师利用学生的多种感官和已有经验，通过各种形式的感知，丰富学生的直接经验和感性认识，使学生获得生动的表象，从而比较全面、深刻地掌握知识。包括实物直观、模像直观和言语直观。","r":"材料中出现教师使用实物、模型、图片、多媒体、实验演示等教学手段的情境。","a":["识别：材料中老师使用了XX直观手段辅助教学，体现了直观性原则","解释：直观性原则通过丰富学生的感性认识来促进理性知识的理解","核心模板：①教师展示了…… ②学生在观察/感受中理解了…… ③这一做法符合从感性到理性的认识规律"],"m":"实物模像和言语，直观助教三形式","v":[],"p":"","s":null},"教学原则-启发性原则":{"d":"教师在教学工作中依据学习过程的客观规律，运用各种手段充分调动学生学习的主动性、积极性，引导他们生动活泼地学习，经过自己的独立思考融会贯通地掌握知识，提高分析和解决问题的能力。","r":"材料中出现教师提问引导、鼓励学生独立思考、设疑激趣等情境。","a":["识别：老师通过XX方式引导学生主动思考，体现了启发性原则","解释：启发性原则强调教师的主导作用与学生的主体性相结合","核心模板：①教师提出问题/设置情境→激发学生思考 ②引导学生自己发现答案 ③在启发中培养学生思维能力"],"m":"不愤不启不悱不发，激发思维启发法","v":[],"p":"","s":null},"教学原则-循序渐进原则":{"d":"教学要按照学科的逻辑系统和学生认识发展的顺序进行，使学生系统地掌握基础知识、基本技能，形成严密的逻辑思维能力。又称\"系统性原则\"。","r":"材料中出现教师按照从易到难、从简到繁的顺序组织教学，或违背此原则（跳跃过大）导致学生理解困难的情境。","a":["识别：老师按照……的逻辑顺序组织教学内容，体现了循序渐进原则","解释：循序渐进原则要求教学按学科逻辑和学生认识顺序系统进行","核心模板：①知识体系本身有内在的逻辑顺序 ②学生的认知发展也有阶段性 ③教师按照从易到难→学生逐步掌握"],"m":"由浅入深按序走，循序渐进奠基础","v":[],"p":"","s":null},"教学原则-巩固性原则":{"d":"教学要引导学生在理解的基础上牢固地掌握知识和技能，长久地保持在记忆中，能根据需要迅速再现，以利于知识技能的运用。","r":"材料中出现教师组织复习、练习、运用等环节帮助学生巩固知识的情境。","a":["识别：老师通过XX方式帮助学生巩固所学内容，体现了巩固性原则","解释：巩固性原则要求在理解的基础上通过复习和运用来强化知识保持","核心模板：①在学习新知识后组织及时复习 ②通过变式练习加深理解 ③在运用中巩固知识和技能"],"m":"理解之后再巩固，练习运用牢记忆","v":[],"p":"","s":null},"教学原则-量力性原则":{"d":"教学的内容、方法、分量和进度要适合学生的身心发展水平，是他们能够接受的，但又要有一定的难度，需要他们经过努力才能掌握。又称\"可接受性原则\"。","r":"材料中出现教学内容过难/过易导致问题、或教师根据学生水平调整教学的情境。","a":["识别：老师根据学生的实际水平调整了教学内容/难度，体现了量力性原则","解释：量力性原则要求教学难度适中，既不能过难也不能过易——\"跳一跳摘桃子\""],"m":"因材定难度适中，量力而行可接受","v":[],"p":"","s":null},"教学原则-思想性与科学性统一":{"d":"教学要以马克思主义为指导，授予学生科学知识，并结合知识教学对学生进行思想品德教育。知识教学是思想教育的基础，思想教育是知识教学的方向和动力。","r":"材料中出现教师在传授知识的同时渗透价值观教育、思想品德教育的情境。关键词有\"价值观\"\"思想教育\"\"科学精神\"。","a":["识别：老师在教授……知识的同时进行了……思想教育，体现了思想性与科学性统一原则","解释：科学性是思想性的基础，思想性是科学性的灵魂，二者有机统一","核心模板：①教师准确传授了科学知识（科学性） ②同时挖掘了知识中的教育因素（思想性） ③二者自然融合，不牵强附会"],"m":"知识传授含思想，科学思想寓一体","v":[],"p":"","s":null},"教学原则-理论联系实际":{"d":"教学要以学习基础知识为主导，从理论与实际的联系上去理解知识，注重运用知识去分析问题和解决问题，达到学懂会用、学以致用。","r":"材料中出现教师联系生活实际、举实际例子、组织实践活动等情境。","a":["识别：老师将……理论知识与……实际生活/实践相联系，体现了理论联系实际原则","解释：理论联系实际原则强调学以致用，让学生在真实情境中理解和运用知识"],"m":"理论实践相结合，学以致用不脱节","v":[],"p":"","s":null},"教学方法-讨论法":{"d":"学生在教师指导下为解决某个问题而进行探讨、辨明是非真伪以获取知识的方法。能培养学生的批判性思维、语言表达能力和合作精神。","r":"材料中出现教师组织小组讨论、全班辩论、学生交流观点等情境。","a":["识别：老师组织了……讨论活动，运用了讨论法","解释：讨论法通过学生之间的交流辩论来深化理解和培养思维能力"],"m":"小组讨论辩是非，各抒己见促思维","v":[],"p":"","s":null},"教学方法-演示法":{"d":"教师通过展示实物、直观教具或进行示范性实验，使学生通过观察获得感性认识的教学方法。常与讲授法、讨论法配合使用。","r":"材料中出现教师做实验演示、展示教具模型、示范操作等情境。","a":["识别：教师展示了/演示了……，运用了演示法","解释：演示法通过直观展示帮助学生获得感性认识，为理解抽象概念打基础"],"m":"直观演示获感知，实验示范印象深","v":[],"p":"","s":null},"教学方法-实验法":{"d":"学生在教师指导下，使用一定的设备和材料，通过控制条件的操作过程，引起实验对象的某些变化，从观察现象中获取新知识或验证知识的教学方法。","r":"材料中出现学生动手做实验、教师指导学生实验操作等情境。","a":["识别：学生通过亲自动手实验来学习/验证……，运用了实验法","解释：实验法让学生在动手操作中观察现象、探究规律，培养科学探究能力"],"m":"动手实验探规律，控制变量观察变","v":[],"p":"","s":null},"皮亚杰-认知发展阶段":{"d":"皮亚杰将儿童认知发展分为四个阶段：感知运动（0-2岁）、前运算（2-7岁）、具体运算（7-11岁）、形式运算（11岁以后）。中学生处于形式运算阶段，能进行抽象逻辑思维和假设演绎推理。","r":"材料中出现中学生的思维特点（抽象思维、逻辑推理、假设演绎）或认知发展水平的讨论。","a":["识别：材料中学生的思维表现反映了形式运算阶段的特征/认知发展规律","解释：中学生处于形式运算阶段，能够进行抽象思维但发展程度不同","核心模板：①该生能够/不能……（形式运算能力表现） ②根据皮亚杰理论，这说明其认知发展处于…… ③教师应基于学生认知水平设计教学"],"m":"感知前运具运形，四阶段发展认知","v":[],"p":"","s":null},"维果斯基-最近发展区":{"d":"维果斯基提出，学生有两种发展水平：独立解决问题的实际水平和在成人指导下解决问题的潜在水平，二者之间的差距就是最近发展区。教学应走在发展的前面。","r":"材料中出现教师提供适当帮助（支架）让学生完成有挑战性任务、或教学内容超出/低于学生能力水平的情境。","a":["识别：老师通过……方式（提供支架/降低难度）帮助学生完成了……","解释：最近发展区理论说明教学的最佳难度是在学生\"跳一跳能摘到桃子\"的区间","核心模板：①学生当前能…… + ②在教师帮助下能…… = ③最近发展区就是…… ④教学应在这个区间内"],"m":"跳一跳摘桃子，走在发展前面","v":[],"p":"","s":null},"埃里克森-人格发展阶段":{"d":"埃里克森将人格发展分为八个阶段，每个阶段都有一个核心的心理社会危机。中学生处于\"同一性vs角色混乱\"阶段（12-18岁），核心任务是建立自我同一性。","r":"材料中出现中学生对自我身份的困惑、对未来方向的迷茫、或成功建立自我认同的情境。","a":["识别：材料中XX学生的表现反映了\"同一性vs角色混乱\"阶段的特征","解释：中学生面临建立自我同一性的核心任务，需要探索\"我是谁\"\"我将成为什么样的人\"","核心模板：①该生的行为表明其正处于…… ②这体现了埃里克森所说的……危机 ③教师应通过……帮助其建立积极的自我同一性"],"m":"同一性对角色乱，自我探索正当时","v":[],"p":"","s":null},"科尔伯格-道德发展阶段":{"d":"科尔伯格用道德两难故事研究道德发展，提出三水平六阶段：前习俗（惩罚服从/相对功利）、习俗（好孩子/维护权威）、后习俗（社会契约/普遍伦理）。中学生多处于习俗水平。","r":"材料中出现学生面对道德困境时的判断理由、对不同行为对错的看法等情境。","a":["识别：材料中XX学生对道德问题的判断反映了科尔伯格道德发展理论中的……阶段","解释：不同年龄/认知水平的学生对道德问题的判断处于不同发展阶段","核心模板：①该生认为……（判断依据） ②这说明其处于……水平……阶段 ③教师应通过道德讨论促进其向更高阶段发展"],"m":"三水平六阶段，两难故事测道德","v":[],"p":"","s":null},"情绪情感-中学生情绪特点":{"d":"中学生情绪具有明显的两极性：强烈与温和、外露与掩饰、冲动与理智并存。情绪体验丰富但控制能力不足，易受外界影响。","r":"材料中出现中学生情绪波动大、情绪外露/掩饰、冲动行为等情境。关键词有\"情绪化\"\"暴躁\"\"敏感\"\"忽冷忽热\"。","a":["识别：材料中XX学生的情绪表现反映了中学生情绪发展的典型特征","解释：中学生情绪具有两极性、冲动性和掩饰性等特征，这是正常的发展现象","核心模板：①该生的……情绪表现体现了中学生情绪的……特征 ②这是身心发展不平衡导致的 ③教师应理解和疏导而非简单批评"],"m":"两极冲动加掩饰，情绪教育不可少","v":[],"p":"","s":null},"身心发展-影响人发展因素":{"d":"影响人发展的主要因素包括遗传（物质前提）、环境（外部条件）、教育（主导作用）和个体主观能动性（决定因素）。四者相互联系、共同作用。","r":"材料中出现关于学生发展差异的原因分析、先天vs后天影响的讨论等情境。","a":["识别：材料体现了……因素对XX学生发展的影响","解释：遗传提供可能，环境提供条件，教育起主导作用，主观能动性是决定因素","核心模板：①该生的……受……因素影响 ②但……是决定因素 ③教育应发挥主导作用，激发主观能动性"],"m":"遗传环境教能动，四因共促人发展","v":[],"p":"","s":null},"心理问题-考试焦虑":{"d":"考试焦虑是在考试情境下产生的一种以担忧为基本特征、以防御或逃避为行为方式的心理状态。表现为认知（注意力不集中、记忆力下降）、生理（心跳加速、出汗）和行为三方面的症状。","r":"材料中出现学生考前/考中过度紧张、发挥失常、\"大脑一片空白\"等情境。","a":["识别：材料中XX学生出现了考试焦虑的典型表现（认知/生理/行为层面）","解释：考试焦虑是由考试压力引起的综合心理反应，适度焦虑有利、过度焦虑有害","核心模板：①该生表现出……（具体症状） ②属于考试焦虑的……层面 ③建议采用……方法缓解"],"m":"适度焦虑助发挥，过度焦虑需调节","v":[],"p":"","s":null},"心理问题-学习倦怠":{"d":"学习倦怠是学生由于长期的学业压力而产生的情感耗竭、去个性化（对学习冷漠）和低个人成就感的状态。表现为\"学不动了\"\"没意思\"\"我学不好\"。","r":"材料中出现学生对学习失去兴趣、长期疲劳、对学习冷漠/无所谓等情境。","a":["识别：材料中XX学生出现了学习倦怠的典型表现","解释：学习倦怠是长期学业压力导致的综合心理耗竭状态","核心模板：①该生表现出情绪耗竭/去个性化/低成就感 ②原因可能是…… ③需要从……方面进行干预"],"m":"长期压力致耗竭，倦怠干预要及时","v":[],"p":"","s":null},"辅导方法-系统脱敏法":{"d":"系统脱敏法是通过逐步暴露于焦虑刺激并同时进行放松训练，以消除焦虑反应的行为治疗方法。包括建立焦虑等级和逐步脱敏两个步骤。","r":"材料中出现对有考试焦虑/社交恐惧的学生进行逐步暴露训练的情境。","a":["识别：老师通过逐步……的方式帮助学生克服……，运用了系统脱敏法","解释：系统脱敏是通过渐进暴露+放松来消除条件性焦虑的治疗方法"],"m":"逐级暴露加放松，焦虑脱敏步步进","v":[],"p":"","s":null},"辅导方法-合理情绪疗法":{"d":"艾利斯提出的ABC理论：A（诱发事件）→B（不合理信念）→C（情绪行为后果）。心理问题的根源不是事件本身，而是对事件的不合理信念。包括绝对化要求、过分概括化和糟糕至极三种不合理信念。","r":"材料中出现学生因不合理想法导致情绪/行为问题、教师引导学生改变认知的情境。","a":["识别：材料中XX学生的情绪问题源于其不合理信念（绝对化/过分概括/糟糕至极）","解释：ABC理论认为情绪困扰的根源是不合理信念而非事件本身","核心模板：①A-诱发事件是…… ②B-该生的不合理信念是…… ③C-导致了……情绪/行为 ④应通过辩驳帮助其建立合理信念"],"m":"ABC辩驳不合理，情绪源自内心念","v":[],"p":"","s":null},"辅导方法-强化法":{"d":"基于操作条件反射原理，通过正强化（给予愉快刺激）增加良好行为，通过负强化（撤销厌恶刺激）或惩罚减少不良行为。在心理辅导中常用于改变学生的问题行为。","r":"材料中出现教师用奖励/代币/表扬来增加学生良好行为、或用惩罚减少不良行为的情境。","a":["识别：老师通过……方式改变了学生的行为，运用了强化法","解释：强化法基于行为主义原理，通过强化来建立或消除特定行为"],"m":"正向强化增良行，行为改变靠后果","v":[],"p":"","s":null},"教育与人的发展-影响因素":{"d":"影响人发展的主要因素有遗传、环境、教育和个体主观能动性。其中遗传是物质前提，环境是外部条件，教育起主导作用，个体主观能动性是决定因素。","r":"材料中出现关于学生发展差异的讨论，或教育对学生发展的作用等情境。","a":["识别：材料体现了……因素对学生发展的影响","解释：遗传提供物质前提，环境提供外部条件，教育起主导作用，主观能动性是决定因素","核心模板：①该生的发展受……因素影响 ②教育在其中发挥了……作用 ③最终取决于学生自身的……"],"m":"遗传环境教能动，四因素促发展","v":[],"p":"","s":null},"素质教育-基本内涵":{"d":"素质教育是面向全体学生、促进学生全面发展（德智体美劳）、促进学生个性发展和以培养创新精神和实践能力为重点的教育。核心是\"两全一重点\"：全体、全面、创新。","r":"材料中出现学校/教师的做法体现了或违背了素质教育理念的情境。关键词有\"应试\"\"全体\"\"全面发展\"\"创新能力\"。","a":["识别：材料中学校/老师的做法（符合/违背了）素质教育的基本理念","解释：素质教育强调面向全体学生、全面发展和创新能力培养","核心模板：①该校/该师的做法…… ②这要求教育应…… ③具体建议……"],"m":"全体全面加创新，素质教育三核心","v":[],"p":"","s":null},"班级管理-课堂管理":{"d":"课堂管理是教师通过协调课堂内各种人际关系，有效实现预定教学目标的过程。包括课堂纪律管理、课堂气氛营造和课堂问题行为处理。","r":"材料中出现课堂纪律问题、学生捣乱行为、教师管理策略等情境。","a":["识别：材料中老师面对课堂问题行为采取了……的管理策略","解释：有效的课堂管理需要预防为主、干预为辅、尊重学生","核心模板：①课堂问题行为的原因是…… ②教师的处理方式…… ③更有效的方法是……"],"m":"预防干预双管下，课堂管理靠智慧","v":[],"p":"","s":null},"班级管理-班集体建设":{"d":"班集体的发展阶段包括组建阶段（依赖班主任）、核心形成阶段（班干部团队出现）、发展阶段（舆论形成）和成熟阶段（良好班风）。班集体是教育的有力手段。","r":"材料中出现班级建设过程、班主任培养班干部、班级舆论形成等情境。","a":["识别：材料中的班级处于班集体发展的……阶段","解释：班集体经历了组建→核心形成→发展→成熟四个阶段","核心模板：①该班当前处于……阶段（特征分析） ②班主任应…… ③通过……促进班级发展"],"m":"四阶段循序渐进，班集体力量大","v":[],"p":"","s":null},"教师心理-教师期望效应":{"d":"罗森塔尔效应（皮格马利翁效应）：教师对学生的期望会无意识地通过态度、表情、提问等方式传递给学生，从而影响学生的学习表现。积极的教师期望能产生自我实现的预言。","r":"材料中出现教师对某些学生有不同期望、学生的表现受教师态度影响等情境。","a":["识别：材料体现了教师期望对学生的影响（罗森塔尔效应/皮格马利翁效应）","解释：教师的积极期望通过微妙的互动方式传递给学生，激发其学习潜能","核心模板：①教师对XX学生持有……期望 ②通过……方式传递给学生 ③学生因此…… ④启示：对所有学生抱有积极期望"],"m":"罗森塔尔期望高，学生自信成绩好","v":[],"p":"","s":null},"教学原则-启发性":{"d":"教师运用各种手段充分调动学生学习的主动性、积极性，引导学生独立思考、融会贯通地掌握知识。","r":"","a":["教师运用各种手段充分调动学生学习的主动性、积极性，引导学生独立思考、融会贯通地掌握知识。"],"m":"不愤不启不悱不发，激发思维启发法","v":[],"p":"","s":null},"教学方法-讲授法":{"d":"教师通过口头语言系统连贯地向学生传授知识的方法。是最基本的教学方法，包括讲述、讲解、讲读、讲演。","r":"","a":["教师通过口头语言系统连贯地向学生传授知识的方法。是最基本的教学方法，包括讲述、讲解、讲读、讲演。"],"m":"系统讲授最基本，四讲形式各有长","v":[],"p":"","s":null},"教学方法-练习法":{"d":"学生在教师指导下运用知识去反复完成一定操作以形成技能技巧的方法。包括口头练习、书面练习和操作练习。","r":"","a":["学生在教师指导下运用知识去反复完成一定操作以形成技能技巧的方法。包括口头练习、书面练习和操作练习。"],"m":"熟能生巧靠练习，口头书面操作全","v":[],"p":"","s":null},"教学方法-读书指导法":{"d":"教师指导学生通过阅读教科书和参考书获取知识、发展智力的方法。","r":"","a":["教师指导学生通过阅读教科书和参考书获取知识、发展智力的方法。"],"m":"读书有法靠指导，独立阅读能力长","v":[],"p":"","s":null},"教学方法-情境教学法":{"d":"教师有目的地引入或创设具有一定情绪色彩的生动具体场景，引起学生情感体验从而帮助理解知识的教学方法。","r":"","a":["教师有目的地引入或创设具有一定情绪色彩的生动具体场景，引起学生情感体验从而帮助理解知识的教学方法。"],"m":"情感情境烘托学，以情促知效果好","v":[],"p":"","s":null},"教学过程-基本阶段":{"d":"教学过程的基本阶段包括：激发动机→感知教材→理解教材→巩固知识→运用知识→检查评定。","r":"","a":["教学过程的基本阶段包括：激发动机→感知教材→理解教材→巩固知识→运用知识→检查评定。"],"m":"激感理巩用检，教学六阶循序走","v":[],"p":"","s":null},"教学原则-因材施教":{"d":"教师从学生实际出发，使教学深度、广度、进度适合学生知识水平和接受能力，同时考虑个性差异，使每个学生得到最佳发展。","r":"","a":["教师从学生实际出发，使教学深度、广度、进度适合学生知识水平和接受能力，同时考虑个性差异，使每个学生得到最佳发展。"],"m":"一把钥匙一把锁，因材施教各发展","v":[],"p":"","s":null},"学习动机-耶克斯多德森定律":{"d":"动机强度与工作效率之间呈倒U形曲线关系。中等强度的动机最有利于任务完成。任务难度不同，最佳动机水平不同：简单任务偏高动机好，复杂任务偏低动机好。","r":"","a":["动机强度与工作效率之间呈倒U形曲线关系。中等强度的动机最有利于任务完成。任务难度不同，最佳动机水平不同：简单任务偏高动机好，复杂任务偏低动机好。"],"m":"倒U曲线中等佳，难低易高耶克森","v":[],"p":"","s":null},"学习动机-归因理论":{"d":"韦纳的成败归因理论将归因分为三个维度：内部/外部、稳定/不稳定、可控/不可控。将失败归因于努力（内部+不稳定+可控）最有利于后续学习。","r":"","a":["韦纳的成败归因理论将归因分为三个维度：内部/外部、稳定/不稳定、可控/不可控。将失败归因于努力（内部+不稳定+可控）最有利于后续学习。"],"m":"三维归因韦纳论，失败归努最有利","v":[],"p":"","s":null},"学习动机-自我效能感":{"d":"班杜拉提出，自我效能感是个体对自己能否成功完成某一行为的主观判断。影响因素包括直接经验、替代经验、言语说服和情绪唤起。","r":"","a":["班杜拉提出，自我效能感是个体对自己能否成功完成某一行为的主观判断。影响因素包括直接经验、替代经验、言语说服和情绪唤起。"],"m":"我能我行效能感，直接替代言情绪","v":[],"p":"","s":null},"学习动机-期待理论":{"d":"教师期望通过微妙方式传递给学生，影响学生的自我概念和学习表现。积极的教师期望产生罗森塔尔效应。","r":"","a":["教师期望通过微妙方式传递给学生，影响学生的自我概念和学习表现。积极的教师期望产生罗森塔尔效应。"],"m":"教师期望潜移默化，学生自信成绩佳","v":[],"p":"","s":null},"学习迁移-共同要素说":{"d":"桑代克提出，只有当两种学习情境存在共同要素时，迁移才会发生。共同要素越多，迁移量越大。","r":"","a":["桑代克提出，只有当两种学习情境存在共同要素时，迁移才会发生。共同要素越多，迁移量越大。"],"m":"共同要素桑代克，相同成分迁移易","v":[],"p":"","s":null},"学习迁移-经验类化说":{"d":"贾德\"水下击靶\"实验证明：对原理的概括化理解是迁移发生的关键。掌握了概括化的原理，就能迁移到新情境。","r":"","a":["贾德\"水下击靶\"实验证明：对原理的概括化理解是迁移发生的关键。掌握了概括化的原理，就能迁移到新情境。"],"m":"概括原理促迁移，水下击靶贾德验","v":[],"p":"","s":null},"学习策略-资源管理策略":{"d":"学生管理可用环境和资源以提高学习效率的策略，包括时间管理、努力管理、环境管理和他人支持。","r":"","a":["学生管理可用环境和资源以提高学习效率的策略，包括时间管理、努力管理、环境管理和他人支持。"],"m":"时间努力环境人，资源管理四方面","v":[],"p":"","s":null},"学习策略-复习方法":{"d":"有效的复习策略包括及时复习、分散复习、过度学习（150%）、尝试回忆与反复阅读结合、多样化复习。","r":"","a":["有效的复习策略包括及时复习、分散复习、过度学习（150%）、尝试回忆与反复阅读结合、多样化复习。"],"m":"及时分散过度学，回忆阅读多样化","v":[],"p":"","s":null},"行为主义-操作条件反射":{"d":"斯金纳的操作条件反射理论：行为由后果决定。正强化/负强化增加行为，惩罚/消退减少行为。强化程序影响行为保持。","r":"","a":["斯金纳的操作条件反射理论：行为由后果决定。正强化/负强化增加行为，惩罚/消退减少行为。强化程序影响行为保持。"],"m":"斯金纳箱操作论，强化惩罚塑行为","v":[],"p":"","s":null},"认知主义-奥苏贝尔有意义学习":{"d":"奥苏贝尔提出有意义学习：新知识与认知结构 // ===== STUDY TAB — 备考学习Tab（v1.2新增）=====
// 纯浏览器端JS，不使用template literals、不使用raw newline in strings、不使用for...of

// Module display helpers (dup from main but safe to redeclare in local scope)
var STUDY_MOD_COLORS = {M1:'#f87171',M2:'#fb923c',M3:'#fbbf24',M4:'#4ade80',M5:'#38bdf8',M6:'#a78bfa',M7:'#f472b6',M8:'#94a3b8'};
var STUDY_MOD_NAMES = {M1:'教育基础',M2:'中学课程',M3:'中学教学',M4:'学习心理',M5:'发展心理',M6:'心理辅导',M7:'中学德育',M8:'班级管理'};

// Get prediction score for a sub-topic
function getPredScore(key) {
  var s = 0;
  var q30preds = PRED.predictions.q30.topSubTopicPredictions || [];
  var q31preds = PRED.predictions.q31.topSubTopicPredictions || [];
  for (var i = 0; i < q30preds.length; i++) {
    if (q30preds[i].subTopic === key && q30preds[i].score > s) s = q30preds[i].score;
  }
  for (var j = 0; j < q31preds.length; j++) {
    if (q31preds[j].subTopic === key && q31preds[j].score > s) s = q31preds[j].score;
  }
  return s;
}

// Get likelihood for a sub-topic
function getLikelihood(key) {
  var q30preds = PRED.predictions.q30.topSubTopicPredictions || [];
  var q31preds = PRED.predictions.q31.topSubTopicPredictions || [];
  for (var i = 0; i < q30preds.length; i++) {
    if (q30preds[i].subTopic === key) return q30preds[i].likelihood || '';
  }
  for (var j = 0; j < q31preds.length; j++) {
    if (q31preds[j].subTopic === key) return q31preds[j].likelihood || '';
  }
  return '';
}

// Get prediction reasons
function getPredReasons(key) {
  var q30preds = PRED.predictions.q30.topSubTopicPredictions || [];
  var q31preds = PRED.predictions.q31.topSubTopicPredictions || [];
  for (var i = 0; i < q30preds.length; i++) {
    if (q30preds[i].subTopic === key && q30preds[i].reasons) return q30preds[i].reasons.join('；');
  }
  for (var j = 0; j < q31preds.length; j++) {
    if (q31preds[j].subTopic === key && q31preds[j].reasons) return q31preds[j].reasons.join('；');
  }
  return '';
}

// Jump to study tab and scroll to a specific card
function jumpToStudy(key) {
  switchTab('study');
  setTimeout(function() {
    var safeId = key.replace(/[^a-zA-Z0-9一-龥]/g, '_');
    var el = document.getElementById('kb-' + safeId);
    if (el) {
      el.scrollIntoView({behavior: 'smooth', block: 'center'});
      el.style.boxShadow = '0 0 0 3px var(--accent)';
      // Auto-expand the card
      var detailEl = document.getElementById('kb-' + safeId + '-detail');
      if (detailEl) detailEl.style.display = 'block';
      setTimeout(function() { el.style.boxShadow = ''; }, 2500);
    }
  }, 200);
}

// Toggle study card detail
function toggleStudyCard(cardId, key) {
  var el = document.getElementById(cardId + '-detail');
  if (!el) return;
  if (el.style.display === 'none' || el.style.display === '') {
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

// Render a single study card's detail content
function renderStudyCardDetail(key, kb, hasFull) {
  var d = '';
  if (!kb) {
    d += '<p style="color:var(--text2);font-size:0.8rem;">该知识点暂无详细内容，请参考考点地图和预测数据。</p>';
    return d;
  }

  // Definition
  if (kb.d) {
    d += '<div style="margin-bottom:8px;">';
    d += '<span style="color:var(--accent);font-weight:600;">📌 是什么：</span>';
    d += '<span style="font-size:0.84rem;">' + kb.d + '</span>';
    d += '</div>';
  }

  // Material recognition
  if (kb.r) {
    d += '<div style="margin-bottom:8px;">';
    d += '<span style="color:var(--yellow);font-weight:600;">🔍 材料中怎么识别：</span>';
    d += '<span style="font-size:0.84rem;">' + kb.r + '</span>';
    d += '</div>';
  }

  // Answer points
  if (kb.a && kb.a.length > 0) {
    d += '<div style="margin-bottom:8px;">';
    d += '<span style="color:var(--green);font-weight:600;">📝 答题要点：</span>';
    d += '<ol style="margin:4px 0 0 0;padding-left:20px;font-size:0.84rem;">';
    for (var ai = 0; ai < kb.a.length; ai++) {
      d += '<li style="margin-bottom:2px;">' + kb.a[ai] + '</li>';
    }
    d += '</ol></div>';
  }

  // Mnemonic
  if (kb.m) {
    d += '<div style="margin-bottom:8px;padding:8px 12px;background:rgba(251,191,36,0.1);border-radius:6px;">';
    d += '<span style="font-weight:600;">🧠 口诀：</span>';
    d += '<span style="font-size:0.85rem;color:var(--yellow);">' + kb.m + '</span>';
    d += '</div>';
  }

  // Variant questions
  if (kb.v && kb.v.length > 0) {
    d += '<div style="margin-bottom:8px;">';
    d += '<span style="color:var(--accent);font-weight:600;">🔄 考官可能这样问：</span>';
    d += '<ul style="margin:4px 0 0 0;padding-left:20px;font-size:0.84rem;">';
    for (var vi = 0; vi < kb.v.length; vi++) {
      d += '<li>' + kb.v[vi] + '</li>';
    }
    d += '</ul></div>';
  }

  // Prediction reasons
  if (kb.p) {
    d += '<div style="margin-bottom:8px;">';
    d += '<span style="color:var(--red);font-weight:600;">🔮 预测理由：</span>';
    d += '<span style="font-size:0.84rem;">' + kb.p + '</span>';
    d += '</div>';
  }

  // Simulated question (full cards only)
  if (kb.s && hasFull) {
    var sq = kb.s;
    d += '<div style="margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:6px;border:1px dashed var(--border);">';
    d += '<span style="font-weight:600;color:var(--accent);">📋 模拟题</span>';
    d += '<p style="font-size:0.82rem;margin:8px 0;"><strong>📄 材料：</strong>' + sq.m + '</p>';
    if (sq.q && sq.q.length > 0) {
      d += '<p style="font-size:0.82rem;margin:8px 0;"><strong>❓ 问题：</strong></p>';
      d += '<ol style="margin:0 0 6px 0;padding-left:20px;font-size:0.82rem;">';
      for (var qi = 0; qi < sq.q.length; qi++) {
        d += '<li>' + sq.q[qi] + '</li>';
      }
      d += '</ol>';
    }
    d += '</div>';
  }

  return d;
}

// Escape HTML for safe rendering
function escHTML(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Render the study tab
function renderStudyTab() {
  var h = '';

  // ── Header ──
  h += '<div class="card" style="background:linear-gradient(135deg,var(--bg2),var(--bg));border-left:4px solid var(--accent);">';
  h += '<h3>🎯 26下半年材料分析题 — 备考冲刺</h3>';
  h += '<p style="font-size:0.85rem;color:var(--text2);">7模型集成预测 · Q30 Top3回测准确率: <strong>' + (PRED.methodology.backtest.q30.top3Accuracy || '90%') + '</strong> · Q31 Top3回测准确率: <strong>' + (PRED.methodology.backtest.q31.top3Accuracy || '100%') + '</strong></p>';
  h += '<p style="font-size:0.8rem;color:var(--yellow);">📌 点击任意卡片展开完整知识内容 · 绿色=已考过 · 红色=从未考过(高概率考)</p>';
  h += '</div>';

  // ── Build Top 20 list ──
  var topList = [];
  var seen = {};
  var q30preds = PRED.predictions.q30.topSubTopicPredictions || [];
  var q31preds = PRED.predictions.q31.topSubTopicPredictions || [];

  for (var i = 0; i < q30preds.length; i++) {
    var k = q30preds[i].subTopic;
    if (!seen[k]) {
      seen[k] = true;
      topList.push({
        key: k,
        score: q30preds[i].score,
        module: q30preds[i].module,
        moduleName: q30preds[i].moduleName,
        tested: q30preds[i].tested,
        likelihood: q30preds[i].likelihood || '',
        position: 'Q30'
      });
    }
  }
  for (var j = 0; j < q31preds.length; j++) {
    var k2 = q31preds[j].subTopic;
    if (!seen[k2]) {
      seen[k2] = true;
      topList.push({
        key: k2,
        score: q31preds[j].score,
        module: q31preds[j].module,
        moduleName: q31preds[j].moduleName,
        tested: q31preds[j].tested,
        likelihood: q31preds[j].likelihood || '',
        position: 'Q31'
      });
    }
  }
  topList.sort(function(a, b) { return b.score - a.score; });

  // ── Filter buttons ──
  if (!window._studyFilter) window._studyFilter = 'all';

  h += '<div style="margin:12px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">';
  h += '<span style="font-size:0.82rem;color:var(--text2);">筛选：</span>';

  var filters = [
    {v:'all',t:'全部'},
    {v:'untested',t:'只看未考'},
    {v:'tested',t:'只看已考'},
    {v:'high',t:'只看极高可能'}
  ];
  for (var fi = 0; fi < filters.length; fi++) {
    var fv = filters[fi].v;
    var ft = filters[fi].t;
    var active = window._studyFilter === fv;
    h += '<button onclick="window._studyFilter=\'' + fv + '\';renderStudyTab();" ';
    h += 'style="padding:4px 12px;border-radius:14px;border:1px solid var(--border);';
    h += 'background:' + (active ? 'var(--accent)' : 'var(--bg2)') + ';';
    h += 'color:' + (active ? '#fff' : 'var(--text)') + ';';
    h += 'font-size:0.78rem;cursor:pointer;">' + ft + '</button>';
  }
  h += '</div>';

  // ── Top 20 Prediction Cards ──
  h += '<div class="card"><h4>🔮 预测Top排行榜（按分数排序）</h4>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;" id="study-top-cards">';

  var shownCount = 0;
  for (var ti = 0; ti < topList.length && shownCount < 20; ti++) {
    var t = topList[ti];
    var f = window._studyFilter;

    if (f === 'untested' && t.tested) continue;
    if (f === 'tested' && !t.tested) continue;
    if (f === 'high' && t.likelihood !== '极高') continue;

    shownCount++;
    var kb = KNOWLEDGE_BASE[t.key];
    var hasFull = !!(kb && kb.s);
    var safeId = t.key.replace(/[^a-zA-Z0-9一-龥]/g, '_');
    var cardId = 'kb-' + safeId;
    var testedBadge = t.tested ? '已考' : '未考';
    var testedColor = t.tested ? 'var(--green)' : 'var(--red)';
    var modColor = STUDY_MOD_COLORS['M' + t.module] || '#94a3b8';
    var borderStyle = t.likelihood === '极高' ? '2px solid var(--red)' : '1px solid var(--border)';
    var bgStyle = t.likelihood === '极高' ? 'rgba(248,113,113,0.05)' : 'var(--bg2)';

    h += '<div id="' + cardId + '" ';
    h += 'style="padding:12px;border-radius:10px;border:' + borderStyle + ';background:' + bgStyle + ';cursor:pointer;transition:all 0.2s;" ';
    h += 'onclick="toggleStudyCard(\'' + cardId + '\',\'' + t.key.replace(/'/g, "\\'") + '\')">';

    // Card header
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:4px;">';
    h += '<div>';
    h += '<span style="font-weight:700;font-size:0.92rem;">#' + shownCount + ' ' + t.key + '</span>';
    if (t.likelihood === '极高') {
      h += ' <span style="font-size:0.7rem;padding:1px 6px;border-radius:8px;background:var(--red);color:#fff;">极高</span>';
    }
    h += '</div>';
    h += '<span style="font-size:0.7rem;padding:2px 8px;border-radius:10px;background:' + modColor + '22;color:' + modColor + ';white-space:nowrap;">M' + t.module + ' ' + t.moduleName + ' · ' + t.position + '</span>';
    h += '</div>';

    // Card meta
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">';
    h += '<span style="font-size:0.78rem;color:' + testedColor + ';font-weight:600;">● ' + testedBadge + ' | 🔥 ' + t.score + '分</span>';
    h += '<span style="font-size:0.75rem;color:var(--accent);">▼ 展开学习</span>';
    h += '</div>';

    // Reasons preview
    var reasons = getPredReasons(t.key);
    if (reasons) {
      h += '<div style="font-size:0.72rem;color:var(--text2);margin-top:4px;">' + reasons + '</div>';
    }

    // Card detail (hidden)
    h += '<div id="' + cardId + '-detail" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">';
    h += renderStudyCardDetail(t.key, kb, hasFull);
    h += '</div>';

    h += '</div>';
  }
  h += '</div></div>';

  // ── All Sub-topics by Module ──
  h += '<div class="card" style="margin-top:16px;">';
  h += '<h4>📚 全部子知识点（按模块展开）</h4>';
  h += '<p style="font-size:0.8rem;color:var(--text2);">共93个子知识点，点击展开查看内容。已考=绿色 · 未考=红色 · 带🔥=有预测分数</p>';

  var modKeys = Object.keys(DATA.subTopicOntology);
  for (var mi = 0; mi < modKeys.length; mi++) {
    var mk = modKeys[mi];
    var md = DATA.subTopicOntology[mk];
    var stKeys = Object.keys(md.subTopics);
    var testedCount = 0;
    for (var si = 0; si < stKeys.length; si++) {
      if (md.subTopics[stKeys[si]].tested) testedCount++;
    }
    var modColor2 = STUDY_MOD_COLORS[mk] || '#94a3b8';
    var modBoxId = 'study-mod-' + mk;
    var untestedCount = stKeys.length - testedCount;

    h += '<div style="margin-bottom:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden;">';

    // Module header (clickable)
    h += '<div onclick="var el=document.getElementById(\'' + modBoxId + '\');if(el)el.style.display=el.style.display===\'none\'?\'block\':\'none\';" ';
    h += 'style="padding:10px 14px;background:var(--bg2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-left:4px solid ' + modColor2 + ';">';
    h += '<span><strong>' + mk + ' ' + md.name + '</strong>（' + stKeys.length + '个子知识点，' + untestedCount + '个未考）</span>';
    h += '<span style="font-size:0.8rem;color:var(--text2);">▼</span>';
    h += '</div>';

    // Sub-topic list (hidden by default for length)
    h += '<div id="' + modBoxId + '" style="display:none;padding:6px 12px;">';
    for (var si2 = 0; si2 < stKeys.length; si2++) {
      var sk = stKeys[si2];
      var sd = md.subTopics[sk];
      var sc = getPredScore(sk);
      var skTested = sd.tested;
      var skBadge = skTested ? '已考' : '未考';
      var skColor = skTested ? 'var(--green)' : 'var(--red)';
      var skSafeId = 'kb-' + sk.replace(/[^a-zA-Z0-9一-龥]/g, '_');
      var skb = KNOWLEDGE_BASE[sk];
      var skHasFull = !!(skb && skb.s);

      h += '<div id="' + skSafeId + '" ';
      h += 'style="padding:8px 10px;margin:4px 0;border-radius:6px;border:1px solid var(--border);cursor:pointer;font-size:0.82rem;" ';
      h += 'onclick="toggleStudyCard(\'' + skSafeId + '\',\'' + sk.replace(/'/g, "\\'") + '\')">';

      h += '<div style="display:flex;justify-content:space-between;align-items:center;">';
      h += '<span>' + sk + ' <span style="color:' + skColor + ';font-weight:600;">● ' + skBadge + '</span>';
      if (sc > 0) {
        h += ' <span style="font-size:0.72rem;padding:1px 6px;border-radius:8px;background:rgba(251,191,36,0.2);color:var(--yellow);">🔥' + sc + '分</span>';
      }
      h += '</span>';
      h += '<span style="font-size:0.7rem;color:var(--accent);">▼</span>';
      h += '</div>';

      h += '<div id="' + skSafeId + '-detail" style="display:none;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">';
      h += renderStudyCardDetail(sk, skb, skHasFull);
      h += '</div>';

      h += '</div>';
    }
    h += '</div></div>';
  }
  h += '</div>';

  // ── Pre-exam 30min Speed Review ──
  h += '<div class="card" style="margin-top:16px;">';
  h += '<h4>⏰ 考前30分钟速览</h4>';
  h += '<p style="font-size:0.8rem;color:var(--text2);">进考场前快速过一遍——最精简版Top 12，每个一行</p>';
  var srCount = 0;
  for (var sri = 0; sri < topList.length && srCount < 12; sri++) {
    var srt = topList[sri];
    var srkb = KNOWLEDGE_BASE[srt.key];
    if (!srkb) continue;
    srCount++;
    var srTested = srt.tested ? '已考' : '未考';
    var srColor = srt.tested ? 'var(--green)' : 'var(--red)';
    h += '<div style="padding:8px 12px;margin:4px 0;border-radius:6px;background:var(--bg2);font-size:0.8rem;">';
    h += '<strong>' + srCount + '. ' + srt.key + '</strong>';
    h += ' <span style="color:' + srColor + ';font-size:0.7rem;">●' + srTested + '</span>';
    h += ' <span style="font-size:0.72rem;color:var(--yellow);">🔥' + srt.score + '分</span>';
    if (srkb.d) {
      var shortDef = srkb.d.substring(0, 70);
      if (srkb.d.length > 70) shortDef += '…';
      h += ' — ' + shortDef;
    }
    if (srkb.m) {
      h += ' <span style="color:var(--yellow);font-size:0.75rem;">🧠 ' + srkb.m + '</span>';
    }
    h += '</div>';
  }
  h += '</div>';

  document.getElementById('tab-study').innerHTML = h;
}


// ===== THEME TOGGLE =====
(function(){var saved=localStorage.getItem("theme")||"dark";document.documentElement.setAttribute("data-theme",saved);var btn=document.getElementById("theme-toggle");if(btn){btn.textContent=saved==="light"?"🌙 夜间模式":"☀️ 日间模式";}})();
function toggleTheme(){var cur=document.documentElement.getAttribute("data-theme");var next=cur==="light"?"dark":"light";document.documentElement.setAttribute("data-theme",next);localStorage.setItem("theme",next);var btn=document.getElementById("theme-toggle");if(btn){btn.textContent=next==="light"?"🌙 夜间模式":"☀️ 日间模式";}}
// ===== INITIAL RENDER =====
renderDashboard();
</script>

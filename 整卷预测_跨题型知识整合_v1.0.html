<style>
:root{--bg:#0f172a;--bg2:#1a2332;--card:#1e293b;--border:#334155;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--accent:#38bdf8;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--purple:#a78bfa;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100dvh}
.container{max-width:1200px;margin:0 auto;padding:16px}
.header{text-align:center;padding:28px 16px;background:linear-gradient(135deg,var(--card),var(--bg));border-bottom:2px solid var(--accent);margin-bottom:20px}
.header h1{font-size:clamp(1.2rem,3.5vw,1.7rem);color:var(--accent);margin-bottom:4px}
.header p{color:var(--text2);font-size:0.85rem}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:var(--card);border-radius:var(--radius);padding:16px;text-align:center;border:1px solid var(--border)}
.kpi-card .value{font-size:1.6rem;font-weight:700;color:var(--accent)}
.kpi-card .label{font-size:0.75rem;color:var(--text2);margin-top:2px}
.section{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:18px;border:1px solid var(--border)}
.section h2{font-size:1.1rem;margin-bottom:14px;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:8px}
.section h3{font-size:0.95rem;color:var(--text);margin:14px 0 8px}
.tab-nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:20px;position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0}
.tab-btn{padding:9px 14px;border:1px solid var(--border);background:transparent;color:var(--text2);border-radius:20px;cursor:pointer;font-size:0.82rem;transition:all 0.2s;min-height:44px;white-space:nowrap}
.tab-btn.active,.tab-btn:hover{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.kp-card{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--border);border-left:4px solid var(--accent)}
.kp-card.threat-extreme{border-left-color:var(--red)}
.kp-card.threat-high{border-left-color:var(--yellow)}
.kp-card .kp-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.kp-card .kp-title{font-size:0.95rem;font-weight:600;flex:1;min-width:200px}
.kp-card .kp-meta{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.7rem;font-weight:600;white-space:nowrap}
.badge-extreme{background:var(--red);color:#fff}
.badge-high{background:var(--yellow);color:var(--bg)}
.badge-mid{background:var(--green);color:var(--bg)}
.badge-type{background:rgba(56,189,248,0.2);color:var(--accent);border:1px solid rgba(56,189,248,0.3)}
.type-tabs{display:flex;gap:2px;margin-bottom:8px}
.type-tab{padding:7px 12px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:0.78rem;border-radius:6px 6px 0 0;min-height:40px;transition:all 0.15s}
.type-tab.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.type-content{display:none;padding:12px;background:var(--bg);border-radius:0 0 8px 8px}
.type-content.active{display:block}
.answer-text{font-size:0.82rem;color:var(--text2);line-height:1.7;max-height:200px;overflow-y:auto;white-space:pre-line}
.answer-text.expanded{max-height:none}
.expand-btn{font-size:0.75rem;color:var(--accent);cursor:pointer;background:none;border:1px solid var(--border);border-radius:10px;padding:4px 10px;margin-top:4px;min-height:36px}
table{width:100%;border-collapse:collapse;font-size:0.82rem;margin:10px 0}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--bg2);color:var(--accent);font-weight:600}
.module-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.module-card{background:var(--bg2);border-radius:var(--radius);padding:16px;border:1px solid var(--border);cursor:pointer;transition:all 0.2s;min-height:44px}
.module-card:hover{border-color:var(--accent)}
.module-card .mod-name{font-size:0.9rem;font-weight:600;color:var(--accent);margin-bottom:4px}
.module-card .mod-stats{font-size:0.75rem;color:var(--text3)}
.module-card .mod-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.module-card .mod-detail.show{display:block}
.indicator-item{padding:6px 0;border-bottom:1px dashed var(--border);font-size:0.8rem}
.indicator-item .ind-name{color:var(--text)}
.indicator-item .ind-types{display:flex;gap:4px;margin-top:2px}
.type-dot{display:inline-block;padding:2px 8px;border-radius:8px;font-size:0.65rem}
.type-dot.jd{background:rgba(56,189,248,0.2);color:var(--accent)}
.type-dot.bx{background:rgba(167,139,250,0.2);color:var(--purple)}
.type-dot.cl{background:rgba(248,113,113,0.2);color:var(--red)}
.prob-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:4px 0;background:var(--border)}
.prob-bar .pb-jd{background:var(--accent)}
.prob-bar .pb-bx{background:var(--purple)}
.prob-bar .pb-cl{background:var(--red)}
.quick-item{padding:8px 0;border-bottom:1px dashed var(--border);font-size:0.85rem}
.quick-item .q-mod{font-size:0.7rem;color:var(--text3)}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter-btn{padding:6px 14px;border:1px solid var(--border);background:transparent;color:var(--text2);border-radius:16px;cursor:pointer;font-size:0.78rem;min-height:40px}
.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.wp-table th{font-size:0.75rem}
.wp-module{font-weight:600;color:var(--accent)}
footer{text-align:center;color:var(--text3);font-size:0.75rem;padding:20px 0;margin-top:20px;border-top:1px solid var(--border)}
@media(max-width:600px){
  .kp-card .kp-header{flex-direction:column}
  .type-tab{font-size:0.72rem;padding:5px 8px}
}

/* 提示 */
.tooltip{position:relative;cursor:help;border-bottom:1px dotted var(--text2)}
.tooltip:hover::after{content:attr(data-tip);position:absolute;bottom:120%;left:0;background:var(--card);color:var(--text);padding:6px 10px;border-radius:6px;font-size:0.72rem;white-space:nowrap;z-index:20;border:1px solid var(--border)}
</style>
</head>

生产的基本途径。(2)教育是科学知识再生产的最有效形式。(3)教育是进行技术创新的一个重要手段。","keywords":["教育","教育","教育"],"mnemonic":"","points":["教育是劳动力再生产的基本途径。","教育是科学知识再生产的最有效形式。","教育是进行技术创新的一个重要手段。"]},{"type":"简答","exam":"2025上","stem":"教育具有促进个体发展的功能，但并非所有的教育都能促进个体发展，如“划 一性的教育”“陈腐的教育观念”“落后的教育方法”反而会阻碍个体发展。因此，要 发挥教育促进个体发展的功能，必须正确把握教育促进个体发展的基本条件。请简述 教育促进个体发展的条件。","answer":"(1)要确立“育人为本”的教育理念。(2)在活动中要确保学生的主体地位，发挥学生的主体作用。(3)要创新教育理念、机制、方式、方法，寻找适合个体发展需要的个性化、特 色化教育。","keywords":["要确立“育人为本”的教育理念","在活动中要确保学生的主体地位","要创新教育理念、"],"mnemonic":"","points":["要确立“育人为本”的教育理念。","在活动中要确保学生的主体地位，发挥学生的主体作用。","要创新教育理念、机制、方式、方法，寻找适合个体发展需要的个性化、特 色化教育。"]},{"type":"简答","exam":"2026上","stem":"《教育强国建设规划纲要(2024—2035年)》提出，落实健康第一教育理念， 实施学生体质强健计划，中小学生每天综合体育活动时间不低于2小时。这表明了学 校体育工作的重要性。简述中学体育的意义。","answer":"(1)体育中有极丰富的思想品德教育因素。(2)通过体育增强体质，特别是记忆力、思维力等相应增强，可促使学生智力 发展。(3)体育与美育密切联系，健与美历来一致。(4)体育训练可以促进学生劳动技能的提高。","keywords":["体育中有极丰富的","通过体育增强体质","体育与美育密切联系","体育训练可以促进"],"mnemonic":"","points":["体育中有极丰富的思想品德教育因素。","通过体育增强体质，特别是记忆力、思维力等相应增强，可促使学生智力 发展。","体育与美育密切联系，健与美历来一致。","体育训练可以促进学生劳动技能的提高。"]},{"type":"辨析","exam":"2019下","stem":"遗传在人的发展中起决定作用。","answer":"表述错误。 影响人身心发展的因素包括遗传、环境、学校教育与个体的主观能动性。遗传素 质是人的发展的生理前提，为人的发展提供了可能性。环境为个体的发展提供了多种 可能，使遗传提供的发展可能性变成现实。学校教育在人的发展中起主导作用。个体 的主观能动性是指人的主观意识对客观世界的反映和能动作用，是推动人身心发展的 内在动力，是促进个体发展的决定性因素。因此，题干中说遗传在人的发展中起决定 作用是错误的，应该是主观能动性起决定作用。 故表述错误。","keywords":["遗传","主观能动性","身心发展因素","遗传","主观能动性","身心发展因素"],"trapType":"绝对化表述型","judgment":"错误"},{"type":"辨析","exam":"2020下","stem":"母猴带着小猴爬树也是教育。","answer":"表述错误。 教育的本质属性是一种有目的地培养人的社会活动，这是教育区别于其他社会活 动的根本特征。也就是说，教育是针对人的，动物界不存在教育。题干中，母猴带着 小猴爬树不符合教育本质属性中“培养人”这一特征。因此，母猴带小猴爬树不属于 教育。 故表述错误。","keywords":["教育本质","动物界教育","教育本质","动物界教育"],"trapType":"概念混淆型","judgment":"错误"},{"type":"辨析","exam":"2021下","stem":"美育就是艺术教育。","answer":"表述错误。 美育和艺术教育有明显的区分。美育不仅要通过艺术教育进行，而且要通过其他 114 各科教学和课外文艺活动，通过观赏大自然的美妙来实现，尤其要通过日常生活开展 审美。美育并不像音乐、美术的教学与课外活动那样，注重系统的专门知识的学习和 技能技巧的训练，而是要超越艺术的技能与技巧的训练范畴，以全面提高学生的审美 素质为旨趣。因此，艺术教育是学校美育的重要途径，以艺术教育代美育夸大了艺术 教育的作用，窄化了美育的功能。 故表述错误。","keywords":["美育","艺术教育","美育","艺术教育"],"trapType":"概念混淆型","judgment":"错误"},{"type":"辨析","exam":"2022上","stem":"教育必然促进社会的发展。","answer":"表述错误。 教育受社会政治、经济、文化等因素的影响，同时也反作用于社会，对社会发展 产生各种影响，但这种影响有积极和消极之分。教育能促进社会的发展，如成为再生 产劳动力、科学知识的途径，成为进行技术创新的重要手段。同时，教育也可能对社 会发展起阻碍作用，如教育的滞后性使教育不能及时更新文化知识，适应社会环境快 速变迁，部分教育仍然传承了保守的传统文化，阻碍社会的发展等。因此，教育并不 必然促进社会的发展。 101 故表述错误。","keywords":["教育功能","社会发展","教育功能","社会发展"],"trapType":"绝对化表述型","judgment":"错误"},{"type":"辨析","exam":"2022下","stem":"全面发展就是学生德、智、体、美、劳五方面平均发展。 23,教学是学校教育的唯一途径。 24.气质无好坏之分。 25.所有行为变化均是学习的结果。","answer":"表述错误。 新课改背景下的全面发展是学生在德、智、体、美、劳等方面相互渗透和相互协 调的发展。首先，各育在学生的全面发展过程中均有其不可替代的重要性。德育起灵 魂、统率、保持动力和保证方向的作用；智育是全面发展的前提和支持；体育是实现 全面发展的物质基础；美育起动力作用；劳动技术教育是前四育的综合体现。其次， 每个学生都有个别差异性，均有其优势和劣势的部分，无法实现各育的平均发展。因 此，无法用平均发展来衡量全面发展。 88 故表述错误。","keywords":["全面发展","平均发展","全面发展","平均发展"],"trapType":"概念混淆型","judgment":"错误"}]},{"id":"3.2","module":3,"moduleName":"中学教学","content":"教学过程的基本规律（直接经验与间接经验相统一、掌握知识与发展能力相统一、教师主导与学生主体相统一、传授知识与思想教育相统一）","level":"熟悉和运用","keywords":["教学过程规律","直接经验","间接经验","掌握知识","发展能力","教师主导","学生主体","教学教育性"],"appearances":{"简答":["2021下","2022下","2024下"],"辨析":["2021下","2022上","2024上","2024下","2025上","2026上"],"材料分析":["2023上"]},"totalAppearances":10,"typeCount":3,"predictions":{"typeProbabilities":{"简答":0.321,"辨析":0.426,"材料分析":0.254},"mostLikelyType":"辨析","confidence":43,"threatLevel":"极高","typeCount":3,"modelScores":{"historical":{"简答":0.3,"辨析":0.6,"材料分析":0.1},"content":{"简答":0.3333333333333333,"辨析":0.5,"材料分析":0.16666666666666666},"syllabus":{"简答":0.25,"辨析":0.25,"材料分析":0.5},"moduleCooccur":{"简答":0.3888888888888889,"辨析":0.3888888888888889,"材料分析":0.2222222222222222},"gapRegression":{"简答":0.2653846153846154,"辨析":0.23076923076923078,"材料分析":0.3384615384615385}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2021下","stem":"简述学校教学工作的意义。","answer":"(1)教学是传播系统知识、促进学生发展的最有效的形式，是社会经验再生产、 适应并促进社会发展的有力手段。(2)教学是进行全面发展教育，实现培养目标的基本途径，为个人全面发展提供 科学的基础和实践，是培养学生个性全面发展的重要环节。(3)教学是学校教育的中心工作，学校教育工作必须坚持以教学为主。","keywords":["教学","教学","教学"],"mnemonic":"","points":["教学是传播系统知识、促进学生发展的最有效的形式，是社会经验再生产、 适应并促进社会发展的有力手段。","教学是进行全面发展教育，实现培养目标的基本途径，为个人全面发展提供 科学的基础和实践，是培养学生个性全面发展的重要环节。","教学是学校教育的中心工作，学校教育工作必须坚持以教学为主。"]},{"type":"简答","exam":"2022下","stem":"简述中学教师布置作业的基本要求。","answer":"(1)内容符合课程标准和教科书的要求。(2)分量适宜，难易适度。(3)要求明确，规定完成时间。(4)作业反馈清晰、及时。","keywords":["内容符合课程标准和教科书的要求","分量适宜","要求明确","作业反馈清晰、及时"],"mnemonic":"","points":["内容符合课程标准和教科书的要求。","分量适宜，难易适度。","要求明确，规定完成时间。","作业反馈清晰、及时。"]},{"type":"简答","exam":"2024下","stem":"教学是学校的中心工作，学校的一切工作必须围绕教学开展。王老师作为一 名新入职的老师，就“教学的作用”这一主题与同事展开了深人讨论。请简述教学的 作用。","answer":"(1)教学是传播系统知识、促进学生发展的最有效的形式，是社会经验再生产、 适应并促进社会发展的有力手段。(2)教学是进行全面发展教育，实现培养目标的基本途径，为个人全面发展提供 科学的基础和实践，是培养学生个性全面发展的重要环节。(3)教学是学校教育的中心工作，学校教育工作必须坚持以教学为主。","keywords":["教学","教学","教学"],"mnemonic":"","points":["教学是传播系统知识、促进学生发展的最有效的形式，是社会经验再生产、 适应并促进社会发展的有力手段。","教学是进行全面发展教育，实现培养目标的基本途径，为个人全面发展提供 科学的基础和实践，是培养学生个性全面发展的重要环节。","教学是学校教育的中心工作，学校教育工作必须坚持以教学为主。"]},{"type":"辨析","exam":"2021下","stem":"学校教学应以间接经验为主。","answer":"表述正确。 间接经验指他人的认识成果，主要指人类在长期认识过程中积累并整理而成的书 本知识。在学校教学中应以间接经验为主，以直接经验为基础。这样能使学生用最短 的时间、最高效率地掌握大量的系统的科学文化基础知识。因此，学校教学应以间接 经验为主。 故表述正确。","keywords":["间接经验","直接经验","间接经验","直接经验"],"trapType":"以偏概全型","judgment":"正确"},{"type":"辨析","exam":"2022上","stem":"学生在学校学习的主要是间接经验。","answer":"表述正确。 间接经验指他人的认识成果，主要指人类在长期认识过程中积累并整理而成的书 本知识。教学过程中直接经验与间接经验相统一的规律指明，在教学中，学生以学习 间接经验为主，并且是间接地去体验。这样能使学生用最短的时间、最高效率地掌握 大量的系统的科学文化基础知识。因此，学生在学校学习的主要是间接经验。 故表述正确。","keywords":["间接经验","学生学习","间接经验","学生学习"],"trapType":"以偏概全型","judgment":"正确"},{"type":"辨析","exam":"2024上","stem":"教学就是智育。","answer":"表述错误。 教学是智育的主要途径，但不是唯一途径。智育也需要通过课外活动等途径来全 面实现；教学要完成智育任务，也要完成其他各育的任务，这是它们之间的区别。整 体来看，两者是交叉关系。 故表述错误。","keywords":["教学","智育","教学","智育"],"trapType":"概念混淆型","judgment":"错误"},{"type":"辨析","exam":"2024下","stem":"在一次教研活动中，老师们围绕课堂教学中教师与学生角色定位展开激烈讨 论。刘老师认为课堂教学时间有限，强调学生的主体地位必然会削弱教师的主导作用。 请对刘老师的观点进行辨析。","answer":"刘老师的观点错误。 在教学过程中要遵循教师主导与学生主体相统一的规律。教学是教师教学生去学， 学生是教师组织教学活动中的学习主体，同时教师对学生的学习起主导、指导作用。 教师的主导与学生的主体是相互依存、缺一不可的。教学中要着重发挥学生的主动性， 让学生参与到学习中来。在这个过程中，教师应给学生指明方向，保证学生学习的方 向性。因此，强调学生的主体地位并不会削弱教师的主导作用。 故刘老师的观点错误。","keywords":["教师主导","学生主体","教师主导","学生主体"],"trapType":"关系误判型","judgment":"错误"},{"type":"辨析","exam":"2025上","stem":"党的二十大报告指出，要坚持教育优先发展，加快建设教育强国，着力造就 拔尖创新人才。张老师认为培养拔尖创新人才的重点在于培养学生的创新思维，知识 教学则会妨碍学生创新思维的形成与发展。请对张老师的观点进行辨析。","answer":"张老师的观点错误。 在教学过程中要遵循掌握知识与发展能力相统一的规律。掌握知识是发展能力的 基础，能力发展是掌握知识的必要条件，掌握知识和发展能力要有机结合。创新思维 也是一种能力，因此，知识教学不会阻碍创新思维的形成与发展，二者应该是相互促 进的关系。 故张老师的观点错误。","keywords":["知识教学","创新思维","掌握知识与发展能力","知识教学","创新思维","掌握知识与发展能力"],"trapType":"关系误判型","judgment":"错误"},{"type":"辨析","exam":"2026上","stem":"求真中学二年级教研组开展关于学科课程、综合实践活动课程与智育的关系 问题讨论。在讨论中，赵老师认为，综合实践活动课程涉及的智育内容少，对智育作 用不大。请对赵老师的观点做出辨析。 4","answer":"赵老师的观点错误。 综合实践活动是从学生的真实生活和发展需要出发，从生活情境中发现问题，转 化为活动主题，通过探究、服务、制作、体验等方式，培养学生综合素质的跨学科实 践性课程。这类课程强调学生综合运用各学科知识，认识、分析和解决现实问题，提 升自身综合素质。智育是指向受教育者传授系统的文化科学知识和技能，专门发展受 教育者智力的教育活动。因此，综合实践活动可使学生通过亲身体验内化书本上的知 识，加深对知识的理解，提高问题解决能力，促进智力的发展。 故赵老师的观点错误。","keywords":["综合实践活动","智育","学科课程","综合实践活动","智育","学科课程"],"trapType":"关系误判型","judgment":"错误"},{"type":"材料分析","exam":"2023上","stem":"结合材料，分析刘老师的教学主要体现了哪种教学原则。 阐述贯彻该教学原则的基本要求。","answer":"(1)材料中，刘老师的教学充分体现了启发性原则。启发性原则是指在教学中教师要承认学生是学习的主体，注意调动他们的学习 主 动性，引导他们独立思考、积极探索，生动活泼地学习，自觉掌握科学知识，提高分 析问题和解决问题的能力。材料中，刘老师通过“如何在地球上确定某一位置”这一 启发性问题，引导学生独立思考、讨论、探究，最终使学生理解了经纬线、经纬网的 概念和意义，充分体现了启发性原则。(2)贯彻启发性教学原则的要求有以下几点：①加强学习的目的性教育，调动学生学习的主动性。教师在课堂教学前和教学过 程中，应提示学生所学内容的重要性，使学生在期待之中学习，从而获得更好的学习 效果。②启发学生独立思考，发展学生的逻辑思维能力。学生是有主观能动性的个体， 在教学过程中，教师应秉承教师主导作用与学生主体地位相统一的规律，充分发挥学 生的主动性，引导学生独立思考。76③让学生自己动手，培养学生独立解决问题的能力。④发扬教学民主。建立民主平等的师生关系，创造民主和谐的教学气氛，鼓励学 生发表不同的见解，允许学生向教师提问、质疑等。总而言之，教师在教学实践中要贯彻落实好启发性原则，以便更好地促进学生的 学习与发展。","keywords":["刘老师的教学充分体现了启发性原则","启发性原则","充分体现了启发性原则","(2)贯彻启发性教学原则","教师应秉承教师主导作用与学生主体地位相统一的规律","教师在教学实践中要贯彻落实好启发性原则","启发性原则","教学原则-启发性","教学原则-思想性与科学性统一","教学方法-讨论法"],"materialType":["教学案例"],"coreConcepts":["启发性原则"]}]},{"id":"7.5","module":7,"moduleName":"中学德育","content":"德育原则；德育方法；德育途径","level":"理解/掌握","keywords":["德育原则","德育方法","德育途径"],"appearances":{"简答":[],"辨析":["2020下","2025下"],"材料分析":["2019下","2021上","2021下","2022上","2022下","2023下","2025上","2025下"]},"totalAppearances":10,"typeCount":2,"predictions":{"typeProbabilities":{"简答":0.24,"辨析":0.252,"材料分析":0.509},"mostLikelyType":"材料分析","confidence":51,"threatLevel":"极高","typeCount":2,"modelScores":{"historical":{"简答":0,"辨析":0.2,"材料分析":0.8},"content":{"简答":0.4444444444444444,"辨析":0.1111111111111111,"材料分析":0.4444444444444444},"syllabus":{"简答":0.25,"辨析":0.5,"材料分析":0.25},"moduleCooccur":{"简答":0.17647058823529413,"辨析":0.35294117647058826,"材料分析":0.47058823529411764},"gapRegression":{"简答":0.35,"辨析":0.12692307692307692,"材料分析":0.3576923076923077}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"辨析","exam":"2020下","stem":"对学生进行思想品德教育只是思想品德课老师的工作。","answer":"表述错误。 德育途径是指学校教育者对学生实施德育时可供选择和利用的渠道，又称德育 组织形式。我国中学德育途径是广泛的，具体包括：①思想品德课与其他学科教学； ②社会实践活动；③课外、校外活动；④共青团及少先队组织的活动；⑤校会、班会、 周会、晨会、时事政策学习；⑥班主任工作。其中，思想品德课与其他学科的教学是 学校德育最基本的途径。因此，对学生进行思想品德教育不只是思想品德课老师的工 作，还是全体教师共同的工作。 故表述错误。","keywords":["德育途径","思想品德课","德育途径","思想品德课"],"trapType":"以偏概全型","judgment":"错误"},{"type":"辨析","exam":"2025下","stem":"在学校教育中，学科老师与班主任都扮演着重要的育人角色。数学组的王老 师认为，他的主要职责是培养学生的数学学科素养，促进学生的品德发展是班主任的 事。请对王老师的观点进行辨析。","answer":"王老师的观点错误。 班主任工作的主要任务是对学生进行思想品德教育。除此之外，德育的途径还有 很多，如：思想品德课与其他学科教学；社会实践活动；课外、校外活动；共青团及 少先队组织的活动；校会、班会、周会、晨会、时事政策学习等。因此，思想品德教 育是学校教育的重要组成部分，需要学校各方面的共同努力，并非只是班主任的任务。 故王老师的观点错误。","keywords":["德育方法","说服教育","惩戒","德育方法","说服教育","惩戒"],"trapType":"条件忽略型","judgment":"错误"},{"type":"材料分析","exam":"2019下","stem":"材料中这位老师贯彻了哪些德育原则?请结合材料加以分析。(10分)","answer":"材料中的这位老师在教学中贯彻了以下德育原则：首先，这位老师在教学过程中贯彻了因材施教原则。该原则是指教育者进行德育 时，要从学生品德发展的实际出发，根据学生的年龄特征和个性差异进行不同的教育， 使每个学生的品德都能得到更好的发展。材料中，这位老师在教学过程中对王晓这样一 位对学习缺乏兴趣的学生，采取针对性的措施进行教育，不断分析王晓的问题，寻找突 破口，利用合适的时机表扬王晓，还组织全班同学共同帮助王晓，帮助王晓不断进步， 使王晓成为一名积极的班级分子。由此看出，这位老师在教学过程中贯彻了因材施教的 原则。其次，这位老师在教学过程中贯彻了依靠积极因素、克服消极因素的原则。该原则是指德育工作中，教育者要善于依靠、发扬学生自身的积极因素，调动学生自我教 育的积极性，克服消极因素，实现品德发展内部矛盾的转化。材料中，这位老师在教 学过程中能够一分为二地看待王晓，利用他渴望交朋友的心理，积极地帮助他融入班 集体；在教学时，发现他作文写得不错时，积极地给予表扬肯定，帮助他增强信心 发现他有绘画基础，请美术老师私下指导，也使他找回自信。这些行为都反映了老师 在教学过程中能够积极地发现并发扬学生的优点，不断改正其不足，促进其进步。由 此看出，这位老师在教学过程中贯彻了依靠积极因素、克服消极因素的原则。再次，这位老师在教学过程中贯彻了尊重学生与严格要求学生相结合的原则。该 原则是指教育者进行德育时，要把对学生个人的尊重和信赖与对他们的严格要求结合 起来。材料中，这位老师对于王晓上课时的种种“捣蛋”行为，没有严厉批评，而且 不断地寻找新的思路帮助王晓进步。对于王晓的进步，老师也毫不吝啬自己的表扬和 赞美，这都是尊重学生的体现。同时，老师并没有放松对王晓的严格要求，想各种办 法让他融入集体中，成为班上积极进步的一员。由此看出，这位老师在教学过程中贯 彻了尊重学生与严格要求学生相结合的原则。最后，这位老师在教学过程中贯彻了集体教育和个别教育相结合原则。该原则是 指在德育过程中，教育者要善于组织和教育学生热爱集体，并依靠集体教育每个学 生，同时通过对个别学生的教育来促进集体的形成和发展，从而把集体教育和个别教 育有机结合起来。材料中，老师和班干部讨论了与王晓的交友行动计划，让更多的同 学参与进来，关注他、帮助他、跟他交流，最后在同学们的帮助下王晓融入了这个班 集体，这是通过集体的力量来教育个人。同时，班级也因此获得了“包容友善先进班 集体”的称号，这是通过个别教育使班集体得到了发展。由此看出，这位老师在教学 过程中贯彻了集体教育和个别教育相结合的原则。总之，该老师在教学过程中能够根据学生的特点，遵循相关的德育原则进行针对 性教育，是值得学习的。(答出正面教育与纪律约束相结合，言之有理也可)","keywords":["材料中的这位老师在教学中贯彻了以下德育原则","这位老师在教学过程中贯彻了因材施教原则","该原则","这位老师在教学过程中贯彻了依靠积极因素、克服消极因素的原则","这位老师在教学过程中贯彻了尊重学生与严格要求学生相结合的原则","彻了尊重学生与严格要求学生相结合的原则","这位老师在教学过程中贯彻了集体教育和个别教育相结合原则","过程中贯彻了集体教育和个别教育相结合的原则","遵循相关的德育原则","因材施教原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则","集体教育与个别教育相结合原则","班集体建设","德育原则-因材施教","德育原则-依靠积极因素克服消极因素","德育原则-尊重与严格要求相结合","德育原则-集体教育与个别教育相结合","德育原则-正面教育与纪律约束相结合","德育方法-实际锻炼法","德育方法-品德评价法"],"materialType":["学生行为案例","教学案例","班级管理案例"],"coreConcepts":["因材施教原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则","集体教育与个别教育相结合原则","班集体建设"]},{"type":"材料分析","exam":"2021上","stem":"材料中的“我”贯彻了哪些德育原则?结合材料加以分析。(10分)","answer":"材料中的“我”贯彻了疏导原则，知行统一原则，教育影响的一致性与连贯性原 则，集体教育和个别教育相结合的原则，因材施教原则，依靠积极因素、克服消极因 素原则，尊重学生与严格要求学生相结合的原则。第一，材料中的“我”贯彻了疏导原则。疏导原则是指教育者进行德育时要循循 善诱，以理服人，从提高学生的认识入手，调动学生的主动性，使他们积极向上。材 料中的“我”面对王伟的情况，召开主题班会提高他的思想意识，并语重心长地与他 谈心，体现了疏导原则。第二，材料中的“我”贯彻了知行统一原则。知行统一原则是指既要重视思想道 德的理论教育，又要重视组织学生参加实践锻炼，把提高认识和行为养成结合起来， 使学生做到言行一致、表里如一。材料中的“我”通过组织班会提高王伟的思想意识， 并要求王伟坚持不上网，让他担任班干部，参与出黑板报，体现了知行统一原则。第三，材料中的“我”贯彻了教育影响的一致性与连贯性原则。教育影响的一致 性与连贯性原则是指教育者进行德育时，应当有目的、有计划地把来自各方面的对学 生的教育影响加以组织、调节、整合，使其互相配合、协调一致、前后连贯地进行， 以保障学生的品德能按教育目的的要求发展。材料中的“我”对王伟定期家访，并与 他的父母沟通对王伟的教育，体现了教育影响的一致性与连贯性原则。第四，材料中的“我”贯彻了集体教育和个别教育相结合的原则。集体教育和个 别教育相结合的原则是指，在德育过程中，教育者要善于组织和教育学生热爱集体， 并依靠集体教育每个学生，同时通过对个别学生的教育来促进集体的形成和发展，从 而把集体教育和个别教育有机结合起来。材料中的“我”发动全班同学召开主题班会， 并集体对王伟的上网行为进行监督，帮助王伟摆脱网瘾，体现了集体教育和个别教育 相结合的原则。第五，材料中的“我”贯彻了因材施教原则。因材施教原则是指，教育者进行德 育时，要从学生品德发展的实际出发，根据学生的年龄特征和个性差异进行不同的教育，使每个学生的品德都能得到更好的发展。材料中的“我”能够针对王伟的情况采 取相应的定期家访、召开主题班会等措施，帮助王伟摆脱网瘾，使其取得较大进步， 体现了因材施教原则。第六，材料中的“我”贯彻了依靠积极因素、克服消极因素的原则。依靠积极因 素、克服消极因素的原则是指，在德育工作中，教育者要善于依靠和发扬学生自身的 积极因素，调动学生自我教育的积极性，克服消极因素，实现品德发展内部矛盾的转 化。材料中的“我”能够一分为二地看待学生，发现王伟的特长，调动他自我教育的 积极性，体现了依靠积极因素、克服消极因素的原则。第七，材料中的“我”贯彻了尊重学生与严格要求学生相结合的原则。尊重学生 与严格要求学生相结合的原则是指，教育者进行德育时，要把对学生个人的尊重和信 赖与对他们的严格要求结合起来，使教育者对学生的影响与要求易于转化为学生的品 德。材料中，针对王伟的情况，“我”语重心长地与他谈心，并为他采取了一项措施： 他每坚持一天不上网，就会有一位同学给他写上一句祝福或鼓励的话。这体现了尊重 学生与严格要求学生相结合的原则。综上所述，材料中的“我”能够贯彻德育原则，帮助学生取得进步，值得学习。","keywords":["材料中的“我”贯彻了疏导原则","知行统一原则","集体教育和个别教育相结合的原则","因材施教原则","素原则","尊重学生与严格要求学生相结合的原则","疏导原则","体现了疏导原则","材料中的“我”贯彻了知行统一原则","德的理论","体现了知行统一原则","材料中的“我”贯彻了教育影响的一致性与连贯性原则","性与连贯性原则","体现了教育影响的一致性与连贯性原则","材料中的“我”贯彻了集体教育和个别教育相结合的原则","别教育相结合的原则","相结合的原则","材料中的“我”贯彻了因材施教原则","体现了因材施教原则","材料中的“我”贯彻了依靠积极因素、克服消极因素的原则","素、克服消极因素的原则","体现了依靠积极因素、克服消极因素的原则","材料中的“我”贯彻了尊重学生与严格要求学生相结合的原则","与严格要求学生相结合的原则","学生与严格要求学生相结合的原则","材料中的“我”能够贯彻德育原则","因材施教原则","疏导原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则","集体教育与个别教育相结合原则","一致性与连贯性原则","德育原则-疏导原则","德育原则-因材施教","德育原则-依靠积极因素克服消极因素","德育原则-尊重与严格要求相结合","德育原则-集体教育与个别教育相结合","德育原则-一致性与连贯性","德育原则-知行统一","德育方法-说服教育法","德育方法-实际锻炼法","德育方法-自我修养法"],"materialType":["学生心理案例","学生行为案例","班级管理案例","德育案例","家校案例"],"coreConcepts":["因材施教原则","疏导原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则","集体教育与个别教育相结合原则","一致性与连贯性原则"]},{"type":"材料分析","exam":"2021下","stem":"李老师主要运用了哪种德育方法? 结合材料分析这一德育方法的含义和运用要求。","answer":"(1)李老师使用的是榜样示范法。材料中，李老师以身作则，通过自身打扫卫生 的模范行为给学生树立了良好的榜样，体现了榜样示范法。(2)榜样示范法是指用榜样人物的高尚思想、模范行为、优异成就来影响学生的 思想、情感和行为的方法。414运用榜样示范法要注意以下几方面：首先，选好学习的榜样。材料中，李老师将自己选作学生学习的榜样，在打扫教 室卫生的活动中以身作则，做好了示范，选好了榜样。其次，激起学生对榜样的敬慕之情。材料中，李老师自己打扫卫生的做法得到了 学生认可，使学生对李老师肃然起敬，激发了学生对榜样的敬慕之情。最后，引导学生用榜样来调节行为，提高修养。材料中，学生在对李老师产生敬 慕之情后，逐渐将这种情感转化为切实的卫生行动，最后使班级获得了流动红旗，体 现出引导学生运用榜样调节自身行为的要求。","keywords":["思想、情感和行为的方法","榜样示范法","德育方法-榜样示范法","德育方法-实际锻炼法","德育方法-自我修养法"],"materialType":["学生行为案例","教学案例","班级管理案例"],"coreConcepts":["榜样示范法"]},{"type":"材料分析","exam":"2022上","stem":"结合材料分析这位老师的做法贯彻了哪一德育原则。 阐述贯彻该德育原则的基本要求。57","answer":"(1)材料中的老师贯彻了依靠积极因素、克服消极因素的德育原则。该原则是指 在德育工作中，教育者要善于依靠、发扬学生自身的积极因素，调动学生自我教育的积极性，克服消极因素，实现品德发展内部矛盾的转化。材料中，当老师听到家长把 孩子骂得一无是处的时候，能够及时地提到孩子学习劲头足、上课非常认真的优点， 并在家长面前表扬孩子，从而增加了孩子的自信心，使孩子的成绩也得到提高，这体 现了依靠积极因素、克服消极因素这一原则。(2)贯彻依靠积极因素、克服消极因素原则的要求包括：①教育者要用一分为二的观点，全面分析，客观地评价学生的优点和不足。②教育者要有意识地创造条件，将学生思想中的消极因素转化为积极因素。③教育者要提高学生自我认识、自我评价能力，启发他们自觉思考，克服缺点， 发扬优点。","keywords":["(1)材料中的老师贯彻了依靠积极因素、克服消极因素的德育原则","该原则","现了依靠积极因素、克服消极因素这一原则","(2)贯彻依靠积极因素、克服消极因素原则","依靠积极因素克服消极因素原则","德育原则-依靠积极因素克服消极因素","德育原则-正面教育与纪律约束相结合","德育原则-知行统一","德育方法-说服教育法","德育方法-品德评价法","德育方法-自我修养法"],"materialType":["学生心理案例","学生行为案例","班级管理案例","家校案例"],"coreConcepts":["依靠积极因素克服消极因素原则"]},{"type":"材料分析","exam":"2022下","stem":"材料中，班主任李老师的做法主要体现了哪些德育原则?请结合案例加 以分析。(12分)","answer":"材料中，李老师的做法体现了疏导原则，尊重学生与严格要求学生相结合的原则 (严慈相济原则),依靠积极因素、克服消极因素的原则(长善救失原则),因材施教 原则。首先，李老师贯彻了疏导原则。该原则是指教育者进行德育时要循循善诱，以理 服人，从提高学生认识入手，调动学生的主动性，使他们积极向上。材料中，当王力90在课堂上画画、与同学产生矛盾、在绘画比赛中成绩不理想时，李老师都及时与王力 沟通，循循善诱，对其进行鼓励，帮助王力改正认识，体现了该原则。其次，李老师贯彻了尊重学生与严格要求学生相结合的原则。该原则要求教师既 尊重信任学生，又对学生提出严格的要求，把严和爱有机结合起来。材料中，当王力 目无纪律、在课上画画时，李老师并未一味指责，而是肯定其画画的兴趣，做到了尊 重学生；当王力与同学产生矛盾、绘画比赛失败后推卸责任时，李老师及时对其进行 教育，做到了严格要求学生。再次，李老师贯彻了依靠积极因素、克服消极因素的原则。该原则是指教育者要 善于依靠、发扬学生自身的积极因素，调动学生自我教育的积极性，克服消极因素， 实现品德发展内部矛盾的转化。材料中，李老师利用王力擅长画画这一优势引导其改 正行为散漫等缺点，体现了该原则。最后，李老师贯彻了因材施教原则。该原则是指教育者进行德育时，要从学生品 德发展的实际出发，根据学生的年龄特征和个性差异进行不同的教育。材料中，李老 师的一系列教育措施都是根据王力的特点提出的，做到了因材施教。综上所述，材料中李老师的做法是值得提倡的，作为教师，在教育工作中要贯彻 德育原则。","keywords":["李老师的做法体现了疏导原则","尊重学生与严格要求学生相结合的原则","(严慈相济原则","),依靠积极因素、克服消极因素的原则","(长善救失原则","李老师贯彻了疏导原则","该原则","体现了该原则","李老师贯彻了尊重学生与严格要求学生相结合的原则","李老师贯彻了依靠积极因素、克服消极因素的原则","李老师贯彻了因材施教原则","德育原则","因材施教原则","疏导原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则","德育原则-疏导原则","德育原则-因材施教","德育原则-依靠积极因素克服消极因素","德育原则-尊重与严格要求相结合","德育原则-集体教育与个别教育相结合","德育原则-正面教育与纪律约束相结合","德育原则-知行统一","德育方法-说服教育法","德育方法-品德评价法","德育方法-自我修养法"],"materialType":["学生行为案例","班级管理案例","德育案例"],"coreConcepts":["因材施教原则","疏导原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则"]},{"type":"材料分析","exam":"2023下","stem":"该老师的做法主要贯彻了哪一德育原则?请结合案例分析。(13分)","answer":"这位老师贯彻了尊重学生与严格要求学生相结合的原则。尊重学生与严格要求学生相结合的原则也叫严慈相济原则，是指教育者进行德育 时，要把对学生的思想和行为的严格要求与对他们个人的尊重和信赖结合起来，使教 育者对学生的影响与要求易于转化为学生的品德。材料中，这位老师面对学生在贴吧中发表的不文明话语时没有发脾气，而是肯定 学生对班集体的关心，说明这位老师做到了尊重学生。同时，这位老师也对学生施以 “惩罚”,让学生建立“说吧”,引导学生对班级的不合理规则提出建议，这一做法既 规范了学生的言行，又营造了良好的班级氛围，说明这位老师做到了严格要求学生。综上所述，这位老师贯彻了尊重学生与严格要求学生相结合的原则，采用了更加 科学、合理的方式对学生进行德育，值得我们学习。","keywords":["这位老师贯彻了尊重学生与严格要求学生相结合的原则","尊重学生与严格要求学生相结合的原则","也叫严慈相济原则","尊重与严格要求相结合原则","班集体建设","德育原则-尊重与严格要求相结合","德育原则-集体教育与个别教育相结合","德育方法-品德评价法"],"materialType":["学生行为案例","班级管理案例"],"coreConcepts":["尊重与严格要求相结合原则","班集体建设"]},{"type":"材料分析","exam":"2025上","stem":"班主任“我”贯彻了哪些德育原则?请结合材料加以分析。","answer":"材料中的班主任老师主要贯彻了疏导原则，尊重学生与严格要求学生相结合的原 则，依靠积极因素、克服消极因素的原则，因材施教原则。(1)班主任老师贯彻了疏导原则。该原则是指教育者进行德育时要循循善诱，以 理服人，从提高学生认识入手，调动学生的主动性，使他们积极向上。材料中，班主 任“我”找到没有交作文的许涛同学，与他交流、谈心，循循善诱，以理服人，帮助 许涛转变了认识，调动了许涛学习的主动性，这体现了疏导原则。(2)班主任老师贯彻了尊重学生与严格要求学生相结合的原则。该原则是指教育 者进行德育时，要把对学生的思想和行为的严格要求与对他们个人的尊重和信赖结合 起来，使教育者对学生的影响与要求易于转化为学生的品德。材料中，班主任“我” 在许涛犯错后没有进行简单粗暴的处理，而是挖掘其长处，循循善诱，体现了“我” 对许涛的尊重信任，同时“我”还对许涛提出了严格要求，这体现了尊重学生与严格 要求学生相结合的原则。(3)班主任老师贯彻了依靠积极因素、克服消极因素的原则。该原则是指在德育 工作中，教育者要善于依靠、发扬学生自身的积极因素，调动学生自我教育的积极性， 克服消极因素，实现品德发展内部矛盾的转化。材料中，班主任“我”利用许涛勤劳 能吃苦的优点帮助其在学习、纪律方面取得了很大的进步，这体现了依靠积极因素、 克服消极因素的原则。(4)班主任老师贯彻了因材施教原则。该原则是指教育者进行德育时，要从学生 品德发展的实际出发，根据学生的年龄特征和个性差异进行不同的教育，使每个学生 的品德都能得到更好的发展。材料中，班主任“我”针对许涛的特点、学习现状专门 制定了适合许涛的教育措施，这符合因材施教原则。综上所述，班主任老师的教育措施正确地运用了德育原则，值得借鉴。","keywords":["材料中的班主任老师主要贯彻了疏导原则","依靠积极因素、克服消极因素的原则","因材施教原则","(1)班主任老师贯彻了疏导原则","该原则","这体现了疏导原则","(2)班主任老师贯彻了尊重学生与严格要求学生相结合的原则","要求学生相结合的原则","(3)班主任老师贯彻了依靠积极因素、克服消极因素的原则","克服消极因素的原则","(4)班主任老师贯彻了因材施教原则","这符合因材施教原则","班主任老师的教育措施正确地运用了德育原则","因材施教原则","疏导原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则","德育原则-疏导原则","德育原则-因材施教","德育原则-依靠积极因素克服消极因素","德育原则-尊重与严格要求相结合","德育原则-正面教育与纪律约束相结合","德育原则-知行统一","德育方法-说服教育法","德育方法-自我修养法"],"materialType":["学生心理案例","学生行为案例","班级管理案例"],"coreConcepts":["因材施教原则","疏导原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则"]},{"type":"材料分析","exam":"2025下","stem":"请依据德育原则,谈谈你对“无奈六人组”的教育建议(10分)。","answer":"根据德育原则，对“无奈六人组”的教育建议如下：(1)可利用疏导原则进行教育。疏导原则是指教育者进行德育时要循循善诱，以 理服人，从提高学生认识入手，调动学生的主动性，使他们积极向上。材料中，教师 可针对他们的不良行为，如不发言时就乱动乱嚷、自习课打打闹闹、逗贫取乐等，循 循善诱，以理服人，提高他们的道德认识，帮助他们改正不良行为。(2)可利用依靠积极因素、克服消极因素的原则进行教育。依靠积极因素、克服 消极因素的原则是指德育工作中，教育者要善于依靠、发扬学生自身的积极因素，调 动学生自我教育的积极性，克服消极因素，实现品德发展内部矛盾的转化。材料中， 教师可挖掘他们做事效率高、爱表现的优点，为其提供展示机会，来转化他们干扰教 学、自习课打打闹闹等缺点。(3)可利用教育影响的一致性与连贯性原则进行教育。教育影响的一致性与连贯 性原则是指教育者进行德育时，应当有目的、有计划地把来自各方面对学生的教育影 响加以组织、调节、整合，使其互相配合、协调一致、前后连贯地进行，以保障学生 的品德能按教育目的的要求发展。材料中，针对作业应付问题，教师可以与家长商定， 建议家长在家营造安静学习环境，督促学生完成作业；学校的各科教师也要协作，及 时关注学生的作业完成情况，形成教育合力。(4)可利用尊重学生与严格要求学生相结合的原则进行教育。尊重学生与严格要 求学生相结合的原则是指教育者进行德育时，要把对学生的思想和行为的严格要求与 对他们个人的尊重和信赖结合起来，使教育者对学生的影响与要求易于转化为学生的 品德。材料中，教师在对学生进行教育时，不能表现出无奈、不耐烦等不良情绪，要 尊重他们，给予他们关爱，避免伤害他们的自尊心；同时也要严格要求学生，以免不 良行为的再次出现。综上所述，教师应综合运用德育原则进行教育，促进学生身心健康发展。","keywords":["根据德育原则","对“无奈六人组”的教育建议如下：(1)可利用疏导原则","疏导原则","(2)可利用依靠积极因素、克服消极因素的原则","消极因素的原则","(3)可利用教育影响的一致性与连贯性原则","性原则","(4)可利用尊重学生与严格要求学生相结合的原则","求学生相结合的原则","教师应综合运用德育原则","疏导原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则","一致性与连贯性原则","德育原则-疏导原则","德育原则-依靠积极因素克服消极因素","德育原则-尊重与严格要求相结合","德育原则-集体教育与个别教育相结合","德育原则-一致性与连贯性","德育原则-知行统一","德育方法-说服教育法","德育方法-陶冶教育法","德育方法-实际锻炼法","德育方法-自我修养法"],"materialType":["教学案例","班级管理案例"],"coreConcepts":["疏导原则","依靠积极因素克服消极因素原则","尊重与严格要求相结合原则","一致性与连贯性原则"]}]},{"id":"3.3","module":3,"moduleName":"中学教学","content":"教学工作的基本环节及要求；中学常用的教学原则、教学方法；教学组织形式的内容及要求","level":"掌握","keywords":["教学环节","教学原则","教学方法","教学组织形式"],"appearances":{"简答":["2019下","2021上","2022上","2023下"],"辨析":["2021上"],"材料分析":["2020下","2024下","2026上"]},"totalAppearances":8,"typeCount":3,"predictions":{"typeProbabilities":{"简答":0.446,"辨析":0.297,"材料分析":0.257},"mostLikelyType":"简答","confidence":45,"threatLevel":"极高","typeCount":3,"modelScores":{"historical":{"简答":0.5,"辨析":0.125,"材料分析":0.375},"content":{"简答":0.4615384615384615,"辨析":0.23076923076923073,"材料分析":0.30769230769230765},"syllabus":{"简答":0.5,"辨析":0.25,"材料分析":0.25},"moduleCooccur":{"简答":0.3888888888888889,"辨析":0.3888888888888889 ":"周老师贯彻了哪些教学原则? 请结合材料对这些教学原则加以分析。","answer":"(1)周老师贯彻了以下教学原则：因材施教原则、直观性原则、启发性原则、量 力性原则。(2)第一，周老师贯彻了因材施教原则。因材施教原则是指教师要从学生的实际 情况、个别差异出发，有的放矢地进行教学。材料中，周老师发现学生的知识基础差 异较大，于是对程度不同的学生提出了不同的要求，这说明周老师做到了针对学生的 差异进行教育，符合因材施教原则的要求。第二，周老师贯彻了直观性原则。直观性原则是指教学中要通过学生观察所学事 物或教师语言形象的描述，引导学生形成对所学事物、过程的清晰表象，丰富他们的 感性认识，从而使他们能够正确理解书本知识和发展认识能力。材料中，周老师通过 创设情境、运用多媒体教学引导学生产生直观体验，符合直观性原则的要求。第三，周老师贯彻了启发性原则。启发性原则是指在教学中教师要注意调动学生 的学习主动性，引导他们独立思考、积极探索，生动活泼地学习。材料中，周老师在 教学过程中采用小组讨论的方式，调动学生的积极性和主动性，激发其学习兴趣、引 导其主动思考，符合启发性原则的要求。第四，周老师贯彻了量力性原则。量力性原则是指教学的内容、方法、分量和进 度要适合学生的身心发展。材料中，周老师给学生布置了难易程度不同的习题，说明 其考虑了学生的接受能力，符合量力性原则的要求。因此，周老师的教学体现了因材施教原则、直观性原则、启发性原则和量力性 原则。(答出理论联系实际原则，言之有理也可)","keywords":["(1)周老师贯彻了以下教学原则","：因材施教原则","、直观性原则","、启发性原则","力性原则","周老师贯彻了因材施教原则","因材施教原则","符合因材施教原则","周老师贯彻了直观性原则","直观性原则","符合直观性原则","周老师贯彻了启发性原则","启发性原则","符合启发性原则","周老师贯彻了量力性原则","量力性原则","是指教学的内容、方法","符合量力性原则","周老师的教学体现了因材施教原则","(答出理论","联系实际原则","因材施教原则","直观性原则","启发性原则","理论联系实际原则","量力性原则","教学原则-直观性","教学原则-启发性","教学原则-量力性","教学原则-理论联系实际","教学原则-因材施教","教学方法-讨论法","教学方法-读书指导法","教学方法-情境教学法"],"materialType":["学生行为案例","教学案例"],"coreConcepts":["因材施教原则","直观性原则","启发性原则","理论联系实际原则","量力性原则"]},{"type":"材料分析","exam":"2024下","stem":"请结合材料讲一讲孙老师运用了哪些教学方法，并进行具体分析。","answer":"孙老师运用了讨论法、演示法、谈话法、实验法、讲授法等教学方法。(1)孙老师运用了讨论法。讨论法是指学生在教师的指导下为解决某个问题进行 探讨、辩论，从而获取知识的方法。材料中，学生讨论并发言，师生共同总结概念， 这运用了讨论法。(2)孙老师运用了演示法。演示法是指教师通过展示实物、直观教具，进行示 范性的实验或采取现代化视听手段等指导学生获得知识或巩固知识的方法。材料中， 孙老师拿出准备好的烧杯在学生面前做实验，播放幻灯片展示案例等方式运用了演 示法。(3)孙老师运用了谈话法。谈话法也叫问答法，是指教师按照一定的教学要求向 学生提出问题，要求学生回答，并通过问答的形式来引导学生获取新知识或巩固旧知 识的方法。材料中，孙老师抛出问题，学生随后回答，这运用了谈话法。(4)孙老师运用了实验法。实验法是指学生在教师的指导下，使用一定的仪器和 设备，在一定条件下引起某些事物和现象产生变化，并进行观察和分析，以获得知识 和技能的方法。材料中，通过燃烧条件得出灭火条件后，孙老师拿出教具，找几个学 生向其他同学一一示范，让学生自己讲解灭火的原理，这运用了实验法。(5)孙老师运用了讲授法。讲授法是指教师运用口头语言系统地向学生传授知识 的方法。材料中，孙老师讲解“燃烧和灭火”,边问边讲，这运用了讲授法。综上所述，孙老师在教学中正确运用了以上教学方法，是值得借鉴的。","keywords":["孙老师运用了讨论法、演示法、谈话法、实验法、讲授法等教学方法","从而获取知识的方法","范性的实验或采取现代化视听手段等指导学生获得知识或巩固知识的方法","识的方法","和技能的方法","的方法","孙老师在教学中正确运用了以上教学方法","教学原则-直观性","教学原则-启发性","教学原则-循序渐进","教学原则-巩固性","教学原则-理论联系实际","教学方法-讲授法","教学方法-讨论法","教学方法-演示法","教学方法-实验法","教学方法-读书指导法"],"materialType":["学生行为案例","教学案例"],"coreConcepts":[]},{"type":"材料分析","exam":"2026上","stem":"结合材料，分析说明该老师贯彻了哪些教学原则。","answer":"材料中，该老师贯彻了直观性原则、启发性原则、循序渐进原则以及思想性和科 学性相统一原则。第一，该老师贯彻了直观性原则。直观性原则是指教学中要通过学生观察所学事 物或教师语言形象的描述，引导学生形成对所学事物、过程的清晰表象，丰富他们的 感性认识，从而使他们能够正确理解书本知识和发展认识能力。材料中，老师让学生 观看黄河流域相关视频，遵循了直观性原则。第二，该老师贯彻了启发性原则。启发性原则是指在教学中教师要承认学生是学 习的主体，注意调动他们的学习主动性，引导他们独立思考、积极探索，生动活泼地 学习，自觉掌握科学知识，提高分析问题和解决问题的能力。材料中，老师通过提问， 引导学生思考，遵循了启发性原则。第三，该老师贯彻了循序渐进原则。循序渐进原则是指教学要按照学科的逻辑系 统和学生认识发展的顺序进行，使学生系统地掌握基础知识、基本技能，形成严密的 逻辑思维能力。材料中，老师按照组织教学、提出问题、感知教材、模拟实验、小组 讨论、课堂小结的顺序，一步步地逐渐让学生理解了“水土保持”一课内容，遵循了 循序渐进原则。第四，该老师贯彻了思想性和科学性相统一原则。思想性和科学性相统一原则是 指既要把现代先进科学的基础知识和基本技能传授给学生，同时也要结合知识、技能 中内在的德育因素，对学生进行政治、思想教育和道德品质教育。材料中，老师结合 环境保护对学生进行情感、态度、价值观教育，遵循了思想性和科学性相统一原则。综上所述，该老师贯彻了直观性原则、启发性原则、循序渐进原则以及思想性和 科学性相统一原则，值得借鉴。","keywords":["该老师贯彻了直观性原则","、启发性原则","、循序渐进原则","学性相统一原则","直观性原则","遵循了直观性原则","该老师贯彻了启发性原则","启发性原则","遵循了启发性原则","该老师贯彻了循序渐进原则","循序渐进原则","该老师贯彻了思想性和科学性相统一原则","思想性和科学性相统一原则","遵循了思想性和科学性相统一原则","科学性相统一原则","直观性原则","启发性原则","循序渐进原则","思想性与科学性统一原则","教学原则-直观性","教学原则-启发性","教学原则-循序渐进","教学原则-思想性与科学性统一","教学方法-讲授法","教学方法-讨论法","教学方法-演示法","教学方法-实验法","教学方法-读书指导法","教学过程-基本阶段"],"materialType":["学生行为案例","教学案例"],"coreConcepts":["直观性原则","启发性原则","循序渐进原则","思想性与科学性统一原则"]}]},{"id":"4.7","module":4,"moduleName":"中学生学习心理","content":"行为主义、认知学说、人本主义、建构主义等学习理论促进教学","level":"理解并运用","keywords":["行为主义","认知主义","人本主义","建构主义","学习理论"],"appearances":{"简答":["2021上","2023下","2024上"],"辨析":[],"材料分析":["2021下","2023上","2024上","2024下","2025上"]},"totalAppearances":8,"typeCount":2,"predictions":{"typeProbabilities":{"简答":0.282,"辨析":0.238,"材料分析":0.48},"mostLikelyType":"材料分析","confidence":48,"threatLevel":"极高","typeCount":2,"modelScores":{"historical":{"简答":0.375,"辨析":0,"材料分析":0.625},"content":{"简答":0.1111111111111111,"辨析":0.2222222222222222,"材料分析":0.6666666666666666},"syllabus":{"简答":0.2,"辨析":0.3,"材料分析":0.5},"moduleCooccur":{"简答":0.35294117647058826,"辨析":0.38235294117647056,"材料分析":0.2647058823529412},"gapRegression":{"简答":0.3153846153846154,"辨析":0.35,"材料分析":0.2923076923076923}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2021上","stem":"简述建构主义学习理论。","answer":"(1)建构主义知识观①知识并不是对现实的准确表征，也不是最终答案，而只是一种解释、一种假设；②知识并不能精确地概括世界的法则，在具体问题中，并不能拿来就用，一用就灵， 而是要针对具体情境进行再创造；③理解知识取决于特定情境下的学习历程。(2)建构主义学生观①建构主义强调学生经验世界的丰富性，强调学生的巨大潜能；②建构主义强调 学生经验世界的差异性。(3)建构主义学习观①建构主义强调学习的主动建构性；②建构主义强调学习的社会互动性；③建构 主义强调学习的情境性。","keywords":["建构主义知识观①知识并不","建构主义学生观①","建构主义学习观①"],"mnemonic":"知生学三观 — 知识观、学生观、学习观","points":["建构主义知识观①知识并不是对现实的准确表征，也不是最终答案，而只是一种解释、一种假设；②知识并不能精确地概括世界的法则，在具体问题中，并不能拿来就用，一用就灵， 而是要针对具体情境进行再创造；③理解知识取决于特定情境下的学习历程。","建构主义学生观①建构主义强调学生经验世界的丰富性，强调学生的巨大潜能；②建构主义强调 学生经验世界的差异性。","建构主义学习观①建构主义强调学习的主动建构性；②建构主义强调学习的社会互动性；③建构 主义强调学习的情境性。"]},{"type":"简答","exam":"2023下","stem":"简述布鲁纳认知结构学习理论的主要观点。","answer":"(1)学习观：①学习的实质是主动地形成认知结构。②学习包括获得、转化和评价三个过程。(2)教学观：①教学的目的在于理解学科的基本结构。②掌握学科基本结构的教学原则：动机原则、结构原则、程序原则、强化原则。③发现学习。","keywords":["学习观","教学观"],"mnemonic":"","points":["学习观：①学习的实质是主动地形成认知结构。②学习包括获得、转化和评价三个过程。","教学观：①教学的目的在于理解学科的基本结构。②掌握学科基本结构的教学原则：动机原则、结构原则、程序原则、强化原则。③发现学习。"]},{"type":"简答","exam":"2024上","stem":"简述人本主义学习理论的基本观点。","answer":"人本主义心理学的学习理论从全人教育的视角阐释了学习者整个人的成长历程， 以发展人性；注重启发学习者的经验和创造潜能，引导其结合认知与经验，肯定自我， 进而自我实现。其主要代表人物为罗杰斯与马斯洛。其中，罗杰斯的观点主要表现为 以下几个方面：(1)知情统一的教学目标观。教育理想就是要培养既用认知的方式也用情感的方 式行事的知情合一的人。(2)有意义的自由学习观。有意义学习是指一种使个体的行为、态度、个性及在 未来选择行动方针时发生重大变化的学习。这不仅是一种增长知识的学习，而且是一 种与每个人各部分经验都融合在一起的学习。(3)学生中心的教学观。学生中心模式又称非指导模式，教师的角色是“助产士” 或“催化剂”。","keywords":["知情统一的教学目标观","有意义的自由学习观","学生中心的教学观"],"mnemonic":"知情意 — 知情统一目标、有意义自由学习、学生中心","points":["知情统一的教学目标观。教育理想就是要培养既用认知的方式也用情感的方 式行事的知情合一的人。","有意义的自由学习观。有意义学习是指一种使个体的行为、态度、个性及在 未来选择行动方针时发生重大变化的学习。这不仅是一种增长知识的学习，而且是一 种与每个人各部分经验都融合在一起的学习。","学生中心的教学观。学生中心模式又称非指导模式，教师的角色是“助产士” 或“催化剂”。"]},{"type":"材料分析","exam":"2021下","stem":"请用迁移相关理论分析上述学习现象。 该迁移理论对教学有何启示?四、材料分析题","answer":"(1)材料中的学习现象体现了概括化迁移理论。贾德认为，在先期学习A中所 获得的东西，之所以能迁移到后期的学习B中，是因为在学习A时获得了一般原理， 这种一般原理可以部分或全部运用于A、B之中。根据这一理论，两个学习活动之间 存在的共同成分，只是产生迁移的必要前提，而产生迁移的关键是，学习者在两种活 动中概括出它们之间的共同原理。所以贾德的迁移理论又称“概括说”或“类化说”。材料中，学生已经掌握了五言绝句的平仄规律，而平仄规律是五言绝句、五言律 诗和七言律诗的共同原理，因此，学生可以很容易地总结出五言律诗以及七言律诗的 平仄规律。这体现了概括化原理的掌握对迁移的影响。(2)角度1:①精选教材。教师应选择那些具有广泛迁移价值的科学成果作为教 材的基本内容。②合理编排教学内容。从迁移的角度来看，合理编排的标准就是使教材达到结构 化、一体化、网络化。③合理安排教学程序。教学中应将基本的知识、技能和态度等规律性内容作为教 学的主干结构，并依此进行教学。④教授学习策略，提高迁移意识性。仅教给学生组织良好的信息是不够的，还需 要使学生了解在什么条件下迁移所学的内容、迁移的有效性如何等。角度2:概括化理论对教学的启示：教师在教学中应注意启发学生对所学内容进行概括总结。具体来说，需要做到以下几点：①在教学中注意引导学生自己总结出概括化的原理，培养和提高其概括总结的能 力，充分利用原理、原则的迁移。②在讲解原理、原则时，要列举各种变式，使学生正确把握其内涵和外延；同时 应结合原理、原则的具体运用情境进行讲解和学习，使学生能脱离学习原理、原则的 背景而把握其实质，并能在遇到该原理、原则适用的背景时，准确地运用原理、原则去学习新知识或解决新问题，以防止学生对某一原理、原则的理解和运用局限于习得 该原理、原则时的情境的情况。③教师要采取多种教学措施，帮助学生理解所学的基本知识，使学生学会概括的 方法，提高概括的水平，并在此基础上进行复习和练习，以达到熟练记忆和运用的 目的。","keywords":["(1)材料中的学习现象体现了概括化迁移理论","根据这一理论","所以贾德的迁移理论","学生已经掌握了五言绝句的平仄规律","而平仄规律","平仄规律","教学中应将基本的知识、技能和态度等规律","④教授学习策略","角度2:概括化理论","充分利用原理、原则","②在讲解原理、原则","应结合原理、原则","使学生能脱离学习原理、原则","并能在遇到该原理、原则","准确地运用原理、原则","以防止学生对某一原理、原则","该原理、原则","学习迁移理论","学习动机-需要层次理论","学习迁移-经验类化说","学习迁移-认知结构说","学习策略-认知策略","学习策略-复习方法","行为主义-经典条件反射","认知主义-布鲁纳认知结构","建构主义-学习观","认知过程-注意品质","认知过程-记忆与遗忘","知识学习-知识概括","技能学习-操作技能"],"materialType":["教学案例"],"coreConcepts":["学习迁移理论"]},{"type":"材料分析","exam":"2023上","stem":"试从行为主义心理学视角，分析三种情境中教师做法的依据。 该材料对教师培养学生良好行为有何启示?四、材料分析题","answer":"(1)①情境1中教师的做法体现了斯金纳操作性条件作用理论中的“消退”。消 退是指有机体做出以前曾被强化过的反应，如果在这一反应之后不再有强化物相伴， 那么,此类反应在将来发生的概率便降低。材料中，林强上课捣乱时，老师和同学都 不理他，久而久之，他的捣乱行为逐渐减少了，这体现了消退的作用。②情境2中教师的做法体现了斯金纳操作性条件作用理论中的“惩罚”。惩罚是 指当有机体做出某种反应以后，呈现一个厌恶刺激(如体罚、谴责等)或者减少一个 愉快刺激，以消除或抑制此类反应的过程。材料中，老师在杰明不遵守纪律时宣布取 消他去春游的活动资格，体现了惩罚。③情境3中教师的做法体现了斯金纳操作性条件作用理论中的“正强化”。正强 化是指给予一个愉快刺激，从而增加有机体行为出现的概率。材料中，只要兴华不在 课上讲闲话，老师就及时给予表扬，体现了正强化。(2)教师在培养学生良好行为时，应在了解学生的基础上，分析学生行为背后的 原因，并根据实际情况合理地运用强化规律。①合理地使用消退。老师应分析学生不良行为背后是什么因素在起强化作用，尽 可能消除强化学生不良行为的因素，通过不予理睬的消退方式来改变学生的不良行为。 材料中，林强上课捣乱，受到同学责怪和老师批评，可他的行为不仅没有减少，反而 频繁出现。这是因为对林强而言，他上课捣乱是为了获得老师和同学的关注，所以老 师和同学的批评、责怪对他而言是一种强化。而后老师不予强化，即恰当地使用了 消退。②恰当地运用惩罚。多用剥夺式惩罚，少用甚至不用施予式惩罚。剥夺式惩罚是指 在孩子实施了某种不良行为后，教师或家长剥夺其喜爱的某种刺激，以减少受惩罚行为 再次发生的可能性。材料中，杰明上课时总是不遵守纪律，老师多次找他谈话都没起到 好的效果，最后老师宣布取消杰明去春游的活动资格。这是使用了剥夺式惩罚。③正确地运用强化。惩罚并不能使行为发生永久性的改变，它只能暂时抑制行为， 不能根除行为。因此，惩罚的运用必须慎重，惩罚一种不良行为应与强化一种良好行为结合起来，方能取得预期的效果。材料中，兴华平时课上喜欢讲闲话，以前老师一 味地批评并没取得好的效果，于是采用了新的策略：只要兴华不在课上讲闲话，老师 就及时给予表扬。这体现了在惩罚不起效果时，合理地运用强化可以改变学生的不良 行为。","keywords":["(1)①情境1中教师的做法体现了斯金纳操作性条件作用理论","②情境2中教师的做法体现了斯金纳操作性条件作用理论","③情境3中教师的做法体现了斯金纳操作性条件作用理论","并根据实际情况合理地运用强化规律","于是采用了新的策略","操作条件反射理论","行为主义学习理论","行为主义-经典条件反射","行为主义-操作条件反射","建构主义-学习观","技能学习-操作技能"],"materialType":["学生行为案例","教学案例"],"coreConcepts":["操作条件反射理论","行为主义学习理论"]},{"type":"材料分析","exam":"2024上","stem":"请解释“先行组织者”的含义。 请结合李老师的做法，说明先行组织者在教学中的作用。一 J u 工 中 口 刀 o四、材料分析题","answer":"(1)先行组织者策略是奥苏贝尔的有意义学习理论在教学中具体应用的技术。所 谓“先行组织者”,是先于学习任务本身呈现的一种引导性材料。它要比学习任务本 身有较高的抽象、概括和综合水平，并且能够清晰地与认知结构中原有观念和新任务 关联起来。也就是通过呈现“组织者”,在学习者已有知识与需要学习的新内容之间 架设一道桥梁，使学生能更有效地学习新材料。(2)李老师的做法是正确的，践行了先行组织者的教学策略。奥苏贝尔认为，先行组织者不仅能够帮助学习者学习新知识，而且可以帮助其保 持知识。具体表现在以下几个方面：①能够将学生的注意力集中在将要学习的新知识 中的重点部分；②突出强调新知识与已有知识的关系，为新知识提供一种框架；③能 够帮助学生回忆起与新知识相关的已有知识，以便更好地建立联系。材料中，李老师 先让学生学习“神经系统”的一般知识，是在为“周围神经系统”的学习提供一个大 框架，进而厘清“周围神经系统”与“中枢神经系统”的关系，即帮助学生理解新内 容与已有知识的关系，建立知识之间的联系。因此，在教学中我们应学习李老师的做法。","keywords":["(1)先行组织者策略","是奥苏贝尔的有意义学习理论","践行了先行组织者的教学策略","先行组织者策略","学习动机-需要层次理论","学习迁移-经验类化说","学习迁移-关系转换说","学习迁移-认知结构说","学习策略-认知策略","学习策略-复习方法","认知主义-布鲁纳认知结构","认知主义-奥苏贝尔有意义学习","人本主义-学习理论","认知过程-注意品质","知识学习-知识概括"],"materialType":["教学案例"],"coreConcepts":["先行组织者策略"]},{"type":"材料分析","exam":"2024下","stem":"简述同化和顺应的主要内容。 结合上述原理，分析王老师的教学活动。四、材料分析题","answer":"(1)皮亚杰认为，心理结构涉及图式、同化、顺应、平衡四个概念。同化是指有机体在面对一个新的刺激情境时，把刺激整合到已有的图式或认知结 构中，即把环境因素纳人已有的图式中，使之成为自身认知结构的一部分，从而加强 和丰富原有图式。顺应是指当有机体不能利用原有图式接受和解释新刺激时，其认知结构发生改变 来适应新刺激的影响，即改变原有图式，以适应环境。(2)材料中，王老师在讲解三角形的面积计算公式时，通过长方形面积的计算方 法，去讲解新的直角三角形的面积计算，学生能够利用已掌握的长方形面积计算的知 识解决新问题，并未改变已有的认知结构，这一过程中王老师采用的是同化。王老师后续再次提到，在长方形的长边任意选择一个点，以另外一个长边为底，画一个非直角三角形，部分学生无法回答出非直角三角形的面积，因为学生无法通过 使用长方形面积除以二的方式获得，需要学习三角形面积公式进行计算来获得答案， 故需要改变原有的认知结构，这一过程中王老师想要采用的方式是顺应，但部分学生 暂不了解。","keywords":["皮亚杰认知发展理论","学习动机-需要层次理论","学习迁移-经验类化说","学习迁移-认知结构说","学习策略-资源管理策略","认知主义-布鲁纳认知结构","建构主义-学习观"],"materialType":["教学案例"],"coreConcepts":["皮亚杰认知发展理论"]},{"type":"材料分析","exam":"2025上","stem":"请根据强化原理，分析李老师的做法有哪些问题。 请基于强化原理，提出处理这种情形的办法。四、材料分析题","answer":"(1)根据强化理论，李老师的做法存在以下问题：①对于不遵守课堂要求的王强同学，错误地运用了正强化。根据斯金纳的强化理 论，正强化是指给予一个愉快刺激，从而增强有机体行为出现的概率。材料中，王强 同学不遵守李老师制定的课堂发言规则，没有做到先举手并安静等待老师叫名字，而 是直接举手抢答。但李老师仍然给了他一个回答的机会，对于王强来说获得的是一种 愉快的刺激，起到了正强化的作用，李老师无意中强化了不恰当的行为，这会导致王 强同学不遵守课堂规则的行为发生频率增加。②班上其他学生受到了替代性强化的不良影响。根据班杜拉的观察学习理论，替 代性强化指的是观察者因看到榜样的行为被强化而受到强化。材料中，班上其他同学 通过观察，看到王强同学不遵守课堂规则仍然可以获得回答问题的机会，从而受到了 一种替代性强化，这会导致全班同学不遵守课堂规则的行为发生频率增加。(2)教师在培养学生良好行为时，应在了解学生的基础上，分析学生行为背后的 原因，并根据实际情况合理地运用强化规律。①合理且坚定地使用消退。教师应分析学生不良行为背后是什么因素在起强化作 用，尽可能消除强化学生不良行为的因素，通过不予理睬的消退方式来改变学生的不 良行为。材料中，对于王强同学不遵守课堂规则的行为，李老师应坚定地使用消退， 而不是直接给予他回答问题的机会。②发挥替代性强化的作用。材料中，李老师对课堂中不遵守课堂规则的王强同学， 应有意忽视，为其他学生树立行为的榜样，让其他学生知道这种行为是不恰当的，无 法得到回答问题的机会。其他学生通过观察李老师对待王强的态度和行为，会因此受 到替代性强化，类似的行为就会减少。","keywords":["(1)根据强化理论","根据班杜拉的观察学习理论","并根据实际情况合理地运用强化规律","操作条件反射理论","学习迁移-经验类化说","行为主义-操作条件反射","行为主义-社会学习理论"],"materialType":["学生行为案例","教学案例"],"coreConcepts":["操作条件反射理论"]}]},{"id":"4.5","module":4,"moduleName":"中学生学习心理","content":"学习迁移的分类；形式训练说、共同要素说、概括化理论、关系转换理论、认知结构迁移理论；有效促进学习迁移的措施","level":"了解/理解/掌握","keywords":["学习迁移","形式训练说","共同要素说","概括化理论","关系转换理论","认知结构迁移"],"appearances":{"简答":[],"辨析":["2020下","2021上","2022下","2023上","2024上","2025下"],"材料分析":["2020下","2022下"]},"totalAppearances":8,"typeCount":2,"predictions":{"typeProbabilities":{"简答":0.176,"辨析":0.522,"材料分析":0.302},"mostLikelyType":"辨析","confidence":52,"threatLevel":"极高","typeCount":2,"modelScores":{"historical":{"简答":0,"辨析":0.75,"材料分析":0.25},"content":{"简答":0,"辨析":0.6666666666666666,"材料分析":0.33333333333333326},"syllabus":{"简答":0.25,"辨析":0.5,"材料分析":0.25},"moduleCooccur":{"简答":0.35294117647058826,"辨析":0.38235294117647056,"材料分析":0.2647058823529412},"gapRegression":{"简答":0.35,"辨析":0.28076923076923077,"材料分析":0.4269230769230769}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"辨析","exam":"2020下","stem":"顺向迁移就是正迁移。","answer":"表述错误。 根据迁移发生的方向，迁移可以分为顺向迁移和逆向迁移。其中，顺向迁移指先 前学习对后继学习产生的影响。根据迁移的性质和结果，迁移可以分为正迁移和负迁 移。正迁移指一种学习对另一种学习起到积极的促进作用，负迁移指一种学习对另一 种学习起到消极的阻碍作用。顺向迁移既可能产生积极的促进作用，也可能产生消极 的阻碍作用。因此，顺向迁移不一定就是正迁移。 故表述错误。","keywords":["顺向迁移","正迁移","顺向迁移","正迁移"],"trapType":"概念混淆型","judgment":"错误"},{"type":"辨析","exam":"2021上","stem":"后继学习对先前学习产生负迁移。","answer":"表述错误。 根据迁移的性质和结果，可以将迁移分为正迁移和负迁移。正迁移是指一种学习 对另一种学习起到积极的促进作用。负迁移是指两种学习之间相互干扰、阻碍，即一 种学习对另一种学习产生消极影响。根据迁移发生的方向，可以将迁移分为顺向迁移 和逆向迁移。逆向迁移是指后继学习对先前学习产生的影响。逆向迁移既可能产生积 极的促进作用，也可能产生消极的阻碍作用。因此，后继学习对先前学习产生的不一 定就是负迁移。 故表述错误。","keywords":["顺向迁移","负迁移","后继学习","顺向迁移","负迁移","后继学习"],"trapType":"概念混淆型","judgment":"错误"},{"type":"辨析","exam":"2022下","stem":"所有行为变化均是学习的结果。","answer":"表述错误。 学习是个体在特定的情境下由经验或反复练习而产生的行为或行为潜能的比较持 久的改变。行为的改变必须是由经验引起的，且行为的改变也必须是持久的，如由喝 酒、服用兴奋剂引起的短暂行为改变就不是学习。此外，学习结果除了包括行为的改 变之外，还包括行为潜能的改变。因此，行为的变化不一定是学习的结果。 故表述错误。 二 简答题","keywords":["学习","行为变化","学习","行为变化"],"trapType":"绝对化表述型","judgment":"错误"},{"type":"辨析","exam":"2023上","stem":"学校心理辅导只面向有心理问题的学生。","answer":"表述错误。 学校心理辅导要坚持面向全体学生的原则。心理辅导是面向全体学生、为全体学 生服务的，有利于促进学生整体素质的提高和个性的和谐发展。它不是只面向有心理 问题的学生。 故表述错误。 --- 个","keywords":["学习","迁移","学习","迁移"],"trapType":"关系误判型","judgment":"错误"},{"type":"辨析","exam":"2024上","stem":"课堂中的人际关系就是师生关系。","answer":"表述错误。 课堂中的人际关系是指课堂群体中，在师生间和学生间交流基础上形成的由个体 的个性进行调节，并伴随着情感上的满意或不满意状态的师生间、学生间比较稳定的 心理联系。课堂中的人际关系包括师生关系(教师与学生的关系)以及生生关系 (学 生与学生的关系)。 故表述错误。","keywords":["认知风格","场独立","场依存","优劣","认知风格","场独立","场依存","优劣"],"trapType":"关系误判型","judgment":"错误"},{"type":"辨析","exam":"2025下","stem":"李老师在教学过程中发现，与学生听教师讲解的接受学习相比，学生通过自 己探究而获得知识的发现学习效果更好。由此，李老师觉得在课堂教学中，发现学习 优于接受学习。请对李老师的观点进行辨析。","answer":"李老师的观点错误。 奥苏贝尔根据学习进行的方式，将学习分为接受学习和发现学习。其中，接受学 习是指将学生要学习的概念、原理等内容以结论的方式呈现在学生面前，教师传授， 学生接受。接受学习适合学生在短时间内掌握系统的知识，比较省时省力，但是不利 于发挥学生的主观能动性。发现学习是指要学习的概念、原理等内容不直接呈现给学 生，需要学生通过独立思考、探索、发现而获得。发现学习可以培养学生的科学探索 精神和创造能力，但是比较费时费力。因此，接受学习和发现学习都是教学中的有效 方法，两种学习方式各有优缺点，不能简单地比较优劣。 故李老师的观点错误。","keywords":["正强化","负强化","惩罚","正强化","负强化","惩罚"],"trapType":"关系误判型","judgment":"错误"},{"type":"材料分析","exam":"2020下","stem":"请根据自我效能感理论分析这位学生的问题及问题产生的原因。 如果你是许老师，应该如何帮助这位学生?四、材料分析题","answer":"(1)问题：材料中的这位同学所出现的问题是自我效能感过低。自我效能感是指 个人对自己是否具有通过努力成功完成某种活动的能力所持有的主观判断与信念。这 位同学总是觉得自己不能胜任相应的活动，总是思考“我能行吗”,说明其自我效能感较低。问题产生的原因：这位同学可能是受到了自身成败经验的影响。个人自身行为的 成败经验是影响自我效能感最主要的因素。一般来说，成功经验会提高自我效能感， 反复的失败会降低自我效能感。材料中，这位同学上高中以来学习成绩不是很理想， 几次考试都没有考好，导致其越来越不自信，说明是其自身的成败经验影响了自我效 能感。(2)如果我是许老师，我会采取以下措施帮助这位学生：第一，设置难度适当的题目，帮助该同学获得成功的经验。第二，为其提供正面的替代性经验。他人的替代经验也会影响自我效能，当个体 看到与自己的能力水平相当的人在活动中取得成功时，便相信当自己处于类似活动情 境时，也能获得同样的成功，从而提高自我效能感。反之亦然。第三，进行积极的言语劝说。通过说理让学生相信自己具有能力，相信自己能够 胜任学习活动，完成学习任务，就会给学生增添学习活动的动力，增强克服困难的 毅力。第四，调整负面情绪，进行正面情绪的唤醒。当人们不被讨厌刺激所困扰时更能 期望成功。例如，紧张焦虑、精力不佳，容易降低人们对自我效能的判断。第五，引导学生进行恰当的归因。该学生总是将自己的失败归因于自身不行，这 是进行了能力归因，长此以往会产生习得性无助。作为老师，我会引导学生进行努力 归因，引导其意识到只要努力就能取得成功。总之，我会根据该学生的特征，有针对性地采取相应的教育措施，促使其自我效 能感的提高。","keywords":["自我效能感理论","学习动机-成就动机理论","学习动机-归因理论","学习动机-自我效能感","学习动机-期待理论","学习迁移-形式训练说","学习策略-资源管理策略","建构主义-学习观","知识学习-知识直观"],"materialType":["学生心理案例"],"coreConcepts":["自我效能感理论"]},{"type":"材料分析","exam":"2022下","stem":"请用动机归因理论分析案例中晓奇出现的问题及其原因。 张老师应该向家长提出哪些教育建议?四、材料分析题","answer":"(1)晓奇在学习上出现了习得性无助。一个人总是失败并把失败归于内部的、稳 定的和不可控的因素(能力低),就会形成一种习得性无助的自我感觉。习得性无助 是当个体感到无论做什么事情都不会对自己的重要生活事件产生影响时所体验到的一 种抑郁状态。材料中，晓奇经历了数学考试失败的体验后，对自己的学习能力产生了怀疑。与 此同时，其擅长的英语学科考试成绩也不理想，使得他更加怀疑自己的学习能力，认 为自己不是学习的材料。这属于习得性无助的表现。因此，晓奇是因为错误的归因， 导致了其在学习上产生了习得性无助。(2)张老师可向晓奇的家长提供以下教育建议：①了解和满足学生的需要，促使学习动机的产生。晓奇的家长可以了解一下晓奇 在其他领域的需要，促使其产生学习动机。②重视立志教育，对学生进行成就动机训练。晓奇的家长可以引导晓奇树立自己 的志向，迎接有挑战的任务，以证明其能力，也就是对其进行成就动机的训练。③帮助学生确立正确的自我概念，获得自我效能感。晓奇的家长可以帮助晓奇对自己形成正确认识，增强其自我效能感。④培养学生努力导致成功的归因观。晓奇的家长在引导晓奇对数学和英语成绩不 理想进行归因时，应当让其将失败归因于努力程度而不是能力，从而促使晓奇继续努 力学习。","keywords":["自我效能感理论","归因理论","成就动机理论","学习动机-成就动机理论","学习动机-需要层次理论","学习动机-归因理论","学习动机-自我效能感","学习迁移-形式训练说","学习策略-资源管理策略","认知主义-布鲁纳认知结构"],"materialType":["学生心理案例","学生行为案例","班级管理案例","家校案例"],"coreConcepts":["自我效能感理论","归因理论","成就动机理论"]}]},{"id":"4.3","module":4,"moduleName":"中学生学习心理","content":"思维的种类和创造性思维的特征；皮亚杰认知发展阶段论；影响问题解决的因素","level":"了解/理解","keywords":["思维","创造性思维","皮亚杰","认知发展","问题解决"],"appearances":{ (2)变通性。变通性即灵活性，指个人面对问题情境时，不墨守成规，不钻牛角尖，能随机应 变、触类旁通。(3)独创性。独创性指个人面对问题情境时，能独具匠心，想出不同寻常的、超越自己也超越 前辈的意见，具有新奇性。","keywords":["流畅性","变通性","独创性"],"mnemonic":"","points":["流畅性。流畅性指个人面对问题情境时，在规定的时间内产生不同观念的数量的多少。","变通性。变通性即灵活性，指个人面对问题情境时，不墨守成规，不钻牛角尖，能随机应 变、触类旁通。","独创性。独创性指个人面对问题情境时，能独具匠心，想出不同寻常的、超越自己也超越 前辈的意见，具有新奇性。"]},{"type":"简答","exam":"2025下","stem":"进人中学后，学生开始喜欢与他人辩论，并能运用形式运算来解决诸如组合、 包含、概率等问题，这些表现均与其思维的发展变化密切相关。请简述中学生思维发 展的主要特征。","answer":"(1)抽象逻辑思维占主导地位，并由“经验型”向“理论型”转化。理论型逻辑 思维发展的转折期是在14～15岁。(2)形式逻辑思维占优势，辩证逻辑思维迅速发展。(3)思维的独立性和批判性日益增强。","keywords":["抽象逻辑思维占主导地位","形式逻辑思维占优势","思维的独立性和批判性日益增强"],"mnemonic":"","points":["抽象逻辑思维占主导地位，并由“经验型”向“理论型”转化。理论型逻辑 思维发展的转折期是在14～15岁。","形式逻辑思维占优势，辩证逻辑思维迅速发展。","思维的独立性和批判性日益增强。"]},{"type":"辨析","exam":"2019下","stem":"问题解决不受情绪影响。","answer":"表述错误。 影响问题解决的主要因素包括：问题情境、心理定势与功能固着、酝酿效应、已 有知识经验— 迁移、原型启发、情绪与动机。其中，情绪对问题解决有一定的影响， 肯定、积极的情绪状态有利于问题的解决，而否定、消极的情绪状态则会阻碍问题的 解决。因此，问题解决受情绪的影响。 故表述错误。","keywords":["问题解决","情绪","问题解决","情绪"],"trapType":"绝对化表述型","judgment":"错误"},{"type":"辨析","exam":"2020下","stem":"思维定势对问题解决的影响可能是积极的，也可能是消极的。 故正9 白 m","answer":"表述正确。 思维定势是指重复先前的操作所引起的一种心理准备状态。在环境不变的条件下， 思维定势使人们能够应用已掌握的方法迅速解决问题。而在情境发生变化时，它会妨 碍人们采用新的方法。因此，思维定势对问题解决的影响可能是积极的，也可能是消 极的。 故表述正确。","keywords":["思维定势","问题解决","思维定势","问题解决"],"trapType":"条件忽略型","judgment":"正确"},{"type":"辨析","exam":"2023下","stem":"定势对知识迁移起促进作用。","answer":"表述错误。 定势，即先于一定的活动而又指向该活动的一种动力准备状态。定势对迁移的影 响从性质上来讲可以有两种情况，一是促进作用，二是阻碍作用。当后面的作业是前 面作业的同类课题时，定势就更容易实现，对后面课题的学习起促进作用。当要完成 的作业与以前的作业不是同类或者是需要灵活变通的相似作业时，定势就可能干扰后 面作业的完成，使学生不能灵活地思考和创造性地解决问题，并使尝试的解法固定化， 对迁移起阻碍作用。因此，定势对知识迁移可能起促进作用，也可能起阻碍作用。 故表述错误。","keywords":["定势","功能固着","创造性","定势","功能固着","创造性"],"trapType":"关系误判型","judgment":"错误"}]},{"id":"4.6","module":4,"moduleName":"中学生学习心理","content":"学习策略的分类；认知策略、元认知策略和资源管理策略","level":"了解/掌握","keywords":["学习策略","认知策略","元认知策略","资源管理策略"],"appearances":{"简答":["2019下","2023下","2026上"],"辨析":[],"材料分析":["2019下","2025下"]},"totalAppearances":5,"typeCount":2,"predictions":{"typeProbabilities":{"简答":0.404,"辨析":0.263,"材料分析":0.333},"mostLikelyType":"简答","confidence":40,"threatLevel":"极高","typeCount":2,"modelScores":{"historical":{"简答":0.6,"辨析":0,"材料分析":0.4},"content":{"简答":0.375,"辨析":0.25,"材料分析":0.375},"syllabus":{"简答":0.35,"辨析":0.3,"材料分析":0.35},"moduleCooccur":{"简答":0.35294117647058826,"辨析":0.38235294117647056,"材料分析":0.2647058823529412},"gapRegression":{"简答":0.11538461538461539,"辨析":0.35,"材料分析":0.12692307692307692}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2019下","stem":"简述元认知策略的种类。","answer":"元认知策略是学生对自己认知过程的认知策略，即对信息加工过程进行调控的策 略，包括对自己认知过程的了解和控制策略，有助于学生有效地安排和调节学习过程。 其包括计划策略、监控策略、调节策略。(1)计划策略是根据认知活动的目标，在进行一项认知活动之前，进一步明确认知目标、确定认知过程和环节、预计认知结果、选择认知策略并评估其有效性。元认 知计划策略包括设置学习目标、浏览学习材料、产生待回答的问题、分析完成任务的 方法等。(2)监控策略是一种常用的元认知策略，是指在认知活动中，根据认知目标不断 反省和监控自己的认知活动是否在沿着正确的方向进行，正确估计自己达到认知目标 的程度、水平，并根据有效性标准评价各种认知行动、策略的效果。监控策略包括阅 读时对注意加以跟踪、对材料进行自我提问，考试时监控自己的速度和时间等。(3)调节策略是指根据对认知活动结果的检查，如发现问题、遇到困难或偏离目标 时，采取相应的补救措施，根据对认知策略的效果的检查，及时修正、调整认知策略。","keywords":["计划策略","监控策略","调节策略"],"mnemonic":"計監調 — 计划策略、监控策略、调节策略","points":["计划策略是根据认知活动的目标，在进行一项认知活动之前，进一步明确认知目标、确定认知过程和环节、预计认知结果、选择认知策略并评估其有效性。元认 知计划策略包括设置学习目标、浏览学习材料、产生待回答的问题、分析完成任务的 方法等。","监控策略是一种常用的元认知策略，是指在认知活动中，根据认知目标不断 反省和监控自己的认知活动是否在沿着正确的方向进行，正确估计自己达到认知目标 的程度、水平，并根据有效性标准评价各种认知行动、策略的效果。监控策略包括阅 读时对注意加以跟踪、对材料进行自我提问，考试时监控自己的速度和时间等。","调节策略是指根据对认知活动结果的检查，如发现问题、遇到困难或偏离目标 时，采取相应的补救措施，根据对认知策略的效果的检查，及时修正、调整认知策略。"]},{"type":"简答","exam":"2023下","stem":"简述学习策略中资源管理策略的主要构成。三、简答题2","answer":"(1)时间管理策略：统筹安排学习时间；高效利用最佳时间；灵活利用零碎时间。(2)环境管理策略：一方面，要注意调节自然条件，如流通的空气、适宜的温度、明亮的光线及和谐 的色彩等；另一方面，要设计好学习的空间，如空间范围、室内布置、用具摆放等 因素。(3)努力管理策略：激发内在动机；树立为了掌握而学习的信念；选择有挑战性的任务；调节成败的 标准；正确认识成败的原因；自我奖励。(4)资源利用策略：①学习工具的利用，如善于利用参考资料、电脑与网络、工具书、图书馆、广播电视等工具学习；②社会性人力资源的利用，如善于利用老师的帮助以及通过同学间 的合作与讨论来加深对内容的理解。","keywords":["时间管理策略","环境管理策略","努力管理策略","资源利用策略"],"mnemonic":"","points":["时间管理策略：统筹安排学习时间；高效利用最佳时间；灵活利用零碎时间。","环境管理策略：一方面，要注意调节自然条件，如流通的空气、适宜的温度、明亮的光线及和谐 的色彩等；另一方面，要设计好学习的空间，如空间范围、室内布置、用具摆放等 因素。","努力管理策略：激发内在动机；树立为了掌握而学习的信念；选择有挑战性的任务；调节成败的 标准；正确认识成败的原因；自我奖励。","资源利用策略：①学习工具的利用，如善于利用参考资料、电脑与网络、工具书、图书馆、广播电视等工具学习；②社会性人力资源的利用，如善于利用老师的帮助以及通过同学间 的合作与讨论来加深对内容的理解。"]},{"type":"简答","exam":"2026上","stem":"张林在阅读时遇到读不懂的内容便会慢慢再读一遍，或者退回到更前面的内 容重新阅读，这种学习策略被称为元认知策略。简述元认知策略的内涵及分类。","answer":"元认知策略是指对认知的认知策略，也就是说，个体知道自己在想什么、干什么、 干得怎么样及其情感体验。元认知策略包括计划策略、监控策略、调节策略。(1)计划策略是根据认知活动的目标，在进行一项认知活动之前，进一步明确认 知目标、确定认知过程和环节、预计认知结果、选择认知策略并评估其有效性。(2)监控策略是指在认知活动中，根据认知目标不断反省和监控自己的认知活动 是否在沿着正确的方向进行，正确估计自己达到认知目标的程度水平，并根据有效性 标准评价各种认知行动、策略的效果。(3)调节策略是指根据对认知活动结果的检查，如发现问题、遇到困难或偏离目 标时，采取相应的补救措施，根据对认知策略的效果的检查，及时修正、调整认知策略。","keywords":["计划策略","监控策略","调节策略"],"mnemonic":"","points":["计划策略是根据认知活动的目标，在进行一项认知活动之前，进一步明确认 知目标、确定认知过程和环节、预计认知结果、选择认知策略并评估其有效性。","监控策略是指在认知活动中，根据认知目标不断反省和监控自己的认知活动 是否在沿着正确的方向进行，正确估计自己达到认知目标的程度水平，并根据有效性 标准评价各种认知行动、策略的效果。","调节策略是指根据对认知活动结果的检查，如发现问题、遇到困难或偏离目 标时，采取相应的补救措施，根据对认知策略的效果的检查，及时修正、调整认知策略。"]},{"type":"材料分析","exam":"2019下","stem":"简述学生应该如何有效进行复习。 请指出晓宁复习中存在的主要问题。四、材料分析题","answer":"(1)①及时复习，经常复习。②合理分配时间。③分散复习与集中复习相结合。④反复阅读与试图回忆相结合。⑤复习方法要多样化。⑥运用多种感官参与复习。⑦复习内容的数量要适当，一次复习内容的数量不宜过多。⑧适当过度学习，过度学习50%效果最好。(2)晓宁在复习中主要存在以下问题：首先，晓宁没有做到合理分配时间。材料中，晓宁只要有时间就去背外语单词、 背课文、背语法等，连课间休息的时间也不放过，从傍晚背到深夜，早晨四五点钟就 又起床接着背，以致到了头昏脑胀的地步，说明他时间分配不合理。其次，晓宁没有做到及时复习，经常复习。材料中，晓宁平时没有复习的习惯， 还有一周就要考试了，他开始着急起来，利用所有时间冲刺复习，说明他平时没有做 到及时复习，经常复习。再次，晓宁没有做到复习方法多样化。材料中，晓宁觉得只要自己努力，反复背 诵就一定能取得好成绩，所以，只要有时间他就去背诵。他只是单一背诵，没有考虑 用其他的复习方法，复习过程中没有意识到运用分散复习与集中复习相结合、反复阅 读与试图回忆相结合、运用多种感官参与复习等多种方法来有效提高复习效果。最后，晓宁复习过程中动机太强。动机强度与工作效率之间的关系并不是一种线 性关系，而是倒U形曲线关系。中等强度的动机最有利于任务的完成，即动机强度 处于中等水平时，工作效率最高。材料中，晓宁觉得自己从来没有哪次考试像这次考 试一样下这么大的功夫，自以为一定能考出好成绩，这些都表明晓宁这次考试动机太 强，但过强的动机反而不利于考试任务的完成。综上所述，晓宁在复习过程中，复习时间的安排、复习方法的选择以及学习动机 的强度上都存在问题。教师在以后的教学过程中，应当注意引导学生。","keywords":["⑤复习方法","晓宁没有做到复习方法","用其他的复习方法","读与试图回忆相结合、运用多种感官参与复习等多种方法","复习时间的安排、复习方法","耶克斯-多德森定律","复习策略","学习动机-耶克斯多德森定律","学习动机-归因理论","学习迁移-关系转换说","学习策略-资源管理策略","学习策略-复习方法","认知过程-注意品质"],"materialType":["学生心理案例"],"coreConcepts":["耶克斯-多德森定律","复习策略"]},{"type":"材料分析","exam":"2025下","stem":"注意有哪些品质?分析案例中李力的注意品质存在的主要问题。 作为教师，请对李力的注意品质提出建议。","answer":"(1)注意的品质包括：注意的范围、注意的稳定性、注意的分配、注意的转移等。材料中，李力同学的注意品质存在注意稳定性差、注意难以转移的问题。①注意的稳定性指的是注意集中在一定对象或活动上的持续时间。注意稳定的相 反状态是注意的分散(分心),即注意离开了当前应当完成的任务而被无关的事物所 吸引。材料中，李力同学专心听课的时间比较短，上课东张西望、坐立不安，这是注 意稳定性差、容易分散的体现。②注意的转移指主体根据新的任务，主动地把注意从一个对象转移到另一个对象 或由一种活动转移到另一种活动的现象。材料中，李力同学刚参与过文体活动，回到 教室后就很难安静下来，不能集中注意力听课，这是注意难以从一个活动转移到另一 个活动的体现。(2)作为教师，针对李力同学注意品质的问题，可以从以下方面帮助他：①增强李力同学注意的稳定性，防止注意的分散。教师要注重学生良好学习习惯 的形成和意志力的锻炼，克服内部干扰。同时，加强学生学习目的性教育，端正其学 习态度，组织内容丰富、形式多样的教学活动，吸引学生的注意力。②提高李力同学注意转移的能力。提高学生自我行为的监控能力，使学生能够积 极、主动地服从教学安排，及时转移注意的对象。③提高李力同学注意的广度。让学生了解当前活动的性质和要求，适当安排教学 任务，扩大学生的注意范围。④加强李力同学注意分配的训练。训练学生一边听课， 一边做笔记的能力。对 学生进行听讲、书写、表达等基本学习能力训练，让学生在课堂上可以做到“一心 二用”。","keywords":["注意的品质","学习动机-归因理论","学习迁移-形式训练说","学习策略-认知策略","学习策略-元认知策略","学习策略-资源管理策略","学习策略-复习方法","行为主义-社会学习理论","认知主义-布鲁纳认知结构","建构主义-学习观","认知过程-注意品质"],"materialType":["学生心理案例"],"coreConcepts":["注意的品质"]}]},{"id":"5.3","module":5,"moduleName":"中学生发展心理","content":"中学生的情绪特点（情绪表现的两极性、情绪的种类等）","level":"掌握","keywords":["情绪特点","两极性","中学生情绪"],"appearances":{"简答":["2022下","2024下"],"辨析":["2021上","2025上","2026上"],"材料分析":[]},"totalAppearances":5,"typeCount":2,"predictions":{"typeProbabilities":{"简答":0.429,"辨析":0.419,"材料分析":0.152},"mostLikelyType":"简答","confidence":43,"threatLevel":"极高","typeCount":2,"modelScores":{"historical":{"简答":0.4,"辨析":0.6,"材料分析":0},"content":{"简答":0.5,"辨析":0.5,"材料分析":0},"syllabus":{"简答":0.5,"辨析":0.25,"材料分析":0.25},"moduleCooccur":{"简答":0.4117647058823529,"辨析":0.4117647058823529,"材料分析":0.17647058823529413},"gapRegression":{"简答":0.22692307692307692,"辨析":0.11538461538461539,"材料分析":0.35}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2022下","stem":"简述中学生情绪情感的特点。","answer":"中学生的情绪特点有：(1)情绪体验的迅速、强烈性。(2)不稳定性(波动性)和两极性交替。(3)情绪的外露性和内隐性(掩饰性)并存。(4)体验的时间延长，出现心境化的特点。中学生的情感特点有：(1)自我意识增强，自尊的需要迫切。(2)情感有文饰、内隐和曲折性。(3)情感容易受挫，忍受能力差。","keywords":["情绪体验的迅速、强烈性","不稳定性","情绪的外露性和内隐性","体验的时间延长","自我意识增强","情感有文饰、内隐和曲折性","情感容易受挫"],"mnemonic":"强波隐长+自文挫 — 强烈性、波动性、内隐性、心境化","points":["情绪体验的迅速、强烈性。","不稳定性(波动性)和两极性交替。","情绪的外露性和内隐性(掩饰性)并存。","体验的时间延长，出现心境化的特点。中学生的情感特点有：","自我意识增强，自尊的需要迫切。","情感有文饰、内隐和曲折性。","情感容易受挫，忍受能力差。"]},{"type":"简答","exam":"2024下","stem":"康老师是一名资深的中学教师。她与新教师进行教学研讨时，提醒新教师要 依据中学生情绪的矛盾性开展针对性教学。请简述中学生情绪矛盾性的主要表现。","answer":"中学生情绪的矛盾性具有以下三方面表现：(1)强烈、狂暴性与温和、细腻性共存。(2)情绪的可变性与固执性共存。(3)情绪的内向性与表现性共存。","keywords":["强烈、狂暴性与温和、细腻性共存","情绪的可变性与固执性共存","情绪的内向性与表现性共存"],"mnemonic":"","points":["强烈、狂暴性与温和、细腻性共存。","情绪的可变性与固执性共存。","情绪的内向性与表现性共存。"]},{"type":"简答","exam":"2024下","stem":"进入中学后，学生的交往方式与小学阶段相比，发生了很大变化，越来越重 视同伴关系。请简述中学生同伴关系的特点。 三、简答题","answer":"中学生同伴关系的特点有：(1)逐渐改变了团伙式的交往方式。(2)朋友关系日益重要，择友标准高。(3)出现了异性友谊。","keywords":["逐渐改变了团伙式的交往方式","朋友关系日益重要","出现了异性友谊"],"mnemonic":"","points":["逐渐改变了团伙式的交往方式。","朋友关系日益重要，择友标准高。","出现了异性友谊。"]},{"type":"辨析","exam":"2021上","stem":"气质由遗传决定。 y 夕 得双性","answer":"表述正确。 气质是心理活动表现在强度、速度、稳定性和灵活性等方面的心理特征。它是人 心理活动的动力特征的表现，依赖于人的生理素质或身体特点，通常称为秉性、脾气、 性情，心理学上叫气质。所以，气质主要是由遗传决定的。 故表述正确。","keywords":["气质","遗传","气质","遗传"],"trapType":"绝对化表述型","judgment":"正确"},{"type":"辨析","exam":"2025上","stem":"某次心理健康课上，杨老师首先引导学生通过心理测评了解自己的气质类型， 然后给学生详细介绍了胆汁质、多血质、黏液质和抑郁质各自的特点，并否定了学生 对于各种气质孰优孰劣的争论。因为他认为，四种气质类型各有优缺点，无好坏之分。 请对杨老师的观点进行辨析。","answer":"杨老师的观点正确。 气质是心理活动表现在强度、速度、稳定性和灵活性等方面的心理特征。它是人 心理活动的动力特征的表现，依赖于人的生理素质或身体特点，来自先天遗传，通常 称为秉性、脾气、性情，心理学上叫气质。气质类型有胆汁质、多血质、黏液质和抑 郁质四种。每一种气质类型都有其积极的一面，也都有其消极的一面，所以没有办法 比较其好坏，因此气质无好坏之分。 故杨老师的观点正确。","keywords":["气质类型","优劣","无好坏","气质类型","优劣","无好坏"],"trapType":"绝对化表述型","judgment":"正确"},{"type":"辨析","exam":"2026上","stem":"以“我看到了什么”为题写作，小学生更多地描述客观世界景象，而初中生 在描述客观世界的同时，突出了个人的喜好、烦恼和憧憬。孙老师认为初中生的写作 特点是青春期自我意识高涨的表现。请对孙老师的观点做出辨析。","answer":"孙老师的观点正确。 中学生自我意识的发展处于心理自我阶段。心理自我是指个体对自己的记忆、思 维、情绪、能力、气质、性格等的认识。心理自我是从青春期开始发展和形成的。这 时，青少年开始形成自觉地按照一定的行动目标和社会准则来评价自己的心理品质和 能力。青春期是自我意识发展的第二个飞跃期。因此，初中生的写作中，除了描述客 观世界，还有个人的憧憬和感慨，这正是初中生发展心理自我，自我意识高涨的表现。 故孙老师的观点正确。","keywords":["自我意识","青春期","初中生","自我意识","青春期","初中生"],"trapType":"条件忽略型","judgment":"正确"}]},{"id":"8.8","module":8,"moduleName":"中学班级管理与教师心理","content":"教师成长心理；促进教师心理健康的理论与方法","level":"理解/掌握","keywords":["教师成长","教师心理健康"],"appearances":{"简答":["2020下","2021下"],"辨析":["2023下"],"材料分析":["2021上"]},"totalAppearances":4,"typeCount":3,"predictions":{"typeProbabilities":{"简答":0.445,"辨析":0.299,"材料分析":0.256},"mostLikelyType":"简答","confidence":45,"threatLevel":"极高","typeCount":3,"modelScores":{"historical":{"简答":0.5,"辨析":0.25,"材料分析":0.25},"content":{"简答":0.375,"辨析":0.375,"材料分析":0.25},"syllabus":{"简答":0.25,"辨析":0.5,"材料分析":0.25},"moduleCooccur":{"简答":0.6666666666666666,"辨析":0.25,"材料分析":0.08333333333333333},"gapRegression":{"简答":0.5269230769230769,"辨析":0.28846153846153844,"材料分析":0.5384615384615384}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2020下","stem":"教师职业倦怠的主要特征有哪些?三、简答题","answer":"职业倦怠是指个体在长期的职业压力下缺乏应对资源和应对能力而产生的身心耗竭状态。职业倦怠主要表现在以下三方面：(1)情绪耗竭，主要表现在生理耗竭和心理耗竭两方面，如极度的慢性疲劳、力 不从心、丧失工作热情、情绪波动大等。(2)去人性化，即刻意在自身和工作对象间保持距离，对工作对象和环境采取冷 漠和忽视的态度。教师以一种消极的、否定的态度和情感对待学生。(3)个人成就感低，表现为消极地评价自己，贬低自己工作的意义和价值。DD 才 业 八 析 题","keywords":["情绪耗竭","去人性化","个人成就感低"],"mnemonic":"","points":["情绪耗竭，主要表现在生理耗竭和心理耗竭两方面，如极度的慢性疲劳、力 不从心、丧失工作热情、情绪波动大等。","去人性化，即刻意在自身和工作对象间保持距离，对工作对象和环境采取冷 漠和忽视的态度。教师以一种消极的、否定的态度和情感对待学生。","个人成就感低，表现为消极地评价自己，贬低自己工作的意义和价值。DD 才 业 八 析 题"]},{"type":"简答","exam":"2021下","stem":"简述福勒的教师成长三阶段论。三、简答题","answer":"(1)关注生存阶段。处于这一阶段的一般是新教师，他们非常关注自己的生存适 应性，会更多地关注人际关系。(2)关注情境阶段。当教师感到自己完全能够适应时，便把关注的焦点投向了提 高学生的成绩，即进入了关注情境阶段。(3)关注学生阶段。这一阶段，教师将更多地考虑学生的个别差异，认识到不同 发展水平的学生有不同的需要，某些教学材料和方式不一定适合所有学生。自觉关注 学生是衡量一个教师成长成熟的重要标志之一。","keywords":["关注生存阶段","关注情境阶段","关注学生阶段"],"mnemonic":"","points":["关注生存阶段。处于这一阶段的一般是新教师，他们非常关注自己的生存适 应性，会更多地关注人际关系。","关注情境阶段。当教师感到自己完全能够适应时，便把关注的焦点投向了提 高学生的成绩，即进入了关注情境阶段。","关注学生阶段。这一阶段，教师将更多地考虑学生的个别差异，认识到不同 发展水平的学生有不同的需要，某些教学材料和方式不一定适合所有学生。自觉关注 学生是衡量一个教师成长成熟的重要标志之一。"]},{"type":"辨析","exam":"2023下","stem":"教师的职业倦怠即教师的工作热情丧失。","answer":"表述错误。 职业倦怠是指个体在长期的职业压力下，缺乏应对资源和应对能力而产生的身心 耗竭状态。职业倦怠所产生的生理、情绪、认知和行为等方面的问题，会导致教师产 生严重的身心疾病。玛勒斯等人认为职业倦怠主要表现在以下三方面：①情绪耗竭， 主要表现在生理耗竭和心理耗竭两方面，如极度的慢性疲劳、力不从心、丧失工作热 情、情绪波动大等。②去人性化，即刻意在自身和工作对象间保持距离，对工作对 象和环境采取冷漠和忽视的态度。教师以一种消极的、否定的态度和情感对待学生。 ③个人成就感低，表现为消极地评价自己，贬低自己工作的意义和价值。因此，教师 的职业倦怠不仅是教师的工作热情丧失。 故表述错误。","keywords":["教师职业倦怠","工作热情","教师职业倦怠","工作热情"],"trapType":"以偏概全型","judgment":"错误"},{"type":"材料分析","exam":"2021上","stem":"结合案例阐述教师期望的作用，及其对教育的启示。(8分)四、材料分析题","answer":"该案例中的老师正确运用了教师的期望效应。教师的期望效应指的是教师的期望或明或暗地被传送给学生，学生会按照教师所 期望的方向来塑造自己的行为习惯。材料中，李老师希望上官文俐同学和她姐姐一样 努力学习、成绩优秀、讲礼貌。后来，上官文俐在两个月后的创新竞赛中取得了好成 绩，李老师说她不但爱学习，还很有创新意识，结果她努力学习，团结同学，积极为 班级服务，努力使自己成为李老师所期望的像她姐姐一样优秀的学生。这正体现了教 师期望的作用。该案例给予我们以下教育启示：①作为教师，我们应给予班级内的每一位学生更多的鼓励与期望，有意识或无意 识地寄予学生期望，多给他们一些积极的期待，让他们增强自信心，对自己的人生前 途充满信心。②作为教师，我们应该用发展的眼光看待每一位学生，尤其是后进生。我们应该 努力发现每一位学生身上的闪光点。③作为教师，在与学生交往的过程中，我们应该对学生多关心、多热爱、多表扬、 多肯定、多赞美、多奖励、多帮助。④作为教师，进行教育时应该遵循“教育要面向全体学生”的原则。我们要做到教育不要仅限于少数学生，而是要面向全体学生。⑤作为教师，我们应该带领学生向好的方向发展，防止用消极的期望引导学生向 坏的方向发展。⑥作为教师，我们应对学生因材施教，针对学生之间的个别差异，有的放矢地进 行教育。","keywords":["该案例中的老师正确运用了教师的期望效应","教师的期望效应","进行教育时应该遵循“教育要面向全体学生”的原则","因材施教原则","教师期望效应","班级管理-班集体建设","班级管理-课堂管理","班主任-工作内容","教师心理-教师期望效应","教师心理-教师成长阶段"],"materialType":["学生心理案例","学生行为案例","班级管理案例"],"coreConcepts":["因材施教原则","教师期望效应"]}]},{"id":"5.1","module":5,"moduleName":"中学生发展心理","content":"中学生认知发展的理论、特点与规律","level":"掌握","keywords":["认知发展","中学生认知"],"appearances":{"简答":["2022上","2025上"],"辨析":["2022上","2024下"],"材料分析":[]},"totalAppearances":4,"typeCount":2,"predictions":{"typeProbabilities":{"简答":0.404,"辨析":0.41,"材料分析":0.185},"mostLikelyType":"辨析","confidence":41,"threatLevel":"极高","typeCount":2,"modelScores":{"historical":{"简答":0.5,"辨析":0.5,"材料分析":0},"content":{"简答":0.3333333333333333,"辨析":0.49999999999999994,"材料分析":0.16666666666666666},"syllabus":{"简答":0.5,"辨析":0.25,"材料分析":0.25},"moduleCooccur":{"简答":0.4117647058823529,"辨析":0.4117647058823529,"材料分析":0.17647058823529413},"gapRegression":{"简答":0.17692307692307693,"辨析":0.22692307692307692,"材料分析":0.35}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2022上","stem":"简述皮亚杰认知发展阶段论。","answer":"皮亚杰的认知发展阶段理论包括：(1)感知运动阶段(0～2岁)。该阶段的主要特征包括：形成了低级的行为图 式；获得了客体永恒性。(2)前运算阶段(2～7岁)。该阶段的主要特征包括：“万物有灵论”;一切以 自我为中心；思维具有不可逆性、刻板性；没有守恒概念；集中化思维。(3)具体运算阶段(7～11岁)。该阶段的主要特征包括：去自我中心性(去中 心化);可逆性；能够进行简单的抽象思维，但需要具体事物的支持；守恒。(4)形式运算阶段(11～16岁)。该阶段的主要特征包括：命题推理；假设一演 绎推理；类比推理；思维具有灵活性。","keywords":["感知运动阶段","前运算阶段","具体运算阶段","形式运算阶段"],"mnemonic":"感前具形 — 感知运动(0-2)、前运算(2-7)、具体运算(7-11)、形式运算(11-16)","points":["感知运动阶段(0～2岁)。该阶段的主要特征包括：形成了低级的行为图 式；获得了客体永恒性。","前运算阶段(2～7岁)。该阶段的主要特征包括：“万物有灵论”;一切以 自我为中心；思维具有不可逆性、刻板性；没有守恒概念；集中化思维。","具体运算阶段(7～11岁)。该阶段的主要特征包括：去自我中心性(去中 心化);可逆性；能够进行简单的抽象思维，但需要具体事物的支持；守恒。","形式运算阶段(11～16岁)。该阶段的主要特征包括：命题推理；假设一演 绎推理；类比推理；思维具有灵活性。"]},{"type":"简答","exam":"2025上","stem":"孙老师在教学过程中发现，初中生与小学生相比，对自己的认知更加稳定， 对自己的评价更加客观，自尊的行为表现更加明显。通过查阅资料，孙老师了解到这 些差异是由自我概念不同而导致的。请简述青少年自我概念的特点。","answer":"青少年自我概念的发展表现出如下特点：(1)自我概念日益抽象化和理想化，并能区分真实自我和理想自我。(2)自我概念在结构上更加分化，出现了多领域的自我描述的区别，倾向于把一 些特质同特定情境相联系而非泛泛使用这些特质。(3)自我概念的组织性和整合性增强，能够把自我的不同方面整合成一个富有逻 辑性和连贯性的整体。(4)自我概念的发展存在起伏变化，有升有降，其中初中阶段是关键期。(5)自我概念的发展存在性别差异，一般而言，女生的语文自我概念高于男生，V25男生的数学自我概念高于女生。(6)自我概念和学业成绩密切相关。","keywords":["自我概念日益抽象化和理想化","自我概念在结构上更加分化","自我概念的组织性和整合性增强","自我概念的发展存在起伏变化","自我概念的发展存在性别差异","自我概念和学业成绩密切相关"],"mnemonic":"","points":["自我概念日益抽象化和理想化，并能区分真实自我和理想自我。","自我概念在结构上更加分化，出现了多领域的自我描述的区别，倾向于把一 些特质同特定情境相联系而非泛泛使用这些特质。","自我概念的组织性和整合性增强，能够把自我的不同方面整合成一个富有逻 辑性和连贯性的整体。","自我概念的发展存在起伏变化，有升有降，其中初中阶段是关键期。","自我概念的发展存在性别差异，一般而言，女生的语文自我概念高于男生，V25男生的数学自我概念高于女生。","自我概念和学业成绩密切相关。"]},{"type":"辨析","exam":"2022上","stem":"情绪和认知是互不影响的心理过程。 H 队 止 7 1","answer":"表述错误。 心理过程包括认知过程、情绪情感过程和意志过程。其中，认知过程和情绪过程 是紧密联系的，具体表现为：①认知是产生情绪的前提和基础。客观事物只有被人们 认识了的时候才有可能引起人的情绪。②情绪对认知有动力作用。情感依赖于认知， 但也反作用于人的认知，它既可以推动也可以阻碍认知的发展。因此，情绪和认知不 是互不影响的心理过程。 故表述错误。","keywords":["最近发展区","教学与发展","最近发展区","教学与发展"],"trapType":"条件忽略型","judgment":"错误"},{"type":"辨析","exam":"2024下","stem":"王老师是一名刚人职的中学教师，他几乎将自己的所有时间都用在学生指导 上，因为他认为，教师的唯一角色就是学生学习的指导者。请对王老师的观点进行 辨析。","answer":"王老师的观点错误。 新课程改革背景下的教师观倡导的教师角色具有多样性：从教师与学生的关系看， 教师应该是学生学习的引导者和发展的促进者；从教学与研究的关系看，教师应该是 教育教学的研究者；从教学与课程的关系看，教师应该是课程的建设者和开发者；从 学校与社区的关系看，教师应该是社区型的开放教师。因此，教师的角色不仅仅是学 生学习的引导者。 故王老师的观点错误。","keywords":["自我同一性","角色混乱","自我同一性","角色混乱"],"trapType":"概念混淆型","judgment":"错误"}]},{"id":"1.4","module":1,"moduleName":"教育基础知识和基本原理","content":"教育目的理论；新中国成立后的教育方针；当前教育方针、教育目的；全面发展教育组成部分（德育、智育、体育、美育、劳动技术教育）","level":"掌握/了解","keywords":["教育目的","教育方针","全面发展教育"],"appearances":{"简答":["2019下"],"辨析":["2021上","2024上"],"材料分析":[]},"totalAppearances":3,"typeCount":2,"predictions":{"typeProbabilities":{"简答":0.378,"辨析":0.504,"材料分析":0.119},"mostLikelyType":"辨析","confidence":50,"threatLevel":"高","typeCount":2,"modelScores":{"historical":{"简答":0.3333333333333333,"辨析":0.6666666666666666,"材料分析":0},"content":{"简答":0.39999999999999997,"辨析":0.6,"材料分析":0},"syllabus":{"简答":0.35,"辨析":0.3,"材料分析":0.35},"moduleCooccur":{"简答":0.3333333333333333,"辨析":0.6666666666666666,"材料分析":0},"gapRegression":{"简答":0.5384615384615384,"辨析":0.27692307692307694,"材料分析":0.35}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2019下","stem":"简述学校美育的基本任务。","answer":"美育在全面发展教育中起着动力作用。美育的基本任务有以下几点：(1)向学生传授基本的美学知识。(2)培养学生正确的审美观点。(3)培养学生的审美能力。(4)培养学生创造美的能力。(5)培养学生内在美与外在美的统一。","keywords":["向学生传授基本的美学知识","培养学生正确的审美观点","培养学生的审美能力","培养学生创造美的能力","培养学生内在美与外在美的统一"],"mnemonic":"知审能创统一 — 美学知识、审美观点、审美能力、创造美、内外统一","points":["向学生传授基本的美学知识。","培养学生正确的审美观点。","培养学生的审美能力。","培养学生创造美的能力。","培养学生内在美与外在美的统一。"]},{"type":"辨析","exam":"2021上","stem":"教育具有自身规律，不受社会发展的制约。","answer":"表述错误。 教育具有自身的发展规律，对政治经济制度和生产力具有推动作用，但也会受到 社会发展的制约。社会发展对教育目的、内容，教育事业发展的规模、速度，学校结 构以及教学方法、手段、组织形式等都会形成制约。 故表述错误。","keywords":["教育规律","社会制约","教育规律","社会制约"],"trapType":"关系误判型","judgment":"错误"},{"type":"辨析","exam":"2024上","stem":"教育目的不等于学校的培养目标。","answer":"表述正确。 教育目的与培养目标之间是普遍与特殊的关系。教育目的是针对所有受教育者提 出的，而培养目标是针对特定的教育对象提出的，各级各类学校的教育对象有各自不 同的特点，制定培养目标需要考虑各自学校学生的特点。因此，教育目的不等于学校 的培养目标。 故表述正确。","keywords":["教育目的","培养目标","教育目的","培养目标"],"trapType":"概念混淆型","judgment":"正确"}]},{"id":"2.3","module":2,"moduleName":"中学课程","content"

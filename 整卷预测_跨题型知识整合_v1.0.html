"教材编写的直接依据是课程计划。","answer":"表述错误。 课程内容的设计包括课程计划、课程标准、教材三个层次。其中，课程计划是根 据教育目的和不同类型学校的教育任务，由国家教育主管部门制定的有关教学和教育 工作的指导性文件。课程计划是课程设置的整体规划。它对学校的教学、生产劳动、 课外活动等做出全面安排。而课程标准是课程计划的具体化，是课程计划中每门学科 以纲要的形式编定的、有关学科教学内容的指导性文件。课程标准是教材编写、教学、 评价和考试命题的依据，是编写教科书和教师进行教学的直接依据。因此，题干中认 为课程计划是教材编写的直接依据是错误的，应该是课程标准。 故表述错误。","keywords":["课程计划","课程标准","教材","课程计划","课程标准","教材"],"trapType":"概念混淆型","judgment":"错误"}]},{"id":"4.4","module":4,"moduleName":"中学生学习心理","content":"学习动机的功能；动机理论；激发与培养中学生学习动机的方法","level":"了解/理解/掌握","keywords":["学习动机","动机理论","激发动机","培养动机"],"appearances":{"简答":["2024上"],"辨析":["2021下","2025上"],"材料分析":[]},"totalAppearances":3,"typeCount":2,"predictions":{"typeProbabilities":{"简答":0.356,"辨析":0.476,"材料分析":0.168},"mostLikelyType":"辨析","confidence":48,"threatLevel":"高","typeCount":2,"modelScores":{"historical":{"简答":0.3333333333333333,"辨析":0.6666666666666666,"材料分析":0},"content":{"简答":0.5,"辨析":0.5,"材料分析":0},"syllabus":{"简答":0.25,"辨析":0.5,"材料分析":0.25},"moduleCooccur":{"简答":0.35294117647058826,"辨析":0.38235294117647056,"材料分析":0.2647058823529412},"gapRegression":{"简答":0.23846153846153847,"辨析":0.17692307692307693,"材料分析":0.35}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2024上","stem":"简述提高知识直观效果的途径。","answer":"(1)灵活选用实物直观和模象直观。(2)加强词和形象的配合。(3)运用感知规律，突出直观对象的特点。(4)培养学生的观察能力。(5)让学生充分参与直观过程。","keywords":["灵活选用实物直观和模象直观","加强词和形象的配合","运用感知规律","培养学生的观察能力","让学生充分参与直观过程"],"mnemonic":"","points":["灵活选用实物直观和模象直观。","加强词和形象的配合。","运用感知规律，突出直观对象的特点。","培养学生的观察能力。","让学生充分参与直观过程。"]},{"type":"辨析","exam":"2021下","stem":"阿特金森认为，力求成功者旨在获取成就，他们倾向于选择稳操胜券的任务。","answer":"表述错误。 阿特金森认为，成就动机由两种有相反倾向的部分组成：一种称为力求成功，另 一种称为避免失败。力求成功的人倾向于选择难度适中的任务，喜欢选择有50%把 握的、有一定风险的工作，通过完成任务提高其自尊心，获得心理上的满足。避免失 败的人倾向于选择非常容易或者非常难的任务，回避有50%把握的工作。这种选择 能防止自尊心受到伤害和产生心理烦恼。因此，力求成功者倾向选择50%难度的任 务，而非稳操胜券的任务。 故表述错误。","keywords":["学习动机","学习效率","耶克斯-多德森","学习动机","学习效率","耶克斯-多德森"],"trapType":"关系误判型","judgment":"错误"},{"type":"辨析","exam":"2025上","stem":"肖明基于前几次考试的经验总结发现，如果考试时迫切希望考满分，往往成 绩达不到预期；抱着无所谓的态度参加考试时，考试成绩也不理想；只有保持适当的 重视程度，才能取得理想的成绩。因此，他觉得对于任何考试来说，动机保持在中等 水平最好。请对肖明的观点进行辨析。","answer":"肖明的观点错误。 心理学研究表明，动机强度与工作效率之间的关系并不是一种线性关系，而是倒 U形曲线关系。中等强度的动机最有利于任务的完成，即动机强度处于中等水平时， 工作效率最高。但是，动机的最佳水平还随任务性质的不同而不同：在学习较复杂的 问题时，动机强度的最佳水平点会低些；在学习任务比较简单时，动机强度的最佳水 平点会高些。因此，随着考试难度的变化，动机强度的最佳水平点也会发生变化，并 不是对于任何考试来说，动机皆保持在中等水平最好。 故肖明的观点错误。 二 笃 笑 師","keywords":["动机强度","耶克斯-多德森","中等动机","任务难度","动机强度","耶克斯-多德森","中等动机","任务难度"],"trapType":"条件忽略型","judgment":"错误"}]},{"id":"7.6","module":7,"moduleName":"中学德育","content":"生存教育、生活教育、生命教育、安全教育、升学就业指导等的意义及基本途径","level":"了解","keywords":["生存教育","生活教育","生命教育","安全教育","升学就业指导"],"appearances":{"简答":["2024上","2025下"],"辨析":["2021下"],"材料分析":[]},"totalAppearances":3,"typeCount":2,"predictions":{"typeProbabilities":{"简答":0.36,"辨析":0.364,"材料分析":0.276},"mostLikelyType":"辨析","confidence":36,"threatLevel":"高","typeCount":2,"modelScores":{"historical":{"简答":0.6666666666666666,"辨析":0.3333333333333333,"材料分析":0},"content":{"简答":0.5,"辨析":0.25,"材料分析":0.25},"syllabus":{"简答":0.2,"辨析":0.4,"材料分析":0.4},"moduleCooccur":{"简答":0.17647058823529413,"辨析":0.35294117647058826,"材料分析":0.47058823529411764},"gapRegression":{"简答":0.12692307692307692,"辨析":0.4884615384615385,"材料分析":0.35}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2024上","stem":"简述学校德育的陶冶法及其运用的具体要求。","answer":"(1)陶冶法是指教育者有目的地创设良好的教育情境，使受教育者在道德和思想 情感方面受到潜移默化的感染、熏陶的方法。陶冶法包括人格感化、环境陶冶、艺术 陶冶等。(2)陶冶法运用的基本要求包括：①创设良好的环境；②与启发引导相结合；③引导学生参与情境的创设。","keywords":["陶冶法","陶冶法运用的基本要求包括"],"mnemonic":"","points":["陶冶法是指教育者有目的地创设良好的教育情境，使受教育者在道德和思想 情感方面受到潜移默化的感染、熏陶的方法。陶冶法包括人格感化、环境陶冶、艺术 陶冶等。","陶冶法运用的基本要求包括：①创设良好的环境；②与启发引导相结合；③引导学生参与情境的创设。"]},{"type":"简答","exam":"2025下","stem":"班主任王老师常言：“喊破嗓子，不如做出样子。”在言为士则、行为世范的 引领下，有名的“乱班”变成了学校的优秀班级。王老师的育人方法发挥了榜样示范 作用。请简述德育工作中运用榜样示范法的基本要求。","answer":"(1)选好学习的榜样。选好榜样是学习榜样的前提，用来示范的榜样主要有家长 和教师、同学、英雄人物、革命领袖、历史伟人和文艺形象。(2)激起学生对榜样的敬慕之情。要使榜样能对学生产生力量，推动他们前进， 就需要学生了解榜样。榜样人格具体、生动、形象，对学生具有巨大的感染力和说服力，易于为学生所领会和模仿。(3)引导学生用榜样来调节自身行为，提高修养。引导学生向榜样人物学习，要 及时地把学生的情感、冲动引导到行动上来，从而使学生把对榜样的敬慕之情转化为 道德行动和习惯。","keywords":["选好学习的榜样","激起学生对榜样的敬慕之情","引导学生用榜样来调节自身行为"],"mnemonic":"","points":["选好学习的榜样。选好榜样是学习榜样的前提，用来示范的榜样主要有家长 和教师、同学、英雄人物、革命领袖、历史伟人和文艺形象。","激起学生对榜样的敬慕之情。要使榜样能对学生产生力量，推动他们前进， 就需要学生了解榜样。榜样人格具体、生动、形象，对学生具有巨大的感染力和说服力，易于为学生所领会和模仿。","引导学生用榜样来调节自身行为，提高修养。引导学生向榜样人物学习，要 及时地把学生的情感、冲动引导到行动上来，从而使学生把对榜样的敬慕之情转化为 道德行动和习惯。"]},{"type":"辨析","exam":"2021下","stem":"场独立型的学生比场依存型的学生更加优秀。","answer":"表述错误。 场独立型的学生对客观事物做出判断时，常常利用内在的参照，不易受外来因素 的影响和干扰。场依存型的学生对事物做出判断时倾向于以外部参照作为信息加工的 依据，容易受周围人们特别是权威人士的影响和干扰，善于察言观色。两种认知风格 各有优缺点，没有好坏之分。因此，并非场独立型的学生比场依存型的学生更优秀。 故表述错误。 二 竹 口","keywords":["德育","智育","首位","德育","智育","首位"],"trapType":"关系误判型","judgment":"错误"}]},{"id":"5.6","module":5,"moduleName":"中学生发展心理","content":"弗洛伊德的人格发展理论；埃里克森的社会性发展阶段理论；影响人格发展的因素","level":"了解/理解","keywords":["弗洛伊德","埃里克森","人格发展","社会性发展"],"appearances":{"简答":["2026上"],"辨析":["2024上"],"材料分析":["2022上"]},"totalAppearances":3,"typeCount":3,"predictions":{"typeProbabilities":{"简答":0.277,"辨析":0.388,"材料分析":0.335},"mostLikelyType":"辨析","confidence":39,"threatLevel":"高","typeCount":3,"modelScores":{"historical":{"简答":0.3333333333333333,"辨析":0.3333333333333333,"材料分析":0.3333333333333333},"content":{"简答":0.25,"辨析":0.5,"材料分析":0.25},"syllabus":{"简答":0.25,"辨析":0.35,"材料分析":0.4},"moduleCooccur":{"简答":0.4117647058823529,"辨析":0.4117647058823529,"材料分析":0.17647058823529413},"gapRegression":{"简答":0.038461538461538464,"辨析":0.23846153846153847,"材料分析":0.43846153846153846}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2026上","stem":"科尔伯格通过“道德两难故事法”,发现学生道德判断的发展呈现阶段性特点。 简述科尔伯格的道德发展阶段论。三、简答题","answer":"科尔伯格采用“道德两难故事法”研究儿童道德判断发展的水平，将儿童道德发展水平分为三水平六阶段。(1)前习俗水平(9岁以下),包括惩罚与服从道德定向阶段、相对功利道德定向 阶段。(2)习俗水平(9～16岁),包括寻求认可定向阶段(“好孩子”定向阶段)、维 护权威或秩序的道德定向阶段。(3)后习俗水平(16岁以后),包括社会契约定向阶段、普遍原则的道德定向阶段(原则或良心定向阶段)。·.l 1 1一□","keywords":["前习俗水平","习俗水平","后习俗水平"],"mnemonic":"","points":["前习俗水平(9岁以下),包括惩罚与服从道德定向阶段、相对功利道德定向 阶段。","习俗水平(9～16岁),包括寻求认可定向阶段(“好孩子”定向阶段)、维 护权威或秩序的道德定向阶段。","后习俗水平(16岁以后),包括社会契约定向阶段、普遍原则的道德定向阶段(原则或良心定向阶段)。·.l 1 1一□"]},{"type":"辨析","exam":"2024上","stem":"人格具有可塑性。","answer":"表述正确。 人格具有可塑性。人格并不是一成不变的，它具有短时间的稳定性，但是纵观一 生，它还是可以被塑造的。人格是在主客观条件相互作用的过程中发展起来的。随着 生理的成熟和环境的变化，人格也有可能产生或多或少的变化，这是人格可塑性的 一面。 故表述正确。","keywords":["人格","可塑性","人格","可塑性"],"trapType":"绝对化表述型","judgment":"正确"},{"type":"材料分析","exam":"2022上","stem":"请用维果斯基的理论，分析王老师的教学存在什么问题。------ 结合案例，指出如何让学生“跳一跳能摘到桃子”。","answer":"(1)在教学和发展的关系上，维果斯基提出了最近发展区理论，认为儿童有两种 发展水平：一是儿童的现有水平，即由一定的已经完成的发展系统所形成的儿童心理 机能的发展水平；二是即将达到的发展水平。这两种水平之间的差异就是“最近发展 区”,也就是说，儿童在有指导的情况下，借助成人帮助所能达到的解决问题的水平 与独自解决问题所达到的水平之间的差异，实际上是两个邻近发展阶段间的过渡。材 料中，王老师刚开始讲课比较简单，调整后难度加大，先是低于学生的最近发展区， 后是高于学生的最近发展区，说明王老师对学生的知识储备情况和学业发展水平了解 不够准确，造成其教学效果不佳。(2)“跳一跳能摘到桃子”体现的是维果斯基的最近发展区思想，维果斯基在此 基础上提出了教学应当走在发展的前面，以促进学生的发展。为了实现摘到“桃子”, 教师可从以下四个方面入手：①加强备课。教师备课要做好三方面工作：钻研教材、了解学生、设计教法。材 料中，王老师在备课过程中，不仅要备教材、备知识，还要了解学生，了解学生的认 知特点和水平，并选用灵活多样的教学方法，才能达到良好的课堂效果，进一步促进 学生的发展。②注重教学过程中的启发诱导，鼓励学生参与教学。材料中，王老师在教学中可 以采用问答法、讨论法等方法来启发学生独立思考，并发扬教学民主，引导学生针 对更好地开展教学活动提出意见或建议，提高学生的参与感，真正发挥学生的主体 作用。③发挥课外作业的迁移作用，培养学生运用知识的能力。材料中，王老师在布置 课外作业时应注意分量适宜，难度适宜，且作业形式多样化，充分发挥作业的积极迁 移作用，积极引导学生将所学知识付诸实践。④发挥评价促进学生发展的积极作用。材料中，王老师可通过开展数学竞赛的形 式，激发学生学习数学的兴趣和求知欲；在对学生进行评价时鼓励学生参与评价，且 评价内容、形式、标准应多样化，让学生在数学学习中获得成就感的同时爱上数学， 爱上学习。","keywords":["维果斯基提出了最近发展区理论","实际上是两个邻近发展阶段","并选用灵活多样的教学方法","以采用问答法、讨论法等方法","维果斯基最近发展区理论","皮亚杰-认知发展阶段","维果斯基-最近发展区","埃里克森-人格发展阶段","人格-性格形成因素","身心发展-青春期心理","身心发展-个体差异"],"materialType":["学生行为案例","教学案例","家校案例"],"coreConcepts":["维果斯基最近发展区理论"]}]},{"id":"5.7","module":5,"moduleName":"中学生发展心理","content":"中学生身心发展的特点；性心理的特点；指导中学生正确处理异性交往","level":"了解/掌握","keywords":["身心发展","性心理","异性交往"],"appearances":{"简答":[],"辨析":["2022下"],"材料分析":["2023下","2024上"]},"totalAppearances":3,"typeCount":2,"predictions":{"typeProbabilities":{"简答":0.271,"辨析":0.354,"材料分析":0.375},"mostLikelyType":"材料分析","confidence":38,"threatLevel":"高","typeCount":2,"modelScores":{"historical":{"简答":0,"辨析":0.3333333333333333,"材料分析":0.6666666666666666},"content":{"简答":0.33333333333333337,"辨析":0.33333333333333337,"材料分析":0.33333333333333337},"syllabus":{"简答":0.35,"辨析":0.3,"材料分析":0.35},"moduleCooccur":{"简答":0.4117647058823529,"辨析":0.4117647058823529,"材料分析":0.17647058823529413},"gapRegression":{"简答":0.35,"辨析":0.3884615384615384,"材料分析":0.27692307692307694}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"辨析","exam":"2022下","stem":"气质无好坏之分。","answer":"表述正确。 气质是心理活动表现在强度、速度、稳定性和灵活性等方面的心理特征。气质类 型有胆汁质、多血质、黏液质和抑郁质四种。每种气质类型都有其优势的一面，也都 有消极的一面，所以没有办法比较其好坏。因此气质无好坏之分。 故表述正确。","keywords":["气质","好坏","气质","好坏"],"trapType":"绝对化表述型","judgment":"正确"},{"type":"材料分析","exam":"2023下","stem":"结合案例分析学生性格形成的影响因素。 如果你是老师，对林强的性格培养有何建议?四、材料分析题","answer":"(1)影响性格形成的因素包括遗传因素、家庭因素、学校教育、社会文化因素、 个人主观因素等。材料中，影响林强性格形成的因素主要是家庭因素。在家庭因素中，最主要的影响因素是家庭教养方式。家庭教养方式一般有三种， 即权威型、放纵型和民主型。不同的教养方式会对孩子的社会性发展和个性形成产生 重大的影响。其中，在权威型教养方式下，父母要求儿童绝对地服从自己，希望儿童 按照他们为其设计的发展蓝图去成长，对儿童的所有行为都加以保护监督。这类父母 常以冷漠、忽视的态度对待儿童，很少考虑儿童自身的要求与意愿，对儿童违反规则 的行为表示愤怒，甚至采取严厉的惩罚措施。这种教养方式下的儿童常常表现出焦虑、 退缩和不快乐，在与同伴交往中，遇到挫折时易产生敌对反应。材料中，林强的父母对林强严加管教，不允许他出现任何差错，是权威型的教养 方式。在这种权威型的父母面前，林强变得谨小慎微，做事犹豫不决，正体现了家庭 教养方式对性格的影响。(2)如果我是老师，我会对林强的性格培养提出以下建议：①引导林强父母采取正确的教养方式。我会建议林强父母采取民主型的教养方式， 给孩子无条件的关注和爱，积极地创造适合孩子发展的环境，尊重孩子的思想、观念， 让孩子多参加家庭决策，培养其独立自主、自信的性格。②加强人生观、世界观和价值观的教育。我会利用各种形式开展教育，使林强形成正确的人生观、世界观和价值观，树立正确的人生目标。③及时强化林强的积极行为。我会通过学校日常教学活动的合理组织，使学生形 成勤奋、认真、守纪律等良好的性格品质。除此之外，我还会组织各种课外、校外活 动，开阔学生的眼界，丰富学生的社会经验，增加学生的锻炼机会。在各项活动中， 我会积极关注林强的行为表现，对其良好的行为及时进行表扬、鼓励。④充分利用榜样人物的示范作用。我会向林强介绍古今中外的优秀人物，引导林 强向这些优秀人物学习。我也会遵循“身教重于言教”的教育原则，不断地完善自己 的性格，提高自身的人格魅力，成为林强性格发展中能够直接模仿的榜样。⑤利用集体教育的力量。我会培养良好的班集体。生活在这样的集体中，可以使 林强的性格得到良性的发展。⑥依据性格倾向因材施教。学生性格的发展受他们已有的个性特点的影响。我会 针对林强的个性特点，因材施教。⑦提高林强的自我教育能力。自我教育是形成和培养学生积极性格的重要条件。 因此，我会鼓励林强并具体指导林强进行性格的自我认识、自我控制、自我锻炼和自 我修养。","keywords":["我也会遵循“身教重于言教”的教育原则","因材施教原则","性格形成影响因素","班集体建设","人格-性格形成因素","人格-自我意识发展","身心发展-影响人发展因素","身心发展-青春期心理","身心发展-个体差异"],"materialType":["家校案例"],"coreConcepts":["因材施教原则","性格形成影响因素","班集体建设"]},{"type":"材料分析","exam":"2024上","stem":"试用马克思主义关于影响人的发展因素理论，分析案例中教育专家的观点。","answer":"材料中，该教育专家的观点属于遗传决定论，是有偏颇的，错误的。马克思主义关于影响人的发展因素理论认为，人的发展是个体的内在因素(如先 天遗传的素质、主观能动性等)与外部环境(如外在刺激的强度、社会的发展水平、 个体的文化背景等)在个体活动中相互作用的结果。因此，遗传、环境、学校教育和 个体的主观能动性均在人的身心发展中起着重要作用。遗传是指人从上代继承下来的生理解剖上的特点，如机体的结构、形态、感官和 神经系统等的特点。遗传素质是人的发展的生理前提，为人的发展提供了可能性。环境泛指个体生活中影响个体身心发展的一切外部因素，包括自然环境和社会环 境。环境为个体的发展提供了多种可能，环境使遗传提供的发展可能性变成现实。学校教育在人的发展中起主导作用。个体的主观能动性是指人的主观意识对客观世界的反映和能动作用。主观能动性 是推动人身心发展的内在动力，是促进个体发展的决定性因素。材料中，教育专家认为，学校中孩子学习成绩的好坏，与他们身体的内分泌水平 有关，而与家长、教师的努力无关。这种观点是错误的，属于遗传决定论，只关注了 遗传素质对人发展的影响，而忽视了教育、环境以及个体主观能动性对个体身心发展 的影响。","keywords":["马克思主义关于影响人的发展因素理论","影响人发展因素理论","人格-性格形成因素","身心发展-影响人发展因素"],"materialType":["学生心理案例","学生行为案例","家校案例"],"coreConcepts":["影响人发展因素理论"]}]},{"id":"8.7","module":8,"moduleName":"中学班级管理与教师心理","content":"教师角色心理和教师心理特征","level":"了解","keywords":["教师角色","教师心理"],"appearances":{"简答":["2022上"],"辨析":["2024下"],"材料分析":[]},"totalAppearances":2,"typeCount":2,"predictions":{"typeProbabilities":{"简答":0.428,"辨析":0.374,"材料分析":0.198},"mostLikelyType":"简答","confidence":43,"threatLevel":"高","typeCount":2,"modelScores":{"historical":{"简答":0.5,"辨析":0.5,"材料分析":0},"content":{"简答":0.25,"辨析":0.5,"材料分析":0.25},"syllabus":{"简答":0.2,"辨析":0.4,"材料分析":0.4},"moduleCooccur":{"简答":0.6666666666666666,"辨析":0.25,"材料分析":0.08333333333333333},"gapRegression":{"简答":0.43846153846153846,"辨析":0.18846153846153846,"材料分析":0.35}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2022上","stem":"简述教师自我促进心理健康的有效方法。三、简答题","answer":"(1)教师要认识自我，加强个性修养。一个理智的教师要尽量做到有自知之明， 从而在教育教学中，扬长避短，长善救失。(2)教师要树立正确的职业观念。教师要学会正确看待自己的工作，培养乐观的 人生态度；要正确认识到教师工作的复杂性，也要树立信心。(3)善于调节心理状态，增强教师角色适应能力。教师要正确认识自己，结合自 身实际，对工作做出合理期望，勇于接纳自己。(4)学校要给予教师帮助。(5)社会要给予教师支持。","keywords":["教师要认识自我","教师要树立正确的职业观念","善于调节心理状态","学校要给予教师帮助","社会要给予教师支持"],"mnemonic":"","points":["教师要认识自我，加强个性修养。一个理智的教师要尽量做到有自知之明， 从而在教育教学中，扬长避短，长善救失。","教师要树立正确的职业观念。教师要学会正确看待自己的工作，培养乐观的 人生态度；要正确认识到教师工作的复杂性，也要树立信心。","善于调节心理状态，增强教师角色适应能力。教师要正确认识自己，结合自 身实际，对工作做出合理期望，勇于接纳自己。","学校要给予教师帮助。","社会要给予教师支持。"]},{"type":"辨析","exam":"2024下","stem":"杨老师在日常班级管理中发现，中学生非常在意自己的性别角色和形象。因 此她认为，青少年的自我同一性发展就是获得自我性别角色的认同。请对杨老师的观 点进行辨析。 .","answer":"杨老师的观点错误。 埃里克森的社会性发展阶段理论认为，人格的发展贯穿于个体的一生，整个发展 过程可以划分为八个阶段。其中，青年期(12～18岁)面临的主要冲突是同一性对 角色混乱。这一时期的青少年更多地考虑“我是谁”的问题，体验着角色同一与角色 混乱的冲突。个体如果把自己各个方面，比如信念、性格、性别角色、未来的职业选 择等很好地整合起来，便会获得较好的角色同一性；反之，则会出现角色混乱。发展 顺利者表现为在职业、性别角色等方面获得同一性，方向明确。因此，青少年的自我 同一性发展并不仅仅就是获得自我性别角色的认同。 故杨老师的观点错误。 三、简答题","keywords":["教师角色","知识传授","教师角色","知识传授"],"trapType":"以偏概全型","judgment":"错误"}]},{"id":"6.1","module":6,"moduleName":"中学生心理辅导","content":"心理健康的标准；中学生常见的心理健康问题（抑郁症、恐怖症、焦虑症、强迫症、网络成瘾等）","level":"了解/熟悉","keywords":["心理健康","抑郁症","恐怖症","焦虑症","强迫症","网络成瘾"],"appearances":{"简答":["2025上"],"辨析":["2019下"],"材料分析":[]},"totalAppearances":2,"typeCount":2,"predictions":{"typeProbabilities":{"简答":0.305,"辨析":0.472,"材料分析":0.223},"mostLikelyType":"辨析","confidence":47,"threatLevel":"高","typeCount":2,"modelScores":{"historical":{"简答":0.5,"辨析":0.5,"材料分析":0},"content":{"简答":0.33333333333333337,"辨析":0.33333333333333337,"材料分析":0.33333333333333337},"syllabus":{"简答":0.25,"辨析":0.5,"材料分析":0.25},"moduleCooccur":{"简答":0.25,"辨析":0.5,"材料分析":0.25},"gapRegression":{"简答":0.13846153846153847,"辨析":0.5384615384615384,"材料分析":0.35}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2025上","stem":"《中小学心理健康教育指导纲要(2012年修订)》提出，学校应将心理健康教 育始终贯穿于教育教学全过程，多种途径开展心理健康教育，完成心理健康教育的基 本任务，实现学校心理健康教育的目标。请简述学校心理健康教育的基本任务。三、简答题","answer":"学校心理健康教育的基本任务有两个方面：(1)面向全体学生，开展预防性与发展性的心理健康教育，帮助学生在自我认识、 承受挫折、适应环境，以及学习、择业、交友等方面获得充分发展，以努力提高全体 学生心理素质和人格水平。这是学校心理健康教育的基础和工作重点。(2)对于少数有心理困扰或心理障碍的学生，给予有效的心理咨询和辅导。对于 极少数有严重心理疾病的学生，能够及时识别并转介到医学心理诊治部门。","keywords":["面向全体学生","对于少数有心理困"],"mnemonic":"","points":["面向全体学生，开展预防性与发展性的心理健康教育，帮助学生在自我认识、 承受挫折、适应环境，以及学习、择业、交友等方面获得充分发展，以努力提高全体 学生心理素质和人格水平。这是学校心理健康教育的基础和工作重点。","对于少数有心理困扰或心理障碍的学生，给予有效的心理咨询和辅导。对于 极少数有严重心理疾病的学生，能够及时识别并转介到医学心理诊治部门。"]},{"type":"辨析","exam":"2019下","stem":"心理健康的标准是相对的。","answer":"表述正确。 心理健康的标准是相对的。一个人心理是否健康与一个人是否有不健康的心理和 行为并非完全是一回事。判断一个人的心理健康状况，不能简单地根据一时一事下结 论。心理健康是较长一段时间内持续的心理状态，一个人偶尔出现一些不健康的心理 和行为，并非意味着这个人就是心理不健康(或心理变态),只能视具体情况而定。 因此，心理健康的标准是相对的。 故表述正确。","keywords":["心理健康标准","相对性","心理健康标准","相对性"],"trapType":"以偏概全型","judgment":"正确"}]},{"id":"8.3","module":8,"moduleName":"中学班级管理与教师心理","content":"课堂纪律的类型；课堂结构；课堂问题行为的性质、类型、原因及处置与矫正方法","level":"了解/掌握","keywords":["课堂纪律","课堂结构","课堂问题行为"],"appearances":{"简答":["2025下"],"辨析":["2025下"],"材料分析":[]},"totalAppearances":2,"typeCount":2,"predictions":{"typeProbabilities":{"简答":0.451,"辨析":0.307,"材料分析":0.242},"mostLikelyType":"简答","confidence":45,"threatLevel":"高","typeCount":2,"modelScores":{"historical":{"简答":0.5,"辨析":0.5,"材料分析":0},"content":{"简答":0.39999999999999997,"辨析":0.19999999999999998,"材料分析":0.39999999999999997},"syllabus":{"简答":0.35,"辨析":0.3,"材料分析":0.35},"moduleCooccur":{"简答":0.6666666666666666,"辨析":0.25,"材料分析":0.08333333333333333},"gapRegression":{"简答":0.08846153846153847,"辨析":0.08846153846153847,"材料分析":0.35}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2025下","stem":"金老师在新教师入职培训上，聆听了多位经验丰富的老师的成长经验，认识 到有多种途径可以提升自己的学科能力和学科素养，实现专业水平的发展。请简述教 师专业成长与发展的途径。三、简答题","answer":"版本一：(1)观摩和分析优秀教师的教学活动。观摩和分析优秀教师的教学活动有利于提 高新手型教师的教学能力和水平；有利于帮助新手型教师掌握专业知识和获得教学管 理的能力，并能够充分调动学生的学习积极性。(2)开展微格教学。微格教学指以少数的学生为对象，在较短的时间内(5～20 分钟),尝试做小型的课堂教学，可以把这种教学过程摄制成录像，课后再进行分析。(3)进行专门训练。要想促进新教师的成长，也可以对他们进行专门化训练。(4)反思教学经验。反思教学经验又称反思性实践或反思性教学，是指教师以自 己的教学活动为意识对象，对自己的教育理念、教学行为、决策以及由此所产生的结 果进行认真的自我审视、评价、反馈、控制、调节、分析的过程。版本二：(1)职前培训。职前培训是教师从事专业工作重要的基础阶段，是人职前的准备阶段。(2)入职培训。人职培训是经历过教师职前培训的人，在刚获得的教职岗位上进 一步了解、学习和掌握岗位知识和能力的培训。(3)在职培训。在职教育被认为是教师专业发展最为关键的环节。(4)自我教育。教师的自我教育是教师个体专业化发展最直接、最普遍的途径。","keywords":["观摩和分析优秀教师的教学活动","开展微格教学","进行专门训练","反思教学经验","职前培训","入职培训","在职培训","自我教育"],"mnemonic":"","points":["观摩和分析优秀教师的教学活动。观摩和分析优秀教师的教学活动有利于提 高新手型教师的教学能力和水平；有利于帮助新手型教师掌握专业知识和获得教学管 理的能力，并能够充分调动学生的学习积极性。","开展微格教学。微格教学指以少数的学生为对象，在较短的时间内(5～20 分钟),尝试做小型的课堂教学，可以把这种教学过程摄制成录像，课后再进行分析。","进行专门训练。要想促进新教师的成长，也可以对他们进行专门化训练。","反思教学经验。反思教学经验又称反思性实践或反思性教学，是指教师以自 己的教学活动为意识对象，对自己的教育理念、教学行为、决策以及由此所产生的结 果进行认真的自我审视、评价、反馈、控制、调节、分析的过程。版本二：","职前培训。职前培训是教师从事专业工作重要的基础阶段，是人职前的准备阶段。","入职培训。人职培训是经历过教师职前培训的人，在刚获得的教职岗位上进 一步了解、学习和掌握岗位知识和能力的培训。","在职培训。在职教育被认为是教师专业发展最为关键的环节。","自我教育。教师的自我教育是教师个体专业化发展最直接、最普遍的途径。"]},{"type":"辨析","exam":"2025下","stem":"黄老师发现学生在反复练习同类题目后会形成对这类题目的解题定势，不能 举一反三解答其他类型的题目。因此，他认为定势对知识迁移只存在阻碍作用。请对 黄老师的观点进行辨析。","answer":"黄老师的观点错误。 定势是影响知识迁移的因素之一，它是指重复先前的操作所引起的一种心理准备 状态。定势对知识迁移的影响表现为两种：促进和阻碍。在环境不变的条件下，定势 使人能够应用已掌握的方法迅速进行知识迁移，这时定势对知识迁移产生促进作用； 而在情境发生变化时，它则会妨碍人采用新的方法，此时定势对知识迁移产生阻碍作 用。因此，定势对知识迁移既有促进作用，也有阻碍作用。 故黄老师的观点错误。 AA 而","keywords":["课堂纪律","自由","民主管理","课堂纪律","自由","民主管理"],"trapType":"关系误判型","judgment":"错误"}]},{"id":"6.2","module":6,"moduleName":"中学生心理辅导","content":"心理辅导的主要方法（强化法、系统脱敏法、认知疗法、来访者中心疗法、理性-情绪疗法）","level":"理解","keywords":["心理辅导方法","强化法","系统脱敏法","认知疗法","来访者中心疗法","理性情绪疗法"],"appearances":{"简答":[],"辨析":["2023上"],"材料分析":["2026上"]},"totalAppearances":2,"typeCount":2,"predictions":{"typeProbabilities":{"简答":0.167,"辨析":0.495,"材料分析":0.339},"mostLikelyType":"辨析","confidence":50,"threatLevel":"高","typeCount":2,"modelScores":{"historical":{"简答":0,"辨析":0.5,"材料分析":0.5},"content":{"简答":0,"辨析":0.5,"材料分析":0.5},"syllabus":{"简答":0.25,"辨析":0.5,"材料分析":0.25},"moduleCooccur":{"简答":0.25,"辨析":0.5,"材料分析":0.25},"gapRegression":{"简答":0.35,"辨析":0.3384615384615385,"材料分析":0.038461538461538464}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"辨析","exam":"2023上","stem":"动物与人的学习存在本质区别。","answer":"表述正确。 狭义的学习指人类的学习。人类的学习无论在内容上、方式上，还是性质上，都 与其他动物有本质的区别。①从内容上看，动物的学习仅仅是掌握个体经验，而人类 的学习不仅是掌握个体经验，更重要的是以个体的形式掌握社会经验。②从方式上看、 动物的学习主要是一个自发的过程，而人类的学习是在社会的传递下以语言为中介实 现的。③从性质上看，动物的学习是消极被动地适应环境，而人类的学习是自觉的、 有目的的、积极主动的过程。 故表述正确。","keywords":["心理辅导","心理疾病","心理辅导","心理疾病"],"trapType":"关系误判型","judgment":"正确"},{"type":"材料分析","exam":"2026上","stem":"根据心理健康相关知识，分析材料中徐涛的心理问题及成因。 针对徐涛出现的心理问题，给出合理的心理辅导建议。四、材料分析题","answer":"(1)徐涛的心理问题属于考试焦虑。焦虑症是个体不能达成目标或不能克服困难的威胁，致使自尊心、自信心受挫，或使失败感和内疚感增加，形成一种紧张不安、 带有恐惧的情绪状态。中学生最常见的焦虑反应是考试焦虑。其表现是：随着考试临 近，心情极度紧张；考试时不能集中注意力，知觉范围变窄，思维刻板，出现慌乱， 无法发挥正常水平；考试后又持久地不能松弛下来。材料中，徐涛在每次考试前好几 天就开始紧张不安，总担心自己考不好；考试时会感到呼吸急促、心慌、手发抖、出 汗，注意力难以集中，有时候脑子里一片空白，这些都是考试焦虑的表现。考试焦虑的成因：①学校的统考，升学持久的、过度的压力；②家长对子女期望 过高；③学生个人过分地争强好胜；④学业上多次遭受失败；⑤个体自身具有容易引 发焦虑反应的人格特质等。(2)针对徐涛的心理问题，可以采用以下心理辅导方法进行矫正：①肌肉放松训练法。通过改变肌肉紧张状态，减轻肌肉紧张引起的酸痛，从而应 对情绪上的紧张、不安、焦虑和烦躁。当徐涛感到呼吸急促、紧张不安时，可采用肌 肉放松训练法缓解。②系统脱敏法。当某些人对某事物、某环境产生敏感反应(害怕、焦虑、不安) 时，可以在当事人身上发展起一种不相容的反应，使其对本来可引起敏感反应的事物， 不再发生敏感反应。可通过建立焦虑等级表，逐个层级进行放松训练，最终消除徐涛 的考试焦虑问题。③合理情绪疗法。指导徐涛在考试中使用正向的自我对话，如“我能应对这个考 试”“成绩并不重要，学会才是重要的”“无论考试的结果如何，都不会是最后一次”。 这对于缓解徐涛的考试焦虑，会有较好的效果。④强化法。每当学生出现所期望的心理与目标行为时，或者在一种符合要求的良 好行为出现之后，采取奖励办法立刻强化，以增加此种行为出现的频率。当徐涛成绩 提高时，教师应给予及时强化。","keywords":["可以采用以下心理辅导方法","考试焦虑","系统脱敏法","合理情绪疗法","肌肉放松训练","心理问题-考试焦虑","辅导方法-肌肉放松训练","辅导方法-系统脱敏法","辅导方法-合理情绪疗法","辅导方法-强化法"],"materialType":["学生心理案例","家校案例"],"coreConcepts":["考试焦虑","系统脱敏法","合理情绪疗法","肌肉放松训练"]}]},{"id":"8.4","module":8,"moduleName":"中学班级管理与教师心理","content":"班主任工作的内容和方法；培养班集体的方法","level":"了解/掌握","keywords":["班主任","班集体培养"],"appearances":{"简答":["2020下","2021上","2024下","2026上"],"辨析":[],"材料分析":[]},"totalAppearances":4,"typeCount":1,"predictions":{"typeProbabilities":{"简答":0.584,"辨析":0.273,"材料分析":0.143},"mostLikelyType":"简答","confidence":58,"threatLevel":"中","typeCount":1,"modelScores":{"historical":{"简答":1,"辨析":0,"材料分析":0},"content":{"简答":0.5,"辨析":0.5,"材料分析":0},"syllabus":{"简答":0.35,"辨析":0.3,"材料分析":0.35},"moduleCooccur":{"简答":0.6666666666666666,"辨析":0.25,"材料分析":0.08333333333333333},"gapRegression":{"简答":0.15384615384615385,"辨析":0.35,"材料分析":0.35}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2020下","stem":"班主任工作的基本内容有哪些?","answer":"班主任工作的基本内容主要包括常规工作和个别教育工作两个方面。(1)常规工作。①了解和研究学生(班主任工作的前提和基础)。②组织和培养班集体(班主任工作的中心环节)。③建立学生成长档案。④组织班会和课外活动。⑤协调各种教育影响。⑥操行评定。⑦写好班主任工作计划与总结。(2)个别教育工作。个别教育工作包括优等生的个别教育、中等生的个别教育和后进生的个别教育。","keywords":["常规工作","个别教育工作"],"mnemonic":"","points":["常规工作。①了解和研究学生(班主任工作的前提和基础)。②组织和培养班集体(班主任工作的中心环节)。③建立学生成长档案。④组织班会和课外活动。⑤协调各种教育影响。⑥操行评定。⑦写好班主任工作计划与总结。","个别教育工作。个别教育工作包括优等生的个别教育、中等生的个别教育和后进生的个别教育。"]},{"type":"简答","exam":"2021上","stem":"简述班主任培养班集体的方法。","answer":"(1)确定班集体的发展目标。(2)建立得力的班集体核心。(3)建立班集体的正常秩序。(4)组织形式多样的教育活动。(5)培养正确的集体舆论与良好的班风。","keywords":["确定班集体的发展目标","建立得力的班集体核心","建立班集体的正常秩序","组织形式多样的教育活动","培养正确的集体舆论与良好的班风"],"mnemonic":"目标核心秩序活动舆论 — 发展目标、班委核心、正常秩序、教育活动、正确舆论","points":["确定班集体的发展目标。","建立得力的班集体核心。","建立班集体的正常秩序。","组织形式多样的教育活动。","培养正确的集体舆论与良好的班风。"]},{"type":"简答","exam":"2024下","stem":"张老师是某中学的一名新任班主任，不熟悉班级管理工作，班级管理效果一 团糟。对此，学校德育主任告诉他，班级管理是有规律的，要遵循一定的原则。请简 述班级管理的原则。","answer":"班级管理的原则包括：(1)方向性原则。(2)全面管理原则。(3)自主参与原则。(4)教管结合原则。(5)全员激励原则。(6)平行管理原则。(7)情通理达原则。(8)协同管理原则。","keywords":["方向性原则","全面管理原则","自主参与原则","教管结合原则","全员激励原则","平行管理原则","情通理达原则","协同管理原则"],"mnemonic":"","points":["方向性原则。","全面管理原则。","自主参与原则。","教管结合原则。","全员激励原则。","平行管理原则。","情通理达原则。","协同管理原则。"]},{"type":"简答","exam":"2026上","stem":"班主任是保障教育教学秩序、提高教育教学质量的中坚力量。简述中学班主 任的角色。","answer":"版本一：(1)学生思想道德的教育者。(2)学生日常生活的管理者。(3)学生健康成长的引导者。(4)学校文化的建设者。版本二：(1)学生健康成长的守护者。(2)班集体的组织者和领导者。(3)学校教育计划的贯彻者。(4)班级人际关系的协调者。(5)学校、家庭和社会的沟通者。(6)中小学生人生导师。","keywords":["学生思想道德的教育者","学生日常生活的管理者","学生健康成长的引导者","学校文化的建设者","学生健康成长的守护者","班集体的组织者和领导者","学校教育计划的贯彻者","班级人际关系的协调者","学校、家庭和社会的沟通者","中小学生人生导师"],"mnemonic":"","points":["学生思想道德的教育者。","学生日常生活的管理者。","学生健康成长的引导者。","学校文化的建设者。版本二：","学生健康成长的守护者。","班集体的组织者和领导者。","学校教育计划的贯彻者。","班级人际关系的协调者。","学校、家庭和社会的沟通者。","中小学生人生导师。"]}]},{"id":"2.2","module":2,"moduleName":"中学课程","content":"基本的课程类型及其特征（分科/综合/活动课程；必修/选修课程；国家/地方/校本课程；显性/隐性课程）","level":"掌握","keywords":["课程类型","分科课程","综合课程","必修课程","选修课程"],"appearances":{"简答":["2022下","2023上","2023下","2025上"],"辨析":[],"材料分析":[]},"totalAppearances":4,"typeCount":1,"predictions":{"typeProbabilities":{"简答":0.758,"辨析":0.134,"材料分析":0.109},"mostLikelyType":"简答","confidence":76,"threatLevel":"中","typeCount":1,"modelScores":{"historical":{"简答":1,"辨析":0,"材料分析":0},"content":{"简答":1,"辨析":0,"材料分析":0},"syllabus":{"简答":0.5,"辨析":0.25,"材料分析":0.25},"moduleCooccur":{"简答":0.875,"辨析":0.125,"材料分析":0},"gapRegression":{"简答":0.25384615384615383,"辨析":0.35,"材料分析":0.35}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2022下","stem":"简述学科课程的特点。","answer":"学科课程即从学科知识整体中选取关联密切的内容组成一门学科，具有如下特点：(1)逻辑性：按照学科固有的逻辑组织知识。(2)系统性：有助于学生掌握系统的文化知识。(3)简约性：保证学生在有效时间内高效率地获取知识。","keywords":["逻辑性","系统性","简约性"],"mnemonic":"逻辑系统简约 — 逻辑性、系统性、简约性","points":["逻辑性：按照学科固有的逻辑组织知识。","系统性：有助于学生掌握系统的文化知识。","简约性：保证学生在有效时间内高效率地获取知识。"]},{"type":"简答","exam":"2023上","stem":"简述校本课程开发的基本特点。","answer":"(1)针对性：校本课程要针对地方和学校的实际，同时要满足学生的兴趣和需要。(2)过程性：首先，校本课程不仅是一个静态的课程类型，还是一个促进教师成 长、学生个性培养的过程；其次，校本课程是基于教师不断实践反思基础上的不断完 善的过程。另外，校本课程注重对学生进行过程性评价。(3)民主性：校本课程的开发与决策遵循着民主开放的原则。(4)多元性：表现在开发主体的多元化，如教师、学生、家长以及社会人士都可 以参与其中。","keywords":["针对性","过程性","民主性","多元性"],"mnemonic":"","points":["针对性：校本课程要针对地方和学校的实际，同时要满足学生的兴趣和需要。","过程性：首先，校本课程不仅是一个静态的课程类型，还是一个促进教师成 长、学生个性培养的过程；其次，校本课程是基于教师不断实践反思基础上的不断完 善的过程。另外，校本课程注重对学生进行过程性评价。","民主性：校本课程的开发与决策遵循着民主开放的原则。","多元性：表现在开发主体的多元化，如教师、学生、家长以及社会人士都可 以参与其中。"]},{"type":"简答","exam":"2023下","stem":"简述综合实践活动课程的特点。","answer":"","keywords":["整体性","实践性","开放性","生成性","自主性"],"mnemonic":"","points":["整体性(综合性)：对任何主题的探究都必须体现个人、社会、自然的内在整合，体现科学、艺术、道德的内在整合。","实践性：强调学生的亲身经历，要求学生积极参与到各项活动中去。","开放性：课程目标具有开放性，课程内容具有开放性，评价标准具有多元性。","生成性：随着活动的不断展开，新的目标不断生成，新的主题不断生成，认识和体验不断加深，创造性的火花不断迸发。","自主性：学生自己选择学习的目标、内容、方式及指导教师，自己决定活动结果呈现的形式。"]},{"type":"简答","exam":"2025上","stem":"课程是学校教育系统的核心要素，是社会主导的教育价值观念在学校教育中 的具体表现和集中反映，可以说没有课程就没有学校教育。请简述课程在学校教育中 的作用。","answer":"(1)课程是学校培养人才蓝图的具体表现。(2)课程是教师从事教育活动的基本依据。(3)课程是学生吸取知识的主要来源。(4)合理的课程设置对学生的全面发展起决定性作用。(5)课程是评估教学质量的主要依据和标准。","keywords":["课程","课程","课程","合理的课程设置对","课程"],"mnemonic":"","points":["课程是学校培养人才蓝图的具体表现。","课程是教师从事教育活动的基本依据。","课程是学生吸取知识的主要来源。","合理的课程设置对学生的全面发展起决定性作用。","课程是评估教学质量的主要依据和标准。"]}]},{"id":"5.5","module":5,"moduleName":"中学生发展心理","content":"人格的特征；人格的结构；根据学生的个体差异塑造良好人格","level":"理解/掌握","keywords":["人格特征","人格结构","个体差异"],"appearances":{"简答":["2022下","2023上"],"辨析":[],"材料分析":[]},"totalAppearances":2,"typeCount":1,"predictions":{"typeProbabilities":{"简答":0.635,"辨析":0.224,"材料分析":0.141},"mostLikelyType":"简答","confidence":64,"threatLevel":"中","typeCount":1,"modelScores":{"historical":{"简答":1,"辨析":0,"材料分析":0},"content":{"简答":1,"辨析":0,"材料分析":0},"syllabus":{"简答":0.25,"辨析":0.5,"材料分析":0.25},"moduleCooccur":{"简答":0.4117647058823529,"辨析":0.4117647058823529,"材料分析":0.17647058823529413},"gapRegression":{"简答":0.3769230769230769,"辨析":0.35,"材料分析":0.35}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"简答","exam":"2022下","stem":"简述人格的特征。三、简答题","answer":"(1)独特性。不同的遗传、生存及教育环境，形成了各自独特的心理特点。(2)稳定性。人格具有稳定性。在行为中偶然发生的、一时性的心理特性，不能 称为人格。(3)统合性。统合性又称整体性，人格是由多种成分构成的一个有机整体，具有 内在的一致性，受自我意识的调控。人格的统合性是心理健康的重要指标。当一个人 的人格结构各方面彼此和谐一致时，就会呈现出健康的人格特征；否则就会使人发生 心理冲突，产生各种生活适应困难，甚至出现“分裂人格”。(4)功能性。当一个人的人格具有功能性时，表现为健康而有力，支配着一个人 的生活与成败；而当人格功能失调时，就会出现软弱、无力、失控，甚至变态。(5)社会性。人格的社会性是指社会化把人这样的动物变成社会的成员。即使是 人的生物性需要和本能，也是受人的社会性制约的。(6)复杂性。人格表现绝非静水一潭，各种人格结构的组合千变万化，使人格的 表现千姿百态，表现出多元化、多层面的特征。","keywords":["独特性","稳定性","统合性","功能性","社会性","复杂性"],"mnemonic":"","points":["独特性。不同的遗传、生存及教育环境，形成了各自独特的心理特点。","稳定性。人格具有稳定性。在行为中偶然发生的、一时性的心理特性，不能 称为人格。","统合性。统合性又称整体性，人格是由多种成分构成的一个有机整体，具有 内在的一致性，受自我意识的调控。人格的统合性是心理健康的重要指标。当一个人 的人格结构各方面彼此和谐一致时，就会呈现出健康的人格特征；否则就会使人发生 心理冲突，产生各种生活适应困难，甚至出现“分裂人格”。","功能性。当一个人的人格具有功能性时，表现为健康而有力，支配着一个人 的生活与成败；而当人格功能失调时，就会出现软弱、无力、失控，甚至变态。","社会性。人格的社会性是指社会化把人这样的动物变成社会的成员。即使是 人的生物性需要和本能，也是受人的社会性制约的。","复杂性。人格表现绝非静水一潭，各种人格结构的组合千变万化，使人格的 表现千姿百态，表现出多元化、多层面的特征。"]},{"type":"简答","exam":"2023上","stem":"简述良好性格的培养途径。三、简答题","answer":"良好性格的培养途径如下：(1)加强人生观、世界观和价值观教育。(2)及时强化学生的积极行为。(3)充分利用榜样人物的示范作用。(4)利用集体的教育力量。(5)依据性格倾向因材施教。(6)提高学生的自我教育能力。","keywords":["加强人生观、世界观和价值观教育","及时强化学生的积极行为","充分利用榜样人物的示范作用","利用集体的教育力量","依据性格倾向因材施教","提高学生的自我教育能力"],"mnemonic":"","points":["加强人生观、世界观和价值观教育。","及时强化学生的积极行为。","充分利用榜样人物的示范作用。","利用集体的教育力量。","依据性格倾向因材施教。","提高学生的自我教育能力。"]}]},{"id":"4.2","module":4,"moduleName":"中学生学习心理","content":"注意的分类、品质及影响因素；记忆的分类、遗忘的规律和原因、应用记忆规律促进有效学习","level":"了解/掌握","keywords":["注意","记忆","遗忘","记忆规律"],"appearances":{"简答":[],"辨析":["2022上","2026上"],"材料分析":[]},"totalAppearances":2,"typeCount":1,"predictions":{"typeProbabilities":{"简答":0.202,"辨析":0.614,"材料分析":0.184},"mostLikelyType":"辨析","confidence":61,"threatLevel":"中","typeCount":1,"modelScores":{"historical":{"简答":0,"辨析":1,"材料分析":0},"content":{"简答":0,"辨析":1,"材料分析":0},"syllabus":{"简答":0.35,"辨析":0.3,"材料分析":0.35},"moduleCooccur":{"简答":0.35294117647058826,"辨析":0.38235294117647056,"材料分析":0.2647058823529412},"gapRegression":{"简答":0.35,"辨析":0.07692307692307693,"材料分析":0.35}},"weights":{"historical":0.25,"content":0.2,"syllabus":0.15,"moduleCooccur":0.2,"gapRegression":0.2}},"questions":[{"type":"辨析","exam":"2022上","stem":"动机强度与学习效果成正比。","answer":"表述错误。 心理学研究表明，动机强度与工作效率之间的关系并不是一种线性关系，而是倒 U形曲线关系。中等强度的动机最有利于任务的完成，即动机强度处于中等水平时， 工作效率最高。动机不足或过分强烈都会导致工作效率下降。此外，动机的最佳水平 还随任务性质的不同而不同：在学习较复杂的问题时，动机强度的最佳水平点会低些； 在学习任务比较简单时，动机强度的最佳水平点会高些。因此，动机强度与学习效果 不是正比关系。 故表述错误。","keywords":["动机","注意","学习效果","动机","注意","学习效果"],"trapType":"关系误判型","judgment":"错误"},{"type":"辨析","exam":"2026上","stem":"有意注意是主动对一定事物发起的注意，无意注意是事先没有目的的注意。周 老师认为学生的学习只需要有意注意，与无意注意无关。请对周老师的观点做出辨析。","answer":"周老师的观点错误。 根据有无目的和是否需要意志努力，注意可以分为无意注意、有意注意和有意后 注意三种。其中，无意注意也称不随意注意，是指没有预定目的，也不需要意志努力， 不由自主地对一定事物发生的注意。有意注意也称随意注意，是指自觉的、有预定目 的的、需要一定意志努力的注意。根据注意规律在教学中的应用，在教学中需要做到： ①正确运用无意注意的规律组织教学活动。②运用有意注意的规律组织教学，提高学 习的自觉性。③运用两种注意相互转换的规律组织教学，引导学生交替使用不同的注 意形式，保持学习活动。因此，学习既需要有意注意，也需要无意注意。 故周老师的观点错误。","keywords":["有意注意","无意注意","注意","有意注意","无意注意","注意"],"trapType":"以偏概全型","judgment":"错误"}]},{"id":"7.4","module":7,"moduleName":"中学德育","content":"德育过程的基本规律（知、情、意、行培养提高过程；组织活动和交往；思想内部矛盾运动；长期、反复、不断前进的过程）","level":"熟悉和运用","keywords":["德育过程","德育规律","知情意行","活动和交往","内部矛盾"],"appearances":{"简答":[],"辨析":["2023上","2023下"],"材料分析":[]},"totalAppearances":2,"typeCou function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector('.tab-btn[onclick*="'+name+'"]').classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

function escapeHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderOverview() {
  const wp = DATA.wholePaper;
  if (!wp || !wp.prediction) { document.getElementById('overviewContent').innerHTML = '<p style="color:var(--text2)">整卷预测数据加载中...</p>'; return; }
  const p = wp.prediction;
  const names = DATA.moduleNames || {};

  let html = '<h3>📋 模拟整卷 — 2026年下半年预测</h3>';
  html += '<p style="color:var(--text2);font-size:0.82rem;margin-bottom:12px">4辨析(22-25) + 4简答(26-29) + 2材料分析(30-31) = 10题主观题，基于3个独立预测工具 + 整卷多样性约束</p>';

  // 整卷表格
  html += '<table class="wp-table"><thead><tr><th>题位</th><th>题型</th><th>预测模块</th><th>可能性</th><th>重点关注</th></tr></thead><tbody>';

  const typeLabels = { '辨析': 'Q22-Q25', '简答': 'Q26-Q29', '材料分析': 'Q30-Q31' };
  let idx = 0;
  for (const [type, questions] of Object.entries(p.questions || {})) {
    for (const q of questions) {
      idx++;
      const likeBadge = q.likelihood === '高' ? '<span class="badge badge-extreme">高</span>' :
                        q.likelihood === '中' ? '<span class="badge badge-high">中</span>' :
                        '<span class="badge badge-mid">低</span>';
      const focus = (q.recommendedFocus || []).slice(0,2).join('；') || '-';
      html += '<tr><td>'+(typeLabels[type]||type)+'</td><td>'+type+'</td><td><span class="wp-module">M'+q.module+' '+(names[String(q.module)]||'')+'</span></td><td>'+likeBadge+'</td><td style="font-size:0.78rem">'+escapeHtml(focus)+'</td></tr>';
    }
  }
  html += '</tbody></table>';

  // 覆盖率
  html += '<p style="margin-top:8px;font-size:0.82rem;color:var(--text2)">📊 覆盖 <b>'+p.coveredCount+'/8</b> 个模块 · 多样性得分 <b>'+(p.diversity*100).toFixed(0)+'%</b></p>';

  // 回溯验证详情
  if (DATA.methodology && DATA.methodology.backtest && DATA.methodology.backtest.details) {
    html += '<h3 style="margin-top:20px">📐 回溯验证详情</h3>';
    html += '<table><thead><tr><th>预测考试</th><th>Top-1命中率</th><th>Top-2命中率</th><th>样本数</th></tr></thead><tbody>';
    for (const d of DATA.methodology.backtest.details) {
      html += '<tr><td>'+d.exam+'</td><td>'+d.top1Rate+'</td><td>'+d.top2Rate+'</td><td>'+d.total+'</td></tr>';
    }
    html += '</tbody></table>';
  }

  // 5模型说明
  html += '<h3 style="margin-top:20px">🧠 5模型集成预测方法</h3>';
  html += '<table><thead><tr><th>模型</th><th>权重</th><th>逻辑</th></tr></thead><tbody>';
  for (const m of (DATA.methodology&&DATA.methodology.models||[])) {
    html += '<tr><td>'+m.name+'</td><td>'+(m.weight*100).toFixed(0)+'%</td><td style="font-size:0.78rem">'+escapeHtml(m.desc||'')+'</td></tr>';
  }
  html += '</tbody></table>';

  document.getElementById('overviewContent').innerHTML = html;
}

let mustFilter = 'all';
function renderMustMemorize() {
  const items = DATA.mustMemorize || [];
  const filterHtml = '<button class="filter-btn active" onclick="filterMust(\'all\',this)">全部('+items.length+')</button>' +
    '<button class="filter-btn" onclick="filterMust(\'极高\',this)">🔥 极高威胁</button>' +
    '<button class="filter-btn" onclick="filterMust(\'高\',this)">⚠️ 高威胁</button>' +
    '<button class="filter-btn" onclick="filterMust(\'简答\',this)">最可能简答</button>' +
    '<button class="filter-btn" onclick="filterMust(\'辨析\',this)">最可能辨析</button>' +
    '<button class="filter-btn" onclick="filterMust(\'材料分析\',this)">最可能材料分析</button>';
  document.getElementById('mustFilter').innerHTML = filterHtml;
  renderMustList(items);
}

function filterMust(type, btn) {
  mustFilter = type;
  document.querySelectorAll('#mustFilter .filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const items = DATA.mustMemorize || [];
  const filtered = type === 'all' ? items :
    type === '极高' || type === '高' ? items.filter(k => k.threatLevel === type) :
    items.filter(k => k.mostLikelyType === type);
  renderMustList(filtered);
}

function renderMustList(items) {
  if (!items.length) { document.getElementById('mustContent').innerHTML = '<p style="color:var(--text2)">没有匹配的知识点</p>'; return; }

  let html = '';
  for (let i = 0; i < items.length; i++) {
    const k = items[i];
    const threatClass = k.threatLevel === '极高' ? 'threat-extreme' : k.threatLevel === '高' ? 'threat-high' : '';
    const threatBadge = k.threatLevel === '极高' ? '<span class="badge badge-extreme">极高威胁</span>' :
                        k.threatLevel === '高' ? '<span class="badge badge-high">高威胁</span>' : '';
    const typeBadge = '<span class="badge badge-type">最可能:' + k.mostLikelyType + ' (' + k.confidence + '%)</span>';

    // 概率条
    const probs = k.typeProbabilities || {};
    const pjd = (probs['简答']||0)*100, pbx = (probs['辨析']||0)*100, pcl = (probs['材料分析']||0)*100;

    html += '<div class="kp-card '+threatClass+'">';
    html += '<div class="kp-header"><div class="kp-title">'+(i+1)+'. '+escapeHtml(k.content.slice(0,80))+'</div><div class="kp-meta">'+threatBadge+typeBadge+'</div></div>';

    // 概率条
    html += '<div style="display:flex;gap:12px;font-size:0.7rem;color:var(--text3);margin-bottom:4px">';
    html += '<span>简答 '+(pjd).toFixed(0)+'%</span><span>辨析 '+(pbx).toFixed(0)+'%</span><span>材料分析 '+(pcl).toFixed(0)+'%</span></div>';
    html += '<div class="prob-bar"><div class="pb-jd" style="width:'+pjd+'%"></div><div class="pb-bx" style="width:'+pbx+'%"></div><div class="pb-cl" style="width:'+pcl+'%"></div></div>';

    // 三种题型内容
    html += '<div class="type-tabs">';
    html += '<button class="type-tab active" onclick="switchTypeTab(this,\'jd\','+i+')">📝 简答版</button>';
    html += '<button class="type-tab" onclick="switchTypeTab(this,\'bx\','+i+')">🔍 辨析版</button>';
    html += '<button class="type-tab" onclick="switchTypeTab(this,\'cl\','+i+')">📋 材料分析版</button>';
    html += '</div>';

    // 简答版
    const sq = k.sampleQuestions || {};
    html += '<div class="type-content active" id="content-jd-'+i+'">';
    if (sq['简答'] && sq['简答'].length > 0) {
      for (const q of sq['简答']) {
        html += '<div style="margin-bottom:8px"><span style="color:var(--text3);font-size:0.72rem">'+q.exam+'</span><br><b>'+escapeHtml(q.stem.slice(0,120))+'</b>';
        if (q.mnemonic) html += '<br><span style="color:var(--yellow);font-size:0.78rem">💡 口诀: '+escapeHtml(q.mnemonic)+'</span>';
        html += '</div>';
      }
    } else { html += '<p style="color:var(--text3);font-size:0.8rem">该知识点尚未以简答题形式出现过。</p>'; }
    html += '</div>';

    // 辨析版
    html += '<div class="type-content" id="content-bx-'+i+'">';
    if (sq['辨析'] && sq['辨析'].length > 0) {
      for (const q of sq['辨析']) {
        html += '<div style="margin-bottom:8px"><span style="color:var(--text3);font-size:0.72rem">'+q.exam+'</span><br><b>'+escapeHtml(q.stem.slice(0,120))+'</b>';
        html += '<br><span style="color:'+(q.judgment==='正确'?'var(--green)':'var(--red)')+';font-size:0.78rem">判断: '+escapeHtml(q.judgment||'')+'</span>';
        if (q.trapType) html += ' · <span style="color:var(--purple);font-size:0.75rem">陷阱: '+escapeHtml(q.trapType)+'</span>';
        html += '</div>';
      }
    } else { html += '<p style="color:var(--text3);font-size:0.8rem">该知识点尚未以辨析题形式出现过。</p>'; }
    html += '</div>';

    // 材料分析版
    html += '<div class="type-content" id="content-cl-'+i+'">';
    if (sq['材料分析'] && sq['材料分析'].length > 0) {
      for (const q of sq['材料分析']) {
        html += '<div style="margin-bottom:8px"><span style="color:var(--text3);font-size:0.72rem">'+q.exam+'</span><br><b>'+escapeHtml((q.stem||'').slice(0,150))+'</b>';
        if (q.coreConcepts && q.coreConcepts.length) html += '<br><span style="color:var(--purple);font-size:0.75rem">核心概念: '+escapeHtml(q.coreConcepts.join('、'))+'</span>';
        html += '</div>';
      }
    } else { html += '<p style="color:var(--text3);font-size:0.8rem">该知识点尚未以材料分析题形式出现过。</p>'; }
    html += '</div>';

    html += '</div>'; // kp-card
  }

  document.getElementById('mustContent').innerHTML = html;
}

function switchTypeTab(btn, type, idx) {
  const card = btn.closest('.kp-card');
  card.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
  card.querySelectorAll('.type-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  const content = card.querySelector('#content-'+type+'-'+idx);
  if (content) content.classList.add('active');
}

// ============ TAB 3: 知识点地图 ============
function renderMap() {
  const modules = DATA.modules || {};
  const names = DATA.moduleNames || {};
  let html = '';

  for (let m = 1; m <= 8; m++) {
    const mod = modules[String(m)];
    if (!mod) continue;
    const stats = mod.stats || {};
    html += '<div class="module-card" onclick="toggleModule(this)">';
    html += '<div class="mod-name">M'+m+' '+escapeHtml(names[String(m)]||mod.name||'')+'</div>';
    html += '<div class="mod-stats">'+stats.total+' 个指标 · '+stats.totalApps+' 次出现 · '+(stats.crossType||0)+' 个跨题型</div>';
    html += '<div class="mod-detail">';
    for (const ind of (mod.indicators||[])) {
      const apps = ind.appearances || {};
      html += '<div class="indicator-item">';
      html += '<div class="ind-name">'+escapeHtml(ind.content.slice(0,80))+'</div>';
      html += '<div class="ind-types">';
      if (apps['简答'] && apps['简答'].length) html += '<span class="type-dot jd">简答 '+apps['简答'].length+'次</span>';
      if (apps['辨析'] && apps['辨析'].length) html += '<span class="type-dot bx">辨析 '+apps['辨析'].length+'次</span>';
      if (apps['材料分析'] && apps['材料分析'].length) html += '<span class="type-dot cl">材料分析 '+apps['材料分析'].length+'次</span>';
      html += '</div></div>';
    }
    html += '</div></div>';
  }
  document.getElementById('mapContent').innerHTML = html;
}

function toggleModule(card) {
  const detail = card.querySelector('.mod-detail');
  if (detail) detail.classList.toggle('show');
}

// ============ TAB 4: 考前速览 ============
function renderQuick() {
  const items = DATA.quickReview || [];
  if (!items.length) { document.getElementById('quickContent').innerHTML = '<p style="color:var(--text2)">暂无速览数据</p>'; return; }

  let html = '<p style="color:var(--text2);font-size:0.82rem;margin-bottom:12px">⚡ 考前最后一天复习用 · 只保留最高频15个知识点 · 精简到关键词+口诀</p>';

  for (let i = 0; i < items.length; i++) {
    const k = items[i];
    html += '<div class="quick-item">';
    html += '<b>'+(i+1)+'.</b> '+escapeHtml(k.content.slice(0,80));
    html += '<span class="q-mod"> · M'+k.module+' '+escapeHtml(k.moduleName||'')+' · 最可能: '+escapeHtml(k.mostLikelyType||'')+'</span>';
    if (k.keywords && k.keywords.length) {
      html += '<div style="margin-top:2px">';
      for (const kw of k.keywords.slice(0,5)) {
        html += '<span style="display:inline-block;padding:2px 8px;border-radius:8px;font-size:0.7rem;background:rgba(251,191,36,0.1);color:var(--yellow);margin:2px 3px;border:1px solid rgba(251,191,36,0.2)">'+escapeHtml(kw)+'</span>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  document.getElementById('quickContent').innerHTML = html;
}

// ============ TAB 5: 低频考点 ============
function renderLow() {
  const allKPs = DATA.allKPs || [];
  const lowKPs = allKPs.filter(k => k.predictions && (k.predictions.threatLevel === '低' || k.predictions.threatLevel === '中'));
  if (!lowKPs.length) { document.getElementById('lowContent').innerHTML = '<p style="color:var(--text2)">所有考点均在中威胁及以上</p>'; return; }

  let html = '<p style="color:var(--text2);font-size:0.82rem;margin-bottom:12px">📦 已考过但概率较低的知识点，精简化展示。备考时间有限时跳过此部分。</p>';
  html += '<table><thead><tr><th>考纲指标</th><th>模块</th><th>题型</th><th>威胁</th></tr></thead><tbody>';

  for (const k of lowKPs) {
    html += '<tr><td style="font-size:0.78rem">'+escapeHtml((k.content||'').slice(0,60))+'</td><td>M'+k.module+'</td>';
    html += '<td><span class="badge badge-type">'+escapeHtml(k.predictions.mostLikelyType||'')+'</span></td>';
    const tBadge = k.predictions.threatLevel === '中' ? '<span class="badge badge-mid">中</span>' : '<span class="badge" style="background:var(--text3);color:#fff">低</span>';
    html += '<td>'+tBadge+'</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('lowContent').innerHTML = html;
}

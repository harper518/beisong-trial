<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔒 需要验证</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%2338bdf8'/%3E%3C/svg%3E">
<style>

  :root { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#e2e8f0; --text2:#94a3b8; --accent:#38bdf8; --green:#4ade80; --radius:12px; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); max-width:800px; margin:0 auto; padding:24px 16px; line-height:1.6; }
  h1 { color:var(--accent); text-align:center; font-size:1.8rem; margin-bottom:4px; }
  .subtitle { text-align:center; color:var(--text2); font-size:0.9rem; margin-bottom:32px; }
  .group { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:20px; }
  .group h2 { font-size:1.15rem; color:var(--accent); margin:0 0 4px 0; border-bottom:1px solid var(--border); padding-bottom:10px; }
  .group .desc { color:var(--text2); font-size:0.82rem; margin-bottom:16px; }
  .link-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(51,65,85,0.3); flex-wrap:wrap; }
  .link-row:last-child { border-bottom:none; }
  .platform { font-size:0.75rem; padding:2px 10px; border-radius:12px; white-space:nowrap; font-weight:600; min-width:90px; text-align:center; }
  .platform.gh { background:#333; color:#fff; }
  .platform.cf { background:#f38020; color:#fff; }
.platform.gitee { background:#C71D23; color:#fff; }
  a { color:var(--accent); text-decoration:none; font-size:0.95rem; word-break:break-all; }
  a:hover { text-decoration:underline; }
  .note { font-size:0.78rem; color:var(--text2); margin-top:8px; }
  .footer { text-align:center; color:var(--text2); font-size:0.78rem; margin-top:32px; padding-top:16px; border-top:1px solid var(--border); }
  .footer a { color:var(--text2); }
  .badge { display:inline-block; font-size:0.7rem; padding:1px 8px; border-radius:10px; margin-left:8px; }
  .badge-main { background:var(--accent); color:#0f172a; }
  .badge-new { background:var(--green); color:#0f172a; }
  .navtop { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:0 0 16px; }
  .navtop a { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:8px 12px; border-radius:20px; border:1px solid var(--border); background:var(--card); color:var(--text2); text-decoration:none; font-size:0.82rem; font-weight:600; }
  .navtop a:hover { color:var(--accent); border-color:var(--accent); }
  .group { scroll-margin-top: 10px; }
  html { scroll-behavior: smooth; }
  @media (max-width:600px) {
    .link-row { flex-direction:column; align-items:flex-start; gap:4px; }
    a { font-size:0.85rem; }
  }

  #lockWrap { display:flex; justify-content:center; padding:48px 16px; }
  #lockCard { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px 24px; width:100%; max-width:340px; }
  #pwdInput { width:100%; box-sizing:border-box; padding:12px 14px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:1.25rem; text-align:center; letter-spacing:8px; min-height:48px; }
  #unlockBtn { width:100%; margin-top:14px; padding:13px; border:none; border-radius:10px; background:var(--accent); color:#0f172a; font-weight:700; font-size:1.05rem; cursor:pointer; min-height:48px; }
  #unlockBtn:disabled { opacity:0.5; cursor:default; }
  #pwdInput:disabled { opacity:0.5; }
  #lockMsg { text-align:center; color:#f87171; font-size:0.85rem; margin-top:12px; min-height:1.2em; }
</style>
</head>
<body>
<div id="lockWrap">
  <div id="lockCard">
    <div style="font-size:52px;text-align:center;line-height:1">🔒</div>
    <div style="text-align:center;font-weight:700;font-size:1.25rem;color:var(--text);margin-top:12px">私密页面</div>
    <div style="text-align:center;color:var(--text2);font-size:0.85rem;margin:6px 0 22px">请输入访问密码</div>
    <input id="pwdInput" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••">
    <button id="unlockBtn">解 锁</button>
    <div id="lockMsg"></div>
  </div>
</div>
<div id="content" style="display:none"></div>

      .then(function(k){ return crypto.subtle.exportKey('raw', k); })
      .then(function(kb){
        return decryptWithKeyBytes(kb).then(function(html){
          setLock({});
          try { sessionStorage.setItem(SS_KEY, bufToB64(kb)); } catch(e){}
          render(html);
        });
      })
      .catch(function(){
        var st2 = getLock();
        var f = (st2.fails || 0) + 1;
        BUSY = false;
        document.getElementById('unlockBtn').textContent = '解 锁';
        if (f >= 5) {
          setLock({fails:0, until: Date.now() + 60000});
          countdown();
        } else {
          setLock({fails:f});
          setDisabled(false);
          setMsg('❌ 密码错误，还可尝试 ' + (5 - f) + ' 次');
        }
      });
  }

  function checkUpdate(){
    var url = 'https://harper518.github.io/sama-quiz/links_version.json?t=' + Date.now();
    fetch(url).then(function(r){ return r.json(); }).then(function(data){
      if (data.v > EMBEDDED_VERSION) {
        var banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fbbf24;color:#0f172a;text-align:center;padding:10px 16px;z-index:9999;font-weight:600;font-size:0.9rem;cursor:pointer;';
        banner.textContent = '🔔 链接有更新！点击刷新页面查看最新 (' + data.msg + ')';
        banner.onclick = function(){ location.reload(true); };
        document.body.prepend(banner);
        document.body.style.paddingTop = '44px';
      }
    }).catch(function(){});
  }

  function init(){
    if (!window.crypto || !crypto.subtle) {
      setMsg('❌ 浏览器版本过低，无法解密（请升级浏览器）');
      return;
    }
    document.getElementById('unlockBtn').addEventListener('click', unlock);
    document.getElementById('pwdInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') unlock(); });
    var sk = null;
    try { sk = sessionStorage.getItem(SS_KEY); } catch(e){}
    if (sk) {
      decryptWithKeyBytes(b64ToBuf(sk)).then(render).catch(function(){
        try { sessionStorage.removeItem(SS_KEY); } catch(e){}
        countdown();
      });
    } else {
      countdown();
    }
  }
  init();
})();
</script>
</body>
</html>
